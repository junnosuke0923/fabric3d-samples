<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>作例帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Noto+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
:root{--bg:#F4F5F2;--paper:#FFFFFF;--ink:#1C1E23;--ink-2:#5C6169;--rule:#D8DBD4;
      --accent:#243F7A;--accent-ink:#FFFFFF;--pillar:#7A3B24;--surface:#243F7A;--code:#ECEEE9;
      --star:#B0821F;--shadow:0 1px 2px rgba(28,30,35,.06),0 6px 18px rgba(28,30,35,.07);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171B;--paper:#1D2026;--ink:#E7E8E3;--ink-2:#A2A7AE;--rule:#33373E;--accent:#93ABE3;--accent-ink:#0F172A;--pillar:#E0A48C;--surface:#93ABE3;--code:#262A31;--star:#E3C168;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{--bg:#15171B;--paper:#1D2026;--ink:#E7E8E3;--ink-2:#A2A7AE;--rule:#33373E;--accent:#93ABE3;--accent-ink:#0F172A;--pillar:#E0A48C;--surface:#93ABE3;--code:#262A31;--star:#E3C168;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.7;}
.chip{font-size:11.5px;letter-spacing:.08em;padding:2px 9px;border-radius:2px;color:var(--accent-ink);white-space:nowrap;}
.chip.pillar{background:var(--pillar);}
.chip.surface{background:var(--surface);}

/* ---- 上の帯 ---- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);
     padding:12px 26px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;}
.top h1{margin:0;font-family:"Shippori Mincho",serif;font-weight:600;font-size:21px;letter-spacing:.02em;}
.top .count{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;color:var(--ink-2);}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center;}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--paper);}
.seg button{font:inherit;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;
    border:0;background:transparent;color:var(--ink);padding:4px 11px;cursor:pointer;}
.seg button+button{border-left:1px solid var(--rule);}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
#q{font:inherit;font-size:13px;background:var(--paper);color:var(--ink);
   border:1px solid var(--rule);border-radius:3px;padding:4px 10px;width:200px;}
#q:focus{outline:none;border-color:var(--accent);}

/* ---- カードの並び ---- */
main{padding:20px 26px 70px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:18px;}
.card{display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer;
      background:var(--paper);border:1px solid var(--rule);border-radius:3px;overflow:hidden;
      color:inherit;font:inherit;transition:border-color .15s,box-shadow .15s,transform .15s;}
.card:hover,.card:focus-visible{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px);outline:none;}
.shot{position:relative;aspect-ratio:4/3;background:var(--code);overflow:hidden;}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .28s ease;}
.shot img.on{opacity:1;}
.shot .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 9px 6px;
   font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;line-height:1.45;color:#fff;
   background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0));
   opacity:0;transition:opacity .2s;pointer-events:none;
   display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card:hover .shot .cap,.card:focus-visible .shot .cap{opacity:1;}
.ticks{position:absolute;top:7px;right:7px;display:flex;gap:3px;}
.ticks i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);
   box-shadow:0 0 0 1px rgba(0,0,0,.25);transition:background .2s;}
.ticks i.on{background:#fff;}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;}
.crow{display:flex;align-items:center;gap:8px;}
.cnum{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:20px;line-height:1;
      color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums;}
.cstar{margin-left:auto;color:var(--star);font-size:12px;letter-spacing:.04em;}
.card h3{margin:0;font-family:"Shippori Mincho",serif;font-weight:600;font-size:15.5px;
         line-height:1.5;text-wrap:balance;}
.cmemo{font-size:11.5px;color:var(--ink-2);border-top:1px dashed var(--rule);padding-top:6px;margin:0;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.empty{color:var(--ink-2);padding:40px 0;text-align:center;}

/* ---- 1件の詳細 ---- */
.sheetwrap{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;}
.dhead{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--rule);
   display:flex;align-items:baseline;gap:14px;padding:14px 26px;flex-wrap:wrap;}
.dhead .num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:32px;line-height:1;
   color:var(--accent);font-weight:500;}
.dhead h2{margin:0;font-family:"Shippori Mincho",serif;font-weight:600;font-size:23px;letter-spacing:.01em;}
.dhead .path{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;color:var(--ink-2);}
.dnav{margin-left:auto;display:flex;gap:6px;align-self:center;}
.dnav button{font:inherit;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;
   background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:3px;
   padding:4px 11px;cursor:pointer;}
.dnav button:hover:not(:disabled){border-color:var(--accent);}
.dnav button:disabled{opacity:.4;cursor:default;}
.sheet{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start;}
@media (max-width:1100px){.sheet{grid-template-columns:1fr;}}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px;border-right:1px solid var(--rule);align-content:start;}
@media (max-width:1100px){.figs{border-right:0;border-bottom:1px solid var(--rule);}}
.figs figure{margin:0;}
.figs figure:first-child{grid-column:1/-1;}
.figs img{width:100%;height:auto;display:block;border:1px solid var(--rule);background:var(--code);}
.figs figcaption{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;color:var(--ink-2);margin-top:4px;}
.text{padding:16px 26px 40px;max-width:78ch;}
.text .lead{font-size:15.5px;line-height:1.8;border-left:3px solid var(--accent);padding-left:14px;margin:4px 0 16px;}
.text h3{font-family:"Shippori Mincho",serif;font-size:17px;margin:22px 0 6px;font-weight:600;}
.text h4{font-size:14.5px;margin:16px 0 4px;}
.text p{margin:6px 0;}
.text ul{padding-left:1.3em;margin:6px 0;}
.text li{margin:3px 0;}
.text table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:13px;}
.text th,.text td{border-top:1px solid var(--rule);padding:5px 8px;vertical-align:top;text-align:left;}
.text th{color:var(--ink-2);font-weight:500;font-size:12px;letter-spacing:.04em;}
.text td{font-variant-numeric:tabular-nums;}
.text blockquote{margin:8px 0;padding:8px 14px;background:var(--code);border-left:3px solid var(--accent);}
.text code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;background:var(--code);padding:0 4px;border-radius:2px;}
.text pre{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;background:var(--code);padding:10px 12px;overflow-x:auto;line-height:1.5;}
.text .none{color:var(--ink-2);}
strong{font-weight:600;}

/* ---- メモ ---- */
.note{margin-top:26px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);padding:12px 14px;}
.note h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;color:var(--ink-2);font-weight:500;
   font-family:"IBM Plex Mono",ui-monospace,monospace;}
.stars{display:flex;gap:2px;margin-bottom:8px;}
.stars button{font:inherit;font-size:19px;line-height:1;background:transparent;border:0;cursor:pointer;
   color:var(--rule);padding:0 2px;}
.stars button.on{color:var(--star);}
.stars button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.note textarea{width:100%;min-height:76px;resize:vertical;font:inherit;font-size:13.5px;
   background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:7px 9px;}
.note textarea:focus{outline:none;border-color:var(--accent);}
.note .state{margin-top:5px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--ink-2);min-height:1.4em;}
.note.off textarea,.note.off .stars{opacity:.5;pointer-events:none;}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
  .card:hover,.card:focus-visible{transform:none;}
}
</style>

<header class="top">
  <h1>作例帳</h1>
  <span class="count" id="count"></span>
  <div class="tools">
    <div class="seg" id="fmode">
      <button data-v="all" aria-pressed="true">すべて</button>
      <button data-v="BRISTLE" aria-pressed="false">柱</button>
      <button data-v="SURFACE" aria-pressed="false">面</button>
      
    </div>
    <div class="seg" id="fsort">
      <button data-v="asc" aria-pressed="true">番号順</button>
      <button data-v="desc" aria-pressed="false">新しい順</button>
    </div>
    <input id="q" type="search" placeholder="名前・本文で探す" aria-label="名前・本文で探す">
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>見つかりませんでした。</p>
</main>

<div class="sheetwrap" id="detail" hidden role="dialog" aria-modal="true" aria-label="作例の詳細"></div>

<script type="application/json" id="data">[{"num":"01","title":"柱の高さと間引き（統合室が作った雛形）","mode":"BRISTLE","path":"docs/samples/01_試作_柱の高さと間引き","text":"<p class=\"lead\"><strong>これは作例室の見本ではなく、道具が通ることを確かめるために作った雛形です。<\/strong>\n作例室が本番の作例を作るときの、フォルダの形と README の書き方の例として\n残しています。差し替えて構いません。<\/p><p><strong>これは作例室の見本ではなく、道具が通ることを確かめるために作った雛形です。<\/strong> 作例室が本番の作例を作るときの、フォルダの形と README の書き方の例として 残しています。差し替えて構いません。<\/p>\n<h3>何を見せたいのか<\/h3>\n<p>1枚の切り抜き画像から、<strong>明暗を高さ・太さ・密度の3つに同時に効かせる<\/strong>と どうなるか。単体では分かりにくい3つが、重なると写真の陰影がそのまま 立体の起伏として読めるようになります。<\/p>\n<h3>効いている設定<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>明暗による高さ変化<\/td><td>ON<\/td><\/tr><tr><td>明暗による半径変化<\/td><td>ON（最小半径比率 0.35）<\/td><\/tr><tr><td>明暗による間引き<\/td><td>ON（強さ 0.55）<\/td><\/tr><tr><td>最大高さ<\/td><td>8.0mm<\/td><\/tr><tr><td>カラーモード<\/td><td>テクスチャマッピング<\/td><\/tr><\/table>\n<p>元画像は <code>3Dprint_Sample/<\/code> の1枚を <code>prepare_image.py --cut --size 768<\/code> で 切り抜き、アルファを固めたものです。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.116.4 / 柱モード<\/li><li>生成 1.7秒 / 生成物 1個 / 評価後の頂点 213,480<\/li><li>完全に不透明な画素 43.08%（固める前は 0.34%）<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/01_preview.jpg"}]},{"num":"11","title":"現物 花のブラシ刺繍","mode":"BRISTLE","path":"docs/samples/11_現物_花のブラシ刺繍","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\IMG_1753.JPG<\/code>。ベージュの生地に、<strong>ピンク〜藤色の 細い柱が、描かれた柄の線に沿って生えている<\/strong>。柱は根元が太く先が尖っていて、 柄の外へは一本も出ていない。面の板ではなく、<strong>線画がそのまま毛の集まりに なっている<\/strong>のがこの現物の要点。<\/p>\n<h3>元画像<\/h3>\n<p>薔薇の刺繍柄（512x512・背景は透明）。<strong>背景を透明にしてあることが、この 作例の全部<\/strong>——柱モードの輪郭はアルファだけで決まるので、白地のまま 読ませると 90x90mm の四角い毛の面になり、現物とは似ても似つかない物が出る。<\/p>\n<pre>python docs/samples/tools/prepare_image.py &lt;元絵&gt; source.png --size 512<\/pre>\n<p><code>--harden<\/code> は既定でONのまま（アルファを 0/1 に固める）。透明しきい値の既定は <strong>1.0＝完全に不透明な画素だけ<\/strong>なので、なだらかな縁のPNGをそのまま入れると 柱がほとんど立たない。<\/p>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td>断面形状<\/td><td>円柱<\/td><td>現物の毛は断面が丸い<\/td><\/tr><tr><td>テーパー比率<\/td><td>0.5<\/td><td><strong>1.0が「真っすぐ」で、小さくするほど先が尖る。<\/strong>0.5は現物の毛先の尖り方に合わせた値<\/td><\/tr><tr><td>最大高さ<\/td><td>3.5mm<\/td><td>現物の毛足の長さ。刺繍として立って見える最低限<\/td><\/tr><tr><td>高さを均一にする<\/td><td>ON<\/td><td><strong>現物の毛は同じ長さ。<\/strong>明暗で高さを振ると、色の濃い花びらだけ長くなって刺繍に見えなくなる<\/td><\/tr><tr><td>要素半径 / 間隔<\/td><td>0.3mm / 0.6mm<\/td><td>どちらも造形条件の下限そのもの。柱を最も細く最も密にした状態<\/td><\/tr><tr><td>カラーモード<\/td><td>画像マッピング<\/td><td>薔薇の赤紫、葉の緑がそのまま毛の色になる<\/td><\/tr><\/table>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 2.0秒 / 生成物 1個 / 評価後の頂点 88,272<\/li><li>造形条件の警告なし<\/li><li>見本は斜め(<code>preview.jpg<\/code>)と真上(<code>preview_top.jpg<\/code>)の2枚<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/11_preview.jpg"},{"c":"真上","d":"img/11_preview_top.jpg"}]},{"num":"12","title":"現物 黒レースのレリーフ","mode":"SURFACE","path":"docs/samples/12_現物_黒レースのレリーフ","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\IMG_1761.JPG<\/code>。ターコイズの生地の上に、<strong>黒い レースの柄が薄く盛り上がって載っている<\/strong>。花・葉・蔓が細い帯でつながり、 帯の内側にはさらに細かい網目が入っている。高さは 1〜2mm ほどで、 柱ではなく<strong>一枚の起伏（レリーフ）<\/strong>。<\/p>\n<p><strong>6件のうち、面モードはこれだけ。<\/strong>線ではなく面で柄を出す現物なので、 柱モードでは網目が潰れて再現できない。<\/p>\n<h3>元画像<\/h3>\n<p>黒地に白のダマスク調のレース柄（512x512）。<strong>明度反転をONにしている<\/strong>ので、 画像の<strong>暗い所ほど高く<\/strong>なる——つまり黒いレースの線が立ち上がる。反転を OFFにすると背景だけが盛り上がって、柄が凹んだ逆型になる。<\/p>\n<pre>python docs/samples/tools/prepare_image.py &lt;元絵&gt; source.png --size 512<\/pre>\n<h3>面モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td>最大高さ<\/td><td>1.4mm<\/td><td>現物の盛り上がりはごく浅い。3mm を超えると「レース」ではなく「塀」に見える<\/td><\/tr><tr><td>明暗による高さ変化<\/td><td>ON<\/td><td>柄の濃淡がそのまま起伏になる<\/td><\/tr><tr><td>明度反転<\/td><td><strong>ON<\/strong><\/td><td>黒い線を高くする。この作例の心臓部<\/td><\/tr><tr><td>明暗による半径変化<\/td><td>ON（最小0.3）<\/td><td>細い蔓と太い花びらの差を出す<\/td><\/tr><tr><td>輪郭オフセット<\/td><td><strong>0.45mm<\/strong><\/td><td>造形条件のための設定。下の「造形条件」を読むこと<\/td><\/tr><tr><td>カラーモード<\/td><td>テクスチャマッピング<\/td><td>レースの黒と地の色をそのまま載せる<\/td><\/tr><tr><td>面の分割<\/td><td>使っていない<\/td><td>現物のレースは切れ目なく一枚につながっている<\/td><\/tr><\/table>\n<h3>造形条件<\/h3>\n<p><strong>輪郭オフセットは見た目のための設定ではない。<\/strong>入れないと、道具が こう警告する。<\/p>\n<pre>造形条件: 細い部分が 0.47mm しかありません（下限 0.6mm）。\n潰れるか、途切れる恐れがあります（該当 27件 / 全 74件）<\/pre>\n<p>レースの網目が細すぎて、刷ると千切れる。輪郭オフセットで<strong>輪郭を外へ 0.45mm 広げる<\/strong>と警告は消える。0.15 / 0.30 では消えない——面の格子は 90mm を 512 で割った 0.176mm 刻みなので、それより細かい指定は同じ結果に 丸まる（実測: 0.15 と 0.30 は頂点数まで完全に一致した）。<\/p>\n<p><strong>もう1件、残したままの警告がある。<\/strong><\/p>\n<pre>1つの要素が 90x90mm あり、布のようには曲がりません（造形条件の上限 15.0mm）<\/pre>\n<p>これは<strong>わざと残してある<\/strong>。現物のレースも 90mm 四方につながった一枚だが、 帯が細いので実際にはよく曲がる。道具は外接する箱の大きさで測っていて、 帯の細さは見ていない。［面を分割する］でレースを短冊に切れば警告は消えるが、 <strong>現物には無い切れ目が入る<\/strong>。作例としては、警告の意味を知った上で残すほうが 正しいと判断した。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 面モード / 90x90mm<\/li><li>生成 1.1秒 / 生成物 1個 / 評価後の頂点 261,756<\/li><li>造形条件の警告 1件（上記のとおり意図的に残した）<\/li><li>見本は斜め(<code>preview.jpg<\/code>)と真上(<code>preview_top.jpg<\/code>)の2枚<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/12_preview.jpg"},{"c":"真上","d":"img/12_preview_top.jpg"}]},{"num":"13","title":"現物 千鳥格子の柱","mode":"BRISTLE","path":"docs/samples/13_現物_千鳥格子の柱","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\IMG_1767.JPG<\/code> の<strong>中央右<\/strong>、指で持ち上げている 青緑の切れ端。<strong>千鳥格子（ハウンドトゥース）の形をした板が1つずつ立って いて<\/strong>、隣どうしが噛み合って柄になっている。色は水色から黄緑へ流れる。 柄を「印刷」しているのではなく、<strong>柄の形をした柱そのものが並んでいる<\/strong>のが この現物の要点。<\/p>\n<h3>元画像<\/h3>\n<p>水色〜黄緑のにじんだ抽象柄（512x512・不透明）。<strong>この作例では、画像は色しか 決めていない。<\/strong>形は断面形状［千鳥格子］が作り、位置は格子が決める。だから 元画像は「色の地図」であればよく、千鳥格子が描かれている必要はまったく無い。<\/p>\n<pre>python docs/samples/tools/prepare_image.py &lt;元絵&gt; source.png --size 512<\/pre>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td>断面形状<\/td><td><strong>千鳥格子<\/strong><\/td><td>この作例の全部。アドオンが持っている形をそのまま使う<\/td><\/tr><tr><td>要素半径<\/td><td><strong>2.2mm<\/strong><\/td><td>現物の1つ1つが大きい。0.3mm 前後の他の作例と桁が違う。小さくすると柄が読めなくなり、ただの粒になる<\/td><\/tr><tr><td>間隔<\/td><td>0.6mm<\/td><td>造形条件の下限。ここを詰めるほど隣と噛み合って一枚の布に見える<\/td><\/tr><tr><td>テーパー比率<\/td><td><strong>1.0（真っすぐ）<\/strong><\/td><td>千鳥格子の形は上まで同じ太さで立っていないと読めない。<strong>尖らせると柄が消える<\/strong><\/td><\/tr><tr><td>最大高さ<\/td><td>4.0mm<\/td><td>現物の厚み。柄の大きさに対してこれくらいだと板に見える<\/td><\/tr><tr><td>高さを均一にする<\/td><td>ON<\/td><td>現物は全部同じ高さ<\/td><\/tr><tr><td>カラーモード<\/td><td>画像マッピング<\/td><td>1つの板が1色。水色→黄緑の流れがそのまま出る<\/td><\/tr><\/table>\n<p><strong>この作例だけ頂点数が桁違いに少ない<\/strong>（10,108）。半径 2.2mm なので 90x90mm に入る本数が 20x20 程度しかないため。<strong>柱モードは細かい毛だけの 道具ではない<\/strong>ことを示す例。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 2.9秒 / 生成物 1個 / 評価後の頂点 10,108<\/li><li>造形条件の警告なし<\/li><li>見本は斜め(<code>preview.jpg<\/code>)と真上(<code>preview_top.jpg<\/code>)の2枚<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/13_preview.jpg"},{"c":"真上","d":"img/13_preview_top.jpg"}]},{"num":"14","title":"現物 明暗だけで柄を出す毛足","mode":"BRISTLE","path":"docs/samples/14_現物_明暗だけで柄を出す毛足","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\IMG_1767.JPG<\/code> の<strong>左上<\/strong>、紺の生地に貼られた ピンクの面。<strong>極細の毛が一面に生えていて、その中に文字（\"RA\"）が浮かんで いる。<\/strong>文字は色で描かれているのではない——<strong>毛の長さの差だけで読める<\/strong>。 色はピンク一色の中の濃淡だけ。<\/p>\n<p><strong>「柄＝色」という思い込みを崩す現物。<\/strong>このアドオンで同じことをするには、 明暗を色ではなく高さへ渡す。<\/p>\n<h3>元画像<\/h3>\n<p>うねる淡い柄（512x512・不透明）。<strong>輪郭は使っていない<\/strong>（全面が不透明なので 90x90mm の四角い毛の面になる）。使っているのは<strong>明るさだけ<\/strong>で、それが 柱1本ずつの高さになる。<\/p>\n<pre>python docs/samples/tools/prepare_image.py &lt;元絵&gt; source.png --size 512<\/pre>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td>明暗による高さ変化<\/td><td><strong>ON<\/strong><\/td><td>この作例の心臓部。明るい所ほど高い柱が立ち、柄が高さの差として現れる<\/td><\/tr><tr><td>高さを均一にする<\/td><td><strong>OFF<\/strong><\/td><td>ONにすると全部同じ高さになり、<strong>柄が完全に消える<\/strong>。11番とちょうど逆の設定<\/td><\/tr><tr><td>最大高さ<\/td><td>6.0mm<\/td><td>高さの差で柄を読ませるので、<strong>振れ幅が要る<\/strong>。3mm では差が付かず、のっぺりする<\/td><\/tr><tr><td>テーパー比率<\/td><td><strong>0.15<\/strong><\/td><td>ほぼ針。現物の毛足がこれくらい細い。1.0（真っすぐ）にすると棒の林になる<\/td><\/tr><tr><td>要素半径 / 間隔<\/td><td>0.32mm / 0.6mm<\/td><td>造形条件の下限近く。毛として見えるにはここまで細く密に<\/td><\/tr><tr><td>カラーモード<\/td><td><strong>高さでグラデーション<\/strong>（3分岐点）<\/td><td>濃い赤紫 → 中間 → 淡い桃。<strong>現物のピンク一色の濃淡<\/strong>に合わせた<\/td><\/tr><\/table>\n<h3>「高さでグラデーション」の色の置き場所<\/h3>\n<p>この色は <code>props<\/code> に無い。ノードグループ <code>BF_HeightGradient<\/code> の ColorRamp が 持っていて、設定テキストでは <code>props<\/code> と<strong>並んだ別のキー<\/strong> <code>height_ramp<\/code> に 入る。手で <code>settings.json<\/code> を作るときに落としやすい。<\/p>\n<pre>{ &quot;props&quot;: { ... }, &quot;height_ramp&quot;: { &quot;elements&quot;: [ {&quot;position&quot;:0.0,&quot;color&quot;:[...]}, ... ] } }<\/pre>\n<p><strong>柱1本の中で色を分けることはできない。<\/strong>柱の側面には根元と先端の2列しか 頂点が無いため（<code>docs/lessons.md<\/code>「頂点が2列しか無い所に、グラデーションは 載らない」）。この作例の色は「<strong>低い柱と高い柱で色が違う<\/strong>」であって、 「1本の中で根元と先が違う」ではない。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 2.6秒 / 生成物 1個 / 評価後の頂点 123,504 / 色分岐点 3本<\/li><li>造形条件の警告なし<\/li><li>見本は斜め(<code>preview.jpg<\/code>)と真上(<code>preview_top.jpg<\/code>)の2枚<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/14_preview.jpg"},{"c":"真上","d":"img/14_preview_top.jpg"}]},{"num":"15","title":"現物 等高線の波","mode":"BRISTLE","path":"docs/samples/15_現物_等高線の波","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\IMG_1758.JPG<\/code>。生地の上に、<strong>小さな粒が等高線の ように何本もの筋を描いて並んでいる<\/strong>。筋は平行ではなく、地形図の等高線の ように緩く曲がりながら濃くなったり薄くなったりする。粒は半球で、筋の 中心では太く、端では細くなって消えていく。<\/p>\n<p><strong>「線を描く」のではなく「線に見えるように粒を配る」<\/strong>現物。<\/p>\n<h3>元画像<\/h3>\n<p>うねる等高線の絵（512x512・不透明）。<strong>この作例で一番苦労したのは絵の ほうで、設定ではない。<\/strong><\/p>\n<pre>python docs/samples/tools/prepare_image.py &lt;元絵&gt; source.png \\\n       --crop 0.12 --threshold 0.42 --size 512<\/pre>\n<p><code>--crop 0.12<\/code> が要点。柱モードは<strong>格子の点でしか画像を読まない<\/strong>ので、 柄の周期が柱のピッチに近いと、拾った結果は砂嵐になる。<\/p>\n<p>切り出す前の絵は、90mm へ敷くと<strong>周期 1.80mm<\/strong>（走査線1本あたり山 50本を 実測）。柱のピッチは 1.2mm（半径0.3x2 + 間隔0.6）なので、<strong>周期はピッチの 1.5倍しかなかった。<\/strong>柄はどこにも見えず、柱がランダムに半分抜けた面が出た。<\/p>\n<p><strong>元の絵を作り直すのではなく、中央を粗く切り出す<\/strong>のが正しい直し方。 <code>--crop 0.12<\/code> で周期は 18.0mm ＝ <strong>ピッチの15倍<\/strong>になる。<\/p>\n<p>切り出す割合を振って測った（<code>../_計測_柄の周期_20260904.jpg<\/code>、左から順）:<\/p>\n<table><tr><th>crop<\/th><th>周期<\/th><th>ピッチの<\/th><th>見え方<\/th><\/tr><tr><td>1.00<\/td><td>1.80mm<\/td><td>1.5倍<\/td><td><strong>砂嵐。<\/strong>構造がまったく見えない<\/td><\/tr><tr><td>0.50<\/td><td>3.60mm<\/td><td>3.0倍<\/td><td>まだ砂嵐。四角い塊がちらつく<\/td><\/tr><tr><td>0.30<\/td><td>7.20mm<\/td><td>6.0倍<\/td><td>曲線が出はじめる。まだ途切れる<\/td><\/tr><tr><td>0.20<\/td><td>11.25mm<\/td><td>9.4倍<\/td><td><strong>読める<\/strong><\/td><\/tr><tr><td>0.12<\/td><td>18.00mm<\/td><td>15.0倍<\/td><td>はっきり読める（この作例）<\/td><\/tr><\/table>\n<p>目安の <code>要る周期 = ピッチ x 4<\/code> は<strong>下限<\/strong>であって推奨値ではない。 実測では3倍で読めず、6倍でようやく輪郭が出る。<\/p>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td>断面形状<\/td><td>ドーム<\/td><td>現物の粒が半球。円柱にすると「線」ではなく「壁」に見え出す<\/td><\/tr><tr><td>要素半径 / 間隔<\/td><td>0.30mm / 0.6mm<\/td><td>どちらも造形条件の下限。<strong>ピッチ 1.2mm はこの道具で作れる一番細かい格子<\/strong><\/td><\/tr><tr><td>テーパー比率<\/td><td>0.85<\/td><td>ほぼ真っすぐ。粒の丸みはドームが作るので、ここで尖らせると別物になる<\/td><\/tr><tr><td>最大高さ<\/td><td>2.2mm<\/td><td>現物は低い。高くすると筋が「毛」に見えてしまう<\/td><\/tr><tr><td>明暗による高さ変化<\/td><td>ON<\/td><td>筋の芯が高く、外れるほど低くなる<\/td><\/tr><tr><td>明暗による半径変化<\/td><td><strong>ON（最小比率 0.5）<\/strong><\/td><td>筋の芯が太く、端が細い。<strong>高さと半径の両方を明暗に繋いだのはこの作例だけ<\/strong>で、これが「線が濃淡を持って消えていく」現物の見え方を作る<\/td><\/tr><tr><td>カラーモード<\/td><td>画像マッピング<\/td><td>絵の色をそのまま粒に載せる<\/td><\/tr><\/table>\n<h3>分かったこと：線が途切れて見える<\/h3>\n<p>真上（<code>preview_top.jpg<\/code>）で見ると、<strong>筋が1本の線につながらず、粒の とびとびの並びになっている<\/strong>。これは設定の失敗ではなく、格子の性質。<\/p>\n<p>ピッチ 1.2mm は造形条件の下限なので<strong>これ以上細かくできない<\/strong>。その格子に 斜めの細い線を載せると、線が格子の目を通る所と通らない所ができて、必ず とびとびになる（画面の斜め線がギザギザになるのと同じ）。<\/p>\n<p><strong>避ける手は2つ<\/strong>——線を太く描く（<code>--crop<\/code> をもっと小さくして柄を粗くする）か、 面モードへ移る。この作例は「柱モードでどこまでいけるか」を示すために そのままにしてある。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 1.9秒 / 生成物 1個 / 評価後の頂点 42,575<\/li><li>造形条件の警告なし<\/li><li>見本は斜め(<code>preview.jpg<\/code>)と真上(<code>preview_top.jpg<\/code>)の2枚<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/15_preview.jpg"},{"c":"真上","d":"img/15_preview_top.jpg"}]},{"num":"16","title":"現物 角柱と先端ドームの放射","mode":"BRISTLE","path":"docs/samples/16_現物_角柱と先端ドームの放射","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\IMG_1762.JPG<\/code>。<strong>四角い板が同心円の弧に沿って 並び、その1枚ずつの上に小さな丸い突起が載っている<\/strong>。板は中心を向いて 少しずつ回っていて、外へ行くほど間が空く。色は暗い赤〜えんじ。<\/p>\n<p><strong>6件のうち、配置と向きを道具に作らせたのはこれだけ。<\/strong>画像は色と輪郭 だけを渡していて、リングの形も1枚ずつの回転も<strong>設定が作っている<\/strong>。<\/p>\n<h3>元画像<\/h3>\n<p>暗い赤の渦柄（512x512・不透明）。<\/p>\n<pre>python docs/samples/tools/prepare_image.py &lt;元絵&gt; source.png \\\n       --crop 0.30 --no-harden --size 512 --gain 0.50<\/pre>\n<p><code>--gain 0.50<\/code> は<strong>色だけを暗くする道具<\/strong>。アルファを決めきったあとに 掛かるので、いくら暗くしても柱の位置は1本も動かない（<code>tools/prepare_image.py<\/code> の頭に書いてある）。現物のえんじ色に寄せるために入れた。<\/p>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td>配置パターン<\/td><td><strong>同心円<\/strong><\/td><td>この作例の骨格。リングは画像に描かれているのではなく、この設定が作る<\/td><\/tr><tr><td>外周の間引き<\/td><td><strong>0.25<\/strong><\/td><td>外側のリングほど間を空ける。0 にすると外周が詰まりすぎて、渦ではなく塗り潰しに見える<\/td><\/tr><tr><td>要素の向き<\/td><td><strong>放射（中心を向く）<\/strong><\/td><td>板の1枚ずつが中心を向いて回る。既定の［固定］だと全部が同じ向きの格子になり、<strong>リングに沿って並んでいるように見えなくなる<\/strong><\/td><\/tr><tr><td>断面形状 / 半径<\/td><td>立方体 / 1.0mm<\/td><td>現物の板の大きさ<\/td><\/tr><tr><td>間隔<\/td><td>0.6mm<\/td><td>造形条件の下限。ここを下回ると警告が出る（下記）<\/td><\/tr><tr><td>テーパー比率<\/td><td>0.95<\/td><td>ほぼ真っすぐ。板なので上まで同じ太さ<\/td><\/tr><tr><td>最大高さ<\/td><td>2.4mm<\/td><td>現物の板の厚み<\/td><\/tr><tr><td>高さを均一にする<\/td><td>ON<\/td><td>現物は全部同じ高さ<\/td><\/tr><tr><td><strong>先端パーツ<\/strong><\/td><td><strong>ドーム / 比率 0.62 / 高さ 1.1mm<\/strong><\/td><td>板の上に載る丸い突起。<strong>この作例の見どころ<\/strong>。比率を下げると点になり、1.0 に近づけると板と同じ大きさの帽子になる<\/td><\/tr><tr><td>カラーモード<\/td><td>画像マッピング<\/td><td>絵の色（暗い赤）が板の色になる<\/td><\/tr><\/table>\n<h3>再現できなかったこと（重要）<\/h3>\n<p>現物は<strong>黒い板の上に赤いドーム<\/strong>という2色。<strong>これは作れない。<\/strong><\/p>\n<ul><li>柱1本の色は、その柱が立っている<strong>1点の画素<\/strong>からしか決まらない<\/li><li><strong>先端パーツは色を持たない<\/strong>（本体と同じ材になる）<\/li><li>材を分けられるのは［透明］の透明材との2つだけで、色材どうしは分けられない<\/li><li>柱の側面には根元と先端の2列しか頂点が無いので、1本の中で色を変えることも できない（<code>docs/lessons.md<\/code>「頂点が2列しか無い所に、グラデーションは 載らない」）<\/li><\/ul>\n<p><strong>どちらか一方の色に寄せるしかない<\/strong>ので、<code>--gain 0.50<\/code> で絵を暗くして 現物のえんじ側に合わせた。「作れないことを作れたことにしない」ために ここへ書いておく。<\/p>\n<h3>造形条件で1度つまずいた<\/h3>\n<p>最初は間隔を 0.25mm にしていて、こう警告された。<\/p>\n<pre>造形条件: 要素間隔が推奨値未満です: 0.25mm（下限 0.6mm）<\/pre>\n<p>0.6mm に戻した。<strong>リングの詰まり具合は、間隔ではなく［外周の間引き］で 作る<\/strong>のが正しい——間隔は造形の下限で決まっていて、見た目の都合で触る 数字ではない。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 4.4秒 / 生成物 1個 / 評価後の頂点 120,780（<strong>6件で最も重い<\/strong>。 先端パーツで1本あたりの面数が倍近くになるため）<\/li><li>造形条件の警告なし<\/li><li>見本は斜め(<code>preview.jpg<\/code>)と真上(<code>preview_top.jpg<\/code>)の2枚<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/16_preview.jpg"},{"c":"真上","d":"img/16_preview_top.jpg"}]},{"num":"17","title":"現物 点の密度で柄を描く","mode":"BRISTLE","path":"docs/samples/17_現物_点の密度で柄を描く","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\IMG_1760.JPG<\/code>。<strong>同じ大きさの粒だけで柄が描かれて いる<\/strong>。粒の色も高さもほとんど変わらず、変わるのは<strong>どれだけ詰まっているか<\/strong> だけ。濃い所は隙間なく、薄い所はぽつぽつと散って、その差が柄になる。<\/p>\n<p><strong>［明暗による間引き］を主役にした作例。<\/strong>11〜16 の6件は1本も使っていない。<\/p>\n<h3>元画像<\/h3>\n<p>斜めに走る太い帯（512x512・不透明）。<\/p>\n<pre>python docs/samples/tools/prepare_image.py &lt;元絵&gt; source.png --size 512<\/pre>\n<p><strong>この作例は一度失敗して作り直している。<\/strong>原因は柄の細かさではなく、 <strong>明暗が振り切っていなかったこと<\/strong>だった。<\/p>\n<ul><li>間引きは「明るいほど消す」ので、消したい側は<strong>白まで<\/strong>持っていく。 最初の絵は明度 0.08〜0.90 のあいだで揺れていて、しかも ［間引きの強さ］が 0.85 だったので、<strong>どこでも半分ずつ抜けた<\/strong> ——柄ではなく塩胡椒になる。いまの絵は明度 0.14〜1.00<\/li><li>帯そのものは十分に粗い（走査線1本に山が1つ＝周期はほぼ 90mm）。 <strong>細かすぎる絵で起きる別の失敗<\/strong>は作例15 のほうに書いてある （柄の周期がピッチの1.5倍で砂嵐になった）<\/li><\/ul>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>明暗による間引き<\/strong><\/td><td><strong>ON<\/strong><\/td><td>この作例の心臓部。明るい画素の柱ほど高い確率で消える<\/td><\/tr><tr><td><strong>間引きの強さ<\/strong><\/td><td><strong>1.0<\/strong><\/td><td>最大。いちばん明るい所は<strong>1本も残らない<\/strong>。0.5 だと白い側も半分残り、地と柄の差が付かない<\/td><\/tr><tr><td>間引きのシード<\/td><td>3<\/td><td>散らばり方を固定する。変えると同じ密度のまま別の散らばりになる<\/td><\/tr><tr><td>断面形状 / 半径 / 間隔<\/td><td>ドーム / 0.55mm / 0.9mm<\/td><td>ピッチ 2.0mm。<strong>下限（1.2mm）より粗くしてある<\/strong>——間引きは「抜けたこと」が見えないと効かないので、粒どうしに隙間が要る<\/td><\/tr><tr><td>高さを均一にする<\/td><td>ON<\/td><td>現物は粒の高さが揃っている。<strong>高さも明暗に繋ぐと、間引きと効果が混ざって何が効いているのか読めなくなる<\/strong><\/td><\/tr><tr><td>最大高さ<\/td><td>2.4mm<\/td><td>現物は低い<\/td><\/tr><tr><td>カラーモード<\/td><td>画像マッピング<\/td><td>濃い側が紺、薄い側が白。<strong>色も密度と同じ向きに動く<\/strong>ので柄が二重に読める<\/td><\/tr><\/table>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 1.9秒 / 生成物 1個 / 評価後の頂点 93,275<\/li><li>造形条件の警告なし<\/li><li>見本は斜め(<code>preview.jpg<\/code>)と真上(<code>preview_top.jpg<\/code>)の2枚。 <strong>密度の柄は真上でしか読めない<\/strong>ので、こちらを先に見ること<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/17_preview.jpg"},{"c":"真上","d":"img/17_preview_top.jpg"}]},{"num":"18","title":"現物 透明なビーズ","mode":"BRISTLE","path":"docs/samples/18_現物_透明なビーズ","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\IMG_1766.JPG<\/code>。<strong>根元だけに色があり、上は透き通って いる粒<\/strong>が一面に並ぶ。光にかざすと色が下から透けて見える。J8シリーズの 透明材（VeroClear）を使った、この機械でしか作れない見え方。<\/p>\n<p><strong>［透明］を主役にした作例。<\/strong><\/p>\n<h3>元画像<\/h3>\n<p>青のグラデーション（512x512・不透明）。<strong>柄は無い。<\/strong>この作例で見せたいのは 材の切り替わりなので、絵は「根元の色が場所で変わる」ことだけを担う。<\/p>\n<pre>python docs/samples/tools/prepare_image.py &lt;元絵&gt; source.png --size 512<\/pre>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>透明<\/strong><\/td><td><strong>ON<\/strong><\/td><td>この作例の心臓部。1本の柱を色材と透明材の2つに分ける<\/td><\/tr><tr><td><strong>範囲<\/strong><\/td><td><strong>上だけ<\/strong><\/td><td>透明材を上へ置く。［下だけ］にすると色が上に浮いて、現物と上下が逆になる<\/td><\/tr><tr><td><strong>方式<\/strong><\/td><td><strong>比率(%)<\/strong><\/td><td>高さに対する割合で決める。［厚み(mm)］にすると、高さを変えたとき色の帯の厚みが変わらない<\/td><\/tr><tr><td><strong>色付き部分<\/strong><\/td><td><strong>25%<\/strong><\/td><td>下から 0.8mm が色材、残り 2.4mm が透明材。<strong>大きくするほど普通の柱に近づく<\/strong>。0 にすると全部透明<\/td><\/tr><tr><td>断面形状 / 半径 / 間隔<\/td><td>ドーム / 0.9mm / 0.8mm<\/td><td>ピッチ 2.6mm。<strong>粒を大きくしてある<\/strong>——細い柱では色の帯が細すぎて、透けているのかどうか分からない<\/td><\/tr><tr><td>最大高さ<\/td><td>3.2mm<\/td><td>色と透明の<strong>両方に厚みを持たせる<\/strong>ための高さ<\/td><\/tr><tr><td>高さを均一にする<\/td><td>ON<\/td><td>現物はビーズの高さが揃っている<\/td><\/tr><tr><td>カラーモード<\/td><td>画像マッピング<\/td><td>根元の色。透明材のほうには色が乗らない<\/td><\/tr><\/table>\n<h3>分かったこと：書き出しは2つのOBJに分かれる<\/h3>\n<p>［透明］がONだと、OBJ は<strong>必ず2つのオブジェクト<\/strong>（<code>BristleBase<\/code> / <code>BristleClear<\/code>）として書き出される。設定ではなく、ONかOFFかだけで決まる。 プリンタ側で材を割り当てるときはこの2つを別々に扱う。<\/p>\n<p><strong>PLY には材の情報が無い<\/strong>ので、この作例を PLY で書き出しても透明は表現 されない（アドオンがその旨を警告する）。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 5.3秒 / 生成物 1個 / 評価後の頂点 158,025<\/li><li>造形条件の警告なし<\/li><li>見本は斜め(<code>preview.jpg<\/code>)と真上(<code>preview_top.jpg<\/code>)の2枚。 <strong>透明は斜めでしか読めない<\/strong>ので、こちらを先に見ること<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/18_preview.jpg"},{"c":"真上","d":"img/18_preview_top.jpg"}]},{"num":"19","title":"現物 放射のリング","mode":"BRISTLE","path":"docs/samples/19_現物_放射のリング","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\IMG_1769.JPG<\/code> と <code>IMG_1768.JPG<\/code>。<strong>中が空いた短い筒<\/strong>が 一面に立っていて、上端が斜めに切り落とされたように傾いている。アイロンビーズを 並べたような見え方。<\/p>\n<p><strong>［リング断面］と［先端の厚み比］と［要素の向き］の3つを組み合わせた作例。<\/strong> この3つは<strong>別々に使っても何も起きない<\/strong>ことがあり、そこがこの作例の要点。<\/p>\n<h3>元画像<\/h3>\n<p>中心から角度で色相が回る絵（512x512・不透明）。柄ではなく<strong>色だけ<\/strong>を渡す。 形は全部設定が作っている。<\/p>\n<pre>python docs/samples/tools/prepare_image.py &lt;元絵&gt; source.png --size 512<\/pre>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>断面形状<\/strong><\/td><td><strong>リング<\/strong><\/td><td>中が空く。現物の筒<\/td><\/tr><tr><td>穴の比率<\/td><td>0.5<\/td><td>穴の直径 ÷ 外径。外径 3.2mm なので穴 1.6mm・壁 0.8mm で、どちらも造形の下限 0.6mm を満たす。<strong>0.9 まで上げると壁が 0.16mm になり刷れない<\/strong><\/td><\/tr><tr><td><strong>先端の厚み比<\/strong><\/td><td><strong>0.35<\/strong><\/td><td>上端を斜めに切り落とす。<strong>底面は動かさない<\/strong>ので接地したままオーバーハングも出ない<\/td><\/tr><tr><td><strong>要素の向き<\/strong><\/td><td><strong>放射（中心を向く）<\/strong><\/td><td>切り落とす向きが中心を向いて回り、風車のように見える<\/td><\/tr><tr><td>配置パターン<\/td><td>同心円<\/td><td>現物の並び。外周の間引き 0.2 で外へ行くほど間を空ける<\/td><\/tr><tr><td>要素半径 / 間隔<\/td><td>1.6mm / 0.6mm<\/td><td>現物の筒の太さ<\/td><\/tr><tr><td>最大高さ<\/td><td>5.0mm<\/td><td>高さがないと「筒」に見えず、輪が置いてあるだけになる<\/td><\/tr><tr><td>カラーモード<\/td><td>画像マッピング<\/td><td>角度で色相が回る<\/td><\/tr><\/table>\n<h3>分かったこと：向きだけ変えても、何も起きないことがある<\/h3>\n<p>最初は［先端の厚み比］を既定の 1.0（切り落とさない）のまま、［要素の向き］ だけ［接線］にした。<strong>画面はまったく変わらなかった。<\/strong><\/p>\n<p>リングは<strong>回転対称<\/strong>なので、回しても同じ形が同じ場所に来る。［向き］は 効いていたが、効いた結果が見えない。<strong>警告も出ない<\/strong>（アドオンは断面が 回転対称かどうかを知らない）。<\/p>\n<p>［先端の厚み比］を 1.0 未満にすると要素が左右非対称になり、そこで初めて ［向き］が見えるようになる。<strong>円柱・ドーム・リングでこの3つを組み合わせる ときは、必ず先に「厚み比」を下げること。<\/strong><\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 4.3秒 / 生成物 1個 / 評価後の頂点 22,128（リングは1本あたりの面数が 多いので、本数は少ない）<\/li><li>造形条件の警告なし<\/li><li>見本は斜め(<code>preview.jpg<\/code>)と真上(<code>preview_top.jpg<\/code>)の2枚<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/19_preview.jpg"},{"c":"真上","d":"img/19_preview_top.jpg"}]},{"num":"20","title":"現物 文字が柱になる","mode":"BRISTLE","path":"docs/samples/20_現物_文字が柱になる","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\IMG_1764.JPG<\/code>。<strong>柱1本ずつが円ではなく、決まった 形をしている<\/strong>。丸でも四角でもない、輪郭を持った形が一面に並び、その集まりが 別の柄を描く。<\/p>\n<p><strong>［カスタム(SVG)断面］を主役にした作例。<\/strong>このアドオンの断面形状は11種類 あるが、<strong>11番目だけは自分で描いた形を渡せる。<\/strong><\/p>\n<h3>フォルダの中身が1つ多い<\/h3>\n<pre>20_現物_文字が柱になる/\n    source.png      柄（11番と同じ薔薇）\n    element.svg     ← 柱1本の断面。この作例だけの追加ファイル\n    settings.json\n    preview.jpg / preview_top.jpg<\/pre>\n<p><code>element.svg<\/code> は太い「E」の字を1本のパスで描いたもの。<strong>穴の空いていない、 線の太い字を選ぶこと<\/strong>——細い線や中抜きのある字は、造形の最小肉厚 0.6mm を 簡単に割る。<\/p>\n<h3>元画像<\/h3>\n<p><strong>11番と同じ <code>source.png<\/code> をそのまま使っている。<\/strong>変えたのは断面だけなので、 11番（円柱）と並べると<strong>断面形状が変わると何が変わるか<\/strong>だけが読める。<\/p>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>断面形状<\/strong><\/td><td><strong>カスタム(SVG)<\/strong><\/td><td>この作例の心臓部<\/td><\/tr><tr><td><strong>SVGファイル<\/strong><\/td><td><code>element.svg<\/code><\/td><td>フォルダの中の字。差し替えれば柱の形がそのまま変わる<\/td><\/tr><tr><td>要素半径<\/td><td>1.1mm<\/td><td>SVG は<strong>この半径の円に収まるように拡大縮小される<\/strong>。字の大きさは SVG 側では決まらない<\/td><\/tr><tr><td>間隔<\/td><td>0.6mm<\/td><td>造形条件の下限<\/td><\/tr><tr><td>テーパー比率<\/td><td>1.0<\/td><td>真っすぐ。<strong>字は上まで同じ形でないと読めない<\/strong><\/td><\/tr><tr><td>最大高さ<\/td><td>3.0mm<\/td><td>立体として読める最低限<\/td><\/tr><tr><td>高さを均一にする<\/td><td>ON<\/td><td>高さを振ると字の並びが揺れて読みづらくなる<\/td><\/tr><tr><td>カラーモード<\/td><td>画像マッピング<\/td><td>薔薇の色が1文字ずつに載る<\/td><\/tr><\/table>\n<h3>分かったこと：SVG はヘッドレスでも読める<\/h3>\n<p><code>--background<\/code> でも SVG 断面は読み込める。アドオンが必要なときに Blender 同梱の <code>io_curve_svg<\/code> を自分で有効にするので、こちらで何もしなくても <code>Info: SVG断面を読み込みました<\/code> が出る。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 4.8秒 / 生成物 1個 / 評価後の頂点 16,656<\/li><li>造形条件の警告なし<\/li><li>見本は斜め(<code>preview.jpg<\/code>)と真上(<code>preview_top.jpg<\/code>)の2枚。 <strong>字が読めるのは真上だけ<\/strong><\/li><\/ul>","imgs":[{"c":"斜め","d":"img/20_preview.jpg"},{"c":"真上","d":"img/20_preview_top.jpg"}]},{"num":"21","title":"現物 青いモザイクタイル","mode":"SURFACE","path":"docs/samples/21_現物_青いモザイクタイル","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\IMG_1755.JPG<\/code> の<strong>左下<\/strong>。<strong>大きさも形もまちまちの タイル<\/strong>が隙間なく敷き詰められ、1枚ずつが独立した平らな板になっている。 白から水色、紺、ほとんど黒までの階調が斜めに流れる。<\/p>\n<p><strong>［面の分割］を主役にした作例。<\/strong>面モードの真髄——大きな一枚板ではなく、 <strong>ブロックに分かれた柄が立ち上がる<\/strong>——を示す。<\/p>\n<h3>元画像<\/h3>\n<p>白 → 水色 → 青 → ほぼ黒の斜めのグラデーション（512x512・不透明）。 柄は描いていない。<strong>タイルの割れ方は絵ではなく設定が作る。<\/strong><\/p>\n<pre>python docs/samples/tools/prepare_image.py &lt;元絵&gt; source.png --size 512<\/pre>\n<h3>面モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>面の分割<\/strong><\/td><td><strong>ON<\/strong><\/td><td>この作例の心臓部。1枚の面を独立した島に切る<\/td><\/tr><tr><td><strong>分割パターン<\/strong><\/td><td><strong>ボロノイ<\/strong><\/td><td>まちまちの多角形。［ブロック］だと格子状の四角、［六角］だと蜂の巣になる。<strong>現物の不揃いさはボロノイでしか出ない<\/strong><\/td><\/tr><tr><td><strong>ブロックの大きさ<\/strong><\/td><td><strong>9.0mm<\/strong><\/td><td>タイル1枚の目安。大きくすると板に近づき、<strong>小さくすると3Dプリントの最小肉厚を割る<\/strong><\/td><\/tr><tr><td>高さの決め方<\/td><td>レリーフ<\/td><td>明るさが高さになる。薄い側が高く、濃い側が低い<\/td><\/tr><tr><td>最大高さ<\/td><td>2.6mm<\/td><td>現物のタイルの厚み<\/td><\/tr><tr><td>カラーモード<\/td><td>テクスチャマッピング<\/td><td>絵をそのまま面へ貼る。柱モードの［画像マッピング］と違い、<strong>1枚の中で色が変わる<\/strong><\/td><\/tr><\/table>\n<h3>なぜ分割するのか<\/h3>\n<p><strong>大きさの都合ではなく、デザインそのもの。<\/strong>現物がタイルの集まりなので 分割する。90x90mm は造形トレイ（460x360mm）に収まるので、大きさの理由で 割る必要はない。<\/p>\n<p>分割にはもう1つ意味がある——<strong>分かれていると布のように曲がる。<\/strong> 一枚板の 90mm は曲がらないが、9mm の島に割ってあれば島どうしの間で 折れる。現物が服として成立しているのはこれによる。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / <strong>面モード<\/strong> / 90x90mm<\/li><li>生成 2.1秒 / 生成物 1個 / 評価後の頂点 273,498<\/li><li>造形条件の警告なし<\/li><li>見本は斜め(<code>preview.jpg<\/code>)と真上(<code>preview_top.jpg<\/code>)の2枚<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/21_preview.jpg"},{"c":"真上","d":"img/21_preview_top.jpg"}]},{"num":"22","title":"現物 菱形格子の面","mode":"BRISTLE","path":"docs/samples/22_現物_菱形格子の面","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\IMG_1757.JPG<\/code>。<strong>六角形に近い平たい粒が、行ごとに 半分ずつずれて並ぶ<\/strong>。蜂の巣とも鱗とも見える詰み方で、粒の角は丸い。 色は淡い黄緑から灰色へ流れる。<\/p>\n<p><strong>［レンガ配置］と［六角断面］と［上端の丸み］を組み合わせた作例。<\/strong> どれも1つでは効果が地味で、<strong>3つ揃うと詰み方そのものが変わる。<\/strong><\/p>\n<h3>元画像<\/h3>\n<p>白 → 黄緑 → 灰の斜めのグラデーション（512x512・不透明）。 柄は無い。<strong>格子の形は絵ではなく設定が作る。<\/strong><\/p>\n<pre>python docs/samples/tools/prepare_image.py &lt;元絵&gt; source.png --size 512<\/pre>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>配置パターン<\/strong><\/td><td><strong>レンガ<\/strong><\/td><td>行ごとに半ピッチずらす。既定の［格子］だと縦横が揃った市松になり、<strong>六角形の詰み方にならない<\/strong><\/td><\/tr><tr><td><strong>断面形状<\/strong><\/td><td><strong>六角<\/strong><\/td><td>隙間なく詰められる唯一の多角形。四角だと目地が十字に通り、円だと三角の隙間が残る<\/td><\/tr><tr><td><strong>上端の丸み<\/strong><\/td><td><strong>0.55<\/strong><\/td><td>上の縁だけを丸める。<strong>底面は平らのまま<\/strong>なので造形条件は変わらない。0 にすると角が立って金属板に見え、1.0 に近づけるとドームに寄る<\/td><\/tr><tr><td>要素半径 / 間隔<\/td><td>1.3mm / 0.6mm<\/td><td>ピッチ 3.2mm。<strong>六角の詰み方が読める大きさ<\/strong>にしてある<\/td><\/tr><tr><td>テーパー比率<\/td><td>0.88<\/td><td>ほぼ真っすぐ。粒として見せたいので、先細りは僅かに<\/td><\/tr><tr><td>最大高さ<\/td><td>1.8mm<\/td><td>現物は低い。高くすると「格子」ではなく「柱の林」になる<\/td><\/tr><tr><td>高さを均一にする<\/td><td>ON<\/td><td>現物は面が揃っている<\/td><\/tr><tr><td>カラーモード<\/td><td>画像マッピング<\/td><td>1粒に1色。<strong>粒の中で色は変わらない<\/strong>ので、モザイク画のように読める<\/td><\/tr><\/table>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 5.0秒 / 生成物 1個 / 評価後の頂点 292,758（<strong>この6件で最も重い<\/strong>。 上端の丸みが1本あたりの面数を増やす）<\/li><li>造形条件の警告なし<\/li><li>見本は斜め(<code>preview.jpg<\/code>)と真上(<code>preview_top.jpg<\/code>)の2枚。 <strong>詰み方が読めるのは真上<\/strong><\/li><\/ul>","imgs":[{"c":"斜め","d":"img/22_preview.jpg"},{"c":"真上","d":"img/22_preview_top.jpg"}]},{"num":"23","title":"現物 デニムに咲く花","mode":"BRISTLE","path":"docs/samples/23_現物_デニムに咲く花","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\★IMG_1763.JPG<\/code>。<strong>濃紺のデニムの上に、 マゼンタの花と緑の蔓が一面に刷ってある。<\/strong>この現物で目を引くのは 刷られた柄ではなく、<strong>柄と生地の取り合わせ<\/strong>のほう——同じ花を白い 布に刷ったら、まったく別の物に見える。<\/p>\n<p><strong>［ファブリック底面］を主役にした作例。<\/strong> 柄そのものは 4輪の花だけで、 残りは全部が透明。<strong>画面の 8割は生地<\/strong>で、それが狙い。<\/p>\n<h3>元画像<\/h3>\n<p>512x512。<strong>花・葉・茎だけが不透明で、あとは完全に透明。<\/strong> 花は5弁で中心が黄、茎は24分割した折れ線からの距離で描き、葉は 回した楕円。<\/p>\n<pre>cd &lt;作業用のフォルダ&gt;\npython docs/samples/tools/make_art_23_28.py<\/pre>\n<p>書き出される <code>a23.png<\/code> が <code>source.png<\/code>。<\/p>\n<p>柄そのものは Python で描いた。<strong>透明の面積を大きく取ることだけが 条件<\/strong>で、絵の内容は問わない。<\/p>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>ファブリック底面を適用<\/strong><\/td><td><strong>ON<\/strong><\/td><td><code>Stratasys_Fabric_Base<\/code> という<strong>別のオブジェクト<\/strong>が、柱の外接箱＋20mm で作られる<\/td><\/tr><tr><td><strong>マテリアル適用方法<\/strong><\/td><td><strong>布プリセット<\/strong><\/td><td>画像が要らないのがこれだけ。他の方式は画像ファイルを指すので、<strong>設定ファイルに絶対パスが焼き付いてフォルダが持ち運べなくなる<\/strong><\/td><\/tr><tr><td><strong>色<\/strong><\/td><td>濃紺<\/td><td>色のプリセットに NAVY があるが、<strong>まとめて当てるときはプリセットが負ける<\/strong>（後から <code>fabric_solid_color<\/code> が上書きする）。値を直接書いた<\/td><\/tr><tr><td>厚み (mm)<\/td><td>1.2mm<\/td><td>薄いほど布らしいが、0 にすると板1枚になって影が出ない<\/td><\/tr><tr><td>織りの細かさ / 織り目の強さ<\/td><td>3.5 / 1.6<\/td><td>デニムの綾織りに寄せた。強さを 0 にすると、ただの紺色の板になる<\/td><\/tr><tr><td>形状<\/td><td>ドーム<\/td><td>花びらの先端を丸く見せる<\/td><\/tr><tr><td>半径 (mm) / 間隔(mm)<\/td><td>0.35 / 0.6<\/td><td>ピッチ 1.3mm。<strong>花弁の縁がぎざぎざにならない細かさ<\/strong>にした<\/td><\/tr><tr><td>先細り比率<\/td><td>0.75<\/td><td>上へ向かって細る。花の毛羽立ちに寄せている<\/td><\/tr><tr><td>最大高さ (mm) / 高さ均一<\/td><td>4.0 / ON<\/td><td>現物の刺繍は高さが揃っている<\/td><\/tr><\/table>\n<h3>分かったこと<\/h3>\n<p><strong>生地の下地は「見るためだけ」のもの。<\/strong>書き出しにも材料の見積もりにも 入らない。デザインを決めるときに現物の見え方へ近づける道具で、 造形されるのは柱だけ。<\/p>\n<p><strong>だからこそ効く。<\/strong>同じ設定のまま生地の色を白にすると、この作例は 「白地に花」というまったく別のデザインに見える。<strong>生地は背景ではなく、 配色の半分<\/strong>。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 1.7秒 / 生成物 1個 / 評価後の頂点 51,545<\/li><li><strong>この数に生地は入っていない。<\/strong>道具は <code>BristleField*<\/code> という名前の メッシュだけを数えるので、<code>Stratasys_Fabric_Base<\/code> は別勘定<\/li><li>造形条件の警告なし<\/li><li>見本は斜め (<code>preview.jpg<\/code>) の1枚。<strong>生地の織り目は斜めからしか読めない<\/strong><\/li><\/ul>","imgs":[{"c":"斜め","d":"img/23_preview.jpg"}]},{"num":"24","title":"現物 帯にだけ刷る","mode":"BRISTLE","path":"docs/samples/24_現物_帯にだけ刷る","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\IMG_1765.JPG<\/code>。生成りのニットに、<strong>半透明の 蜂の巣の帯が1本だけ<\/strong>渡してある。帯の外はニットのまま——<strong>同じ柄を 全面に刷ってはいない。<\/strong><\/p>\n<p><strong>［領域マスク］を主役にした作例。<\/strong> 柄は全面に一様な蜂の巣で、 <strong>どこを本気で刷るかは2枚目の白黒画像が決めている。<\/strong><\/p>\n<h3>元画像<\/h3>\n<p><code>source.png<\/code> = 蜂の巣（512x512・不透明）。三角格子のボロノイで、 壁は<strong>ほぼ黒い青緑<\/strong>、セルは生成り。<\/p>\n<p><code>region_mask.png<\/code> = 横帯の白黒画像。<strong>白＝そのまま／黒＝下の3つの 比率が効く／灰＝その中間<\/strong>。段は 5つ:<\/p>\n<table><tr><th>v の範囲<\/th><th>明るさ<\/th><th>出てくる物<\/th><\/tr><tr><td>0.00〜0.17<\/td><td>0.0<\/td><td>まばらな短い粒<\/td><\/tr><tr><td>0.17〜0.30<\/td><td>0.5<\/td><td>半分の高さ、半分の密度<\/td><\/tr><tr><td><strong>0.30〜0.70<\/strong><\/td><td><strong>1.0<\/strong><\/td><td><strong>設定どおりの柱。蜂の巣が読める<\/strong><\/td><\/tr><tr><td>0.70〜0.83<\/td><td>0.5<\/td><td>半分<\/td><\/tr><tr><td>0.83〜1.00<\/td><td>0.0<\/td><td>まばら<\/td><\/tr><\/table>\n<p>境目は 0.012（実寸 1.1mm ＝ 柱1本ぶん）だけぼかしてある。<strong>段が 「にじみ」に見えないぎりぎりの幅<\/strong>で、階段そのものは残る。<\/p>\n<pre>cd &lt;作業用のフォルダ&gt;\npython docs/samples/tools/make_art_23_28.py<\/pre>\n<p><code>a24.png<\/code> が <code>source.png<\/code>、<code>m24.png<\/code> が <code>region_mask.png<\/code>。<\/p>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>領域マスクを使う<\/strong><\/td><td><strong>ON<\/strong><\/td><td>以下の3つが「マスクが黒い所」にだけ効く。白い所は素通し<\/td><\/tr><tr><td><strong>マスクのもと<\/strong><\/td><td><strong>画像ファイル<\/strong><\/td><td><code>region_mask.png<\/code> を読む。［内蔵パターン］にすると波・市松・ボロノイなどを式で作る<\/td><\/tr><tr><td><strong>黒い部分の高さ比<\/strong><\/td><td><strong>0.15<\/strong><\/td><td>黒い所の柱は 3.2mm → 0.48mm。<strong>帯の外が「刷ってある」に見えない高さ<\/strong>まで落とす<\/td><\/tr><tr><td><strong>黒い部分の太さ比<\/strong><\/td><td><strong>0.35<\/strong><\/td><td>同じ所で細くもする。高さだけ落とすと「低いが太い粒」で、かえって目立つ<\/td><\/tr><tr><td><strong>黒い部分の間引き<\/strong><\/td><td><strong>0.90<\/strong><\/td><td>黒い所は9割を確率で消す。0 にすると密度が残り、帯の外がグレーの面に見える<\/td><\/tr><tr><td>形状 / 半径 (mm) / 間隔(mm)<\/td><td>円柱 / 0.55 / 0.7<\/td><td>ピッチ 1.8mm<\/td><\/tr><tr><td>最大高さ (mm) / 高さ均一<\/td><td>3.2 / ON<\/td><td>帯の中で高さを揃え、<strong>差は領域マスクだけが作る<\/strong>ようにした<\/td><\/tr><\/table>\n<h3>分かったこと<\/h3>\n<p><strong>セルの大きさは 21.6mm にした。<\/strong>柱のピッチ 1.8mm の 12倍。 <code>欲しい機能_20260904.md<\/code> の実測（4倍が下限、8倍で読める）に従っている。 最初は 12mm（6.75倍）で作り、<strong>真上から見ると壁がただの染みだった。<\/strong><\/p>\n<p><strong>3つの比率は「消す」だけの機能ではない。<\/strong>アルファで抜けば帯の外は 何も無くなるが、それでは「刷っていない」であって「弱く刷ってある」に ならない。現物のニットにも、帯の外にうっすら地の柄がある。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 3.5秒 / 生成物 1個 / 評価後の頂点 928,896<\/li><li>造形条件の警告なし<\/li><li>見本は斜め (<code>preview.jpg<\/code>) と真上 (<code>preview_top.jpg<\/code>) の2枚。 <strong>帯の段が読めるのは真上、蜂の巣が読めるのは斜め<\/strong><\/li><\/ul>","imgs":[{"c":"斜め","d":"img/24_preview.jpg"},{"c":"真上","d":"img/24_preview_top.jpg"}]},{"num":"25","title":"現物 金と黒の等高線","mode":"BRISTLE","path":"docs/samples/25_現物_金と黒の等高線","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\★53e7a4dd8942667913c7bee221b27126.jpg<\/code>。 レオタードの上に、<strong>金と黒の細長い粒が入れ子の等高線に沿って 並んでいる。<\/strong>粒は円ではなく短い棒で、<strong>棒の向きが線の向きと揃って いる<\/strong>のがこの現物の要。<\/p>\n<p><strong>［向きの揃え方］＝［流れに沿う］を主役にした作例。<\/strong> 同じ棒を格子に置くだけでは、 向きが揃った縞にしかならない。<\/p>\n<h3>元画像<\/h3>\n<p>2つのガウスの山＋斜めの傾きを足した明るさの場を、 <code>0.5+0.5cos(f x 2π x 3.2)<\/code> で輪切りにして等高線の帯にし、 <strong>暗い紫 → 金<\/strong>へ流した（512x512・不透明）。<\/p>\n<p><strong>［流れに沿う］は明るさの等高線を読む<\/strong>ので、絵のほうも 「等高線がはっきりある絵」でなければ意味がない。<\/p>\n<pre>cd &lt;作業用のフォルダ&gt;\npython docs/samples/tools/make_art_23_28.py<\/pre>\n<p><code>a25.png<\/code> が <code>source.png<\/code>。<\/p>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>向きの揃え方<\/strong><\/td><td><strong>流れに沿う<\/strong><\/td><td>明るさが同じ方向（等高線）へ棒を向ける。［明暗の傾き］にすると<strong>直交<\/strong>して、同じ絵が放射状の櫛に変わる<\/td><\/tr><tr><td><strong>X倍率 / Y倍率<\/strong><\/td><td><strong>2.2 / 0.55<\/strong><\/td><td>断面を 4倍に引き伸ばす。<strong>これが無いと向きは効かない<\/strong>——正方形を回しても同じ場所に同じ形が来るだけ<\/td><\/tr><tr><td>形状<\/td><td>四角<\/td><td>棒に見えるいちばん素直な形。円・ドーム・リングは回転対称なので<strong>向きが画面に出ない<\/strong>（<code>欲しい機能_20260904.md<\/code> の 2番）<\/td><\/tr><tr><td>半径 (mm) / 間隔(mm)<\/td><td>0.6 / 0.6<\/td><td>引き伸ばし後の実寸は 2.6 x 0.66mm<\/td><\/tr><tr><td>先細り比率<\/td><td>0.9<\/td><td>ほぼ真っすぐ。棒の輪郭を保ちたい<\/td><\/tr><tr><td>最大高さ (mm) / 高さ均一<\/td><td>3.0 / ON<\/td><td>高さは揃える。<strong>変えるのは向きだけ<\/strong>にして、効果を1つに絞った<\/td><\/tr><tr><td>カラーモード<\/td><td>画像マッピング<\/td><td>1本に1色。金と黒が交互に出る<\/td><\/tr><\/table>\n<h3>分かったこと<\/h3>\n<p><strong>向きの設定は、断面が回転対称だと黙って効かない。<\/strong>円・ドーム・リングの 3つがこれに当たる。設定は正しく効いていて、効いた結果が見えないだけ ——警告も注記も出ないので、<strong>「壊れている」と読んでしまう。<\/strong> 作例19 でも同じことを踏んだ。<\/p>\n<p><strong>引き伸ばしと向きは組で使う。<\/strong>スケールX/Y を 1.0 に戻すと、この作例は ただの格子に戻る。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 2.0秒 / 生成物 1個 / 評価後の頂点 6,272<\/li><li>桁が違って軽い（隣の作例は 20万〜170万）。<strong>四角い断面は1本 8頂点<\/strong>で、 丸い断面の 1/10 以下しか使わない<\/li><li>造形条件の警告なし<\/li><li>見本は斜め (<code>preview.jpg<\/code>) と真上 (<code>preview_top.jpg<\/code>) の2枚。 <strong>向きが読めるのは真上だけ<\/strong>——斜めからだと棒の長さが遠近で潰れる<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/25_preview.jpg"},{"c":"真上","d":"img/25_preview_top.jpg"}]},{"num":"26","title":"現物 薄板の上の毛","mode":"SURFACE","path":"docs/samples/26_現物_薄板の上の毛","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\Julia-Koerner-ARID-Collection-...jpg.webp<\/code>。 <strong>半透明の薄い板の上に、細い毛が一面に生えている。<\/strong>板が形を決め、 毛が手触りを決める——<strong>2つの造形物が重なっている<\/strong>のがこの現物。<\/p>\n<p><strong>［ブラシ複合］を主役にした唯一の作例。<\/strong> 面モードと柱モードを 別々に作ったのでは、この形にならない。<\/p>\n<h3>元画像<\/h3>\n<p>有機的な島（<code>0.86 + 0.12cos(2θ+0.6) + 0.07cos(5θ-1.1)<\/code>）の中を、 2オクターブの値ノイズでクリームと茶にむらづけた（512x512）。 島の外は完全に透明。<\/p>\n<p><strong>輪郭がなだらかな島<\/strong>であることだけが条件。角があると板の縁に 毛が刺さって見える。<\/p>\n<pre>cd &lt;作業用のフォルダ&gt;\npython docs/samples/tools/make_art_23_28.py<\/pre>\n<p><code>a26.png<\/code> が <code>source.png<\/code>。<\/p>\n<h3>面モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>ブラシを追加<\/strong><\/td><td><strong>ON<\/strong><\/td><td>面の上に柱の生成物がもう1つできる（<code>BristleField_Composite_*<\/code>）。<strong>生成物が2個になる<\/strong><\/td><\/tr><tr><td><strong>配置<\/strong><\/td><td><strong>面の上<\/strong><\/td><td>［面の中（透明トップ内）］にすると毛が板に埋まり、先だけ出る。現物は載せる側<\/td><\/tr><tr><td><strong>接合オーバーラップ(mm)<\/strong><\/td><td><strong>0.05<\/strong><\/td><td>板と毛の接合。0 にすると浮いて見え、大きくすると毛が短く見える<\/td><\/tr><tr><td><strong>端マージン(mm)<\/strong><\/td><td><strong>1.0<\/strong><\/td><td>板の縁 1mm には毛を生やさない。<strong>0 にすると縁から毛がはみ出す<\/strong><\/td><\/tr><tr><td>最大高さ(mm) / 高さの決め方<\/td><td>1.2 / フラット（一定の厚み）<\/td><td><strong>板は薄く平ら<\/strong>にした。板にも凹凸を付けると、毛の長さの差が読めなくなる<\/td><\/tr><tr><td>プレビュー解像度<\/td><td>384<\/td><td>輪郭がなめらかな島なので、これで足りる<\/td><\/tr><tr><td>カラーモード<\/td><td>テクスチャ<\/td><td>板に元画像をそのまま貼る。毛の色は下の画素から採る<\/td><\/tr><\/table>\n<h4>上に載せる毛の設定<\/h4>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td>形状 / 半径 (mm) / 間隔(mm)<\/td><td>円柱 / 0.35 / 0.6<\/td><td>ピッチ 1.3mm。<strong>毛は密でないと毛に見えない<\/strong><\/td><\/tr><tr><td>先細り比率<\/td><td>0.5<\/td><td>先を半分まで細らせる。1.0 だと棒の林になる<\/td><\/tr><tr><td>最大高さ (mm)<\/td><td>5.0<\/td><td>板 1.2mm の 4倍。<strong>毛のほうが主役<\/strong>という比率<\/td><\/tr><tr><td><strong>明暗による高さ変化<\/strong><\/td><td><strong>ON<\/strong><\/td><td>元画像の<strong>暗い所ほど毛を長くする<\/strong>。全部が最大高さで揃うとブラシに見えるので、絵のむらをそのまま毛足の長短に使った<\/td><\/tr><\/table>\n<h3>分かったこと<\/h3>\n<p><strong>造形条件の警告が出るが、これは正しい警告。<\/strong><\/p>\n<blockquote>1つの要素が 79x68mm あり、布のようには曲がりません（上限 15.0mm）<\/blockquote>\n<p>板が本当に 79x68mm の一枚板なので、そのままでは服として曲がらない。 <strong>この作例では分割していない<\/strong>——［面を分割する］で切ると毛の生えて いる面が格子状に割れて、現物の連続した毛並みが失われるため。 実際に服にするなら分割が要る、というのが正しい読み方。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 面モード / 90x90mm<\/li><li>生成 2.9秒 / <strong>生成物 2個<\/strong>（板と毛） / 評価後の頂点 1,729,124<\/li><li>造形条件の警告 1件（上記）<\/li><li>見本は斜め (<code>preview.jpg<\/code>) の1枚。<strong>真上からだと板が毛に完全に隠れて、 2つ重なっていることが分からない<\/strong><\/li><\/ul>","imgs":[{"c":"斜め","d":"img/26_preview.jpg"}]},{"num":"27","title":"現物 雪の結晶だけ透明","mode":"BRISTLE","path":"docs/samples/27_現物_雪の結晶だけ透明","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\★IMG_1756.JPG<\/code>。クリスマスの柄で、赤い玉と 緑の地の中に、<strong>雪の結晶だけが透き通った素材で刷ってある。<\/strong> 高さは他と同じで、<strong>違うのは材だけ。<\/strong><\/p>\n<p><strong>［透明］の［出どころ］＝画像を主役にした作例。<\/strong> 作例18 の透明は 「高さのどこから上」で切っていたので、<strong>平面のどこか<\/strong>を指す手段が 無かった。<\/p>\n<h3>元画像<\/h3>\n<p><code>source.png<\/code> = ノイズを乗せた深緑の地に、赤い玉を6つ（512x512・不透明）。<\/p>\n<p><code>transparent_mask.png<\/code> = <strong>6本腕の雪の結晶を4つ<\/strong>、白地に黒で描いた 線画。腕ごとに枝が2対。<\/p>\n<p><strong>黒い所が、その場所の高さ全体にわたって透明材になる。<\/strong><\/p>\n<pre>cd &lt;作業用のフォルダ&gt;\npython docs/samples/tools/make_art_23_28.py<\/pre>\n<p><code>a27.png<\/code> が <code>source.png<\/code>、<code>m27.png<\/code> が <code>transparent_mask.png<\/code>。<\/p>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>透明材を使う<\/strong><\/td><td><strong>ON<\/strong><\/td><td>これが OFF だと以下は全部効かない<\/td><\/tr><tr><td><strong>透明の出どころ<\/strong><\/td><td><strong>画像で決める<\/strong><\/td><td><code>transparent_mask.png<\/code> を読む。［高さで決める］にすると作例18 と同じ「上から何割」になる<\/td><\/tr><tr><td><strong>透明マスク反転<\/strong><\/td><td>OFF<\/td><td>ON にすると<strong>結晶だけが色付き<\/strong>で、地のほうが透明になる<\/td><\/tr><tr><td>形状 / 半径 (mm) / 間隔(mm)<\/td><td>ドーム / 0.8 / 0.7<\/td><td>ピッチ 2.3mm。<strong>現物のビーズに寄せて大きめの粒<\/strong>にした<\/td><\/tr><tr><td>最大高さ (mm) / 高さ均一<\/td><td>3.0 / ON<\/td><td><strong>高さは全部同じ。<\/strong>違いを材だけに絞ると、透明が効いていることがはっきり出る<\/td><\/tr><tr><td>カラーモード<\/td><td>画像マッピング<\/td><td>緑の地と赤い玉が、そのまま粒の色になる<\/td><\/tr><\/table>\n<h3>分かったこと<\/h3>\n<p><strong>［出どころ］＝画像のとき、［範囲］［方式］［色付き部分］は画面から 消える。<\/strong>効かない設定を灰色で残さず隠す、というこのアドオンの流儀 （v7.22.1）どおり。逆に言うと、<strong>この3つを触りたいなら［出どころ］を ［高さ］に戻すしかない<\/strong>——「下半分だけ、しかも結晶の形で」は作れない。<\/p>\n<p><strong>マスクは柄と別解像度でよい。<\/strong>元画像 512、マスク 512 で作ったが、 両者は UV で突き合わされるので、比率さえ合っていれば大きさは自由。<\/p>\n<p><strong>色材と透明材の2つは分けられるが、色材どうしは分けられない<\/strong> （<code>欲しい機能_20260904.md<\/code> の 1番）。この作例が成立するのは、 分けたい相手がちょうど透明材だったから。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 3.1秒 / 生成物 1個 / 評価後の頂点 206,400<\/li><li>造形条件の警告なし<\/li><li>見本は斜め (<code>preview.jpg<\/code>) と真上 (<code>preview_top.jpg<\/code>) の2枚。 <strong>結晶の形が読めるのは真上<\/strong><\/li><\/ul>","imgs":[{"c":"斜め","d":"img/27_preview.jpg"},{"c":"真上","d":"img/27_preview_top.jpg"}]},{"num":"28","title":"現物 翅の縁がなだらか","mode":"BRISTLE","path":"docs/samples/28_現物_翅の縁がなだらか","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\1accd0c9af487d49edc5671cf1d8c417.jpg<\/code>。 蝶の翅を模したケープ。<strong>中央は毛足が長く、縁へ行くほど短くなって、 生地に溶けるように終わっている。<\/strong>縁でぷつりと切れていない。<\/p>\n<p><strong>［縁で低くする（島ごと）］を主役にした作例。<\/strong> 高さを変える設定は他にもあるが、 これだけが<strong>「島の輪郭からの距離」<\/strong>で高さを決める。<\/p>\n<h3>元画像<\/h3>\n<p>翅の形の島（<code>0.80 + 0.20|cosθ| + 0.13cos2θ - 0.10cos(4θ+0.8)<\/code>）を、 放射状の帯で <strong>黒 → 青緑 → 黒 → 橙<\/strong>へ流した（512x512）。島の外は透明。<\/p>\n<p><strong>島が1つであることが条件。<\/strong>縁からの距離が意味を持つのは、輪郭が 1本にまとまっているときだけ。<\/p>\n<pre>cd &lt;作業用のフォルダ&gt;\npython docs/samples/tools/make_art_23_28.py<\/pre>\n<p><code>a28.png<\/code> が <code>source.png<\/code>。<\/p>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>縁で低くする（島ごと）<\/strong><\/td><td><strong>ON<\/strong><\/td><td>島ごとに、輪郭からの距離で高さを掛ける<\/td><\/tr><tr><td><strong>縁の幅 (mm)<\/strong><\/td><td><strong>14.0<\/strong><\/td><td>縁から 14mm 入った所で満高になる。<strong>90mm の島に対して 1/6<\/strong>——狭いと「縁が欠けた」に見え、広すぎると中央しか立たない<\/td><\/tr><tr><td><strong>縁の最低比率<\/strong><\/td><td><strong>0.12<\/strong><\/td><td>いちばん縁の柱の高さ。6.0mm x 0.12 = 0.72mm。0 にすると縁が完全に消えて、輪郭がぼやける<\/td><\/tr><tr><td>形状 / 半径 (mm) / 間隔(mm)<\/td><td>円柱 / 0.5 / 0.65<\/td><td>ピッチ 1.65mm<\/td><\/tr><tr><td>先細り比率<\/td><td>0.8<\/td><td>先を少し細らせる。毛足の柔らかさ<\/td><\/tr><tr><td><strong>最大高さ (mm)<\/strong><\/td><td><strong>6.0<\/strong><\/td><td><strong>高いほど傾斜が読める。<\/strong>3mm 以下だと縁と中央の差が目で追えない<\/td><\/tr><tr><td>高さ均一<\/td><td>ON<\/td><td>← <strong>これが ON でも縁の傾斜は効く<\/strong>（下記）<\/td><\/tr><\/table>\n<h3>分かったこと<\/h3>\n<p><strong>［高さ均一］が ON でも、縁で低くするは効く。<\/strong>名前からは「全部同じ 高さ」と読めるが、説明文にあるとおり止めているのは<strong>画像の明暗による 高さ変化<\/strong>のほうで、縁の傾斜はその後から掛かる。実際この作例は 均一 ON のまま、縁と中央で 8倍以上（1 ÷ 0.12）の差がついている。<\/p>\n<p><strong>［縁で低くする（島ごと）］と［縁だけ残す（島ごと）］は別物。<\/strong> 後者は帯だけを残して中身を消す。こちらは全部残して高さだけ変える。 <strong>名前も並びも隣どうし<\/strong>なので、探すときに取り違えやすい。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x90mm<\/li><li>生成 2.6秒 / 生成物 1個 / 評価後の頂点 1,182,360<\/li><li>造形条件の警告なし<\/li><li>見本は斜め (<code>preview.jpg<\/code>) の1枚。<strong>傾斜は高さの話なので、真上からでは まったく読めない<\/strong><\/li><\/ul>","imgs":[{"c":"斜め","d":"img/28_preview.jpg"}]},{"num":"29","title":"現物 黒一色のクラッチ","mode":"SURFACE","path":"docs/samples/29_現物_黒一色のクラッチ","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\Julia-Koerner-HY-Clutch-2021_website.jpg<\/code>。 Julia Koerner の HY Clutch（2021）。左手に持っている<strong>真っ黒のクラッチ<\/strong>で、 片隅を要にした扇状の襞だけで形ができている。襞と襞のあいだは細長く抜けている。<\/p>\n<p><strong>［高さの決め方］＝高さマップ（別画像から）を主役にした作例。<\/strong> 18件の作例が一度も使っていなかった設定で、<strong>この現物はこれでしか作れない。<\/strong><\/p>\n<h3>なぜ高さマップでしか作れないのか（測った）<\/h3>\n<p>面モードの既定の作り方（［レリーフ］）は、<strong>色の画像の明るさを高さに読む<\/strong>。 ところがこの現物は<strong>全体が一色<\/strong>なので、明るさに高低差の情報が無い。<\/p>\n<p>同じ <code>source.png<\/code> を使い、［高さの決め方］だけを入れ替えて頂点のZを測った。<\/p>\n<table><tr><th>高さの決め方<\/th><th>上面のZ<\/th><th>結果<\/th><\/tr><tr><td>レリーフ（明るさから）<\/td><td><strong>4.80mm ちょうどで全点一致<\/strong><\/td><td><strong>完全に平らな板。<\/strong>襞は1本も出ない<\/td><\/tr><tr><td>高さマップ（別画像から）<\/td><td>1.46 〜 5.72mm<\/td><td>襞が出る<\/td><\/tr><\/table>\n<p>色の画像の明るさの幅は <strong>0.0095<\/strong>、高さの画像の幅は <strong>0.8784<\/strong>（92倍）。 <code>tools/make_art_29_32.py<\/code> が両方の数字を書き出しに印字する。<\/p>\n<p><strong>だから元画像は2枚ある。<\/strong>色を決める <code>source.png<\/code> と、形を決める <code>depth_map.png<\/code>。前者に襞を写し込んではいけない——写すと明るさからでも 作れてしまい、この作例が何も主張しなくなる。<\/p>\n<h3>元画像<\/h3>\n<pre>cd &lt;作業用のフォルダ&gt;\npython docs/samples/tools/make_art_29_32.py 29<\/pre>\n<ul><li><code>source.png<\/code> … 中明度の灰色。むらは襞と<strong>無関係な<\/strong>低周波だけ（600x400）<\/li><li><code>depth_map.png<\/code> … 扇の要を画面の外の左に置き、27本の襞を放射状に走らせた<\/li><\/ul>\n<p><strong>現物は真っ黒だが、ここでは灰色にしてある。<\/strong>主張は「一様であること」で あって「黒いこと」ではないので、明るさを上げても作例の意味は変わらない。 真っ黒のままだと見本のレンダーで形がまったく読めなかった（実際に撮って 確かめた。1枚目は真っ黒で襞が判別できず、作り直している）。<\/p>\n<h3>面モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>高さの決め方<\/strong><\/td><td><strong>高さマップ（別画像から）<\/strong><\/td><td>高さを2枚目の画像から読む<\/td><\/tr><tr><td><strong>高さマップ<\/strong><\/td><td><code>depth_map.png<\/code><\/td><td>白いほど高い<\/td><\/tr><tr><td><strong>高さマップの強さ<\/strong><\/td><td><strong>5.0<\/strong><\/td><td><strong>これが襞の高さ(mm)。<\/strong>下記の落とし穴<\/td><\/tr><tr><td><strong>高さマップのぼかし<\/strong><\/td><td><strong>0.10<\/strong><\/td><td>切れ込みの壁の段差をならす。<strong>0.35 では襞の峰まで削れた<\/strong>（上面の最高が 5.72mm → 4.17mm）<\/td><\/tr><tr><td>最大高さ (mm)<\/td><td>1.2<\/td><td><strong>襞の高さではなく、下の板の厚み<\/strong><\/td><\/tr><tr><td>幅 / 奥行き (mm)<\/td><td>150 / 100<\/td><td>クラッチの実寸に寄せた。18件が全部 90x90 だったので、寸法も変えている<\/td><\/tr><tr><td>解像度（プレビュー / 最終）<\/td><td>512 / 1024<\/td><td>襞の周期は 5.6mm。512 なら 19画素／本<\/td><\/tr><tr><td>色<\/td><td>テクスチャ<\/td><td>一色なので、色は形の説明に一切関与しない<\/td><\/tr><\/table>\n<h3>分かったこと<\/h3>\n<p><strong>［高さマップの強さ］は倍率ではなく、載せる高さそのもの(mm)。<\/strong> これがいちばんの落とし穴だった。［最大高さ］を 6mm にすれば襞が 6mm 出る と思って作ったが、出てきたのは<strong>6mm の平らな板の上に 1mm の襞<\/strong>だった （既定の強さが 1.0 のため）。頂点のZを数えると 0mm と 6.4mm の2か所に 固まっていて、そのあいだが空だった——<strong>絵を見ただけでは「平らだ」としか 分からず、原因に届かなかった。<\/strong><\/p>\n<p>［最大高さ］ … 下の板の厚み ［高さマップの強さ］ … その上に載る襞の高さ(mm) 実際の高さ = 最大高さ + 強さ x 高さマップの値<\/p>\n<p>説明文には「高さの倍率(mm)」と書いてあるが、パネルの表示は「強さ」だけで 単位が出ない。<strong>足し算であることはどこにも書かれていない。<\/strong><\/p>\n<p><strong>切れ込みの境目をノイズで決めると、壁が櫛の歯になる。<\/strong>最初は値ノイズの しきい値で切っていて、境目が画素の単位でぎざぎざになった。［輪郭を画像に 沿わせる］は既定でONだが、<strong>元の輪郭がぎざぎざなら沿わせても直らない。<\/strong> 1本の襞は「角度が一定・距離が動く」線なので、<strong>距離の正弦波<\/strong>で破線に すれば境目はなめらかな曲線になる。直したのは設定ではなく元画像のほう。<\/p>\n<p><strong>切れ込みは島の縁から離す。<\/strong>縁ぎりぎりを切ると、切れ込みと輪郭の あいだに細い帯が残る。実測 0.59mm で、造形条件の下限 0.6mm を割って 警告が出た。<\/p>\n<h3>現物と違うところ<\/h3>\n<p><strong>現物は折り畳まれた立体、これは板。<\/strong>面モードが作るのは平らな板の レリーフなので、クラッチとして閉じる形にはならない。襞の走り方と抜きの 入り方だけを再現している。<\/p>\n<p><strong>［面を分割する］は使っていない。<\/strong>145x91mm の1枚板なので 「布のようには曲がりません（上限 15.0mm）」の警告が出る。<strong>この警告は 正しい<\/strong>——分割すれば消えるが、扇の襞は板をまたいで連続しているのが 見どころなので、分割しないほうを選んだ。実際に作るなら要分割。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 面モード / 150x100mm<\/li><li>生成 5.1秒 / 生成物 1個 / 頂点 225,094（プレビュー 512x341）<\/li><li>上面のZ 1.46 〜 5.72mm（板 1.2mm ＋ 襞 約4.5mm）<\/li><li>造形条件の警告 1件（要素サイズ。上記のとおり承知の上）<\/li><li>見本は斜め (<code>preview.jpg<\/code>) と真上 (<code>preview_top.jpg<\/code>) の2枚。 <strong>真上のほうが扇の走り方と抜きの位置が読める<\/strong><\/li><\/ul>","imgs":[{"c":"斜め","d":"img/29_preview.jpg"},{"c":"真上","d":"img/29_preview_top.jpg"}]},{"num":"30","title":"現物 光沢のある黒いリブ","mode":"BRISTLE","path":"docs/samples/30_現物_光沢のある黒いリブ","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\722705b78bf2de2e5bac938ca50b91b1.jpg<\/code>。 肌色の生地の上に、<strong>光沢のある黒いリブ<\/strong>が山形（シェブロン）に並んでいる。 リブは<strong>背骨のところで太く、外へ向かうほど細って先が尖る。<\/strong>黒一色なので、 形の情報はすべて「太さの変化」で表されている。<\/p>\n<p><strong>［半径の明度反転］(<code>radius_invert_brightness<\/code>) を主役にした作例。<\/strong> 29件の作例が一度も使っていなかった設定。<\/p>\n<h3>なぜ「反転」が要るのか（測った）<\/h3>\n<p>［明暗による半径変化］は、既定では<strong>暗いほど太い<\/strong>（黒＝インクが濃い＝太い、 というハーフトーンの発想）。ところがこの現物は逆で、<strong>背骨（明るい芯）が 太く、外へ向かう暗い側が細い。<\/strong><\/p>\n<p>同じ <code>source.png<\/code> で、反転だけを入れ替えて柱1本ずつの直径を測った （2050本・両方とも同じ本数）。<\/p>\n<table><tr><th>［半径の明度反転］<\/th><th>直径の幅<\/th><th>中心寄り u&amp;lt;0.25<\/th><th>中間 0.25–0.60<\/th><th>外側 u&amp;gt;0.60<\/th><\/tr><tr><td><strong>ON（この作例）<\/strong><\/td><td>0.604–0.846mm<\/td><td><strong>0.786mm<\/strong><\/td><td>0.659mm<\/td><td>0.611mm<\/td><\/tr><tr><td>OFF（陰性対照）<\/td><td>0.652–0.895mm<\/td><td>0.712mm<\/td><td>0.839mm<\/td><td><strong>0.887mm<\/strong><\/td><\/tr><\/table>\n<p><strong>太さの勾配が丸ごとひっくり返る。<\/strong>ONは中心が太く外が細い（現物と同じ）、 OFFは外が太く中心が細い。柱の本数も高さも配置も変わらないので、 <strong>変わったのは太さだけ<\/strong>だと言い切れる。<\/p>\n<h3>太さは計算で言い当てられる（検算）<\/h3>\n<p>直径 = 2R x ( min_ratio + (1 - min_ratio) x L ) L = 明るさ（反転ONならそのまま、OFFなら 1-L）<\/p>\n<p>R=0.45 / min_ratio=0.665 を入れ、<strong>明るさは sRGB ではなくリニア<\/strong>を使う。<\/p>\n<table><tr><th><\/th><th>元画像の明るさ<\/th><th>リニア<\/th><th>計算<\/th><th>実測<\/th><\/tr><tr><td>ON の最太<\/td><td>0.934<\/td><td>0.855<\/td><td>0.856mm<\/td><td>0.846mm<\/td><\/tr><tr><td>ON の最細<\/td><td>0.133<\/td><td>0.016<\/td><td>0.604mm<\/td><td>0.604mm<\/td><\/tr><tr><td>OFF の最太<\/td><td>0.133<\/td><td>0.016<\/td><td>0.896mm<\/td><td>0.895mm<\/td><\/tr><\/table>\n<p><strong>この一致は「明るさはリニア値で読まれる」ことの証拠でもある。<\/strong>sRGB の値を そのまま入れると ON の最細が 0.705mm になり、実測と 0.1mm ずれる。 画面のどこにもこのことは書かれていない（後述）。<\/p>\n<h3>元画像<\/h3>\n<pre>cd &lt;作業用のフォルダ&gt;\npython docs/samples/tools/make_art_29_32.py 30<\/pre>\n<p><code>source.png<\/code>（600x867 / 明るさ 0.133〜0.934 / 不透明 41.2%）。 山形の1本ずつを、<strong>背骨で明るく・先端で暗く<\/strong>塗ってある。リブとリブの あいだは穴（アルファ0）なので柱が立たない。<\/p>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>明暗による半径変化<\/strong><\/td><td><strong>ON<\/strong><\/td><td>これが無いと反転そのものが効かない<\/td><\/tr><tr><td><strong>半径の明度反転<\/strong><\/td><td><strong>ON<\/strong><\/td><td>明るいほど太い。<strong>この作例の主役<\/strong><\/td><\/tr><tr><td><strong>最小半径比率<\/strong><\/td><td><strong>0.665<\/strong><\/td><td>細い側の下限。下記の落とし穴<\/td><\/tr><tr><td>要素の半径 (mm)<\/td><td>0.45<\/td><td>最太 0.90mm。太さの幅をとるために大きめ<\/td><\/tr><tr><td>要素の間隔 (mm)<\/td><td>0.6<\/td><td>ピッチ = 2x0.45+0.6 = <strong>1.50mm<\/strong><\/td><\/tr><tr><td>断面の形<\/td><td>ドーム<\/td><td>先が丸い。光沢の粒に見せる<\/td><\/tr><tr><td>最大高さ (mm)<\/td><td>1.8<\/td><td><strong>［高さを揃える］ON<\/strong> なので全部 1.800mm ちょうど<\/td><\/tr><tr><td>高さを揃える<\/td><td>ON<\/td><td><strong>高さを固定しないと、太さの話に高さが混ざる<\/strong><\/td><\/tr><tr><td>色<\/td><td><strong>高さのグラデーション<\/strong><\/td><td>下記<\/td><\/tr><tr><td>幅 / 奥行き (mm)<\/td><td>90 / 130<\/td><td>現物の帯に寄せた<\/td><\/tr><\/table>\n<p><strong>色を［テクスチャ］にしてはいけない。<\/strong>元画像の明るさをそのまま色にすると、 太い柱が明るく細い柱が暗くなり、<strong>太さの違いなのか色の違いなのか区別が つかなくなる。<\/strong>［高さのグラデーション］なら高さは全部同じなので、 柱はどれも同じ色になり、<strong>画面に出る違いは太さだけ<\/strong>になる。<\/p>\n<h3>分かったこと<\/h3>\n<p><strong>［最小半径比率］を下げると、造形できない細さの柱が黙って出る。<\/strong> 最初は 0.30 で作った。実測の最細は <strong>0.281mm<\/strong> で、造形条件の下限 （1要素 0.6mm）を大きく割っている。<strong>警告は出ない<\/strong>——造形条件の チェックは［要素の半径］の設定値（0.45 → 直径 0.90mm）を読んでいて、 細められたあとの実寸を見ていないため。<\/p>\n<table><tr><th>最小半径比率<\/th><th>最細<\/th><th>造形の下限 0.6mm<\/th><th>細くされた柱<\/th><\/tr><tr><td>0.30<\/td><td><strong>0.281mm<\/strong><\/td><td><strong>割っている<\/strong><\/td><td>1994本 (97.3%)<\/td><\/tr><tr><td><strong>0.665（この作例）<\/strong><\/td><td>0.604mm<\/td><td>満たす<\/td><td>—<\/td><\/tr><\/table>\n<p><strong>だから比率は自分で計算して決めた。<\/strong>0.6 ÷ 0.90 = 0.667 なので、 0.665 が「下限を割らない範囲でいちばん細い」値。<strong>この作例で使える 太さの幅は 0.60〜0.90mm の 1.5倍しかない。<\/strong><\/p>\n<p>道具側で 0.6mm に丸めてくれるわけではない、という点が要注意。 （［輪郭に合わせる］のほうは丸めてくれる。作例31 参照——同じ 「柱を細める」処理なのに、2つの経路で扱いが違う。）<\/p>\n<p><strong>［半径の明度反転］はチェックボックスの子項目で、［明暗による半径変化］が OFF のときは画面に出ない。<\/strong>だから「太さを反転したい」と思って設定を探すと、 先に親のチェックを見つける必要がある。<\/p>\n<p><strong>高さを揃えないと主張が濁る。<\/strong>［高さを揃える］を OFF にすると、明るい所は 太くなると同時に高くもなるので、真上から見た絵では「太くなった」のか 「近づいた」のか読めない。<\/p>\n<h3>現物と違うところ<\/h3>\n<p><strong>現物のリブは連続した1本の隆起、これは粒の列。<\/strong>柱モードは点の集まりなので、 リブは「太い粒が並んだ線」になる。ピッチ 1.50mm に対してリブの幅が 3〜4mm なので、リブ1本に柱が2〜3列。<strong>現物の滑らかさは出ない。<\/strong><\/p>\n<p><strong>光沢は再現していない。<\/strong>現物の見どころは黒い樹脂のてかりだが、色と材質は この作例の主張ではないので、グラデーションで灰色に振ってある（作例29 と 同じ判断。真っ黒にすると見本のレンダーで形がまったく読めない。実際に 1枚目を撮って確かめている）。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 90x130mm<\/li><li>格子 61x87 / 生成 約2秒 / 生成物 1個 / 頂点 133,250<\/li><li>柱 2050本 / 高さ 1.800mm ちょうど（全数一致）/ ピッチ 1.500mm<\/li><li>直径 0.604〜0.846mm（下限 0.60mm に当たっている本あり）<\/li><li>見本は斜め (<code>preview.jpg<\/code>) と真上 (<code>preview_top.jpg<\/code>) の2枚。 <strong>太さの勾配は真上のほうが読める<\/strong><\/li><\/ul>","imgs":[{"c":"斜め","d":"img/30_preview.jpg"},{"c":"真上","d":"img/30_preview_top.jpg"}]},{"num":"31","title":"現物 貝殻のかけら","mode":"BRISTLE","path":"docs/samples/31_現物_貝殻のかけら","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\a51b9f7a5c89760235e2ea0ff4f7f008.jpg<\/code>。 <strong>輪郭のはっきりした島がいくつも並び、島の中だけが柱で埋まっている。<\/strong> 一つひとつの縁が乱れずに立っていて、島どうしのあいだは素の生地。 真珠のような淡い金／クリーム色。<\/p>\n<p><strong>［輪郭に合わせる］(<code>edge_align_enable<\/code>) を主役にした作例。<\/strong> 30件の作例が一度も使っていなかった設定で、<strong>既定は OFF。<\/strong><\/p>\n<h3>なぜ「輪郭に合わせる」が要るのか（測った）<\/h3>\n<p>柱は格子の上に立つので、島の縁が格子と斜めに交わると<strong>縁が階段になる。<\/strong> ［輪郭に合わせる］は、縁の柱を1本ずつ内側へ寄せ、入らないぶんを細くし、 それでも入らない柱を消す——という3段の手当てをする。<\/p>\n<p>同じ <code>source.png<\/code> で、この設定だけを入れ替えて柱1本ずつを測った。<\/p>\n<table><tr><th>［輪郭に合わせる］<\/th><th>柱の数<\/th><th>直径<\/th><th>細くされた柱<\/th><th>列の中で x がずれた柱<\/th><\/tr><tr><td><strong>ON（この作例）<\/strong><\/td><td>1393<\/td><td>0.591–0.800mm<\/td><td><strong>106本 (7.6%)<\/strong><\/td><td><strong>49本 (3.5%)<\/strong><\/td><\/tr><tr><td>OFF（陰性対照）<\/td><td>1450<\/td><td><strong>0.800mm 一定<\/strong><\/td><td>0本<\/td><td>0本<\/td><\/tr><\/table>\n<p>OFF はきれいに <strong>0本 / 0本 / 直径が完全に一定<\/strong>。これが陰性対照として 効いているので、ON 側の数字は全部この設定が作ったものだと言い切れる。<\/p>\n<p><strong>3段とも実際に働いている<\/strong>（消えた柱は 57本＝3.9%）。ちなみに「寄せる」の 判定は、同じ列の柱の x が揃っているかで見ている——動かしていなければ、 1列の柱は全部まったく同じ x を持つ。<\/p>\n<h3>半径 0.30 では「細くする」が一切効かない（踏んだ落とし穴）<\/h3>\n<p>最初は要素の半径 0.30mm で作った。測ると直径が <strong>0.597〜0.600mm<\/strong> で、 ほぼ全部が最大値。<strong>「細くする」段が1本も働いていない。<\/strong><\/p>\n<p>ソースを追うと、細くしてよい下限はこうなっている。<\/p>\n<p>下限 = max( 縁の柱の最小比率 x 2R , 0.6mm )<\/p>\n<p>R=0.30 なら <strong>2R = 0.60mm がそのまま造形の下限<\/strong>なので、下限と最大値が 一致してしまい、縮める余地がゼロになる。<strong>［縁の柱の最小比率］は 0.5 のままなのに、それがまったく読まれない。<\/strong>画面には何も出ない。<\/p>\n<p>R を 0.40 に上げると下限 0.60mm・最大 0.80mm となり、3段とも測れるように なった。<strong>この作例が半径 0.40 なのはそのため<\/strong>で、絵の都合ではない。<\/p>\n<p><strong>ただし、丸めてくれるのはこの経路だけ。<\/strong>もう1つの「柱を細める」設定 ——［明暗による半径変化］の［最小半径比率］——には、この 0.6mm の丸めが <strong>入っていない。<\/strong>作例30 で比率 0.30 にしたら、直径 0.281mm の柱が 警告も無く出た。<strong>同じ「細める」でも、2つの経路で下限の扱いが逆。<\/strong><\/p>\n<h3>元画像<\/h3>\n<pre>cd &lt;作業用のフォルダ&gt;\npython docs/samples/tools/make_art_29_32.py 31<\/pre>\n<p><code>source.png<\/code>（700x700 / 明るさ 0.330〜0.785 / 不透明 24.7%）。 <strong>34個のかけら<\/strong>を散らしてある（差し渡し 8.8〜12.9mm）。かけらの外は アルファ0なので柱が立たない——<strong>縁の本数を稼ぐために、大きな島1つでは なく小さな島をたくさんにしてある。<\/strong><\/p>\n<p>色は<strong>虹色<\/strong>にしてある。最初は灰色の濃淡（0.59〜0.93）だけで作ったが、 見本の背景も中明度の灰色なので、<strong>斜めから撮ると柄が背景に溶けた<\/strong> （実際に撮って捨てた）。貝は色相で光るものなので、色相で振れば背景から 離れ、絵としても現物に近づく。<\/p>\n<p><strong>色相はかけらを横切って1回だけ流す。<\/strong>縞と同じ速さで色相を回した版は 飴の包み紙になった（これも見て捨てた）。虹はゆっくり（周波数 1.1）、 細かい縞は明るさにだけ（周波数 3.4）と分けて掛けている。<\/p>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>輪郭に合わせる<\/strong><\/td><td><strong>ON<\/strong><\/td><td><strong>この作例の主役。<\/strong>縁の柱を寄せる・縮める・消す<\/td><\/tr><tr><td><strong>縁の柱の最小比率<\/strong><\/td><td>0.5<\/td><td>縮めてよい下限。<strong>上記のとおり 2R が 0.6mm 以下だと死ぬ<\/strong><\/td><\/tr><tr><td>要素の半径 (mm)<\/td><td><strong>0.40<\/strong><\/td><td>0.30 では縮めが効かない（上記）<\/td><\/tr><tr><td>要素の間隔 (mm)<\/td><td>0.6<\/td><td>ピッチ = 2x0.40+0.6 = <strong>1.40mm<\/strong><\/td><\/tr><tr><td>断面の形<\/td><td>ドーム<\/td><td>かけらの粒立ちに合う<\/td><\/tr><tr><td>最大高さ (mm)<\/td><td>2.2<\/td><td><strong>［高さを揃える］OFF・［高さのばらつき］ON<\/strong> なので実際は 1.6mm 前後<\/td><\/tr><tr><td>高さのばらつき<\/td><td>ON<\/td><td>貝のかけらが揃って並ばないようにする<\/td><\/tr><tr><td>色<\/td><td>テクスチャ<\/td><td>虹色をそのまま柱に載せる<\/td><\/tr><tr><td>縁の傾斜<\/td><td><strong>OFF<\/strong><\/td><td><strong>ONだと縁が低くなって、輪郭の手当てが絵で読めなくなる<\/strong><\/td><\/tr><tr><td>幅 / 奥行き (mm)<\/td><td>110 / 110<\/td><td>かけら1個が 9〜13mm、ピッチ 1.4mm<\/td><\/tr><\/table>\n<h3>分かったこと<\/h3>\n<p><strong>［縁の傾斜］と［輪郭に合わせる］は同じ「縁」を触るが、逆を向いている。<\/strong> 前者は縁を<strong>低く<\/strong>し、後者は縁を<strong>揃える<\/strong>。両方 ON にすると、揃った縁が 低くなって見えなくなるので、この作例では傾斜を切ってある。<\/p>\n<p><strong>効いているかを絵で判定してはいけない。<\/strong>斜めから見た絵では、階段が 消えたのかどうか正直まったく分からなかった。<strong>「細くされた柱の数」と 「列の中で x がずれた柱の数」を数えて初めて、3段とも働いていると言えた。<\/strong><\/p>\n<p><strong>縁が多いほど効果が出る。<\/strong>この作例で手当てを受けたのは 1450本中 155本 （縮められた 106 + 消えた 57 のうち重複を除く）で、それでも1割ほど。 大きな島1つで作ったら、比率はもっと小さくなって主張が薄れる。<\/p>\n<h3>現物と違うところ<\/h3>\n<p><strong>現物は服のパターン片、これは意味のないかけら。<\/strong>現物の島は裁断される パーツの形をしているが、ここでは輪郭の本数を稼ぐことを優先している。 <strong>［輪郭に合わせる］の効きを見せるための島<\/strong>であって、着るための形ではない。<\/p>\n<p><strong>現物は島の縁にビーズが並んでいる。<\/strong>縁だけ別の要素にする機能 （［縁だけ残す（島ごと）］）はこの作例では使っていない。1件で2つの機能を 主役にすると、どちらが効いたか分からなくなるため。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 110x110mm<\/li><li>格子 79x79 / 生成 約8秒 / 生成物 1個 / 頂点 90,545<\/li><li>柱 1393本（OFF なら 1450本。<strong>57本 3.9% が消える<\/strong>）<\/li><li>直径 0.591〜0.800mm / 高さ 中央値 1.635mm / ピッチ 1.397mm<\/li><li>見本は斜め (<code>preview.jpg<\/code>) と真上 (<code>preview_top.jpg<\/code>) の2枚。 <strong>島の輪郭は真上のほうが読める<\/strong><\/li><\/ul>","imgs":[{"c":"斜め","d":"img/31_preview.jpg"},{"c":"真上","d":"img/31_preview_top.jpg"}]},{"num":"32","title":"現物 縫い代を残した花","mode":"BRISTLE","path":"docs/samples/32_現物_縫い代を残した花","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\43b3ba2e06a40a4edee52624316bebc4.jpg<\/code>。 生成りのキャラコに、橙・青・緑のビーズで花柄が刺してある。見どころは柄 そのものではなく、<strong>柄が布の端まで行かず、まわりに素の生地が残っている<\/strong> こと。ここが縫い代になる。<\/p>\n<p><strong>［組み立て用の余白］(<code>assembly_margin_enable<\/code>) を主役にした作例。<\/strong> 31件の作例が一度も使っていなかった設定。<\/p>\n<h3>なぜ「余白」が要るのか<\/h3>\n<p>刷り上がった生地は裁断されて縫われる。縁まで柱が立っていると、 <strong>ミシンの押さえが乗る場所が無い。<\/strong>この設定は、指定した幅だけ縁の柱を 消し、その内側を緩やかに立ち上げる（＝いきなり全高にせず、傾斜で繋ぐ）。<\/p>\n<p>柱を消すだけなら元画像を白く縁取れば済むが、それだと<strong>画像を作り直さないと 縫い代の幅を変えられない。<\/strong>この設定は生成のたびに mm で指定できる。<\/p>\n<h3>効き方は測れる。ただし数字どおりには出ない（実測）<\/h3>\n<p><code>assembly_margin_mm<\/code> だけを振って、<strong>柱の立っている範囲<\/strong>を測った （生地の下地は柱ではないので数に入れない）。指定 170x130mm。<\/p>\n<table><tr><th>設定<\/th><th>柱の範囲 X<\/th><th>柱の範囲 Y<\/th><th>Y の各辺の余分<\/th><\/tr><tr><td>余白 OFF<\/td><td>170.64mm<\/td><td>130.64mm<\/td><td>—<\/td><\/tr><tr><td>余白 5mm<\/td><td>155.75<\/td><td>115.64<\/td><td><strong>2.50mm<\/strong><\/td><\/tr><tr><td>余白 10mm<\/td><td>145.82<\/td><td>105.64<\/td><td><strong>2.50mm<\/strong><\/td><\/tr><tr><td><strong>余白 15mm（この作例）<\/strong><\/td><td><strong>135.90<\/strong><\/td><td><strong>95.64<\/strong><\/td><td><strong>2.50mm<\/strong><\/td><\/tr><tr><td>余白 20mm<\/td><td>125.97<\/td><td>85.64<\/td><td><strong>2.50mm<\/strong><\/td><\/tr><\/table>\n<p><strong>指定した数字より、片側あたり約 2.5mm 広く空く。<\/strong>しかもその 2.5mm は 余白の値によらず一定なので、<strong>足し算のずれ<\/strong>であって倍率のずれではない。<\/p>\n<p>内訳を2つの追試で分けた。<\/p>\n<table><tr><th>追試<\/th><th>柱の範囲 Y<\/th><th>各辺の余分<\/th><\/tr><tr><td>余白 15mm・<strong>立ち上がり 0mm<\/strong><\/td><td>98.14<\/td><td><strong>1.25mm<\/strong>（＝ピッチ 1.25mm）<\/td><\/tr><tr><td>余白 15mm・<strong>要素の半径 0.6mm<\/strong>（ピッチ 1.80mm）<\/td><td>95.09<\/td><td><strong>3.06mm<\/strong><\/td><\/tr><\/table>\n<p>各辺の余分 ≒ 1ピッチ ＋ 約1.25mm<\/p>\n<ul><li><strong>1ピッチ<\/strong>は格子の量子化。柱は格子の上にしか立てないので、余白の境目が マス目の途中に来ると1列ぶん内側に落ちる。半径を 0.32→0.6 に上げると ピッチが 0.56mm 増え、<strong>余分もちょうど 0.56mm 増えた。<\/strong><\/li><li><strong>約1.25mm<\/strong> は立ち上がりの裾。傾斜のいちばん外側の柱は背が低く、 <strong>最低高さのカットオフを割って消える。<\/strong>立ち上がりを 0 にするとこの分が 消える。<\/li><\/ul>\n<p>（X は 2.37mm で Y の 2.50mm と 0.13mm 違う。格子のマス目が X と Y で わずかに違う（1.241 と 1.250mm）ためで、量子化の丸め1つぶんの差。）<\/p>\n<p><strong>縫い代を 15mm 取りたいなら、指定は 12mm ちょっとでよい<\/strong>——ということに なるが、それは道具の説明のどこにも書かれていない。<\/p>\n<h3>元画像<\/h3>\n<pre>cd &lt;作業用のフォルダ&gt;\npython docs/samples/tools/make_art_29_32.py 32<\/pre>\n<p><code>source.png<\/code>（700x535 / 明るさ 0.258〜0.909 / <strong>不透明 100%<\/strong>）。<\/p>\n<p><strong>この作例の元画像は、わざと全面不透明にしてある。<\/strong>アルファで縁取ると 「余白が空いたのは画像のせいか設定のせいか」が分からなくなる。 画像が四隅まで埋まっていて、それでも縁が空くからこそ、 設定が効いていると言える。<\/p>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>組み立て用の余白<\/strong><\/td><td><strong>ON<\/strong><\/td><td><strong>この作例の主役<\/strong><\/td><\/tr><tr><td><strong>余白の幅 (mm)<\/strong><\/td><td><strong>15.0<\/strong><\/td><td>実際に空くのは約 17.5mm（上記）<\/td><\/tr><tr><td><strong>立ち上がり (mm)<\/strong><\/td><td><strong>8.0<\/strong><\/td><td>余白の内側で高さを繋ぐ幅。0 にすると崖になる<\/td><\/tr><tr><td>要素の半径 (mm)<\/td><td>0.32<\/td><td>ピッチ = 2x0.32+0.6 = <strong>1.24mm<\/strong>。ビーズの細かさに寄せた<\/td><\/tr><tr><td>要素の間隔 (mm)<\/td><td>0.6<\/td><td><\/td><\/tr><tr><td>断面の形<\/td><td>円柱<\/td><td>ビーズの粒<\/td><\/tr><tr><td>最大高さ (mm)<\/td><td>2.6<\/td><td>ばらつき ON なので実際の最大は 2.444mm<\/td><\/tr><tr><td>高さのばらつき<\/td><td>ON<\/td><td>手刺しのビーズの不揃いさ<\/td><\/tr><tr><td>色<\/td><td>テクスチャ<\/td><td>花の色をそのまま<\/td><\/tr><tr><td><strong>生地の下地<\/strong><\/td><td><strong>ON<\/strong>（生成り <code>[0.906, 0.871, 0.796]<\/code>）<\/td><td><strong>余白は「何も無い」のではなく「生地が見えている」。下地が無いと余白が穴に見える<\/strong><\/td><\/tr><tr><td>生地の色プリセット<\/td><td><strong>CUSTOM<\/strong><\/td><td>下記。自分の色を使うときは必ずこれ<\/td><\/tr><tr><td>縁の傾斜<\/td><td><strong>OFF<\/strong><\/td><td>余白と役割がぶつかる（下記）<\/td><\/tr><tr><td>幅 / 奥行き (mm)<\/td><td>170 / 130<\/td><td>造形トレイ 460x360mm の中に収まる大きさ<\/td><\/tr><\/table>\n<h3>分かったこと<\/h3>\n<p><strong>自分の色を使うなら、生地の色プリセットは <code>CUSTOM<\/code> にする。<\/strong> この作例は最初 <code>NATURAL<\/code> のまま色だけ <code>[0.906, 0.871, 0.796]<\/code> を 入れていた（2026-09-04 に直した）。いまの版では色の代入が後に当たるので 見た目は狙いどおりだが、<strong>プリセットの表の色（NATURAL は <code>[0.807, 0.723, 0.571]<\/code>）とは別物<\/strong>なので、「ナチュラルと書いてあるのに 別の色」という状態だった。作例33 で同じ落とし穴を書いておきながら、 自分の1つ前の作例が踏んでいた。<strong>プリセットは色そのものではなく、 色の箱へ書き込む近道<\/strong>だと覚えておくこと。<\/p>\n<p><strong>［縁の傾斜］と［組み立て用の余白］はどちらも縁を落とすので、両方 ON に すると二重に効く。<\/strong>この作例は余白の効きを測りたいので傾斜を切ってある。 実務では逆に、両方使って「外へ向かってなだらかに消える縫い代」にする手も ある。<\/p>\n<p><strong>生地の下地を出さないと、余白が測れているのに見えない。<\/strong>下地 OFF の レンダーでは余白の部分が背景と同じ色になり、「そこまでが生地」であることが 絵から読めなかった。<strong>下地は装飾ではなく、この作例の説明の一部。<\/strong><\/p>\n<p><strong>頂点数が跳ね上がる。<\/strong>170x130mm を 1.24mm ピッチで埋めると 5,614,440頂点 （作例30 の42倍）。半径を小さくすると細かくなるが、<strong>ピッチも同時に縮むので 柱の本数が2乗で増える。<\/strong>プレビューでも約9秒かかった。<\/p>\n<h3>現物と違うところ<\/h3>\n<p><strong>現物の縫い代は布そのもの、これは平らな下地。<\/strong>この作例の下地は 厚み 1.0mm の板なので、実際に縫えるわけではない。<strong>「柄がここで止まる」 という配置の話<\/strong>を再現している。<\/p>\n<p><strong>現物は柄が布の全面に散っている（縁だけ空いている）。<\/strong>この作例も同じだが、 現物の縫い代は 10mm 程度で、ここは 15mm と広めに取ってある——効いていることが 絵で読めるようにするため。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 170x130mm<\/li><li>格子 138x105 / 生成 約9秒 / 生成物 1個 / 頂点 <strong>5,614,440<\/strong><\/li><li>柱の立つ範囲 135.90 x 95.64mm（OFF なら 170.64 x 130.64mm）<\/li><li>柱の高さ 最大 2.444mm / ピッチ 1.24mm<\/li><li>生地の下地 ON（生成り・厚み 1.0mm）<\/li><li>見本は斜め (<code>preview.jpg<\/code>) と真上 (<code>preview_top.jpg<\/code>) の2枚。 <strong>余白の帯は真上のほうが読める<\/strong><\/li><\/ul>","imgs":[{"c":"斜め","d":"img/32_preview.jpg"},{"c":"真上","d":"img/32_preview_top.jpg"}]},{"num":"33","title":"現物 輪郭だけの草花","mode":"BRISTLE","path":"docs/samples/33_現物_輪郭だけの草花","text":"<h3>再現した現物<\/h3>\n<p><code>STRATASYS\\3Dprint_Sample\\c6a7a3a830618de130bcdb48c47f43ad.jpg<\/code>。 淡い虹色の薄物で、<strong>柄が「面」ではなく「線」で描かれている。<\/strong> 草花のかたちは輪郭をなぞる粒の列で表され、<strong>輪郭の内側は素のチュールの まま空いている。<\/strong>ところどころにある小さな点の飾りだけは、抜けずに まるごと粒で埋まっている。<\/p>\n<p><strong>［縁だけ残す（島ごと）］(<code>edge_band_only_enable<\/code>) を主役にした作例。<\/strong> 32件の作例が一度も使っていなかった設定で、<strong>既定は OFF。<\/strong> これで、それまで一度も使われていなかった設定は無くなった。<\/p>\n<h3>なぜ「縁だけ残す」が要るのか（測った）<\/h3>\n<p>輪郭だけの柄は、<strong>元画像を輪郭線で描けば作れそうに見える。<\/strong> けれどそれをやると、この設定が働いているのか、単に細い線を渡した だけなのかが<strong>区別できなくなる。<\/strong>だから元画像は<strong>塗りつぶしの島<\/strong>に してあり、輪郭はアドオンが島ごとに作る。<\/p>\n<p>同じ <code>source.png<\/code> で、この設定だけを入れ替えて柱1本ずつを測った。 あわせて、<code>source.png<\/code> のアルファから<strong>島の外までの距離<\/strong>を自前で 作り（分離可能な厳密EDT。アドオンの距離場は使わない——<strong>測る道具に 測られる実装を使うと循環する<\/strong>）、柱1本ずつがその島の縁から何mm の 所に立っているかを出した。<\/p>\n<table><tr><th>［縁だけ残す］<\/th><th>柱の数<\/th><th>縁からの距離<\/th><th>帯（3.0mm）の外に居る柱<\/th><\/tr><tr><td><strong>ON（この作例）<\/strong><\/td><td>1090<\/td><td>0.17–<strong>3.15mm<\/strong><\/td><td><strong>7本 (0.6%)<\/strong><\/td><\/tr><tr><td>OFF（陰性対照）<\/td><td>2211<\/td><td>0.17–<strong>9.93mm<\/strong><\/td><td><strong>1108本 (50.1%)<\/strong><\/td><\/tr><\/table>\n<p><strong>柱の半分（1121本 50.7%）が消える。<\/strong>残った柱は全部、島の縁から 3.15mm 以内に居る。OFF 側は同じ絵で最深 9.93mm まで届いているので、 <strong>この上限を作っているのはこの設定<\/strong>だと言い切れる。<\/p>\n<p>（帯幅 3.0mm に対して 3.15mm まで残るのは、こちらの距離場が 700x700 の 画素（1画素 0.172mm）で、アドオン側は格子の上で測っているため。 0.15mm ＝ ほぼ1画素ぶんの食い違いで、7本しか居ない。）<\/p>\n<h3>島の大きさで結果が変わる（同じ絵の中で見せた）<\/h3>\n<p><strong>元画像の島は、わざと2種類の大きさにしてある。<\/strong><\/p>\n<p>大きい島（葉）… 幅 14〜20mm。帯を残して中が抜ける 小さい島（芽）… 直径 5.2〜6.8mm。帯より細いので<strong>まるごと残る<\/strong><\/p>\n<table><tr><th>島<\/th><th>差し渡し<\/th><th>ON の柱<\/th><th>OFF の柱<\/th><th>残った割合<\/th><\/tr><tr><td>芽<\/td><td>5.2mm<\/td><td>11<\/td><td>11<\/td><td><strong>100.0%<\/strong><\/td><\/tr><tr><td>芽<\/td><td>5.4mm<\/td><td>12<\/td><td>12<\/td><td><strong>100.0%<\/strong><\/td><\/tr><tr><td>芽<\/td><td>5.6mm<\/td><td>13<\/td><td>13<\/td><td><strong>100.0%<\/strong><\/td><\/tr><tr><td>芽<\/td><td>6.0mm<\/td><td>14<\/td><td>14<\/td><td><strong>100.0%<\/strong><\/td><\/tr><tr><td>芽<\/td><td>6.4mm<\/td><td>17<\/td><td>17<\/td><td><strong>100.0%<\/strong><\/td><\/tr><tr><td>芽<\/td><td>6.6mm<\/td><td>19<\/td><td>19<\/td><td><strong>100.0%<\/strong><\/td><\/tr><tr><td>芽<\/td><td>6.8mm<\/td><td>20<\/td><td>20<\/td><td><strong>100.0%<\/strong><\/td><\/tr><tr><td>葉<\/td><td>幅 14mm<\/td><td>116<\/td><td>209<\/td><td>55.5%<\/td><\/tr><tr><td>葉<\/td><td>幅 15mm<\/td><td>120<\/td><td>234<\/td><td>51.3%<\/td><\/tr><tr><td>葉<\/td><td>幅 16mm<\/td><td>130<\/td><td>263<\/td><td>49.4%<\/td><\/tr><tr><td>葉<\/td><td>幅 16mm<\/td><td>140<\/td><td>280<\/td><td>50.0%<\/td><\/tr><tr><td>葉<\/td><td>幅 17mm<\/td><td>147<\/td><td>315<\/td><td>46.7%<\/td><\/tr><tr><td>葉<\/td><td>幅 19mm<\/td><td>165<\/td><td>385<\/td><td>42.9%<\/td><\/tr><tr><td>葉<\/td><td>幅 20mm<\/td><td>166<\/td><td>419<\/td><td>39.6%<\/td><\/tr><\/table>\n<p><strong>芽は7個とも1本も欠けない。葉は幅が広いほど多く抜ける<\/strong>（14mm で 55.5%、20mm で 39.6% と単調に下がる）。<strong>この設定は「島ごと」に働く<\/strong> ——同じ帯幅でも、島が細ければ何も起きず、太ければ中が空く。<\/p>\n<p><strong>いちばん大きい芽（6.8mm）も全数残った。<\/strong>半径は 3.4mm で帯 3.0mm を 超えるので中心の柱は消えてよいはずだが、ピッチが 1.304mm なので <strong>中心ちょうどに柱が立っていない。<\/strong>「島が帯の2倍より細ければ残る」は おおよその話で、実際に決めるのは格子と島の位置関係。<\/p>\n<h3>元画像<\/h3>\n<pre>cd &lt;作業用のフォルダ&gt;\npython docs/samples/tools/make_art_33.py<\/pre>\n<p><code>a33.png<\/code>（700x700 / 明るさ 0.588〜0.746 / 不透明 26.6%）を <code>source.png<\/code> へ複写する。葉7枚と芽7個。<strong>島の外はアルファ0<\/strong>なので 柱が立たない。<\/p>\n<p><strong>色は島の中でほぼ一様にしてある。<\/strong>輪郭と内側で色を変えると、 「中が抜けた」のか「中の色が変わった」のかが読めなくなる。 変えるのは長さ方向の淡い流れだけ（色相で 0.14 ぶん）。<\/p>\n<p><strong>芽が葉に触れていないことは、絵ではなく数で確かめた。<\/strong>画面では 1画素が 0.17mm なので数画素の接触は見えないが、島としては1つに 繋がってしまい、芽が「小さい島」でなくなる。<code>_check_buds()<\/code> が 芽ごとに 1.5mm の輪をなぞって葉に当たらないか調べる——最初に置いた 位置では<strong>3個が引っかかっていて、そのうち2個は絵を見ても分からなかった。<\/strong><\/p>\n<h3>柱モードの設定（何を変えるとどう見えるか）<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td><strong>縁だけ残す（島ごと）<\/strong><\/td><td><strong>ON<\/strong><\/td><td><strong>この作例の主役。<\/strong>島ごとに中を抜く<\/td><\/tr><tr><td><strong>縁の帯幅 (mm)<\/strong><\/td><td><strong>3.0<\/strong><\/td><td>残す帯。ピッチ 1.304mm なので<strong>約2.3列ぶん<\/strong><\/td><\/tr><tr><td>要素の半径 (mm)<\/td><td>0.35<\/td><td>直径 0.70mm。造形の下限 0.6mm を満たす<\/td><\/tr><tr><td>要素の間隔 (mm)<\/td><td>0.6<\/td><td>ピッチ = 2x0.35+0.6 = <strong>1.304mm<\/strong>（120mm を92等分）<\/td><\/tr><tr><td>断面の形<\/td><td>ドーム<\/td><td>現物の粒（ビーズ）に寄せる<\/td><\/tr><tr><td>最大高さ (mm)<\/td><td><strong>1.4<\/strong><\/td><td>下記。2.0 では棘に見える<\/td><\/tr><tr><td>高さを揃える<\/td><td>ON<\/td><td><strong>高さで柄を作らない。<\/strong>柄は「有る／無い」だけで描く<\/td><\/tr><tr><td>明暗による半径変化<\/td><td><strong>OFF<\/strong><\/td><td>同上。太さでも柄を作らない<\/td><\/tr><tr><td>色<\/td><td>画像<\/td><td>元画像の色をそのまま柱に載せる<\/td><\/tr><tr><td>輪郭に合わせる<\/td><td><strong>OFF<\/strong><\/td><td><strong>縁を触る設定を2つ同時に主役にしない<\/strong>（作例31 が主役）<\/td><\/tr><tr><td>縁の傾斜<\/td><td><strong>OFF<\/strong><\/td><td>ONだと帯の外側が低くなり、「抜けた」のと紛らわしい<\/td><\/tr><tr><td>生地の色<\/td><td><strong>CUSTOM<\/strong> (0.922, 0.898, 0.859)<\/td><td>生成りのチュールに寄せた。下記の落とし穴<\/td><\/tr><tr><td>幅 / 奥行き (mm)<\/td><td>120 / 120<\/td><td>葉1枚が 34〜48mm<\/td><\/tr><\/table>\n<h3>分かったこと<\/h3>\n<p><strong>この設定は「有る／無い」だけで柄を描く。<\/strong>高さも太さも色も柄に使って いないので、<strong>この作例で画面に出る形は全部この設定が作ったもの。<\/strong> 逆に言うと、高さや太さで柄を作る他の設定と重ねると、何が効いたのかが すぐ読めなくなる。<\/p>\n<p><strong>［生地の色プリセット］に <code>SOLID<\/code> は無い。<\/strong>自分の色を使うときの識別子は <strong><code>CUSTOM<\/code><\/strong>。しかも <code>update_fabric_color_preset<\/code> は<strong>プリセットの色を <code>fabric_solid_color<\/code> へ書き込む<\/strong>ので、「プリセットを選んだうえで色も 指定する」と、<strong>どちらが後に当たったかで結果が変わる。<\/strong>設定ファイルの 当たる順は決まっていないので、自分の色を使うなら <code>CUSTOM<\/code> にしておく。<\/p>\n<p><strong>高さは「粒に見えるか」で決めた。<\/strong>最初は高さ 2.0mm で作った。直径 0.70mm に対して縦横比が約3:1 になり、<strong>ビーズではなく棘に見える<\/strong> （斜めのレンダーを
