撮って確かめた）。1.4mm にすると 2:1 になり、 現物の粒に近づいた。［先細り］は 0.8（ほぼ真っすぐ）のままなので、 <strong>棘に見えていた原因は先細りではなく縦横比。<\/strong><\/p>\n<p><strong>帯幅は「何mm」ではなく「何列ぶん」で考えたほうがよい。<\/strong>3.0mm という 数字そのものには意味がなく、効くのはピッチとの比（ここでは 2.3列）。 ピッチを変えれば同じ 3.0mm でも輪郭の太さが変わる。<\/p>\n<p><strong>測るときのピッチは、柱の中心から出す。<\/strong>柱を「隙間」で束ねる道具 （<code>measr.py<\/code>）は、柄に穴があると<strong>空の列がまとめて1本の切れ目<\/strong>になるので、 切れ目の間隔からピッチを出すと 1.395mm と 7% 大きく出た。中心の並びの 最小間隔を取れば 1.304mm。<\/p>\n<h3>現物と違うところ<\/h3>\n<p><strong>現物の輪郭は1本の細い線、これは2〜3列の帯。<\/strong>ピッチ 1.304mm に対して 帯 3.0mm なので、輪郭は必ず2列以上になる。1列にしたければ帯幅を ピッチ以下（1.3mm 未満）にすればよいが、<strong>格子と島の交わり方によって 1列になったり0列になったりする<\/strong>ので、輪郭が途切れる。この作例では 途切れないほうを選んだ。<\/p>\n<p><strong>現物は透ける生地、これは不透明な板。<\/strong>チュールの「向こうが見える」 質感は生地の表現の側の話で、この作例の主張ではない。<\/p>\n<p><strong>現物の草花は写実、これは記号。<\/strong>葉の形は長円をすぼめただけで、 葉脈も鋸歯も無い。<strong>輪郭が読めることだけを狙った形<\/strong>にしてある。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 120x120mm<\/li><li>格子 93x93 / 生成 約2秒 / 生成物 1個 / 頂点 70,850<\/li><li>柱 1090本（OFF なら 2211本。<strong>1121本 50.7% が消える<\/strong>）<\/li><li>直径 0.700mm 一定 / 高さ 1.400mm 一定 / ピッチ 1.304mm<\/li><li>縁からの距離 0.17〜3.15mm（OFF は 0.17〜9.93mm）<\/li><li>見本は斜め (<code>preview.jpg<\/code>) と真上 (<code>preview_top.jpg<\/code>) の2枚。 <strong>輪郭になったことは真上のほうが圧倒的に読める<\/strong>——斜めでは 手前の柱が奥の空白を隠す<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/33_preview.jpg"},{"c":"真上","d":"img/33_preview_top.jpg"}]},{"num":"34","title":"氷華 — 窓霜の裾","mode":"BRISTLE","path":"docs/samples/34_氷華_窓霜の裾","text":"<h3>ゴール（作り始める前に一文で決めた）<\/h3>\n<blockquote><strong>紺の生地の裾から透明な霜の羊歯が立ち上がり、 上へ行くほど疎になって、途中で消える一枚。<\/strong><\/blockquote>\n<p><strong>この作例は、機能ではなくデザインから始めている。<\/strong>それまでの 11〜33 は 「現物を再現する」か「まだ使っていない設定を主役にする」かのどちらかで、 どちらも出発点が機能の側にあった。ここでは先に上の一文を決めて、 <strong>そのあとで「これを作るにはどの機能を組み合わせればよいか」を考えた。<\/strong><\/p>\n<h3>ゴールから逆算した機能の組み合わせ<\/h3>\n<table><tr><th>デザイン上の狙い<\/th><th>使った機能<\/th><\/tr><tr><td>紺の地<\/td><td>生地の下地 ON / 色 <code>CUSTOM<\/code> (0.060, 0.085, 0.190) / 織り<\/td><\/tr><tr><td>霜の羊歯の輪郭<\/td><td>柱モード ＋ ［透明しきい値］0.45<\/td><\/tr><tr><td>明るい霜ほど背が高い<\/td><td>［高さを揃える］OFF ＋ ［明度反転］ON<\/td><\/tr><tr><td>氷の結晶<\/td><td>断面［六角形］＋ ［先細り］0.0 ＋ 最大高さ <strong>2.0mm<\/strong><\/td><\/tr><tr><td>先が透き通り、根元にだけ色が残る<\/td><td>［透明］範囲＝上だけ / 色付き部分 35%<\/td><\/tr><tr><td><strong>上へ行くほど疎になる<\/strong><\/td><td><strong>絵そのものが持っている<\/strong>（下記）<\/td><\/tr><\/table>\n<p><strong>［領域マスク］も［縁の傾斜］も［間引き］も使っていない。<\/strong> 疎密は元画像の側に既に入っているので、そこへマスクを重ねると 絵と喧嘩する——特に、上のほうに3つだけ浮かんでいる孤立した結晶は、 どんなマスクを掛けても真っ先に消える。<strong>この作例のいちばんの見せ場が それなので、疎密を作る機能は1つも足さなかった。<\/strong><\/p>\n<p>同じ理由で［輪郭に合わせる］［組み立て補助］も OFF。<\/p>\n<h3>元画像<\/h3>\n<p>素は ComfyUI（Qwen-Image 2512）で作った窓霜の写真1枚。 <code>tools/make_art_34.py<\/code> がやるのは<strong>アドオンが読める形への翻訳だけ<\/strong>で、 柄そのものは描いていない。<\/p>\n<pre>cd &lt;作業用のフォルダ&gt;\npython docs/samples/tools/make_art_34.py<\/pre>\n<p>翻訳は2つある。<\/p>\n<p><strong>1. 明るさをアルファにする。<\/strong>霜は「有る／無い」ではなく「濃い／薄い」で 分布しているので、しきい値で切らず<strong>なだらかな傾き<\/strong>（明るさ 0.05〜0.50 を アルファ 0〜1 へ）で写す。<strong>どこで切るかはアドオン側の［透明しきい値］に 残した<\/strong>——そこが「霜がどこまで残るか」というデザインの決めどころになる。 0.45 で <strong>38.6%<\/strong> が残る。<\/p>\n<p><strong>2. 透明な所へ濃紺スレートを敷く。<\/strong>黒のままにすると霜の縁が黒く 縁取られる（<code>docs/lessons.md<\/code> v7.31.0）。<\/p>\n<p><strong>そして、敷く色の明るさがそのまま高さの向きを決める。<\/strong>最初は氷色 （明るさ 0.73）を敷いていた。それだと<strong>薄い霜ほど背景に引かれて明るく<\/strong> なるので、［明度反転］と組んだとき<strong>いちばん薄い羽根がいちばん高く<\/strong>なる ——ゴールの逆。敷く色の明るさをしきい値の所の明るさ（0.246）に合わせると、 残る画素の範囲で明るさが霜の濃さと同じ向きに揃う。道具が毎回 <code>薄い側 0.268 → 濃い側 0.661 OK<\/code> と印字して見張る。<\/p>\n<p><strong>疎密は目ではなく数で確かめた。<\/strong>残る画素の割合は <strong>上1/3 2.9% / 中1/3 33.4% / 下1/3 79.2%。<\/strong>ゴールの「上へ行くほど疎」が 絵の側に入っている。<\/p>\n<p><strong>480x640 なのは格子の細かさから決めた。<\/strong>ピッチ 1.30mm なので 1マスあたり 2.4画素あり、格子が拾える細かさを上回っている。元の 864x1152 のままでも 絵は変わらないが PNG が 996KB になり、<strong>1作例1MB の枠を元画像1枚で 使い切ってしまう<\/strong>（見本の絵が2枚入らない）。<\/p>\n<h3>柱モードの設定<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td>幅 / 奥行き (mm)<\/td><td>255 / 340<\/td><td>元画像と同じ 3:4。格子 <strong>197 x 262<\/strong><\/td><\/tr><tr><td>要素の半径 (mm)<\/td><td>0.35<\/td><td>直径 <strong>0.70mm<\/strong>。造形の下限 0.6mm を満たす<\/td><\/tr><tr><td>要素の間隔 (mm)<\/td><td>0.6<\/td><td>ピッチ = 0.35x2 + 0.6 = <strong>1.300mm<\/strong><\/td><\/tr><tr><td><strong>断面の形<\/strong><\/td><td><strong>六角形<\/strong><\/td><td><strong>霜は六方晶。<\/strong>造形の都合ではなくデザインの言い分<\/td><\/tr><tr><td><strong>先細り<\/strong><\/td><td><strong>0.0<\/strong><\/td><td>六角錐。<strong>平らな天面を消す<\/strong>ため<\/td><\/tr><tr><td>上端の丸み<\/td><td>0.0<\/td><td>同上。丸めると氷でなく雫になる<\/td><\/tr><tr><td>要素の向き<\/td><td>固定 0°<\/td><td>六角形は回転対称に近く、向きを振っても読めない<\/td><\/tr><tr><td>最大高さ (mm)<\/td><td><strong>2.0<\/strong><\/td><td>縦横比 <strong>2.9:1<\/strong>。実測の最高は <strong>1.76mm<\/strong>（下記）<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.45<\/td><td><strong>霜がどこまで残るかの決めどころ。<\/strong>38.6% が残る<\/td><\/tr><tr><td>高さを揃える<\/td><td><strong>OFF<\/strong><\/td><td>＝［明暗による高さ変化］ON<\/td><\/tr><tr><td>明度反転<\/td><td><strong>ON<\/strong><\/td><td>明るい霜ほど高い<\/td><\/tr><tr><td>カットオフ<\/td><td>0.0<\/td><td>薄い霜を切らない。<strong>消えるのは絵に任せる<\/strong><\/td><\/tr><tr><td>色<\/td><td>画像 / 側面もテクスチャ<\/td><td>元画像の氷色をそのまま柱に載せる<\/td><\/tr><tr><td><strong>透明<\/strong><\/td><td><strong>ON / 範囲＝上だけ / 比率 / 色付き 35%<\/strong><\/td><td>根元だけ色、上 65% がクリア材<\/td><\/tr><tr><td>クリアの表示<\/td><td>0.45<\/td><td><strong>画面だけの値。<\/strong>書き出しには乗らない<\/td><\/tr><tr><td>生地の下地<\/td><td>ON / <code>CUSTOM<\/code> (0.060, 0.085, 0.190) / 織り / 1.0mm<\/td><td>冷えた紺<\/td><\/tr><\/table>\n<h3>分かったこと<\/h3>\n<h4>透明の境目は柱1本ごとに違う（比率なので）<\/h4>\n<p>材ごとに面の高さを測ると、<strong>2つの範囲が重なっている。<\/strong><\/p>\n<table><tr><th>材<\/th><th>面の数<\/th><th>ワールド Z<\/th><\/tr><tr><td>色材（<code>BristleVertexColor<\/code>）<\/td><td>534,428<\/td><td>0.000 〜 <strong>0.606mm<\/strong><\/td><\/tr><tr><td>クリア材（<code>BristleClear<\/code>）<\/td><td>881,084<\/td><td><strong>0.163<\/strong> 〜 1.764mm<\/td><\/tr><\/table>\n<p>［方式］が比率なので、境目は「高さの 35%」——<strong>その柱自身の高さの 35%。<\/strong> いちばん高い柱（1.76mm）の境目は 0.62mm、いちばん低い柱（0.4mm＝床）の 境目は 0.16mm で、両者のあいだで重なる。<strong>高さで柄を作りながら透明を 使うと、境目の面は必ず斜面になる<\/strong>ということ。<\/p>\n<p>意図した動きだが、<strong>「35% の所で水平に切れる」と思っていると外す。<\/strong> 水平に揃えたければ［方式］を厚み(mm) にする。<\/p>\n<h4>造形物は紙面より 25mm 短い<\/h4>\n<table><tr><th><\/th><th>指定<\/th><th>実測（評価済みワールド外接）<\/th><\/tr><tr><td>幅<\/td><td>255.0mm<\/td><td><strong>255.70mm<\/strong>（＝ 255 + 直径 0.70）<\/td><\/tr><tr><td>奥行き<\/td><td>340.0mm<\/td><td><strong>314.55mm<\/strong><\/td><\/tr><tr><td>高さ<\/td><td>2.0mm<\/td><td><strong>1.76mm<\/strong><\/td><\/tr><\/table>\n<p>幅は中心間距離 + 直径で、既知の関係（造形範囲は「外側の箱」で見る）。 <strong>奥行きが 25mm 足りないのは、いちばん上の帯に柱が1本も立っていないから<\/strong> ——ゴールの「途中で消える」がそのまま物の寸法に出ている。 造形トレイ 460x360mm には余裕で入る。<\/p>\n<p><strong>この数字は <code>size_y<\/code> を読んでも出てこない。<\/strong>生成後のメッシュを 評価してワールド外接を測らないと分からない。<\/p>\n<h4>高さも指定より低い<\/h4>\n<p>最大高さ 2.0mm に対して実測 1.76mm。最高値に届くのは<strong>明るさが振り切った 画素だけ<\/strong>で、この絵にはそれが無い（元画像の明るさの最大は 0.950、 そこへ合成が掛かる）。<strong>「最大高さ」は上限であって、出る高さではない。<\/strong><\/p>\n<h4>最大高さを下げると、いちばん薄い柄が「消える」<\/h4>\n<p><strong>この作例は当初 5.0mm で作った。<\/strong>直径 0.70mm なので縦横比 7.1:1、 利用者から「スパイク状にするのが好きなのか」と指摘が出た丈である。 2.0mm（<strong>2.9:1<\/strong>）へ下げた。<\/p>\n<p>下げたら、<strong>頂点が 17.4% 減った。<\/strong>高さを変えただけなら頂点数は 変わらないはずなので、<strong>柱そのものが消えている。<\/strong><\/p>\n<p>陰性対照を取って確かめた。［高さを揃える］を ON にすると、どの柱も 最大高さになるので床を割る柱は原理的に出ない。<\/p>\n<table><tr><th>［高さを揃える］<\/th><th>最大高さ 5.0mm<\/th><th>最大高さ 2.0mm<\/th><\/tr><tr><td><strong>ON<\/strong>（陰性対照）<\/td><td>2,054,790<\/td><td><strong>2,054,790<\/strong>（完全に一致）<\/td><\/tr><tr><td>OFF（この作例）<\/td><td>1,783,878<\/td><td>1,473,288<\/td><\/tr><\/table>\n<p>ON で一致するので、<strong>柱1本あたりの頂点数は高さに依らない。<\/strong> したがって OFF での差は消えた本数そのもので、全部立った場合を 100% と すると <strong>5.0mm で 13.2%、2.0mm で 28.3% が消えている。<\/strong><\/p>\n<p>原因はアドオンの側にある。［最小高さカットオフ］をこの作例は <strong>0.0mm<\/strong> に設定しているが、<code>__init__.py:16679<\/code> が<\/p>\n<p>max(props.min_height_cutoff, STRATASYS_MIN_HEIGHT)<\/p>\n<p>を Geometry Nodes へ渡しており、<strong>床は必ず 0.4mm。<\/strong>高さは 「最大高さ × その画素の明るさ」なので、最大高さを半分にすると 0.4mm を超えるのに必要な明るさが倍になる。<\/p>\n<p><strong>造形の下限なので、この動き自体は正しい。<\/strong>ただし画面には出てこない ——設定は 0.0 と表示されたまま、いちばん薄い羽根が黙って消える。 本部への申し送りに入れた（21番）。<\/p>\n<h3>うまくいかなかったこと（正直に）<\/h3>\n<h4>透明が「透けて」見えない<\/h4>\n<p><strong>この作例の主役に選んだ機能が、絵に出ていない。<\/strong><\/p>\n<p>全景（<code>preview.jpg<\/code>）では原理的に無理で、柱1本 0.70mm は 255mm 幅の 絵の中で<strong>約3画素<\/strong>しかない。だから寄りの絵を撮る道具 （<code>tools/render_macro.py<\/code>）を作った。<\/p>\n<p><strong>寄っても、透けては見えない。<\/strong><code>preview_macro.jpg<\/code> で読めるのは 「柱の途中に水平な色の境目がある」ことまでで、<strong>二色に塗り分けた柱<\/strong>に しか見えない。向こう側が透けて見えるわけではないので、 「クリア材である」ことは絵からは読めない。<\/p>\n<p>データの側は正しい（上の表のとおり材が分かれている）。<strong>絵にできない だけ<\/strong>で、これは作例室の側では手当てできない。<\/p>\n<h4>寄ると「霜」が消える<\/h4>\n<p><code>preview_macro.jpg<\/code> は六角錐が1本ずつ読めるが、<strong>寄った瞬間に デザインが消える。<\/strong>全景で成立している「霜の羊歯」は柄のスケールの 話なので、柱1本を見せる絵とは両立しない。<\/p>\n<p><strong>2枚は別のことを言っている<\/strong>——<code>preview.jpg<\/code> がデザイン、 <code>preview_macro.jpg<\/code> が造形。片方だけでは足りない、というのが結論。<\/p>\n<p><strong>寄る場所は目で選ばない。<\/strong>最初に撮った所（紙面の中央寄り）は 柱がまばらで、画面のほとんどが生地だった。元画像のアルファから 16mm 角の窓を総当たりして<strong>充填率が 50% に近い所<\/strong>を選び直している ——密すぎると板に見え、疎すぎると何も写らない。<\/p>\n<h4>［クリアの表示］は、既定だと先端が「暗く」なる<\/h4>\n<p><strong>目で見た印象を書きかけて、測ったら逆だった。<\/strong>［クリアの表示］ (<code>clear_preview_alpha<\/code>) だけを振って同じ画角で3枚撮り、クリア材の画素と 色材の画素を分けて明るさを出した。<\/p>\n<table><tr><th>［クリアの表示］<\/th><th>クリア材<\/th><th>色材<\/th><th>差<\/th><th>横縞の強さ<\/th><\/tr><tr><td><strong>0.20（既定）<\/strong><\/td><td>0.391<\/td><td>0.419<\/td><td><strong>−0.028<\/strong><\/td><td>0.0126<\/td><\/tr><tr><td><strong>0.45（この作例）<\/strong><\/td><td>0.495<\/td><td>0.425<\/td><td>+0.070<\/td><td>0.0209<\/td><\/tr><tr><td>0.75<\/td><td>0.541<\/td><td>0.422<\/td><td>+0.119<\/td><td><strong>0.0325<\/strong><\/td><\/tr><\/table>\n<p><strong>符号が 0.20 と 0.45 のあいだで入れ替わる。<\/strong>既定のままだと <strong>クリアの先端のほうが色材の根元より暗い<\/strong>——氷の作例としては逆で、 「先が透けて明るい」ではなく「先が黒ずんでいる」に見える。<\/p>\n<p>上げると明るくなるが、<strong>横縞（水平の縞）が 2.6倍に育つ。<\/strong> 0.45 は妥協点で、<code>preview_macro.jpg<\/code> の何本かに薄く残っている。<\/p>\n<p>（色材が 0.419 / 0.425 / 0.422 とほとんど動かないのが陰性対照。 ものさし自体は効いている。横縞は隣り合う行の差の平均で、 六角形の面の境目は縦向きなのでほとんど寄与しない。 <strong>絶対値ではなく増え方<\/strong>を見ること。）<\/p>\n<p><strong>画面だけの値なので造形物には影響しない。<\/strong>原因は測っていない （作例室の範囲外）。本部への申し送りに入れた。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 255x340mm / 格子 197x262<\/li><li>生成 <strong>10〜11秒<\/strong>（2回測った）/ 生成物 1個<\/li><li>頂点 <strong>1,473,288<\/strong> / 面 <strong>1,415,512<\/strong><\/li><li>ピッチ 1.300mm / 直径 0.700mm（造形の下限 0.6mm を満たす）<\/li><li>評価済みワールド外接 <strong>255.70 x 314.55 x 1.76mm<\/strong>（トレイ 460x360 内）<\/li><li>材 2つ（色材 534,428面 / クリア材 881,084面）<\/li><li>見本は全景 (<code>preview.jpg<\/code>) と寄り (<code>preview_macro.jpg<\/code>) の2枚<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/34_preview.jpg"},{"c":"拡大","d":"img/34_preview_macro.jpg"}]},{"num":"35","title":"金継ぎ — 割れ目の金の稜線","mode":"SURFACE","path":"docs/samples/35_金継ぎ_割れ目の金の稜線","text":"<h3>ゴール（作り始める前に一文で決めた）<\/h3>\n<blockquote><strong>漆黒の生地そのものが破片になり、 その割れ目にだけ金の稜線が走る一枚。<\/strong><\/blockquote>\n<p><strong>裏返しになっているのが要点。<\/strong>金継ぎの絵で目に入るのは黒い破片のほう だが、<strong>刷るのは金の線だけ<\/strong>にした。黒い破片は生地の下地が演じる。<\/p>\n<p>そう決めた理由は2つあり、どちらも造形の側から来ている。<\/p>\n<ul><li>大きくて硬い黒い板を刷らずに済む（服として垂れる）<\/li><li>造形物が細い線の網になるので、生地が曲がるのを邪魔しない<\/li><\/ul>\n<h3>ゴールから逆算した機能の組み合わせ<\/h3>\n<table><tr><th>デザイン上の狙い<\/th><th>使った機能<\/th><\/tr><tr><td>漆黒の破片<\/td><td><strong>生地の下地<\/strong>（刷らない）/ <code>CUSTOM<\/code> (0.02, 0.02, 0.025) / 織り<\/td><\/tr><tr><td>金の線の輪郭<\/td><td>面モード ＋ ［透明しきい値］0.50<\/td><\/tr><tr><td>線が<strong>盛り上がっている<\/strong><\/td><td>［高さの決め方］＝フラット ＋ <strong>［上面ふくらみ］0.55mm<\/strong><\/td><\/tr><tr><td>割れ目の階段を消す<\/td><td>［輪郭に合わせる］ON<\/td><\/tr><tr><td>金の色<\/td><td>色＝画像 / 側面もテクスチャ<\/td><\/tr><tr><td><strong>布のように曲がる<\/strong><\/td><td><strong>［面を分割する］＝ボロノイ / 12mm<\/strong>（下記）<\/td><\/tr><\/table>\n<p><strong>高さはフラットで、盛り上がりは［上面ふくらみ］だけが作っている。<\/strong> 明るさを高さにすると、金の線の中のてかりの濃淡がそのまま凹凸になって 「叩いた金属板」に見える。金継ぎの継ぎ目は<strong>断面が丸い<\/strong>ので、 高さは一定にして、上面をふくらませるほうが正しい。<\/p>\n<h3>元画像<\/h3>\n<p>素は ComfyUI（Qwen-Image 2512）で作った金継ぎの写真1枚。 <code>tools/make_art_35.py<\/code> がやるのは<strong>アドオンが読める形への翻訳だけ。<\/strong><\/p>\n<pre>python docs/samples/tools/make_art_35.py<\/pre>\n<p><strong>金かどうかは「赤 − 青」で決める。明るさでは決められない。<\/strong> 黒漆にはてかりがあり、その画素は<strong>明るい。<\/strong>実測すると、<\/p>\n<table><tr><th><\/th><th>赤 − 青<\/th><\/tr><tr><td>暗部（明るさ &lt; 0.10）<\/td><td>平均 <strong>-0.004<\/strong> / 95%点 0.027<\/td><\/tr><tr><td>金（明るさ &gt; 0.50）<\/td><td>平均 <strong>0.433<\/strong><\/td><\/tr><\/table>\n<p><strong>15倍以上離れている。<\/strong>明るさで切るとてかりを金と読む。<\/p>\n<p>赤−青 0.05〜0.35 をアルファ 0〜1 へなだらかに写すので、 ［透明しきい値］を動かすと<strong>金の線の太さが変わる<\/strong>——そこがこの作例の 決めどころ。0.50 で <strong>12.7%<\/strong> が残る。<\/p>\n<p>道具は毎回2つを印字して見張る。<\/p>\n<ul><li><strong>かけらを落とした: 24個中 23個。<\/strong>孤立した小さな点は、造形すると <strong>生地の上に浮いた砂粒<\/strong>になる。幅 1.0mm 未満のものは残せない。<\/li><li><strong>紙面の縁に触れる画素 上23 / 下30 / 左23 / 右38。<\/strong>どれかが 0 だと 割れ目の網が紙面の中で閉じてしまい、<strong>「割れた」ではなく「模様」<\/strong>に 見える。割れ目は端まで走らないといけない。<\/li><\/ul>\n<h3>面モードの設定<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td>幅 / 奥行き (mm)<\/td><td>240 / 240<\/td><td>元画像と同じ正方形<\/td><\/tr><tr><td>高さの決め方<\/td><td><strong>フラット<\/strong><\/td><td>明るさを高さにしない（上記）<\/td><\/tr><tr><td>最大高さ (mm)<\/td><td>0.8<\/td><td>継ぎ目の稜線。低く、細く<\/td><\/tr><tr><td><strong>上面ふくらみ<\/strong><\/td><td><strong>ON / ドーム / 0.55mm<\/strong><\/td><td><strong>断面を丸くする。<\/strong>この作例の主役<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.50<\/td><td>金の線の太さの決めどころ。12.7% が残る<\/td><\/tr><tr><td>輪郭に合わせる<\/td><td>ON<\/td><td>格子の階段を消す<\/td><\/tr><tr><td>角の丸み<\/td><td>ON / 0.20mm / 3段 / 上の縁<\/td><td><strong>ほぼ効かない<\/strong>（下記）<\/td><\/tr><tr><td><strong>面を分割する<\/strong><\/td><td><strong>ON / ボロノイ / 12mm / すき間 0.6mm<\/strong><\/td><td><strong>布として曲がるため<\/strong><\/td><\/tr><tr><td>最小タイルサイズ (mm)<\/td><td>1.0<\/td><td>切った拍子にできる欠片を落とす<\/td><\/tr><tr><td>色<\/td><td>画像 / 側面もテクスチャ<\/td><td>金をそのまま載せる<\/td><\/tr><tr><td>生地の下地<\/td><td>ON / <code>CUSTOM<\/code> (0.02, 0.02, 0.025) / 織り / 1.0mm<\/td><td>漆黒<\/td><\/tr><tr><td>最終解像度<\/td><td>1024<\/td><td>割れ目が細いので上げてある<\/td><\/tr><\/table>\n<h3>分かったこと<\/h3>\n<h4>「細い線なら曲がる」は間違いだった。道具のほうが正しかった<\/h4>\n<p><strong>当初は［面を分割する］を OFF にしていた。<\/strong>線が細いのだから曲がる だろう、と考えたから。ところが生成のたびに警告が出る。<\/p>\n<pre>1つの要素が 240×240mm あり、布のようには曲がりません（造形条件の上限 15.0mm）<\/pre>\n<p><strong>この警告のほうが正しい。<\/strong>金の線は割れ目の交点で互いに繋がっていて、 <strong>網全体がひとつながりの1個の部品<\/strong>になっている。線が細いことと、 部品が大きいことは別の話で、繋がった網は端から端まで硬い。 「服として垂れる」というゴールの半分が、成立していなかった。<\/p>\n<h4>割り方を変えると、切れ目が柄の言葉になる<\/h4>\n<p>分割は入れると決めたが、<strong>格子（ブロック）では駄目だった。<\/strong><\/p>\n<table><tr><th>割り方<\/th><th>12mm での警告<\/th><th>絵としてどう見えるか<\/th><\/tr><tr><td>ブロック<\/td><td>出ない（合格）<\/td><td><strong>直交する規則的な線<\/strong>が金の線を横切る。柄と無関係な別の幾何が重なって見える<\/td><\/tr><tr><td>ランダム 12mm<\/td><td>21×23mm で<strong>不合格<\/strong><\/td><td>格子をずらすだけなので、大きいセルができる<\/td><\/tr><tr><td><strong>ボロノイ 12mm<\/strong><\/td><td><strong>出ない（合格）<\/strong><\/td><td>切れ目の角度がばらばらで、<strong>格子として読めない<\/strong><\/td><\/tr><tr><td>ボロノイ 16mm<\/td><td>19×16mm で<strong>不合格<\/strong><\/td><td>—<\/td><\/tr><\/table>\n<p><strong>ボロノイ 12mm を採った。<\/strong>切れ目が短く、向きが一つひとつ違うので、 「金の継ぎ目が細かい留め具で留めてある」ように読める——磁器を金属の 鎹で繋ぐ修理（鋦瓷）に近い見え方で、<strong>金継ぎの語彙の内側に収まる。<\/strong><\/p>\n<p><strong>格子で切ると、切れ目が「別の設計者の線」に見える。<\/strong>同じ機能・同じ 寸法で、合否も同じなのに、絵としての意味がまったく違う。<\/p>\n<h4>正直に言うと、金継ぎの比喩とは緊張関係にある<\/h4>\n<p>金継ぎの意味は<strong>継ぐこと<\/strong>、つまり途切れない金の線そのものにある。 それを切り刻むのは、比喩を裏返している。<\/p>\n<p><strong>それでも切るほうを選んだ。<\/strong>この作例は織物の作例で、垂れない 240mm の硬い板は「金継ぎ風の板」であって布ではない。 <strong>布であることを優先した。<\/strong>その判断は絵にも出ていて、寄って見れば 切れ目は分かる。読む人が逆の判断をするなら、 <code>surface_flex_split_enable<\/code> を False に戻せば元の連続した網に戻る。<\/p>\n<h4>［角の丸み］はほぼ効かない（0.20mm → 0.000mm）<\/h4>\n<p>生成のたびに出る。<\/p>\n<pre>丸みは0.20mmを指定しましたが、実際に付いたのは約0.000mmです\n（輪郭が入り組んでいるほど小さくなります）<\/pre>\n<p>割れ目の輪郭は細かく入り組んでいるので、丸みは事実上ゼロまで潰れる。 <strong>設定は残してあるが、この絵では何もしていない。<\/strong> 稜線の丸さは［上面ふくらみ］が作っている。<\/p>\n<p>（v7.154.0 の既知の性質。丸みの上限はおおむね1マスぶんで、 そこに届くのは直線の縁だけ。）<\/p>\n<h3>うまくいかなかったこと（正直に）<\/h3>\n<h4>金が「金」に見えきらない<\/h4>\n<p><code>preview.jpg<\/code> の金は、<strong>琥珀色から白へ<\/strong>という写真そのままの色で、 金属の照りではない。色はテクスチャなので、金属らしさ（異方性の ハイライト）は出しようがない——[金属質]は生地の下地の設定であって、 造形物の材質ではない。<\/p>\n<p><strong>実機では金色の材料で刷るので、この差はプレビューだけの話<\/strong>だが、 見本の絵としては弱い。<\/p>\n<h4>真上の絵は、以前の作例と条件が違う<\/h4>\n<p><code>preview_top.jpg<\/code> は<strong>生地の下地を写した状態<\/strong>で撮っている。 この作例は黒い生地が主役の半分なので、隠すと金の線が灰色の背景に 浮いてしまい、絵が別のことを言い始める。そのために <code>tools/render_top.py<\/code> を直した。<\/p>\n<p><strong>11〜34 の <code>preview_top.jpg<\/code> は下地を隠したまま撮られている<\/strong>ので、 いま同じ道具で撮り直すと違う絵になる。撮り直してはいない。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 面モード / 240x240mm / 最終解像度 1024（見本は 384）<\/li><li>生成 <strong>1.3〜1.7秒<\/strong> / 生成物 1個<\/li><li>頂点 <strong>50,510<\/strong> / 面 <strong>50,292<\/strong><\/li><li>評価済みワールド外接 <strong>240.00 x 240.00 x 1.35mm<\/strong>（トレイ 460x360 内）<\/li><li>高さ 1.35mm ＝ 最大高さ 0.8mm ＋ ［上面ふくらみ］0.55mm<\/li><li><strong>要素の大きさの警告は出ない<\/strong>（ボロノイ 12mm で 15mm の条件を満たす）<\/li><li>元画像 768x768 / しきい値 0.50 で 12.7% が残る<\/li><li>孤立したかけら 24個中 23個を落とした（幅 1.0mm 未満は残せない）<\/li><li>見本2枚: 全景 (<code>preview.jpg<\/code>) / 真上 (<code>preview_top.jpg<\/code>)<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/35_preview.jpg"},{"c":"真上","d":"img/35_preview_top.jpg"}]},{"num":"36","title":"墨流し — 流れに沿う粒","mode":"BRISTLE","path":"docs/samples/36_墨流し_流れに沿う粒","text":"<h3>ゴール（作り始める前に一文で決めた）<\/h3>\n<blockquote><strong>淡い生成りの布の上を、藍の粒の帯が幾筋も流れ、 粒の一つひとつが流れの向きを向いている一枚。<\/strong><\/blockquote>\n<p><strong>この作例で試したかったのは「粒が向きを持つ」ことだけ。<\/strong>柄そのもの （墨流し）は帯の形で読めるので、そこは元画像の仕事にした。作例室として 確かめたかったのは、<strong>［要素の向き］＝流れに沿う が本当に効くのか<\/strong>、 そして<strong>それが絵で読めるのか<\/strong>の2つ。<\/p>\n<h3>ゴールから逆算した機能の組み合わせ<\/h3>\n<table><tr><th>デザイン上の狙い<\/th><th>使った機能<\/th><\/tr><tr><td>生成りの地<\/td><td>生地の下地 ON / <code>CUSTOM<\/code> (0.90, 0.89, 0.855) / 織り 1.0mm<\/td><\/tr><tr><td>藍の帯の輪郭<\/td><td>柱モード ＋ ［透明しきい値］0.55<\/td><\/tr><tr><td><strong>粒に向きがある<\/strong><\/td><td><strong>［要素の向き］＝流れに沿う<\/strong>（<code>FLOW<\/code>）<\/td><\/tr><tr><td><strong>向きが見える形<\/strong><\/td><td>［倍率X］2.0 / ［倍率Y］1.0 ＝ <strong>長円の粒<\/strong><\/td><\/tr><tr><td>粒が糸のように寝る<\/td><td>［先細り］1.0 ＋ ［上端の丸み］1.0<\/td><\/tr><tr><td>濃淡が高さに出る<\/td><td>［高さを揃える］OFF<\/td><\/tr><tr><td>藍の色そのまま<\/td><td>色＝画像 / 側面もテクスチャ<\/td><\/tr><\/table>\n<p><strong>［倍率X/Y］が主役の相棒。<\/strong>円柱のままでは、向きを変えても<strong>絵が 1画素も変わらない<\/strong>——回転対称だから。向きという機能を見せるには、 まず<strong>向きを持つ形<\/strong>を作らなければならない。2:1 の長円にして初めて、 向きが目に見える量になる。<\/p>\n<p>［明暗による半径変化］［間引き］［領域マスク］は使っていない。 疎密は帯の側に入っているので、重ねると帯の形が濁る。<\/p>\n<h3>元画像<\/h3>\n<p>素は ComfyUI（Qwen-Image 2512）で作った墨流しの写真1枚。 <code>tools/make_art_36.py<\/code> がやるのは<strong>アドオンが読める形への翻訳だけ。<\/strong><\/p>\n<pre>python docs/samples/tools/make_art_36.py<\/pre>\n<p>翻訳は3つある。<\/p>\n<p><strong>1. 明るさをアルファにする。<\/strong>帯の内と外を、しきい値ではなく傾きで写す。 どこで切るかはアドオン側の［透明しきい値］に残した。0.55 で <strong>36.5%<\/strong> が残る。<\/p>\n<p><strong>2. 墨と紙の色を、写真から採る。<\/strong>手で選んだ藍と生成りを最初は敷いて いたが、<strong>写真の藍より必ず鈍る。<\/strong>道具の仕事は翻訳であって色を発明する ことではないので、<code>np.median<\/code> で不透明な所から墨を、透明な所から紙を 採る。実測 墨 (0.09, 0.26, 0.45) / 紙 (0.71, 0.77, 0.84)。<\/p>\n<p><strong>3. 帯の断面を山型にする。<\/strong>芯を濃く、縁へ向かって淡くする距離の傾斜 （半幅30画素）を掛け、写真の調子を 30% だけ残す。<\/p>\n<p><strong>この3つ目は造形の見た目のための細工であって、［流れに沿う］のため ではない。<\/strong>当初は「平らな高原では勾配が消えて向きが決まらないはず」と 考えて入れたが、<strong>測ったら違った。<\/strong>山型の有無で、粒の長軸と等値線の ずれは中央値 <strong>8.9度 → 7.9度<\/strong>しか動かない。勾配の大きさも 0.0125（山型なし）→ 0.0116（あり）と、判定のしきい値 0.002 を どちらも 93% 以上の画素で超えている。<strong>入れた理由のほうが後から 間違いだと分かった<\/strong>ので、断面の造形という別の理由で残してある。<\/p>\n<h3>柱モードの設定<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>効果<\/th><\/tr><tr><td>幅 / 奥行き (mm)<\/td><td>210 / 280<\/td><td>元画像と同じ 3:4。格子 <strong>106 x 141<\/strong><\/td><\/tr><tr><td>要素の半径 (mm)<\/td><td>0.35<\/td><td>直径 0.70mm。造形の下限 0.6mm を満たす<\/td><\/tr><tr><td>要素の間隔 (mm)<\/td><td>0.6<\/td><td>ピッチ = 0.35x2 + 0.6 = <strong>2.000mm<\/strong><\/td><\/tr><tr><td>断面の形<\/td><td>円柱<\/td><td>長円にするのは倍率の仕事<\/td><\/tr><tr><td><strong>倍率X / 倍率Y<\/strong><\/td><td><strong>2.0 / 1.0<\/strong><\/td><td><strong>長円の粒。<\/strong>向きを見せるための形<\/td><\/tr><tr><td><strong>要素の向き<\/strong><\/td><td><strong>流れに沿う<\/strong><\/td><td><strong>この作例の主役<\/strong><\/td><\/tr><tr><td>先細り<\/td><td>1.0<\/td><td>根元が太く先が細い。糸の粒に見せる<\/td><\/tr><tr><td>上端の丸み<\/td><td>1.0<\/td><td>天面の平らな円を消す<\/td><\/tr><tr><td>最大高さ (mm)<\/td><td>1.8<\/td><td><strong>縦横比 2.6:1<\/strong>（下記）<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.55<\/td><td>帯がどこまで残るか。36.5% が残る<\/td><\/tr><tr><td>高さを揃える<\/td><td>OFF<\/td><td>濃い所ほど高い<\/td><\/tr><tr><td>明度反転<\/td><td>OFF<\/td><td>墨が濃い＝暗い＝低い…の逆にしない<\/td><\/tr><tr><td>色<\/td><td>画像 / 側面もテクスチャ<\/td><td>藍をそのまま柱に載せる<\/td><\/tr><tr><td>生地の下地<\/td><td>ON / <code>CUSTOM<\/code> (0.90, 0.89, 0.855) / 織り / 1.0mm<\/td><td>生成り<\/td><\/tr><\/table>\n<h4>縦横比を先に数えた<\/h4>\n<p><strong>最大高さ 1.8mm ÷ 細いほうの直径 0.70mm = 2.6:1。<\/strong><\/p>\n<p>作例は放っておくと「細く高い柱＝棘」に寄る（作例34 で指摘を受けた）。 斜めのプレビューでは棘のほうが見栄えがするからで、<strong>目で選ぶと必ず そちらへ行く。<\/strong>この作例では高さを<strong>先に決めて<\/strong>（粒が寝ている絵に したいので低く）、そこから逆に「では向きをどう見せるか」を考えた ——答えが［倍率X/Y］だった。<strong>高さで見栄えを稼がなかったぶんを、 形で稼いでいる。<\/strong><\/p>\n<p>倍率を掛けると太さは XY で違う（1.40mm x 0.70mm）。造形の下限 0.6mm は<strong>細いほう<\/strong>で見るのが条文なので、0.70mm で満たしている。<\/p>\n<h3>分かったこと<\/h3>\n<h4>［流れに沿う］は本当に効いている（測った）<\/h4>\n<p><strong>絵を見ただけでは分からなかったので、粒1つずつの向きを測った。<\/strong><\/p>\n<p>真上から<strong>シルエットだけ<\/strong>を 3000px で撮り（背景を透過にして、 アルファだけで粒を切り出す。色で切ると藍の濃淡に引っぱられる）、 粒ごとに二次モーメントで長軸の角度を出して、元画像の<strong>等値線の向き<\/strong> と比べる。<\/p>\n<table><tr><th>［要素の向き］<\/th><th>等値線とのずれ（中央値）<\/th><th>粒の数<\/th><\/tr><tr><td><strong>流れに沿う<\/strong><\/td><td><strong>7.9度<\/strong><\/td><td>8,430<\/td><\/tr><tr><td>固定（陰性対照）<\/td><td>水平から <strong>0.4度<\/strong><\/td><td>8,430<\/td><\/tr><\/table>\n<p><strong>陰性対照が要る。<\/strong>「7.9度」だけでは、たまたま等値線が水平に近い絵 だっただけかもしれない。固定にすると水平から 0.4度、つまり<strong>ものさしは 向きを正しく読んでいる<\/strong>——そのうえで流れに沿うにすると等値線へ寄る。<\/p>\n<h4>途中で3回、ものさしのほうが壊れていた<\/h4>\n<p>正直に書く。<strong>この 7.9度に辿り着くまでに、道具を3回捨てている。<\/strong><\/p>\n<p>1. <strong>構造テンソル<\/strong>（24画素の窓で向きを出す）。流れに沿う 41.6度 / 固定 36.9度で、<strong>でたらめ（45度）と区別が付かなかった。<\/strong>窓の中で いちばん強い方向は粒ではなく<strong>格子の並び<\/strong>だったから。 2. <strong>色で粒を切り出す。<\/strong>元画像の色を変えた日に、固定の陰性対照が 9.1度 → 82.2度へ飛んだ。暗い芯だけを拾っていて、隣り合う粒が 繋がった長い塊が大きさの条件で落ち、<strong>残った粒が縦に偏った。<\/strong> 3. <strong>画角の取り違え。<\/strong>正投影の枠は正方形（280mm）だが作例は 210x280mm。「画素の位置 ÷ 画像の幅」で元画像を引くと、<strong>横だけ 縮んだ場所の等値線<\/strong>と比べることになる。固定は水平のままなので 影響を受けず、<strong>流れに沿うだけが壊れて見えた。<\/strong><\/p>\n<p>3つとも「機能が効いていない」という結論を出しかけた。 <strong>ものさしが壊れているときの症状は、機能が壊れているときと同じ。<\/strong><\/p>\n<h4>全景には原理的に写らない。寄りが要る<\/h4>\n<p><code>preview.jpg<\/code> も <code>preview_top.jpg<\/code> も帯の柄は読めるが、<strong>粒1つの向きは 読めない。<\/strong>柱1本は 210mm 幅の絵の中で数画素しかないので、これは撮り方 の問題ではなく画角の問題。<\/p>\n<p>そこで <code>render_top.py<\/code> に寄りを足した。<\/p>\n<pre>BF_ADDON_PATH=&quot;&lt;複製&gt;&quot; blender --background --factory-startup \\\n    --python docs/samples/tools/render_top.py -- \\\n    docs/samples/36_墨流し_流れに沿う粒 --at 0.5,0.3 --span 40<\/pre>\n<p><code>preview_zoom.jpg<\/code>（40mm 角）でようやく、<strong>粒が長円であることと、 その長軸が帯ごとに角度を変えていること<\/strong>が読める。<\/p>\n<p><strong>既にある <code>render_macro.py<\/code> では役が足りない。<\/strong>あれは低い角度から 逆光で撮る道具で、丈と透け方を見るためのもの（作例34 の透明のために 作った）。<strong>向きは真上からでないと読めない。<\/strong><\/p>\n<h3>うまくいかなかったこと（正直に）<\/h3>\n<h4>真上の絵は色が抜ける<\/h4>\n<p><code>preview_top.jpg<\/code> は太陽2灯を斜めから当てているので、<strong>藍が <code>preview.jpg<\/code> よりはっきり淡い。<\/strong>柄の形は真上のほうが読めるが、 色は斜めのほうが正しい。2枚は別のことを言っている。<\/p>\n<h4>帯の縁がぎざぎざになる<\/h4>\n<p>柱は 2.0mm ピッチの格子に載るので、帯の縁は<strong>必ず 2mm の階段<\/strong>になる。 面モードの［輪郭に合わせる］にあたる機能は柱モードには無く、 ［輪郭に合わせる］（<code>edge_align_*<\/code>）は柱を寄せる別の仕組み。 今回は試していない——帯が細い所で柱が寄ると、帯の形そのものが 変わってしまうため。<\/p>\n<h4>山型を入れた理由が間違っていた<\/h4>\n<p>上に書いたとおり。<strong>入れた効果は 8.9度 → 7.9度。<\/strong>設計の理由として 挙げていた「平らな高原で勾配が消える」は、測ったら起きていなかった。 道具の説明文にはこの経緯をそのまま残してある。<\/p>\n<h3>実測<\/h3>\n<ul><li>版 v7.154.0 / 柱モード / 210x280mm / 格子 <strong>106 x 141<\/strong><\/li><li>生成 <strong>3.1〜5.4秒<\/strong> / 生成物 1個<\/li><li>頂点 <strong>2,184,732<\/strong> / 面 <strong>2,129,562<\/strong><\/li><li>ピッチ 2.000mm / 太さ 1.40 x 0.70mm（下限 0.6mm を細いほうで満たす）<\/li><li><strong>縦横比 2.6:1<\/strong>（最大高さ 1.8mm ÷ 細いほうの直径 0.70mm）<\/li><li>評価済みワールド外接 <strong>211.40 x 281.40 x 1.75mm<\/strong>（トレイ 460x360 内）<\/li><li>流れに沿う: 等値線とのずれ 中央値 <strong>7.9度<\/strong>（固定は水平から 0.4度）<\/li><li>見本3枚: 全景 / 真上 / 寄り40mm<\/li><li><strong>フォルダは 960KB。1MB の枠の 92%。<\/strong>足すなら <code>preview_top.jpg<\/code> （264KB）を落とすのが先——柄は全景と寄りの2枚で足りる<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/36_preview.jpg"},{"c":"真上","d":"img/36_preview_top.jpg"},{"c":"拡大","d":"img/36_preview_zoom.jpg"}]},{"num":"37","title":"大輪 — 牡丹一輪","mode":"SURFACE","path":"docs/samples/37_大輪_牡丹一輪","text":"<h3>ゴール（作り始める前に一文で決めた）<\/h3>\n<blockquote><strong>牡丹が一輪、260mm の紙面を丸ごと占める。 繰り返しは一度も無く、花芯が胸の真ん中に来る一枚。<\/strong><\/blockquote>\n<p>この作例で大げさにしたのは <strong>柄の大きさ<\/strong> ひとつだけ。テキスタイルの柄は 「小さい単位を敷き詰める」のが普通で、この道具の作例もほとんどがそうなって いる。ここでは<strong>単位が紙面と同じ大きさ<\/strong>——つまり単位が1個しかない。 花びらの1枚が 60mm、花芯が 90mm ある。<\/p>\n<p><strong>高さでは大げさにしていない。<\/strong>タイルは幅 9mm・高さ 3.35mm で <strong>0.37:1<\/strong>、 つまり幅のほうが 2.7倍ある。斜めから見ると平たく写るが、それでよい。 高さを盛れば絵は映えるが、それは生地としての良さではない（作例34 で 指摘を受けた癖そのもの）。<\/p>\n<h3>ゴールから逆算した機能の組み合わせ<\/h3>\n<table><tr><th>デザイン上の狙い<\/th><th>使った機能<\/th><\/tr><tr><td>花が紙面いっぱい<\/td><td>［幅］［奥行き］260 x 260mm ＋ 元画像を<strong>そのまま1枚<\/strong>（タイリング無し）<\/td><\/tr><tr><td>花びらの色<\/td><td>色＝画像 / 側面もテクスチャ<\/td><\/tr><tr><td>花びらの<strong>厚みの起伏<\/strong><\/td><td><strong>［高さの決め方］＝高さマップ<\/strong> ＋ 別画像 <code>depth_map.png<\/code><\/td><\/tr><tr><td>花びらの縁が丸い<\/td><td>［上面ふくらみ］0.35mm（ドーム）<\/td><\/tr><tr><td>階段を消す<\/td><td>［輪郭に合わせる］ON / 最終解像度 1024<\/td><\/tr><tr><td><strong>布のように曲がる<\/strong><\/td><td>［面を分割する］＝ボロノイ / <strong>9mm<\/strong> / すき間 0.6mm<\/td><\/tr><tr><td>花の後ろの闇<\/td><td>生地の下地 <code>CUSTOM<\/code> (0.015, 0.012, 0.014) / 織り<\/td><\/tr><\/table>\n<h3>元画像 — 色は1画素も触らず、高さだけ別の画像にした<\/h3>\n<p>素は ComfyUI（Qwen-Image 2512）で作った深紅の牡丹の写真1枚。 <code>tools/make_art_37.py<\/code> がやるのは<strong>アドオンが読める形への翻訳だけ。<\/strong><\/p>\n<pre>python docs/samples/tools/make_art_37.py<\/pre>\n<p><strong>ここで一度、設計を作り直している。<\/strong>最初はレリーフ（明るさ＝高さ）で 組んでいた。ところが出てくる面はほとんど平らで、花びらの重なりが読めない。<\/p>\n<p>原因は測ってすぐ出た。<strong>面モードのレリーフは輝度（Rec.709）を読む<\/strong>ので、 <strong>彩度の高い一色の絵には、そもそも高さの幅が無い。<\/strong>純粋な赤の輝度は 0.213 しかなく、深紅の花びらはどれも 0.15〜0.35 の狭い帯に固まる。<\/p>\n<table><tr><th><\/th><th>四分位の幅（上位25% − 下位25%）<\/th><\/tr><tr><td>明るさ（色から採った輝度）<\/td><td><strong>0.128<\/strong><\/td><\/tr><tr><td>高さマップ（別に作った白黒）<\/td><td><strong>0.341<\/strong><\/td><\/tr><\/table>\n<p><strong>2.7倍<\/strong>。しかも高さマップの側は下位1割 0.212・中央 0.612・上位1割 0.878 と、 使える範囲の端から端まで散っている。<\/p>\n<p>先に2つ試して、どちらも捨てた。<strong>どちらも「色を触って高さを稼ぐ」やり方で、 色のほうが壊れる。<\/strong><\/p>\n<ul><li>RGB を掛け算で持ち上げる → 赤が上限に張り付き、花びらのてかりが飛ぶ。 それでも四分位の幅は 0.161 までしか広がらない<\/li><li>明るさで背景を切り抜く → 外側の暗い深紅と黒が<strong>明るさでは区別できない<\/strong> ので、本物の花びらまで消える（右3分の1と下が丸ごと落ちた）<\/li><\/ul>\n<p>当てたのは、<strong>色と高さを別々の画像にすること<\/strong>。［高さの決め方］＝高さマップ はそのための設定で、説明文にもそう書いてある——「色とは別の画像で高さを 決めます。「赤いのに平ら」のように、色と高さを切り離したいときに使います」。<\/p>\n<p>高さマップは HSV の V（明度）から作る。V は彩度に引きずられないので、 深紅の花びらの中の<strong>光の当たり方<\/strong>だけを拾える。上下2%で伸ばしてから ガンマ 0.50 を掛け、0.8画素ぼかして格子に載らないざらつきを均す。<\/p>\n<p>道具は毎回<strong>陰性対照<\/strong>を印字する。<\/p>\n<pre>色の最大ずれ 0.00000（0 なら1画素も動かしていない）<\/pre>\n<p><strong><code>source.png<\/code> は元の写真の切り出しそのもの<\/strong>で、明るさも彩度も触っていない。 高さが変わっても色が動かないことを、目ではなく数で保証している。<\/p>\n<p><strong>切り抜かず、四角いまま使っている。<\/strong>背景の暗い所も生地として刷る。 3Dプリントは未裁断の大きな生地に対して行い、裁断はそのあとなので、 「花の形に抜く」ことに造形上の意味が無い（背景は生地の下地の色で沈む）。<\/p>\n<h3>分割の大きさは、条文の側から決まった<\/h3>\n<p>条文の「一つの要素は最大 XY 15mm」に<strong>最初は違反していた。<\/strong><\/p>\n<table><tr><th>［ブロックの大きさ］<\/th><th>いちばん大きいタイル<\/th><th>判定<\/th><\/tr><tr><td>12.0mm<\/td><td><strong>16 x 12mm<\/strong><\/td><td>✕ 上限 15mm を超える<\/td><\/tr><tr><td>9.0mm<\/td><td>（警告なし）<\/td><td>○<\/td><\/tr><tr><td>7.0mm / 5.5mm<\/td><td>（警告なし）<\/td><td>○<\/td><\/tr><\/table>\n<p>ボロノイは種を撒いて割るので、<strong>［ブロックの大きさ］はタイルの寸法では なく「だいたいの間隔」<\/strong>でしかない。12mm 指定で 16mm のタイルが出る。 だから数字で決めず、<strong>アドオン自身の警告が消えるまで下げて<\/strong>測った。<\/p>\n<p><strong>9mm を採ったのは、通る中でいちばん大きいから。<\/strong>割れ目が細かくなるほど 花は読みにくくなる——12mm のときは陶片を並べたように見えていたものが、 9mm では<strong>割れ目のほうが目立ちはじめる。<\/strong>下限側（7.0 / 5.5mm）も通るが、 そちらは花より網目が主役になる。ここは「造形の条文が上から押してくる」 ことがそのまま画に出た所で、隠さずに書いておく。<\/p>\n<h3>実測（v7.154.0 / 最終解像度 1024）<\/h3>\n<table><tr><th><\/th><th><\/th><\/tr><tr><td>頂点 / 面<\/td><td><strong>306,078 / 304,510<\/strong><\/td><\/tr><tr><td>評価済みワールド外接<\/td><td><strong>260.00 x 260.00 x 4.34mm<\/strong><\/td><\/tr><tr><td>生成<\/td><td>7.4〜8.3秒<\/td><\/tr><tr><td>いちばん大きいタイル<\/td><td>15mm 以下（アドオンの警告が出ない）<\/td><\/tr><\/table>\n<p><strong>高さ 4.34mm は、［最大高さ］3.0mm の指定と食い違わない。<\/strong>内訳は 生地の下地 1.0 ＋ 最大高さ 3.0 ＋ 上面ふくらみ 0.35 = 4.35mm で、実測と 0.01mm しか違わない。［最大高さ］は<strong>造形物の総高<\/strong>ではなく <strong>下地の上に載る分<\/strong>を指す。<\/p>\n<h3>うまくいっていない所<\/h3>\n<ul><li><strong>丸みが付いていない。<\/strong>［上端の丸み］0.25mm を指定したが、アドオン自身が 「実際に付いたのは約 0.000mm」と言う。輪郭が入り組んでいるほど小さくなる 仕様で、ボロノイの割れ目は入り組んでいる。v7.154.0 の既知の挙動で、 <code>欲しい機能_20260904.md<\/code> の項目18 として本部へ報告済み。この作例では <strong>丸みは［上面ふくらみ］が代わりに作っている<\/strong>ので画には出ていない<\/li><li><strong>斜めの見本（<code>preview.jpg<\/code>）では花が読めない。<\/strong>20度の定点カメラだと 背景の暗いタイルが手前を占め、花芯まで視線が届かない。<strong>この作例の絵は <code>preview_top.jpg<\/code>（真上）のほう<\/strong>で、斜めは「平たい板であること」を 確かめるための絵として置いてある<\/li><li><strong>割れ目が花びらと張り合っている。<\/strong>上に書いたとおり 9mm は条文で決まった 値で、デザインで選んだ値ではない。花の連続感を優先するなら分割を大きく したいが、それは造形できない<\/li><\/ul>\n<h3>ファイル<\/h3>\n<table><tr><th><\/th><th><\/th><\/tr><tr><td><code>source.png<\/code><\/td><td>448x448 / 不透明 / <strong>色は元の写真そのまま<\/strong><\/td><\/tr><tr><td><code>depth_map.png<\/code><\/td><td>448x448 / 白黒 / ［高さの決め方］＝高さマップ が読む<\/td><\/tr><tr><td><code>settings.json<\/code><\/td><td>349件<\/td><\/tr><tr><td><code>preview.jpg<\/code><\/td><td>斜め20度（アドオンの見本機能）<\/td><\/tr><tr><td><code>preview_top.jpg<\/code><\/td><td><strong>真上<\/strong>（<code>tools/render_top.py<\/code>）。この作例の主たる絵<\/td><\/tr><\/table>\n<p>再現するには:<\/p>\n<pre>python docs/samples/tools/make_art_37.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/37_大輪_牡丹一輪<\/pre>","imgs":[{"c":"斜め","d":"img/37_preview.jpg"},{"c":"真上","d":"img/37_preview_top.jpg"}]},{"num":"38","title":"大波 — 墨の粒","mode":"BRISTLE","path":"docs/samples/38_大波_墨の粒","text":"<h3>ゴール（作り始める前に一文で決めた）<\/h3>\n<blockquote><strong>墨の波が、太さの落差だけで立ち上がる一枚。 墨の濃い所は直径 6mm の礫、余白の空は直径 0.7mm の針。<\/strong><\/blockquote>\n<p>この作例で大げさにしたのは <strong>柱の太さの落差<\/strong> ひとつだけ。 実測で <strong>7.6倍<\/strong>（上位1割 5.67mm ÷ 下位1割 0.75mm）ある。<\/p>\n<p><strong>高さでは大げさにしていない。<\/strong>［高さを揃える］を ON にして <strong>全部の柱を 2.0mm ちょうど<\/strong>にしてあるので、絵を作っているのは太さだけ。 太い側の縦横比は <strong>0.33:1<\/strong>——高さより幅が3倍あり、棘ではなく礫に見える。 細い側でも 2.8:1 で、4:1 を超えない。<\/p>\n<h3>この作例だけ、桁が違う<\/h3>\n<p>これまでの柱モードの作例20件は、半径 0.32〜0.45mm（直径 0.64〜0.90mm）に 固まっていた。細かい柄を出そうとすると自然にそうなる。<\/p>\n<table><tr><th><\/th><th>直径<\/th><\/tr><tr><td>作例11〜36（柱モード）<\/td><td>0.64 〜 0.90mm<\/td><\/tr><tr><td><strong>この作例の太い側<\/strong><\/td><td><strong>6.00mm<\/strong>（<strong>約 7〜9倍<\/strong>）<\/td><\/tr><\/table>\n<p>半径の上限は 7.5mm（条文の「最大 XY 15mm」の半分）なので、6.0mm は <strong>制度上ほぼ端まで来ている。<\/strong>「大げさに」という指示に対して、 高さではなくここを端まで振ったのがこの作例。<\/p>\n<h3>ゴールから逆算した機能の組み合わせ<\/h3>\n<table><tr><th>デザイン上の狙い<\/th><th>使った機能<\/th><\/tr><tr><td>墨が太く、余白が細い<\/td><td><strong>［明暗による半径変化］ON ＋［反転］OFF<\/strong>（暗いほど太い）<\/td><\/tr><tr><td>細い側の下限<\/td><td>［最小半径比率］<strong>0.12<\/strong> → 直径 0.72mm（造形の下限 0.6mm）<\/td><\/tr><tr><td>太い側<\/td><td>［半径］<strong>3.0mm<\/strong> → 直径 6.0mm<\/td><\/tr><tr><td>礫の丸み<\/td><td>［形状］＝ドーム / ［上端の丸み］1.0<\/td><\/tr><tr><td><strong>高さは絵を作らない<\/strong><\/td><td>［高さを揃える］ON / ［最大高さ］2.0mm / 先細り 0.0<\/td><\/tr><tr><td>墨の色<\/td><td>色＝画像 / 側面もテクスチャ<\/td><\/tr><tr><td>和紙の地<\/td><td>生地の下地 <code>CUSTOM<\/code> (0.86, 0.845, 0.80) / 織り<\/td><\/tr><\/table>\n<p><strong>［反転］は OFF のまま。<\/strong>説明文が「通常は暗いほど太く、ONで明るいほど 太くなります」と書いているとおり、既定がこの作例の欲しい向きそのもの。<\/p>\n<h3>元画像 — ぼかすことが翻訳の全部<\/h3>\n<p>素は ComfyUI（Qwen-Image 2512）で作った墨絵の波1枚。 <code>tools/make_art_38.py<\/code> がやるのは<strong>アドオンが読める形への翻訳だけ。<\/strong><\/p>\n<pre>python docs/samples/tools/make_art_38.py<\/pre>\n<p><strong>柱1本が拾えるのは1点なので、柱の間隔と同じ幅でぼかしてから渡す。<\/strong> 柱は 6.7mm 間隔で並ぶ。300mm 幅・560画素の絵では 1マス = 12.4画素なので、 ぼかさずに渡すと、幅2〜3画素の波頭の渦は<strong>どの柱が拾うかが運<\/strong>になり、 太い柱と細い柱が波の形と関係なくまだらに出る。ガウス半径を1マスの 3分の1（4.1画素）にすると、柱1本は「その場の墨の濃さの平均」を読む。<\/p>\n<p><strong>強くぼかさないのは、波の縁を残すため。<\/strong>1マスぶん（12画素）ぼかすと 墨と余白の境目が3マスかけてなだらかになり、<strong>太さの落差そのものが消える。<\/strong> ぼかし半径は紙面の幅と柱の間隔から計算していて、数字を直に書いていない ——紙面や間隔を変えたときに前提が黙って古くならないように。<\/p>\n<p><strong>色は触らない。<\/strong>［明暗による半径変化］は明るさを読むので、明るさを動かす ことは太さを動かすことと同じ。ぼかし以外の加工を入れると「絵をどう見せたか」 と「どう刷ったか」が分けられなくなる。<\/p>\n<p>道具は毎回、造形の下限に当たっていないかを印字する。<\/p>\n<pre>いちばん細い柱 0.72mm（造形の下限 0.6mm）  OK\n太さの落差 7.6倍（上位1割 ÷ 下位1割）\n墨（明るさ&lt;0.35）25.7% / 余白（&gt;0.75）50.8%<\/pre>\n<p><strong>墨と余白の割合も見張っている。<\/strong>片方が1割を切ると、落差があっても 「落差のある絵」には見えない（全面が太いか、全面が細いかになる）。<\/p>\n<p><strong>右3分の1を落としてある。<\/strong>元の絵は余白が右に大きく空いていて、 柱の格子は<strong>絵が空でも等間隔に並ぶ<\/strong>ので、そのまま刷ると 「細い柱だけの区画」が紙面の3分の1を占めた。切り出しで渦を真ん中へ寄せた。<\/p>\n<h3>実測（v7.154.0）<\/h3>\n<table><tr><th><\/th><th><\/th><\/tr><tr><td>柱<\/td><td>46列 x 43行 = <strong>1,978本<\/strong><\/td><\/tr><tr><td>頂点 / 面<\/td><td>128,570 / 126,592<\/td><\/tr><tr><td>評価済みワールド外接<\/td><td><strong>305.90 x 286.42 x 2.00mm<\/strong><\/td><\/tr><tr><td>生成<\/td><td>3.6秒<\/td><\/tr><\/table>\n<p><strong>外接が 305.90mm なのは正しい。<\/strong>［幅］300mm は柱の<strong>中心から中心まで<\/strong>で、 刷られる箱はそこへ直径1本ぶん（最大 6.0mm）が足される。造形トレイ 460 x 360mm には収まっている。<\/p>\n<h3>途中で1回、丸ごと間違えている<\/h3>\n<p>最初の設定は作例33（輪郭だけの草花）から写して作った。そのとき <strong><code>edge_band_only_enable = True<\/code> を一緒に持ってきてしまい<\/strong>、 できたのは「紙面のいちばん外側の1周だけに柱があり、内側は空」という板だった。 頂点は 9,880——1,978本あるはずが 152本しかない。<\/p>\n<p><code>edge_band_only_enable<\/code> は作例33 の<strong>主役の機能<\/strong>（輪郭だけを刷る）で、 写した側では一度も名前が出てこない。<strong>設定を写して作るときは、 写し元の作例の「売り」になっている設定を先に数えて外すこと。<\/strong> 一緒に持ってきていた <code>black_cutoff = 0.30<\/code> も同時に 0.0 へ戻した。<\/p>\n<h3>うまくいっていない所<\/h3>\n<ul><li><strong>波の細部は残らない。<\/strong>6.7mm 間隔の格子で 300mm を割ると 46列しか無く、 波頭の細かい渦は1〜2粒に潰れる。<strong>これは太さを端まで振ったことの裏返し<\/strong> で、格子を細かくすれば直径 6mm の柱どうしが 0.6mm のすき間を保てない。 この作例は「絵を精密に写す」ものではなく「網点そのものを見せる」もの<\/li><li><strong>斜めの見本では、細い柱が針に見える。<\/strong>直径 0.72mm・高さ 2.0mm で 2.8:1 なので数字の上では棘ではないが、太い側と並ぶと相対的に鋭く見える。 ［最大高さ］を 1.4mm まで下げると 1.9:1 になり印象は和らぐが、 太い側の礫の丸みも一緒に薄くなる。2.0mm はその折り合いで置いた値<\/li><\/ul>\n<h3>ファイル<\/h3>\n<table><tr><th><\/th><th><\/th><\/tr><tr><td><code>source.png<\/code><\/td><td>560x528 / 不透明 / <strong>ぼかし以外の加工なし<\/strong><\/td><\/tr><tr><td><code>settings.json<\/code><\/td><td>350件<\/td><\/tr><tr><td><code>preview.jpg<\/code><\/td><td>斜め20度（アドオンの見本機能）<\/td><\/tr><tr><td><code>preview_top.jpg<\/code><\/td><td><strong>真上<\/strong>（<code>tools/render_top.py<\/code>）。網点として読むならこちら<\/td><\/tr><\/table>\n<p>再現するには:<\/p>\n<pre>python docs/samples/tools/make_art_38.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/38_大波_墨の粒<\/pre>","imgs":[{"c":"斜め","d":"img/38_preview.jpg"},{"c":"真上","d":"img/38_preview_top.jpg"}]},{"num":"39","title":"棚田 — 段になる面","mode":"SURFACE","path":"docs/samples/39_棚田_段になる面","text":"<h3>ゴール（作り始める前に一文で決めた）<\/h3>\n<blockquote><strong>等高線の帯が段になって、平らな台地と垂直の崖だけでできた一枚。 坂は一つも無い。<\/strong><\/blockquote>\n<p>この作例で大げさにしたのは <strong>高さの落差<\/strong> ひとつだけ。ただし <strong>尖らせて稼いでいない。<\/strong>段は6つで、1段 0.8mm ずつ、いちばん低い所と 高い所で 4.0mm 離れている。台地の幅は 5〜25mm あるので、<strong>どの段も 高さより幅のほうが桁で大きい。<\/strong>作例38 と対にしてある——あちらは 太さの落差だけ、こちらは高さの落差だけで、どちらも棘は使っていない。<\/p>\n<h3>ゴールから逆算した機能の組み合わせ<\/h3>\n<table><tr><th>デザイン上の狙い<\/th><th>使った機能<\/th><\/tr><tr><td>段になる高さ<\/td><td><strong>［高さの決め方］＝高さマップ<\/strong> ＋ <strong>6段に量子化した<\/strong> <code>depth_map.png<\/code><\/td><\/tr><tr><td>段の高さ<\/td><td>［最大高さ］4.0mm → 1段 0.8mm<\/td><\/tr><tr><td><strong>崖が垂直<\/strong><\/td><td>［高さのなめらかさ］<strong>0.0<\/strong>（下記）/ ［上面ふくらみ］OFF<\/td><\/tr><tr><td>台地が平ら<\/td><td>［上端の丸み］OFF / ［高さのガンマ］1.0<\/td><\/tr><tr><td>棚田の色<\/td><td>色＝画像 / 側面もテクスチャ<\/td><\/tr><tr><td><strong>布のように曲がる<\/strong><\/td><td>［面を分割する］＝ブロック / 12mm / すき間 0.6mm<\/td><\/tr><tr><td>谷の影<\/td><td>生地の下地 <code>CUSTOM<\/code> (0.05, 0.055, 0.045) / 織り<\/td><\/tr><\/table>\n<p><strong>［高さのなめらかさ］が 0.0 でなければ、この作例は成立しない。<\/strong> 段の境目をぼかす設定なので、少しでも上げると崖が坂になり、 「6段」がただの起伏に戻る。作例37 では 0.15 を入れている（あちらは 花びらの重なりをなめらかにしたい）——<strong>同じ設定が、作例によって 主役にも邪魔にもなる。<\/strong><\/p>\n<h3>元画像 — 段は元データの側で作る<\/h3>\n<p>素は ComfyUI（Qwen-Image 2512）で作った棚田の写真1枚。 <code>tools/make_art_39.py<\/code> がやるのは<strong>アドオンが読める形への翻訳だけ。<\/strong><\/p>\n<pre>python docs/samples/tools/make_art_39.py<\/pre>\n<p><strong>アドオンには高さを段にする設定が無い。<\/strong>面モードのレリーフも高さマップも、 明るさをそのまま高さにする。だから量子化は元データの側でやる。 （<code>欲しい機能_20260904.md<\/code> の項目22 として本部へ報告した。）<\/p>\n<p>翻訳は2つ。<\/p>\n<p>1. <strong>色と高さを別々の画像にする。<\/strong>作例37 と同じ理由に加えて、ここでは <strong>高さだけを段にしたい<\/strong>（色は連続のままがよい）ので、そもそも 1枚では両立しない。<code>source.png<\/code> は写真の切り出しそのもの。<\/p>\n<p>2. <strong>量子化の前にぼかす（ガウス半径 1.6画素）。<\/strong>ぼかさずに段へ割ると、 写真の粒子が段の境目をまたいで<strong>崖が1画素ごとにぎざぎざになる。<\/strong> ぼかしを掛けるのは高さマップの側だけで、色には掛けない。<\/p>\n<p>段の数は6にした。3段では棚田に見えず、10段では1段 0.4mm になって <strong>造形の粗さに埋もれる<\/strong>（最終解像度1024・紙面280mmで1マス 0.27mm）。<\/p>\n<p>道具は毎回、段になっていることと色を触っていないことを印字する。<\/p>\n<pre>高さマップに出た値 0, 51, 102, 153, 204, 255（6通り）\n  値   0  面積 34.5%     値 153  面積  9.8%\n  値  51  面積 20.7%     値 204  面積 11.5%\n  値 102  面積 12.3%     値 255  面積 11.3%\n中間の値の割合 0.0000%（0 に近いほど段）\n色の最大ずれ 0.00000（0 なら1画素も動かしていない）<\/pre>\n<p><strong>「中間の値の割合」が陽性側の見張り。<\/strong>ぼかしを量子化の<strong>後<\/strong>へ掛けて しまうと、ここが 0 でなくなる——段が段でなくなったことが数に出る。<\/p>\n<h3>［面を分割する］の位相で、紙面が 1.46mm 痩せていた<\/h3>\n<p>最初の設定（作例37 から写した）では ［位相X］0.15 ／［位相Y］0.37 で、 測ると <strong>278.54 x 280.00mm<\/strong>——指定した 280mm より <strong>X だけ 1.46mm 狭い。<\/strong><\/p>\n<p>切り分けは3通り測って付いた。<\/p>\n<table><tr><th><\/th><th>外接<\/th><\/tr><tr><td>そのまま<\/td><td><strong>278.54<\/strong> x 280.00mm<\/td><\/tr><tr><td>［面を分割する］OFF<\/td><td>280.00 x 280.00mm<\/td><\/tr><tr><td>［位相X］を 0.37（Y と同じ）に<\/td><td>280.00 x 280.00mm<\/td><\/tr><\/table>\n<p><strong>分割の格子のすき間が、ちょうど紙面の右端に重なっていた。<\/strong> 分割は輪郭を動かすので、これは不具合ではなく素直な帰結だが、 <strong>画面のどこにも出ない<\/strong>（［幅］は 280 のまま）。位相を揃えて直した。 <code>欲しい機能_20260904.md<\/code> の項目23 として本部へ報告した。<\/p>\n<h3>実測（v7.154.0 / 最終解像度 1024）<\/h3>\n<table><tr><th><\/th><th><\/th><\/tr><tr><td>頂点 / 面<\/td><td><strong>296,450 / 295,392<\/strong><\/td><\/tr><tr><td>評価済みワールド外接<\/td><td><strong>280.00 x 280.00 x 5.00mm<\/strong><\/td><\/tr><tr><td>生成<\/td><td>7.8秒<\/td><\/tr><tr><td>いちばん大きいタイル<\/td><td>15mm 以下（アドオンの警告が出ない）<\/td><\/tr><\/table>\n<p><strong>高さ 5.00mm の内訳<\/strong>は 生地の下地 1.0 ＋ 最大高さ 4.0。 ［上面ふくらみ］も丸みも切ってあるので、指定した値の和とぴったり合う （作例37 は上面ふくらみ 0.35 が乗るので 4.34mm だった）。<\/p>\n<h3>うまくいっていない所<\/h3>\n<ul><li><strong>段の高さは、棚田の本当の高さではない。<\/strong>量子化しているのは 写真の<strong>明るさ<\/strong>で、水を張った田（白）といちばん暗い畦が両端に来る。 だから隣り合う段が実際の地形どおりに上下しているわけではない。 柄としては段が交互に来るほうがむしろ布らしいので直していないが、 <strong>地形模型ではない<\/strong>ことは書いておく<\/li><li><strong>12mm のブロック格子は、等高線と関係が無い。<\/strong>曲がる帯を直交格子で 切っているので、タイルの切れ目が柄の流れと噛み合わない。 ［面を分割する］には角度を持つ縞もあるが、等高線は湾曲しているので どの角度でも合わない。<strong>柄に沿って割る手段が無い<\/strong>のが素直な所で、 真上から見ると格子は薄いので実害は小さい<\/li><li><strong>崖の面には色が付いている（側面もテクスチャ）。<\/strong>真横から見ると 崖に写真が引き伸ばされて写る。単色にする手もあるが、そうすると 真上から見たときの段の境目が黒く縁取られて見えるので、こちらを採った<\/li><\/ul>\n<h3>ファイル<\/h3>\n<table><tr><th><\/th><th><\/th><\/tr><tr><td><code>source.png<\/code><\/td><td>448x448 / 不透明 / <strong>色は元の写真そのまま<\/strong><\/td><\/tr><tr><td><code>depth_map.png<\/code><\/td><td>448x448 / 白黒 <strong>6値のみ<\/strong><\/td><\/tr><tr><td><code>settings.json<\/code><\/td><td>349件<\/td><\/tr><tr><td><code>preview.jpg<\/code><\/td><td>斜め20度。<strong>この作例の主たる絵<\/strong>（段はここでしか読めない）<\/td><\/tr><tr><td><code>preview_top.jpg<\/code><\/td><td>真上（<code>tools/render_top.py<\/code>）。柄と格子の関係を見る絵<\/td><\/tr><\/table>\n<p>再現するには:<\/p>\n<pre>python docs/samples/tools/make_art_39.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/39_棚田_段になる面<\/pre>","imgs":[{"c":"斜め","d":"img/39_preview.jpg"},{"c":"真上","d":"img/39_preview_top.jpg"}]},{"num":"40","title":"砂丘 — 稜線に立つ柱","mode":"BRISTLE","path":"docs/samples/40_砂丘_稜線に立つ柱","text":"<p class=\"lead\">&gt; 依頼:「iris van herpen がやりそうなデザインで何か作例を作ってみて下さい。」<\/p><blockquote>依頼:「iris van herpen がやりそうなデザインで何か作例を作ってみて下さい。」<\/blockquote>\n<h3>ゴール（作り始める前に一文で決めた）<\/h3>\n<blockquote><strong>砂丘を上から見たときの、光が乗った稜線だけが柱になって立ち上がる。 谷は生地がそのまま覗き、稜へ近づくほど柱が高くなって、 てっぺんの透明が一本の光の帯になる。<\/strong><\/blockquote>\n<p>van Herpen の服を「柄」として真似ると、たいてい細い等高線の集合になる。 けれど彼女が Stratasys で実際に出しているのは<strong>小さな要素が群になって うねる<\/strong>面で、Kinematics 系のドレスも Ludi Naturae の水紋も、近くで見ると 粒の集合、離れて見ると大きな一筆のうねりになっている。<strong>この二重の 読み方が、このアドオンの柱モードそのもの<\/strong>なので、そこへ寄せた。<\/p>\n<h3>ゴールから逆算した機能の組み合わせ<\/h3>\n<table><tr><th>デザイン上の狙い<\/th><th>使った機能<\/th><\/tr><tr><td>濃紺の地が谷から覗く<\/td><td>生地の下地 ON / 色 <code>CUSTOM<\/code> (0.028, 0.033, 0.055) / 織り<\/td><\/tr><tr><td>群になってうねる<\/td><td>柱モード ／ 中心間隔 2.0mm ／ 131 x 171 ＝ <strong>22,401本<\/strong><\/td><\/tr><tr><td>稜へ近づくほど高い<\/td><td>［高さを揃える］OFF ＋ ［明度反転］<strong>ON<\/strong> ／ ［最大高さ］3.9mm<\/td><\/tr><tr><td>谷では柱が消える<\/td><td>［最小高さカットオフ］<strong>0.75mm<\/strong><\/td><\/tr><tr><td>粒に見えて棘に見えない<\/td><td>断面［円］頂点16 ／ ［上面ドーム］0.50 ／ ［先細り］0.05<\/td><\/tr><tr><td>稜の上だけが光る<\/td><td>［透明］範囲＝上だけ ／ 色付き部分 45%<\/td><\/tr><\/table>\n<p><strong>［間引き］［領域マスク］［縁の傾斜］［輪郭に合わせる］は使っていない。<\/strong> 疎密は元絵の明暗が既に持っていて、そこへマスクを重ねると稜の形が濁る （34 と同じ理由）。<\/p>\n<h3>元画像<\/h3>\n<p>ComfyUI（Qwen-Image 2512）で作った、上空から見た砂丘の単色写真1枚。 1024x1344 ＝ 0.762 で、紙面 260x340mm ＝ 0.765 とほぼ同じ比率なので <strong>切り取っていない<\/strong>。<\/p>\n<pre>python docs/samples/tools/make_art_40.py 40_砂丘_稜線に立つ柱/source.png<\/pre>\n<p>道具がやるのは、ぼかして正規化してガンマ 0.65 で谷を持ち上げ、 濃紺→淡い銀青のランプに乗せることだけ。柄そのものは描いていない。 <strong>ランプはリニア空間で引く<\/strong>（理由は下の「測って分かったこと」）。<\/p>\n<h3>実測<\/h3>\n<pre>評価済みワールド外接   261.10 x 341.10 x 2.57mm\n頂点 12,243,920 / 面 12,079,098 / 生成 4.6秒\nBristleClear        面  6,604,653   Z 0.346 〜 2.574mm\nBristleVertexColor  面  5,474,445   Z 0.000 〜 1.146mm<\/pre>\n<p>格子は 22,401 マスあるが、［最小高さカットオフ］0.75mm で谷が抜けるので <strong>実際に立っているのは 11,773本（52.6%）<\/strong>。道具が絵から予測した 52.9% と 合う——これが「谷は生地が覗く」が数字で成り立っていることの確認になる。<\/p>\n<table><tr><th>造形の条件<\/th><th>値<\/th><th>判定<\/th><\/tr><tr><td>トレイ 460x360mm<\/td><td>261.10 x 341.10mm<\/td><td>OK<\/td><\/tr><tr><td>1要素の最小 XY 0.6mm<\/td><td>直径 1.10mm<\/td><td>OK<\/td><\/tr><tr><td>すき間 0.6mm<\/td><td>0.90mm<\/td><td>OK<\/td><\/tr><tr><td>1要素の最大 XY 15mm<\/td><td>1.10mm<\/td><td>OK<\/td><\/tr><tr><td>縦横比（棘に寄っていないか）<\/td><td><strong>2.36<\/strong>（34 は 2.86）<\/td><td>OK<\/td><\/tr><tr><td>オーバーハング<\/td><td><strong>0面 / 0.0mm²<\/strong>（v7.191.0 で実測）<\/td><td>OK<\/td><\/tr><\/table>\n<p>外接が指定より 1.10mm 大きいのは、［幅］［奥行き］が<strong>柱の中心から中心まで<\/strong> だから。直径ちょうど1個ぶん広い（v7.168.0 が画面に出すようになった数字と 同じ話）。<\/p>\n<h3>撮り直した理由 — 先端が外へ広がっていた（v7.190.0 で直った）<\/h3>\n<p><strong>この表の「オーバーハング OK」は、v7.189.0 までは嘘だった。<\/strong> 上の行はもともと「先細り 0.05（外へ広がらない）」と書いてあって、 <strong>測らずに設定から推した<\/strong>もの。実際には［上端の丸み］0.50 の縮み量が ［先細り比率］0.05 と無関係に素で引かれていたので、<strong>先端の半径が 軸の向こう側へ飛んで、傘のように外へ開いていた<\/strong>。<\/p>\n<p>自分で測り直した（<code>scratchpad/probe_overhang_40.py<\/code>。柱1本を島に分け、 Z の輪ごとに XY 半径の最大を採って、上へ行くほど太くなる所を探す ——アドオンの検査を借りない外側の基準）。<\/p>\n<table><tr><th><\/th><th>上へ行くほど太くなる量の最大<\/th><th>アドオンの検査<\/th><\/tr><tr><td>v7.189.0<\/td><td><strong>0.1039mm<\/strong>（z 3.839→3.900 で 半径 0.1436 → 0.2475）<\/td><td>2,174,144面 / 2822.7mm²<\/td><\/tr><tr><td>v7.191.0<\/td><td><strong>0.000000mm<\/strong><\/td><td>0面 / 0.0mm²<\/td><\/tr><\/table>\n<p>（この表は［高さを揃える］を入にして全部の柱を最大高さで立てて測った値 なので、本部が作例そのままで測った 870,944面 / 2318.2mm² より大きい。 カットオフで消える柱の分だけ、こちらのほうが本数が多い。）<\/p>\n<p><strong>半径が 0.1436 から 0.2475 へ、いちばん上の 0.061mm で 1.7 倍になっていた<\/strong> ——これが「傘」の正体で、<code>preview_macro.jpg<\/code> はその修正後の姿。いまは 先端まで真っ直ぐ細くなる円錐で、頂点は 12,243,920 個のまま変わっていない （動いたのは先端の頂点の位置だけ）。<\/p>\n<p><strong>教訓は自分に向いている。<\/strong>造形の条件の表は、他の5行が実測なのに この1行だけ「設定から見て大丈夫なはず」で埋めていた。<strong>設定を根拠に した行は、測った行と同じ表に並べてはいけない。<\/strong><\/p>\n<h3>失敗した2つの当て<\/h3>\n<p><strong>この作例は3回目で通った。<\/strong>1回目と2回目は面モードで、どちらも捨てた。<\/p>\n<p>1. <strong>面モード + 等高線の絵。<\/strong> 等高線の帯が細かすぎて、260mm の紙面では 1本が 0.5mm 前後にしかならない。しかも面モードは1枚の板なので ［面を分割する］が必須で、その 9mm のセルの<strong>垂直な壁<\/strong>が、滑らかな 3mm の稜より強く読めた。1回目は石畳、2回目は格子の焼き網に見えた。 <strong>高さを 1.4 → 3.0mm に上げたら、壁も一緒に高くなって悪化した。<\/strong> これは 39 の README に既に書いてあることを、自分でもう一度踏んだ ——「12mm の直交格子は曲がった等高線に沿ってくれない」。<\/p>\n<p>2. <strong>陰影から高さを起こす（1次元積分）。<\/strong> 等高線が曲がっているので光の 向きが一つに決まらず、±x でも ±y でも縞が出た。両方作って、両方見て 捨てた。<\/p>\n<p>残ったのは<strong>絵の明るさをそのまま高さとして読む<\/strong>こと。砂丘は明るい筋が そのまま稜なので、これがいちばん素直に効く。<\/p>\n<p><strong>柱モードにしたことで［面を分割する］が要らなくなった<\/strong>のが決め手。 柱は最初から離れた要素なので、15mm の条文を構造として満たしている。 2回の失敗の原因そのものが消えた。<\/p>\n<h3>測って分かったこと — 明るさが高さになる式<\/h3>\n<p><strong>最初にここを読み違えて、1回目の提出は設計と上下が逆だった。<\/strong> 外接の Z がちょうど［最大高さ］に届いたのを見て「道具が明るさを 0〜1 へ 正規化している」と結論したが、<strong>その説明では説明できない<\/strong>ことが、 横方向のグラデーション5枚を当てたら出た（<code>scratchpad/probe_brightness.py<\/code>）。<\/p>\n<table><tr><th>元絵の明るさの範囲<\/th><th>［明度反転］<\/th><th>実測のいちばん高い柱<\/th><\/tr><tr><td>0.00〜1.00<\/td><td>OFF<\/td><td>4.000mm<\/td><\/tr><tr><td>0.35〜0.45<\/td><td>OFF<\/td><td>3.600mm<\/td><\/tr><tr><td>0.60〜0.70<\/td><td>OFF<\/td><td>2.726mm<\/td><\/tr><tr><td>0.35〜0.45<\/td><td>ON<\/td><td>0.686mm<\/td><\/tr><tr><td>0.60〜0.70<\/td><td>ON<\/td><td>1.803mm<\/td><\/tr><\/table>\n<p>正規化していれば5枚とも 4.000mm になるはずで、ならない。合う式は1つ:<\/p>\n<pre>［明度反転］OFF   高さ = 最大高さ x (1 - リニア化した明るさ)\n［明度反転］ON    高さ = 最大高さ x     リニア化した明るさ<\/pre>\n<p>（［最大高さ］4.0mm で予測 4.000 / 3.598 / 2.726 / 0.683 / 1.792mm。 「リニア化」は sRGB → リニアの標準の式。）<\/p>\n<p><strong>帰結が2つあり、両方この作例に効いた。<\/strong><\/p>\n<p>1. <strong>既定は「暗いほど高い」。<\/strong> 1回目の提出は反転OFFのままだったので、 明るい稜が低く、暗い谷に柱が立っていた。しかもランプの明るさが 0.003〜0.664 なので高さは 0.87〜2.59mm にしか振れず、 <strong>カットオフ 0.75mm を1本も下回らない<\/strong>——「谷は生地が覗く」も 起きていなかった（頂点 23,297,040 ＝ 22,401本すべて）。 絵を見て「抜けている」と読んだのは、短く暗い柱を地と見間違えていた。 2. <strong>色の選び方が高さを動かす。<\/strong> リニア化が挟まる以上、谷と稜の色は 高さの形そのもの。だから道具はランプを<strong>リニア空間で引いて<\/strong>から sRGB へ書き戻す。そうするとリニアの明るさが高さの素の一次式になり、 高さの形が絵の柄そのものになる（道具が陽性対照で 0.000000000 と印字）。 ［最大高さ］はもう「いちばん高い柱の高さ」ではないので、 稜を 2.6mm にするために 3.9mm を入れている（実測 2.574mm）。<\/p>\n<h3>自分の見立て<\/h3>\n<p><strong>2回目の提出で通ったと思う。<\/strong>真上から見ると、濃紺の織地を斜めに横切る 稜の帯が銀青の柱の群として立ち、谷は生地のまま抜けている。斜めから見ると 11,773本が一枚のうねりに見える。「近くで粒・遠くで一筆」は出ている。 <strong>1回目に自分で「通った」と言った絵は、これと上下が逆だった<\/strong>ので、 そこは撤回する。<\/p>\n<p><strong>弱いところが2つ。<\/strong>帯の幅が中央値 39.9mm と広く、紙面を横切る稜は 2〜3本しかない。もう1つは、柱が有るか無いかの境目が<strong>1本ぶんで切り替わる<\/strong> こと——カットオフは段差なので、稜の裾が砂丘のようになだらかに終わらず、 型で抜いたような縁になる。裾をぼかすには柱の高さではなく<strong>密度<\/strong>を 落とす必要があり、それは［間引き］の仕事になる（この作例では使っていない）。 服の一部として切り出すと「大きなうねりが1本」になる面積が 出る。もっと帯を増やすなら元絵の側で稜を細かくするしかなく、 <strong>そうすると1回目の失敗（帯が細くなりすぎる）へ戻る<\/strong>ので、 どこで折り合うかは実物を刷ってみないと決められない。<\/p>","imgs":[{"c":"斜め","d":"img/40_preview.jpg"},{"c":"真上","d":"img/40_preview_top.jpg"},{"c":"拡大","d":"img/40_preview_macro.jpg"}]},{"num":"41","title":"琥珀 — 浮いた芯","mode":"SURFACE","path":"docs/samples/41_琥珀_浮いた芯","text":"<p class=\"lead\">&gt; 依頼（本部）:「外皮・底の外皮・クリアの色、次の作例で当ててください。\n&gt; 底の外皮（<code>transparent_shell_bottom_mm<\/code>）は既定 0.0 ＝ 芯が床に着く形で、\n&gt; 柱モードの見た目は v7.157.0 から変わっています。上げた分だけ芯が浮いて、\n&gt; そこも透明材になります。」<\/p><blockquote>依頼（本部）:「外皮・底の外皮・クリアの色、次の作例で当ててください。 底の外皮（<code>transparent_shell_bottom_mm<\/code>）は既定 0.0 ＝ 芯が床に着く形で、 柱モードの見た目は v7.157.0 から変わっています。上げた分だけ芯が浮いて、 そこも透明材になります。」<\/blockquote>\n<h3>ゴール（作り始める前に一文で決めた）<\/h3>\n<blockquote><strong>琥珀の中に閉じ込められた種を、生地の上に並べる。色の付いた芯は 床から浮いていて、透明な琥珀だけが四方から包んで生地まで降りている。<\/strong><\/blockquote>\n<p>「浮いている」ことが読めなければ作例にならないので、<strong>芯の色は 琥珀の色より暗く保ち<\/strong>、外皮は透明のまま飴色に染める。<\/p>\n<h3>ゴールから逆算した機能の組み合わせ<\/h3>\n<table><tr><th>デザイン上の狙い<\/th><th>使った機能<\/th><\/tr><tr><td>種が琥珀に包まれている<\/td><td>［透明］［範囲］＝<strong>外皮<\/strong> ／［方式］＝比率 ／ 色付き部分 73%<\/td><\/tr><tr><td>芯が床から浮く<\/td><td>［底の外皮 (mm)］ <strong>0.70mm<\/strong> ← 本部が当ててほしいと言った設定<\/td><\/tr><tr><td>琥珀の飴色<\/td><td>［クリアの色］ (1.00, 0.62, 0.18) ／［クリア度合］0.30<\/td><\/tr><tr><td>種が粒に見える<\/td><td>面モード ／［高さの決め方］フラット ／［最大高さ］<strong>2.6mm<\/strong><\/td><\/tr><tr><td>濃紺の地<\/td><td>生地の下地 ON ／ 色 <code>CUSTOM<\/code> (0.035, 0.045, 0.060) ／ 織り<\/td><\/tr><tr><td>輪郭が階段にならない<\/td><td>［輪郭の吸着］ON ／［透明しきい値］0.5<\/td><\/tr><\/table>\n<p><strong>［面を分割する］［ブラシ複合］［領域マスク］は使っていない。<\/strong> 粒は元絵が既に24個に分かれていて、分割線を足すと琥珀が割れて見える。<\/p>\n<h3>元画像<\/h3>\n<p>ComfyUI（Qwen-Image 2512）で作った、白地に並ぶ種の絵1枚。<\/p>\n<pre>python docs/samples/tools/make_art_41.py<\/pre>\n<p>道具がやるのは、白地をしきい値で抜いてアルファにし、種の中の明暗を 狭い帯へ圧縮して琥珀茶のランプへ乗せ直すことだけ。柄は描いていない。 <strong>ランプの明るさが、この作例では見た目をまるごと決めている<\/strong> （下の「測って分かったこと」の1つめ）。<\/p>\n<h3>実測<\/h3>\n<pre>評価済みワールド外接   58.8 x 60.0 x 2.60mm（指定は 幅 60.0 x 奥行き 61.3mm）\n頂点 454,340 / 生成 4.3秒 / 設定 適用353件・非適用0件\n\n外皮か True ／ 基準の高さ 2.600mm ／ 側面と天面の厚み t = 0.7020mm\n                                    底の外皮        L = 0.7000mm\n\n  BristleSurfaceTexture（芯）  面 193,272   Z  0.700 〜 1.898mm\n  BristleClear（琥珀）         面 260,996   Z  0.000 〜 2.600mm<\/pre>\n<p><strong>芯の Z 範囲 0.700〜1.898 が、そのまま <code>L<\/code> 〜 <code>H − t<\/code> になっている。<\/strong> 下端 0.700 ＝［底の外皮］、上端 1.898 ＝ 2.600 − 0.702。透明材だけが 床（Z=0）に着き、色の付いた芯はどこにも触れていない。これがこの作例の 主題そのもので、<strong>数字が一致するかで合否が判定できる<\/strong>。<\/p>\n<table><tr><th>造形の条件<\/th><th>値<\/th><th>判定<\/th><\/tr><tr><td>いちばん大きい要素<\/td><td>8 x 15mm（アドオンの報告）<\/td><td>上限 15.0mm — 際どいが通る<\/td><\/tr><tr><td>いちばん小さい要素の短辺<\/td><td>6.56mm<\/td><td>下限 0.6mm — OK<\/td><\/tr><tr><td>外皮を巻いたあとに残る芯の幅<\/td><td>4.96mm<\/td><td>芯が読める — OK<\/td><\/tr><tr><td>造形範囲<\/td><td>58.8 x 60.0mm<\/td><td>460 x 360mm — OK<\/td><\/tr><tr><td>オーバーハング<\/td><td>0面 / 0.000mm²（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><td>OK<\/td><\/tr><tr><td>開いた縁<\/td><td>0本（<code>_bf_eval_nonmanifold_counts<\/code>）<\/td><td>閉じている — OK<\/td><\/tr><tr><td>面が3枚以上集まる辺<\/td><td>24本（鉛直・高さ2.6mm貫通・各4面）<\/td><td>判定対象外 / v7.136.0<\/td><\/tr><\/table>\n<p>最後の3行は<strong>推測ではなく、アドオン自身の検査を呼んで測った<\/strong>（上限15mm の行と造形範囲の行は生成時の報告そのまま）。<\/p>\n<p>24本のほうは、<strong>最初「外皮の底のリングが床で触れている所だろう」と書いて 外した。<\/strong>測ったら床ではなく、24本とも<strong>鉛直で、高さ 2.6mm を上から下まで 貫いていて、辺ごとに4面<\/strong>が集まっている——粒の輪郭どうしが1つの格子点で 触れている縦の稜で、v7.136.0 が「柄の角どうしが1点で触れている辺」と 書いているものそのもの。<strong>［透明］を丸ごとOFFにしても24本のまま<\/strong>なので、 外皮とは無関係で、元絵の輪郭が持っている性質。GrabCAD Print のモデル解析は これを判定項目に持たず、アドオンも v7.136.0 の判断で黙るので、<strong>直す対象では ない<\/strong>。<\/p>\n<h3>測って分かったこと<\/h3>\n<h4>1. 透明材の色は、内側から返ってくる光でしか見えない<\/h4>\n<p>最初のランプは 0.018〜0.120（ほぼ黒）だった。<strong>その状態では ［クリアの色］を何色にしても、変わるのは縁のごく細い線だけ<\/strong>で、 粒は「黒い円柱に金色の縁が付いた物」にしか写らない。琥珀の外皮は 透明材なので、<strong>背後に光を返す物が無ければ色を持てない<\/strong>。 芯を蜂蜜色（0.100〜0.450）まで上げたところで、初めて外皮が 「濃い飴色の膜」として読めるようになった。<\/p>\n<p><strong>［クリアの色］の作例を作るなら、芯の明るさを先に決めること。<\/strong><\/p>\n<h4>2. ［高さマップ］は足し算なので、外皮と併用できない<\/h4>\n<p>粒の天面が平らで「ボタン」に見えたので、粒ごとのドームを高さマップで 足そうとした。<strong>外した<\/strong>。<code>v.co.z += depth_value * strength<\/code> で、土台は ［最大高さ］のままフラットに立つ——3mm の円筒の上に 1mm のドームが 乗るだけになる（実測：［最大高さ］3.0mm を指定して、生成物の Z は 0〜4.000mm）。<\/p>\n<p>ドームを主にするには［最大高さ］を下げて強さを上げることになるが、 <strong>外皮の厚みも底の外皮も <code>_bf_ttop_ref_height<\/code>＝［最大高さ］から 決まる<\/strong>ので、土台だけを見た値になって両方壊れる（H=0.8 なら 比率 0.20 で外皮 0.16mm、底の外皮の頭打ち <code>0.65H − t<\/code> は負＝0）。 この2つが今回の主題なので、丸みのためにそこを崩すのは本末転倒だった。<\/p>\n<p>採った当ては「粒を低くする」こと。高さ 2.6mm・幅 7〜14.65mm なら、 天面が平らでも円筒には見えない。<\/p>\n<h4>3. ［方式］＝厚み(mm) に切り替えると、琥珀が丸ごと消えた<\/h4>\n<p><code>transparent_top_mm<\/code> に 0.7 を書いた settings.json を適用したのに、 生成物に <code>BristleClear<\/code> の面が1つも出ない。原因は<strong>設定を当てる順<\/strong>で、 <code>transparent_bottom_mm_ui<\/code> の update が後から走って <code>transparent_top_mm<\/code> を <code>H − bottom_mm_ui<\/code> で上書きし、t が 0.0 になる。 <strong>その状態でも「適用353件 / 非適用0件」と出て、生成も警告を出さない。<\/strong> 比率（RATIO）に戻し、<code>transparent_top_mm<\/code> / <code>transparent_bottom_mm_ui<\/code> / <code>transparent_bottom_percent<\/code> の3つを互いに辻褄の合う値で揃えてある。 本部へ報告済み。<\/p>\n<h4>4. 天面が真っ白に飛んだのは、飽和ではなく鏡の角度だった<\/h4>\n<p><code>render_macro.py<\/code> で撮ると天面が一様に飛び、そこだけ色が1画素も読めない。 対照を9枚当てた。<\/p>\n<table><tr><th>当てたこと<\/th><th>結果<\/th><\/tr><tr><td>灯を消す（強さ 0）<\/td><td>消える → 出どころは太陽で確定<\/td><\/tr><tr><td>灯を3割にする<\/td><td><strong>消えない<\/strong><\/td><\/tr><tr><td>太陽の見かけを 9°→60°<\/td><td><strong>消えない<\/strong><\/td><\/tr><tr><td>芯の鏡面を殺す<\/td><td>消える（材質をいじるので採れない）<\/td><\/tr><tr><td>見上げ角を 20°→6°<\/td><td><strong>消えない<\/strong><\/td><\/tr><tr><td>逆光の傾き rx 78°→62°<\/td><td>少し弱まる<\/td><\/tr><tr><td><strong>逆光の傾き rx 78°→48°<\/strong><\/td><td><strong>消える。琥珀色が戻る<\/strong><\/td><\/tr><\/table>\n<p><strong>弱めても大きくしても消えなかったので、いったん「この道具では撮れない」と 書いた。それが間違いだった。<\/strong>逆光は <code>rx=78°<\/code> ＝ 水平から 12° に置いてあり、 平らな天面での鏡像は反対側の 12° へ返る——見上げ角 6〜20° のカメラが ちょうどその中に座っている。灯を弱めれば弱まった鏡面反射が写るだけだし、 太陽を大きくしても元が広いので鈍らない。<strong>角度を変えるまで、どの摘みも 効かなくて当然だった。<\/strong><\/p>\n<p>道具に <code>--back-elev<\/code> を足した（既定は 78 のまま。柱を撮るときの縁の光りは この低い逆光が作っているので、<strong>天面が広い被写体のときだけ下げる<\/strong>）。<\/p>\n<pre>BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup \\\n    --python docs/samples/tools/render_macro.py -- \\\n    docs/samples/41_琥珀_浮いた芯 --at 0.5,0.45 --span 22 \\\n    --elev 8 --back-elev 48<\/pre>\n<h3>この作例の出来（自己評価）<\/h3>\n<p><strong>外皮・底の外皮・クリアの色は、数字では完全に一致している<\/strong>（芯 Z 0.700〜1.898／クリア Z 0.000〜2.600／床に着いているのは透明材だけ）。<\/p>\n<p>絵として読めるかは、<strong>寄り（<code>preview_macro.jpg<\/code>）だけが合格<\/strong>。琥珀色の 壁と、その中に浮いた芯の円盤と、根元の「芯が来ていない帯」が見える。 <code>preview.jpg<\/code> は琥珀の板が並んでいることは分かるが、浮いていることは 読めない。<code>preview_top.jpg<\/code> は真上から見た輪郭の確認用で、外皮も底の 外皮も<strong>写らない<\/strong>（上から見ると芯の天面しか見えない）。<\/p>\n<p>弱いと分かっていて直さなかったところが2つある。<\/p>\n<ul><li><strong>絵の上では、芯の天面が外皮の壁より明るく写る。<\/strong>値としては芯 (0.10〜0.45) のほうが［クリアの色］(1.00, 0.62, 0.18) より暗いが、 外皮は透明なので壁は「その先にある濃紺の生地」の明るさになる。 「琥珀の中の種」なら種はもっと暗くしたいところだが、暗くすると 1. の理由で外皮が色を持てなくなる。<strong>外皮の色を見せるほうを採った<\/strong>。<\/li><li>側面に細い縦の筋が出る。輪郭の吸着で側面が格子の列ごとに面へ 割れているためで、生成物そのものの形。<\/li><\/ul>\n<h3>作った版<\/h3>\n<p>アドオン v7.174.0（<code>_samples_wt<\/code> の複製で検査）。<\/p>","imgs":[{"c":"斜め","d":"img/41_preview.jpg"},{"c":"真上","d":"img/41_preview_top.jpg"},{"c":"拡大","d":"img/41_preview_macro.jpg"}]},{"num":"42","title":"乾いた大地 — 肩の砂粒が裾で硝子になる","mode":"SURFACE","path":"docs/samples/42_乾いた大地_肩の砂粒が裾で硝子になる","text":"<p class=\"lead\">作例室が自分で選んで作った1件（依頼ではない）。<\/p><p>作例室が自分で選んで作った1件（依頼ではない）。<\/p>\n<h3>ゴール（作り始める前に一文で決めた）<\/h3>\n<blockquote><strong>肩では砂粒ほどの細かい小片が肌のように詰まっていて、裾へ下るにつれて 小片が一枚ずつ大きくなり、同時に色を失って透明な硝子の甲になる。<\/strong><\/blockquote>\n<p>縦方向の階調が<strong>2つ<\/strong>ある。粒の大きさ（3.6mm → 10.9mm）と、材（粘土 → 硝子）。同じ軸に2つ重ねたのは、片方だけでは「途中で何かが変わった」に 見えないため——大きさだけなら遠近の絵に見え、材だけなら模様に見える。 2つが一緒に進むと、身体を下るにつれて<strong>別の生きものの皮膚に変わる<\/strong>と読める。<\/p>\n<h3>この作例の出発点は「15mm 上限」そのもの<\/h3>\n<p>［1つの要素は最大 XY 15mm］［最小 0.6mm］［すき間 0.6mm］の3つを合わせると、 この道具が刷れるのは<strong>面でも線でもなく、離れて並んだ小片<\/strong>である。だから 題材は「もともとバラバラに割れている物」から選ぶ——鱗・干割れ・石畳・種子・ 羽根・貝。詳しくは <code>../リサーチ_3Dプリントとファッション_20260905.md<\/code> の追記。<\/p>\n<p>干割れの地面を<strong>遠近つきで<\/strong>撮った絵を選んだのは、遠近がそのまま粒の 大きさの階調になるから。焦点（放射の中心）が無いので反物として繰り返せる。<\/p>\n<h3>ゴールから逆算した機能の組み合わせ<\/h3>\n<table><tr><th>デザイン上の狙い<\/th><th>使った機能<\/th><\/tr><tr><td>粒が1枚ずつ独立して曲がる<\/td><td>面モード ／［高さの決め方］フラット ／［最大高さ］<strong>1.6mm<\/strong><\/td><\/tr><tr><td>裾へ行くほど硝子になる<\/td><td>［透明］［出どころ］＝<strong>画像<\/strong> ／ 2枚目のマスク<\/td><\/tr><tr><td>硝子の色<\/td><td>［クリアの色］(0.70, 0.84, 0.93) ／［クリア度合］0.55<\/td><\/tr><tr><td>粘土の地色<\/td><td>元画像側で (0.50, 0.41, 0.30) ＋粒ごとに ±10%<\/td><\/tr><tr><td>割れ目が布のまま残る<\/td><td>生地の下地 ON ／ 濃い焦茶 ／ 織り<\/td><\/tr><tr><td>輪郭が階段にならない<\/td><td>［輪郭の吸着］ON ／［透明しきい値］0.5<\/td><\/tr><tr><td>（効いていない）<\/td><td>［丸み量］0.25mm は記録してあるが、［角の丸み］のスイッチが切なので面取りは走っていない（2026-09-06 に訂正）<\/td><\/tr><\/table>\n<p><strong>［面を分割する］は使っていない。<\/strong> 元絵が最初から 1654 枚に割れていて、 分割線を足すと「割れた物をさらに切った」形になる。<\/p>\n<h3>元画像<\/h3>\n<p>ComfyUI（Qwen-Image 2512）で作った干割れの地面1枚から、道具が組み立てる。<\/p>\n<pre>python docs/samples/tools/make_art_42.py &quot;42_乾いた大地_肩の砂粒が裾で硝子になる&quot;<\/pre>\n<p>出るのは <code>source.png<\/code>（色＋アルファ）と <code>transparent_mask.png<\/code>（黒い所が 透明材）。<strong>透明は粒ごとに丸ごと決める<\/strong>——面モードは面の UV の平均で マスクを引いて 0/1 にするので（v7.135.0）、なめらかな階調を渡すと粒の <strong>途中に<\/strong>境目が走る。1粒＝1枚のスパンコールとして扱い、裾へ行くほど 硝子になる粒の割合を上げた（スパンコール刺繍のオンブレと同じ手つき）。<\/p>\n<h3>測った値<\/h3>\n<pre>1000x1222 ／ 紙面 260x318mm ＝ 1画素 0.260mm\n粒 1654枚（切断 104回 / 大きすぎ 0 / 細すぎ 248）\n  差し渡し 中央 5.2mm（0.8〜14.8）上限 15mm -&gt; OK\n  太さ     中央 2.1mm（1.0〜10.4）下限 0.6mm -&gt; OK\n  帯ごとの差し渡し中央（肩→裾）: 3.6mm 7.3mm 9.9mm 10.9mm\n  粒が覆う面積 36.1% ／ 透明にした粒 343枚（21%）\n  格子 1024 で数え直すと 粒 1696枚 / 最大 14.9mm / 15mm超 0枚 -&gt; OK<\/pre>\n<p>いちばん細い粒が 1.0mm・高さ 1.6mm なので縦横比 1.6。<strong>棘に寄っていない<\/strong> （<code>../柱の縦横比_20260905.md<\/code>）。<\/p>\n<h3>作りながら3回直した<\/h3>\n<p><strong>1. すき間 0.6mm では足りなかった。<\/strong> 自分の絵（1画素 0.260mm）で数えると 「最大 14.8mm・上限超え 0枚」なのに、本体が組む格子（最終 1024 ＝ 1マス 0.311mm）で数え直すと<strong>15mm 超が 37枚・最大 27.0mm<\/strong>。割れ目が 2マスを 切ると、セル中心が割れ目の中に落ちないまま隣どうしが繋がる。<strong>造形条件の 数字をそのまま使っても、刷られる物では守れていない。<\/strong>3マス以上を要求して 1.1mm にしたら 0枚になった。被覆は 46% → 36% へ落ちたが、<strong>絵はむしろ 良くなった<\/strong>——粒が「布の上に離れて置かれた小片」に見えるようになり、 それが実際の造形物でもある。道具に <code>check_on_grid()<\/code> を足して、Blender を 起こす前にこの数を出すようにした。<\/p>\n<p><strong>2. 粒の色が白すぎた。<\/strong> 最初は骨白 (0.86, 0.83, 0.76)。クリアの淡い水色と 明るさがほぼ同じなので、寄って見ると「白い板」と「白い硝子板」が並ぶだけで、 <strong>材が入れ替わっていない<\/strong>。ゴールの一文は「色を失って」なので、失う色が 要る。粘土色まで落とした。<\/p>\n<p><strong>3. 粒の全周に黒い縁が焼き付いていた。<\/strong> アルファの縁は 0 と 1 の間を なだらかに渡るので、外側の色を 0（黒）のままにすると、その帯で粒の色と 黒が混ざる。天面の外周が煤けたように濃くなる——<strong>寄りで撮って初めて 見えた<\/strong>。色だけを外へ6画素滲ませて直した（形は触らない）。既知の症状 （<code>docs/lessons.md<\/code> の Black fringe / v7.31.0）と同じ根。<\/p>\n<p>行き止まりの記録（割れ目そのものを刷ろうとして4通りとも外した話、元絵を 1枚差し替えた話、局所しきい値と分水嶺を外した話）は <code>tools/make_art_42.py<\/code> の冒頭に表で残してある。<\/p>\n<h3>見本<\/h3>\n<table><tr><th><\/th><th><\/th><\/tr><tr><td><code>preview.jpg<\/code><\/td><td>斜め・最終生成<\/td><\/tr><tr><td><code>preview_top.jpg<\/code><\/td><td>真上。<strong>階調はこれがいちばん読める<\/strong><\/td><\/tr><tr><td><code>preview_macro.jpg<\/code><\/td><td>裾に寄る（46mm 幅・最終解像度）。粘土と硝子が並ぶ所<\/td><\/tr><\/table>\n<h3>自分の評価<\/h3>\n<p><strong>採る。<\/strong>真上の絵が答えになっている——上から下へ、粒が育ちながら色を失う。 焦点が無いので反物として繰り返せるし、粒の並びが自然なので「計算で作った 模様」に見えない。オートクチュールのスパンコール刺繍が持っている「一枚ずつ 違う」感じが、位置ずれの無い形で出ている。<\/p>\n<p>弱いところを3つ、正直に書く。<\/p>\n<ul><li><strong>粘土色がやや赤い。<\/strong>焼き物のタイルに寄っていて、日に焼けた土からは 離れた。彩度を落とすほうが「乾いた」に近いが、そうすると硝子との差も 縮む。ここは次の作例で振り直す。<\/li><li><strong>側面が階段になっている。<\/strong>1マス 0.311mm の格子で 1.6mm の壁を立てて いるので、寄ると刻みが見える。［輪郭の吸着］は天面の輪郭には効くが、 壁の刻みは残る。実物では 0.3mm の段なので手では触って分からないはずだが、 絵では目立つ。<\/li><li><strong>裾の粒が硝子に寄りすぎる帯がある。<\/strong>確率で決めているので、たまたま 硝子が5〜6枚固まる所ができる。オンブレとしては自然だが、「粘土が ぽつぽつ残る」という狙いから見ると密度が足りない帯がある。<\/li><\/ul>","imgs":[{"c":"斜め","d":"img/42_preview.jpg"},{"c":"真上","d":"img/42_preview_top.jpg"},{"c":"拡大","d":"img/42_preview_macro.jpg"}]},{"num":"43","title":"43_綸子_光の向きでだけ現れる紋","mode":"BRISTLE","path":"docs/samples/43_綸子_光の向きでだけ現れる紋","text":"<p class=\"lead\"><strong>ゴール（一文）:<\/strong> 一色の象牙色の面で、柄は色でも凹凸でもなく**光の\n向きだけ**で現れる。正面から見ると無地、傾けると紋が浮かぶ。<\/p><p><strong>ゴール（一文）:<\/strong> 一色の象牙色の面で、柄は色でも凹凸でもなく<strong>光の 向きだけ<\/strong>で現れる。正面から見ると無地、傾けると紋が浮かぶ。<\/p>\n<h3>何を狙ったか<\/h3>\n<p>綸子（りんず）は、同じ色の糸だけで織られた紋織。柄が見えるのは、 経糸が浮いている所と緯糸が浮いている所とで<strong>光の返り方が違う<\/strong>から だけで、染め分けはしていない。この作例はそれを柱で作る。<\/p>\n<p><strong>織物にできないことを1つ足してある。<\/strong>織機の浮きは経か緯の2方向 しか取れないが、ここでは紋の<strong>内側で向きが連続的に回る<\/strong>——紋の輪郭 からの距離で等高線を引き、その等高線に沿って柱を寝かせている。地は 一方向で固定なので、綸子の朱子地にあたる。<strong>2方向しか持てない織物に 対する、この道具の側の答え<\/strong>がこの1点。<\/p>\n<h3>仕掛け — 向き以外の経路を全部塞いだ<\/h3>\n<p>［要素の向き］＝<strong>流れに沿う<\/strong>（FLOW）だけが元絵を読む。ほかは全部 止めてある。<\/p>\n<table><tr><th>経路<\/th><th>止め方<\/th><\/tr><tr><td>アルファ（輪郭）<\/td><td>全面 255。抜けている所が無い<\/td><\/tr><tr><td>高さ<\/td><td>［高さを揃える］入。全部 2.2mm<\/td><\/tr><tr><td>半径<\/td><td>［明暗による半径変化］切<\/td><\/tr><tr><td>色<\/td><td>［色］＝<strong>根元から先端へ<\/strong>。元絵の色を一切読まない<\/td><\/tr><tr><td>間引き<\/td><td>切<\/td><\/tr><\/table>\n<p>だから元絵は<strong>思いきり明暗を付けてよい<\/strong>。刷り上がりは一色になる。<\/p>\n<h4>確かめた（陰性対照）<\/h4>\n<p>［要素の向き］を <strong>固定<\/strong> に落とし、<strong>ほかは1つも変えずに<\/strong>同じ光で 撮った。<\/p>\n<p>紋の痕跡が1つも無い、一様なリブの面になる。<strong>向き以外の経路は本当に 何も運んでいない。<\/strong><\/p>\n<h4>寄り<\/h4>\n<p>1.92 × 0.64mm の刃が1本ずつ違う向きを向いている。広い面を見せている 柱と、細い縁だけを見せている柱が混ざっているのが、そのまま明暗になる。<\/p>\n<h3>造形条件（生成前に検算し、生成後に実測）<\/h3>\n<table><tr><th><\/th><th>値<\/th><th>条件<\/th><\/tr><tr><td>柱の太さ（細い側）<\/td><td>0.64mm<\/td><td>下限 0.6mm → OK<\/td><\/tr><tr><td>すき間<\/td><td>0.62mm<\/td><td>下限 0.6mm → OK<\/td><\/tr><tr><td>高さ<\/td><td>2.2mm<\/td><td>0.4〜15mm → OK<\/td><\/tr><tr><td>実際の造形範囲<\/td><td>262.0 × 320.0 × 2.20mm<\/td><td>トレイ 460×360 → OK<\/td><\/tr><tr><td>柱の本数<\/td><td>103 × 126 = 12,978本<\/td><td><\/td><\/tr><\/table>\n<p>幅の指定は 260mm なのに実測 262.0mm。［幅］は柱の<strong>中心から中心まで<\/strong> なので、外形は刃1本ぶん広い（v7.168.0 の報告どおり）。<\/p>\n<p>高さ 2.2mm ÷ 細い側 0.64mm = <strong>3.4:1<\/strong>。棘に寄っていないか毎回数える ことにしているので記録しておく。［先細り］は 0.55（上端 0.35mm）。 最初 0.15 で組んだが、上端が 0.096mm の針になっていたので戻した ——長い側の側面の傾きは 7°→3.7° としか変わらず、<strong>光沢にはほとんど 効かないのに針だけが残る<\/strong>、割の合わない値だった。<\/p>\n<h3>作り方<\/h3>\n<p>python tools/make_art_43.py     # source.png を作る<\/p>\n<p>元絵は Qwen-Image 2512（ComfyUI）で作った唐花丸紋の半送り配置。それを そのまま使うのではなく、<strong>紋の内側を等高線の場に置き換えて<\/strong>いる。<\/p>\n<p>1. 明るさで紋を切り出す 2. <strong>柱の間隔の半分の半径で、閉じてから開く。<\/strong>柱1本より細い蔓草は 格子が読めないので落とす（順が逆だと、蔓が太ってから消えなくなる） 3. 輪郭からの符号つき距離を採り、<strong>三角波<\/strong>に通す。三角波を選んだのは <strong>勾配の大きさが至る所で一定<\/strong>だから——FLOW の門は勾配の大きさで 判定するので、正弦波だと山と谷で柱が固定へ落ちる 4. <strong>柱の間隔で場をならす<\/strong>（紋の内側だけ）。距離場の等高線は輪郭の 細部にそのまま従うので、格子が追えない速さで向きが変わる区画が できる。そこは柱ごとにばらばらの角度になり、絵の上では紋ではなく <strong>ざらつき<\/strong>として出た（向きの地図を実測して見つけた） 5. 紋の外は一定の灰色。勾配ゼロ＝門の下＝<strong>固定へ落ちる<\/strong>ので、 地が一方向に揃う。<strong>門は邪魔ものではなく、地を作る道具<\/strong><\/p>\n<h4>FLOW の門（実測）<\/h4>\n<p>元絵の勾配を、アドオンと同じ条件（1.5画素・リニア）で数えた。<\/p>\n<table><tr><th><\/th><th>中央値<\/th><th>門（0.002）を割る割合<\/th><\/tr><tr><td>紋の側<\/td><td>0.0430<\/td><td>1.30%（低いほどよい）<\/td><\/tr><tr><td>地の側<\/td><td>—<\/td><td>100.0%（<strong>全部落ちてほしい<\/strong>）<\/td><\/tr><\/table>\n<h3>自分の評価<\/h3>\n<p><strong>仕掛けとしては成功。<\/strong>狙った現象は起きているし、対照が効いている ので「たまたまそう見えている」ではないことも示せた。向きという、 この道具でいちばん地味な設定1つだけで柄を作れると分かったのは収穫で、 色も高さも空いたままなので<strong>この上に別の柄を重ねられる<\/strong>。<\/p>\n<p><strong>デザインとしては、まだ大人しい。<\/strong>正直に言えば、上の全景は 上等なジャカードのテーブルクロスに見える。オートクチュールの面で 勝負するには、綸子の「無地に見える」という美点がそのまま 「遠目に何も起きていない」になってしまう。舞台やコンテストの 照明距離では、たぶん誰も気づかない。<\/p>\n<p><strong>次に試すべきはこの2つ<\/strong>と考えている。<\/p>\n<ul><li><strong>地を無地のまま、紋だけ高さを少し上げる。<\/strong>綸子の禁を破ることに なるが、近くで見たときの陰影と遠目のシルエットが両立する。 向きが主・高さが従、という重ね方はまだ試していない<\/li><li><strong>紋を大きくして数を減らす。<\/strong>いまは 260mm に丸紋が4つ半。 身頃1枚に<strong>1つ<\/strong>なら、光の向きで現れたり消えたりすることが 歩くだけで起きる。小さく繰り返すほど「生地の texture」に見え、 大きいほど「意匠」に見える<\/li><\/ul>\n<h3>この作例で分かった、道具の側の話<\/h3>\n<p><strong>［見本を作る］の既定の光では、この作例は撮れない。<\/strong>初版の <code>preview.jpg<\/code> （アドオン 7.174.0・拡散光）は一様な淡い面にしか写らなかった。 <strong>光が四方から来ているから<\/strong>で、 アドオンの見本は太陽を4灯（別々の向きから）＋環境光を最大で当てている （<code>_bf_render_preview_image<\/code>）。柱を Z 軸まわりに回しても天面の法線は 真上のままなので、向きが明るさに変わるのは<strong>側面が見えていて、しかも その側面に届く光が方向を持っているとき<\/strong>だけ。四方から同じだけ来る光の 下では、どの向きの側面も同じ明るさになって柄が消える。<\/p>\n<p>測った値。左右で柱の向きを 90 度変えた板の、左右の平均の明るさの隔たり （<code>tests/probe_orientation_light.py<\/code>。2026-09-05 に本部が見張りの ものさしとして <code>docs/samples/tools/<\/code> から移した）。<\/p>\n<table><tr><th>［要素の向き］<\/th><th>一方向の光<\/th><th>四方＋環境光<\/th><\/tr><tr><td>流れに沿う<\/td><td><strong>0.987<\/strong><\/td><td>0.030<\/td><\/tr><tr><td>固定（陰性対照）<\/td><td>0.004<\/td><td>0.000<\/td><\/tr><\/table>\n<p><strong>主光の高さは効かない。<\/strong>太陽1灯で高さだけを 8°〜85° に振ると 0.88 / 0.99 / 0.96 / 0.93 / 0.86 / 0.67 で、どこでも紋は出る。 この README の初版は「かすめ光でないと出ない」と書いていたが、 <strong>変数を1つずつ振って測ったら外れていた<\/strong>——<code>render_macro.py<\/code> は 元から方向のある光（太陽3灯・環境光 0.30）なので、主光を 52°→8° へ 下げて良くなったのは「柱の丈と側面がよく見える」という別の効き目だった。 2つの症状を1つの原因で説明してしまった。<\/p>\n<p>別途 <code>欲しい機能_20260905_見本の光.md<\/code> に上げた。<strong>その答えが v7.180.0 の ［一方向の光で撮る］<\/strong>（<code>export_preview_directional_light<\/code>）で、いまの <code>preview.jpg<\/code> は 2026-09-06 に <code>_samples_wt<\/code> を 7.185.0（<code>67d7287<\/code>）へ 上げてから、<code>settings.json<\/code> にその 1 行を足して撮り直したもの。 柱の本数（103 × 126）と造形範囲（262.0 × 320.0 × 2.20mm）は初版と同じ。 撮り直しの絵は、初版では何も無かった同じ板に紋の円が並んで読める ——<strong>この作例の主張が、道具の見本の絵で初めて成り立った。<\/strong> 明るさの散らばりは、絵ぜんたいの標準偏差で 7.9 → 51.2（拡散 → 一方向）。<\/p>","imgs":[{"c":"斜め","d":"img/43_preview.jpg"},{"c":"全景","d":"img/43_preview_rake.jpg"},{"c":"拡大","d":"img/43_preview_macro.jpg"},{"c":"対照","d":"img/43_preview_control.jpg"}]},{"num":"44","title":"雨だれ — 生地を走る透明な粒","mode":"BRISTLE","path":"docs/samples/44_雨だれ_生地を走る透明な粒","text":"<p class=\"lead\">作例室が自分で選んで作った1件（依頼ではない）。<\/p><p>作例室が自分で選んで作った1件（依頼ではない）。<\/p>\n<h3>ゴール（作り始める前に一文で決めた）<\/h3>\n<blockquote><strong>紺の生地の上を、雨だれが4筋、蛇行しながら流れ落ちている。筋の上では 粒が大きく密に、筋から離れると小さくまばらになって霧のように消える。 粒は全部が透明材で、色は生地だけが持つ。<\/strong><\/blockquote>\n<p>同じ透明材でも 34（縁が光る）・41（浮いた芯）・42（裾で硝子になる）とは 違う使い方にした。ここでは透明材に<strong>色も芯も無い<\/strong>——粒そのものは何も 語らず、<strong>どこに粒が有るか<\/strong>だけが柄。雨の跡がそうであるように。<\/p>\n<h3>「筋1本」は失敗だった<\/h3>\n<p>最初は幅 36mm の筋を1本だけ流した。撮ってみると、220mm の紙面に点線が 1本あるだけで、<strong>流れの向きが読めない<\/strong>。雨だれは1本では雨に見えず、 何本か並んで初めて「降っている」になる。<\/p>\n<p>だから4本にし、<strong>太さ（12〜22mm）と強さ（0.58〜1.00）をわざと揃えなかった<\/strong> ——揃えると縞になる。筋の上には粗いむら（70mm 周期）を掛けて、粒が数珠の ように途切れる所を作った。これが無いと筋がコードに見える。<strong>上から下への 階調は付けていない<\/strong>——34 と 42 が既にその軸を使っている。<\/p>\n<h3>ゴールから逆算した機能の組み合わせ<\/h3>\n<table><tr><th>デザイン上の狙い<\/th><th>使った機能<\/th><\/tr><tr><td>粒が水滴の断面（平たい半楕円）<\/td><td>柱モード ／［形状］ドーム ／［先細り］<strong>1.0<\/strong> ／［最大高さ］3.0mm<\/td><\/tr><tr><td>筋の上で大きく、離れると小さく<\/td><td>［明暗による半径変化］／［最小半径比率］0.12 ／ 半径 5.0mm<\/td><\/tr><tr><td>筋から離れると粒が消える<\/td><td>元画像のアルファ（遠い所は透過）／［透明しきい値］0.5<\/td><\/tr><tr><td>粒が全部透明<\/td><td>［透明］［範囲］上だけ ／［色付き部分］<strong>0%<\/strong><\/td><\/tr><tr><td>硝子の見た目<\/td><td>［クリアの色］(0.86, 0.92, 1.00) ／［クリア度合］0.85<\/td><\/tr><tr><td>生地だけが色を持つ<\/td><td>生地の下地 ON ／ 紺 (0.018, 0.032, 0.085) ／ 織り<\/td><\/tr><\/table>\n<h3>元画像<\/h3>\n<p><code>tools/make_art_44.py<\/code> で作った。700x955px、紙面 220x300mm。<\/p>\n<ul><li>4本の筋は正弦の蛇行で、筋からの距離のガウスで濃さを決める。<strong>足さずに 最大を取る<\/strong>——足すと筋が交わる所で太る。<\/li><li>濃さ → 粒の大きさ（明度）と有無（アルファ）の両方に写す。<\/li><li><strong>柱モードは明るさをリニアで読む<\/strong>ので、明度は sRGB へ符号化してから 書いている（作例42 の報告8 と同じ）。<\/li><\/ul>\n<h3>自分で数えたこと<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>粒の直径<\/td><td>3.16〜10.00mm<\/td><td>0.6〜15mm ✓<\/td><\/tr><tr><td>粒どうしのすき間<\/td><td>1.40mm（中心間隔 11.4mm）<\/td><td>0.6mm ✓<\/td><\/tr><tr><td>粒の高さ<\/td><td>0.67〜2.76mm（実測の最高 Z）<\/td><td>0.4〜15mm ✓<\/td><\/tr><tr><td>縦横比（高さ÷直径）<\/td><td>0.21〜0.30<\/td><td>平たい。棘ではない<\/td><\/tr><tr><td>オーバーハング<\/td><td><strong>0 面<\/strong>（アドオンの検査 <code>_bf_eval_overhang_faces_world<\/code>）<\/td><td>✓<\/td><\/tr><tr><td>最低 Z<\/td><td>0.0000<\/td><td>床に着いている ✓<\/td><\/tr><tr><td>残る面積<\/td><td>全体 33%（筋の上 92%・遠く 1%）<\/td><td>—<\/td><\/tr><\/table>\n<h3>踏んだこと——ドームが弾丸に見えた原因は、自分の設定だった<\/h3>\n<p>最初の版では粒が<strong>ランプシェード<\/strong>に見えた。断面の半径を測ると、高さ半分の 所で 1.7mm（半楕円なら 4.3mm）。それを「ドームは弾丸型で水滴の断面が無い」 と読んで報告まで書いたが、原因は <code>settings.json<\/code> に前の試作の <strong>［先細り］0.0<\/strong> が残っていたこと。ドームは XY を <code>1 − z·(1 − 先細り)<\/code> で 縮めるので、0.0 では先が尖る。1.0 に戻すと半楕円になった （高さ 2.5 で半径 2.78。式なら 2.76）。<\/p>\n<p>同じ理由で、「［角の丸み］はオーバーハングになる」も先細り 0.0 のときだけの 話だった（<code>../報告_20260905_角の丸みがオーバーハングになる.md<\/code> に書き直し）。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>寄り（<code>preview_macro.jpg<\/code>）は狙いどおり。<\/strong> 平たい水滴が紺の織りの上に 乗り、粒の脇から生地が透けて見える。<\/li><li><strong>全景（<code>preview.jpg<\/code>・<code>preview_top.jpg<\/code>）では粒が白い点になる。<\/strong> アドオンの 見本の光（太陽4灯＋環境光最大）だとクリア材は白く飛ぶ。4筋の構図は 読めるが、「水」は寄りでしか読めない。<\/li><li><strong>粒の面が角張って見える。<\/strong> ドームは 16 分割で固定されていて、10mm の粒 だと1面が 2mm 近い。［頂点数］32 を入れてあるが、ドームには届いていない （<code>../欲しい機能_20260905_ドームの頂点数.md<\/code>）。<\/li><li>高さの上限 3.0mm に対して実測の最高が 2.76mm。元画像の最大明度が リニアで 1.0 に届いていない。刷る分には問題なく、直さない。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>雨に打たれた直後のトレンチやケープの<strong>肩と背中<\/strong>。粒は生地の上で完全に 透明なので、遠目には濡れた布、近づくと粒が立体だと分かる。透明材を 「何かを見せるため」ではなく「何も無いことを見せるため」に使う作例。<\/p>","imgs":[{"c":"斜め","d":"img/44_preview.jpg"},{"c":"真上","d":"img/44_preview_top.jpg"},{"c":"拡大","d":"img/44_preview_macro.jpg"}]},{"num":"45","title":"折り線 — 刷らない所でだけ折れる","mode":"SURFACE","path":"docs/samples/45_折り線_刷らない所でだけ折れる","text":"<p class=\"lead\">作例室が自分で選んで作った1件（依頼ではない）。**絵ではなく振る舞いが\n主題**の作例（リサーチ 5 章の「硬さの配置 #2」）。<\/p><p>作例室が自分で選んで作った1件（依頼ではない）。<strong>絵ではなく振る舞いが 主題<\/strong>の作例（リサーチ 5 章の「硬さの配置 #2」）。<\/p>\n<h3>ゴール（作り始める前に一文で決めた）<\/h3>\n<blockquote><strong>平らな板で反物を埋め、ミウラ折りの折り筋だけを刷らずに残す。布は その筋でしか折れないので、反物ぜんたいが1方向に引くだけで開閉する プリーツになる。<\/strong><\/blockquote>\n<h3>何を狙ったか<\/h3>\n<p>プリーツは布に「折れる線」を焼き付ける技法（三宅一生）。この道具で 同じことをするなら、<strong>折れてほしくない所を板で塞ぎ、折れてほしい線だけ 空ける<\/strong>——プリーツを負の空間で設計する。Nervous System の Kinematics は硬い板を蝶番で繋いで布にしたが、ここでは蝶番を機構ではなく<strong>布その もの<\/strong>にやらせる。<\/p>\n<p>折り筋はミウラ折り（三浦公亮）。直線の系統とジグザグの系統の2つで、 平行四辺形が並ぶ。人工衛星の太陽電池パネルを畳むのに使われた折り方で、 <strong>1方向に引くだけで全部が開き、押すだけで全部が畳まれる。<\/strong><\/p>\n<p><strong>どこで裁っても成立する。<\/strong>中心が無く、格子はどこまでも続く。<\/p>\n<p>板の2トーンは装飾ではなく<strong>情報<\/strong>——白亜の行は右へ、鼠の行は左へ傾く 平行四辺形で、ジグザグの向きがそのまま色で読める。<\/p>\n<h3>折り筋の幅は、板の厚みで決まる<\/h3>\n<p>180° まで折るとき、筋の中の布は半円になる。その直径 2g/π が向かい 合う板の天面の間隔で、板が内側へ h ずつ出るので<\/p>\n<p>g ≥ π · h        h = 1.0mm → g ≥ 3.14mm → <strong>3.2mm<\/strong><\/p>\n<p><strong>板は布の片面にしか無い<\/strong>ので、この条件が要るのは板側へ折る（谷）とき だけ。反対へ折る（山）ときは板どうしが開く。ミウラ折りはどの筋も山と 谷の両方を持つ（開閉で入れ替わる）ので、全部の筋を谷の条件で切った。<\/p>\n<h3>ゴールから逆算した機能の組み合わせ<\/h3>\n<table><tr><th>デザイン上の狙い<\/th><th>使った機能<\/th><\/tr><tr><td>平らで硬い板<\/td><td>面モード ／［高さの決め方］フラット ／ 1.0mm<\/td><\/tr><tr><td>板の有無だけが柄<\/td><td>元画像のアルファ ／［透明しきい値］0.5 ／［面を分割する］<strong>切<\/strong>（分割線は自分で引いている）<\/td><\/tr><tr><td>傾きの向きを色で<\/td><td>元画像の RGB（行ごとに2トーン）／ 側面もテクスチャ<\/td><\/tr><tr><td>角を少しだけ落とす<\/td><td><strong>効いていない。<\/strong>［丸み量］0.25mm × 3 段・上の縁と記録してあるが、［角の丸み］のスイッチが切なので面取りは走っていない（2026-09-06 に訂正）<\/td><\/tr><tr><td>折り筋が読める地<\/td><td>生地の下地 ON ／ 炭 (0.05, 0.05, 0.055) ／ 織り<\/td><\/tr><\/table>\n<h3>元画像<\/h3>\n<p><code>tools/make_art_45.py<\/code> で作った。1200x1500px、紙面 240x300mm。<\/p>\n<ul><li>セル 12×10mm、ずれ 3mm（斜線は 16.7°）、筋 3.2mm。<\/li><li>偶数行は右へ、奇数行は左へ傾け、基点を 3mm ずらしてジグザグが繋がる ようにしてある。<\/li><li>板 630 枚（縁で切れているものを除いて 570 枚）。<\/li><\/ul>\n<h3>自分で数えたこと<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>板の外接（元画像で計算）<\/td><td>10.60 × 6.80mm<\/td><td>15mm ✓<\/td><\/tr><tr><td>いちばん大きい要素（アドオンの報告）<\/td><td>11 × 7mm<\/td><td>15mm ✓<\/td><\/tr><tr><td>筋の幅（＝すき間）<\/td><td>3.2mm<\/td><td>0.6mm ✓<\/td><\/tr><tr><td>板の厚み<\/td><td>1.0mm（実測の最高 Z 1.00）<\/td><td>0.4〜15mm ✓<\/td><\/tr><tr><td>板の縦横比（厚み÷短辺）<\/td><td>1.0 ÷ 6.8 = 0.15<\/td><td>棘ではない<\/td><\/tr><tr><td>オーバーハング<\/td><td><strong>0 面<\/strong>（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><td>✓<\/td><\/tr><tr><td>最低 Z<\/td><td>0.0000<\/td><td>床に着いている ✓<\/td><\/tr><tr><td>実際の造形範囲<\/td><td>240.0 × 297.0 × 1.00mm<\/td><td>トレイ 460×360 ✓<\/td><\/tr><tr><td>板が占める面積<\/td><td>48.5%<\/td><td>—<\/td><\/tr><\/table>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上の絵はゴールどおり。<\/strong> 直線とジグザグの2系統がそのまま読め、 2トーンで傾きの向きが分かる。<\/li><li><strong>斜めの絵は「石畳」に寄る。<\/strong> 板の角が丸く、筋が広いので、折り紙の 図というより敷石に見える。<strong>この「角の丸さ」は面取りではない<\/strong>—— ［角の丸み］は切だったので、見えているのはプレビューの格子（0.47mm/マス） が輪郭を刻んだ丸さで、最初の 384 では板が小石になっていた（512 に上げて 撮り直した）。最終の 1024 で半分になる（2026-09-06 に訂正）。<\/li><li><strong>折った姿は見せられない。<\/strong> この道具は布の変形を持たない。作例の 主題である「振る舞い」は、この README の式でしか示せていない。<strong>刷って 折る<\/strong>のがこの作例の本当の見本で、それは作例室にはできない。<\/li><li><strong>板が半分しか無い。<\/strong> 筋の幅は厚みで決まり、板の大きさは 15mm で 頭を押さえられているので、48.5% はこの道具の中の落とし所。薄い板 （0.6mm → 筋 1.9mm）なら 65% まで上がるが、板が柔らかくなって「筋で しか折れない」が弱る。どちらが正しいかは刷ってみないと分からない。<\/li><\/ul>\n<p>寄り:<\/p>\n<h3>服として<\/h3>\n<p><strong>畳めるケープ、伸びるスカート。<\/strong> ミウラ折りは畳むと 1/5 程度の面積に なり、引くと元の面へ戻る。腰で畳んでおいて歩くと裾が開く、というのが この反物の一着。プリーツ加工は熱で焼き付けるので化繊にしかできないが、 これは板で塞ぐので<strong>綿でも絹でもプリーツになる<\/strong>——熱で焼けない布に 折り目を持たせる、というのがこの作り方の側の答え。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_45.py BF_ADDON_PATH=&lt;アドオン&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/45_折り線_刷らない所でだけ折れる blender --background --factory-startup --python docs/samples/tools/render_top.py -- docs/samples/45_折り線_刷らない所でだけ折れる blender --background --factory-startup --python docs/samples/tools/render_macro.py -- docs/samples/45_折り線_刷らない所でだけ折れる --at 0.5,0.5 --span 36 --elev 18<\/p>","imgs":[{"c":"斜め","d":"img/45_preview.jpg"},{"c":"真上","d":"img/45_preview_top.jpg"},{"c":"拡大","d":"img/45_preview_macro.jpg"}]},{"num":"46","title":"苔 — 石の上の座布団","mode":"BRISTLE","path":"docs/samples/46_苔_石の上の座布団","text":"<p class=\"lead\"><strong>石の上に育った苔の座布団を、灰色の生地の上に生やす。<\/strong> 座布団の縁は\n布に沈む低い粒で、中へ入るほど芽が伸びて 2.4mm の棍棒になる。触ると\n縁は硬く、中は撓む——見た目より先に、指が「苔だ」と言う反物。<\/p><p><strong>石の上に育った苔の座布団を、灰色の生地の上に生やす。<\/strong> 座布団の縁は 布に沈む低い粒で、中へ入るほど芽が伸びて 2.4mm の棍棒になる。触ると 縁は硬く、中は撓む——見た目より先に、指が「苔だ」と言う反物。<\/p>\n<p>リサーチの引き出し #7「正体の分からない素材」の 1 件目。#7 は「刷った 物だと分からせない」が狙いなので、柱の格子を<strong>見せない<\/strong>ために芽を 1.0mm・間隔 0.7mm まで詰め、断面をドーム・先細り 1.0 の丸い棍棒に した（円柱だと格子が「ドット印刷」に見える。作例44 の教訓）。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><td>芽 1 本ずつが独立していないと、押したとき撓まない<\/td><\/tr><tr><td>断面<\/td><td>ドーム、先細り 1.0<\/td><td>半楕円体＝棍棒。先細り &lt;1.0 だと［角の丸み］と組んでオーバーハングになる（報告 20260905）<\/td><\/tr><tr><td>半径 / 間隔<\/td><td>0.5mm / 0.7mm<\/td><td>直径 1.0 は「最小 XY 0.6mm」の上、すき間 0.7 は「0.6mm 空ける」の上。これ以上は詰められない<\/td><\/tr><tr><td>配置<\/td><td>レンガ<\/td><td>格子の直線を消す。ドーム×レンガで真上から見ても縦横の列が読めない<\/td><\/tr><tr><td>明暗による高さ変化 ON、明度反転 ON<\/td><td>最大高さ 4.0mm<\/td><td>明るい芽ほど高い。座布団の中央を明るく描いてある<\/td><\/tr><tr><td>高さを揃える<\/td><td>OFF<\/td><td>これが ON だと全部 4.0mm で揃い、座布団の膨らみが消える<\/td><\/tr><tr><td>側面の色<\/td><td>単色 (0.02, 0.06, 0.012)<\/td><td>芽の根元は暗い緑。上面だけ画像の色（黄緑〜青緑）を写す<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.30, 0.29, 0.27)<\/td><td>石。苔の下の灰色<\/td><\/tr><tr><td>透明<\/td><td>OFF<\/td><td>苔に透明は要らない<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_46.py<\/code>）<\/h3>\n<p>3 つの尺度の値ノイズ（48 / 22 / 9mm）を重ね、しきい値 0.40 より上を 座布団にした。座布団の中は <code>(場 − 0.40)^0.6<\/code> で中央ほど明るく、 1.2 × 間隔（≒2mm）の細かいノイズで芽 1 本ずつの高さを揺らす。色は <strong>リニアで<\/strong>暗緑 → 黄緑／青緑（70mm の尺度で混ぜる）へ補間してから sRGB に符号化した——柱モードは明るさをリニアで読むので、そうしないと 「明るさ = 高さ」の対応が絵の見た目と食い違う。<\/p>\n<p>しきい値は最初 0.50 で、座布団が 37% しか無く<strong>迷彩の斑<\/strong>に見えた。 0.40 に下げて 57%。それでも真上から見ると迷彩に近い（下の自己評価）。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>220×300 → <strong>221.0 × 301.0 × 2.45mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>芽の数（格子）<\/td><td>130 × 177<\/td><td>—<\/td><\/tr><tr><td>芽の直径 / すき間<\/td><td>1.00mm / 0.70mm<\/td><td>≥0.6 / ≥0.6 ✓<\/td><\/tr><tr><td>芽の高さ<\/td><td>0.4（床）〜 2.45mm<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>縦横比（高さ ÷ 直径）<\/td><td>最大 2.45<\/td><td>棘ではない ✓<\/td><\/tr><tr><td>床 0.4mm を切って消える芽<\/td><td>元画像の見積もりで 3.5%（座布団の縁）<\/td><td>意図どおり<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong>、最低 Z 0.0000<\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><tr><td>座布団が占める面積<\/td><td>56.7%<\/td><td>—<\/td><\/tr><tr><td>頂点<\/td><td>808,795（プレビュー）<\/td><td>—<\/td><\/tr><\/table>\n<p>最大高さは 4.0 と指定して 2.45 で止まる。いちばん明るい芽（黄緑）の リニア明度が約 0.6 だから。4.0 は「絵の白が 4mm」の意味なので、 これは道具の仕様で、狙った高さは 2〜2.5mm だった。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>寄り（<code>preview_macro.jpg<\/code>）は苔になった。<\/strong> 座布団の縁で布に沈んだ 低いボタンが、内側へ 5 列ほどで棍棒に伸びる。この「縁が低く中が高い」 が座布団の全部で、ここだけは自信がある。<\/li><li><strong>引き（<code>preview.jpg<\/code>）は迷彩に見える。<\/strong> 2.45mm の膨らみは 300mm の 板の上では読めず、残るのは緑の斑の形だけ。#7 の狙いが「見て分からない 素材」ではなく「<strong>触って<\/strong>分かる素材」に寄ったことを認める。斑の形を 苔らしく（丸く、密に、縁が滲んで）描き直せば引きも救えるはずで、 次の版の課題にする。<\/li><li><strong>芽の 16 分割の面が寄りで見える。<\/strong> ドームは［頂点数］を読まない （<code>欲しい機能_20260905_ドームの頂点数.md<\/code>）。32 と書いても 16 のまま。<\/li><li>真上（<code>preview_top.jpg<\/code>）は柱のドットが見えて、ここでも「刷った物」 だと分かってしまう。レンガ配置で直線は消えたが、点であることは消えない。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>ビロードの代用ではなく、ビロードには無い「縁が硬く中が撓む」触感が 本体。襟の内側、肘、袖口、バッグの底など<strong>手が触る所に貼る反物<\/strong>。 座布団の中央だけ 2.4mm あるので、押すと芽が倒れて戻る。色を苔から 外せば（生成設定の側面色と元画像の色だけ）、同じ形で別の素材になる。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_46.py BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup \\ --python docs/samples/tools/make_sample.py -- docs/samples/46_苔_石の上の座布団 ... render_top.py -- &lt;同じ&gt;          # preview_top.jpg ... render_macro.py -- &lt;同じ&gt; --at 0.52,0.42 --span 30 --elev 22<\/p>\n<p>アドオン 7.174.0（<code>_samples_wt<\/code>）で作った。<\/p>","imgs":[{"c":"斜め","d":"img/46_preview.jpg"},{"c":"真上","d":"img/46_preview_top.jpg"},{"c":"拡大","d":"img/46_preview_macro.jpg"}]},{"num":"47","title":"織りの拡大 — デニムの綾を20倍にする","mode":"SURFACE","path":"docs/samples/47_織りの拡大_デニムの綾を20倍にする","text":"<p class=\"lead\">**デニムの表（2/1 綾織り）を、糸 1 本が 6mm になるまで拡大して、デニムの\n上に刷る。** 布の組織そのものが柄になる。藍の経糸が 2 マス続けて表に出て\n13mm の浮きになり、生成りの緯糸は 1 マスだけ顔を出す。斜めに走る綾目は\n描いたのではなく、組織を守ったら勝手に出た。<\/p><p><strong>デニムの表（2/1 綾織り）を、糸 1 本が 6mm になるまで拡大して、デニムの 上に刷る。<\/strong> 布の組織そのものが柄になる。藍の経糸が 2 マス続けて表に出て 13mm の浮きになり、生成りの緯糸は 1 マスだけ顔を出す。斜めに走る綾目は 描いたのではなく、組織を守ったら勝手に出た。<\/p>\n<p>リサーチの引き出し #10「織りの拡大」の 1 件目。#10 は「布の上に布を 載せる」で、狙いは<strong>尺度のずれ<\/strong>——本物のデニム（糸 0.3mm）の上に 20 倍の デニムが載ると、着ている人の大きさが狂って見える。Viktor &amp; Rolf の 巨大な襟と同じ仕掛けを、素材の側でやる。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>浮き 1 つが 6×13mm の面。柱では作れない大きさ<\/td><\/tr><tr><td>高さの決め方<\/td><td><strong>高さマップ（別画像から）<\/strong><\/td><td>色で高さを決めると、明るい生成りの緯糸が藍より高くなる。糸の丸みは高さマップ側に描く<\/td><\/tr><tr><td>フラットの厚み<\/td><td>0.8mm<\/td><td>糸の縁の厚み。ここから上に丸みが載る<\/td><\/tr><tr><td>高さマップの強さ<\/td><td>1.6mm<\/td><td>縁 0.8 → 頂 2.4mm。糸の断面が半円に見える比<\/td><\/tr><tr><td>角の丸み<\/td><td>OFF<\/td><td>丸みは高さマップが持っている。二重に掛けない<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>浮きの角を格子の階段にしない<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>浮き 1 つがもう 15mm の内。分割は要らない<\/td><\/tr><tr><td>色<\/td><td>テクスチャ（上面・側面とも）<\/td><td>藍と生成りは source.png の色<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.020, 0.030, 0.075)<\/td><td>本物のデニム（藍）。刷る先そのもの<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_47.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（色＋アルファ）と <code>depth_map.png<\/code>（高さ）の 2 枚。<\/p>\n<ul><li>組織: 経糸 i・緯糸 j のマスで <code>(i + j) mod 3 ≠ 0<\/code> なら経が上。これが 2/1 綾で、経が 3 マス中 2 マス表に出る＝デニムの表。<\/li><li>島: 表に出ている<strong>連続区間<\/strong>だけを島にする。糸幅 6mm、中心間隔 7mm、 島どうしのすき間 1.0mm。経の浮きは 6×13、緯の浮きは 6×6。<\/li><li>高さ: 幅方向は半円 √(1−t²)、浮きの端 1.6mm で 0.15 まで沈む （糸が裏へ潜る）。<\/li><li>色: 藍 (0.16, 0.22, 0.42)・生成り (0.90, 0.87, 0.80)。浮きごとに ±7% の明るさの揺れ（ロープ染めのむら）。頂で少し明るく。<\/li><\/ul>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>210×280 → <strong>209.2 × 279.2 × 2.40mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>島<\/td><td>810 個（経の浮き・緯の浮き）<\/td><td>—<\/td><\/tr><tr><td>いちばん大きい要素<\/td><td><strong>6 × 13mm<\/strong>（道具の報告と一致）<\/td><td>≤15 ✓<\/td><\/tr><tr><td>島のすき間<\/td><td>1.0mm<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>高さ<\/td><td>0.8（縁）〜 2.40mm（頂）<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong>、最低 Z 0.0000<\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><tr><td>糸が占める面積<\/td><td>77.4%<\/td><td>—<\/td><\/tr><tr><td>頂点<\/td><td>351,080（プレビュー 384×512）<\/td><td>—<\/td><\/tr><\/table>\n<h3>自分の評価<\/h3>\n<ul><li><strong>綾目が出た。<\/strong> 真上（<code>preview_top.jpg<\/code>）で生成りの升が右上がりの 階段に並ぶ。デニムを知っている人なら、拡大したのがデニムだと分かる。<\/li><li><strong>寄り（<code>preview_macro.jpg<\/code>）は糸に見える。<\/strong> 半円の頂と、端で沈む 面取りが「潜る糸」を言っている。ただし頂に<strong>縦の帯<\/strong>が 11 本見える。 これは元画像ではなくプレビューの格子（0.55mm）で、6mm の頂を 11 面で 刻んでいる。最終解像度 1024 で半分になるが、消えはしない。糸の丸みを 滑らかにしたければ最終生成で見ること。<\/li><li><strong>引き（<code>preview.jpg<\/code>）は籠か市松に見える。<\/strong> 20 倍では「布の拡大」 より「編んだ籠」に近い。尺度のずれで狂わせるなら、糸幅 6mm では まだ本物の糸から遠すぎて、糸の記憶（ねじれ・毛羽）が無い。糸の表面に 斜めのねじれの筋を高さマップで足すのが次の一手。<\/li><li><strong>生地の藍が暗すぎて、藍の浮きの縁が沈む。<\/strong> 刷る先のデニムを暗めに 置いたが、引きでは浮きの藍と地の藍の差が要る。実物では地は布なので 質感で分かれるが、絵では色で分けるしかない。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>デニムジャケットのヨークや袖口に、同じデニムの 20 倍を貼る。 「デニムの上のデニム」で、離れて見ると尺度が狂い、寄ると本物の 組織と同じ綾目が並ぶ。1 本ずつが 13mm 以内の島なので、布は島の間の 1mm で曲がる（作例45 と同じ理屈——ただしこちらは全方向に 1mm の 折り筋が走るので、硬い所は無い）。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_47.py     # source.png と depth_map.png BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup \\ --python docs/samples/tools/make_sample.py -- docs/samples/47_織りの拡大_デニムの綾を20倍にする ... render_top.py -- &lt;同じ&gt; ... render_macro.py -- &lt;同じ&gt; --at 0.5,0.5 --span 42 --elev 25<\/p>\n<p><code>settings.json<\/code> の <code>surface_depth_map_path<\/code> は <code>make_sample.py<\/code> が フォルダの <code>depth_map.png<\/code> へ置き直す。アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/47_preview.jpg"},{"c":"真上","d":"img/47_preview_top.jpg"},{"c":"拡大","d":"img/47_preview_macro.jpg"}]},{"num":"48","title":"穴の設計 — アイレットは抜いた所が柄","mode":"BRISTLE","path":"docs/samples/48_穴の設計_アイレットは抜いた所が柄","text":"<p class=\"lead\"><strong>ブロデリー・アングレーズ（アイレット刺繍）を、色のある生地に白で刷る。<\/strong>\n柄は刷った所ではなく、<strong>抜いた所<\/strong>——花びらの形に開いた 224 個の穴から\n下の生地の色が覗く。穴の縁だけ毛足を高く立て（2.8mm）、地は低い起毛\n（0.7mm）に落とすので、輪郭は「縁かがり」のように盛り上がって見える。<\/p><p><strong>ブロデリー・アングレーズ（アイレット刺繍）を、色のある生地に白で刷る。<\/strong> 柄は刷った所ではなく、<strong>抜いた所<\/strong>——花びらの形に開いた 224 個の穴から 下の生地の色が覗く。穴の縁だけ毛足を高く立て（2.8mm）、地は低い起毛 （0.7mm）に落とすので、輪郭は「縁かがり」のように盛り上がって見える。<\/p>\n<p>リサーチの引き出し #11「穴の設計」の 1 件目。アイレットは本来 「布に穴を開けて縁をかがる」技法で、服としての効き目は透けと風通し。 ここでは穴が生地まで抜けるので、<strong>刷る先の生地の色がそのまま柄の色<\/strong> になる——白いアイレットのワンピースの下に色のスリップを重ねる、あの 見え方を
