 0.10)<\/td><td>夜の紺。星の色が乗る地<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>星の無いセルは透明<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_62.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA 1710×1710、10px/セル、37KB）と <code>sky.json<\/code>（85KB。 高度 13° 以上・6 等までの星 1,868 個と、両端が残った星座線 238 本。 <code>--fetch<\/code> で GitHub の 2 つのカタログから作り直せる）。置いた星 1,655・ 線と環のセル 1,571。計算した高度: ベガ 69.9°（西）、デネブ 79.4°（ほぼ 天頂）、アルタイル 62.5°（南）——夏の大三角が頭の真上にあり、北極星は 高度 35.6°（＝緯度。検算になる）。アークトゥルス・アンタレスは沈みかけで 円の外。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>340×340 → <strong>337.2 × 337.2 × 3.67mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>柱<\/td><td><strong>3,226 本<\/strong>（星 1,655＋線・環 1,571。元絵と 1 本違わない）<\/td><td>—<\/td><\/tr><tr><td>太さ / すき間<\/td><td>細い側 <strong>0.68mm<\/strong> / <strong>0.64mm<\/strong>（道具の報告）<\/td><td>≥0.6 ✓ / ≥0.6 ✓<\/td><\/tr><tr><td>直径（実測、柱ごと）<\/td><td>0.86 〜 1.29mm<\/td><td>—<\/td><\/tr><tr><td>高さ（実測、柱ごと）<\/td><td>最小 <strong>0.50<\/strong> 中央 0.61 最大 <strong>3.67mm<\/strong>、0.4 未満 0 本<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>高さの分布<\/td><td>1mm 未満 2,931 本、3mm 超 2 本（ベガ・アルタイル級）<\/td><td>—<\/td><\/tr><tr><td>縦横比<\/td><td>3.67 ÷ 1.29 = <strong>2.8<\/strong><\/td><td>&lt;4 ✓。粒であって棘ではない<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><tr><td>頂点 / 面<\/td><td>2,116,256 / 2,071,092（プレビュー）<\/td><td>—<\/td><\/tr><tr><td>生成<\/td><td>2.2 秒<\/td><td>—<\/td><\/tr><\/table>\n<p>道具の 1 行「最小高さの下限は 0.4mm です。明るさが 8% に届かない所に柱は 立ちません」（v7.170.0）——線の B=0.10 はその上で、実測の最小 0.50 が 線の高さそのもの。狙いどおり。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上（<code>preview_top.jpg<\/code>）は、ひと目で星図。<\/strong> 円と四方の刻み、点線の 星座線、粒の大小。誰に見せても「星の地図」と読め、しかも星座線が 結んでいるのは本当の星。<strong>柄が「絵」ではなく「その夜」である<\/strong>ことは 絵からは読めない——それはこの作例の弱点ではなく前提で、日付を添えて 渡すもの。<\/li><li><strong>触ると、ほとんどが 0.5〜0.7mm の粒。<\/strong> 3,226 本のうち 2,931 本が 1mm 未満。1mm を超える星は約 300 で、指で読めるのはそこだけ。夏の大三角 と北斗七星と北極星は指で辿れるが、<strong>暗い星と星座線は触っては区別できない<\/strong> （高さ 0.6 と 0.5、色だけが違う）。線を「柱」ではなく面モードの浮き線に したかった——それは柱モードだけでは作れない（欲しい機能 #37）。<\/li><li><strong>色は効いた。<\/strong> 拡大（<code>preview_macro.jpg<\/code>）で琥珀の星と白青の星が並び、 紺の地に乗る。B−V の色は控えめにしたので、遠目には白の粒に見え、寄ると 暖かい・冷たいが分かる。星の実物の見え方と同じ順序。<\/li><li><strong>拡大で見ると点線が「並んだ粒」に見える。<\/strong> 2mm 間隔の柱で線を引くと 線ではなく数珠になる。真上・遠目では線に読めるので、この反物は<strong>近くで 触る物と遠くで見る物が違う<\/strong>。それは狙いの内。<\/li><li><strong>位置は計算値で、天文ソフトとは照合していない。<\/strong> 北極星の高度が緯度と 一致すること、夏の大三角が 9 月 21 時に天頂付近にあること、の 2 つで 自分の式を検算した。分の精度は要らない用途だが、<strong>照合していない<\/strong>と 書いておく。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>背中一面のケープ、または 340mm 角のストール。<\/strong> 布は夜の紺のニットか サテン。着る人の誕生日と生まれた場所を入れれば、<strong>世界に 1 枚しか無い 反物<\/strong>が同じ設定ファイルから出てくる——作例室が「同じ設定で何度でも 再現できる」ことを、初めて服の意味に使った。指で辿れるのは明るい星だけ なので、着る人は自分の空の主役の星を指で覚える。星座線の点線は光の下で だけ現れる。ショーなら、日付をタグに縫い付けて出す。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_62.py --fetch   # sky.json と source.png（初回。以後は --fetch 不要） BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/62_その夜の空_星図の反物 ... --python docs/samples/tools/render_top.py -- docs/samples/62_その夜の空_星図の反物 ... --python docs/samples/tools/render_view.py -- docs/samples/62_その夜の空_星図の反物 --azim 300 --elev 22 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/62_その夜の空_星図の反物 --at 0.55,0.5 --span 110 --elev 30 ... --python docs/samples/tools/render_macro.py -- docs/samples/62_その夜の空_星図の反物 --at 0.31,0.71 --span 70 --elev 30 --name preview_macro2<\/p>\n<p>別の夜・別の場所にするなら <code>make_art_62.py<\/code> の <code>UTC<\/code> と <code>LAT, LON<\/code> を 書き換えて <code>--fetch<\/code> から。撮ったあと 5 枚を 1100px・JPEG 品質 78 に縮めて フォルダは 575KB。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/62_preview.jpg"},{"c":"真上","d":"img/62_preview_top.jpg"},{"c":"低い角度から","d":"img/62_preview_low.jpg"},{"c":"拡大","d":"img/62_preview_macro.jpg"},{"c":"拡大（もう一方の端）","d":"img/62_preview_macro2.jpg"}]},{"num":"63","title":"金継ぎ — 割れた染付を着る","mode":"SURFACE","path":"docs/samples/63_金継ぎ_割れた染付を着る","text":"<p class=\"lead\"><strong>割れて金で継いだ染付の皿を、直径 200mm の胸当てとして着る。<\/strong> 柄は\n絵付けではなく<strong>割れ目<\/strong>——壊れて直した跡が装飾になる、金継ぎの思想\nそのもの（リサーチの引き出し #18）。青海波の絵付けは割れ目をまたいで\n続き、「もとは 1 枚の皿だった」ことを告げる。金は割れ目の両側に盛った\n線として立ち上がる。<\/p><p><strong>割れて金で継いだ染付の皿を、直径 200mm の胸当てとして着る。<\/strong> 柄は 絵付けではなく<strong>割れ目<\/strong>——壊れて直した跡が装飾になる、金継ぎの思想 そのもの（リサーチの引き出し #18）。青海波の絵付けは割れ目をまたいで 続き、「もとは 1 枚の皿だった」ことを告げる。金は割れ目の両側に盛った 線として立ち上がる。<\/p>\n<p>先例は「金継ぎ柄」のプリント生地や、割れた皿を貼り付けたアクセサリー なら幾つもある。ここでは<strong>割れ目そのものを生地の色として抜く<\/strong>——皿の 破片だけを刷り、間には布が覗く。継いだ金は破片の縁に沿う幅 0.45mm の <strong>色の帯<\/strong>で、立体としては上面と同じ高さの平らな帯（下の訂正を見ること）。皿は 1 枚の板ではなく 608 個の破片で、これは 「1 つの要素は 15mm まで」の条文が決めた数でもある。<\/p>\n<h3>仕組み<\/h3>\n<p>面モード・フラット 1.2mm。割れ目は 2 種類。<\/p>\n<ul><li><strong>主な割れ（金継ぎ）<\/strong>: 衝撃点（右上）から放射する 6 本と、その周りの 同心の弧 2 本。すき間 0.8mm の両側に幅 0.45mm の<strong>金の帯<\/strong>。金の帯は 破片の縁に沿って走る（当初は「上面の縁の丸みで肩が落ちる」と書いて いたが、丸みは効いていない／下の訂正）。<\/li><li><strong>貫入（細かいひび）<\/strong>: ボロノイの境界 0.9mm のすき間。金は付けない。 種は 8.6mm の六角格子を揺らしたもので、破片は 8〜13mm。<\/li><\/ul>\n<p>すき間の幅は PIL の線幅ではなく<strong>距離変換で決めた<\/strong>——斜めの線は線幅より 細く描かれ、0.8mm のつもりが実測 0.50mm になったため。短辺 1.5mm 未満の 欠片（71 個）は落として刷らない。<\/p>\n<p>すき間に覗く生地は<strong>茶渋の色<\/strong>（0.78, 0.66, 0.50）。古い染付の貫入は茶に 染まるので、貫入の線を茶にすると「使い込まれた皿」に読める。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>破片の輪郭をそのまま出す<\/td><\/tr><tr><td>高さの決め方 / 最大高さ<\/td><td>フラット / <strong>1.2mm<\/strong><\/td><td>皿の厚み。胸に当てて硬すぎない<\/td><\/tr><tr><td>角の丸み<\/td><td><strong>切<\/strong>（0.4mm・2 段・上面の縁と記録）<\/td><td><strong>効いていない。<\/strong>スイッチが切なので面取りは走っていない（2026-09-06 に訂正）<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>割れ目の曲線を格子の階段にしない<\/td><\/tr><tr><td>先細り<\/td><td>1.0<\/td><td>側面は垂直（オーバーハング 0）<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>割れ目そのものが分割。道具の分割は要らない<\/td><\/tr><tr><td>側面の色<\/td><td>上面と同じ<\/td><td>破片の断面も同じ色<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.78, 0.66, 0.50)<\/td><td>茶渋。貫入と割れ目に覗く<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>2 値のアルファ<\/td><\/tr><tr><td>解像度<\/td><td>プレビュー 512 / 最終 1024<\/td><td>最終で撮る（0.8mm のすき間はプレビューの格子 0.39mm で 2 マス）<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_63.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA 1600×1600、200mm・8px/mm、213KB）。白 (242,240,232)、 呉須 (28,52,128)、金 (212,170,70)。絵付けは青海波（半径 8mm の鱗、3 重の 弧＋中心の点）と、縁の白 → 呉須の帯 → 白の口縁。刷る面積は皿の 77.4%、 金の帯は刷る面積の 2.3%、呉須は 38.7%。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>200×200 → <strong>200.0 × 200.0 × 1.20mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>要素<\/td><td>破片 <strong>608 個<\/strong>、最大幅（Feret 36 方向）<strong>12.24mm<\/strong>（95% 11.19、中央値 9.43）、15mm 超 0<\/td><td>≤15 ✓（道具の報告「12×10mm」）<\/td><\/tr><tr><td>破片の間<\/td><td>最短 <strong>0.71mm<\/strong>、中央値 0.90（元絵の中線で実測、0.7 未満 0 画素）<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>金の帯<\/td><td>幅 0.45mm（破片の縁。単体の要素ではない）<\/td><td>—<\/td><\/tr><tr><td>高さ<\/td><td>1.20mm、底 z=0.000<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>縦横比<\/td><td>1.2 ÷ 9.4 = <strong>0.13<\/strong><\/td><td>板。棘ではない<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>、最終メッシュ）<\/td><\/tr><tr><td>頂点 / 面<\/td><td>1,373,632 / 1,372,412（最終）<\/td><td>—<\/td><\/tr><tr><td>生成<\/td><td>6.8 秒（最終）<\/td><td>—<\/td><\/tr><\/table>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上（<code>preview_top.jpg<\/code>）は、ひと目で「割れた染付」。<\/strong> 青海波、呉須の 縁、金の川が右上の衝撃点から放射して弧を描く。金継ぎとして読める。<\/li><li><strong>しかし寄ると、金継ぎではなくモザイクに見える（<code>preview_macro2.jpg<\/code>）。<\/strong> 本物の割れた皿は 10 個ほどの破片で、貫入は「線」であって「すき間」では ない。ここでは 15mm の条文が皿を 608 個に割り、0.9mm の茶の溝が全面に 走る。近くで見ると<strong>タイルを貼った皿<\/strong>であって、割れた皿ではない。金の 川（0.8mm）と貫入（0.9mm）の幅がほぼ同じなのも、主従を弱くしている。 これがこの作例のいちばん正直な欠点。<\/li><li><strong>金の帯は「盛った線」には<\/strong>なっていない<strong>（2026-09-06 に訂正）。<\/strong> 当初ここには「0.45mm の帯が縁の丸みで肩を落とす」と書いていたが、 ［角の丸み］のスイッチは切で、面取りは 1 か所も掛かっていない。金は 上面と同じ高さの<strong>平らな色の帯<\/strong>で、<code>preview_macro.jpg<\/code> で線に見えて いたのは幅 0.45mm の帯に載ったハイライトである。<strong>この作例の「縁の 丸みを色の帯に使う」という主張は、まだ試されていない<\/strong>——スイッチを 入れて撮り直せば本当に確かめられる。次に 63 を触るときの宿題。<\/li><li><strong>貫入を線として残す道が、この道具には無い。<\/strong> 破片の間を 0.6mm 未満に すると刷れず、繋げると 15mm を超える。貫入を「溝」ではなく上面の<strong>浅い 筋<\/strong>（高さ 0.3mm 下げる）にできれば 1 枚の皿として刷れる——それは 「高さの決め方＝高さマップ」で 2 枚目の画像を読ませれば作れるかもしれず、 次に試す価値がある（今回は貫入＝すき間で押し切った）。<\/li><li><strong>青海波の弧の縁がギザギザ。<\/strong> 8px/mm の元絵の階段が、拡大の写真では そのまま見える。色の縁なので形には出ない。刷る解像度（約 0.04mm）では 問題にならないはずだが、確かめていない。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>胸当て（ビブ）または帯留めの大判。<\/strong> 直径 200mm の皿を胸に 1 枚、 生地はアイボリーのウール。皿は「壊れて直した物を誇る」という金継ぎの 思想を、着る人の身体の中心に置く。破片は 1.2mm の板なので胸に当てても 曲がりに従い、貫入の溝 0.9mm が蝶番になって皿が身体に沿って割れる—— <strong>着ると、もう一度割れる皿。<\/strong> 金の川に沿って縫い目を通さない。<\/p>\n<p>作り直すなら、貫入を溝ではなく浅い筋にして皿を 10 個の大きな破片に 戻したい（上の 4 つ目）。それには 15mm の条文の外側で「1 要素の中に 浅い溝を彫る」手段が要る。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_63.py     # source.png（scipy が要る） BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/63_金継ぎ_割れた染付を着る --final ... --python docs/samples/tools/render_top.py -- docs/samples/63_金継ぎ_割れた染付を着る ... --python docs/samples/tools/render_view.py -- docs/samples/63_金継ぎ_割れた染付を着る --azim 300 --elev 22 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/63_金継ぎ_割れた染付を着る --at 0.81,0.62 --span 60 --elev 30 ... --python docs/samples/tools/render_macro.py -- docs/samples/63_金継ぎ_割れた染付を着る --at 0.30,0.42 --span 60 --elev 30 --name preview_macro2<\/p>\n<p>撮ったあと 5 枚を 1000〜1100px・JPEG 品質 70〜78 に縮めてフォルダは 約 850KB。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/63_preview.jpg"},{"c":"真上","d":"img/63_preview_top.jpg"},{"c":"低い角度から","d":"img/63_preview_low.jpg"},{"c":"拡大","d":"img/63_preview_macro.jpg"},{"c":"拡大（もう一方の端）","d":"img/63_preview_macro2.jpg"}]},{"num":"64","title":"ボロ — 継ぎ当ては刺し子の向きにしか無い","mode":"BRISTLE","path":"docs/samples/64_ボロ_継ぎ当ては刺し子の向きにしか無い","text":"<p class=\"lead\"><strong>藍の布に継ぎ当てを 5 枚重ねて、全部を刺し子で留めた 280×200mm。<\/strong>\n継ぎ当ての布は 1 枚も刷らない。藍は生地そのもので、刷るのは針目\n2,063 本だけ——**どこに継ぎ当てがあるかは、針目の向きと間隔が変わる\n所にしか無い。** 縁を回る縫い止めの 1 列と、肘の当て布の麻の葉が、\n布の重なりを告げる（リサーチの引き出し #18「壊れて直した跡が装飾」の\n2 作目。63 が皿なら、64 は布の側）。<\/p><p><strong>藍の布に継ぎ当てを 5 枚重ねて、全部を刺し子で留めた 280×200mm。<\/strong> 継ぎ当ての布は 1 枚も刷らない。藍は生地そのもので、刷るのは針目 2,063 本だけ——<strong>どこに継ぎ当てがあるかは、針目の向きと間隔が変わる 所にしか無い。<\/strong> 縁を回る縫い止めの 1 列と、肘の当て布の麻の葉が、 布の重なりを告げる（リサーチの引き出し #18「壊れて直した跡が装飾」の 2 作目。63 が皿なら、64 は布の側）。<\/p>\n<p>先例は「ボロ柄」のプリント生地と、本物の継ぎ当てを縫い付けた服なら 幾らでもある。前者は布の色の違いで継ぎ当てを描き、後者は布そのものを 重ねる。ここではそのどちらも捨てて、<strong>継ぎ当ての存在を針目の秩序だけで 表す<\/strong>——ボロを見る人が実際に読んでいるのは布の色より「刺し子の向きが 変わる所」で、その読み方だけを残した。針目は 3.0×1.0×0.9mm の四角柱で、 指には糸として触れる。<\/p>\n<h3>仕組み<\/h3>\n<p>柱モード・280×200 の格子（間隔 1.0036mm）・CUBE・X 倍率 3.0 で 1 本の柱を <strong>3.0×1.0mm の針目<\/strong>にする。向きは［要素の向き］＝流れ に任せる—— 針目ごとに 1mm 角の 8×8 画素の<strong>明るさの勾配<\/strong>を描き（0.80→1.00）、その 勾配の向きから針目の向きが決まる。針目の無い画素は透明（アルファ 0）。 つまり<strong>元絵は絵ではなく「向きの地図」<\/strong>で、絵として見ると藍地に薄い 粒が散っているだけ。<\/p>\n<p>継ぎ当ては 6 枚（地の布と、上に重なる 5 枚。肘だけ麻の葉）。それぞれ 針目の向き（0/45/90°）と間隔（4.0〜7.0mm）を持ち、上に重なった布が下の 布の針目を消す。縁から 2mm の所に<strong>縫い止めの 1 列<\/strong>（縁に平行）。 針目どうしは膨らませた矩形で当たりを取り、0.85mm 未満に近づけない。<\/p>\n<p><strong>針目は柱の位置へ吸着させてある<\/strong>（これがこの作例の要）。柱 i が読む 画素は元絵の 8.0287·i 番目——1mm のセルの中心（8i+4）ではなく、左端 から右端へ 0〜+4 画素ずれていく。セルの中に描いた勾配をその位置で 読むと、右端の柱の 93% が 90° 違う向きになった（中央は 0%）。針目を 柱の格子に丸め、8×8 のセルを<strong>柱が実際に読む画素を中心に<\/strong>描き直して 0 本になった（向きの誤差 中央値 0.6°・最大 3.1°）。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><td>針目は独立した粒。1 針＝1 柱<\/td><\/tr><tr><td>列数 / 行数（固定）<\/td><td>280 / 200<\/td><td>1 セル＝1mm（<code>pin_grid<\/code>）。針目は柱の位置に吸着<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>280 / 200mm<\/td><td>継ぎ当て 5 枚が入る大きさ<\/td><\/tr><tr><td>断面 / 頂点数<\/td><td>四角 / 4<\/td><td>糸の断面。丸みは付けない<\/td><\/tr><tr><td>要素の半径 / X 倍率 / Y 倍率<\/td><td>0.5 / <strong>3.0<\/strong> / 1.0<\/td><td>3.0×1.0mm の針目<\/td><\/tr><tr><td>要素の向き<\/td><td><strong>流れ<\/strong><\/td><td>元絵の勾配から針目ごとに向きを取る<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td>0.9mm / ON<\/td><td>糸の厚み。棘ではない<\/td><\/tr><tr><td>先細り<\/td><td>0.7<\/td><td>上が少し細い糸の断面<\/td><\/tr><tr><td>色<\/td><td><strong>高さのグラデーション<\/strong>（下 0.80,0.76,0.66 → 上 0.97,0.95,0.90）<\/td><td>生成りの糸。根元が少し沈む<\/td><\/tr><tr><td>明暗による半径変化 / 間引き / 輪郭に合わせる<\/td><td>OFF / OFF / OFF<\/td><td>元絵の明るさは向きにだけ使う<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.05, 0.07, 0.20)<\/td><td>藍<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>針目のセルだけ不透明<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_64.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA 2240×1600、8px/mm、112KB）と <code>stitches.json<\/code>（53KB。 針目 2,063 本の位置・向き・どの布か）。継ぎ当て 6 枚の針目は 地 519・左上 350・右上 182・右 401・左上の小片 133・肘の麻の葉 478。 麻の葉は 1 辺 24mm の三角格子の辺と、重心から頂点への線に 5mm 間隔で 針目を置いたもの。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>280×200 → <strong>276.0 × 197.1 × 0.90mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>針目<\/td><td><strong>2,063 本<\/strong>（候補 2,173。当たりで 110 落とした）<\/td><td>—<\/td><\/tr><tr><td>太さ<\/td><td>細い側 <strong>1.0mm<\/strong>（Y 倍率 1.0 × 半径 0.5 × 2）<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>針目の間<\/td><td>最短 <strong>0.71mm<\/strong>、中央値 3.25（元絵の中線で実測、0.7 未満 0 画素）<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>向きの誤差<\/td><td>中央値 0.6°、95% 1.9°、最大 3.1°、90° 違い <strong>0 本<\/strong>（2,034 本を照合）<\/td><td>—<\/td><\/tr><tr><td>高さ<\/td><td>0.90mm、底 z=0.000<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>縦横比<\/td><td>0.9 ÷ 1.0 = <strong>0.9<\/strong><\/td><td>糸。棘ではない<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><tr><td>頂点<\/td><td>16,504（=2,063×8）<\/td><td>—<\/td><\/tr><tr><td>生成<\/td><td>2.0 秒<\/td><td>—<\/td><\/tr><\/table>\n<p><strong>道具の 1 行は「要素間隔が推奨値未満です: 0.00mm」。<\/strong> これは格子の 間隔 1.0 から太い側 3.0 を引いた値（負を 0 に丸めた）で、実際の針目の 間（最短 0.71mm）を測っていない。細長い要素を格子より疎に置く使い方 では、この報告は常に 0.00 になる（欲しい機能 #39 に書いた）。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上（<code>preview_top.jpg<\/code>）は、ひと目でボロの刺し子。<\/strong> 継ぎ当ての 輪郭は 1 本も描いていないのに、右上の 45°・左の縦・右の横 4mm の 区画が読め、縁の縫い止めが布の重なりを告げる。「布を刷らずに布の 重なりを見せる」は成立した。<\/li><li><strong>麻の葉は、麻の葉に読めない（<code>preview_macro2.jpg<\/code>）。<\/strong> 1 辺 24mm の 三角格子に 5mm の針目では、六角の星の線が輪や渦に見える。真上・遠目 ではそれでも「肘だけ別の刺し子」として働くので区画としては生きて いるが、模様の名前は当てられない。麻の葉にするなら 1 辺 12mm・針目 3mm にすべきで、それには格子 1mm でも当たり（0.85mm）がきつい。<\/li><li><strong>低い視点（<code>preview_low.jpg<\/code>）がいちばん良い。<\/strong> 針目が糸として 立ち、区画ごとの向きが光の当たり方で分かれる。0.9mm の高さで十分。<\/li><li><strong>寄ると針目は「白い角材」（<code>preview_macro.jpg<\/code>）。<\/strong> 糸の丸みは無く 先細り 0.7 の四角い塊。生成りの糸というより貝殻のかけら。断面を 8 角にして上面の丸みを付ければ糸に寄るが、四角のほうが向きが読み やすいので今回は四角で押し切った。<\/li><li><strong>向きの正しさは、元絵の勾配を柱が読む画素に合わせて初めて出た。<\/strong> 最初の版は右端の 93% が 90° 違い、それは元絵の描き方ではなく <strong>柱が読む画素の位置<\/strong>の問題だった。「向きの地図」を渡す作例は これが初めてで、その落とし穴もここで初めて分かった。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>藍のワークジャケットの背中、または前身頃の一面。<\/strong> 生地は藍のコットン （12oz 程度）。針目 0.9mm は指に糸として触れ、遠目には白い刺し子。 継ぎ当ての区画は縫い目で仕切られていないので、<strong>着ている間に「どこが 継ぎ当てか」を光の向きで読み直す<\/strong>——動くと区画が現れ、また消える。 麻の葉の肘は、肘を曲げると針目の向きが密に見えて、当て布の厚みを 想像させる。作り直すなら麻の葉を 12mm に詰めて、袖の肘に 1 枚だけ置く。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_64.py     # source.png と stitches.json（scipy が要る） BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/64_ボロ_継ぎ当ては刺し子の向きにしか無い ... --python docs/samples/tools/render_top.py -- docs/samples/64_ボロ_継ぎ当ては刺し子の向きにしか無い ... --python docs/samples/tools/render_view.py -- docs/samples/64_ボロ_継ぎ当ては刺し子の向きにしか無い --azim 300 --elev 22 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/64_ボロ_継ぎ当ては刺し子の向きにしか無い --at 0.27,0.80 --span 50 --elev 30 ... --python docs/samples/tools/render_macro.py -- docs/samples/64_ボロ_継ぎ当ては刺し子の向きにしか無い --at 0.54,0.48 --span 70 --elev 30 --name preview_macro2<\/p>\n<p>撮ったあと 5 枚を 1050px・JPEG 品質 72〜76 に縮めてフォルダは 706KB。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/64_preview.jpg"},{"c":"真上","d":"img/64_preview_top.jpg"},{"c":"低い角度から","d":"img/64_preview_low.jpg"},{"c":"拡大","d":"img/64_preview_macro.jpg"},{"c":"拡大（もう一方の端）","d":"img/64_preview_macro2.jpg"}]},{"num":"65","title":"ブティ — 白の上の白、詰め物の絵","mode":"SURFACE","path":"docs/samples/65_ブティ_白の上の白_詰め物の絵","text":"<p class=\"lead\"><strong>生成りの布の上に、白い詰め物だけで花輪と花を描いた 200×200mm。<\/strong>\n色は 1 つも使わない。柄は<strong>膨らみの高さ<\/strong>で描く——中央の花（花弁 8・\n花心 1）と、半径 62mm の葉の輪（20 枚）、その間を埋める小石の\nキルティング 1,017 粒。プロヴァンスのブティ（boutis）は 2 枚の白い布の\n間にコードを通して膨らませる<strong>白い浮き彫りの刺繍<\/strong>で、光の向きが\n変わるたびに柄が現れて消える。ここではその「白の上の白」だけを残し、\n面モードの高さマップで<strong>要素ごとに断面の違う膨らみ<\/strong>を作った。<\/p><p><strong>生成りの布の上に、白い詰め物だけで花輪と花を描いた 200×200mm。<\/strong> 色は 1 つも使わない。柄は<strong>膨らみの高さ<\/strong>で描く——中央の花（花弁 8・ 花心 1）と、半径 62mm の葉の輪（20 枚）、その間を埋める小石の キルティング 1,017 粒。プロヴァンスのブティ（boutis）は 2 枚の白い布の 間にコードを通して膨らませる<strong>白い浮き彫りの刺繍<\/strong>で、光の向きが 変わるたびに柄が現れて消える。ここではその「白の上の白」だけを残し、 面モードの高さマップで<strong>要素ごとに断面の違う膨らみ<\/strong>を作った。<\/p>\n<p>先例は本物のブティと、トラプント、白刺繍のマトラッセ。どれも布 2 枚と 詰め物で作るので、膨らみは必ず<strong>なだらかな丸み<\/strong>で、縁で布が引き攣れる。 3D プリントで同じ絵を作るなら、その「引き攣れ」の代わりに<strong>要素ごとの 断面の設計<\/strong>が要る——葉は葉脈で割った 2 つの峰、花弁は先の尖った クッション、小石は低い丸——それを 1 枚の高さマップに全部書いた。 62（星図）63（金継ぎ）64（ボロ）が「柄を色や線で描く」作例だったのに 対し、65 は<strong>色を 1 つも使わずに高さだけで描く<\/strong>初めての作例。<\/p>\n<h3>仕組み<\/h3>\n<p>面モード・［高さの決め方］＝高さマップ。土台の高さ 0.4mm（造形の下限）に <code>depth_map.png<\/code> の明るさ × 2.6mm を足す。<strong>元絵（<code>source.png<\/code>）は形だけ<\/strong> ——白一色で、アルファが要素の輪郭。高さは 2 枚目の絵に書く。<\/p>\n<p>高さマップは要素ごとに作る。<strong>内側距離 ÷ その要素の最大内接半径<\/strong>を t と して、smoothstep（t²(3−2t)）の断面に要素の種類ごとの重み（葉 1.0・花弁 0.85・花心 0.9・雫 0.7・小石 0.45）を掛ける。頂は幅の内側 25% で平ら。 縁は 0 ではなく 0.08——縫い目の小さな段。葉は葉脈（幅 0.9mm）で 2 つに 割り、半葉ごとに峰を持たせる。<\/p>\n<p><strong>高さマップの作例は初めてで、3 つ踏んだ。<\/strong> どれもアドオンの読み方 （<code>_bf__load_depth_array<\/code>：明るさを行ごと下から上へ、頂点ごとに最近傍の 画素 1 つを読む）から来る。<\/p>\n<p>1. <strong>葉先の切れ端。<\/strong> 葉脈で割った半葉は葉先で幅 0 へ痩せ、細い切れ端が 別の要素になった（40 のはずが 48、切れ端との間 0.25mm）。0.35mm の 開き（opening）で落とし、1.5mm² 未満も捨てる。 2. <strong>壁が裂ける。<\/strong> 輪郭に吸着した頂点は境界の真上にいて、最近傍で読む 画素が内か外かは頂点ごとに変わる。外を 0 のままにすると壁の頂点が 0.8mm と 1.35mm の間で交互に飛び、側面がぎざぎざに裂けた。<strong>要素の 外へ、いちばん近い縁の値をそのまま写す<\/strong>（<code>distance_transform_edt<\/code> の <code>return_indices<\/code>）と壁が縁の値で揃う。5×5 の最大値でにじませた版は 内側の高い値を拾って縁が破れた。 3. <strong>崖。<\/strong> 四分円の断面は縁で垂直になり、格子 0.195mm の最近傍読みでは 崖に見える。放物線は縁の傾き 2 で、輪郭の頂点が 1 画素内か外かで z が 0.13mm 飛ぶ。<strong>縁で傾き 0 の smoothstep<\/strong>なら飛ばない。<\/p>\n<p>高さマップは<strong>面の格子と同じ 1024px<\/strong> で保存する（8px/mm で描いて BOX で 縮小）。1600px のまま渡すと格子が読む画素の歩幅が 1 と 2 を行き来する。 実測では稜線に差は出なかったが（下記）、1 頂点＝1 画素のほうが素直で、 ファイルも半分になる。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>詰め物は連続した膨らみ。柱では作れない<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>200 / 200mm<\/td><td>胸当て・クッションの 1 面<\/td><\/tr><tr><td>高さの決め方<\/td><td><strong>高さマップ<\/strong><\/td><td>要素ごとに断面を変えたい。レリーフ（明るさ→高さ）では縁の形を決められない<\/td><\/tr><tr><td>最大高さ<\/td><td><strong>0.4mm<\/strong><\/td><td>土台。造形の下限そのもの——土台は「無い」に等しくしたい<\/td><\/tr><tr><td>高さマップの強さ<\/td><td><strong>2.6mm<\/strong><\/td><td>葉が 3.0mm、小石が 1.6mm<\/td><\/tr><tr><td>高さマップのぼかし<\/td><td>0<\/td><td>断面は元絵の側で決めてある<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>小石 1,017 粒の輪郭を格子の階段にしない<\/td><\/tr><tr><td>上面の縁の丸み<\/td><td>OFF<\/td><td>丸みは高さマップに入っている<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>いちばん大きい要素は 3×12mm（15mm 以下）。要素が既に分かれている<\/td><\/tr><tr><td>色<\/td><td>画像（白一色）<\/td><td>色は使わない。生地は生成り（0.93, 0.91, 0.86）の織り<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>要素の輪郭<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_65.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA 1600×1600、8px/mm、白一色、94KB）と <code>depth_map.png<\/code> （L 1024×1024、286KB）。要素 1,074 個——葉 40（半葉）・花弁 8・花心 1・ 雫 8・小石 1,017。小石は半径 1.5〜3.0mm をポアソン風に撒き、要素どうしを 0.85mm 未満に近づけない。刷る面積は 36.8%。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>200×200 → <strong>199.0 × 199.0 × 3.00mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>要素<\/td><td><strong>1,074 個<\/strong>、いちばん大きい要素 3×12mm（道具の報告 / v7.191.0）<\/td><td>≤15mm ✓<\/td><\/tr><tr><td>高さ<\/td><td>葉 <strong>3.000<\/strong> / 花弁 2.633 / 花心 2.867 / 雫 2.347 / 小石 1.593mm（種類ごとの実測最大）<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>土台<\/td><td>0.4mm、底 z=0.000、上面の最低 0.502mm<\/td><td>✓<\/td><\/tr><tr><td>要素の間<\/td><td>最短 <strong>0.71mm<\/strong>、中央値 2.66（元絵の中線で実測、0.7 未満 0 画素）<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>高さの読み<\/td><td>下から上の予測と平均差 <strong>0.000mm<\/strong>（上から下なら 0.42）<\/td><td>—<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><tr><td>葉の稜線<\/td><td>0.2mm 刻み 48 区間で平ら（3.00mm）、傾きの符号変化 2 回<\/td><td>—<\/td><\/tr><\/table>\n<p><strong>（v7.191.0 で報告の数字が変わった。）<\/strong>「いちばん大きい要素」の並べ替えが 「長いほうの辺」だけを鍵にしていたので、<strong>辺の長さが同点の破片が並ぶと、 答えが「その破片が絵のどこにあるか」で決まっていた<\/strong>。第2の鍵に面積が 足された結果、同じ形の中でいちばん中身の詰まった破片が選ばれるようになった。 <strong>造形の可否は動かない<\/strong>——上限 15mm は長いほうの辺で見ており、そこは同点。 上の表の数字は v7.191.0 で測り直したもの。<\/p>\n<table><tr><th>頂点 / 生成<\/th><th>1,109,140 / 6.2〜7.6 秒（最終 1024）<\/th><th>—<\/th><\/tr><\/table>\n<h3>自分の評価<\/h3>\n<ul><li><strong>低い角度（<code>preview_low.jpg<\/code>）がブティ。<\/strong> 生成りの布に白い膨らみが 並び、光の向きで花と輪が現れる。「白の上の白」は成立した。<\/li><li><strong>真上（<code>preview_top.jpg<\/code>）でも柄は読める<\/strong>が、葉は葉脈の影でしか 分からない。花心の丸と花弁 8 枚は影だけで読める。<\/li><li><strong>葉の輪は「輪」に読めない（<code>preview.jpg<\/code>）。<\/strong> 半径 62mm の円周 390mm に 13mm の葉 20 枚では、葉と葉の間が 6.5mm 空き、散った莢に 見える。輪にするなら葉を 28〜32 枚にして先を触れさせるか、葉の間に 小さな雫を挟むべきだった。<\/li><li><strong>寄ると葉の斜面に鋸歯が見える（<code>preview_macro2.jpg<\/code>）。<\/strong> 実測では 稜線は平ら（3.00mm、48 区間で符号変化 2 回）で、形の鋸歯ではない。 アドオンは法線の z が 0.85 以下の面だけをスムーズシェードにするので、 63° の斜面と平らな頂の境目が格子の階段のまま<strong>影の境目<\/strong>になる ——これは推測で、面を数えて確かめてはいない。刷った物では 0.195mm 格子の段そのものが出るはずで、3mm の膨らみの上では触れて分かる程度。<\/li><li><strong>小石は良い。<\/strong> 1,017 粒がそれぞれ丸い低い山で、間の生地が見える。 トラプントの「詰めていない所」の感じが出た。<\/li><li><strong>アドオンの既定の斜め（4 灯の拡散光）では白が飛んで柄が消える。<\/strong> <code>preview.jpg<\/code> は自分の道具で撮り直した（方位 235°・仰角 38°）。 白の上の白は<strong>一方向の光でしか読めない<\/strong>——これは欠点ではなく、 ブティがそういう物。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>白いブラウスの胸当て、または白いドレスのヨーク。<\/strong> 生地は生成りの リネンかコットンローン。3mm の膨らみは指に柔らかい山として触れ、 遠目には白い布のまま。<strong>動くと光が滑って花が現れ、止まると消える<\/strong>。 色を 1 つも使わないので、どの白い服にも乗る。同じ高さマップを 「詰め物」ではなく「刺繍のかさ」として読み替えれば、白糸刺繍の サテンステッチ（面が膨らむ）も同じ道具で作れる。作り直すなら葉を 30 枚にして輪を閉じ、花心に小さな粒を 5 つ足す。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_65.py     # source.png と depth_map.png（scipy が要る） BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/65_ブティ_白の上の白_詰め物の絵 --final ... --python docs/samples/tools/render_top.py -- docs/samples/65_ブティ_白の上の白_詰め物の絵 ... --python docs/samples/tools/render_view.py -- docs/samples/65_ブティ_白の上の白_詰め物の絵 --azim 235 --elev 38 --name preview ... --python docs/samples/tools/render_view.py -- docs/samples/65_ブティ_白の上の白_詰め物の絵 --azim 300 --elev 18 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/65_ブティ_白の上の白_詰め物の絵 --at 0.5,0.5 --span 60 --elev 25 ... --python docs/samples/tools/render_macro.py -- docs/samples/65_ブティ_白の上の白_詰め物の絵 --at 0.80,0.50 --span 45 --elev 25 --name preview_macro2<\/p>\n<p><code>settings.json<\/code> の <code>surface_depth_map_path<\/code> はフォルダ内の <code>depth_map.png<\/code> を指す（<code>make_sample.py<\/code> が絶対パスに直す）。撮ったあと 5 枚を 1050px・ JPEG 品質 72〜74 に縮めてフォルダは 837KB。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/65_preview.jpg"},{"c":"真上","d":"img/65_preview_top.jpg"},{"c":"低い角度から","d":"img/65_preview_low.jpg"},{"c":"拡大","d":"img/65_preview_macro.jpg"},{"c":"拡大（もう一方の端）","d":"img/65_preview_macro2.jpg"}]},{"num":"66","title":"触れて読む反物 — 古池や","mode":"BRISTLE","path":"docs/samples/66_触れて読む反物_古池や","text":"<p class=\"lead\"><strong>白いシャツの胸に、芭蕉の句を 3 つ、日本語点字で刷る。<\/strong> 点 171 個・\nマス 57・11 行（句の間に空行 2）。目には墨の点の列が 3 つの塊に\nなって見え、指で読めば「ふるいけや かわず とびこむ みずの おと」\n「しずかさや いわに しみいる せみの こえ」「なつくさや つわものどもが\nゆめの あと」。<strong>装飾が文字で、文字が装飾<\/strong>——読める人には文、読めない\n人には整った点の柄。1 点＝1 柱で、柱は直径 1.5mm・高さ 0.6mm・上が丸い。<\/p><p><strong>白いシャツの胸に、芭蕉の句を 3 つ、日本語点字で刷る。<\/strong> 点 171 個・ マス 57・11 行（句の間に空行 2）。目には墨の点の列が 3 つの塊に なって見え、指で読めば「ふるいけや かわず とびこむ みずの おと」 「しずかさや いわに しみいる せみの こえ」「なつくさや つわものどもが ゆめの あと」。<strong>装飾が文字で、文字が装飾<\/strong>——読める人には文、読めない 人には整った点の柄。1 点＝1 柱で、柱は直径 1.5mm・高さ 0.6mm・上が丸い。<\/p>\n<p>先例は点字の服そのもの（触れて読めるラベル、点字を織り込んだニット、 点字の刺繍を胸に置いたシャツ）が幾つもあり、多くは刺繍かプリントで 点を作る。刺繍の点は糸の山で高さが揃わず、プリントの点は読めない。 ここでは<strong>1 点を 1 本の柱として規格に近い寸法で立てる<\/strong>——3D プリント なら高さ 0.6mm が 171 個とも同じになる。62〜65 が「柄」の作例だったのに 対し、66 は<strong>文字を柄として刷る<\/strong>初めての作例で、しかも触覚のほうが主。<\/p>\n<h3>仕組み<\/h3>\n<p>柱モード・<strong>1.2mm の格子に固定<\/strong>（<code>pin_grid<\/code>、167×167）。点字の点は その格子の 2 つおき（2.4mm）、マスは 5 つおき（6.0mm）、行は 9 つおき （10.8mm）に置く——点・マス・行の 3 つの間隔が全部 1.2 の倍数なので、 格子を 1.2 にすれば点字がそのまま柱の位置に乗る。<strong>点字の一般的な 寸法帯<\/strong>（点の間 2.2〜2.4・マス 6 前後・行 10〜11mm・点の直径 1.4〜1.6・高さ 0.4〜0.6mm）の中に入れたつもりだが、規格（JIS T 0921） の条文そのものは照合していない。<\/p>\n<p>元絵は「点のある画素だけ不透明」。64 と同じく、柱 (ci, cj) が実際に 読む画素（ci·1.2·8, cj·1.2·8）を中心に 6×6 の墨の角を描き、ほかは アルファ 0。［透明しきい値］0.5 で点のない柱が消え、171 本だけ残る。 色は［画像色を単色で反映］で墨（0.09, 0.09, 0.11）。<\/p>\n<p>かなの点字は 46 音＋長音・促音の表と、濁音は前置符（5 の点）＋清音の 2 マス、分かち書きは文節ごとに空マス。<strong>表の写し間違いは目視では 見つからない<\/strong>ので、<code>braille.json<\/code> に行ごとのマスの点番号を残してある。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><td>点は独立した粒。1 点＝1 柱<\/td><\/tr><tr><td>列数 / 行数（固定）<\/td><td>167 / 167<\/td><td>格子 1.2mm（<code>pin_grid<\/code>）。点・マス・行が全部この倍数<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>199.2 / 199.2mm<\/td><td>胸の 1 面。文は左寄せで中段に置く<\/td><\/tr><tr><td>断面 / 頂点数<\/td><td>円形 / 12<\/td><td>点。真円に近い 12 角<\/td><\/tr><tr><td>要素の半径 / X 倍率 / Y 倍率<\/td><td><strong>0.75<\/strong> / 1.0 / 1.0<\/td><td>直径 1.5mm<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td><strong>0.6mm<\/strong> / ON<\/td><td>点の高さ。171 個とも同じ<\/td><\/tr><tr><td>上端の丸み<\/td><td><strong>1.0<\/strong><\/td><td>指に当たる所は丸く<\/td><\/tr><tr><td>先細り<\/td><td>1.0<\/td><td>丸みで形は決まる。先細りはしない<\/td><\/tr><tr><td>要素の向き<\/td><td>固定<\/td><td>円なので向きは無い<\/td><\/tr><tr><td>色<\/td><td>画像色を単色で反映（墨）<\/td><td>白地に墨の点<\/td><\/tr><tr><td>明暗による半径変化 / 間引き / 輪郭に合わせる<\/td><td>OFF / OFF / OFF<\/td><td>元絵の明るさは使わない<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.90, 0.88, 0.82)<\/td><td>生成りのシャツ地<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>点のセルだけ不透明<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_66.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA 1594×1594、8px/mm、10KB。点のある 6×6 画素だけ墨） と <code>braille.json<\/code>（6KB。行ごとのマスの点番号と、点 171 個の格子番地）。 句はすべてパブリックドメイン（松尾芭蕉）。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>199.2×199.2 → <strong>57.9 × 114.3 × 0.60mm<\/strong>（文の塊）<\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>点<\/td><td><strong>171 個<\/strong>（マス 57・行 11。濁音の前置符 6）<\/td><td>—<\/td><\/tr><tr><td>位置<\/td><td>元絵の格子番地 171 と生成物の柱 171 が <strong>全件一致<\/strong>（欠け 0・余り 0）<\/td><td>—<\/td><\/tr><tr><td>1 点の寸法<\/td><td>直径 <strong>1.500 × 1.500<\/strong>、高さ <strong>0.600mm<\/strong>（実測）<\/td><td>0.6〜15 ✓<\/td><\/tr><tr><td>点の間<\/td><td>中心 <strong>2.400mm<\/strong>、縁どうし <strong>0.900mm<\/strong>（実測の最短）<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>縦横比<\/td><td>0.6 ÷ 1.5 = <strong>0.4<\/strong><\/td><td>点。棘ではない<\/td><\/tr><tr><td>底<\/td><td>z=0.000<\/td><td>✓<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><tr><td>頂点 / 生成<\/td><td>67,716（=171×396） / 2.3〜2.7 秒<\/td><td>—<\/td><\/tr><\/table>\n<p><strong>道具の 1 行は「要素間隔が推奨値未満です: 0.00mm」。<\/strong> 64 と同じで、 格子 1.2 から直径 1.5 を引いた値。実際の点の間 0.9mm を測っていない （欲しい機能 #39）。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上（<code>preview_top.jpg<\/code>）は点字そのもの。<\/strong> 3 つの塊と行の揃い、 マスの 2 列 3 段が読め、空マスの分かち書きで文節が分かれる。目で 見て「点字の文章だ」と分かる整い方は出た。<\/li><li><strong>寄ると点は「墨のレンズ豆」（<code>preview_macro.jpg<\/code>）。<\/strong> 上端の丸み 1.0 で天面は丸いが、側面が短く（0.6mm）12 角の稜が見える。実物の 点字の点は半球に近い。触感は問題ないはずだが、見た目は「押した ビーズ」寄り。<\/li><li><strong>生地は文の塊の大きさで切られる（<code>preview.jpg<\/code>）。<\/strong> 道具の生地は 柱の外接に合わせて作られるので、200mm の胸当てではなく 58×115mm の 札に見える。刷る物としては正しい（刷るのは点だけ）が、服のイメージ は真上の絵から自分で補うことになる。<\/li><li><strong>文字の作例は、検算できるのが強み。<\/strong> 点の番地 171 が生成物と全件 一致し、間隔は 2.4 ちょうど。柄の作例では「良い／悪い」しか言えない ところを、ここでは「正しい／誤り」で言える。逆に<strong>かなの表が 1 つ 間違っていれば読む人には即座に分かり、私には分からない<\/strong>—— <code>braille.json<\/code> を点字が読める人に見てもらうまで、正しさは確かめて いない。<\/li><li><strong>低い視点（<code>preview_low.jpg<\/code>）は柄として弱い。<\/strong> 0.6mm の点は 遠目には粒で、63 の金継ぎや 64 の刺し子ほど布の上で語らない。 触れて読む物なので当然だが、「見ても美しい」までは届いていない。 行間に薄い罫（面モードの 0.4mm の線）を敷けば、文の塊が「書かれた 紙」に見えるはず。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>白いシャツの左胸、またはジャケットの裏の見返し。<\/strong> 点 0.6mm は 指にはっきり触れ、目には墨の点の柄。<strong>読める人だけが句を受け取る<\/strong> ——着ている本人にも、握手した相手にも。生地はブロードかオックス フォード。同じ道具で、名前・日付・短い言葉を点字にして刷るのは そのまま（<code>POEMS<\/code> を書き換えるだけ）。作り直すなら、句ごとに墨の濃さ を変えず、代わりに行間へ薄い罫を敷いて「紙」に寄せる。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_66.py     # source.png と braille.json（scipy が要る） BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/66_触れて読む反物_古池や ... --python docs/samples/tools/render_top.py -- docs/samples/66_触れて読む反物_古池や ... --python docs/samples/tools/render_view.py -- docs/samples/66_触れて読む反物_古池や --azim 235 --elev 32 --name preview ... --python docs/samples/tools/render_view.py -- docs/samples/66_触れて読む反物_古池や --azim 300 --elev 14 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/66_触れて読む反物_古池や --at 0.41,0.81 --span 40 --elev 30 ... --python docs/samples/tools/render_macro.py -- docs/samples/66_触れて読む反物_古池や --at 0.43,0.27 --span 48 --elev 30 --name preview_macro2<\/p>\n<p><code>settings.json<\/code> は 64 の設定を土台に書き換えた（<code>meta.pin_grid: true<\/code>）。 フォルダは 648KB。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/66_preview.jpg"},{"c":"真上","d":"img/66_preview_top.jpg"},{"c":"低い角度から","d":"img/66_preview_low.jpg"},{"c":"拡大","d":"img/66_preview_macro.jpg"},{"c":"拡大（もう一方の端）","d":"img/66_preview_macro2.jpg"}]},{"num":"67","title":"白糸刺繍 — 穴のまわりだけが盛り上がる","mode":"SURFACE","path":"docs/samples/67_白糸刺繍_穴のまわりだけが盛り上がる","text":"<p class=\"lead\">**白いブラウスのヨーク（220×110mm の帯）に、ブロードリー・アングレーズを\n刷る。** 穴を開けて、穴の縁だけを白糸でかがる刺繍——アイレット 65 個\n（穴は本当に開いている）、サテンステッチの葉 30 枚、裾のスカラップ 18、\nフレンチノット 17。色は 1 つも使わず、刷る面積は帯の 11%。**布の大半は\n布のまま**で、刺繍の糸のかさ（1.0〜1.6mm）だけが乗る。<\/p><p><strong>白いブラウスのヨーク（220×110mm の帯）に、ブロードリー・アングレーズを 刷る。<\/strong> 穴を開けて、穴の縁だけを白糸でかがる刺繍——アイレット 65 個 （穴は本当に開いている）、サテンステッチの葉 30 枚、裾のスカラップ 18、 フレンチノット 17。色は 1 つも使わず、刷る面積は帯の 11%。<strong>布の大半は 布のまま<\/strong>で、刺繍の糸のかさ（1.0〜1.6mm）だけが乗る。<\/p>\n<p>先例は 19 世紀からの broderie anglaise（穴あき白刺繍）そのもので、 現代でもブラウス・子供服・寝具に生きている。糸の刺繍は穴の縁がほつれ やすく、洗うたびに縁がやせる。3D プリントなら<strong>穴の縁の土手が最初から 硬い<\/strong>ので、その弱点が無い——ただし糸の柔らかさも無い。65（ブティ）が 「詰め物の膨らみ」で描いたのに対し、67 は<strong>糸の盛り上がりと穴<\/strong>で描く。 面モードで穴を開けた初めての作例。<\/p>\n<h3>仕組み<\/h3>\n<p>面モード・［高さの決め方］＝高さマップ。土台 0.4mm に <code>depth_map.png<\/code> の 明るさ × 1.2mm を足す。元絵（<code>source.png<\/code>）は白一色で、アルファが要素の 輪郭——<strong>アイレットの内側はアルファ 0<\/strong> なので、リング状の土手だけが 刷られて中は生地が覗く。<\/p>\n<p>要素ごとの断面は 65 と同じ smoothstep（内側距離 ÷ その要素の最大内接 半径、頂の 25% は平ら、縁 0.08）。リングは幅 1.6mm の帯なので同じ式で 自動的に「縁だけの土手」になる。種類ごとの重みは 縁 1.0・葉 0.9・ スカラップ 0.85・ノット 0.8。<\/p>\n<p><strong>糸目<\/strong>を足した。サテンステッチは糸 1 本ごとに小さな畝になるので、 要素ごとに「糸の向きに直交する座標」を持たせ、cos（間隔 1.2mm）の振幅 10% を高さに掛ける。葉は軸に 45°、アイレットとスカラップは放射状。 最初は 0.8mm にしたが、面の格子 0.215mm で 3.7 マスしかなく、縁が欠けた ように見えた。1.2mm（5.6 マス）でも絵では読みにくい（下記）。<\/p>\n<p>高さマップは面の格子と同じ <strong>1024×512<\/strong>（長辺 1024・縦横比そのまま）で 保存する。格子は <code>_bf__pick_grid_resolution<\/code> が長辺を 1024 にして短辺を 比で決めるので、正方形でない帯でも 1 頂点＝1 画素になる。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>土手と穴。柱では作れない<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td><strong>220 / 110mm<\/strong><\/td><td>ヨーク・カフス・裾の帯。正方形でない紙面は初めて<\/td><\/tr><tr><td>高さの決め方<\/td><td>高さマップ<\/td><td>要素ごとに断面と糸目を書きたい<\/td><\/tr><tr><td>最大高さ<\/td><td>0.4mm<\/td><td>土台。造形の下限そのもの<\/td><\/tr><tr><td>高さマップの強さ<\/td><td><strong>1.2mm<\/strong><\/td><td>縁の土手 1.6mm、ノット 1.4mm。刺繍の糸のかさ<\/td><\/tr><tr><td>高さマップのぼかし<\/td><td>0<\/td><td>糸目を消したくない<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>65 個のリングの内外の円を階段にしない<\/td><\/tr><tr><td>上面の縁の丸み<\/td><td>OFF<\/td><td>丸みは高さマップに入っている<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>いちばん大きい要素は 5×11mm。要素は既に分かれている<\/td><\/tr><tr><td>色<\/td><td>画像（白一色）<\/td><td>白の上の白。生地は生成り (0.95, 0.94, 0.90) の織り<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>要素の輪郭。穴はアルファ 0<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_67.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA 1760×880、8px/mm、白一色、18KB）と <code>depth_map.png<\/code> （L 1024×512、108KB）。要素 130 個——アイレットの縁 65（裾の列 18・ 上の列 17・花の 30）・葉 30・スカラップ 18・ノット 17。花は 5 つ （中心のノット＋アイレット 6＋葉 6）、花の間に小枝（ノット 3）。 要素どうしの最短 1.75mm、中央値 8.35mm。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>220×110 → <strong>218.0 × 102.0 × 1.60mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>要素<\/td><td><strong>130 個<\/strong>、いちばん大きい要素 5×11mm（道具の報告 / v7.191.0）<\/td><td>≤15mm ✓<\/td><\/tr><tr><td>穴<\/td><td><strong>65<\/strong>（リングの内側。生地が覗く）<\/td><td>—<\/td><\/tr><tr><td>高さ<\/td><td>縁 <strong>1.600<\/strong> / 葉 1.501 / スカラップ 1.440 / ノット 1.384mm（種類ごとの実測最大）<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>土台<\/td><td>0.4mm、底 z=0.000、上面の最低 0.489mm<\/td><td>✓<\/td><\/tr><tr><td>要素の間<\/td><td>最短 <strong>1.75mm<\/strong>（元絵のボロノイ境で実測、0.7 未満 0 画素）<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>糸目（実測）<\/td><td>葉の軸で 1.38↔1.48mm・周期 1.7mm（＝1.2×√2）、縁で 1.48↔1.60mm・12 本／周<\/td><td>—<\/td><\/tr><tr><td>高さの読み<\/td><td>下から上の予測と平均差 <strong>0.000mm<\/strong><\/td><td>—<\/td><\/tr><\/table>\n<p><strong>（v7.191.0 で報告の数字が変わった。）<\/strong>「いちばん大きい要素」の並べ替えが 「長いほうの辺」だけを鍵にしていたので、<strong>辺の長さが同点の破片が並ぶと、 答えが「その破片が絵のどこにあるか」で決まっていた<\/strong>。第2の鍵に面積が 足された結果、同じ形の中でいちばん中身の詰まった破片が選ばれるようになった。 <strong>造形の可否は動かない<\/strong>——上限 15mm は長いほうの辺で見ており、そこは同点。 上の表の数字は v7.191.0 で測り直したもの。<\/p>\n<table><tr><th>オーバーハング面<\/th><th><strong>0 面 / 0.0mm²<\/strong><\/th><th>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/th><\/tr><tr><td>頂点 / 生成<\/td><td>135,558 / 1.2 秒（最終 1024×512）<\/td><td>—<\/td><\/tr><\/table>\n<h3>自分の評価<\/h3>\n<ul><li><strong>斜め（<code>preview.jpg<\/code>）はブロードリー・アングレーズに見える。<\/strong> 裾の スカラップ、その上のアイレットの列、中段の花、上の小さな列——構成は 本物の帯の組み立てそのもので、白の上の白でも 1.6mm の土手は影で読める。<\/li><li><strong>真上（<code>preview_top.jpg<\/code>）ではリングの穴が読める。<\/strong> 65 個の穴が 全部開いていて、花はアイレット 6 個の輪と葉 6 枚の星に見える。<\/li><li><strong>糸目は、絵では「欠けた縁」にしか見えない（<code>_close<\/code> の観察）。<\/strong> メッシュには確かにある（上の表）が、0.1mm の畝は 3 灯の光で読めず、 リングの外縁で高さの上下が<strong>縁の欠け<\/strong>に見える。1.2mm の 12 本は かがり縫いの数としては本物に近い（実物のアイレットは 20〜30 本）が、 絵の説得力にはなっていない。刷った物では指に触れる畝になるはずで、 一方向の低い光でなら見えるはず——ここでは確かめていない。<\/li><li><strong>リングの断面は「土手」より「壁」。<\/strong> 幅 1.6mm に格子 7 マスしか ないので、smoothstep の縁 0.5mm が垂直の段に、頂が平らになる （<code>preview_macro2.jpg<\/code>）。かがり縫いの丸い土手を出すなら幅 2.4mm 以上か、格子を細かく（帯を短く）する必要がある。<\/li><li><strong>葉は良い。<\/strong> 11×4.8mm のクッションが尖った先で終わり、5 つの花に 6 枚ずつ、影で読める。65 の葉（葉脈で 2 峰）より単純なぶん白刺繍 らしい。<\/li><li><strong>低い視点（<code>preview_low.jpg<\/code>）は帯の役をしている。<\/strong> 遠目には 白い帯に点々と粒があるだけで、それは本物のアングレーズも同じ。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>白いブラウスのヨーク、カフス、または子供服の裾。<\/strong> 生地はローンか ブロード。穴が開いているので<strong>下の生地や肌が覗く<\/strong>——本物と同じ用途で、 本物より縁が丈夫。同じ帯を 2 段・3 段に重ねて刷ればティアードの裾になる。 作り直すなら、リングの幅を 2.4mm にして断面を丸くし、糸目は振幅 15% で 一方向の光の見本を撮る。<strong>穴のある要素<\/strong>は面モードでこのまま作れるので、 レース（71 以降の候補）への足がかりになる。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_67.py     # source.png と depth_map.png（scipy が要る） BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/67_白糸刺繍_穴のまわりだけが盛り上がる --final ... --python docs/samples/tools/render_top.py -- docs/samples/67_白糸刺繍_穴のまわりだけが盛り上がる ... --python docs/samples/tools/render_view.py -- docs/samples/67_白糸刺繍_穴のまわりだけが盛り上がる --azim 235 --elev 38 --name preview ... --python docs/samples/tools/render_view.py -- docs/samples/67_白糸刺繍_穴のまわりだけが盛り上がる --azim 300 --elev 16 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/67_白糸刺繍_穴のまわりだけが盛り上がる --at 0.5,0.545 --span 50 --elev 28 ... --python docs/samples/tools/render_macro.py -- docs/samples/67_白糸刺繍_穴のまわりだけが盛り上がる --at 0.2,0.12 --span 36 --elev 30 --name preview_macro2<\/p>\n<p><code>settings.json<\/code> は 65 の設定を土台に、幅・奥行き・強さ・生地の色を 書き換えた。<code>surface_depth_map_path<\/code> はフォルダ内の <code>depth_map.png<\/code> （<code>make_sample.py<\/code> が絶対パスに直す）。フォルダは約 820KB。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/67_preview.jpg"},{"c":"真上","d":"img/67_preview_top.jpg"},{"c":"低い角度から","d":"img/67_preview_low.jpg"},{"c":"拡大","d":"img/67_preview_macro.jpg"},{"c":"拡大（もう一方の端）","d":"img/67_preview_macro2.jpg"}]},{"num":"68","title":"編めない編み地 — 1目は2本の脚","mode":"BRISTLE","path":"docs/samples/68_編めない編み地_1目は2本の脚","text":"<p class=\"lead\">**編めない生地（フェルト・革・デニム）の上に、ノルウェー模様の編み目を\n刷る。** メリヤス編みの 1 目は「V」——左右 2 本の脚でできている。ここでは\n<strong>1 本の脚を 1 本の柱<\/strong>にし、左の脚を 102°、右の脚を 78° に<strong>それぞれ向けて<\/strong>\n立てる。目 630（21 目 × 30 段）・脚 1260 本、3 色（生成り・臙脂・藍）、\n中央に 15×15 の八芒星、上下に菱形の帯と市松の縁。柱は 4.4 × 1.5 ×\n高さ 2.0mm の楕円で、上を丸く落としてある。<\/p><p><strong>編めない生地（フェルト・革・デニム）の上に、ノルウェー模様の編み目を 刷る。<\/strong> メリヤス編みの 1 目は「V」——左右 2 本の脚でできている。ここでは <strong>1 本の脚を 1 本の柱<\/strong>にし、左の脚を 102°、右の脚を 78° に<strong>それぞれ向けて<\/strong> 立てる。目 630（21 目 × 30 段）・脚 1260 本、3 色（生成り・臙脂・藍）、 中央に 15×15 の八芒星、上下に菱形の帯と市松の縁。柱は 4.4 × 1.5 × 高さ 2.0mm の楕円で、上を丸く落としてある。<\/p>\n<p>先例はフェアアイルやセルブー（ノルウェーの星）のヨークそのもので、 「編み目を描く」柄は刺繍（クロスステッチ）にもプリントにもある。 どちらも V の 2 本の脚を<strong>別の向きに立てる<\/strong>ことはできない——刺繍の糸は 布に沈み、プリントは平らだから。3D プリントの柱は 1 本ずつ向きを持てる ので、編み目の「脚が斜めに立ち上がる」ことをそのまま形にできる。 <strong>この作例は、柱の向きを 1 本ずつ図面どおりに決める初めての作例<\/strong>で、 47（デニムの綾）が「交点ごとの高さ」で織りを描いたのに対し、68 は 「柱ごとの向き」で編みを描く。<\/p>\n<h3>仕組み<\/h3>\n<p>柱モード・<strong>格子に固定<\/strong>（<code>pin_grid<\/code>、106 × 91、間隔 1.6 × 1.8mm）。 1 目は横 5 格子（8.0mm）・縦 3 格子（5.4mm）で、左の脚は目の 2 番目、 右の脚は 4 番目の格子に立つ（脚の中心の間 3.2mm）。元絵は 64・66 と同じく 「柱が読む画素のまわりだけ不透明」（角 16px = 2mm）。<\/p>\n<p><strong>向きは［要素の向き］＝明るさの傾き（GRADIENT_DIR）で決める。<\/strong> アドオンは 柱の位置で画像の明るさの傾きを測り（1.5 画素の差分 2 本の arctan2）、柱の 長軸をその向きに回す。だから元絵の<strong>目の中の明るさに、脚の向きへ登る傾き を仕込む<\/strong>——左半分は 102°、右半分は 78° の向きに明るくなる。色は ［画像色を単色で反映］で柱の中心 1 点を読むので、この傾きは造形物には 一切出ない（生成り・臙脂・藍のまま）。<\/p>\n<p><strong>傾きの大きさは、アドオンの門で決まる。<\/strong> アドオンは傾きの大きさが 1.5 画素あたり <strong>0.002（リニア輝度）<\/strong> を下回ると「平ら」とみなし、その柱を 固定の向きへ落とす（<code>n_valid<\/code>、GREATER_THAN 0.002）。最初は「色に見えない 0.6% の傾き」で描き、<strong>1260 本すべてがその門で落ちた<\/strong>（向きの誤差の中央値 47°）。しかも sRGB の値に掛け算で傾けると、藍（リニア輝度 0.03）の傾きは 生成りの 1/25 になる。いまは<strong>リニア輝度で 0.03/mm を 3 色とも同じ大きさで 足し<\/strong>（柱の中心 ±1.2mm の中だけ）、1.5 画素で 0.0056——門の 2.8 倍。 元絵は <strong>16bit PNG<\/strong>——同じ傾きを 8bit で量子化すると向きの誤差が中央値 12°・最大 62° になる（<code>make_art_68.py<\/code> の検算 2）。<\/p>\n<p><strong>V の開きは 24°（102° と 78°）で、これ以上開けない。<\/strong> 脚の下端は 互いに寄るので、開きを 44° にすると下端の縁どうしが 0.05mm まで近づき、 0.6mm の間隔を割る。3.2mm の脚の間では ±12° が上限——本物の編み目 （脚が 30° 前後）より立った V になる。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><td>脚は独立した粒。1 脚＝1 柱<\/td><\/tr><tr><td>列数 / 行数（固定）<\/td><td>106 / 91<\/td><td>格子 1.6 × 1.8mm（<code>pin_grid<\/code>）。目の 5 格子・段の 3 格子<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>168 / 162mm<\/td><td>セーターのヨークの前半分<\/td><\/tr><tr><td>断面 / 頂点数<\/td><td>円形 / 12<\/td><td>楕円の元。12 角<\/td><\/tr><tr><td>要素の半径 / X 倍率 / Y 倍率<\/td><td>0.75 / <strong>2.9333<\/strong> / 1.0<\/td><td>幅 1.5 × 長さ 4.4mm の楕円<\/td><\/tr><tr><td><strong>要素の向き<\/strong><\/td><td><strong>明るさの傾き<\/strong><\/td><td>左の脚 102°・右の脚 78°。元絵の傾きで 1 本ずつ決める<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td>2.0mm / ON<\/td><td>糸のかさ。1260 本とも同じ<\/td><\/tr><tr><td>上端の丸み<\/td><td>0.7<\/td><td>糸の丸み。上を落とす<\/td><\/tr><tr><td>色<\/td><td>画像色を単色で反映<\/td><td>目ごとに 1 色。傾きは色に出ない<\/td><\/tr><tr><td>明暗による半径変化 / 間引き / 輪郭に合わせる<\/td><td>OFF / OFF / OFF<\/td><td>元絵の明るさは向きにだけ使う<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.36, 0.34, 0.33)<\/td><td>炭鼠のフェルト。編めない生地<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>脚のセルだけ不透明<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_68.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA <strong>16bit<\/strong> 1344×1296、8px/mm、299KB）、<code>chart.png<\/code> （図面 21×30 をそのまま画素にした 3 色の絵）、<code>chart.json<\/code>（脚 1260 本の 位置・向き・色・目の番地、82KB）。図面は 15×15 の八芒星（セルブーの星）を 中央に、上下に菱形の帯・市松の縁・点の列。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>168×162 → <strong>164.9 × 160.9 × 2.00mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>脚 / 目<\/td><td><strong>1260 本 / 630 目<\/strong>（生成り 429・臙脂 138・藍 63）<\/td><td>—<\/td><\/tr><tr><td><strong>向き<\/strong><\/td><td>1260 本すべてが図面と一致。誤差の中央値 <strong>0.02°<\/strong>、最大 <strong>0.09°<\/strong>（PCA の長軸で実測。左脚 0.01°／右脚 0.04°）<\/td><td>—<\/td><\/tr><tr><td>1 脚の寸法<\/td><td><strong>4.400 × 1.500<\/strong>、高さ <strong>2.000mm<\/strong>（実測）<\/td><td>0.6〜15 ✓<\/td><\/tr><tr><td>縦横比<\/td><td>2.0 ÷ 1.5 = <strong>1.3<\/strong><\/td><td>棘ではない<\/td><\/tr><tr><td>脚の間<\/td><td>最短 <strong>1.25mm<\/strong>、中央値 2.38mm（元絵の楕円で実測、0.6 未満 0 画素）<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>傾きの大きさ<\/td><td>1.5 画素で <strong>0.0056<\/strong>（3 色とも。門 0.002、下回る脚 0）<\/td><td>—<\/td><\/tr><tr><td>底<\/td><td>z=0.000、上面 2.000（段 0.043mm × 46）<\/td><td>✓<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><tr><td>頂点 / 生成<\/td><td>710,640（=1260×564） / 2.7 秒<\/td><td>—<\/td><\/tr><\/table>\n<p><strong>道具の 2 行。<\/strong>「要素間隔が推奨値未満です: 0.00mm」は 64・66 と同じ （格子 1.6 から楕円の長さ 4.4 を引いた値。実際の間 1.25mm を測っていない。 欲しい機能 #39）。「柄のいちばん細かい繰り返しは 5.2mm、間隔 1.60mm の 4 倍を下回る」は、<strong>格子に固定した柄では必ず鳴る<\/strong>——柄のほうが格子に 合わせて描かれているので埋もれない（欲しい機能 #46）。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上（<code>preview_top.jpg<\/code>）は編み図そのもの。<\/strong> 目ごとに 2 本の脚が 組になり、色は星・菱形・市松にまとまる。脚が 1 本ずつ図面の向きに 立っていることは数字（0.02°）でしか分からないが、<strong>絵では「2 本の脚が ハの字に開いている」として読める<\/strong>。<\/li><li><strong>ただし V は浅い。<\/strong> 開き 24° は、遠目には「( )」の対に見える。 本物の編み目の V（脚が 30° 前後）にはならない——脚の間 3.2mm と 間隔 0.6mm の制約で、これが上限。目の幅を 6 格子（9.6mm）にすれば ±20° まで開けるが、目が横に伸びる。<\/li><li><strong>段の間に 1.0mm の溝がある（<code>preview.jpg<\/code>）。<\/strong> 本物の編み目は脚が 上の段の目に潜って繋がるが、ここでは段ごとに脚が切れる。だから ニットというより<strong>ビーズ刺繍かクロスステッチに近く見える<\/strong>。 「編めない編み地」の題どおり、編み目の記号を並べた物で、編み地の つながりは無い。<\/li><li><strong>寄ると脚は 12 角の米粒（<code>preview_macro.jpg<\/code>）。<\/strong> 楕円に伸ばした 12 角形の稜が見え、上端の丸み 0.7 で先が面取りされる。糸の丸さには 遠い。頂点数を 24 にすれば稜は消える（頂点 2 倍）。<\/li><li><strong>低い視点（<code>preview_low.jpg<\/code>）でも星は読める。<\/strong> 炭鼠のフェルトの上で 3 色が立ち、ヨークの前半分の札に見える。66 の点字と違って柄そのものが 柱なので、遠目にも成り立つ。<\/li><li><strong>この作例の価値は絵より仕組み。<\/strong> 「柱 1 本ずつの向きを画像で指示 できる」ことを 1260 本で示し、その手順（リニア輝度で門の 2.8 倍・ 16bit・色は中心 1 点）を書き残した。43（綸子）が向きだけで紋を出した のに対し、68 は<strong>向きを図面どおりに個別に決める<\/strong>——次は矢羽根・ ヘリンボーン・組紐のような「向きが柄」の題に使える。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>編めない素材のセーター。<\/strong> ウールのフェルト、革、デニム、ネオプレン の上に、ノルウェー模様のヨークを刷る——「編み目の柄を、編めない生地に」 が題。ヨークは前後 2 枚を肩で縫うので、この 168×162mm の札をそのまま 前半分にし、後ろは同じ図面を鏡で刷る。刷るのは脚だけで生地は素のまま なので、<strong>縫い代は柄の外に取れる<\/strong>（縁の市松の外に 12mm 空けてある）。 洗濯で糸がやせることも毛玉も無い。作り直すなら、目の幅を 6 格子にして V を開き、段の間の溝を 0.5mm まで詰め（<code>ROW_H<\/code> 5.0）、頂点数を 24 にする。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_68.py     # source.png / chart.png / chart.json（cv2 が要る） BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/68_編めない編み地_1目は2本の脚 --final ... --python docs/samples/tools/render_top.py -- docs/samples/68_編めない編み地_1目は2本の脚 ... --python docs/samples/tools/render_view.py -- docs/samples/68_編めない編み地_1目は2本の脚 --azim 235 --elev 34 --name preview ... --python docs/samples/tools/render_view.py -- docs/samples/68_編めない編み地_1目は2本の脚 --azim 300 --elev 14 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/68_編めない編み地_1目は2本の脚 --at 0.5,0.5 --span 40 --elev 30<\/p>\n<p><code>settings.json<\/code> は 66 の設定を土台に、格子・楕円・向き・高さ・生地を 書き換えた（<code>meta.pin_grid: true<\/code>）。見本の JPEG は品質 70〜72 に落として フォルダを 983KB に収めた。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/68_preview.jpg"},{"c":"真上","d":"img/68_preview_top.jpg"},{"c":"低い角度から","d":"img/68_preview_low.jpg"},{"c":"拡大","d":"img/68_preview_macro.jpg"}]},{"num":"69","title":"ダズル — 遠目から効く白黒の背","mode":"SURFACE","path":"docs/samples/69_ダズル_遠目から効く白黒の背","text":"<p class=\"lead\"><strong>コートの背（315×300mm）に、ダズル迷彩を 13mm 角の太いスタッズで刷る。<\/strong>\n1917 年、軍艦を白黒の大きな帯で塗って「速さと向きを読めなくする」ために\n生まれた図柄。ここでは帯を色だけでなく<strong>高さ<\/strong>でも描く——白の帯は\nスタッズが 10mm、黒の帯は 2.5mm。420 個・色 2 つ・帯の向き 3 つ。\n部屋の反対側から読め、着る人が動くと 10mm の白が 2.5mm の黒を隠して\n帯の形が変わる。<strong>本物のダズルの狙いを、そのまま服に。<\/strong><\/p><p><strong>コートの背（315×300mm）に、ダズル迷彩を 13mm 角の太いスタッズで刷る。<\/strong> 1917 年、軍艦を白黒の大きな帯で塗って「速さと向きを読めなくする」ために 生まれた図柄。ここでは帯を色だけでなく<strong>高さ<\/strong>でも描く——白の帯は スタッズが 10mm、黒の帯は 2.5mm。420 個・色 2 つ・帯の向き 3 つ。 部屋の反対側から読め、着る人が動くと 10mm の白が 2.5mm の黒を隠して 帯の形が変わる。<strong>本物のダズルの狙いを、そのまま服に。<\/strong><\/p>\n<p>本部から「派手で、遠目から効く 1 本を。ただし高さで取りにいくなら太さも 一緒に上げて塊として見せる」というヒントを受けて作った。柱の縦横比が 棘に寄ってきた過去の作例への答えでもある——ここでは<strong>いちばん太い塊<\/strong> （面モードの上限 15mm のすぐ内側、13mm 角）を<strong>いちばん高く<\/strong>（面モードの 高さマップで届く上限 10.4mm のすぐ内側）立て、縦横比は <strong>0.77<\/strong>。 針の森ではなく、キーキャップの列。<\/p>\n<h3>仕組み<\/h3>\n<p>面モード・［高さの決め方］＝高さマップ。土台 0.4mm に <code>depth_map.png<\/code> の 明るさ × 10mm（強さの上限）を足す。元絵（<code>source.png<\/code>）は 13mm 角の 正方形 21×20 個で、間 2mm はアルファ 0——1 個ずつが独立した島なので ［面を分割する］は要らない。<\/p>\n<p><strong>断面は台形。<\/strong> 縁から内側へ 3.5mm（白）／2.0mm（黒）の斜面で頂に達し、 頂は 6×6mm（白）／9×9mm（黒）の平ら。白の斜面は 70°——直立に近いが 逆勾配ではない。キーキャップの形と同じで、指に触れて痛くない。<\/p>\n<p><strong>白黒は、スタッズの中心が帯のどちら側にあるかで決める。<\/strong> 帯は 3 つの 領域で向きが変わる——左は右上がり（幅 48mm）、中は右下がり（60mm）、 右はほぼ水平（46mm）——領域の境も斜め。15mm の画素で帯が階段になるのは 承知の上で、それが 21（モザイク）・52（点描）で確かめた「画素の柄」の 見え方。最初は右の領域を 72° にしたが、46mm の帯が 15mm の画素で ばらけて読めず、84°（ほぼ水平の帯）に直した。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>13mm 角の塊。柱モードの半径では 15mm 角の四角は作れない<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td><strong>315 / 300mm<\/strong><\/td><td>コートの背、肩甲骨から腰まで。トレイの内側<\/td><\/tr><tr><td>高さの決め方<\/td><td>高さマップ<\/td><td>白と黒で高さを変え、断面を台形にする<\/td><\/tr><tr><td>最大高さ<\/td><td>1.8mm（読まれない。土台は 0.4mm）<\/td><td>高さマップのときの土台は 0.4mm 固定<\/td><\/tr><tr><td><strong>高さマップの強さ<\/strong><\/td><td><strong>10.0mm（上限）<\/strong><\/td><td>白 0.4＋9.6＝10.0mm。上限に張り付いている<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>正方形の縁を階段にしない<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>要素は元絵で既に 13mm 角に分かれている<\/td><\/tr><tr><td>色<\/td><td>画像色を単色で反映<\/td><td>白 (236,233,225) / 黒 (26,26,28) の 2 色<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.05, 0.05, 0.055)<\/td><td>黒いウールのコート地<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>スタッズの輪郭。間 2mm はアルファ 0<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_69.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA 1260×1200、4px/mm、9KB）、<code>depth_map.png<\/code> （L 1024×975、17KB。面の格子と同じ大きさ）、<code>dazzle_chart.png<\/code> （スタッズ 1 個＝1 画素の白黒の図面）、<code>studs.json<\/code>（420 個の位置・色・ 高さ）。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>315×300 → <strong>313.3 × 298.3 × 10.01mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>スタッズ<\/td><td><strong>420 個<\/strong>（白 210・黒 210）、13×13mm、間 2.0mm<\/td><td>≤15mm ✓ / ≥0.6 ✓<\/td><\/tr><tr><td>高さ<\/td><td>白 <strong>10.008<\/strong> / 黒 <strong>2.518mm<\/strong>（420 個すべて実測、ばらつき 0）<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>縦横比<\/td><td>10.0 ÷ 13.0 = <strong>0.77<\/strong><\/td><td>棘ではない<\/td><\/tr><tr><td>斜面<\/td><td>白 70°（3.5mm で 9.6mm）／黒 46°<\/td><td>逆勾配なし<\/td><\/tr><tr><td>頂の平ら<\/td><td>白 6×6 / 黒 9×9mm<\/td><td>—<\/td><\/tr><tr><td>帯<\/td><td>同じ色が横に続く長さ 最短 1・中央値 4・最長 17 個（15〜255mm）<\/td><td>—<\/td><\/tr><tr><td>底<\/td><td>z=0.000<\/td><td>✓<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><tr><td>遠目<\/td><td>斜めの絵を 60px に縮めても白黒の差 139/255<\/td><td>—<\/td><\/tr><tr><td>頂点 / 生成<\/td><td>1,577,852 / 14 秒（最終 1024×975）<\/td><td>—<\/td><\/tr><\/table>\n<p><strong>道具の 2 行。<\/strong>「いちばん大きい要素は 13×13mm です（上限 15.0mm）」 （v7.169.0 の余裕の報告。設計どおり）と「やや重くなる可能性があります」 （解像度×高さ）。警告は無い。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>遠目から効く（<code>preview.jpg<\/code> / <code>preview_top.jpg<\/code>）。<\/strong> 白の帯が 10mm 立ち上がって黒の 2.5mm を影で沈めるので、色を抜いても帯が読める。 60px に縮めた絵でも白黒の差が 139 あり、写真の隅に写っても何の服か 分かる。<strong>本部のヒントへの答えとしては成立している。<\/strong><\/li><li><strong>塊である（<code>preview_macro.jpg<\/code>）。<\/strong> 13mm 角・頂 6mm・高さ 10mm の 台形はキーキャップそのもので、棘ではない。指で押しても壊れない。 逆に言うと<strong>重い<\/strong>——白 210 個 × 約 0.8g で 170g 前後の樹脂が背に乗る （実測ではなく体積の概算）。コート地なら持つが、薄手のジャケットには 向かない。<\/li><li><strong>低い視点（<code>preview_low.jpg<\/code>）で帯の形が変わる。<\/strong> 白が黒を隠して、 横の帯がつながり、斜めの帯が途切れる——「動くと読めない」というダズル の狙いがそのまま起きる。ただし絵では静止画 2 枚の違いでしか示せない。<\/li><li><strong>右の領域が弱い。<\/strong> 中央の大きな「く」の字は読めるが、右の水平の帯は 15mm の画素で 3 段の階段になり、黒の大きな面が 2 か所できる。本物の ダズルの曲線の帯はこの画素では描けない。帯を 2 色でなく<strong>3 段の高さ<\/strong> （10 / 6 / 2.5mm）にすれば、色を増やさずに帯を増やせる——次の版の候補。<\/li><li><strong>白黒 2 色で、契約どおり。<\/strong> コンテスト調査の「受賞作はモノトーン〜 2 色」に合わせ、色で派手にせず高さで派手にした。<\/li><li><strong>高さは上限で止まった。<\/strong> 高さマップの強さは 10mm が上限で、土台 0.4mm と合わせて 10.4mm までしか届かない。造形の上限は 15mm なので、あと 4.6mm 分は道具の側で使えない（欲しい機能 #47）。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>ウールのコートの背中 1 面<\/strong>、肩甲骨の下から腰まで。前身頃は素のまま、 背だけがダズル——後ろから見たときだけ派手で、正面は黒いコート。 刷るのは 313×298mm の 1 枚で、縫い代は柄の外に取る（背の中心で 2 枚に 割らない。割るなら帯の向きが変わる領域の境で割ると、縫い目が境に 隠れる）。裾に近い 2 段は黒の低いスタッズにして、座ったときに当たらない ようにするとよい（今の図では下 2 段にも白がある）。洗濯は不可、 ブラシ掛けはできる。<strong>動くたびに帯が組み替わる<\/strong>ので、ランウェイの 後ろ姿と、写真の隅に写った後ろ姿の両方で効く。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_69.py     # source.png / depth_map.png / dazzle_chart.png / studs.json（scipy が要る） BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/69_ダズル_遠目から効く白黒の背 --final ... --python docs/samples/tools/render_top.py -- docs/samples/69_ダズル_遠目から効く白黒の背 ... --python docs/samples/tools/render_view.py -- docs/samples/69_ダズル_遠目から効く白黒の背 --azim 235 --elev 34 --name preview ... --python docs/samples/tools/render_view.py -- docs/samples/69_ダズル_遠目から効く白黒の背 --azim 300 --elev 12 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/69_ダズル_遠目から効く白黒の背 --at 0.5,0.5 --span 70 --elev 30<\/p>\n<p><code>settings.json<\/code> は 67 の設定を土台に、幅・奥行き・強さ・生地の色を 書き換えた。<code>surface_depth_map_path<\/code> はフォルダ内の <code>depth_map.png<\/code> （<code>make_sample.py<\/code> が絶対パスに直す）。フォルダは約 620KB。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。本部の言う［一方向の光で 撮る］（v7.180.0）はこの複製には無いので、見本の絵は作例室の道具の 光のまま。<\/p>","imgs":[{"c":"斜め","d":"img/69_preview.jpg"},{"c":"真上","d":"img/69_preview_top.jpg"},{"c":"低い角度から","d":"img/69_preview_low.jpg"},{"c":"拡大","d":"img/69_preview_macro.jpg"}]},{"num":"70","title":"黒の一筋 — 平らな黒に、肩から裾へ 1 本","mode":"BRISTLE","path":"docs/samples/70_黒の一筋_平らな黒に肩から裾へ1本","text":"<p class=\"lead\">**黒いストレートドレスの前身頃に、黒い平らな面と、黒い 1 本の帯だけを\n刷る。** 面は 10mm 角・高さ 1.0mm の四角いタイル 476 個、帯は 12mm 角・\n高さ 10mm の四角柱 136 本が 4 列。色は 1 つ、形は 1 つ、線は 1 本。\n柄も文字も無い。<strong>モード（強さと引き算）<\/strong>——足して派手にするのではなく、\n削って残った 1 本の帯で服の縦を決める。<\/p><p><strong>黒いストレートドレスの前身頃に、黒い平らな面と、黒い 1 本の帯だけを 刷る。<\/strong> 面は 10mm 角・高さ 1.0mm の四角いタイル 476 個、帯は 12mm 角・ 高さ 10mm の四角柱 136 本が 4 列。色は 1 つ、形は 1 つ、線は 1 本。 柄も文字も無い。<strong>モード（強さと引き算）<\/strong>——足して派手にするのではなく、 削って残った 1 本の帯で服の縦を決める。<\/p>\n<p>本部のヒント「モード系——黒か極端なモノクローム、大きい単位、少ない要素、 平らな面と柱の領域、鋭い縁。太くて低い柱を面で敷き詰めるのも同じくらい モード」を柱モードで受けた。69（ダズル）が「派手・遠目・高さの影」なら、 70 はその真逆——<strong>近くで触って初めて分かる<\/strong>平らな面と、遠目には 1 本の 線にしか見えない帯。縦横比は帯で <strong>0.83<\/strong>、面で 0.10。棘は 1 本も無い。<\/p>\n<h3>仕組み<\/h3>\n<p>柱モード・四角（CUBE）・<strong>格子に固定<\/strong>（<code>pin_grid<\/code>、34 × 18、間隔 13mm）。 元絵 <code>source.png<\/code> は<strong>黒一色の不透明<\/strong>——だから 612 本が全部立つ。<\/p>\n<p><strong>面と帯を分けるのは［領域マスク］（2 枚目の画像）だけ。<\/strong> <code>region_mask.png<\/code> は帯の 4 行（下から 11〜14 行目）が白、残りが黒。［黒い部分の高さ比］ 0.10 で面は 10mm → 1.0mm、［黒い部分の太さ比］0.8333 で面は 12mm → 10mm 角（すき間 3mm）。帯はマスクが白なので素の値のまま——12mm 角・ すき間 1mm・高さ 10mm。マスクは柱の中心 1 点で読まれるので、帯の縁は 格子の目にぴったり乗せる（行の中心 ±6.5mm）。境目はぼかさない—— 隣の 1 列でいきなり 9mm 立つ。それが「鋭い縁」。<\/p>\n<p><strong>なぜ 1.0mm の面を残すか。<\/strong> 生地を素のままにせず、面を 1.0mm の タイルで覆うと、帯と面が<strong>同じ材・同じ黒・同じ四角<\/strong>で連続し、帯が 「貼ったもの」ではなく「面から立ち上がったもの」に見える。3mm のすき間に 生地の織りが覗くので、面はタイル張りの床に見える（<code>preview_macro.jpg<\/code>）。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><td>四角柱を格子に置く。高さの違う 2 種類を 1 枚に<\/td><\/tr><tr><td>列数 / 行数（固定）<\/td><td>34 / 18<\/td><td>格子 13mm（<code>pin_grid<\/code>）。帯は行 11〜14<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>429 / 221mm<\/td><td>中心から中心。外形は 441 × 233（トレイの内側）<\/td><\/tr><tr><td>断面 / 頂点数<\/td><td><strong>四角（CUBE）<\/strong> / 4<\/td><td>鋭い縁。丸みは無し<\/td><\/tr><tr><td>要素の半径 / X 倍率 / Y 倍率<\/td><td><strong>6.0<\/strong> / 1.0 / 1.0<\/td><td>一辺 12mm（半径 × 2）<\/td><\/tr><tr><td>要素の向き<\/td><td>固定 0°<\/td><td>格子と平行<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td>10.0mm / ON<\/td><td>帯の高さ。面はマスクで下げる<\/td><\/tr><tr><td>上端の丸み / 先細り<\/td><td>0 / 1.0（無し）<\/td><td>角を立てる<\/td><\/tr><tr><td><strong>領域マスク<\/strong><\/td><td><strong>ON・画像 <code>region_mask.png<\/code><\/strong><\/td><td>帯（白）と面（黒）を分ける唯一の手段<\/td><\/tr><tr><td>黒い部分の高さ比 / 太さ比<\/td><td><strong>0.10 / 0.8333<\/strong><\/td><td>面は 1.0mm・10mm 角。帯は 10mm・12mm 角<\/td><\/tr><tr><td>明暗による半径変化 / 間引き / 輪郭に合わせる<\/td><td>OFF / OFF / OFF<\/td><td>元絵は一色。読むものが無い<\/td><\/tr><tr><td>色<\/td><td>画像色を単色で反映<\/td><td>黒 (22,22,24) 1 色<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.035, 0.035, 0.04)<\/td><td>黒い薄手のウール。すき間から覗く<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>元絵は全面不透明なので効かない<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_70.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA 1716×884、4px/mm、黒一色、7KB）、<code>region_mask.png<\/code> （L 1716×884、帯の行だけ白、2KB）、<code>layout.json<\/code>（格子・帯の行・寸法・ 本数）。<strong>元絵に描いたものは何も無い<\/strong>——柄はマスクの 4 行だけ。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>429×221 → <strong>441.0 × 231.0 × 10.00mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>柱<\/td><td><strong>612 本<\/strong>（帯 136・面 476）<\/td><td>—<\/td><\/tr><tr><td>帯<\/td><td><strong>12.000 × 12.000 × 10.000mm<\/strong>、すき間 1.0mm（実測）<\/td><td>0.6〜15 ✓ / ≥0.6 ✓<\/td><\/tr><tr><td>面<\/td><td><strong>10.000 × 10.000 × 1.000mm<\/strong>、すき間 3.0mm（実測）<\/td><td>✓<\/td><\/tr><tr><td>帯の幅<\/td><td>4 列 × 13mm − 1mm = <strong>51mm<\/strong>、長さ 441mm<\/td><td>—<\/td><\/tr><tr><td>縦横比<\/td><td>帯 10 ÷ 12 = <strong>0.83<\/strong>、面 0.10<\/td><td>棘ではない<\/td><\/tr><tr><td>段差<\/td><td>面 1.0 → 帯 10.0mm、1 列で <strong>9.0mm<\/strong><\/td><td>逆勾配なし（垂直）<\/td><\/tr><tr><td>底<\/td><td>z=0.000（帯・面とも）<\/td><td>✓<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><tr><td>頂点 / 生成<\/td><td>4,896（=612×8） / 2.4 秒<\/td><td>—<\/td><\/tr><\/table>\n<p>実際の造形範囲の奥行きは 231.0 で、外形の計算値 233.0 より 2mm 小さい ——いちばん上と下の行は面（10mm 角）なので、外に出るのは 5mm ずつ。 帯の 12mm 角は内側の行にあるので外形には出ない。<\/p>\n<p><strong>道具の 3 行。<\/strong>「実際の造形範囲 441.0 × 231.0 × 10.00mm（指定は 幅 429.0 × 奥行き 221.0mm）」（v7.168.0 の報告。設計どおり）。 「列数/行数を固定: 34 x 18 (pin_grid)」（作例室の道具の行）。そして <strong>「要素間隔が推奨値未満です: 0.00mm」<\/strong>——実際のすき間は帯 1.0mm・ 面 3.0mm で、どちらも 0.6mm を超えている。この行が読んでいるのは ［間隔］の箱（<code>rt_spacing_mm<\/code>）で、間隔保持を切って格子に固定すると 0.0 のまま。書き出しの検査が使う <code>_bf_bristle_thickness_and_gap<\/code> は 同じ設定で 1.0mm を返す（欲しい機能 #48。#39 の推測を訂正した）。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>1 本の帯で服が決まる（<code>preview.jpg<\/code> / <code>preview_low.jpg<\/code>）。<\/strong> 平らな 黒の面に黒い帯が 1 本、低い視点では帯が黒い稜線になって面の上に浮く。 色も柄も無いのに、この札が「服のどこか」だと分かる——縦の 1 本は 身体の軸そのもの。<strong>本部のヒント B への答えとしては成立している。<\/strong><\/li><li><strong>鋭い縁（<code>preview_macro.jpg<\/code>）。<\/strong> 12mm 角の四角柱が 1mm のすき間で 並び、面の 10mm 角のタイルとの段差 9mm が垂直に落ちる。丸みも先細りも 無いので、影が黒く切れる。ここが 69 のキーキャップとの違いで、 69 は台形で指に優しく、70 は直角で硬い。<strong>モードは硬くてよい。<\/strong><\/li><li><strong>面は「平ら」ではなく「タイル」に見える。<\/strong> 3mm のすき間から生地の 織りが覗くので、真上（<code>preview_top.jpg<\/code>）では帯より面の格子のほうが 目立つ。すき間を 1mm にすれば面は板に近づくが、生地の曲がりに 追従しなくなる（10mm のタイルが 1mm の隙で 476 個——曲面では隣と 当たる）。<strong>すき間 3mm は「着られる平ら」の下限<\/strong>として選んだ。<\/li><li><strong>絵はまだ「絵」だ。<\/strong> 見本の絵は拡散光で撮っているので、黒一色の 段差は影でしか読めず、<code>preview.jpg<\/code> の帯は黒の中の黒。 <strong>［一方向の光で撮る］（v7.180.0）も試して、戻した<\/strong>（2026-09-06、 <code>_samples_wt<\/code> を 7.185.0 へ上げてから）。太陽 1 灯・背景を暗くした絵は 黒の面がぜんぶ沈み、絵ぜんたいの平均の明るさが 137 → 38（0〜255）で、 帯は右上の角の縁がかろうじて読めるだけだった。43「綸子」では同じ 光で紋が初めて出たので、<strong>一方向の光は「向きで作った柄」に効き、 「黒一色の段差」には効かない<\/strong>——黒は光を返さないので、影も黒の中に 沈む。実物なら、光沢のある黒の樹脂が段差の縁で光を返すはず。<\/li><li><strong><code>preview.jpg<\/code> の中央に小さな明点がある。<\/strong> 帯の中ほどの 1 本の 角に出ていて、鏡面のハイライトだと読んでいる（確かめていない）。 形の異常ではない——<code>preview_top.jpg<\/code> と <code>preview_macro.jpg<\/code> の同じ 場所には何も無い。<\/li><li><strong>重さは問題にならない。<\/strong> 帯 136 本 × 1.44cm³ ≒ 196cm³（約 200g 相当の概算、実測ではない）と、面 476 本 × 0.1cm³ ≒ 48cm³。帯が 前身頃の中央に縦に 1 本なので、重さは身体の軸に乗る。<\/li><li><strong>この作例の価値は「引き算の証明」。<\/strong> 44〜69 で使った手——色・柄・ 向き・先端パーツ・高さマップ——を全部捨て、［領域マスク］1 枚と 四角柱 1 種類で服の 1 面を成立させた。次に「引く」作例を作るときの 基準線になる。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>黒いストレートドレスの前身頃、中央の縦 1 本。<\/strong> ファイルでは帯が X 方向（441mm）に走っているので、生地の上で 90° 回して、帯を肩から裾へ 縦に置く。前身頃の幅 231mm は 9 号のバストの半分（約 230mm）で、 1 枚で前身頃の中心が覆える。ストレートドレスは前中心に縫い目が無い ので、帯は途切れない。<strong>縫い代は札の外<\/strong>——脇と肩の縫い代は面の タイルの外に取り、裾は帯の端をそのまま切り落とし線にする（帯の 最後の 1 列が裾の縁になる）。面の 1.0mm のタイルは薄いので、脇の 縫い代の 12mm 内側まで来ても縫える。<strong>帯の裏には接着芯を貼る<\/strong> （帯だけで 200g がドレスの中心に縦に乗るので、生地が伸びる）。 洗濯は不可、乾いた布で拭く。後ろ身頃は素の黒——正面に 1 本の線、 背中は何も無い。<strong>ランウェイでは正面の 1 本が動く<\/strong>——歩くたびに帯が 身体の中心線を追い、段差の縁が光を返す。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_70.py     # source.png / region_mask.png / layout.json（PIL だけ） BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/70_黒の一筋_平らな黒に肩から裾へ1本 --final ... --python docs/samples/tools/render_top.py -- docs/samples/70_黒の一筋_平らな黒に肩から裾へ1本 ... --python docs/samples/tools/render_view.py -- docs/samples/70_黒の一筋_平らな黒に肩から裾へ1本 --azim 300 --elev 12 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/70_黒の一筋_平らな黒に肩から裾へ1本 --at 0.5,0.66 --span 80 --elev 30<\/p>\n<p><code>preview.jpg<\/code> はアドオンの見本の絵（<code>make_sample.py --final<\/code> が 書き出す）。<code>settings.json<\/code> は 68 の設定を土台に、断面・半径・格子・ 高さ・領域マスク・生地を書き換えた（<code>meta.pin_grid: true<\/code>）。 <code>region_mask_path<\/code> はフォルダ内の <code>region_mask.png<\/code>（<code>make_sample.py<\/code> が 絶対パスに直す）。フォルダは約 390KB。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。2026-09-06 に 7.185.0 （<code>67d7287<\/code>）で作り直して数を確かめた（34 × 18、441.0 × 231.0 × 10.00mm、 初版と同じ）。［一方向の光で撮る］は上に書いたとおり試して戻したので、 <code>settings.json<\/code> の <code>export_preview_directional_light<\/code> は false のまま。<\/p>","imgs":[{"c":"斜め","d":"img/70_preview.jpg"},{"c":"真上","d":"img/70_preview_top.jpg"},{"c":"低い角度から","d":"img/70_preview_low.jpg"},{"c":"拡大","d":"img/70_preview_macro.jpg"}]},{"num":"71","title":"縫わないドレープ — 毛足の高さで描く襞","mode":"BRISTLE","path":"docs/samples/71_縫わないドレープ_毛足の高さで描く襞","text":"<p class=\"lead\">タイトスカートの前身頃（240 × 300mm）を、直径 1.2mm・間隔 2.0mm の\n柱 18,271 本で埋め、<strong>柱の高さだけ<\/strong>で襞（ひだ）を描いた。谷は 1.2mm、\n山は 7.0mm。色は生地も柱も同じワインの一色に近く、遠目には模様は\n読めず、<strong>毛並みの起伏だけで縦の襞が立ち上がって見える<\/strong>。<\/p><p>タイトスカートの前身頃（240 × 300mm）を、直径 1.2mm・間隔 2.0mm の 柱 18,271 本で埋め、<strong>柱の高さだけ<\/strong>で襞（ひだ）を描いた。谷は 1.2mm、 山は 7.0mm。色は生地も柱も同じワインの一色に近く、遠目には模様は 読めず、<strong>毛並みの起伏だけで縦の襞が立ち上がって見える<\/strong>。<\/p>\n<p>本部からの種 C「柱モードで、高さそのものを見せる作品を 1 点」への答え。 <strong>真上から見て何も読めないこと<\/strong>を、この作例では合格の条件にした—— 真上に何かが見えるなら、それは高さではなく柄で形を作っている。<\/p>\n<h3>仕組み<\/h3>\n<ul><li>格子は 121 × 151 に固定（<code>pin_grid<\/code>）。元絵はグレーの濃淡だけで、 画素の明るさ v がそのまま高さ v × 7mm になる（［高さを揃える］切・ ［明度反転］入）。柱モードは絵をリニアで読むので、元絵は 「高さ ÷ 最大高さ」を sRGB に符号化して描いてある。<\/li><li>出来た柱の高さと元絵の期待値を突き合わせた：相関 0.9993、平均差 0.038mm、最大差 0.20mm。左右・上下を反転した期待値では相関 0.05 以下 なので、向きも合っている。<\/li><li>襞は位相 2πx / λ(y) の正弦で、λ は裾 22mm → 腰 40mm へ広がる。そこへ 蛇行と強弱を足し、稜線を片側へ寄せる skew を掛けて「布が落ちる」向きを 付けた。<\/li><li>柱は先細り 0.55・上端の丸み 0.8 の弾丸形。色は［高さでグラデーション］ を<strong>物ぜんたい<\/strong>に掛けて（柱ごとではなく）、谷の柱を暗いワイン、山を 明るいワインにした。<\/li><\/ul>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><\/tr><tr><td>列数 / 行数<\/td><td>121 / 151（格子に固定）<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>240 / 300mm<\/td><\/tr><tr><td>断面 / 頂点数<\/td><td>円形 / 12<\/td><\/tr><tr><td>半径<\/td><td>0.6mm<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td>7.0mm / 切<\/td><\/tr><tr><td>明度反転<\/td><td>入<\/td><\/tr><tr><td>最小高さカットオフ<\/td><td>0<\/td><\/tr><tr><td>先細り / 上端の丸み<\/td><td>0.55 / 0.8<\/td><\/tr><tr><td>明暗による半径変化 / 間引き<\/td><td>切 / 切<\/td><\/tr><tr><td>色<\/td><td>高さでグラデーション（物ぜんたい・ワイン 3 点）<\/td><\/tr><tr><td>側面<\/td><td>テクスチャ<\/td><\/tr><tr><td>生地<\/td><td>織り・カスタム色 (0.07, 0.012, 0.022)<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><\/tr><\/table>\n<h3>元画像<\/h3>\n<p><code>source.png<\/code> は RGBA 960 × 1200（4px/mm）、224KB。<code>layout.json<\/code> に 襞の λ・蛇行・skew の数値を置き、<code>tools/make_art_71.py<\/code> が numpy と PIL で描く。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>241.2 × 301.2 × 7.00mm<\/td><\/tr><tr><td>柱の本数<\/td><td>18,271（格子どおり）<\/td><\/tr><tr><td>直径 / すき間<\/td><td>1.200 / 0.800mm<\/td><\/tr><tr><td>高さ 谷 / 中央値 / 山<\/td><td>1.178 / 2.714 / 7.000mm（10% 1.46・90% 4.81）<\/td><\/tr><tr><td>元絵との相関<\/td><td>0.9993<\/td><\/tr><tr><td>先端の直径<\/td><td>0.132mm（全部同じ）<\/td><\/tr><tr><td>縦横比 山 / 中央値<\/td><td>5.8 / 2.3（4 を超えるのは 10%）<\/td><\/tr><tr><td>底の高さ<\/td><td>0<\/td><\/tr><tr><td>オーバーハング<\/td><td><strong>0 面 / 0.0mm²<\/strong>（v7.191.0 で実測）<\/td><\/tr><tr><td>頂点数 / 生成時間<\/td><td>8,989,332 / 4.4〜7.6 秒<\/td><\/tr><\/table>\n<p><strong>縦横比 5.8 は棘ではなく毛足。<\/strong> 4 を超える柱は稜線の上に帯として まとまり、隣も同じ高さなので、1 本ずつが立っているようには見えない。 「同じ高さの柱がまとまっているか」が棘と毛足の分かれ目で、この作例は それを高さ場で保証している。<\/p>\n<p>道具が出した行は 3 本。「実際の造形範囲 241.2 × 301.2 × 7.00mm」は 指定の 240 × 300 に直径 1 本ぶんを足した値で正しい。「要素間隔が推奨値 未満です: 0.00mm」は #48 のとおり格子固定では読まれない。「最小高さの 下限は 0.4mm …6% に届かない所に柱は立ちません」は、元絵の最小が 1.178mm なので 1 本も消えていない。<\/p>\n<h3>先細りを 0.55 へ戻した（v7.190.0）<\/h3>\n<p>作った当初、<strong>先細り 0.55 では先端に下向きの面が 1 本あたり 12 面出た<\/strong> （→ 欲しい機能 #49）。断面の半径が z=6.825 で 0.024 まで細り、最上段 z=7.0 で 0.150 に戻る「傘」になる。狙いは 0.55 の弾丸形だったが、 オーバーハングを避けるために 0.7 へ逃がしてあった。<\/p>\n<p>v7.190.0 でその原因（縮み量が絶対量で、先細り後の半径から素で引かれて いた）が直ったので、<strong>狙いの 0.55 へ戻して撮り直した。<\/strong>アドオンの検査に 依らない自前のものさし——柱 1 本を島に分け、Z の輪ごとの XY 半径の最大を 採り、上へ行くほど太くなる所を探す——で測って <strong>0.000000mm<\/strong>、 アドオンの検査も <strong>0 面 / 0.0mm²<\/strong>。<\/p>\n<table><tr><th><\/th><th>上へ行くほど太くなる量の最大<\/th><\/tr><tr><td>v7.189.0 の 0.55<\/td><td>傘（上の段落の実測）<\/td><\/tr><tr><td>v7.191.0 の 0.55<\/td><td><strong>0.000000mm<\/strong><\/td><\/tr><\/table>\n<p><strong>代わりに先端はより細くなった。<\/strong>縮み量が先細り比率に比例するように なったので、先端の直径は 半径 × 先細り × (1−丸み) × 2 = 0.6 × 0.55 × 0.2 × 2 = <strong>0.132mm<\/strong> で、全部の柱で同じ。直径が条文の 0.6mm を切るのは <strong>上から 0.875mm<\/strong>（全高 7mm の 12.5%）で、そこから下は単調に太くなり 根元で 1.200mm。<strong>アドオンはここで何も言わない<\/strong>——最小 XY の検査は 根元の直径（1.200mm）を見るので、先端の細さは検査の外にある （→ 欲しい機能 #55）。この作例では狙いが毛足なので、先が点で終わる ことは形として正しいと判断した。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>面として読める。<\/strong> 斜めからの絵で襞は「毛並みの起伏」に見え、柱の 1 本 1 本は消えている。種 C の狙いは成立した。<\/li><li><strong>真上からは何も無い。<\/strong> これは狙いどおりで、この作例の証明そのもの。<\/li><li>寄ると弾丸形の柱の列で、谷は短く暗い。高さと色が同じ向きに動くので 襞の読みが強まる。<\/li><li><strong>弱いのは布らしさ。<\/strong> 稜線が滑らかすぎて、布の襞というよりマットレスや ウレタンの波に見える。本物の襞は稜線が鋭く、谷が広い。稜線を 1〜2 列に 絞って、谷を平らに広げるほうが布に近づく。次に高さ場をやるなら直す。<\/li><li>奥の縁が高さの違いでのこぎり状に見える。裾の 1 列は切り落とす前提。<\/li><li>絵は拡散光で撮ってある。向きではなく高さで作っているので拡散光でも 読めるが、v7.185.0 の一方向の光で撮り直すと稜線の影がもっと出るはず。<\/li><li>軽い。1 本あたり約 2.3mm³、全体で約 43cm³、約 50g の概算。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>タイトスカートの前身頃。元絵の上が腰で、襞は縦に走る。脇の縫い代 15mm は柱の外に取り、裾は最後の 1 列で切り落とす。生地は薄い接着芯を裏に 貼ってから刷る想定。洗濯は不可。<\/p>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_71.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_top.py -- &lt;この folder&gt;\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --azim 300 --elev 12 --name preview_low\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; --at 0.5,0.5 --span 40 --elev 30<\/pre>\n<p><code>settings.json<\/code> は作例 68 を土台にして上の表の値へ変えたもの。 <code>height_ramp<\/code> の 3 点は <code>make_sample<\/code> が復元する。folder は約 865KB。<\/p>\n<p>作った版は 7.174.0、<strong>先細りを戻して撮り直したのが v7.191.0<\/strong> （<code>_samples_wt<\/code>）。v7.180.0 の［一方向の光で撮る］はまだ使っていない。<\/p>","imgs":[{"c":"斜め","d":"img/71_preview.jpg"},{"c":"真上","d":"img/71_preview_top.jpg"},{"c":"低い角度から","d":"img/71_preview_low.jpg"},{"c":"拡大","d":"img/71_preview_macro.jpg"}]},{"num":"72","title":"断層 — 背中を 1 本の線で割る","mode":"SURFACE","path":"docs/samples/72_断層_背中を1本の線で割る","text":"<p class=\"lead\">**ジャケットの背（300 × 280mm）を 13mm 角の低いタイル 392 個で覆い、\n斜めの断層 1 本だけで割った。** 断層の右は 1.5mm の平らな板のまま。左は\n断層へ向かって階段状にせり上がり（110mm 手前の 2.5mm から崖の 9.7mm\nまで）、断層の縁で 8mm の崖になる。タイルの格子は断層をまたぐと 6mm\n横にずれる——地質の横ずれ断層と同じ。線は 1 本、色は明暗 1 系統。<\/p><p><strong>ジャケットの背（300 × 280mm）を 13mm 角の低いタイル 392 個で覆い、 斜めの断層 1 本だけで割った。<\/strong> 断層の右は 1.5mm の平らな板のまま。左は 断層へ向かって階段状にせり上がり（110mm 手前の 2.5mm から崖の 9.7mm まで）、断層の縁で 8mm の崖になる。タイルの格子は断層をまたぐと 6mm 横にずれる——地質の横ずれ断層と同じ。線は 1 本、色は明暗 1 系統。<\/p>\n<p>70「引き算」を面モードで受けた 1 点。線を 1 本引くだけで、<strong>背中が 「動いた」と読める<\/strong>ことを狙った。69 と同じ 13mm 角の塊だが、69 が 2 色 2 段だったのに対し、こちらは片側だけが連続的にせり上がる。<\/p>\n<h3>仕組み<\/h3>\n<ul><li>面モード・［高さの決め方］＝高さマップ。土台 0.4mm に <code>depth_map.png<\/code> の 明るさ × 10mm を足す。タイルは 13mm 角・間 2mm で、1 個ずつアルファで 独立した島。断層は幅 2mm のアルファ 0 の溝で、溝に掛かるタイルは 三角や台形の破片に切られる（短辺 3mm 未満は落とした）。<\/li><li>隆起側の高さは破片の重心と断層の距離 s で決める： h = 2.5 + 7.5 × clip(1 − s / 110)。断層に接する列が 10mm、110mm 離れると 2.5mm。平らな側は 1.5mm。<\/li><li>断面は台形。斜面は 70° を超えないように高さに応じて幅を取る （10mm なら 3.5mm、1.5mm なら 1.0mm）。<\/li><li>色は高さに沿って暗いスレート → 明るい石。崖の縁がいちばん明るい。 平らな側のタイルは地より少しだけ明るい (72,74,80)。<\/li><\/ul>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>13mm 角の塊と、崖の垂直に近い側面<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>300 / 280mm<\/td><td>ジャケットの背、肩甲骨から腰まで<\/td><\/tr><tr><td>高さの決め方<\/td><td>高さマップ（強さ 10.0mm・上限）<\/td><td>崖 10mm、平ら 1.5mm を 1 枚の絵で<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>タイルの縁と断層の溝を階段にしない<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>元絵で既に 13mm 角に割れている<\/td><\/tr><tr><td>色<\/td><td>画像色を単色で反映<\/td><td>高さに沿った明暗を元絵に描いてある<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.06, 0.062, 0.07)<\/td><td>チャコールのウール<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>タイルの輪郭。間 2mm と溝はアルファ 0<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_72.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA 1200 × 1120、4px/mm、12KB）、<code>depth_map.png<\/code> （L 1024 × 956、18KB。面の格子と同じ大きさ）、<code>layout.json<\/code> （断層の位置・角度・ずれ・高さの式と、破片 392 個の寸法と高さ）。 numpy・PIL・scipy が要る。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>300 × 280 → <strong>298.2 × 278.2 × 9.73mm<\/strong><\/td><td>460 × 360 の内 ✓<\/td><\/tr><tr><td>タイル<\/td><td><strong>392 個<\/strong>（隆起側 208・平ら側 184、断層で切られた破片 56）<\/td><td>—<\/td><\/tr><tr><td>タイルの足元 / 頂の平ら<\/td><td>12.96〜13.11mm / 11.1mm（1.5mm）・10.5mm（3.4mm）<\/td><td>≤15mm ✓<\/td><\/tr><tr><td>高さ 平ら / 隆起<\/td><td><strong>1.498<\/strong> / <strong>2.50〜9.73mm<\/strong>（設計 1.5 / 2.5〜9.86）<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>元絵との一致<\/td><td>322 個を採寸、平均差 0.003mm・最大差 0.233mm<\/td><td>—<\/td><\/tr><tr><td>崖の段差<\/td><td>断層の中央で <strong>8.2mm<\/strong>（9.69 対 1.50）、裾の端で 4.4mm<\/td><td>—<\/td><\/tr><tr><td>縦横比<\/td><td>9.7 ÷ 13 = <strong>0.75<\/strong><\/td><td>棘ではない<\/td><\/tr><tr><td>斜面<\/td><td>最急 70°<\/td><td>逆勾配なし<\/td><\/tr><tr><td>底<\/td><td>z = 0.000<\/td><td>✓<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓<\/td><\/tr><tr><td>頂点 / 生成<\/td><td>1,524,954（確定 1024 × 956）/ 8.5 秒<\/td><td>—<\/td><\/tr><\/table>\n<p><strong>道具の行は 3 本。<\/strong>「実際の造形範囲 298.2 × 278.2 × 9.73mm」は指定から 縁の 1mm を引いた値で正しい。「やや重くなる可能性があります」は解像度 × 高さの注意。3 本目は <strong>v7.191.0 で「いちばん大きい要素は 13×13mm です （上限 15.0mm）」<\/strong> になり、実測の足元 13 × 13mm と一致した。<\/p>\n<p><strong>それまでは 13×7mm と出ていて、合わなかった<\/strong>（プレビューでは 13×8mm）。 69 は同じ 13mm 角で「13×13mm」と出ており、違いは断層の溝と切られた破片 だけ——ここに書いた「破片の計り方が何かを拾っているのかもしれない」は、 当たっていた。並べ替えの鍵が<strong>長いほうの辺だけ<\/strong>だったので、辺が同点の 破片が並ぶと<strong>答えが「その破片が絵のどこにあるか」で決まっていた<\/strong> （安定ソートが同点を絵の上から下の順で解いていた）。断層のように <strong>切れ目が格子に乗っている絵では、同点は必ず起きる<\/strong>——破片がタイルと 同じ列数を占めるので、列数 × セル幅が桁まで一致する。<\/p>\n<p>第2の鍵に面積が足されて直った。<strong>造形の可否は動かない<\/strong>——上限 15mm は 長いほうの辺で見ており、そこは同点だったから。変わったのは印字される 数字だけ（→ 欲しい機能 #50 は解決）。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>1 本の線で背中が動く（<code>preview.jpg<\/code> / <code>preview_top.jpg<\/code>）。<\/strong> 真上から 見ても斜めから見ても、断層の右と左が「同じ板の前と後」に読める。 隆起側の明るさの勾配が崖へ向かって上がるので、影が無くても方向が出る。 70 の引き算の答えとして成立している。<\/li><li><strong>横ずれが効いている（<code>preview_top.jpg<\/code>）。<\/strong> 断層をまたぐと格子の行が 6mm ずれるので、「板が割れて滑った」と読める。溝だけでは「線を引いた」に しか見えない——ずれが無いと断層ではなく目地になる。<\/li><li><strong>崖の面がのこぎり状（<code>preview_macro.jpg<\/code>）。<\/strong> 断層で切られた三角の 破片は、斜めの縁に沿って約 1mm 周期の刻みが出る。高さマップの斜面が 格子（0.29mm/マス）で階段になるためで、直線の縁しか無い 69 では出ない。 崩れた崖に見えなくもないが、狙ったものではない。溝を格子に沿わせるか、 破片の斜面を断層側だけ無くせば消えるはず——次の版の候補。<\/li><li><strong>平らな側が弱い。<\/strong> 1.5mm のタイルは拡散光では目地の影しか出ず、 「タイルの板」というより「地」に見える。それでも断層の右は<strong>何も 起きていない<\/strong>ことが主題なので、これ以上盛らない。<\/li><li><strong>重い。<\/strong> 隆起側 208 個は平均 5mm 前後の塊で、概算 150cm³・約 180g、 平らな側と合わせて 200g 強が背中に乗る。コートかテーラードの背なら 持つが、薄手には向かない。69 と同じ弱点。<\/li><li>絵は拡散光。v7.180.0 の一方向の光で撮り直せば、崖の影で段差 8mm が もっと強く出る。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>ジャケットの背 1 面<\/strong>、肩甲骨の下から腰。前身頃と袖は素のチャコール、 後ろ姿だけに断層。刷るのは 298 × 278mm の 1 枚で、縫い代は柄の外に取る。 背中心の縫い目は要らない（1 枚で刷って、断層の線を背中心の代わりに 使う）。裾側の 1 段は座るときに当たるので、隆起側でも 2.5mm 以下の列が 来るように断層の向きを決めてある（下ほど断層から離れる）。洗濯は不可。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_72.py     # source.png / depth_map.png / layout.json（scipy が要る） BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/72_断層_背中を1本の線で割る --final ... --python docs/samples/tools/render_top.py -- docs/samples/72_断層_背中を1本の線で割る ... --python docs/samples/tools/render_view.py -- docs/samples/72_断層_背中を1本の線で割る --azim 300 --elev 12 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/72_断層_背中を1本の線で割る --at 0.53,0.5 --span 70 --elev 30<\/p>\n<p><code>settings.json<\/code> は 69 の設定を土台に、幅・奥行き・生地の色を書き換えた。 <code>surface_depth_map_path<\/code> はフォルダ内の <code>depth_map.png<\/code>（<code>make_sample.py<\/code> が絶対パスに直す）。フォルダは約 576KB。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。v7.180.0 の［一方向の光で 撮る］はこの複製には無い。<\/p>","imgs":[{"c":"斜め","d":"img/72_preview.jpg"},{"c":"真上","d":"img/72_preview_top.jpg"},{"c":"低い角度から","d":"img/72_preview_low.jpg"},{"c":"拡大","d":"img/72_preview_macro.jpg"}]},{"num":"73","title":"サンレイプリーツ — 首から放射する折り目","mode":"BRISTLE","path":"docs/samples/73_サンレイプリーツ_首から放射する折り目","text":"<p class=\"lead\">**ケープの後ろ身頃（扇形 392 × 244mm）に、首の一点から放射する 15 本の\nナイフプリーツを、柱の高さだけで描いた。** 直径 1.2mm・間隔 2.0mm の柱\n15,332 本。折り目（稜線）は 7.0mm、谷は 1.5mm。断面は 71 の正弦ではなく\n<strong>のこぎり<\/strong>——折り目は 1〜2 列に絞り、そこから次の折り目まで一枚の斜面で\n降りて、折り目の裏で急に立ち上がる。首では折り目が 8.7mm 間隔で詰まり、\n裾では 28mm に開く。実物のサンレイプリーツと同じ幾何。<\/p><p><strong>ケープの後ろ身頃（扇形 392 × 244mm）に、首の一点から放射する 15 本の ナイフプリーツを、柱の高さだけで描いた。<\/strong> 直径 1.2mm・間隔 2.0mm の柱 15,332 本。折り目（稜線）は 7.0mm、谷は 1.5mm。断面は 71 の正弦ではなく <strong>のこぎり<\/strong>——折り目は 1〜2 列に絞り、そこから次の折り目まで一枚の斜面で 降りて、折り目の裏で急に立ち上がる。首では折り目が 8.7mm 間隔で詰まり、 裾では 28mm に開く。実物のサンレイプリーツと同じ幾何。<\/p>\n<p>71 の弱点「稜線が滑らかすぎて、布の襞というよりマットレスに見える」への 答え。柱も高さの範囲も 71 と同じで、<strong>変えたのは高さ場の形だけ<\/strong>。<\/p>\n<h3>仕組み<\/h3>\n<ul><li>柱モード・円柱・格子固定（197 × 123、間隔 2.0mm）。先細り 0.7・上端の 丸み 0.8。［高さを揃える］切・［明度反転］入で「明るいほど高い」。<\/li><li>身頃は扇形。頂点（首の中心）は紙面の上の外 (196, 322.8)、内径 100mm・ 外径 320mm・中心線から左右 38°。扇の外はアルファ 0。<\/li><li>折り目は角度で等間隔（5°）。位相 φ（0〜1）に対して、φ &lt; 0.85 は 折り目から谷へ一直線に降り、φ ≥ 0.85 で谷から折り目へ立ち上がる。 折り目ごとに高さ ±0.4mm・角度 ±0.25° を乱し、裾へ向けて折り目が 0.6mm 下がる（実物も裾で緩む）。<\/li><li>元絵はグレーの濃淡だけ。高さ ÷ 7 を sRGB に符号化して描く。出来た柱の 高さと突き合わせた：相関 0.9904、平均差 0.077mm。最大差 4.97mm は 折り目の段差の真上に中心が来た柱で、隣の谷の値を拾っている。<\/li><li>色は［高さでグラデーション］を物ぜんたいに掛け、谷 暗い銅 → 折り目 淡い金。折り目の列だけが光る。<\/li><\/ul>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><\/tr><tr><td>列数 / 行数<\/td><td>197 / 123（格子に固定）<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>392 / 244mm<\/td><\/tr><tr><td>断面 / 頂点数<\/td><td>円形 / 12<\/td><\/tr><tr><td>半径<\/td><td>0.6mm<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td>7.0mm / 切<\/td><\/tr><tr><td>明度反転<\/td><td>入<\/td><\/tr><tr><td>先細り / 上端の丸み<\/td><td>0.7 / 0.8<\/td><\/tr><tr><td>明暗による半径変化 / 間引き<\/td><td>切 / 切<\/td><\/tr><tr><td>色<\/td><td>高さでグラデーション（物ぜんたい・銅 → 金 3 点）<\/td><\/tr><tr><td>生地<\/td><td>織り・カスタム色 (0.10, 0.055, 0.028)<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_73.py<\/code>）<\/h3>\n<p><code>source.png<\/code> は RGBA 1568 × 976（4px/mm、398KB）。<code>layout.json<\/code> に扇の 寸法・折り目の間隔・高さの式を置く。numpy と PIL で描く。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><th>制約<\/th><\/tr><tr><td>実際の造形範囲<\/td><td><strong>393.2 × 239.2 × 7.00mm<\/strong>（指定 392 × 244。扇の上の角の列は立たない）<\/td><td>460 × 360 の内 ✓<\/td><\/tr><tr><td>柱の本数<\/td><td><strong>15,332<\/strong>（格子 24,231 のうち扇の中）<\/td><td>—<\/td><\/tr><tr><td>直径 / すき間<\/td><td>1.200 / 0.800mm<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>高さ 谷 / 中央値 / 折り目<\/td><td>1.50 / 4.06 / 7.00mm（10% 2.00・90% 6.07）。縁の 1 本だけ 0.41mm<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>折り目の柱（7.0 − 1.0mm 以上）<\/td><td>1,772 本 = 12%<\/td><td>—<\/td><\/tr><tr><td>元絵との相関<\/td><td>0.9904（左右反転 0.52・上下反転 0.02）<\/td><td>—<\/td><\/tr><tr><td>縦横比 折り目 / 中央値<\/td><td><strong>5.8 / 3.4<\/strong>（4 を超えるのは 36%）<\/td><td>折り目の線に並ぶ<\/td><\/tr><tr><td>底 / オーバーハング<\/td><td>0.000 / <strong>0 面<\/strong><\/td><td>✓<\/td><\/tr><tr><td>頂点 / 生成<\/td><td>7,543,344（確定）/ 3.8 秒<\/td><td>—<\/td><\/tr><\/table>\n<p><strong>縦横比 5.8 は棘ではなく折り目。<\/strong> 4 を超える柱は折り目の線（1〜2 列）と その斜面の上半分に帯としてまとまり、隣も同じ高さなので 1 本ずつは 立っていない（71 と同じ論法）。<\/p>\n<p>道具の行は 3 本。「実際の造形範囲 393.2 × 239.2 × 7.00mm」は正しい。 「要素間隔が推奨値未満です: 0.00mm」は #48 のとおり格子固定では読まれない。 「最小高さの下限は 0.4mm」は、谷が 1.5mm なので 1 本も消えていない。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>のこぎりは正弦より布に見える（<code>preview.jpg<\/code> / <code>preview_low.jpg<\/code>）。<\/strong> 折り目の列だけが明るい線になり、斜面は一様に暗く落ちるので、拡散光でも 「折った」と読める。71 のマットレス感は消えた。高さ場の形を変えただけで ここまで変わるのは、この道具で高さを見せるときの要点。<\/li><li><strong>扇と放射で「首から出ている」と読める（<code>preview_top.jpg<\/code>）。<\/strong> 真上から はプリーツスカートの製図そのもの。折り目が裾で開くので、平らな板でも 「首に着けたら襞が広がる」まで想像が届く。<\/li><li><strong>弱いのは首元。<\/strong> 内径 100mm では折り目が 4 列（8.7mm）に詰まり、 のこぎりが読めず畝になる（<code>preview_top.jpg<\/code> の上の縁）。実物でも首元の プリーツは潰れて見えるので許容したが、1 周期に 6 列（12mm）は欲しい。 内径 130mm か、折り目 6° で首元も 6 列になる。<\/li><li><strong>折り目の裏の立ち上がりが 2 列分の中間の高さになる。<\/strong> 位相 0.85〜1.0 の帯（裾で 4mm）は谷から折り目へ登る柱で、本物の折り目の裏（垂直）とは 違う。<code>preview_macro.jpg<\/code> では折り目の左に短い柱が 1〜2 列並ぶのが見える。 折り目の裏を 1 列に絞るには、柱の間隔を 1.5mm に詰めるしかない。<\/li><li><strong>左右の端の折り目が壁になる。<\/strong> ±38° の縁で最後の斜面が途中で切れ、 一番外の折り目が 7mm の壁として立つ（<code>preview_low.jpg<\/code> の右端）。 縫い代の側なので縫い込めば消えるが、縁を谷で終わらせるほうがよい。<\/li><li>軽い。1 本あたり平均 4mm 高さで約 3.3mm³、全体で約 50cm³・約 60g。<\/li><li>絵は拡散光。v7.180.0 の一方向の光で撮り直すと折り目の影が線になる。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>ケープ（または襟ぐりから広がるヨーク）の後ろ身頃 1 枚。首の内径 100mm は 後ろ襟ぐり 200mm 幅に相当し、縫い代 15mm は扇の外に取る。折り目は首から 裾へ放射するので、着ると柱の折り目線が身体の丸みに沿って開く。裾の 1 列は 切り落とす前提。薄い接着芯を裏に貼ってから刷り、洗濯は不可。<\/p>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_73.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_top.py -- &lt;この folder&gt;\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --azim 300 --elev 12 --name preview_low\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; --at 0.5,0.3 --span 60 --elev 30<\/pre>\n<p><code>settings.json<\/code> は作例 71 を土台にして、幅・奥行き・列数・行数・生地の色・ 色の 3 点を書き換えたもの。<code>height_ramp<\/code> の 3 点は <code>make_sample<\/code> が復元する。 folder は約 0.9MB。<\/p>\n<p>作った版は 7.174.0（<code>_samples_wt<\/code>）。v7.180.0 の［一方向の光で撮る］と v7.175.0 の「いちばん低い柱」の行はまだ無い。<\/p>","imgs":[{"c":"斜め","d":"img/73_preview.jpg"},{"c":"真上","d":"img/73_preview_top.jpg"},{"c":"低い角度から","d":"img/73_preview_low.jpg"},{"c":"拡大","d":"img/73_preview_macro.jpg"}]},{"num":"74","title":"ミウラ折りの袖 — 折れない生地に折り目の光を刷る","mode":"SURFACE","path":"docs/samples/74_ミウラ折りの袖_折れない生地に折り目の光を刷る","text":"<p class=\"lead\">**ジャケットの上袖の外側（180 × 200mm、肩から肘の上まで）に、ミウラ折りの\n面 255 個を、1 枚ずつ傾いた平らな面として刷った。** 面は平行四辺形\n12 × 12mm、溝は 2mm。面の高さは平面で、列が偶数なら右へ上がり奇数なら\n右へ下がる、行が偶数なら上へ上がり奇数なら下がる。だから隣り合う面は\n折り線の上で同じ高さになり、山折りと谷折りが交互に並ぶ——本物の\nミウラ折りと同じ配置を、<strong>折れない生地の上に高さだけで<\/strong>作った。肩で\nいちばん深く（1.6 → 5.7mm）、肘へ向かって折り目がほどけて平らになる\n（1.2 → 2.4mm）。<\/p><p><strong>ジャケットの上袖の外側（180 × 200mm、肩から肘の上まで）に、ミウラ折りの 面 255 個を、1 枚ずつ傾いた平らな面として刷った。<\/strong> 面は平行四辺形 12 × 12mm、溝は 2mm。面の高さは平面で、列が偶数なら右へ上がり奇数なら 右へ下がる、行が偶数なら上へ上がり奇数なら下がる。だから隣り合う面は 折り線の上で同じ高さになり、山折りと谷折りが交互に並ぶ——本物の ミウラ折りと同じ配置を、<strong>折れない生地の上に高さだけで<\/strong>作った。肩で いちばん深く（1.6 → 5.7mm）、肘へ向かって折り目がほどけて平らになる （1.2 → 2.4mm）。<\/p>\n<p>45「折り線」が生地そのものを折らせたのに対し、こちらは折らない。 折ったときの 4 つの明るさ（右上がり・左上がり × 上向き・下向き）を面の 傾きと色で先に描いてしまう。三宅一生の 132 5. のように「折り紙で服を 作る」のではなく、「折り紙の光だけを服に載せる」。<\/p>\n<h3>仕組み<\/h3>\n<ul><li>面モード・［高さの決め方］＝高さマップ。土台 0.4mm に <code>depth_map.png<\/code> の 明るさ × 8mm を足す。面は 1 個ずつアルファで独立した島。<\/li><li>ミウラ折りの格子。横の折り線は水平の直線（12mm おき）、縦の折り線は 行ごとに ±3.6mm 振れるジグザグ（tan θ = 0.30、約 17°）。<\/li><li>面の高さ h = 1.0 + f × (3.5 × u' + 2.5 × v')。u' は面の中の横位置 （0〜1。奇数列は 1 − u）、v' は縦位置（奇数行は 1 − v）。f は肩で 1、 肘で 0.25（f = 0.25 + 0.75 (1 − t)²）。<\/li><li>色は「右上から光が当たった折り紙」を先に描く。面の傾きの向きで 4 段階、ほどけるほど差も縮む。真上から拡散光で見ても折り目が読める。<\/li><li>縁で切れた短辺 4mm 未満の破片は落とした（271 → 255 個）。<\/li><\/ul>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>傾いた平らな面と、溝の垂直な壁<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>180 / 200mm<\/td><td>上袖の外側、肩から肘の上<\/td><\/tr><tr><td>高さの決め方<\/td><td>高さマップ（強さ 8.0mm・上限）<\/td><td>面ごとの平面を 1 枚の絵で<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>平行四辺形の斜めの縁を階段にしない<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>元絵で既に面に割れている<\/td><\/tr><tr><td>色<\/td><td>画像色を単色で反映<\/td><td>4 段階の明るさを元絵に描いてある<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.045, 0.05, 0.075)<\/td><td>紺のウール<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>面の輪郭。溝はアルファ 0<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_74.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA 720 × 800、4px/mm、10KB）、<code>depth_map.png<\/code> （L 922 × 1024、50KB。面の格子と同じ大きさ）、<code>layout.json<\/code> （格子・傾き・高さの式と、面 255 個の外接と高さ）。numpy・PIL・scipy が要る。<code>field()<\/code> がマスクと高さ場を返すので、検算の道具も同じ式を借りる。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>180 × 200 → <strong>177.9 × 198.4 × 5.70mm<\/strong><\/td><td>460 × 360 の内 ✓<\/td><\/tr><tr><td>面<\/td><td><strong>255 個<\/strong>、外接 9.5〜12.8 × 6.0〜10.0mm<\/td><td>≤15mm ✓<\/td><\/tr><tr><td>高さ 肩 / 中 / 肘<\/td><td><strong>1.56〜5.70<\/strong> / 1.25〜3.57 / <strong>1.15〜2.38mm<\/strong>（設計 1.55〜5.71 / 1.25〜3.58 / 1.15〜2.38）<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>元絵との一致<\/td><td>上面の頂点 63 万点、<strong>相関 0.9993<\/strong>、差 平均 −0.003mm・最大 0.15mm<\/td><td>—<\/td><\/tr><tr><td>面の中の落差 / 傾き<\/td><td>最大 4.16mm / 23°（肩）<\/td><td>逆勾配なし<\/td><\/tr><tr><td>縦横比<\/td><td>5.7 ÷ 12 = <strong>0.48<\/strong><\/td><td>棘ではない<\/td><\/tr><tr><td>底<\/td><td>z = 0.000<\/td><td>✓<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓<\/td><\/tr><tr><td>体積 / 重さ<\/td><td>60cm³ / 約 70g（比重 1.18）<\/td><td>袖 1 本ぶん<\/td><\/tr><tr><td>頂点 / 生成<\/td><td>1,336,806（確定 922 × 1024）/ 7.8 秒（プレビュー込み）<\/td><td>—<\/td><\/tr><\/table>\n<p><strong>道具の行は 3 本。<\/strong>「実際の造形範囲 177.9 × 198.4 × 5.70mm」は正しい。 「いちばん大きい要素は 13×10mm です」は元絵の外接 12.8 × 10.0mm と <strong>一致する<\/strong>（72 では 13 × 13 のタイルに 13 × 7 と出た＝#50。斜めの溝が 無いこの作例では合っている——#50 の再現条件を狭める手がかり）。 「やや重くなる可能性があります」は解像度 × 高さの注意。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>折り紙の 4 つの明るさが、色と傾きの両方で出る（<code>preview_top.jpg<\/code> / <code>preview.jpg<\/code>）。<\/strong> 真上からは 4 段階の色が V 字に並んでミウラ折りの 写真そのもの。斜めからは傾いた面が本当に光を返すので、色を消しても 折り目が読める。<strong>色と形が同じことを言っている<\/strong>のがこの作例の要点で、 72 の「高さに沿った明暗」の考えを面の向きへ広げた。<\/li><li><strong>低い視点で「畝」になる（<code>preview_low.jpg<\/code>）。<\/strong> 隣り合う面が折り線の 上で同じ高
