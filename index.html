>89,568 / 89,568<\/td><\/tr><tr><td>生成時間<\/td><td>2.4〜2.6 秒<\/td><\/tr><\/table>\n<p>条文はすべて内側。<strong>すき間 0.836mm・肉厚 0.812mm<\/strong> とも 0.6mm を上回り、 いちばん長い管の縦横比 3.39 は 4 を下回る（管ビーズは定義上 1 本ずつが 筒なので、仮に 4 を超えても形として正しいが、今回は超えていない）。<\/p>\n<p>道具が出した行は 2 本。「実際の造形範囲 213.7 × 159.2 × 9.50mm（指定は 240.0 × 240.0mm）」は<strong>正しい<\/strong>——蛾が入っていない外周には管が 1 本も 立たないので、出来た物は指定より小さい。「最小高さの下限は 0.4mm… 明るさが 4% に届かない所に柱は立ちません」も正しく、いちばん短い管が 3.4mm なので 1 本も消えていない。<strong>警告は 0 本。<\/strong><\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上（<code>preview_top.jpg<\/code>）がいちばん強い。<\/strong> 管の口が全部見えて、 行が刺繍の列そのものに見える。縁の銅から中心の金への段も、色と長さの 両方で同時に読める。<\/li><li><strong>寄り（<code>preview_macro.jpg<\/code>）で狙いが証明される。<\/strong> 穴が開いていること、 行ごとに背が違うこと、生地の織り目が管の間から見えること—— 「ビーズを縫い付けた」以外に見えない絵になった。<\/li><li><strong>低い角度（<code>preview_low.jpg<\/code>）は合格だが被写体が小さい。<\/strong> 生地の 余白が画面の半分を占めている。次に同じ構図を撮るなら、パネルを 蛾の外接に切り詰めるか、カメラをもっと寄せる。<\/li><li><strong>蛾には見えない。<\/strong> 等距離の帯にすると外形の細部（触角・翅の切れ込み） が丸まるので、蝶か葉脈に見える。<strong>帯で描く以上これは避けられない<\/strong> ——距離変換は輪郭を平滑化する操作そのものなので、細部を残したいなら 帯ではなく輪郭そのものを 1 列だけ別の色で立てる必要がある。次に 等距離の帯をやるときの課題。<\/li><li>最初に作った版は蛾を管で<strong>塗り潰して<\/strong>いて、翅と胴が繋がって ヒトデにしか見えなかった。<strong>帯にして地を見せた<\/strong>のが決め手で、 本物のビーズ刺繍が列で置かれるのと同じ理由だった。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>イブニングドレスの前身頃の一枚置き。240 × 240mm のパネルを 1 枚、 胸から腹へ縦に置く想定。周囲 40mm 弱は管が立たないので、そのまま 縫い代に使える。管が長いので<strong>裏地を必ず当てる<\/strong>（穴に糸が引っかかる）。 洗濯は不可。約 29g はパネル 1 枚として軽いほうで、身頃に 3 枚並べても 90g 弱。<\/p>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_87.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_top.py -- &lt;この folder&gt;\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --azim 200 --elev 17 --name preview_low --sun-azim-offset 115 --sun-elev 13 --sun-energy 5.0 --world 0.10\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; --at 0.42,0.50 --span 46 --elev 26 --name preview_macro<\/pre>\n<p><code>settings.json<\/code> は作例 86 を土台にして上の表の値へ変えたもの。 <code>height_ramp<\/code> の 4 点は <code>make_sample<\/code> が復元する。folder は約 720KB。 作った版は 7.191.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/87_preview.jpg"},{"c":"真上","d":"img/87_preview_top.jpg"},{"c":"低い角度から","d":"img/87_preview_low.jpg"},{"c":"拡大","d":"img/87_preview_macro.jpg"}]},{"num":"88","title":"蜻蛉 — 硝子のセルに青銅の線","mode":"SURFACE","path":"docs/samples/88_蜻蛉_影だけが翅を描く","text":"<p class=\"lead\">蜻蛉の前翅を 340 × 340mm の一枚にした。翅室（セル）800 個は淡い青灰の\n<strong>透明材<\/strong>で天面 4.41mm、その上に青銅色の翅脈が 5.15mm、翅の外縁だけ\n5.40mm と、<strong>段差 0.74〜0.99mm<\/strong> だけ出ている。七宝（クロワゾネ）の\n「線」と同じ作りで、影ではなく<strong>色と稜線<\/strong>で紋を読ませる。<\/p><p>蜻蛉の前翅を 340 × 340mm の一枚にした。翅室（セル）800 個は淡い青灰の <strong>透明材<\/strong>で天面 4.41mm、その上に青銅色の翅脈が 5.15mm、翅の外縁だけ 5.40mm と、<strong>段差 0.74〜0.99mm<\/strong> だけ出ている。七宝（クロワゾネ）の 「線」と同じ作りで、影ではなく<strong>色と稜線<\/strong>で紋を読ませる。<\/p>\n<p><strong>1 枚の絵が高さと透明を両方決めている。<\/strong> <code>depth_map.png<\/code> を ［高さの決め方］＝高さマップ と ［透明］→［出どころ］＝画像 の両方に 渡し、「明るい＝高い＝色付き／暗い＝低い＝透明材」という 1 本の条件へ 落とした。マスクの切れ目は 0.5 なので、膜（セル）を 0.45、網を 0.86、 外縁を 1.00 に置いてある。<\/p>\n<h3>三案目である<\/h3>\n<p><strong>最初の設計は失敗した。<\/strong> 翅脈を 4.2mm 盛り上げて、低い光の影で網を 読ませるつもりだった。ところが<strong>密な網は自分の影で死ぬ<\/strong>——脈の高さ 4.2mm・仰角 14〜16° の光では影が <strong>16.8mm<\/strong> 伸びる。セルの幅は 2mm 前後 しかないので、どのセルも隣の脈の影に完全に入り、翅ぜんたいが真っ黒に 潰れた。影長 ＝ 高さ ÷ tan(仰角) という式だけで先に分かる話で、 <strong>格子状の造形を影で読ませることは原理的にできない。<\/strong><\/p>\n<p><strong>役を裏返した二案目も失敗した。<\/strong> ガラスを 5.2mm まで高くして脈を 1.4〜1.9mm の低い暗線にしたら、今度は脈がガラスの天面から 3.3〜3.8mm 下に沈み、真上からも斜めからも見えなくなった。<\/p>\n<p>どちらの極でも読めないので、<strong>段差を 1mm 弱まで詰めて脈だけを上に出した<\/strong> のがこの版。ガラスは 4.41mm あるので厚みのある硝子として見え、その上を 青銅の線が縁取る。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>340 / 340mm<\/td><\/tr><tr><td>高さの決め方<\/td><td>高さマップ（<code>depth_map.png<\/code>）<\/td><\/tr><tr><td>台の厚み（最大高さ）<\/td><td>3.6mm<\/td><\/tr><tr><td>高さの幅（強さ）<\/td><td>1.8mm<\/td><\/tr><tr><td>透明<\/td><td>入<\/td><\/tr><tr><td>［出どころ］<\/td><td><strong>画像<\/strong>（<code>depth_map.png<\/code>・反転 切）<\/td><\/tr><tr><td>［範囲］<\/td><td>上だけ（＝画像のときは使われない）<\/td><\/tr><tr><td>クリアの濁り / 色<\/td><td>0.10 / (0.78, 0.86, 0.88)<\/td><\/tr><tr><td>側面<\/td><td>単色 (0.74, 0.79, 0.80)<\/td><\/tr><tr><td>色<\/td><td>画像から（<code>source.png<\/code>）<\/td><\/tr><tr><td>輪郭の吸着 / 透明しきい値<\/td><td>入 / 0.5<\/td><\/tr><tr><td>丸み<\/td><td>0.10mm・1 段<\/td><\/tr><tr><td>解像度 プレビュー / 確定<\/td><td>768 / 2048<\/td><\/tr><tr><td>生地<\/td><td>織り・カスタム色 (0.66, 0.625, 0.565)・厚み 1.0mm<\/td><\/tr><tr><td>一方向の光で撮る<\/td><td>入<\/td><\/tr><\/table>\n<h3>元画像<\/h3>\n<p><code>veins.png<\/code> が翅脈の 2 値マスク（2400 × 2400・1bit・107KB）。 <code>tools/make_art_88.py<\/code> がそこから <code>source.png<\/code>（色）と <code>depth_map.png<\/code>（高さ＋透明のマスク）を作る。<strong>原図が無くてもこの フォルダだけで作り直せる<\/strong>ことを、<code>88_wip/<\/code> を退避して md5 が一致する ことで確かめてある。<\/p>\n<p>作りで決めたことが 3 つ。<\/p>\n<ul><li><strong>元絵はメッシュより細かくしてから使う。<\/strong> 原図は 1254px ＝ 3.83px/mm で、確定の格子（2048 ÷ 340mm ＝ 6.02/mm）より粗い。粗いまま渡すと 段の境目が元絵の画素どおりの階段になる。2400px ＝ 7.06/mm へ LANCZOS で伸ばしてから 2 値に戻している。<\/li><li><strong>脈は片側 0.52mm 太らせる。<\/strong> 原図の細い脈は半幅 0.54mm しかなく、 条文の「最小 XY 0.6mm」を下回る。<\/li><li><strong>0.8mm を切る透明のセルは脈へ吸収する<\/strong>（155 個 / 955 個）。条文の 下限 0.6mm ちょうどでは刷る側に余裕が無い。<\/li><\/ul>\n<p><strong>太さの階層は作っていない。<\/strong> 距離場で脈を 3 段に分けてみたが、 93.6% が同じ段に落ちた——<strong>元絵にその階層が無い<\/strong>。実在する階層は 「翅の外縁は太く硬い」のほうなので、内側の網は一様にして外縁の帯 （2.7mm）だけを 1 段上げてある。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>327.7 × 295.6 × 5.40mm（指定は 340 × 340）<\/td><\/tr><tr><td>翅の面積<\/td><td>パネルの 36.4%<\/td><\/tr><tr><td>天面の高さ<\/td><td>ガラス 4.412 / 網 5.146 / 外縁 5.400mm（<strong>3 値ちょうど<\/strong>）<\/td><\/tr><tr><td>段差<\/td><td>0.734mm（網）/ 0.988mm（外縁）<\/td><\/tr><tr><td>セル<\/td><td>800 個 / 内接直径 最小 0.80・中央値 4.43・最大 13.67mm<\/td><\/tr><tr><td>脈の幅<\/td><td>最小 0.80・中央値 1.65・最大 6.52mm<\/td><\/tr><tr><td>材の配分<\/td><td>色付き 41.2% / 透明材 58.8%（翅の中で）<\/td><\/tr><tr><td>段の壁<\/td><td>141,073 面 / 15,013mm² / 傾き 72.3〜77.3°<\/td><\/tr><tr><td>オーバーハング<\/td><td><strong>0 面 / 0.0mm²<\/strong>（アドオンの検査・v7.191.0）<\/td><\/tr><tr><td>底の高さ<\/td><td>0.0000<\/td><\/tr><tr><td>境界の辺 / 接触の辺<\/td><td>0 / 0（閉じている）<\/td><\/tr><tr><td>体積<\/td><td>199.1cm³（約 235g の概算）<\/td><\/tr><tr><td>頂点数 / 生成時間<\/td><td>3,497,940 / 63.7 秒（確定 2048）<\/td><\/tr><tr><td>設定の当て込み<\/td><td>適用 354 件 / 非適用 0 件<\/td><\/tr><\/table>\n<p>道具が出した警告は 2 本。「1 つの要素が 328 × 296mm あり、布のようには 曲がりません」は<strong>そのとおり<\/strong>で、下の「服として」に書いた判断。 「重くなる可能性があります」も正しく、実際 350 万頂点ある。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上が一番強い。<\/strong> 硝子と青銅で描いた翅として読め、左上の縁紋まで 出ている。斜めからの絵でも網と外縁の帯が立ち、麻地に柔らかい影が落ちる。<\/li><li><strong>透明材の使い方としては、これまでで一番はっきりしている。<\/strong> 「透明にする所を高さで決める」のではなく <strong>1 枚の絵で場所を指した<\/strong>ので、 硝子と金属が平面の中で入り組む。高さでは作れない絵。<\/li><li><strong>寄ると粗い。<\/strong> 段の境目の壁は 141,073 枚の 72〜77° の斜面で、 境目が格子に対して斜めに走る所では階段が櫛の歯に見える。元絵を 2400px へ上げても形は変わらなかったので、これは<strong>高さマップの段を 面モードが壁として組む時の性質<\/strong>で、作例の側では直せない （→ 欲しい機能 #65）。1m 離れれば消えるが、手に取ると分かる。<\/li><li><strong>重い。<\/strong> 199cm³ ＝ 約 235g。台の厚み 3.6mm がほぼ全部で、これを 1.2mm まで落とせば約 115g になる（段差は変わらない）。ただし硝子の 厚みが 4.4mm あることが「膜」ではなく「硝子」に見せているので、 身に着ける前提なら軽さと引き換えになる。<\/li><li><strong>高さは出していない。<\/strong> 本部からの「もっと高さも出した作品を」への 答えとしては、この作例は<strong>モチーフの側で応えていて高さでは応えて いない<\/strong>。5.4mm は 340mm の板に対して薄い。影で読ませようとした一案目が 高さの答えだったが、それは上に書いた理由で成立しなかった—— <strong>格子状のモチーフでは高さと可読性が正面からぶつかる。<\/strong> 高さで応える なら、網ではなく「まばらに立つモチーフ」を選ぶべきで、それは別の作例。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>曲がらない。<\/strong> 328 × 296mm の一枚板で、分割していない。これは 妥協ではなく判断で、<strong>蜻蛉の翅そのものが曲がらない構造物<\/strong>だから。 背中心に 1 枚だけ載せる装身具的な使い方（ビスチェの背板、ケープの ヨーク）を想定していて、身体の丸みは翅の外側の生地で受ける。 量産や着心地を取るなら［面を分割する］で切るが、そうすると翅脈が 分断されて紋が壊れるので、この作例では選ばなかった。<\/p>\n<p>生地は淡い麻。翅の裏に接着芯を貼ってから刷る想定。洗濯は不可。<\/p>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_88.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_top.py -- &lt;この folder&gt;\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --azim 210 --elev 26 --name preview_low --sun-azim-offset 120 --sun-elev 20 --sun-energy 3.2 --world 0.14\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; --at 0.42,0.52 --span 55 --elev 24 --name preview_macro<\/pre>\n<p><code>settings.json<\/code> は作例 79「零れ」を土台にした。folder は約 913KB。 作った版は <strong>7.191.0<\/strong>（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/88_preview.jpg"},{"c":"真上","d":"img/88_preview_top.jpg"},{"c":"低い角度から","d":"img/88_preview_low.jpg"},{"c":"拡大","d":"img/88_preview_macro.jpg"}]},{"num":"89","title":"白化 — 枝先から硝子になる珊瑚","mode":"SURFACE","path":"docs/samples/89_白化_枝先から硝子になる珊瑚","text":"<p class=\"lead\">指状（digitate）の珊瑚の群体を 309 個、320 × 240mm の盤面に散らした。\n根元は生きた珊瑚の濃い朱で、枝先へ向かって白く抜ける。**8.5mm より上は\n透明材**なので、白化した先端がそのまま硝子になる。<\/p><p>指状（digitate）の珊瑚の群体を 309 個、320 × 240mm の盤面に散らした。 根元は生きた珊瑚の濃い朱で、枝先へ向かって白く抜ける。<strong>8.5mm より上は 透明材<\/strong>なので、白化した先端がそのまま硝子になる。<\/p>\n<p><strong>白化は一様ではない。<\/strong> 枝先の高さは 5.16〜11.49mm に散っていて、 境目を越えるのは <strong>309 個のうち 227 個（73%）<\/strong>。低い群体は朱のまま残り、 高い群体ほど深く硝子へ入る——<strong>海面に近い側から白くなる<\/strong>という現象 そのものを、高さで指している。<\/p>\n<p>群体の足元には、指の集まりをそのまま太らせた<strong>透けた裾<\/strong>が広がる。 これは意図した形ではなく、後述のとおり配色表の副作用として出たものだが、 <strong>結果として作品の主役になっている。<\/strong><\/p>\n<h3>これは一案目である（版を七つ重ねて、ここへ戻した）<\/h3>\n<p>この作例には版が七つある。<strong>いま置いてあるのは一案目<\/strong>で、二案目以降の 作り直しは<strong>すべて取り消した<\/strong>。<\/p>\n<p>理由は 2026-09-06 の利用者の判断。七案目の拡大写真を見た利用者から 「この時のデザインが素晴らしいと思っていたのですが、これは何か不具合が あったのですか？」と一案目の絵を示され、<strong>測り直したところ「不具合」は ほとんど無かった。<\/strong><\/p>\n<table><tr><th>私が「欠陥」と呼んだもの<\/th><th>実際は<\/th><\/tr><tr><td>台座が蝋だまりのように盛り上がる<\/td><td><strong>条文には反していない。<\/strong>私の意図（0.25mm）と出力（2.3mm）のズレ<\/td><\/tr><tr><td>群体が格子の上に並んでいる<\/td><td>条文と無関係。<strong>私の美的判断<\/strong><\/td><\/tr><tr><td>針のように細い破片が 5 本<\/td><td>条文は通る。設計寸法から見た削れ残り<\/td><\/tr><tr><td>断面が 0.6mm を割っている<\/td><td><strong>これだけが本物<\/strong>。ただし作り直しても直っていない（下記）<\/td><\/tr><\/table>\n<p>四つの版すべてを<strong>同じ道具・同じ画素密度（6.4px/mm）<\/strong>で測り直したら、 細さは <strong>どの版も同じ<\/strong>だった。<\/p>\n<table><tr><th>版<\/th><th>0.6mm 未満の断面積<\/th><th>いちばん細い所<\/th><\/tr><tr><td>一案目（この版）<\/td><td>0.146%<\/td><td>0.16mm<\/td><\/tr><tr><td>三案目<\/td><td>0.11〜0.16%<\/td><td>0.16mm<\/td><\/tr><tr><td>五案目<\/td><td>0.11〜0.16%<\/td><td>0.16mm<\/td><\/tr><tr><td>七案目<\/td><td>0.11〜0.16%<\/td><td>0.16mm<\/td><\/tr><\/table>\n<p><strong>作り直しは、測れる改善を 1 つも生まなかった。<\/strong> 当初「一案目は 14.3%・ 最細 0.31mm」と書いていた数字は、<strong>別の道具が別の高さ場を組んで出した値<\/strong> で、他の版と比較できるものではなかった。<\/p>\n<p>一方、<strong>失ったものははっきりしている<\/strong>——8.5mm を越えて硝子になる群体が <strong>73% → 36%<\/strong> に減り、作品ぜんたいの硝子らしさが半分になった。<\/p>\n<p>整えた版そのものは捨てていない。<strong>作例 90 に、同じデザインの別版として 残してある。<\/strong><\/p>\n<p><strong>ただし「パラメーター違い」ではない。<\/strong>両者の <code>settings.json<\/code> を 361 項目 すべて突き合わせたら <strong>差分 0 件<\/strong>——アドオン側の設定は 1 つも違わない。 違うのは <code>source.png<\/code> を組む生成器だけで、上の表の違いは<strong>すべて元画像から 出ている<\/strong>。面モードのレリーフは明るさを高さとして読むので、<strong>元画像を 替えることは、形と高さと色を同時に替えること<\/strong>になる。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>320 / 240mm<\/td><\/tr><tr><td>高さの決め方<\/td><td>レリーフ（明るさ＝高さ）<\/td><\/tr><tr><td>最大高さ<\/td><td>12.0mm<\/td><\/tr><tr><td>段数<\/td><td>0（連続）<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><\/tr><tr><td>透明<\/td><td>入<\/td><\/tr><tr><td>［出どころ］<\/td><td>高さ<\/td><\/tr><tr><td>［範囲］<\/td><td>上だけ<\/td><\/tr><tr><td>［方式］<\/td><td>厚み(mm)<\/td><\/tr><tr><td>［色付き部分］<\/td><td><strong>8.5mm<\/strong>（＝白化の線）<\/td><\/tr><tr><td>クリアの濁り / 色<\/td><td>0.30 / (0.93, 0.955, 0.96)<\/td><\/tr><tr><td>色<\/td><td>画像から（<code>source.png<\/code>）<\/td><\/tr><tr><td>ファブリック底面<\/td><td>適用<\/td><\/tr><tr><td>解像度 プレビュー / 確定<\/td><td>768 / 2048<\/td><\/tr><\/table>\n<h3>元画像<\/h3>\n<p><code>tools/make_art_89.py<\/code> が式で組む。<strong>絵から切り出さない<\/strong>——切り出すと 枝の太さが絵の都合で決まってしまう。<code>SEED = 8901<\/code> で固定してあるので、 走らせれば同じ <code>source.png<\/code> が出る。<\/p>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>source.png<\/td><td>1536 × 1152（<strong>4.8px/mm<\/strong>）・不透明 25.6%・252KB<\/td><\/tr><tr><td>置いた群体<\/td><td><strong>309 個<\/strong><\/td><\/tr><tr><td>群体の辺の長さ<\/td><td>最小 4.0・中央 9.6・最大 <strong>14.2mm<\/strong>（上限 15mm）<\/td><\/tr><tr><td>枝先の高さ（最大高さ 12mm 換算）<\/td><td>最小 5.16・中央 <strong>9.41<\/strong>・最大 11.49mm<\/td><\/tr><tr><td>7.5mm を越える群体<\/td><td>264 個（85%）<\/td><\/tr><tr><td>8.0mm を越える群体<\/td><td>258 個（83%）<\/td><\/tr><tr><td><strong>8.5mm を越える群体<\/strong><\/td><td><strong>227 個（73%）<\/strong><\/td><\/tr><tr><td>9.0mm を越える群体<\/td><td>187 個（61%）<\/td><\/tr><\/table>\n<p><strong>元画像は確定の格子（6.4px/mm）より粗い 4.8px/mm。<\/strong> これは欠点では なく、この版の見た目の一部になっている——輪郭が格子に乗り切らないので、 群体の側面に<strong>縦の筋<\/strong>が立つ。拡大写真で見える珊瑚の肌の粗さがそれ。<\/p>\n<p><strong>配色表が、そのまま高さの符号器になっている。<\/strong> 面モードのレリーフは 画像の明るさを高さとして読むので、色を決める表が同時に高さを決める。 この版のいちばん暗い色は輝度 0.193 あり、<strong>0.25mm のつもりで置いた台座が 2.3mm の板として立ち上がっている<\/strong>——群体の足元に広がる透けた裾はこれ。 道具の説明のどこにも書かれていない性質で、<code>欲しい機能_20260904.md<\/code> に 報告した。<\/p>\n<h3>数字（生成）<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>317.7 × 236.6 × <strong>11.49mm<\/strong>（指定は 320 × 240）<\/td><\/tr><tr><td>頂点数 / 生成時間<\/td><td>8,683,190 / 28.0 秒（確定 2048）<\/td><\/tr><tr><td>設定の当て込み<\/td><td>適用 354 件 / 非適用 0 件<\/td><\/tr><tr><td>いちばん大きい要素<\/td><td><strong>14 × 13mm<\/strong>（上限 15.0mm）<\/td><\/tr><tr><td>クリア材（面ドメインで実測）<\/td><td>308,684 面 / 全 7,554,038 面・<strong>z 8.142 〜 11.495mm<\/strong><\/td><\/tr><tr><td>色付き材<\/td><td>7,245,354 面・z 0.000 〜 8.142mm<\/td><\/tr><\/table>\n<p><strong>道具が出した警告は 1 本だけ<\/strong>（「重くなる可能性があります」）。 15mm の上限は通っているので、<strong>分割せずに済んでいる。<\/strong><\/p>\n<p><strong>クリアの境目は 8.5mm ではなく 8.142mm に落ちた。<\/strong> 材の割り当ては面の 中心の z で決まるので、頼んだ高さに頂点の輪が無ければいちばん近い輪へ 吸着する（本体の v7.200.0 が SVG 断面について直したのと同じ性質）。 0.36mm 低い。整えた版（作例 90）では同じ設定で 8.428mm に落ちていて、 <strong>群体の形が変わると、境目の落ちる先も変わる。<\/strong><\/p>\n<h3>見る角度で、評価が変わった<\/h3>\n<table><tr><th>絵<\/th><th>何が読めるか<\/th><\/tr><tr><td><code>preview.jpg<\/code>（斜め 20°）<\/td><td>群れの密度と、白化した群体の散らばり<\/td><\/tr><tr><td><code>preview_top.jpg<\/code>（真上）<\/td><td>一つ一つが<strong>指の集まり<\/strong>であること。散らし方<\/td><\/tr><tr><td><code>preview_low.jpg<\/code>（方位 250°・仰角 12°）<\/td><td>高さの揃わなさ。上端が波打っている<\/td><\/tr><tr><td><code>preview_macro.jpg<\/code>（26mm 幅・確定 2048）<\/td><td>硝子の帽子、透けた裾、側面の縦の筋<\/td><\/tr><\/table>\n<p><strong>真上からは硝子が読めない。<\/strong> クリア材は上から見ると背景が透けて見える だけで、白化の物語は斜めか低い角度でしか出ない。逆に、<strong>指の集まりで できていることは真上でしか読めない。<\/strong> 片方だけでは足りない。<\/p>\n<h3>残っている欠陥<\/h3>\n<p>1. <strong>断面の 0.146% が 0.6mm を割っている<\/strong>（いちばん細い所 0.16mm）。 指の付け根どうしの谷で、上へ 0.5mm 以上伸びている所がある。 条文（最小 XY 0.6mm）に反する。<strong>四つの版すべてが同じ値<\/strong>なので、 これはこの版に固有の欠陥ではなく、この題材の作り方そのものの性質。<\/p>\n<p><strong>道具が黙るのは、検査が無いからではない<\/strong>（本部の指摘 2026-09-06）。 <code>__init__.py:26541<\/code> に下限 0.6mm の検査は実在する（v7.118.48）。 足りないのは2つで、<strong>足跡でしか測っていない<\/strong>ことと、<strong>わざと粗い 格子で測っている<\/strong>こと。後者は v7.181.0 が利用者の判断待ちとして 明記した保留。詳しくは <code>欲しい機能_20260904.md<\/code> の #67。<\/p>\n<p>上の値は外側の道具で測ったもの。<code>source.png<\/code> を 2048×1536 へ LANCZOS で拡大してから高さ場を組み、0.25mm 刻みの水平断面ごとに 連結成分の最大内接幅を距離変換で出した——<strong>本体が実際に組む格子 そのものではない<\/strong>ので、桁の目安として読むこと。しかもこの走査は <strong>刻みを細かくするほど該当数が増え続けて収束しない<\/strong>（調査室の 実測）ので、絶対値としては当てにならない。<strong>版どうしを同じ画素 密度で比べる用途にだけ使うこと。<\/strong> 2. <strong>クリアの境目が階段状になる。<\/strong> 上に書いた輪への吸着が群体ごとに 別の高さで起きるので、朱と硝子の境目が<strong>鋸の刃<\/strong>になる。拡大写真で 読める。作例 90 にも同じものが出ているので、これは設計ではなく 道具の性質。<\/p>\n<p><strong>ずれの大きさは版で違う——89 は 0.36mm、90 は 0.07mm。<\/strong> 5倍ある。 90 の数字だけを見ると「設計に影響しない」と読めるが、<strong>89 のほうが 実態<\/strong>（本部の指摘 2026-09-06）。<\/p>\n<p>当ては本体 v7.200.0 とは別物になる。あちらは原型が持っている輪を 頼まれた高さへ動かす／足すで済んだが、<strong>面のレリーフは頂点の高さを 画像が決めているので、動かせる輪という概念が無い<\/strong>。要るのは v7.183.0 の分割書き出しと同じ「その高さで実際に切る」ほうで、 最終解像度では 200万面が対象になる。 3. <strong>裾に斑点のざらつきがある。<\/strong> <code>source.png<\/code> がパレット画像で、 ディザの粒がそのまま高さのノイズになっている。1 画素 = 0.21mm なので 造形では潰れるが、レンダーでは見える。<\/p>\n<h3>自分の評価<\/h3>\n<p><strong>この作例のいちばん良い所は、意図していなかった裾である。<\/strong> 2.3mm の透けた板が群体の足元に広がることで、珊瑚が<strong>水に浸かっている<\/strong> ように見える。指だけを立てた整えた版（作例 90）はこれを失っていて、 盤の上に置いた飾りに見える。<\/p>\n<p><strong>73% が硝子になるのも、多すぎるくらいで正しい。<\/strong> 白化とは大量死の ことなので、「ほとんどが白い中に、まだ朱が残っている」ほうが題に合う。 36% は「少し白くなり始めた海」で、それは別の話になっている。<\/p>\n<p>弱いのは<strong>散らし方<\/strong>で、平らな距離のダーツなので群れの密度がどこも同じ。 本物の珊瑚礁は塊と空白がはっきり分かれる。ただしこれは服の柄としては むしろ扱いやすい側なので、直すかどうかは用途次第。<\/p>\n<h3>服として<\/h3>\n<p>丈の短いボレロか、ドレスの肩から胸にかけての当て布。<strong>朱の面積が広いので 全身に使うと強すぎる<\/strong>——白化した群体だけを疎らに散らした版を別に作って、 裾へ向かってこちらへ濃くしていく使い方が合う。<\/p>\n<p>透明材の帽子は照明の下で光を拾うので、<strong>ショーの動く光には向く。<\/strong> 静止した展示では、後ろから光を当てないと硝子だと分からない。<\/p>\n<h3>作り方<\/h3>\n<p><code>BF_ADDON_PATH<\/code> は <strong><code>_samples_wt<\/code>（<code>/fabric_3d_texture<\/code> を足さない）<\/strong>。 作った版は <strong>7.202.0<\/strong>（<code>_samples_wt<\/code>）。<\/p>\n<pre>python docs/samples/tools/make_art_89.py\n\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final --render\nblender --background --factory-startup --python docs/samples/tools/render_top.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; \\\n    --azim 250 --elev 12 --name preview_low --final\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; \\\n    --at 0.55,0.45 --span 26 --name preview_macro --final<\/pre>\n<p><strong>拡大写真は <code>--final<\/code> を付けて撮ること。<\/strong> プレビューの 768（2.4px/mm） では 1 画素が 0.42mm あり、指の間の谷がそもそもメッシュに存在しない。<\/p>","imgs":[{"c":"斜め","d":"img/89_preview.jpg"},{"c":"真上","d":"img/89_preview_top.jpg"},{"c":"低い角度から","d":"img/89_preview_low.jpg"},{"c":"拡大","d":"img/89_preview_macro.jpg"}]},{"num":"90","title":"白化（整えた版）— 枝先から硝子になる珊瑚","mode":"SURFACE","path":"docs/samples/90_白化_枝先から硝子になる珊瑚_整えた版","text":"<p class=\"lead\"><strong>作例 89 と同じデザインの別版です。<\/strong>元の意図は 89 と同じ\n「枝先から硝子になる珊瑚」で、こちらは群体の形を式で組み直し、\n散らし方を骨格に沿わせ、配色から高さへの回り込みを断った版。\n<strong>利用者が良いと判断したのは 89 のほう<\/strong>で、こちらは「整えると\nどうなるか」を並べて見るために残してあります。<\/p><p><strong>作例 89 と同じデザインの別版です。<\/strong>元の意図は 89 と同じ 「枝先から硝子になる珊瑚」で、こちらは群体の形を式で組み直し、 散らし方を骨格に沿わせ、配色から高さへの回り込みを断った版。 <strong>利用者が良いと判断したのは 89 のほう<\/strong>で、こちらは「整えると どうなるか」を並べて見るために残してあります。<\/p>\n<p><strong>アドオン側の設定は 89 と 1 つも違わない。<\/strong>両者の <code>settings.json<\/code> を 361 項目すべて突き合わせて <strong>差分 0 件<\/strong>。違うのは <code>source.png<\/code> を組む 生成器（<code>make_art_89.py<\/code> / <code>make_art_90.py<\/code>）だけで、下の表の違いは <strong>すべて元画像から出ている<\/strong>。面モードのレリーフは明るさを高さとして 読むので、元画像を替えることは形と高さと色を同時に替えることになる。<\/p>\n<table><tr><th><\/th><th>89（一案目）<\/th><th>90（この版）<\/th><\/tr><tr><td>群体の作り方<\/td><td>絵を切り抜いた輪郭。多裂して岩のよう<\/td><td>立てた円柱＋縁の丸め＋浅い蒲鉾<\/td><\/tr><tr><td>散らし方<\/td><td>平らな距離のダーツ<\/td><td>骨格に沿った可変の最小距離<\/td><\/tr><tr><td>台座<\/td><td>配色の最暗色が明度 0.193 → <strong>2.3mm 立ち上がる<\/strong><\/td><td>明度 0.034 → 0.41mm。ほぼ床<\/td><\/tr><tr><td>8.5mm を越える群体<\/td><td><strong>227/309（73%）<\/strong><\/td><td>134/377（36%）<\/td><\/tr><tr><td>見え方<\/td><td>硝子の林。裾が広く透ける<\/td><td>朱の粒に灰色の帽子<\/td><\/tr><\/table>\n<p>指状（digitate）の珊瑚の群体を 377 個、320 × 240mm の盤面に散らした。 根元は生きた珊瑚の濃い朱で、枝先へ向かって白く抜ける。<strong>8.5mm より上は 透明材<\/strong>なので、白化した先端がそのまま硝子になる。<\/p>\n<p><strong>白化は一様ではない。<\/strong> 枝先の高さは 4.62〜11.90mm に散っていて、 境目を越えるのは <strong>377 個のうち 134 個（36%）<\/strong>。低い群体は朱のまま残り、 高い群体ほど深く硝子へ入る——<strong>海面に近い側から白くなる<\/strong>という現象 そのものを、高さで指している。<\/p>\n<h3>版を七つ重ねた<\/h3>\n<p><strong>一案目は Codex に描かせた珊瑚の絵を切り抜いて使った<\/strong>（＝作例 89）。 そのやり方では枝の太さが絵の都合で決まるので、細すぎる断面が出ると 考えて式へ組み直した。<\/p>\n<p><strong>その判断は、あとで測り直したら外れていた。<\/strong>四案の元画像を<strong>同じ 6.4 px/mm・同じ測り方<\/strong>で並べると、細さはどれも変わらない。<\/p>\n<table><tr><th>版<\/th><th>8.5mm 越え<\/th><th>危ない段<\/th><th>薄い断面の面積比<\/th><th>最細<\/th><\/tr><tr><td>一案目（＝89）<\/td><td>227/309（73%）<\/td><td>37/45<\/td><td>0.146%<\/td><td><strong>0.16mm<\/strong><\/td><\/tr><tr><td>三案目<\/td><td>96/256（38%）<\/td><td>34/45<\/td><td>0.110%<\/td><td><strong>0.16mm<\/strong><\/td><\/tr><tr><td>五案目<\/td><td>87/256（34%）<\/td><td>41/47<\/td><td>0.161%<\/td><td><strong>0.16mm<\/strong><\/td><\/tr><tr><td>七案目（＝この版）<\/td><td>134/377（36%）<\/td><td>33/47<\/td><td>0.134%<\/td><td><strong>0.16mm<\/strong><\/td><\/tr><\/table>\n<p><strong>最細は四案とも 0.16mm<\/strong>で、薄い断面の面積比も 0.11〜0.16% の帯に 全部入る。つまり<strong>組み直しは造形条件を 1 つも改善していない。<\/strong> 最初に「14.3%・最細 0.31mm」と書いたのは、別の道具が別の高さ場を 組んで測った数字で、四案の比較には使えないものだった。 道具が何も言わないことだけは変わらない（→ 欲しい機能 #67）。<\/p>\n<p><strong>二案目・三案目は枝を寝かせた。<\/strong> 式で組み直して太さを mm で持たせた が、放射状に伸びる枝として組んだので<strong>花か歯車に見えた<\/strong>。天面にドームを 足し、枝を細め、台座をならしても直らず、数字はむしろ悪化した （危ない断面 3〜6/39 段）。<\/p>\n<p><strong>四案目で、前提のほうが間違っていたと分かった。<\/strong> 真上から見た群体に 写るのは枝の *断面* で、放射状の花弁ではない。<strong>枝は寝かせず、立てる。<\/strong> 1本の指を「円柱＋縁だけ半径 0.42mm の丸め＋深さ 0.26mm の浅い蒲鉾の天面」 にすると、断面の幅はどの高さでも 2(r − 0.42) を下回らない。指の半径の 下限を 1.10mm に取ってあるので <strong>1.36mm &gt; 0.6mm が構造的に保証される<\/strong> ——測るまでもなく満たす。<\/p>\n<p><strong>五案目で台座の蝋だまりを直し、六案目で格子を潰し、七案目で針を落とした。<\/strong> 下の「欠陥」の 3 節がその中身。<\/p>\n<h3>自分のものさしを、二度直した<\/h3>\n<p><strong>1. 断面の細さには「頭の門」が要る。<\/strong> 幅 &lt; 0.6mm だけで数えると、 丸めた天面はどれも頂点で細くなるので<strong>球でも落ちる<\/strong>。危ないのは 「細いまま高く立っている」ほうだけなので、（その成分の最大高さ − z）&gt; 0.5mm を条件に足した。<\/p>\n<p><strong>2. 輪郭の細さを画素ごとの EDT で測ったのは誤り。<\/strong> 太い指が2本隣り 合うと、その谷（凹んだ角）で 2·EDT − 1 は必ず 0 へ落ちる。「細い橋」と 「太い指の間のくびれ」が区別できず、<strong>54.2% という嘘の数字<\/strong>を出した。 正しいのはモルフォロジーの開き——半径 0.3mm の円で開いて、届かなかった 面積の割合。同じ絵で <strong>6.42%<\/strong>。<\/p>\n<table><tr><th><\/th><th>危ない断面<\/th><th>0.6mm の円が通らない面積<\/th><\/tr><tr><td>一案目の元データ<\/td><td>36/45 段・<strong>14.258%<\/strong>・最細 <strong>0.31mm<\/strong><\/td><td><strong>6.42%<\/strong><\/td><\/tr><tr><td>この版<\/td><td><strong>0/39 段・0.000%<\/strong>・最細 0.72mm<\/td><td>0.00〜0.11%<\/td><\/tr><tr><td>参考 21 現物_青いモザイクタイル<\/td><td>0/7・0.000%<\/td><td>0.00%<\/td><\/tr><\/table>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>320 / 240mm<\/td><\/tr><tr><td>高さの決め方<\/td><td>レリーフ（明るさ＝高さ）<\/td><\/tr><tr><td>最大高さ<\/td><td>12.0mm<\/td><\/tr><tr><td>段数<\/td><td>0（連続）<\/td><\/tr><tr><td>透明<\/td><td>入<\/td><\/tr><tr><td>［出どころ］<\/td><td>高さ<\/td><\/tr><tr><td>［範囲］<\/td><td>上だけ<\/td><\/tr><tr><td>［方式］<\/td><td>厚み(mm)<\/td><\/tr><tr><td>［色付き部分］<\/td><td><strong>8.5mm<\/strong>（＝白化の線）<\/td><\/tr><tr><td>クリアの濁り / 色<\/td><td>0.30 / (0.93, 0.955, 0.96)<\/td><\/tr><tr><td>色<\/td><td>画像から（<code>source.png<\/code>）<\/td><\/tr><tr><td>解像度 プレビュー / 確定<\/td><td>768 / 2048<\/td><\/tr><\/table>\n<h3>元画像<\/h3>\n<p><code>tools/make_art_89.py<\/code> が式で組む。<strong>絵から切り出さない<\/strong>——上に書いた 理由で、切り出すと枝の太さが絵の都合で決まる。<code>SEED = 8901<\/code> で固定して あるので、走らせれば同じ <code>source.png<\/code> が出る。<\/p>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>source.png<\/td><td>2048 × 1536（<strong>6.4px/mm ＝ 確定の格子と同じ<\/strong>）・不透明 15.1%・231KB<\/td><\/tr><tr><td>骨格 / 親点<\/td><td>7,429 画素 / <strong>83 個<\/strong><\/td><\/tr><tr><td>置いた群体<\/td><td>382 個 → 破片 5 個を落として <strong>377 個<\/strong>・すべて 1 つの島（8近傍）<\/td><\/tr><tr><td>群体の外接（長辺）<\/td><td>最小 4.2・中央 6.4・最大 <strong>12.7mm<\/strong>（上限 15mm）<\/td><\/tr><tr><td>枝先の高さ<\/td><td>最小 4.62・中央 <strong>7.96<\/strong>・最大 11.90mm<\/td><\/tr><tr><td>8.5mm を越える群体<\/td><td><strong>134 個（36%）<\/strong><\/td><\/tr><tr><td>島の縦横比（高さ ÷ 短辺）<\/td><td>中央 1.44・最大 <strong>2.57<\/strong><\/td><\/tr><\/table>\n<p>台座は指の集まりをそのまま EDT で太らせた形にして、<strong>円盤にしていない<\/strong> ——円で作ると座金にしか見えない。はみ出し幅を先に決めてから指を置く範囲 を引いているので、<strong>15mm の上限を後から越えることがない<\/strong>。<\/p>\n<h3>数字（生成）<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>317.0 × 235.0 × <strong>11.90mm<\/strong>（指定は 320 × 240）<\/td><\/tr><tr><td>頂点数 / 生成時間<\/td><td>5,934,287 / 17.6 秒（確定 2048）<\/td><\/tr><tr><td>設定の当て込み<\/td><td>適用 354 件 / 非適用 0 件<\/td><\/tr><tr><td>クリア材（面ドメインで実測）<\/td><td>41,790 面 / 全 5,104,595 面・<strong>z 8.428 〜 11.899mm<\/strong><\/td><\/tr><\/table>\n<p><strong>道具が出した警告は 1 本だけ<\/strong>（「重くなる可能性があります」）。一案目 では出ていた「1 つの要素が 24×12mm あり、布のようには曲がりません」は <strong>消えた<\/strong>——群体を 15mm 以下に収めた結果で、これが分割せずに済んでいる 根拠。情報の行は「いちばん大きい要素は 12×13mm です（上限 15.0mm）」。<\/p>\n<p><strong>クリアの境目は 8.5mm ではなく 8.428mm に落ちた。<\/strong> 材の割り当ては面の 中心の z で決まるので、頼んだ高さに輪が無ければいちばん近い輪へ吸着する （本体の v7.200.0 が SVG 断面について直したのと同じ性質）。差は 0.07mm で 設計には影響しないが、<strong>8.5 と書いて 8.428 が出ることは記録しておく。<\/strong><\/p>\n<h3>見る角度で、評価が変わった<\/h3>\n<p>4 枚撮った。<strong>斜めの 1 枚だけを見ていたときは、欠陥を 1 つも見つけられ なかった。<\/strong><\/p>\n<table><tr><th>絵<\/th><th>何が読めるか<\/th><\/tr><tr><td><code>preview.jpg<\/code>（斜め 20°）<\/td><td>全体の色と高さ。<strong>欠陥が 1 つも出ない<\/strong><\/td><\/tr><tr><td><code>preview_top.jpg<\/code>（真上）<\/td><td>指の断面が集まって群体に見えること・疎密<\/td><\/tr><tr><td><code>preview_low.jpg<\/code>（低い角度 22°）<\/td><td><strong>並び方<\/strong>。格子はここでしか見えない<\/td><\/tr><tr><td><code>preview_macro.jpg<\/code>（確定解像度・幅 45mm）<\/td><td>天面の形・台座の縁・<strong>硝子の先端<\/strong><\/td><\/tr><\/table>\n<p><strong>いまいちばん強いのはマクロ。<\/strong> 朱の指に灰色の硝子の帽子が乗っている のがはっきり読め、白化の主題がそのまま絵になっている。これは服を着た人を 50cm から見たときの見え方にいちばん近い距離でもある。<\/p>\n<h3>以下の三つは「欠陥」ではなかった<\/h3>\n<p>当初この三つを「欠陥」と書いていたが、<strong>どれも造形の条文には反していない<\/strong> ——私の意図と出力のズレ、および私の美的判断である。2026-09-06 に利用者から 「この時のデザインが素晴らしいと思っていたのですが、これは何か不具合が あったのですか？」と問われ、分類し直した。<strong>とくに 1 の「蝋だまり」は、 利用者が良いと評価した見た目そのもの<\/strong>で、それを消したのがこの版である。 一案目は作例 89 に戻してある。<\/p>\n<h3>変えた 1（条文違反ではない）— 台座の蝋だまりを消した<\/h3>\n<p>五案目まで、指の根元が<strong>溶けた蝋のたまり<\/strong>のように盛り上がっていた。 最初は「アルファがなだらかで柵になっている」「クリア材が台座に掛かって いる」「生地の底面と z が競合している」と 3 つ推測し、<strong>測ったら 3 つとも 外れだった。<\/strong><\/p>\n<p>本当の原因は<strong>配色表の暗い側が黒でなかった<\/strong>こと。面モードのレリーフは <strong>画像の明るさをそのまま高さとして読む<\/strong>ので、色の表がそのまま高さの 符号器になっている。いちばん暗い色の輝度が 0.193 あったため、<strong>0.25mm の つもりで置いた台座が 2.3mm の板<\/strong>として立ち上がっていた。配色表の各段を mean(RGB) == t になるように引き伸ばして直した。<\/p>\n<p><strong>色を決める表が、同時に高さを決めている。<\/strong> レリーフを使う作例では、 配色を変えるたびに高さが変わる。これは道具の説明のどこにも書かれていない （→ 欲しい機能へ報告予定）。<\/p>\n<h3>変えた 2（条文違反ではない）— 群体が格子の上に並んでいた<\/h3>\n<p>低い角度から見ると、<strong>群体が斜めの列に並んでいるのがはっきり読めた<\/strong>。 珊瑚礁ではなく、スタッズを打ったマットに見える。<\/p>\n<p>最初はマスに 1 個ずつ置く格子配置だったので、これを<strong>一定の最小距離 34mm のダーツ投げ<\/strong>に替えた。それでも列は消えなかった。理由を測って 分かったのは、<strong>320 × 240mm に 34mm 間隔は円板充填の限界のすぐ手前<\/strong>だと いうこと。そこまで詰めた充填は局所的に六方格子へ落ち着くので、 <strong>乱数で撒いても、詰めれば格子になる。<\/strong><\/p>\n<p>直したのは<strong>密度のほう<\/strong>。枝分かれする骨格を先に描き、骨格からの距離で 「撒く確率」と「最小距離」（12.5mm ↔ 30mm）の両方を変える。詰まった所と 砂地が同居するので、単一の間隔が結晶化しようがない。ついでに骨格の <strong>枝先らしさ<\/strong>を親点へ渡して、枝先ほど高くしてある——高い所がクリア材に なる設定なので、<strong>透明になる順序が「白化は枝先から起きる」と一致する。<\/strong><\/p>\n<p><strong>骨格そのものは、絵としては読めない。それでよい。<\/strong> 刷るのは裁断前の 大きな生地で、裁断すれば盤面規模の絵は壊れる。<strong>この作品は「絵」では なく「野」が正しい。<\/strong>骨格は模様ではなく散らし方の道具として残した。<\/p>\n<h3>変えた 3（条文違反ではない）— 針が 5 本混ざっていた<\/h3>\n<p>格子を直したあと斜めの絵を見たら、<strong>針のように細い柱が数本<\/strong>あった。 島ごとに縦横比を測ると、<strong>短辺 0.94〜1.09mm・高さ 8mm 前後（縦横比 7〜9.4 : 1）が 5 本<\/strong>。ほかの 377 個は 2.6 : 1 以下。<\/p>\n<p><strong>条文（最小 XY 0.6mm）では 5 本とも通る。<\/strong> 通るが、この設計の指は 半径 1.10mm ＝ 直径 2.2mm なので、<strong>それより細い物は指ではなく削れ残り<\/strong>。 破片を落とす閾値を 0.9mm から <strong>2.0mm（指 1 本の直径）<\/strong>へ上げたら、 ちょうどその 5 本だけが落ち、島の最小の辺が 1.1mm → <strong>4.2mm<\/strong> になった。<\/p>\n<p><strong>条文で測ると通ってしまう物を、設計の側の寸法で落とす。<\/strong> 製造の下限は 「刷れるか」を答えるだけで、「作品の部品か」は答えない。<\/p>\n<h3>天面の形は正しかった（一度、自分で読み違えた）<\/h3>\n<p>最初に撮ったマクロでは、指が<strong>蝋の滴<\/strong>のようになだらかな山に見えた。形が 設計と違うと結論しかけたが、<code>_finger()<\/code> を読み直すと式は正しい。原因は <strong>解像度<\/strong>だった。<\/p>\n<p><code>render_macro.py<\/code> は <code>--final<\/code> を付けないと<strong>プレビュー解像度で組み直す<\/strong>。<\/p>\n<table><tr><th><\/th><th>格子<\/th><th>半径 1.10mm の指<\/th><th>平らな天面 1.36mm<\/th><th>縁の丸め 0.42mm<\/th><\/tr><tr><td>プレビュー 768<\/td><td>2.4 px/mm<\/td><td><strong>5 画素<\/strong><\/td><td>3.3 画素<\/td><td><strong>1 画素<\/strong><\/td><\/tr><tr><td>確定 2048<\/td><td>6.4 px/mm<\/td><td>14 画素<\/td><td>8.7 画素<\/td><td>2.7 画素<\/td><\/tr><\/table>\n<p><strong>プレビューでは、平らな天面も縁の丸めもメッシュに存在できない。<\/strong>確定で 撮り直すと段が読めるようになる。<strong>mm 単位の細工を見る絵は <code>--final<\/code> を 付けて撮ること。<\/strong><\/p>\n<p>ただし<strong>「平らな天面がはっきり出た」とまでは言えない。<\/strong>平らなのは 1.36mm の円のうち、深さ 0.26mm の蒲鉾を引いた<strong>頂点付近だけ<\/strong>で、 マクロでは白い点にしか見えない。ここは最初「はっきり出た」と書いて いて、自分の絵を自分に都合よく読んでいた。<\/p>\n<h3>残っている欠陥<\/h3>\n<ul><li><strong>台座の縁に 1 マスぶんのぎざぎざが残る。<\/strong> 確定 2048 で 1 マス 0.156mm。マクロ（幅 45mm）でだけ、根元の暗い輪の外周が毛羽立って見える。 実寸では 0.16mm なので刷った物では問題にならないと考えているが、 <strong>刷って確かめてはいない。<\/strong><\/li><li><strong>指と台座の境目に、丸めのハイライトが 1 本入る。<\/strong> 同じくマクロでだけ 見える。形としては正しい（丸めがそこにある）ので、直す対象ではない。<\/li><li><strong>クリア材の境目が、群体ごとにぎざぎざに切れる。<\/strong> 材の割り当ては 面ドメインで決まるので、頼んだ 8.5mm はいちばん近い頂点の輪へ吸着する （実測 <strong>8.428mm<\/strong>・0.07mm 手前）。輪の位置は群体ごとに違うので、 朱と灰色の境目が指ごとに階段状にずれる。マクロで読める。 <strong>これは 89 でも同じに出る<\/strong>（同じ設定なので）。<\/li><li><strong>透明の見せ方は、灰色の背景では弱い。<\/strong> 先端が透明材なのか白い色なのか 区別が付かない。市松の背景（<code>render_backdrop.py<\/code>）で撮り直すべきで、 <strong>まだ撮っていない。<\/strong><\/li><\/ul>\n<h3>自分の評価<\/h3>\n<ul><li><strong>高さの依頼には応えた。<\/strong> 11.90mm は作例 88 の 5.40mm の 2 倍以上。 斜めから見ると群体が明確に立ち上がり、影が落ちる。モチーフの側も、 指状の珊瑚として読める。<\/li><li><strong>白化の勾配は成功している。<\/strong> マクロで見ると、朱の指の上に灰色の硝子の 帽子が乗っていて、しかも群体ごとに深さが違う。「一斉に白くなった」では なく「白くなりつつある」に見える。<strong>高さを絵の意味に使えた例として、 これまでで一番はっきりしている。<\/strong><\/li><li><strong>格子は完全に消えた。<\/strong> 低い角度でも列が読めない。ただし密度の濃淡は 控えめで、盤面全体としては「散らばった点」に見える。<strong>骨格を絵として 読ませることは、この作品では狙わないと決めた<\/strong>（上の理由）。<\/li><li><strong>総合すると、提出できる水準。<\/strong> 三つの欠陥は測って直した。残る三つは すべてマクロ 45mm でだけ見えるもので、実寸では 0.16mm 以下。<\/li><li><strong>それでも、89 より良くはならなかった。<\/strong> 上の表のとおり造形条件は 1 つも改善しておらず、変わったのは見え方だけ。そして硝子へ届く群体が 73% から 36% へ減ったぶん、<strong>作品の主題（枝先が硝子になる）は薄れた。<\/strong> 整える作業が、主題を運んでいたものまで削っていた。<\/li><li><strong>測っていないもの。<\/strong> オーバーハング面数・境界の辺・体積を、この回は 測っていない。形は「立てた円柱＋内向きの丸め」だけなのでオーバーハングは 構造的に出ないはずだが、<strong>測っていないので断言しない。<\/strong><\/li><\/ul>\n<h3>服として<\/h3>\n<p>分割していないが、<strong>群体は 1 つずつ独立した島<\/strong>（377 個）なので、盤面の ほうは生地が全部受け持つ。曲がるかどうかは生地の柔らかさで決まり、造形物が 曲がりを阻む所は無い。ケープの肩、ドレスの裾など、面で受けて立体が散る 使い方を想定している。11.90mm あるので体から離れて見える。<\/p>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_90.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final --render<\/pre>\n<p>見本の 4 枚は次のとおり。<strong>4 枚とも <code>--final<\/code> を付ける<\/strong>（上の表の理由）。<\/p>\n<pre>blender --background --factory-startup --python docs/samples/tools/render_top.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; \\\n    --azim 210 --elev 22 --name preview_low \\\n    --sun-azim-offset 120 --sun-elev 18 --sun-energy 3.2 --world 0.14 --final\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; \\\n    --at 0.45,0.5 --span 45 --elev 18 --name preview_macro --final<\/pre>\n<p><code>BF_ADDON_PATH<\/code> は <strong><code>_samples_wt<\/code>（<code>/fabric_3d_texture<\/code> を足さない）<\/strong>。 作った版は <strong>7.202.0<\/strong>（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/90_preview.jpg"},{"c":"真上","d":"img/90_preview_top.jpg"},{"c":"低い角度から","d":"img/90_preview_low.jpg"},{"c":"拡大","d":"img/90_preview_macro.jpg"}]},{"num":"91","title":"霧巒（むらん）— 峰の頭だけが霧の上に残る","mode":"SURFACE","path":"docs/samples/91_霧巒_峰の頭だけが霧の上に残る","text":"<p class=\"lead\">160 × 120mm の盤に、円錐の群れを 81 個。**高さの真ん中 4.025〜7.475mm が\n透明材<strong>なので、断面が <\/strong>色 → 硝子 → 色** の三層になる。裾は群青、腰から\n上は乳白の硝子、そして霧を抜けた頭だけが金に光る。<\/p><p>160 × 120mm の盤に、円錐の群れを 81 個。<strong>高さの真ん中 4.025〜7.475mm が 透明材<\/strong>なので、断面が <strong>色 → 硝子 → 色<\/strong> の三層になる。裾は群青、腰から 上は乳白の硝子、そして霧を抜けた頭だけが金に光る。<\/p>\n<p>これまでの透明の作例（89 / 90）は［範囲］＝<strong>上だけ<\/strong>で、「上へ行くほど 透ける」——つまり<strong>単調<\/strong>だった。帯は単調でない唯一の置き方で、 <strong>霧の上にもう一度色が戻る<\/strong>。それがこの作例の全部である。<\/p>\n<h3>帯は「量」しか決められない。位置は真ん中で固定<\/h3>\n<p>［範囲］＝帯 は、透明にする<strong>量<\/strong>（＝ 1 −［色付き部分］）を高さの 真ん中に置く。本体の <code>_bf_ttop_clear_span<\/code> は<\/p>\n<pre>half = t * 0.5;  return max(0, 0.5 - half), min(1, 0.5 + half)<\/pre>\n<p>だけを返す。だから<strong>霧の高さは選べず、厚みだけが選べる<\/strong>。 ［色付き部分］70% → クリア 30% → 帯は 0.35〜0.65 → 11.5mm 換算で <strong>4.025〜7.475mm<\/strong>。<\/p>\n<p>これは制限だが、この題材には都合が良かった。霧は「ある高さに水平に たまるもの」なので、盤のどこでも同じ高さに来るほうが正しい。実測でも クリア材の面は <strong>z 4.025 〜 7.475<\/strong>（中央 5.362）にちょうど収まっていて、 群れごとにばらけていない。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>160 / 120mm<\/td><\/tr><tr><td>高さの決め方<\/td><td>レリーフ（明るさ＝高さ）<\/td><\/tr><tr><td>最大高さ<\/td><td><strong>11.5mm<\/strong><\/td><\/tr><tr><td>段数<\/td><td>0（連続）<\/td><\/tr><tr><td>明度反転<\/td><td>入（明るいほど高い）<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><\/tr><tr><td>透明<\/td><td>入<\/td><\/tr><tr><td>［出どころ］<\/td><td>高さ<\/td><\/tr><tr><td>［範囲］<\/td><td><strong>帯<\/strong><\/td><\/tr><tr><td>［方式］<\/td><td>比率<\/td><\/tr><tr><td>［色付き部分］<\/td><td><strong>70%<\/strong><\/td><\/tr><tr><td>クリアの濁り / 色<\/td><td>0.28 / (0.72, 0.80, 0.88)<\/td><\/tr><tr><td>色<\/td><td>画像から（<code>source.png<\/code>）<\/td><\/tr><tr><td>輪郭の吸着 / 丸み<\/td><td>入 / 0.2mm<\/td><\/tr><tr><td>ファブリック底面<\/td><td>適用（VeroEco Flex・織り目）<\/td><\/tr><tr><td>解像度 プレビュー / 確定<\/td><td>768 / <strong>2048<\/strong><\/td><\/tr><\/table>\n<h3>元画像<\/h3>\n<p><code>tools/make_art_91.py<\/code> が式で組む（<code>SEED = 9101<\/code>）。<\/p>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>source.png<\/td><td><strong>2048 × 1536（12.8px/mm）<\/strong>・不透明 16.2%・771KB<\/td><\/tr><tr><td>置いた群れ<\/td><td>81 個（最小距離 13.0mm）<\/td><\/tr><tr><td>群れの差し渡し<\/td><td>最小 5.9 / 中央 9.5 / <strong>最大 12.1mm<\/strong>（上限 15）<\/td><\/tr><tr><td>峰の高さ<\/td><td>最小 1.90 / 中央 7.89 / 最大 11.50mm<\/td><\/tr><tr><td>霧の下端 4.025mm より高い群れ<\/td><td><strong>72 個（89%）<\/strong><\/td><\/tr><tr><td>霧の上端 7.475mm より高い群れ<\/td><td><strong>44 個（54%）<\/strong><\/td><\/tr><tr><td>輝度の誤差（狙いとの差）<\/td><td>平均 0.00073 / 最大 0.00195<\/td><\/tr><\/table>\n<p>高さの写像は手で調整していない。「上位 55% が霧を抜ける」を条件にして ガンマを解いた（<code>gamma = 0.681<\/code>）。実際に抜けたのは 54%。<\/p>\n<p><strong>円錐の太さは高さから出す<\/strong>（<code>r = clip(ht/2.4, 0.9, 3.2)<\/code>）。太さを 独立に振ると、低い峰が寸胴になって「山」に見えなくなる。<\/p>\n<h3>元画像は、確定の格子と同じ画素密度で組む<\/h3>\n<p><strong>最初は 9.6px/mm で組んで、外した。<\/strong>確定は 2048/160 = 12.8px/mm なので、 当て込みは最近傍で 4 画素につき 1 画素を飛ばす。その飛ぶ所に<strong>水平な 0.104mm の棚<\/strong>ができ、円錐の斜面ではそこだけが光を正面から受ける ——拡大写真では<strong>白い同心の弧<\/strong>として出た。<\/p>\n<p>0.104mm は造形の分解能より細かいので、刷れば消える。私は最初それを理由に 「害は無い」と書いたが、<strong>「造形で消える」は「絵に出ない」ではない。<\/strong> 見本の絵は人が見るものなので、絵に出るなら欠陥である。12.8px/mm へ 揃えたら弧は 1 本も残らなかった（拡大写真で確認）。<\/p>\n<p><strong>逆に、確定を 1536 へ下げて元画像に揃える案は採れない。<\/strong> <code>surface_final_resolution_preset<\/code> が 512 / 1024 / 2048 の 3 段しか持たず、 設定の当て込みで後から 2048 に上書きされる（下記）。<\/p>\n<h3>配色表は明るさを決められない。決められるのは色みだけ<\/h3>\n<p>面モードのレリーフでは<strong>輝度がそのまま高さ<\/strong>なので、色を決める表は 高さを決める表でもある。だから「この帯を明るい灰青にする」はできない ——輝度を上げたら、その場所が高くなってしまう。<\/p>\n<p>逃げ道は輝度の重み（R 0.2126 / G 0.7152 / B 0.0722）の偏りにある。<\/p>\n<ul><li><strong>暗い側は青でしか色が取れない。<\/strong> 青は輝度をほとんど上げないので、 <code>(0.06, 0.13, 1.00)<\/code> は輝度 0.178 の<strong>冴えた青<\/strong>として成立する。<\/li><li><strong>明るい側は黄〜金でしか取れない。<\/strong> 同じ理屈の裏側で、緑の重みが 大きいから。<\/li><\/ul>\n<p><strong>そして金は、範囲の端まで引っ張れる。<\/strong>最初は 0.65 で金・0.90 で生成り・ 1.00 で白と置いた。金が範囲の 13% しか占めず、しかもその 13% が霧の縁の すぐ上——境目のぎざぎざと重なる一番読みにくい所——にいたので、拡大写真では <strong>霧の上がほとんど灰白<\/strong>に見えた。上の 22% を占めていた生成り〜白のほうが 目に入る。<\/p>\n<p>当ては、<strong>R を 1.0 に張り付けて B を低く保ち、G だけで輝度を作る<\/strong>こと。 <code>G = (L − 0.2126 − 0.0722B) / 0.7152<\/code> なので、B=0.15 のままなら <strong>L = 0.939 まで彩度を落とさずに上げられる<\/strong>。洗い流されるのは最後の 6% だけになり、金の占める幅は 13% → <strong>29%<\/strong> になった。<\/p>\n<p><strong>輝度 1.0 に置ける色は白しか無い。<\/strong>これは逃げようがないので、 いちばん高い峰の天面だけは必ず白くなる。<\/p>\n<h3>数字（生成）<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>160.0 × 120.0 × <strong>11.50mm<\/strong>（指定どおり）<\/td><\/tr><tr><td>頂点数 / 生成時間<\/td><td>1,596,045 / 15.8 秒（確定 2048）<\/td><\/tr><tr><td>設定の当て込み<\/td><td>適用 354 件 / 非適用 0 件<\/td><\/tr><tr><td>いちばん大きい要素<\/td><td><strong>7 × 11mm<\/strong>（上限 15.0mm）<\/td><\/tr><tr><td>クリア材<\/td><td>148,882 面 / 全 1,244,522 面・<strong>z 4.025 〜 7.475mm<\/strong><\/td><\/tr><tr><td>色付き材<\/td><td>1,095,640 面・z 0.000 〜 11.500mm<\/td><\/tr><\/table>\n<p>道具が出した警告は 1 本だけ（「重くなる可能性があります」）。 15mm の上限を通っているので、<strong>分割していない。<\/strong><\/p>\n<h3>見る角度<\/h3>\n<table><tr><th>絵<\/th><th>何が読めるか<\/th><\/tr><tr><td><code>preview.jpg<\/code>（斜め 20°）<\/td><td>手前の低い青 → 奥の金という<strong>対角の勾配<\/strong>。霧の帯が盤のどこでも同じ高さに来ること<\/td><\/tr><tr><td><code>preview_top.jpg<\/code>（真上）<\/td><td>一つの峰が実は <strong>2〜5 個の円錐の塊<\/strong>であること。金の眼が高い側にだけ並ぶこと<\/td><\/tr><tr><td><code>preview_low.jpg<\/code>（方位 250°・仰角 12°）<\/td><td>三層が横から見える唯一の角度。<strong>青／乳白／金<\/strong>の縞<\/td><\/tr><tr><td><code>preview_macro.jpg<\/code>（30mm 幅・確定 2048）<\/td><td>帯の上下の境目、硝子越しに透ける後ろの峰、金の天面<\/td><\/tr><\/table>\n<p><strong>拡大写真は 2 回撮り直した。<\/strong>1 回目は白い弧のため（上記）、2 回目は <strong>画角のため<\/strong>——低い峰が集まった所を撮ったので、15 個のうち 3 個しか 金の頭が出ていなかった。7.475mm に届かない峰は 4.025mm から上が全部 クリア材なので、天面まで硝子になる。<strong>それは正しい振る舞いだが、帯を 説明する絵にはならない。<\/strong>高い側の四半分（<code>--at 0.80,0.42<\/code>）へ移した。<\/p>\n<h3>残っている欠陥<\/h3>\n<p>1. <strong>色と硝子の境目が鋸の刃になる。<\/strong>材の割り当ては<strong>面の中心の z<\/strong>で 決まるので、境目をまたぐ面がどちらか一方へ丸ごと落ちる。上下 2 本とも 同じように波打つ。作例 89 / 90 にも同じものが出ているので、これは 設計ではなく道具の性質（<code>欲しい機能_20260904.md<\/code> に既報）。<\/p>\n<p><strong>ただしこの作例では、境目の高さそのものはずれていない<\/strong>（クリア材の 面が 4.025〜7.475 にちょうど収まる）。89 は 0.36mm 低い所へ落ちていた。 違いは元画像の画素密度で、格子が細かいほど境目の近くに面が来る。<\/p>\n<p>2. <strong>手前 1/3 が短い青の粒だけになる。<\/strong>対角の勾配は意図したものだが、 盤の 1/3 を「まだ何も起きていない」領域に使っている。服の一部として 切り出すなら、その部分は捨てることになる。<\/p>\n<p>3. <strong>フォルダが 1MB の目安を 38% 超えている<\/strong>（1,381KB）。 <code>source.png<\/code> が 789KB あり、これは 2048×1536 の RGBA を落とせないため ——12.8px/mm を下げると 1 の白い弧が戻る。減色は使えない（滑らかな 輝度の勾配がそのまま高さなので、パレット化すると斜面が段になる）。 見本 4 枚は再圧縮を試したが 23KB しか減らず、<strong>二重圧縮の劣化に 見合わない<\/strong>ので撮り直して 1 回だけの圧縮に戻した。<\/p>\n<h3>自分の評価<\/h3>\n<p><strong>帯という置き方は、この 3 件（89 / 90 / 91）の中でいちばん強い。<\/strong> 上だけ は「先へ行くほど消える」という一方向の話しかできないが、帯は <strong>消えたあとにもう一度現れる<\/strong>。峰の頭が宙に浮いて見えるのは、その 「もう一度」があるからで、上だけでは絶対に出ない絵になっている。<\/p>\n<p><strong>いちばん効いた判断は、金を 0.94 まで引っ張ったこと。<\/strong>同じ形・同じ 高さ・同じ帯のまま、配色表の停止位置を動かしただけで、拡大写真の印象が 「灰色の山」から「金の頂」に変わった。輝度が高さである以上、配色で できることは狭いが、<strong>狭い中にもまだ余地があった<\/strong>——「明るい側は 色が取れない」と一度書いた自分の結論のほうが甘かった。<\/p>\n<p>弱いのは<strong>霧の厚み<\/strong>で、30% は薄い。硝子の帯が細いので、真横から見ないと 「霧」より「首輪」に見える瞬間がある。［色付き部分］を 55% くらいまで 下げた版を後で撮って比べたい。<\/p>\n<h3>服として<\/h3>\n<p><strong>丈の短いケープか、ドレスの肩。<\/strong>峰が 11.5mm と高いので、体に沿わせる のではなく<strong>面として立てて<\/strong>使う。裾へ向けて峰を低くしていけば、勾配が そのままシルエットになる。<\/p>\n<p>霧の帯は照明を通すので、<strong>後ろから当てる光でいちばん効く。<\/strong>上から当てる と金の天面だけが光り、帯は暗いままになる。<\/p>\n<h3>作り方<\/h3>\n<p><code>BF_ADDON_PATH<\/code> は <strong><code>_samples_wt<\/code>（<code>/fabric_3d_texture<\/code> を足さない）<\/strong>。 作った版は <strong>7.206.0<\/strong>（<code>_samples_wt<\/code>）。<\/p>\n<pre>python docs/samples/tools/make_art_91.py\n\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final --render\nblender --background --factory-startup --python docs/samples/tools/render_top.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; \\\n    --azim 250 --elev 12 --name preview_low --final\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; \\\n    --at 0.80,0.42 --span 30 --name preview_macro --final<\/pre>\n<h3>道具について気づいたこと（報告済み）<\/h3>\n<p><strong><code>surface_final_resolution_preset<\/code> が <code>surface_final_resolution<\/code> を 黙って上書きする。<\/strong>前者は MID=512 / HIGH=1024 / MAX=2048 を写す <code>update=<\/code> を持ち、設定の当て込みは宣言順なので<strong>必ず後から来る<\/strong>。 つまり<strong>512 / 1024 / 2048 以外の値は設定ファイルを往復できない。<\/strong> 1536 で確定したくてもできず、元画像の側を 2048 に合わせるしか無かった。<\/p>","imgs":[{"c":"斜め","d":"img/91_preview.jpg"},{"c":"真上","d":"img/91_preview_top.jpg"},{"c":"低い角度から","d":"img/91_preview_low.jpg"},{"c":"拡大","d":"img/91_preview_macro.jpg"}]},{"num":"92","title":"影を刷る — 刷られた葉と、立ち上がる葉","mode":"SURFACE","path":"docs/samples/92_影を刷る_刷られた葉と立ち上がる葉","text":"<p class=\"lead\">生地に<strong>先に影を刷っておいて<\/strong>、その上に葉を立ち上げる。銀杏が 99 枚\n散っていて、そのうち <strong>37 枚だけが 3D で起き上がり、残る 62 枚は印刷のまま<\/strong>寝ている。\nどの葉にも影が刷られているので、立ち上がった 37 枚は<strong>自分の影の上に浮いている<\/strong>。<\/p>\n<p>「2D プリントの上に 3D プリントを重ねる」という依頼への 1 件目。狙ったのは\n<em>3D の下に 2D を敷く<\/em>ことではなく、<strong>2D の側に、3D の側では作れないものを\n担当させる<\/strong>こと。造形では影は作れない——照明を決められない以上、影は見る場所で\n動いてしまう。だから影は刷る。<strong>刷った影は動かない。<\/strong><\/p>\n<p>そこが読めるように、見本は<strong>光を 2 つ<\/strong>用意した。仰角 24° では立った葉が\n<strong>濃くて硬い本物の影<\/strong>を落とし、その隣に<strong>淡くて平らな刷りの影<\/strong>が並ぶ。\n仰角 82° では<strong>本物の影が消え<\/strong>、残るのは刷った影だけ。<\/p>\n\n<h3>色で 2 つを分ける<\/h3>\n<p>刷りは 2 版。葉が<strong>暖色<\/strong>（セピアと錆）、影が<strong>寒色寄りの無彩色<\/strong>。\n<code>fabric.jpg<\/code> を輝度で分けて平均を採った実測:<\/p>\n<table><tr><th>刷りの層<\/th><th>面積<\/th><th>平均 RGB<\/th><th>R−B<\/th><\/tr>\n<tr><td>地（生成りの布）<\/td><td>80.3%<\/td><td>—<\/td><td>—<\/td><\/tr>\n<tr><td>影<\/td><td>8.1%<\/td><td>(0.739, 0.734, 0.733)<\/td><td><strong>+0.007<\/strong><\/td><\/tr>\n<tr><td>葉<\/td><td>11.6%<\/td><td>(0.555, 0.403, 0.286)<\/td><td><strong>+0.269<\/strong><\/td><\/tr><\/table>\n<p><strong>このインクは目で選んでいない。<\/strong>影は生地への<strong>乗算<\/strong>で刷られるので、\n無彩色のインクを掛けると生地の暖かさがそのまま残り、セピアの葉と同じ色味になる\n（最初はそれで作って失敗した——合成後が (0.705, 0.678, 0.654) の日焼け色になり、\n「暖色＝葉／寒色＝影」の規則が出力の中で成り立っていなかった）。だから\n<strong>合成後に置きたい色 (0.63, 0.65, 0.70) から乗算を逆に解いて<\/strong>インクを決めた。<\/p>\n<pre>ink = (result / ground - (1 - op)) / op  ->  (0.36, 0.45, 0.68)<\/pre>\n<p><strong>直したあとも、レンダーを見ただけでは判断できなかった。<\/strong>暖色に囲まれた\n無彩色は同時対比で黄土色に見えるので、目では「まだ暖かい」と読める。数えて初めて\n片が付いた（上の表の R−B）。<\/p>\n\n<h3>縁だけが透ける<\/h3>\n<p>［色付き部分］80%、最大高さ 3.0mm なので、<strong>硝子（透明材）は下 0.60mm<\/strong> に入る。\n葉の高さは中心が 1.20〜3.00mm、外縁が <code>H_MIN = 0.55mm<\/code>。<\/p>\n<p><strong>外縁 0.55mm は硝子の上端 0.60mm より低い。<\/strong>つまり葉の薄い縁だけが透明材で、\n本体は色付きのまま——乾いた落ち葉の、光を通す縁そのもの。高さを 3.0mm まで下げたことで\n初めて成立した（7.0mm 版では葉が「塊」に見え、硝子も厚すぎて下の刷りが乳白に沈んでいた）。<\/p>\n\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>なぜ<\/th><\/tr>\n<tr><td>モード<\/td><td>面（SURFACE）<\/td><td>葉は 1 枚ずつの薄い島<\/td><\/tr>\n<tr><td>［高さの決め方］<\/td><td>レリーフ<\/td><td>明るさ＝高さ。扇の形が高さに出る<\/td><\/tr>\n<tr><td>［最大高さ］<\/td><td>3.0mm<\/td><td>差し渡し 14mm の葉に対して、寝た葉に見える比<\/td><\/tr>\n<tr><td>［範囲］<\/td><td>下だけ<\/td><td>硝子を足元に置く<\/td><\/tr>\n<tr><td>［色付き部分］<\/td><td>80%（＝硝子 0.60mm）<\/td><td>縁 0.55mm だけが透ける値<\/td><\/tr>\n<tr><td>［クリアの濁り］<\/td><td>0.06<\/td><td>ほぼ完全に透ける<\/td><\/tr>\n<tr><td>［ファブリック底面］<\/td><td>単一画像・引き伸ばし<\/td><td><strong>ここが 2D プリント<\/strong><\/td><\/tr>\n<tr><td>［輪郭の吸着］<\/td><td>入<\/td><td>葉の縁の階段を消す<\/td><\/tr>\n<tr><td>［色の決め方］<\/td><td>画像から<\/td><td>葉の色を刷りと揃える<\/td><\/tr><\/table>\n\n<h3>元画像 — 2 枚は 1 枚の絵を割ったもの<\/h3>\n<ul>\n<li><code>fabric.jpg<\/code>（180 x 140mm）— <strong>全部の葉と全部の影<\/strong>。これが 2D プリント。<\/li>\n<li><code>source.png<\/code>（2048 x 1536・不透明 9.0%）— <strong>立ち上がる 37 枚だけ<\/strong>。高さ = 明るさ。<\/li>\n<\/ul>\n<p>つまり <code>fabric.jpg<\/code> から 37 枚を<strong>引いてはいない<\/strong>——刷りには 99 枚とも\n載っている。立ち上がった葉の真下には、その葉の<strong>刷られた姿<\/strong>が隠れる。見えるのは、\nはみ出した<strong>刷りの影<\/strong>のほうだけ。<\/p>\n\n<h3>数字（生成）<\/h3>\n<table>\n<tr><td>葉<\/td><td>99 枚（立ち上がる 37 / 刷るだけ 62）<\/td><\/tr>\n<tr><td>扇の差し渡し<\/td><td>最大 14.2mm（上限 15）<\/td><\/tr>\n<tr><td>いちばん大きい要素<\/td><td>13 x 10mm<\/td><\/tr>\n<tr><td>中心どうしの最小距離<\/td><td>16.73mm（葉の直径 15.53mm → すき間 1.2mm ≥ 0.6mm）<\/td><\/tr>\n<tr><td>葉の頂点<\/td><td>1.20 / 2.10 / 3.00mm（最小・中央・最大）<\/td><\/tr>\n<tr><td>造形サイズ<\/td><td>160.0 x 120.0 x 3.00mm<\/td><\/tr>\n<tr><td>頂点数<\/td><td>1,211,783（最終解像度 2048）<\/td><\/tr>\n<tr><td>生成<\/td><td>5.2 秒・設定 適用 354 / 非適用 0<\/td><\/tr>\n<\/table>\n<p>仰角 24° は思いつきではない。刷った影のずれは <code>ずれ = 高さ x 2.20<\/code> で作ってあり、\n<code>atan(1/2.20) = 24.4°<\/code>。方位 135° も影の向き <code>(1, -1)<\/code> に合わせてある。<\/p>\n\n<h3>残っている欠陥<\/h3>\n<ul>\n<li><strong>刷った影が、影に見えないことがある。<\/strong>真上（<code>preview_noon<\/code> /\n<code>preview_top<\/code>）では、淡い影が<strong>葉柄まで持っていて輪郭も硬い<\/strong>ので、\n「4 色目の葉」に読める。影らしさは輪郭のぼけと接地で出るものなので、刷りの側でもっと\n崩すべきだった。<\/li>\n<li><strong>刷った影と本物の影は重ならない。<\/strong>刷りのずれは葉の<strong>平均の高さ<\/strong>から\n出しているので 1.06〜4.62mm。本物の影は<strong>頂点<\/strong>から落ちるので、24° では最大\n3.0/tan(24°) ≒ 6.7mm 伸びる。<strong>言えるのは「刷った影は動かず、本物の影だけが光と\n一緒に動く」ことまで<\/strong>で、両者が一致するとは言えない。<\/li>\n<li><strong>側面に縦の縞が出る。<\/strong>［色の決め方］＝画像から は色を真上から投影するので、\n押し出した側面に天面の色が引き伸ばされる。2048 で見ると「刷った紙を切った断面」に\n読めるので許容したが、意図した表現ではない。<\/li>\n<li>真上から見ると、立った 37 枚と寝た 62 枚を<strong>形では見分けられない<\/strong>。\n見分けられるのは、立った葉が落とす薄い実影だけ。<\/li>\n<\/ul>\n\n<h3>自分の評価<\/h3>\n<p><strong><code>preview_raking<\/code> は成功。<\/strong>立った葉が低い陽で明るく光り、その足元に\n硬い実影が落ち、隣に平たい刷りの影が並ぶ——2 種類の影の<strong>質の差<\/strong>が、説明なしで\n「片方は刷ってある」と伝える。ここがこの作例の狙いそのもの。<\/p>\n<p><strong><code>preview_noon<\/code> は主張は通るが、絵としては弱い。<\/strong>本物の影が消える、\nという証明にはなっているが、残った刷りの影が葉に見えてしまうので、「影だけが残った」\nではなく「淡い葉がもう一群ある」と読める。<\/p>\n<p><strong>2D と 3D の役割分担そのものが、この作例の一番の収穫。<\/strong>影・微細な葉脈・\n色の階調は刷りが得意で、厚み・光の受け方・実影は造形が得意。どちらか一方で全部\nやろうとしない、という作り方が形になった。<\/p>\n\n<h3>服として<\/h3>\n<p>シャツの背面や、コートの裾のような<strong>動く面<\/strong>に向く。歩くと本物の影だけが移動して、\n刷った影は生地に貼り付いたまま動かない——静止した写真では出せない、着ることでしか\n起きない現象になる。高さ 3.0mm・要素 14mm・すき間 1.2mm なので、曲げに対しては素直。<\/p>\n\n<h3>撮り方で一度つまずいた<\/h3>\n<p><strong><code>--final<\/code> を全部の道具に付ける。<\/strong>付け忘れてプレビュー解像度\n（768 = 4.8 px/mm）で撮ると、<strong>存在しない欠陥が写る<\/strong>——立った葉の縁に暗い\nぎざぎざが出て、実際に「これは不具合か」と一度疑った。2048 で撮り直したら跡形も無く\n消えた。作った版: v7.206.0<\/p>","imgs":[{"c":"低い陽 24° — 本物の影と、刷った影","d":"img/92_preview.jpg"},{"c":"真上","d":"img/92_preview_top.jpg"},{"c":"かすめ光","d":"img/92_preview_raking.jpg"},{"c":"真昼の光","d":"img/92_preview_noon.jpg"},{"c":"拡大","d":"img/92_preview_macro.jpg"}]},{"num":"93","title":"透石 — 色は刷りから来る","mode":"SURFACE","path":"docs/samples/93_透石_色は刷りから来る","text":"<p class=\"lead\">造形が作るのは<strong>留め具だけ<\/strong>——窓の開いた覆輪（ベゼル）と爪が 53 個。\n窓の中央は<strong>本当に穴が開いていて<\/strong>、そこに見えている藍・琥珀・薄紅の石は、\n下の生地に<strong>刷ってある<\/strong>。石は 2D、留め具は 3D。<\/p>\n<p>「2D プリントの上に 3D プリントを重ねる」への 2 件目で、作例92 とは<strong>役の分け方を\nひっくり返してある<\/strong>。92 は 3D が主役で刷りが影を担当したが、こちらは<strong>刷りのほうが\n主役<\/strong>で、造形はそれを留めるためだけに立っている。<\/p>\n<p><strong>どちらを外しても作品が成立しない。<\/strong>3D だけなら空っぽの枠が 53 個、\n2D だけなら布に滲んだ染みが 53 個並ぶだけになる。<\/p>\n\n<h3>穴でしか、下の刷りは見えない<\/h3>\n<p>最初の構想は「透明材の石を透かして、下の刷りの色が石に宿る」だった。<strong>作れない。<\/strong>\n面モードは<strong>高さマップの押し出しで、底面が z=0 に閉じている<\/strong>——石の真下には\n石自身の<strong>不透明な底面<\/strong>があるので、透明材を上に乗せても下の生地は絶対に見えない。<\/p>\n<p>生地が見えるのは<strong>輪郭のアルファが 0 の所<\/strong>、つまり本当に穴が開いている所だけ。\nだから穴を開けて、石は刷りに任せた。透明材（下 1.68mm・濁り 0.20）は覆輪そのものを\n硝子に変える役へ回してある。<\/p>\n\n<h3>立ち上がっているものは、暗くできない<\/h3>\n<p>「いぶし銀の覆輪」を作ろうとして淡い灰色にしかならなかった。レリーフ＋［明度反転］では\n<strong>輝度がそのまま高さ<\/strong>なので、最大高さの 0.5〜1.0 に立つものは必ず中間灰〜白になる。\n<strong>「高くて暗い」は表現できない。<\/strong><\/p>\n<p>だから対比を<strong>布の側<\/strong>へ移した——白に近かった生地を鉄紺 (0.082, 0.079, 0.098) へ。\n覆輪の<em>低い<\/em>所だけは暗くできるので、白金の冠の下に青銅が覗く。色の割り当ては\n高さ t に対して輝度が t になるよう解いてある（誤差 平均 0.00072 / 最大 0.00196）。<\/p>\n\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>なぜ<\/th><\/tr>\n<tr><td>モード<\/td><td>面（SURFACE）<\/td><td>留め具は 1 個ずつの薄い島<\/td><\/tr>\n<tr><td>［高さの決め方］<\/td><td>レリーフ<\/td><td>明るさ＝高さ。断面が高さに出る<\/td><\/tr>\n<tr><td>［最大高さ］<\/td><td>2.8mm<\/td><td>差し渡し 14mm の留め具に対する比<\/td><\/tr>\n<tr><td>［範囲］<\/td><td>上だけ<\/td><td>硝子を覆輪の頭へ置く<\/td><\/tr>\n<tr><td>［色付き部分］<\/td><td>40%（＝台座 1.12mm・硝子 1.68mm）<\/td><td>青銅の足元だけ色を残す<\/td><\/tr>\n<tr><td>［クリアの濁り］<\/td><td>0.20<\/td><td>硝子に見え、かつ形が読める<\/td><\/tr>\n<tr><td>［ファブリック底面］<\/td><td>単一画像・引き伸ばし<\/td><td><strong>ここが 2D プリント<\/strong><\/td><\/tr>\n<tr><td>［角の丸み］<\/td><td>0.15mm・2 段（上端と縦の辺）<\/td><td>爪の頭を尖らせない<\/td><\/tr>\n<tr><td>［輪郭の吸着］<\/td><td>入<\/td><td>窓の縁の階段を消す<\/td><\/tr>\n<\/table>\n\n<h3>数字（生成）<\/h3>\n<table>\n<tr><td>留め具<\/td><td>53 個（navette 16 / kite 10 / hexagon 9 / lozenge 7 / pear 11）<\/td><\/tr>\n<tr><td>留め具の長さ<\/td><td>11.0 〜 14.6mm（上限 15.0）<\/td><\/tr>\n<tr><td>中心どうしの最小距離<\/td><td>15.83mm（最長 14.56mm → すき間 1.26mm ≥ 0.6mm）<\/td><\/tr>\n<tr><td>輪郭のいちばん短い辺<\/td><td>1.05mm（下限 0.6mm）<\/td><\/tr>\n<tr><td>覆輪の幅<\/td><td>0.68 〜 1.05mm（下限 0.6mm）<\/td><\/tr>\n<tr><td>窓の半幅<\/td><td>1.59 〜 2.45mm<\/td><\/tr>\n<tr><td>高さ<\/td><td>爪の頭 2.43〜2.78 / 窓のふち 1.30 / 硝子の下端 1.12mm<\/td><\/tr>\n<tr><td>窓が冠より低い留め具<\/td><td>53 個（全部であるのが正しい）<\/td><\/tr>\n<tr><td>いちばん大きい要素<\/td><td>14 x 8mm<\/td><\/tr>\n<tr><td>造形サイズ<\/td><td>160.0 x 120.0 x 2.78mm<\/td><\/tr>\n<\/table>\n<p>オーバーハングは<strong>構造的に出ない<\/strong>——高さマップの押し出しなので輪郭は上へ\n広がりようがなく、外の縁から窓へ<strong>下る<\/strong>斜面は椀の内側と同じで自立する。<\/p>\n\n<h3>作り直した 4 回のうち、3 回は自分の設計の誤り<\/h3>\n<ul>\n<li><strong>1. 透かして色を宿す、は作れない。<\/strong>上の「穴でしか見えない」の節。構想そのものを\n差し替えた。<\/li>\n<li><strong>2. 高くて暗いものは作れない。<\/strong>対比を布へ移して解決。<\/li>\n<li><strong>3. 冠を内側に置くと、窓が井戸になる。<\/strong>最初は内のふちがいちばん高い（3.7〜4.6mm）\n形で、斜め 20° では<strong>壁が自分の窓を隠して<\/strong>中の刷りが影に落ちた。断面を裏返して\n<strong>外の縁を冠・窓のふちを座<\/strong>にし、最大高さも 4.6 → 2.8mm へ下げた。<\/li>\n<li><strong>4. 溜まりのほうが石より明るかった。<\/strong>窓の中は壁に囲まれて陰になるので、輪郭の外へ\n広がる刷りと同じ濃さで刷ると<strong>外のほうが必ず明るい<\/strong>。刷りの側で先に差を付けた\n（輪郭の外は彩度 30%・濃さ 55%）。読みも変わって「布に波紋が刷ってあり、留め具が開いた所\nでだけ色が宝石になる」になった。<\/li>\n<\/ul>\n\n<h3>残っている粗さ<\/h3>\n<p>覆輪の外壁は垂直に近く、そこへ［輪郭の吸着］がかかるので、拡大すると<strong>縦の細い畝<\/strong>が\n並ぶ。12.8 セル/mm の格子で垂直面を作ると必ずこうなる。宝飾の縮尺では爪の列に見えるので\n直していないが、<strong>設計した形ではなく道具の副産物<\/strong>だと分かったうえで残している。<\/p>\n\n<h3>自分の評価<\/h3>\n<p><strong>採る。<\/strong>真上の 1 枚が作品の主張そのもので、白い輪＝造形／色の芯＝刷り が\n説明なしで読める。作例92 が「2D と 3D が別々のものを担当する」だったのに対し、こちらは\n<strong>1 つの宝石を 2 つの技法で分担している<\/strong>——枠と石という、現実の宝飾がもともと\n持っている分業をそのまま持ってきた。<\/p>\n\n<h3>服として<\/h3>\n<p>身頃や襟のような<strong>平らで目に近い面<\/strong>に向く。高さ 2.78mm・要素 14mm・すき間 1.26mm\nなので曲げに素直で、刷りの側は生地の伸縮にそのまま追従する。造形が留め具だけなので、\n<strong>材料も刷り面積もほとんど増えない<\/strong>のに宝飾の密度が出る。作った版: v7.206.0<\/p>","imgs":[{"c":"斜め — 白い輪が造形、色の芯が刷り","d":"img/93_preview.jpg"},{"c":"真上","d":"img/93_preview_top.jpg"},{"c":"低い角度","d":"img/93_preview_raking.jpg"},{"c":"拡大","d":"img/93_preview_macro.jpg"}]},{"num":"94","title":"銀泥の梅 — 枝は刷り、花は粒","mode":"BRISTLE","path":"docs/samples/94_銀泥の梅_枝は刷り花は粒","text":"<p class=\"lead\">「2D プリントの上に 3D プリントを重ねる」への 3 件目。分け方の根拠を\n<strong>「作れる／作れない」<\/strong>に置いたのが前 2 件との違い——<strong>枝は刷る。柱では引けない\n太さだから。<\/strong>花だけを柱にする。花は線ではなく点で、格子に乗るから。<\/p>\n<p>筆の線を成す 632 点のうち <strong>621 点（98%）が柱の間隔 6.0mm より細い。<\/strong>\n柱モードでこの枝を引こうとすれば、線は 6.0mm の粒に分解されて枝には見えない\n（v7.173.0 の警告が言っているのと同じこと）。<\/p>\n<p>作例92 は「鋳造では作れない影」を刷り、作例93 は「造形では解けない 0.40mm の輪」を\n刷った。94 が刷るのは<strong>格子が引けない線<\/strong>。3 件で刷りの役が 3 通りになる。<\/p>\n<p>地は<strong>紺紙銀泥<\/strong>——藍に銀泥で写経する実在の様式。淡い地では花の先の霜（透明材）に\nコントラストが出ないので、暗い地が要る。<\/p>\n\n<h3>真上の 1 枚が主張そのもの<\/h3>\n<p>銀の枝はどこへでも曲がるのに、花は格子の交点にしか乗れない。花が枝の<strong>線上ではなく脇に<\/strong>\n咲いているのは誤差ではなく設計で、格子に最も近い点へ吸着させてある。<strong>線の自由と格子の拘束が\n同じ絵の中で争っている<\/strong>のが見どころ。<\/p>\n<p>格子を固定するため <code>settings.json<\/code> の <code>meta<\/code> に <code>\"pin_grid\": true<\/code> を\n置いてある。これが無いと［間隔保持］が画像から列数を決め直すので、花が格子から外れて散る。<\/p>\n\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>なぜ<\/th><\/tr>\n<tr><td>モード<\/td><td>柱（BRISTLE）・格子 29 x 41<\/td><td>花は点。格子に乗る<\/td><\/tr>\n<tr><td>［断面］<\/td><td>星（STAR）<\/td><td>五弁の花。<strong>頂点数は常に 10 固定<\/strong><\/td><\/tr>\n<tr><td>［星内半径比］<\/td><td><strong>0.46<\/strong><\/td><td>0.62 では谷が浅く十二角形に見える<\/td><\/tr>\n<tr><td>［上端の丸み］<\/td><td>0.62<\/td><td>先端を丸めて、霜の帽子を厚く見せる<\/td><\/tr>\n<tr><td>［最大高さ］<\/td><td>7.5mm<\/td><td>3.00〜7.50mm・中央 5.62<\/td><\/tr>\n<tr><td>［範囲］／［色付き部分］<\/td><td>上だけ／66%（＝上 34% が霜）<\/td><td>花の先だけを霜にする<\/td><\/tr>\n<tr><td>［クリアの濁り］<\/td><td>0.30・色 (0.97, 0.86, 0.88)<\/td><td>白に近いと不透明な蓋になる<\/td><\/tr>\n<tr><td>［色］<\/td><td>高さのグラデーション（4 停）<\/td><td>茜 → 薄紅。根元が濃い<\/td><\/tr>\n<tr><td>［ファブリック底面］<\/td><td>単一画像・引き伸ばし<\/td><td><strong>ここが 2D プリント<\/strong><\/td><\/tr>\n<\/table>\n\n<h3>数字（生成）<\/h3>\n<table>\n<tr><td>花<\/td><td>119 個 / 格子 29 x 41 = 1189 点（10.0%）<\/td><\/tr>\n<tr><td>花の高さ<\/td><td>3.00 〜 7.50mm（中央 5.62）／ 上 34% が透明材<\/td><\/tr>\n<tr><td>いちばん高い花の縦横比<\/td><td>1.56 : 1（差し渡し 4.80mm）<\/td><\/tr>\n<tr><td>枝の幅<\/td><td>0.2 〜 7.2mm ／ 柱の格子の間隔 6.0mm<\/td><\/tr>\n<tr><td>格子より細い筆の点<\/td><td><strong>632 点中 621 点（98%）<\/strong><\/td><\/tr>\n<tr><td>骨格<\/td><td>16 本 → Catmull-Rom 14 分割 → 632 点<\/td><\/tr>\n<tr><td>柱のすき間<\/td><td>1.20mm（間隔 6.0 − 差し渡し 4.80 ／ 下限 0.6）<\/td><\/tr>\n<tr><td>造形サイズ<\/td><td>172.6 x 226.3 x 7.50mm（トレイ 460 x 360）<\/td><\/tr>\n<\/table>\n\n<h3>拡大は、正直に書く<\/h3>\n<p><strong>近くで見ると、花は「赤い柱に星の蓋が載った粒」で、花弁のある花ではない。<\/strong>\n押し出しにはくびれが作れないので、星の形は霜の帽子の中にしか存在しない。題を\n「花は<strong>粒<\/strong>」としたのはそのため。<\/p>\n<p>試して採らなかった手が 2 つ。<strong>［先細り比率］を下げる<\/strong>——上へ行くほど細くなるので\n花とは逆の形になり、霜の帽子まで小さくなる。<strong>［最大高さ］を下げる<\/strong>——「高さも出した\n作品も見たい」という指示と反対向き。動かせたのは霜の量だけで、上 22% → 34% に増やした。<\/p>\n\n<h3>作り直した 1 回に、原因が 3 つ同時にあった<\/h3>\n<ul>\n<li><strong>1. ［星内半径比］0.62 では星に見えない。<\/strong>谷が浅く、ほぼ十二角形。花が「塊」に\n見えていた正体はこれ。0.46 まで下げた。<\/li>\n<li><strong>2. 霜が白い蓋になっていた。<\/strong>(0.98, 0.92, 0.93) で 40% 積むと不透明な白になり、\n下のグラデーションを丸ごと消す。淡い桜色へ落として初めて霜になった。<\/li>\n<li><strong>3. 幹が道に見えていた。<\/strong>格子 6.0mm に対して 11.5mm の幹は舗装された道。\n全部の枝を 0.60 倍（幹 6.9mm・下限 0.8mm）にして、ようやく筆の線になった。<\/li>\n<\/ul>\n\n<h3>残っている懸念<\/h3>\n<p>星の先端は幅がゼロへ向かって細るので、「最小 XY 0.6mm」を満たしているのは\n<strong>アドオンの測り方<\/strong>（<code>2r × min(倍率)<\/code> = 4.80mm）においてであって、先端の実寸では\nない。［星内半径比］0.46 で谷を鈍い楔にし、［上端の丸み］0.62 で先端を丸めて緩和しているが、\n<strong>実機で刷ったら先端がどうなるかは刷るまで分からない。<\/strong><\/p>\n\n<h3>服として<\/h3>\n<p>背中や後ろ身頃のような<strong>大きく平らな面<\/strong>に向く。花の密度が 10% しかないので生地は\nほとんど自由に動き、曲げに抵抗するのは 4.8mm の粒だけ。刷りの枝は生地の伸縮にそのまま\n追従する。<strong>材料の 9 割は刷りが担当していて、造形は 1 割で効かせている。<\/strong>\n作った版: v7.206.0<\/p>","imgs":[{"c":"斜め — 銀の枝と、格子に乗る花","d":"img/94_preview.jpg"},{"c":"真上","d":"img/94_preview_top.jpg"},{"c":"低い角度","d":"img/94_preview_raking.jpg"},{"c":"拡大","d":"img/94_preview_macro.jpg"}]},{"num":"95","title":"襞 — 向きだけで形をつくる","mode":"BRISTLE","path":"docs/samples/95_襞_向きだけで形をつくる","text":"<p class=\"lead\">609枚の平たい板を、盤の上端の外に置いた一点へ向けて扇に開く。\n<strong>変えているのは［要素の向き］ただ1つ<\/strong>——高さも太さも断面も色の決め方も、609枚すべてで\n同じ値。それでも扇が見えるのは、板が薄いので<strong>向きがそのまま形になる<\/strong>から。<\/p>\n<p>もう1つの主題が<strong>透明材<\/strong>で、要（かなめ）から裾へ向かって板が1枚ずつ透明材へ\n入れ替わる。裾では板が消えるのではなく<strong>硝子の板として残る<\/strong>——形は保たれたまま、\n色だけが抜けていく。<\/p>\n\n<h3>透明は「高さで切る」のではなく「板ごと」<\/h3>\n<p>［出どころ］を<strong>画像<\/strong>にしてある（マスクの黒い所が、その場所の<strong>高さ全体<\/strong>に\nわたって透明材）。高さで切る2案は先に作って、どちらも真上から読めなかった。<\/p>\n<table><tr><th>試した案<\/th><th>なぜ駄目だったか<\/th><\/tr>\n<tr><td>下 2.5mm を透明<\/td><td>板でいちばん隠れている面。上からは自分の天面に、横からは\n8.4mm 先の隣の列に塞がれる<\/td><\/tr>\n<tr><td>上 3.0mm を透明<\/td><td>真上から見ると、透明の先端を抜けた視線が<strong>その板自身の\n色付きの胴<\/strong>に当たる。地面まで届かない<\/td><\/tr>\n<\/table>\n<p>入れ替える板は 8x8 のベイヤー行列で選んである。要からの距離を 140〜265mm で 0→1 に\n正規化した値を閾値と比べるだけで、<strong>乱数を使っていない<\/strong>。密度で階調を作るのは、\n繊維のオンブレ／デグラデそのもの。マスクは格子のマスをまるごと塗る——画素ごとの網点に\nすると、アドオンが柱の中心のどこを読むかで別の板が透明になる。<\/p>\n\n<h3>透明の見え方は「画面の中だけ」の色で作ってある<\/h3>\n<p>［クリアの色］を <strong>(0.12, 0.15, 0.24)<\/strong>（生地の鉄紺寄り）、［クリアの濁り］を\n<strong>0.45<\/strong> にしてある。<strong>これは表示専用の値で、書き出しの MTL には一切入らない<\/strong>\n（v7.158.0。<code>BristleClear<\/code> の <code>Kd<\/code> は常に <code>1 1 1<\/code>。クリア材の色は\nGrabCAD Print 側で指定する）。「濃紺の生地の上に置いた透明樹脂を真上から見るとどう\n見えるか」を絵で表すためだけの選択で、造形データはこの値に影響されない。<\/p>\n<p><strong>白のままでは作品が成立しなかった。<\/strong>［クリアの色］の既定は白に近く、\n［高さのグラデーション］の色も 0.880→0.960 と白の側にある。<strong>2つの材が同じ白の帯に居る<\/strong>\nので、濁りをどこへ振っても差が出ない——上げれば色付きと見分けがつかず、下げれば地に沈んで\n<strong>穴が開いたように<\/strong>見える。実測でも濁り 0.26 → 0.80 で動いたのは画素の 20.7%・\n最大 75 階調で、「読める／読めない」の切り替えではなく<strong>濃淡が少し動くだけ<\/strong>だった。\n直したのは濁りではなく<strong>色<\/strong>のほう。<\/p>\n\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><th>なぜ<\/th><\/tr>\n<tr><td>モード<\/td><td>柱（BRISTLE）・格子 21 x 29（609本）<\/td><td>板を1枚ずつ独立に向ける<\/td><\/tr>\n<tr><td>［断面］<\/td><td>四角（CUBE）・倍率 1.00 x 0.22<\/td><td>平たいから、向きが形として読める<\/td><\/tr>\n<tr><td>［要素の向き］<\/td><td><strong>流れに沿う（FLOW）<\/strong><\/td><td>この作例で唯一変わる設定<\/td><\/tr>\n<tr><td>［最大高さ］／［高さを揃える］<\/td><td>9.0mm ／ 入<\/td><td>609枚とも同じ高さ<\/td><\/tr>\n<tr><td>［出どころ］<\/td><td><strong>画像<\/strong>（透明のマスク）<\/td><td>板ごと・全高で透明にする<\/td><\/tr>\n<tr><td>［色］<\/td><td>高さのグラデーション<\/td><td>元画像を色に使わないため<\/td><\/tr>\n<\/table>\n\n<h3>数字（生成）<\/h3>\n<table>\n<tr><td>盤<\/td><td>168.0 x 240.0mm ／ 格子 21 x 29（609本）<\/td><\/tr>\n<tr><td>中心間隔<\/td><td>8.400 / 8.571mm<\/td><\/tr>\n<tr><td>板1枚<\/td><td>7.200 x 1.584 x 9.000mm（縦横比 1.25:1 長い側・<strong>5.68:1 薄い側<\/strong>）<\/td><\/tr>\n<tr><td>すき間<\/td><td>1.200 / 1.371mm（下限 0.6）<\/td><\/tr>\n<tr><td>最小 XY ／ 最大 XY<\/td><td>1.584mm（下限 0.6）／ 7.200mm（上限 15.0）<\/td><\/tr>\n<tr><td>偏角<\/td><td>−161.5° 〜 −18.5°（幅 143.0°）／ 畳み目 48本<\/td><\/tr>\n<tr><td>向きの元の傾き<\/td><td>最小 0.00207・中央値 0.01788（下限 0.002）下限割れ 0.000%<\/td><\/tr>\n<tr><td>透明材<\/td><td><strong>191 / 609 本（31.4%）<\/strong>／ 最上段 0% → 最下段 100%<\/td><\/tr>\n<tr><td>被覆率<\/td><td>15.8%<\/td><\/tr>\n<\/table>\n<p><strong>5.68:1 は、棘ではなく板だから許している。<\/strong>薄い側 1.584mm は造形の下限 0.6mm の\n2.6倍あり、長い側は 7.2mm ある。倒れる向きの断面が広いので、細い柱の 5.68:1 とは別物。\nこれが板でなければこの作例は成立しない——向きが形として読めるのは、平たいからそのもの。<\/p>\n\n<h3>残っている粗さ<\/h3>\n<ul>\n<li><strong>1. 畳み目の折り返し線に、隣と90°違う板が5〜15枚ある。<\/strong>向きを作っている場は\n鋸歯で、48本ある折り返しの線の上にたまたま乗った板が隣と揃わない。三角波にすれば連続に\nなるが、今度は山と谷で傾きがゼロになって<strong>帯ごと<\/strong>下限（0.002）を割る。畳み目を減らす案も\n測ってあり、24本では余裕が 1.03倍しかない（48本で 3.12倍）。<strong>鋸歯を選ぶのが正しい<\/strong>と\n判断して残している。<\/li>\n<li><strong>2. 拡大すると硝子には見えない。<\/strong>透過も奥行きも無い、色の濃い板に見える。真上では\n「藍の生地の上の透明樹脂」として正しく読めるが、低い角度で寄ると読みが変わる。プレビューの\n材質（Mix Shader 1枚）の限界で、そう見えることを承知のうえで採っている。<\/li>\n<li><strong>3. アドオンが「柄が細かい」と警告する。<\/strong>正しい警告だが<strong>この作例には当たらない<\/strong>——\n元画像は色にも高さにも使っておらず、［要素の向き］の向きを決めるためだけに読ませているので、\n「柄の細部が丸められる」ことは起きようがない。<\/li>\n<\/ul>\n\n<h3>服として<\/h3>\n<p>裾や袖口のような<strong>縁<\/strong>に向く。被覆率 15.8% なので生地はほとんど自由に動き、\n曲げに抵抗するのは 7.2mm の板だけ。しかもその板は<strong>1方向にだけ薄い<\/strong>ので、\n扇の向きに沿った折りには柔らかく、直交する向きには硬い——<strong>向きが機能にもなる。<\/strong>\n色が抜けていく裾は、そのまま生地の終わりに見える。\n作った版: v7.206.0<\/p>","imgs":[{"c":"斜め — 白から硝子へ、扇が溶ける","d":"img/95_preview.jpg"},{"c":"真上","d":"img/95_preview_top.jpg"},{"c":"低い角度","d":"img/95_preview_raking.jpg"},{"c":"拡大","d":"img/95_preview_macro.jpg"}]},{"num":"96","title":"銀杏の霞 — 三筋の帯で葉が硝子になる","mode":"BRISTLE","path":"docs/samples/96_銀杏の霞_三筋の帯で葉が硝子になる","text":"","imgs":[{"c":"斜め","d":"img/96_preview.jpg"}]},{"num":"97","title":"マトラッセ — 縫い目の谷が硝子になる","mode":"BRISTLE","path":"docs/samples/97_マトラッセ_縫い目の谷が硝子になる","text":"<p class=\"lead\">総柄のダマスクを刷った生地の上に、マトラッセ（絎刺し）の絎（ぐ）けを3Dで立てる。\n菱形の膨らみが真珠色の粒として盛り上がり、<strong>縫い目の谷に落ちた粒だけが透明材<\/strong>になって、\n下のダマスクがそこだけ素通しになる。<\/p>\n<table><tr><th>主題<\/th><td>総柄プリントの上に3Dを重ねて、印象を引き上げる<\/td><\/tr>\n<tr><th>3Dが担う<\/th><td>起伏（絎け）・粒の触感・硝子の谷<\/td><\/tr>\n<tr><th>2Dが担う<\/th><td>柄そのもの（ダマスク）。生地全体に均一に刷ってある<\/td><\/tr>\n<\/table>\n\n<h3>この作例は「位置を合わせない」<\/h3>\n<p>2Dと3Dを組み合わせる作例を先に3件（92・93・94）作ったが、あれは<strong>下の柄の特定の場所を\n狙って3Dを載せる<\/strong>設計だった。利用者から次の情報をもらって、その前提が成り立たないことが\n分かっている——「実際には3Dプリント行う際に2Dプリントの位置を正確に図る術はなく、ぴったり狙った\n位置に3Dプリントをすることは厳しい」。3Dプリントは<strong>裁断前の大きな生地<\/strong>に行うので、\n刷られた柄の座標を3Dの側から読む手立てが無い。<\/p>\n<p>だからこの作例は判定の基準を1つ決めた——<strong>「この3Dを生地の上で 30mm ずらしても、作品として\n成立するか」<\/strong>。成立する。菱形の格子は 50.4mm 周期で全面に続き、ダマスクも全面に続くので、\nどこで重なっても「総柄の上に絎けが乗っている」という関係は変わらない。<strong>2つの柄が互いの位置を\n知らないまま重なることが、この設計の前提そのもの。<\/strong><\/p>\n\n<h3>透明は「高さで切る」のではなく「平面の位置で」<\/h3>\n<p>［出どころ］を<strong>画像<\/strong>にしてある（マスクの黒い所が、その場所の<strong>高さ全体<\/strong>に\nわたって透明材）。高さで切ると全部の柱の天面が一律に透明になるだけで、「縫い目の谷だけが硝子」には\nならない。<\/p>\n<p><strong>マスクは連続した場として書く。格子のマスは塗らない。<\/strong>透明の領域は柱 1.6 本ぶんの幅を\n持つ帯なので、境目に乗った柱がどちらへ倒れても絵は変わらない。しかも配置がレンガ（1行おきに半ピッチ\nずれる）なので、マスを塗る方式はそもそも当てにできない。<\/p>\n<p>［クリアの色］は <strong>(0.82, 0.86, 0.90)<\/strong>、［クリアの濁り］は <strong>0.15<\/strong>。\n<strong>どちらも表示専用で、書き出しの MTL には入らない<\/strong>（v7.158.0。<code>BristleClear<\/code> の\n<code>Kd<\/code> は常に <code>1 1 1<\/code>。クリア材の色は GrabCAD Print 側で指定する）。<\/p>\n\n<h3>数字<\/h3>\n<table>\n<tr><td>盤<\/td><td>252.0 x 336.0mm ／ 格子 46 x 61（2806本・レンガ配置）<\/td><\/tr>\n<tr><td>中心間隔<\/td><td>5.600 / 5.600mm ／ 直径 4.00mm → すき間 1.600mm（下限 0.6）<\/td><\/tr>\n<tr><td>外形<\/td><td>258.8 x 340.0mm（トレイ 460 x 360）／ 実測 256.0 x 340.0 x 3.20mm<\/td><\/tr>\n<tr><td>高さ<\/td><td>1.02 〜 3.20mm（比 0.320 〜 1.000）<\/td><\/tr>\n<tr><td>縦横比<\/td><td><strong>0.80:1<\/strong>（高さ 3.20mm ÷ 直径 4.00mm）<\/td><\/tr>\n<tr><td>被覆率<\/td><td>40.1%<\/td><\/tr>\n<tr><td>透明材<\/td><td><strong>839 / 2806 本（29.9%）<\/strong><\/td><\/tr>\n<tr><td>絎けの周期<\/td><td>50.4mm（＝柱9本）／ いちばん細かい繰り返し 25.20mm ＝ 柱 4.50 本<\/td><\/tr>\n<\/table>\n<p><strong>縦横比 0.80:1 は、これまでの作例と逆向きに振ってある。<\/strong>本部から「低くて太い粒で面を\n埋め、面そのものを触感として見せる」という方向のヒントをもらっていて、これはその答え。高さより直径の\nほうが大きい柱は、この作例室では初めて。<\/p>\n\n<h3>作り直した3点（1回目は失敗している）<\/h3>\n<table><tr><th>症状<\/th><th>原因<\/th><th>直し方<\/th><\/tr>\n<tr><td>絵が上下逆。縫い目が盛り上がり、菱形の頂きが凹む<\/td><td>柱モードの既定は<strong>暗いほど高い<\/strong>。\n元画像は高さの比をそのまま明るさで書いている<\/td><td><code>invert_brightness: true<\/code><\/td><\/tr>\n<tr><td>低い柱がほぼ真っ黒。キルティングではなく白黒の網点ノイズに見える<\/td><td>［高さのグラデーション］\nの色を <strong>0〜1 に並べていた<\/strong><\/td><td>実際に出る比の範囲へ並べ直す<\/td><\/tr>\n<tr><td>斜めから見ると下のダマスクがまったく見えない<\/td><td>直径 4.8mm・被覆率 57.7%<\/td>\n<td>直径 4.0mm・被覆率 40.1%・すき間 1.6mm<\/td><\/tr>\n<\/table>\n<p><strong>2つ目がこの作例でいちばん効いた。<\/strong>［高さのグラデーション］に［柱ごと］を立てると、色は\n<strong>その柱の高さの比<\/strong>で引かれる。ここは比が 0.32〜1.00 にしか出ないので、<strong>配色表は\nその範囲へ並べないと、使われない側に色を置いたことになる<\/strong>。1回目は 0.45 に\n<code>[0.075, 0.085, 0.115]<\/code> という黒に近い色を置いていて、比 0.50 の柱はそこと 0.70 の色の間を\nt=0.2 で補間して <code>[0.126, 0.133, 0.154]<\/code>——ほぼ黒になっていた。0.00 と 0.45 の停止点は\n<strong>一度も直接は引かれないのに、すぐ隣にあるせいで結果を決めていた。<\/strong><\/p>\n\n<h3>撮り方も2つ直した<\/h3>\n<p><strong>斜光の方位は 0°<\/strong>（画面の上下方向）。45° で撮ると縫い目の片方の族と光が平行になって、\n格子が半分しか読めない——1回目はそれで撮ってしまい、「菱形が読めない」を<strong>設計の失敗と\n読み違えた<\/strong>。<strong>逆光の仰角は 28°<\/strong>（既定は 78°）。天面が広くて平らな柱は、高い逆光を\n低いカメラへそのまま跳ね返して真っ白に飛ぶ。道具の説明文が書いている 48° でもまだ飛んだ。<\/p>\n\n<h3>残っている粗さ<\/h3>\n<ul>\n<li><strong>1. 菱形の起伏は、真上からは読めない。<\/strong><code>render_top.py<\/code> は仰角 62° と 45° の\n太陽を2つ使うので、柱の天面は高さに関わらずほぼ同じ明るさで照らされる。主題の半分（絎けの起伏）は\n低い角度の1枚でしか読めない。<strong>道具の性質であって不具合ではないが、真上の1枚だけを見て\n「平らだ」と判断されうる。<\/strong><\/li>\n<li><strong>2. 生地が Z −8.30 〜 −0.01 に広がる。<\/strong>［生地の厚み］は 1.0mm に設定してあるのに、\n板の下に 8.3mm の立体がある。見た目には出ないので作例としては問題ないが、正常なのかどうか作例室では\n判断できないので<strong>報告として本部へ上げる<\/strong>（他の作例でも同じことが起きているはず）。<\/li>\n<\/ul>\n\n<h3>服として<\/h3>\n<p>身頃や襟のような<strong>面<\/strong>に向く。被覆率 40.1% で粒は低く太いので、生地は曲がる方向を選ばず\n動く——棘のように1方向へ突っ張らない。そして総柄が全面に抜けるので、<strong>離れれば2Dのダマスク、\n近づけば3Dの絎け<\/strong>という2段の読みになる。3Dが柄を隠すのではなく、柄に光沢と起伏を足す側に\n回っている。生地の柄は Codex の画像生成（<code>codex-imagegen<\/code>）で、色を3つに限って作った。\n作った版: v7.210.0<\/p>","imgs":[{"c":"斜め — 総柄のダマスクの上に、真珠色の絎けが立つ","d":"img/97_preview.jpg"},{"c":"真上","d":"img/97_preview_top.jpg"},{"c":"低い角度","d":"img/97_preview_raking.jpg"},{"c":"拡大","d":"img/97_preview_macro.jpg"}]},{"num":"98","title":"駝鳥 — 粒がひとつずつ小片になる","mode":"SURFACE","path":"docs/samples/98_駝鳥_粒がひとつずつ小片になる","text":"<p class=\"lead\">面モード。オーストリッチ（駝鳥革）のクイルマーク——羽根を抜いた跡が 一つずつ盛り上がって、隣とわずかな谷で仕切られる、あの粒立ちを刷る。<\/p>\n<p>これまでの 88 件は<strong>絵・柄・情景<\/strong>を扱ってきた。ここで欲しかったのは そのどれでもなく、<strong>素材そのものの再現<\/strong>——「何かの模様を面に載せる」 のではなく、「革という素材が、どうしてああ見えるのか」を高さで書く。<\/p>\n<h3>何を作りたかったか<\/h3>\n<p>駝鳥革の粒は、規則正しい水玉ではない。<\/p>\n<ul><li><strong>大きさが揃っていない。<\/strong> 首に近いほど小さく、背にいくほど大きい。<\/li><li><strong>並びも揃っていない。<\/strong> 六角格子のように見えて、実際は不規則。<\/li><li><strong>粒と粒は接している。<\/strong> 離れた点ではなく、隣り合う小片が谷で 仕切られている。ボロノイそのものの形。<\/li><li><strong>頂きに孔がひとつある。<\/strong> 羽根が生えていた跡。粒ごとに1点だけ、 光が乗る。<\/li><\/ul>\n<p>だから<strong>ボロノイの小片を自分で作り、そのアルファを元データに焼く。<\/strong> アドオンの［面を分割する］（VORONOI）は使っていない——あれは面を 割る道具で、ここで欲しいのは「最初から小片として在る」形。<\/p>\n<h3>測った数字<\/h3>\n<table><tr><td>板<\/td><td>240 × 320mm<\/td><\/tr><tr><td>元データ<\/td><td>960 × 1280px（4 px/mm）<\/td><\/tr><tr><td>小片<\/td><td>679 枚<\/td><\/tr><tr><td>平均の差し渡し<\/td><td>9.91mm（最大 11.01mm）<\/td><\/tr><tr><td>被覆<\/td><td>68.6%（残りは谷＝生地が覗く）<\/td><\/tr><tr><td>高さ<\/td><td>0.90 〜 4.50mm（押し出し 0.9 ＋ 高さマップ 3.6）<\/td><\/tr><tr><td>縦横比<\/td><td>0.45 : 1（高さ ÷ 差し渡し）<\/td><\/tr><tr><td>いちばん大きい要素<\/td><td>11 × 11mm（上限 15mm に対し OK）<\/td><\/tr><\/table>\n<p>アドオンの報告も同じ——実際の造形範囲 240.0 × 320.0 × 4.50mm、 いちばん大きい要素 11×11mm。<strong>警告は1本も出ない。<\/strong><\/p>\n<p>縦横比 0.45:1 は、これまで繰り返し指摘された「細く高い棘」の逆側。 駝鳥の粒は<strong>平たい枕<\/strong>なので、これでよい。<\/p>\n<h3>決めたこと<\/h3>\n<p><strong>段数は 0。<\/strong> ［高さの段数］を入れると枕の丸みが等高線になる。革は 段でできていない。<\/p>\n<p><strong>クリア材は使っていない。<\/strong> 革は透けない。J850 の強みだからといって、 題材が要求していない所で使わない。<\/p>\n<p><strong>枕の丸みは、小片ごとに正規化する。<\/strong> 小片は差し渡し 6〜11mm と ばらつくので、丸みを mm で書くと<strong>大きい小片ほど肩がなだらかになる<\/strong>。 <code>U_FLAT = 0.15<\/code>（その小片自身の最大距離に対する比）で書けば、 どの小片も同じ枕の形・同じ傾きになる。<\/p>\n<p><strong>肩は smoothstep ではなく直線で、約 43°。<\/strong> 理由は次の節。<\/p>\n<h3>捨てた作り方（4つ）<\/h3>\n<p><strong>1. 33° の円錐。<\/strong> <code>normal.z = 0.838<\/code> で、アドオンの <code>top_thr = 0.85<\/code> から <strong>0.012 しか離れていない<\/strong>。粒立ちのノイズが個々の面をその境目の 両側へ跳ね飛ばすので、<strong>横縞<\/strong>が出る。閾値を「跨いだかどうか」ではなく <strong>どれだけ余裕があるか<\/strong>で見る必要があった。<\/p>\n<p><strong>2. <code>GRAIN = 0.02<\/code> の粒立ち。<\/strong> 頂きの1マスだけがフラット陰影へ跳ね、 <strong>白い四角の紙吹雪<\/strong>になった。高さにして 0.03mm ——刷れば読めない量 なのに、絵の上では致命的。<\/p>\n<p><strong>3. 粗い格子を 8 倍に拡大した粒立ち。<\/strong> 2mm の斑になり、双一次補間の 面が<strong>山形（シェブロン）<\/strong>として読めた。<\/p>\n<p><strong>4. 羽軸孔を広げる（<code>DIMPLE_R<\/code> 0.75 → 1.15 / <code>DIMPLE_D<\/code> 0.13 → 0.17）。<\/strong> 頂きが「平らな輪 ＋ 四角い穴」になり、<strong>育った革ではなく型で抜いた部品<\/strong> に見えた。同心の段もうっすら戻った。0.75 / 0.13 へ戻し、道具の コメントに「これは試して駄目だった」と書いてある。<\/p>\n<p>孔は最終解像度 1024（1マス 0.31mm）では<strong>半径 2.4 マスしかなく、丸では なく小さな四角い光として写る。それでよい<\/strong>——孔は読ませる対象ではなく、 枕ひとつに1点だけ光が乗るための印。<\/p>\n<h3>色が出なかった話（アドオンの仕組み）<\/h3>\n<p>革の色を 2 回暗くしても、レンダーの画素が<strong>1つも変わらなかった<\/strong>。 緑の当てを入れて突き止めた原因はこう。<\/p>\n<p>面モードは <code>top_thr = 0.85<\/code> を<strong>二役で使っている<\/strong>。ひとつは フラット陰影とスムーズ陰影の切り分け、もうひとつは <strong>［側面の色］がテクスチャか単色かの切り分け<\/strong>。<code>normal.z &gt; 0.85<\/code> ＝ 水平から約 32° 以内の面だけが「上面」で、それより急な面は全部 「側面」になる。<\/p>\n<p>この作例の肩は約 43°（<code>normal.z ≈ 0.73<\/code>）。<strong>捨てた作り方 1 の縞を 避けるために肩を急にしたことが、そのまま「テクスチャが1枚も届かない」 という結果になっていた。<\/strong> ［側面の色］を［テクスチャ］にして解決。<\/p>\n<p><strong>これは不具合ではなく仕様<\/strong>だが、画面のどこにも書かれていない。 別途、報告に出す。<\/p>\n<p>なお<strong>この経緯のせいで、革の色 <code>LEATHER = 0.095<\/code> を決めた実験は 対照になっていない<\/strong>——側面の単色を見ながら 2 回下げた値なので。 出来上がりは正しく見えるが、比べて選んだ値ではない。<\/p>\n<h3>白飛びを疑って、測って外した<\/h3>\n<p>頂きの淡い光を「飛んでいる」と疑って画素を数えた。<\/p>\n<p>250 以上: 0.000%   240 以上: 0.000%   上位 0.1% の明るさ: 184<\/p>\n<p><strong>1画素も飛んでいない。<\/strong> 淡いのは本物の縁の光で、実物の駝鳥革も そう光る。<strong>疑ったら測る<\/strong>——「明るいから飛んでいる」は目の錯覚だった。<\/p>\n<h3>3枚の絵についての、私の評価<\/h3>\n<p><strong>真上（<code>preview_top.jpg<\/code>）。<\/strong> 駝鳥として読める。粒の分布が不規則で、 色は落ち着いたオックスブラッド、枕ひとつに明るい点がひとつ乗る。 写真と並べても違和感が少ない、この作例のいちばん良い1枚。<\/p>\n<p><strong>寄り（<code>preview_macro.jpg<\/code>・span 58mm）。<\/strong> 縞も紙吹雪も無く、肩が 滑らかに繋がった、キルティングのような革の面。谷に生地が見えるので 「粒が離れて浮いている」のではなく「小片が敷き詰まっている」と 読める。作りたかったものが、いちばん正確に出ている。<\/p>\n<p><strong>斜め（<code>preview_raking.jpg<\/code>・仰角 26°）。<\/strong> 起伏は読めるが、<strong>全体に 暗い。<\/strong> 最初 10° で撮ったらほぼ真っ黒だった——0.095 の暗い革は かすめ光をほとんど返さない。26° まで上げて実用になった。それでも この作例は「明るく見せる」題材ではないので、暗さ自体は design のうち だと考えている。<\/p>\n<p><strong>総じて合格。<\/strong> 素材の再現という新しい方向で、粒の不規則さ・ 枕の形・孔の光の3つが揃った。惜しいのは斜めからの絵が弱いことで、 これは題材の色が暗いことに由来する。<\/p>","imgs":[{"c":"斜め","d":"img/98_preview.jpg"},{"c":"真上","d":"img/98_preview_top.jpg"},{"c":"かすめ光","d":"img/98_preview_raking.jpg"},{"c":"拡大","d":"img/98_preview_macro.jpg"}]},{"num":"99","title":"六つ目 — 籐を編む","mode":"SURFACE","path":"docs/samples/99_六つ目_籐を編む","text":"<p class=\"lead\">面モード。六つ目編み（三軸編み・kagome）を刷る。籐（ラタン）の平たい 削ぎ板が三方向から重なり、六角の目と三角の隙間が開く、あの籠の面。<\/p>\n<p>98 の駝鳥に続いて<strong>素材そのものの再現<\/strong>を狙った2件目。ただし駝鳥が 「一枚の革の表情」だったのに対し、こちらは<strong>構造そのものが柄<\/strong>になる。 編みは絵ではない——上下の重なりの規則があって、その規則が形を決める。<\/p>\n<h3>三軸編みの規則<\/h3>\n<p>帯を3方向（90°・210°・330°）に走らせる。この3本の法線は<strong>足すと ちょうど 0<\/strong> になるので、位相を揃えると3本が<strong>1点で交わる<\/strong>。 三重点では編めない——3本が同じ場所で上下を主張する。<\/p>\n<p>当ては、3族とも<strong>同じ位相 1/6 だけずらす<\/strong>こと。すると i と j が 交わる所で3番目の族の中心は 0.500P 離れ、帯の届く範囲の外に出る。 交点は必ず<strong>2本ずつ<\/strong>になり、その間に三角の目が開く。（位相 0 と 1/3 はどちらもずれ 0.000P で三重点に戻る。条件は φ0+φ1+φ2 ∉ ℤ で、 和が 0.5 がいちばん綺麗に離れる。）<\/p>\n<p>上下は<strong>巡回の順序ひとつ<\/strong>で決まる。族0が族1の上、族1が族2の上、 族2が族0の上。1本の帯に沿って交点は他の2族と交互に現れるので、 この巡回だけで<strong>上・下・上・下<\/strong>が自動的に並ぶ。交点ごとの状態も、 偶奇の表も要らない。<\/p>\n<p><strong>捨てた規則を2つ、道具の説明文に残してある<\/strong>（次に読む人が試し直さない ように）。<\/p>\n<ul><li><code>t = (m0+m1+m2) mod 3<\/code> — s0+s1+s2 = 0 なので<strong>1本の帯に沿って 一定<\/strong>になり、1つの族が端から端まで上に居座る。<\/li><li>2本ずつの偶奇 <code>(m_i + m_j)<\/code> — 2つの偶奇が別々に動くので「下、下」が 続き、隣り合う切れ目が繋がって帯が砕ける。<\/li><\/ul>\n<h3>編みは、この工程では必ず小片になる<\/h3>\n<p>本当に編むには帯が<strong>下をくぐる<\/strong>必要があり、くぐるにはオーバーハングが 要る。この工程はそれを禁じている。だから<strong>くぐる所で帯を切る<\/strong>のが唯一の 正しい実現で、その結果は必然的に<strong>ばらばらの小片のモザイク<\/strong>になる。<\/p>\n<p>離れて見れば格子は編みに見え、寄れば並んだ板に見える。これは生成器の 欠陥ではなく、<strong>この工程でこの柄をやると必ずこうなる<\/strong>という限界。 切れ目の間隔は P/sin60° で、1回の切除が食うのは (W+2·GAP)/sin60° なので、 生き残る小片は 15mm の上限を割らない。<\/p>\n<h3>測った数字<\/h3>\n<table><tr><td>板<\/td><td>240 × 320mm<\/td><\/tr><tr><td>元データ<\/td><td>1440 × 1920px（6 px/mm）<\/td><\/tr><tr><td>帯の間隔 P<\/td><td>15.0mm<\/td><\/tr><tr><td>籐片の幅 W<\/td><td>6.0mm<\/td><\/tr><tr><td>小片<\/td><td>931 枚<\/td><\/tr><tr><td>被覆<\/td><td>61.5%（残りが六角と三角の目）<\/td><\/tr><tr><td>いちばん長い辺<\/td><td>中央値 12.17mm・最大 13.50mm<\/td><\/tr><tr><td>いちばん大きい要素<\/td><td>7.8 × 13.5mm（上限 15mm に対し 1.5mm の余裕）<\/td><\/tr><tr><td>いちばん細い小片<\/td><td>1.67mm（下限 0.6mm に対し OK）<\/td><\/tr><tr><td>高さ<\/td><td>0.50 〜 0.85mm（押し出し 0.5 ＋ 高さマップ 0.35）<\/td><\/tr><tr><td>縦横比<\/td><td><strong>0.14 : 1<\/strong><\/td><\/tr><\/table>\n<p><strong>間隔は 16.0 から 15.0 へ詰めた。<\/strong> 16.0 のときの最大の小片は 14.67mm で、上限まで 0.33mm しか無い。柄を少し密にするだけで 1.5mm の余裕が取れる。<\/p>\n<p><strong>縦横比 0.14 : 1 は、この作例でいちばん意識した数字。<\/strong> 作例は 繰り返し「細く高い棘」へ寄る癖があるので、ここでは逆に振り切った ——籐の削ぎ板は幅 6mm・厚み 0.85mm の、<strong>平たい板<\/strong>そのもの。<\/p>\n<h3>平らに見せるには、幅のほうを変えるしかなかった<\/h3>\n<p>最初は幅 4mm・高さ 1.2mm で組んだ。寄って撮ると、板ではなく <strong>膨らんだ座布団<\/strong>に見える。原因は断面の形ではなく<strong>陰影<\/strong>で、 アドオンは面の法線の z が 0.85 以下の面をスムーズシェードにする。 つまり水平から 31.8° より急な肩は必ず滑らかに繋がり、天面と 連続して<strong>ドームに読める<\/strong>。<\/p>\n<p>設定でどうにかなる話ではない。幅 6mm・高さ 0.85mm——本物の籐の 比率にしたら、肩がその角度より寝て、平らな板として読めるようになった。 <strong>直し方は数値の調整ではなく、比率そのものだった。<\/strong><\/p>\n<p><code>FLAT_U<\/code> を 0.70 → 0.97 にして縁を立てたのも同じ回。天面が 本当に平らな削ぎ板になる。<\/p>\n<h3>透明材は使わなかった<\/h3>\n<p>籐の艶を透明の薄い外皮（0.3mm）で出そうとしたが、<strong>霞んで見える<\/strong> だけで艶にならなかった。厚み 0.85mm の板に 0.3mm の外皮は、 比率として厚すぎる。J850 の強みではあるが、<strong>この素材には合わない<\/strong> と判断して落とした。<\/p>\n<h3>自分の評価<\/h3>\n<p><strong>真上と斜めは、狙ったとおり。<\/strong> 三角と六角の目が正しく開き、 斜めからは上下の重なりが影で読める。籠の面として通る。<\/p>\n<p><strong>寄りは、正直に言って完全ではない。<\/strong> 板そのもの（平らな天面、 籐の色、目から覗く生地）は良いが、<strong>背の高いほうの側壁に細かい 櫛歯が出る。<\/strong> 実寸では 0.35mm の段の側面なので、刷った物を手に 持って見える傷ではないと思うが、寄りの絵では目に付く。<\/p>\n<p>これは元データ側の問題ではない。次の5つを振って<strong>どれも1画素も 変わらなかった<\/strong>。<\/p>\n<table><tr><th>振ったもの<\/th><th>結果<\/th><\/tr><tr><td>元データの解像度 6 → 15 px/mm<\/td><td>変わらない<\/td><\/tr><tr><td>面の解像度 1024 → 2048<\/td><td>変わらない<\/td><\/tr><tr><td>先細り 0.93 → 1.00（垂直の壁）<\/td><td>変わらない<\/td><\/tr><tr><td>側面の色 テクスチャ → 単色<\/td><td>変わらない<\/td><\/tr><tr><td>上端の丸み 0.12 → 0.00mm<\/td><td>変わらない<\/td><\/tr><tr><td>段のぼかし 1回 → 3回（ほぼガウス）<\/td><td>変わらない<\/td><\/tr><\/table>\n<p>しかも歯の一部は<strong>天面より上へ出ている<\/strong>。階段状の量子化では そうならない。格子に対して斜めに走る境目の、<strong>高いほうの壁だけ<\/strong>に 出る。アドオン側の話として本部へ報告した。<\/p>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_99.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/99_六つ目_籐を編む --final --render<\/pre>","imgs":[{"c":"斜め","d":"img/99_preview.jpg"},{"c":"真上","d":"img/99_preview_top.jpg"},{"c":"かすめ光","d":"img/99_preview_raking.jpg"},{"c":"拡大","d":"img/99_preview_macro.jpg"}]},{"num":"100","title":"ロックスタッド — 交点の鋲が硝子になる","mode":"BRISTLE","path":"docs/samples/100_ロックスタッド_交点の鋲が硝子になる","text":"","imgs":[{"c":"斜め","d":"img/100_preview.jpg"},{"c":"真上","d":"img/100_preview_top.jpg"},{"c":"かすめ光","d":"img/100_preview_raking.jpg"},{"c":"拡大","d":"img/100_preview_macro.jpg"}]}]</script>
<script>
(function(){
"use strict";
var ROWS = JSON.parse(document.getElementById("data").textContent);
var byNum = {};
ROWS.forEach(function(r){
  byNum[r.num] = r;
  var d = document.createElement("div");
  d.innerHTML = r.text || "";
  r._s = (r.num + " " + r.title + " " + r.path + " " + (d.textContent || "")).toLowerCase();
});
var NOTES = {};
var REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var state = {mode: "all", sort: "asc", q: ""};

/* ---------- カードの一覧 ---------- */
var grid = document.getElementById("grid");
var empty = document.getElementById("empty");
var cards = {};

function makeCard(r){
  var b = document.createElement("button");
  b.className = "card";
  b.type = "button";
  var shot = document.createElement("div");
  shot.className = "shot";
  r.imgs.forEach(function(im, i){
    var el = document.createElement("img");
    el.src = im.d;
    el.alt = i === 0 ? (r.title + " " + im.c) : "";
    el.loading = "lazy";
    if (i === 0) el.className = "on";
    shot.appendChild(el);
  });
  var cap = document.createElement("div");
  cap.className = "cap";
  cap.textContent = r.imgs.length ? r.imgs[0].c : "";
  shot.appendChild(cap);
  if (r.imgs.length > 1){
    var t = document.createElement("div");
    t.className = "ticks";
    r.imgs.forEach(function(_, i){
      var dot = document.createElement("i");
      if (i === 0) dot.className = "on";
      t.appendChild(dot);
    });
    shot.appendChild(t);
  }
  b.appendChild(shot);

  var body = document.createElement("div");
  body.className = "cbody";
  var row = document.createElement("div");
  row.className = "crow";
  var n = document.createElement("span");
  n.className = "cnum";
  n.textContent = r.num;
  var c = document.createElement("span");
  c.className = "chip " + (r.mode === "SURFACE" ? "surface" : "pillar");
  c.textContent = r.mode === "SURFACE" ? "面モード" : "柱モード";
  var st = document.createElement("span");
  st.className = "cstar";
  row.appendChild(n);
  row.appendChild(c);
  row.appendChild(st);
  var h = document.createElement("h3");
  h.textContent = r.title;
  var mm = document.createElement("p");
  mm.className = "cmemo";
  mm.hidden = true;
  body.appendChild(row);
  body.appendChild(h);
  body.appendChild(mm);
  b.appendChild(body);

  b._shot = shot;
  b._cap = cap;
  b._star = st;
  b._memo = mm;
  b._imgs = r.imgs;
  b.addEventListener("click", function(){ open(r.num); });
  if (!REDUCED && r.imgs.length > 1){
    b.addEventListener("mouseenter", function(){ play(b); });
    b.addEventListener("focus", function(){ play(b); });
    b.addEventListener("mouseleave", function(){ stop(b); });
    b.addEventListener("blur", function(){ stop(b); });
  }
  return b;
}

var timer = null, playing = null;
function frame(b, i){
  var imgs = b._shot.querySelectorAll("img");
  var ticks = b._shot.querySelectorAll(".ticks i");
  for (var k = 0; k < imgs.length; k++) imgs[k].classList.toggle("on", k === i);
  for (var j = 0; j < ticks.length; j++) ticks[j].classList.toggle("on", j === i);
  b._cap.textContent = b._imgs[i].c;
}
function play(b){
  if (playing && playing !== b) stop(playing);
  playing = b;
  var i = 0;
  clearInterval(timer);
  timer = setInterval(function(){
    i = (i + 1) % b._imgs.length;
    frame(b, i);
  }, 1100);
}
function stop(b){
  clearInterval(timer);
  timer = null;
  if (playing === b){ frame(b, 0); playing = null; }
}

function visible(){
  var q = state.q.trim().toLowerCase();
  return ROWS.filter(function(r){
    if (state.mode === "BRISTLE" || state.mode === "SURFACE"){
      if (r.mode !== state.mode) return false;
    } else if (state.mode === "star"){
      var n = NOTES[r.num];
      if (!n || !(n.star > 0)) return false;
    }
    return !q || r._s.indexOf(q) >= 0;
  }).sort(function(a, b){
    // 番号は数として比べる。字で比べると "100" が "01" の隣へ来る。
    var d = (+a.num) - (+b.num);
    return state.sort === "asc" ? d : -d;
  });
}
function draw(){
  if (playing) stop(playing);
  var rows = visible();
  grid.textContent = "";
  rows.forEach(function(r){
    if (!cards[r.num]) cards[r.num] = makeCard(r);
    grid.appendChild(cards[r.num]);
    paintNote(r.num);
  });
  empty.hidden = rows.length > 0;
  document.getElementById("count").textContent =
    rows.length === ROWS.length ? ROWS.length + " 件"
                                : rows.length + " / " + ROWS.length + " 件";
}
function paintNote(num){
  var b = cards[num];
  if (!b) return;
  var n = NOTES[num] || {};
  var s = "";
  for (var i = 0; i < (n.star || 0); i++) s += "★";
  b._star.textContent = s;
  b._memo.textContent = n.memo || "";
  b._memo.hidden = !n.memo;
}

document.getElementById("fmode").addEventListener("click", function(e){
  var t = e.target.closest("button");
  if (!t) return;
  state.mode = t.dataset.v;
  [].forEach.call(this.querySelectorAll("button"), function(x){
    x.setAttribute("aria-pressed", String(x === t));
  });
  draw();
});
document.getElementById("fsort").addEventListener("click", function(e){
  var t = e.target.closest("button");
  if (!t) return;
  state.sort = t.dataset.v;
  [].forEach.call(this.querySelectorAll("button"), function(x){
    x.setAttribute("aria-pressed", String(x === t));
  });
  draw();
});
var qt = null;
document.getElementById("q").addEventListener("input", function(){
  var v = this.value;
  clearTimeout(qt);
  qt = setTimeout(function(){ state.q = v; draw(); }, 140);
});

/* ---------- 1件の詳細 ---------- */
var detail = document.getElementById("detail");
var openNum = null, lastFocus = null;

function order(){ return visible().map(function(r){ return r.num; }); }

function open(num){
  var r = byNum[num];
  if (!r) return;
  if (!openNum) lastFocus = document.activeElement;
  openNum = num;
  var seq = order(), at = seq.indexOf(num);
  detail.textContent = "";

  var head = document.createElement("div");
  head.className = "dhead";
  var hn = document.createElement("span");
  hn.className = "num";
  hn.textContent = r.num;
  var h2 = document.createElement("h2");
  h2.textContent = r.title;
  var hc = document.createElement("span");
  hc.className = "chip " + (r.mode === "SURFACE" ? "surface" : "pillar");
  hc.textContent = r.mode === "SURFACE" ? "面モード" : "柱モード";
  var hp = document.createElement("span");
  hp.className = "path";
  hp.textContent = r.path;
  var nav = document.createElement("span");
  nav.className = "dnav";
  var prev = document.createElement("button");
  prev.textContent = "← 前";
  prev.disabled = at <= 0;
  var next = document.createElement("button");
  next.textContent = "次 →";
  next.disabled = at < 0 || at >= seq.length - 1;
  var cls = document.createElement("button");
  cls.textContent = "閉じる";
  prev.addEventListener("click", function(){ step(-1); });
  next.addEventListener("click", function(){ step(1); });
  cls.addEventListener("click", close);
  nav.appendChild(prev); nav.appendChild(next); nav.appendChild(cls);
  head.appendChild(hn); head.appendChild(h2); head.appendChild(hc);
  head.appendChild(hp); head.appendChild(nav);
  detail.appendChild(head);

  var sheet = document.createElement("div");
  sheet.className = "sheet";
  var figs = document.createElement("div");
  figs.className = "figs";
  r.imgs.forEach(function(im){
    var f = document.createElement("figure");
    var g = document.createElement("img");
    g.src = im.d;
    g.loading = "lazy";
    g.decoding = "async";
    g.alt = r.title + " " + im.c;
    var c = document.createElement("figcaption");
    c.textContent = im.c;
    f.appendChild(g);
    f.appendChild(c);
    figs.appendChild(f);
  });
  var text = document.createElement("div");
  text.className = "text";
  if (r.text) {
    text.innerHTML = r.text;
  } else {
    var p = document.createElement("p");
    p.className = "none";
    p.textContent = "この作例の説明文（README）はまだありません。設定と画像は " + r.path + " にあります。";
    text.appendChild(p);
  }
  sheet.appendChild(figs);
  sheet.appendChild(text);
  detail.appendChild(sheet);

  detail.hidden = false;
  document.body.style.overflow = "hidden";
  detail.scrollTop = 0;
  cls.focus();
  if (history.replaceState) history.replaceState(null, "", "#s" + num);
}
function step(g){
  var s = order(), i = s.indexOf(openNum);
  if (i >= 0 && s[i + g]) open(s[i + g]);
}
function close(){
  detail.hidden = true;
  detail.textContent = "";
  openNum = null;
  noteEls = null;
  document.body.style.overflow = "";
  if (history.replaceState) history.replaceState(null, "", "#");
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
document.addEventListener("keydown", function(e){
  if (detail.hidden) return;
  if (e.key === "Escape"){ e.preventDefault(); close(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowRight"){
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    e.preventDefault();
    step(e.key === "ArrowLeft" ? -1 : 1);
  }
});

/* ---------- メモ（保存できるときだけ書ける） ---------- */
var db = null, noteEls = null, dbMsg = null;  /* dbMsg: null=まだ待っている */
function noteBox(num){
  var box = document.createElement("div");
  box.className = "note" + (db ? "" : " off");
  var h = document.createElement("h4");
  h.textContent = "メモ";
  var stars = document.createElement("div");
  stars.className = "stars";
  for (var i = 1; i <= 5; i++){
    var b = document.createElement("button");
    b.type = "button";
    b.dataset.v = String(i);
    b.textContent = "★";
    b.setAttribute("aria-label", i + " つ星");
    stars.appendChild(b);
  }
  var ta = document.createElement("textarea");
  ta.placeholder = "気づいたこと、直したい所";
  var st = document.createElement("div");
  st.className = "state";
  st.textContent = db ? "" : (dbMsg === null ? "読み込み中…" : dbMsg);
  box.appendChild(h);
  box.appendChild(stars);
  box.appendChild(ta);
  box.appendChild(st);
  noteEls = {num: num, box: box, stars: stars, ta: ta, st: st};
  paintBox();

  stars.addEventListener("click", function(e){
    var t = e.target.closest("button");
    if (!t || !db) return;
    var cur = (NOTES[num] || {}).star || 0;
    var v = Number(t.dataset.v);
    save(num, {star: v === cur ? 0 : v});
  });
  var tt = null;
  ta.addEventListener("input", function(){
    if (!db) return;
    var v = ta.value;
    st.textContent = "…";
    clearTimeout(tt);
    tt = setTimeout(function(){ save(num, {memo: v}); }, 700);
  });
  return box;
}
function paintBox(){
  if (!noteEls) return;
  var n = NOTES[noteEls.num] || {};
  [].forEach.call(noteEls.stars.children, function(b, i){
    b.classList.toggle("on", i < (n.star || 0));
  });
  if (document.activeElement !== noteEls.ta) noteEls.ta.value = n.memo || "";
}
function save(num, patch){
  var cur = NOTES[num] || {star: 0, memo: ""};
  var next = {
    star: patch.star !== undefined ? patch.star : (cur.star || 0),
    memo: patch.memo !== undefined ? patch.memo : (cur.memo || ""),
    at: Date.now()
  };
  NOTES[num] = next;
  paintBox();
  paintNote(num);
  db.doc("notes/" + num).set(next).then(function(){
    if (noteEls && noteEls.num === num) noteEls.st.textContent = "保存しました";
  }).catch(function(err){
    if (noteEls && noteEls.num === num)
      noteEls.st.textContent = "保存できませんでした（" + ((err && err.code) || "error") + "）";
  });
}
function noteReady(msg){
  dbMsg = msg;
  if (!noteEls) return;
  noteEls.box.classList.toggle("off", !db);
  noteEls.st.textContent = msg;
  paintBox();
}

draw();
var h0 = location.hash.replace("#s", "");
if (h0 && byNum[h0]) open(h0);

if (window.claude && window.claude.use){
  window.claude.use("db").then(function(x){
    if (!x){ noteReady("この画面ではメモを保存できません。"); return; }
    db = x;
    noteReady("");
    db.collection("notes").onSnapshot(function(docs){
      NOTES = {};
      (docs || []).forEach(function(d){
        var v = (d && typeof d.data === "function") ? d.data() : d;
        var id = (d && d.id) || (v && v.num);
        if (id) NOTES[String(id)] = v;
      });
      Object.keys(cards).forEach(paintNote);
      paintBox();
      if (state.mode === "star") draw();
    }, function(){});
  }).catch(function(){ noteReady("この画面ではメモを保存できません。"); });
} else {
  noteReady("この画面ではメモを保存できません。");
}
})();
</script>
