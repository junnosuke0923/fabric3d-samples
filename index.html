さなので、山折りの列が 1 本の稜線としてつながって見える。 溝 2mm は近くでは切れ目、遠くでは消える。<\/li><li><strong>肘へ向かってほどけるのが読める。<\/strong> 肩の列は落差 4mm で面が立って いるのに、肘の列は 1mm で平らな板になる。袖に着せると「肩で折れて、 腕で伸びる」——布の折り目の実物と同じ向きにほどける。<\/li><li><strong>弱いのは傾いた面の上の縞（<code>preview_macro.jpg<\/code>）。<\/strong> 8bit の高さマップは 8mm ÷ 255 = 0.031mm きざみなので、23° の斜面が 0.08mm ごとの段になり、 拡散光の接写では等高線の縞が見える。実物の 0.03mm は指では分からない はずだが、光の反射では読めるかもしれない。16bit の高さマップを読める なら消える（→ 欲しい機能 #51）。<\/li><li><strong>斜めの縁は格子の階段（<code>preview_macro.jpg<\/code> の右側の壁）。<\/strong> 72 と同じ 0.2mm/マスの刻み。垂直な壁の話なので着ると見えない。<\/li><li>面が 255 個の「塊」であることは 69・72 と同じ系統。違いは塊が平らでは なく傾いていることだけで、<strong>3 件続いた「塊の面モード」はここで打ち止め<\/strong>。 次の面モードは塊ではない構造にする。<\/li><li>絵は拡散光。v7.180.0 の一方向の光で撮り直せば、傾いた面が本当に 4 段階に分かれる（いまは色で補っている）。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>テーラードジャケットの上袖の外側 1 面<\/strong>、肩の縫い目から肘の上まで。 左右対称に 2 枚刷る（右袖は元絵を左右反転）。袖山の縫い代は上の縁の 外に取り、肩の折り目の列が袖山の縫い目のすぐ下から始まる。肘から下と 内袖は素の紺のまま。70g × 2 で肩に 140g 乗るので、袖山に薄い肩パッドを 入れて支える。洗濯は不可。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_74.py     # source.png / depth_map.png / layout.json（scipy が要る） BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/74_ミウラ折りの袖_折れない生地に折り目の光を刷る --final ... --python docs/samples/tools/render_top.py -- docs/samples/74_ミウラ折りの袖_折れない生地に折り目の光を刷る ... --python docs/samples/tools/render_view.py -- docs/samples/74_ミウラ折りの袖_折れない生地に折り目の光を刷る --azim 300 --elev 12 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/74_ミウラ折りの袖_折れない生地に折り目の光を刷る --at 0.5,0.78 --span 55 --elev 30<\/p>\n<p><code>settings.json<\/code> は 72 の設定を土台に、幅・奥行き・高さマップの強さ・ 生地の色を書き換えた。<code>surface_depth_map_path<\/code> はフォルダ内の <code>depth_map.png<\/code>（<code>make_sample.py<\/code> が絶対パスに直す）。フォルダは約 730KB。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。v7.180.0 の［一方向の光で 撮る］はこの複製には無い。<\/p>","imgs":[{"c":"斜め","d":"img/74_preview.jpg"},{"c":"真上","d":"img/74_preview_top.jpg"},{"c":"低い角度から","d":"img/74_preview_low.jpg"},{"c":"拡大","d":"img/74_preview_macro.jpg"}]},{"num":"75","title":"風切羽 — 一枚で立ち上がる大羽","mode":"BRISTLE","path":"docs/samples/75_風切羽_一枚で立ち上がる大羽","text":"<p class=\"lead\"><strong>322 × 203mm の生地の上に、風切羽を1枚だけ立てた。<\/strong> 柱は 215 本、\n覆っているのは格子の 15.2% で、残りの 8 割以上は素の生地のまま。\n羽軸（rachis）が高さ 14.4mm の稜線になり、そこから羽弁が左右へ\nなだらかに落ちて 2.4mm で終わる。前縁は狭く後縁は広い実物の\n初列風切と同じ非対称で、先端は点に収束して後縁側へ振れる。羽枝の\nすき間（slit）を 6 本入れてあるので、羽弁は 1 枚の板ではなく\n束として読める。<\/p><p><strong>322 × 203mm の生地の上に、風切羽を1枚だけ立てた。<\/strong> 柱は 215 本、 覆っているのは格子の 15.2% で、残りの 8 割以上は素の生地のまま。 羽軸（rachis）が高さ 14.4mm の稜線になり、そこから羽弁が左右へ なだらかに落ちて 2.4mm で終わる。前縁は狭く後縁は広い実物の 初列風切と同じ非対称で、先端は点に収束して後縁側へ振れる。羽枝の すき間（slit）を 6 本入れてあるので、羽弁は 1 枚の板ではなく 束として読める。<\/p>\n<p><strong>これは「全面を低いオブジェクトで埋める」作例への、意識的な反対提案。<\/strong> 70〜74 は面や柱で紙面を覆う方向だったが、ここでは<strong>モチーフを1つだけ 置いて、その形の中で高さを 6 倍振る<\/strong>。柱の高さの幅（2.4 → 14.4mm）は この 32 件でいちばん広い。<\/p>\n<h3>仕組み<\/h3>\n<ul><li>柱モード。47 × 30 の格子、中心間隔 7.0mm。断面は 4 角形（CUBE）で 半径 2.4mm、XY 倍率 1.25 / 0.80 ＝ <strong>6.00 × 3.84mm の平たい角柱<\/strong>。<\/li><li>元絵は RGBA 1288 × 812（4px/mm）。<strong>アルファが羽根の輪郭<\/strong>、 <strong>緑チャンネルが高さ<\/strong>（柱モードはリニアで読むので sRGB で符号化して ある）。［明度反転］ON ＝ 明るいほど高い。<\/li><li>高さの式は 2 段。羽軸に沿った稜線 <code>ridge(t)<\/code>（根元 4.2mm → t=0.38 で 14.5mm → 先端 5.5mm）に、羽弁の断面 <code>h = 1.2 + (ridge − 1.2) × (1 − u)^0.75<\/code> を掛ける。<code>u<\/code> は羽軸からの距離を羽弁の幅で割った値。<\/li><li><strong>羽枝の後退角は <code>ridge(t + 0.10u)<\/code> で作る。<\/strong> 稜線を読む位置を 外側ほど先端寄りへずらすので、等高線が羽軸に対して斜めに走る ——実物の羽枝が後ろへ寝ているのと同じ向き。<\/li><li><strong>柱の向きは［向き］＝明るさの勾配方向（GRADIENT_DIR）。<\/strong> 高さ場の 勾配は羽軸から外へ向かうので、平たい角柱が羽軸を中心に扇状に開く。 真上から見ると羽枝の流れになる（<code>preview_top.jpg<\/code>）。<\/li><li>［輪郭に合わせる］ON（最小比率 0.5）。羽弁の縁で半端になる柱は縮み、 半分を切ると消える。これが設計上の 260 本を <strong>215 本<\/strong>へ落としている。<\/li><\/ul>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><td>高さを 6 倍振るのは柱でないと出ない<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>322.0 / 203.0mm<\/td><td>47 × 30 @ 7.0mm<\/td><\/tr><tr><td>断面<\/td><td>4 角形 2.4mm、倍率 1.25 / 0.80<\/td><td>平たい角柱。向きが読める形<\/td><\/tr><tr><td>向き<\/td><td>明るさの勾配方向<\/td><td>羽枝の流れを柱の向きで描く<\/td><\/tr><tr><td>先細り<\/td><td>0.85 / 上端の丸み 0.55<\/td><td>根元を太く、先を丸く<\/td><\/tr><tr><td>最大高さ<\/td><td>14.5mm<\/td><td>上限 15mm のすぐ内<\/td><\/tr><tr><td>高さを揃える<\/td><td>OFF・明度反転 ON<\/td><td>明るいほど高い<\/td><\/tr><tr><td>明暗による半径変化<\/td><td>OFF<\/td><td>太さは一定。高さだけで描く<\/td><\/tr><tr><td>色<\/td><td>高さに沿った明暗（4 点）<\/td><td>墨 → 生成り<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.026, 0.030, 0.048)<\/td><td>濃紺<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_75.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA 1288 × 812、65KB）と <code>layout.json<\/code>（格子・稜線・ すき間の定義）。numpy と PIL が要る。<code>spine()<\/code> が羽軸の曲線、 <code>half_widths()<\/code> が前縁・後縁の幅、<code>ridge()<\/code> が稜線の高さ、<code>field()<\/code> が それらからマスクと高さ場を返す。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>322 × 203 → <strong>248.4 × 146.0 × 14.40mm<\/strong><\/td><td>460 × 360 の内 ✓<\/td><\/tr><tr><td>柱<\/td><td><strong>215 本<\/strong> / 格子 1410（被覆 <strong>15.2%<\/strong>）<\/td><td>—<\/td><\/tr><tr><td>柱の断面<\/td><td><strong>6.00 × 3.84mm<\/strong>（太い側 / 細い側）<\/td><td>≥0.6・≤15 ✓<\/td><\/tr><tr><td>すき間<\/td><td><strong>1.00mm<\/strong><\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>高さ min / 中央 / max<\/td><td><strong>2.40 / 7.96 / 14.40mm<\/strong><\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>縦横比（細い側）<\/td><td>最大 <strong>3.75:1<\/strong> / 中央 <strong>2.07:1<\/strong><\/td><td>4:1 未満<\/td><\/tr><tr><td>底<\/td><td>z = 0.000<\/td><td>✓<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓<\/td><\/tr><tr><td>体積 / 重さ<\/td><td>22.0cm³ / <strong>26g<\/strong>（比重 1.18）<\/td><td>羽根 1 枚<\/td><\/tr><tr><td>頂点 / 生成<\/td><td>1,720 / 2.5 秒<\/td><td>—<\/td><\/tr><\/table>\n<p><strong>道具の行は 2 本。<\/strong> 「実際の造形範囲 248.4 × 146.0 × 14.40mm」は 指定の 322 × 203 より小さい——羽根が紙面を埋めていないので正しい。 「最小高さの下限は 0.4mm です（設定は 0.00mm）。明るさが 3% に届かない 所に柱は立ちません」も正しく、羽弁の外側の縁がそこで切れている。 <strong>v7.187.0 の「1 周期を柱 N 本で運ぶ」は鳴らない<\/strong>（繰り返しの柄では ないので周期が測れない）。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>モチーフの形が読める（<code>preview_top.jpg<\/code>）。<\/strong> 羽軸・非対称な羽弁・ 後縁側へ振れた先端・6 本のすき間が、215 本の点の配置だけで出ている。 70〜74 が「柄で埋める」だったのに対し、これは<strong>1 つの形<\/strong>。<\/li><li><strong>高さが本当に振れている（<code>profile.jpg<\/code>）。<\/strong> 横から見ると根元から 立ち上がって t=0.38 で最高になり、先端へ落ちる 1 本の稜線になる。 2.4 → 14.4mm の 6 倍は、この一連の作例でいちばん広い。<\/li><li><strong>柱の向きが効いている（<code>preview_top.jpg<\/code>）。<\/strong> 勾配方向を渡すと平たい 角柱が羽軸から扇状に開き、羽枝の流れになる。43「綸子」が向きだけで 紋を出したのの応用で、<strong>今度は向きが形の説明になっている<\/strong>。<\/li><li><strong>弱いのはすき間（slit）。<\/strong> 幅を柱 1.5 本ぶん（10.5mm）取ったのに、 上から見ると「羽枝の切れ目」よりは「欠け」に見える。柱が 7mm 間隔で 並ぶ以上、<strong>切れ目は最低でも柱 2 本ぶん空けないと意匠として読めない<\/strong> ——今回の値はぎりぎり足りていない。<\/li><li><strong>弱いのは羽弁の外縁。<\/strong> 0.4mm の床と［輪郭に合わせる］で外側の柱が 45 本落ちた結果、縁がぎざぎざになった。羽根らしい滑らかな縁を出すには 縁の高さ（<code>H_RIM<\/code>）を 1.2 → 2.0mm 程度へ上げるほうがよい。<\/li><li><strong>3/4 の既定プレビュー（<code>preview.jpg<\/code>）では稜線が潰れる。<\/strong> 斜め 20° は 紙面を埋める柄には合うが、1 つの高いモチーフには浅すぎる。この作例は <strong>真上と真横の 2 枚<\/strong>で見るべきで、<code>profile.jpg<\/code>（仰角 11°）がいちばん 形を語る。<\/li><li>拡散光で撮ってある。v7.180.0 の［一方向の光で撮る］はこの複製には 無いので、稜線の陰影は本来もっと強く出るはず。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>ケープかトレンチの背中中央に 1 枚<\/strong>、襟の下から腰まで。羽軸を背骨に 重ね、根元を上に・先端を下に置く。26g なので背中 1 枚なら何も支えは 要らない。左右対称に 2 枚並べる案もあるが、<strong>1 枚だけのほうが強い<\/strong> ——刷るのは生地全面で、そのうち 15% しか立ち上がっていないという 落差そのものが意匠になる。素の紺の部分は普通に縫えるので、羽根の外に 縫い代を取れば裁断・縫製の制約はない。洗濯は不可。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_75.py     # source.png / layout.json BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/75_風切羽_一枚で立ち上がる大羽 --final ... --python docs/samples/tools/render_top.py -- docs/samples/75_風切羽_一枚で立ち上がる大羽 ... --python docs/samples/tools/render_macro.py -- docs/samples/75_風切羽_一枚で立ち上がる大羽 --at 0.45,0.45 --span 185 --elev 11 --name profile ... --python docs/samples/tools/render_macro.py -- docs/samples/75_風切羽_一枚で立ち上がる大羽 --at 0.45,0.42 --span 70 --elev 16<\/p>\n<p><code>settings.json<\/code> は 73 の設定を土台に、格子・断面・向き・高さ・色を 書き換えた。<code>meta.pin_grid<\/code> が真なので <code>make_sample.py<\/code> が列数 47・ 行数 30 を辞書代入で固定する。フォルダは約 530KB。<\/p>\n<p>作った版: アドオン 7.189.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/75_preview.jpg"},{"c":"真上","d":"img/75_preview_top.jpg"},{"c":"拡大","d":"img/75_preview_macro.jpg"}]},{"num":"76","title":"群翔 — 密度そのものを柄にする","mode":"BRISTLE","path":"docs/samples/76_群翔_密度が柄になる","text":"<p class=\"lead\"><strong>324 × 222mm の生地の上を、鳥の群れが左下から右上へ斜めに渡る。<\/strong>\n柄を描いているのは形でも色でもなく、<strong>柱がどれくらい詰まっているか<\/strong>\nだけ。尾では格子の 16% しか埋まらず、頭では 92% が埋まる。同じ 6.0mm\nの格子の上で、この「詰まり方」が連続に変わっていくのが絵になる。<\/p><p><strong>324 × 222mm の生地の上を、鳥の群れが左下から右上へ斜めに渡る。<\/strong> 柄を描いているのは形でも色でもなく、<strong>柱がどれくらい詰まっているか<\/strong> だけ。尾では格子の 16% しか埋まらず、頭では 92% が埋まる。同じ 6.0mm の格子の上で、この「詰まり方」が連続に変わっていくのが絵になる。<\/p>\n<p><strong>本部からの依頼「一枚の中で密度が変わるものを見てみたい」への回答。<\/strong> 44〜75 の作例は、1 枚の中では密度が一定のものがほとんどだった （柄は高さか色か形で描いていた）。ここでは密度を<strong>独立した第 4 の 描画チャンネル<\/strong>として使う。<\/p>\n<h3>仕組み — 高さと密度を直交させる<\/h3>\n<p>このアドオンの［領域マスク］は、<strong>高さ比・太さ比・間引き<\/strong>の 3 つを 別々の割合で持てる。［黒い部分の高さ比］を <strong>1.0 のまま<\/strong>にすると、 マスクは高さに一切触れず、<strong>密度と太さだけ<\/strong>を動かす。だから<\/p>\n<table><tr><th>何を描くか<\/th><th>どこから来るか<\/th><th>向き<\/th><\/tr><tr><td><strong>どこに柱が立つか<\/strong>（輪郭）<\/td><td><code>source.png<\/code> のアルファ<\/td><td>—<\/td><\/tr><tr><td><strong>どれくらい詰まるか<\/strong>（密度・太さ）<\/td><td><code>region_mask.png<\/code><\/td><td>群れの<strong>幅<\/strong>方向<\/td><\/tr><tr><td><strong>どれくらい高いか<\/strong><\/td><td><code>source.png<\/code> の緑チャンネル<\/td><td>群れの<strong>長手<\/strong>方向<\/td><\/tr><\/table>\n<p>の 3 つが独立して効く。<strong>密度と高さの軸をわざと直交させてある。<\/strong> 同じ向きに重ねると、絵から「どちらが何を表しているのか」が読めなく なる（実際に一度そうなって作り直した）。<\/p>\n<ul><li>尾（左下）: 疎・低い・冷たい藍。頭（右上）: 密・高い・暖かい生成り。<\/li><li>高さは 1.8mm → 10.5mm（実測 中央値 5.1mm）。<\/li><li>縁で散った柱は<strong>輪郭へ吸わせない<\/strong>（［輪郭に合わせる］OFF）。 吸わせると散らばりが輪郭線に整列して、群れが「縁取り」に化ける。<\/li><li>間引きは［間引き］を使わず、<strong>領域マスク側だけ<\/strong>に持たせた。 2 つの間引きを重ねると、穴が重なって核まで疎になる。<\/li><\/ul>\n<h3>柱の向き — 振幅 15% のうねりが向きを決める<\/h3>\n<p>［向き］＝<strong>流れに沿う<\/strong>（FLOW）は、明るさの *局所の* 傾きを見る。 高さ場には 2 つの勾配が乗っていて、<\/p>\n<p>幅方向のうねり  0.15 ÷ (54mm/2) ≈ 0.006 /mm   ← 変化が速い。<strong>勝つ<\/strong> 長手方向のランプ 0.92 ÷ 300mm    ≈ 0.003 /mm   ← 変化が遅い<\/p>\n<p><strong>振幅が 6 倍小さいうねりのほうが、向きを決める。<\/strong> だから長手の ランプで高さの幅を決めつつ、向きは幅方向のうねりで別に操れる。 真上から見ると、三角の頭が群れの流れに沿って揃う（<code>preview_top.jpg<\/code>）。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><td>密度を変えられるのは柱だけ<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>324.0 / 222.0mm<\/td><td>55 × 38 @ 6.0mm<\/td><\/tr><tr><td>断面<\/td><td>3 角形 1.9mm、倍率 1.35 / 0.72<\/td><td>向きが読める平たい刃<\/td><\/tr><tr><td>向き<\/td><td><strong>流れに沿う<\/strong><\/td><td>群れの流れを柱の向きで描く<\/td><\/tr><tr><td>先細り 0.70 / 上端の丸み 0.30<\/td><td><\/td><td>根元を太く、頭を丸く<\/td><\/tr><tr><td>最大高さ<\/td><td>10.5mm・明度反転 ON<\/td><td>明るいほど高い<\/td><\/tr><tr><td><strong>領域マスク<\/strong><\/td><td>画像・<strong>高さ比 1.0<\/strong> / 太さ比 0.72 / 間引き 0.95<\/td><td><strong>高さには触らせない<\/strong>。密度と太さだけ<\/td><\/tr><tr><td>輪郭に合わせる<\/td><td><strong>OFF<\/strong><\/td><td>散った縁を輪郭へ吸わせない<\/td><\/tr><tr><td>色<\/td><td>高さに沿った明暗（5 点）<\/td><td>夜明けの藍 → 珊瑚 → 生成り<\/td><\/tr><\/table>\n<h3>造形の条件<\/h3>\n<table><tr><th>条文<\/th><th>値<\/th><\/tr><tr><td>最小 XY 0.6mm<\/td><td><strong>2.74mm<\/strong>（細い側 1.9 × 0.72 × 2）<\/td><\/tr><tr><td>最大 XY 15mm<\/td><td><strong>5.13mm<\/strong>（太い側 1.9 × 1.35 × 2）<\/td><\/tr><tr><td>面と面 0.6mm<\/td><td><strong>0.87mm<\/strong>（間隔 6.0 − 5.13）<\/td><\/tr><tr><td>高さ 0.4〜15mm<\/td><td>1.8 〜 10.5mm<\/td><\/tr><tr><td>造形範囲 460 × 360mm<\/td><td>実測 <strong>308.6 × 146.1 × 10.5mm<\/strong><\/td><\/tr><tr><td>縦横比<\/td><td>細い側 <strong>3.84 : 1<\/strong>（縁の細い柱は 3.21 : 1）<\/td><\/tr><\/table>\n<h3>自分の見立て<\/h3>\n<p><strong>依頼された「密度が柄になる」は出た。<\/strong> 真上（<code>preview_top.jpg<\/code>）で、 疎から密への連続した変化が、線でも輪郭でもなく<strong>詰まり方<\/strong>として読める。 低い角度（<code>preview_low.jpg<\/code>）では、それが同時に「低く冷たい尾から 高く暖かい頭へ」の立ち上がりでもあることが分かる。拡大 （<code>preview_macro.jpg<\/code>）だと三角の刃が群衆のように立ち、向きが 1 本ずつ 違うのが見える。<\/p>\n<p><strong>弱いのは、要素 1 つの形の魅力。<\/strong> 6.0mm の格子に対して柱は 5mm 級 なので、紙面ぜんたいを見たときは「点」でしかない。密度を柄にするには 点が多数要る、という構造上のトレードオフで、<strong>この作例では意図的に 点の側を選んだ<\/strong>。要素の形そのものに語らせる作例は別に立てる。<\/p>\n<p><strong>紙面の 1/3 が素の生地のまま<\/strong>なのは、群れが渡る空として残した。 指定 324 × 222mm に対し実測 308.6 × 146.1mm で、奥行きが 34% 余る。<\/p>\n<h3>再現<\/h3>\n<pre>python docs/samples/tools/make_art_76.py\nBF_ADDON_PATH=&quot;&lt;複製&gt;&quot; blender --background --factory-startup \\\n    --python docs/samples/tools/make_sample.py -- docs/samples/76_群翔_密度が柄になる --final<\/pre>","imgs":[{"c":"斜め","d":"img/76_preview.jpg"},{"c":"真上","d":"img/76_preview_top.jpg"},{"c":"低い角度から","d":"img/76_preview_low.jpg"},{"c":"拡大","d":"img/76_preview_macro.jpg"},{"c":"拡大（もう一方の端）","d":"img/76_preview_macro2.jpg"}]},{"num":"77","title":"千鳥を千鳥で描く","mode":"BRISTLE","path":"docs/samples/77_千鳥を千鳥で描く","text":"<p class=\"lead\">千鳥格子を、<strong>千鳥格子の柱で<\/strong>描く。柄と部品が同じ形をしている。<\/p><p>千鳥格子を、<strong>千鳥格子の柱で<\/strong>描く。柄と部品が同じ形をしている。<\/p>\n<h3>発想の出どころ<\/h3>\n<p>アドオンの断面［千鳥格子］は、<code>__init__.py<\/code> に <strong>14 個の点<\/strong>として直接 書いてある（<code>_samples_wt/__init__.py:18773<\/code>、±0.5 の単位正方形）。 その 14 点を<strong>間隔 1.0 で並べると、隙間なく噛み合って本物の千鳥格子に なる<\/strong>——柄として敷き詰めるために作られた形なのだから当然だが、 これは「大きい柄」と「1 本の柱の断面」を<strong>文字どおり同じ形<\/strong>にできる、 ということでもある。<\/p>\n<p>だから元データは、その 14 点をそのまま並べて作った千鳥格子。 1 単位 = 8 セル = <strong>100.0mm<\/strong>、盤面に 4.1 × 2.9 回。 歯の中は高く、地は低く。柱 1 本 1 本もまた千鳥格子の歯。<\/p>\n<h3>数字<\/h3>\n<table><tr><th><\/th><th><\/th><\/tr><tr><td>盤面<\/td><td>412.5 × 287.5mm（実測 421.6 × 296.7 × 12.77mm）<\/td><\/tr><tr><td>柱<\/td><td>34 × 24 ＝ 816 本、中心間隔 12.5mm<\/td><\/tr><tr><td>断面<\/td><td>千鳥格子（14 頂点）、半径 5.0mm<\/td><\/tr><tr><td>太さ<\/td><td>高い歯 <strong>10.0mm<\/strong> ／ 低い地 <strong>5.8mm<\/strong><\/td><\/tr><tr><td>いちばん細い枝<\/td><td>2.0mm（歯）／ 1.16mm（地）<\/td><\/tr><tr><td>すき間<\/td><td>2.5mm<\/td><\/tr><tr><td>高さ<\/td><td>最小 2.15 ／ 中央 4.13 ／ 最大 <strong>12.77mm<\/strong><\/td><\/tr><tr><td>縦横比<\/td><td>高い歯 <strong>1.28 : 1<\/strong> ／ 低い地 0.37 : 1<\/td><\/tr><\/table>\n<p>造形の条件は 4 つとも通っている——最小 XY 0.6mm（1.16mm）、 すき間 0.6mm（2.5mm）、要素の上限 15mm（10.0mm）、高さ 0.4〜15mm。 トレイ 460 × 360mm にも収まる。<\/p>\n<h3>明暗を 2 つに配った<\/h3>\n<p>元データの緑チャンネル 1 本で、<strong>高さと太さの両方<\/strong>を動かしている。<\/p>\n<table><tr><th>設定<\/th><th>何が変わるか<\/th><\/tr><tr><td>［最大高さ］13.0mm ＋［明度反転］入<\/td><td>歯が高く、地が低く<\/td><\/tr><tr><td>［明暗による半径変化］入 ＋［半径の明度反転］入 ＋［最小半径比率］0.58<\/td><td>歯が太く、地が細く<\/td><\/tr><\/table>\n<p><strong>［半径の明度反転］が要る。<\/strong>入れないと歯のほうが細くなり、 上から見た大柄がかえって読めなくなる（3 通り撮って比べた）。 高さだけで描いた最初の版は、斜めからは読めるのに<strong>真上からはほぼ 一様に見えた<\/strong>——高さは真上からは読めないので、大柄をどの角度からも 成立させるには、太さという 2 本目のチャンネルが要る。<\/p>\n<h3>自分の評価<\/h3>\n<p><strong>良い。<\/strong>この作例の値打ちは、狙いが 1 行で言えて、しかも証明つきで あること——「千鳥格子を千鳥格子で描く」。マクロの絵とアップの絵を 並べれば、同じ形が 2 つの縮尺で出ていることがそのまま見える。 <code>preview_macro.jpg<\/code> が本命で、柱の天面の千鳥の切り欠きと、 奥へ向かって歯が立ち上がっていく段差が同時に写っている。<\/p>\n<p><strong>縦横比 1.28 : 1 は意図した低さ。<\/strong>これまでの作例が「細く高い柱＝棘」へ 寄っていた指摘への当てで、高さ 12.77mm という絶対値は出しつつ、 形は棘ではなく<strong>塊<\/strong>にしてある。マクロで見たときに切り欠きの シルエットが読めるのは、この太さのおかげ。<\/p>\n<p><strong>弱いのは、地の表情。<\/strong>低い歯 816 本のうち 3 分の 2 は 2〜4mm の 低い塊で、ここは「細かい石畳」以上のことを言っていない。 歯の中の高さに傾き（0.64→1.00 の対角のグラデーション）を入れて あるが、実物では<strong>ほとんど読めない<\/strong>——大柄の白黒のほうが強すぎる。 次に同じ構図をやるなら、傾きは捨てて、歯ごとに向きを変えるほうが 効くはず。<\/p>\n<p><strong>素材としての向き。<\/strong>モードの効いた黒一色のドレスの身頃や、 シャネル／ディオールの文脈のジャケットの前立て。千鳥格子は ファッションの語彙の中で最も強い柄の 1 つなので、 「立体になった千鳥格子」はそれだけで通る。<\/p>\n<h3>作り直し方<\/h3>\n<pre>python docs/samples/tools/make_art_77.py          # source.png と layout.json\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;このフォルダ&gt; --final<\/pre>","imgs":[{"c":"斜め","d":"img/77_preview.jpg"},{"c":"真上","d":"img/77_preview_top.jpg"},{"c":"低い角度から","d":"img/77_preview_low.jpg"},{"c":"拡大","d":"img/77_preview_macro.jpg"}]},{"num":"78","title":"鍛鉄の透かし — 一枚で立ち上がる","mode":"SURFACE","path":"docs/samples/78_鍛鉄の透かし_関節のある一枚","text":"<p class=\"lead\">Hector Guimard の地下鉄入口に付いていた鋳鉄の欄間を、<strong>布へ載せる透かし<\/strong>\nとして作り直した。<strong>元データは Codex に描かせた<\/strong>（このPCで画像生成が\n使えるようになった初日の作例）。<\/p><p>Hector Guimard の地下鉄入口に付いていた鋳鉄の欄間を、<strong>布へ載せる透かし<\/strong> として作り直した。<strong>元データは Codex に描かせた<\/strong>（このPCで画像生成が 使えるようになった初日の作例）。<\/p>\n<p>面モード・<strong>アルファで本当に抜く<\/strong>ので、暗い所が低いのではなく、 柄の外側には材料が一切無い。開口部の向こうは机が見える。<\/p>\n<h3>何が「モチーフらしい」のか<\/h3>\n<p>依頼は「低い物で全面を埋めるのではなく、モチーフ形状自体に特徴があり、 高さも出したもの」だった。ここで効かせたのは<strong>1つの規則だけ<\/strong>——<\/p>\n<blockquote><strong>棒が太い所ほど高い。<\/strong><\/blockquote>\n<p>鍛冶屋が叩いた鉄は、力の掛かる骨が太く高く、飾りの蔓が細く低い。 その序列を、絵から<strong>距離変換で測って<\/strong>そのまま高さに写した。装飾を 足したのではなく、<strong>元絵が既に持っていた情報を立ち上げた<\/strong>だけ。<\/p>\n<table><tr><th>棒の太さ<\/th><th>高さ<\/th><th>見え方<\/th><\/tr><tr><td>2.9mm（細い蔓の先）<\/td><td>4.2mm<\/td><td>黒鉄。影に沈む<\/td><\/tr><tr><td>4.5mm（中央値）<\/td><td>約 6.5mm<\/td><td>側面が見え始める<\/td><\/tr><tr><td>14.2mm（根元・枠）<\/td><td>10.5mm<\/td><td>稜線に照りが出る<\/td><\/tr><\/table>\n<p><code>preview_macro.jpg<\/code> の扇の付け根がそれで、<strong>5本の茎が根元で合流して 一段高くなり、枝分かれするほど痩せていく<\/strong>。この「関節」は飾りとして 描いたものではなく、太さの計算がそこで最大になった結果。<\/p>\n<h3>数字<\/h3>\n<table><tr><th><\/th><th><\/th><\/tr><tr><td>盤面<\/td><td>260 × 260mm（<strong>実際の造形範囲 260.0 × 260.0 × 10.50mm<\/strong>）<\/td><\/tr><tr><td>元画像<\/td><td>1254 × 1254px（1px = 0.2073mm）<\/td><\/tr><tr><td>鉄の割合<\/td><td>34.9%（<strong>残り 65.1% は本当の穴<\/strong>）<\/td><\/tr><tr><td>連結成分<\/td><td><strong>1個<\/strong>（100%）。網は全部つながっている<\/td><\/tr><tr><td>棒の太さ<\/td><td>下位1% 2.90 / 中央 4.47 / 最大 14.18mm<\/td><\/tr><tr><td>高さ<\/td><td>4.2 〜 10.5mm<\/td><\/tr><tr><td>頂点<\/td><td>3,477,860<\/td><\/tr><\/table>\n<p>最小 XY 0.6mm は、いちばん細い所（2.90mm）でも 4.8 倍の余裕がある。 太いほうは 14.18mm で、<strong>要素の上限 15mm のすぐ内側<\/strong>——ここは 狙って詰めた。<\/p>\n<h3>色は高さと別の画像で決めている<\/h3>\n<p><code>surface_height_mode = '高さマップ（別画像から）'<\/code> にして、 高さは <code>depth_map.png<\/code>、色は <code>source.png<\/code> の RGB。<strong>同じ画像に 両方を載せると色が高さの目盛りに縛られる<\/strong>——最初はそうしていて、 出来上がりは灰色 170〜255 の狭い帯に張り付き、鉄には見えなかった （1枚目の試作）。切り離してから、細い蔓を青黒 <code>#08080a<\/code>、 根元を焼けた鉄の照り <code>#8f7a5a<\/code> に振れるようになった。<\/p>\n<h3>やってみて捨てた案：［面を分割する］<\/h3>\n<p>最初は 13mm 角のブロックで割った。<strong>要素の上限 15mm を通すため<\/strong>で、 割れ目が鍛冶の継ぎ手に見えることも期待していた。両方外れた。<\/p>\n<ul><li>割れ目は<strong>蔓の向きと無関係な直交格子<\/strong>なので、曲線の上に方眼紙を 敷いたようになる。鍛えた継ぎ手には見えない。<\/li><li>［面を分割する］は<strong>生地の下地とセット<\/strong>の仕組みで、下地を消すと 透かしが数百個のばらばらな破片になる。下地を残すと今度は 「透かし」ではなくなる（下が塞がる）。<\/li><\/ul>\n<p>だから割るのをやめ、<strong>一枚のまま<\/strong>にした。アドオンは正しく警告する:<\/p>\n<blockquote>1つの要素が 260×260mm あり、布のようには曲がりません（上限 15.0mm）<\/blockquote>\n<p><strong>この警告は妥当<\/strong>で、これは曲がらない板。胸当て・肩・襟の芯のように <strong>曲げない場所へ置く前提<\/strong>の作例として置く。曲げたいなら、割るのでは なく<strong>柄そのものを帯に分けて描く<\/strong>のが筋（次の作例でやる）。<\/p>\n<h3>自分の評価<\/h3>\n<p><strong>良い。<\/strong> ここまでの作例で、モチーフの力がいちばん強い1枚。 理由は3つあって、どれも「たまたま」ではない。<\/p>\n<p>1. <strong>元絵が本物の設計から来ている。<\/strong> Guimard の欄間は、鉄という材料の 都合（叩ける・曲げられる・溶接できる）から形が決まっている。それを 造形の都合（オーバーハング無し・底が平ら）へ移しても壊れない。 2. <strong>高さの規則が1つしかない。<\/strong> 太さ→高さ。だから 260mm 離れて見ても 1mm 覗き込んでも、同じ話が読める。 3. <strong>穴が主役になっている。<\/strong> 65% が穴なので、着たときに向こうの肌や 下の生地が透ける。低い凹凸で全面を埋める作り方では絶対に出ない絵。<\/p>\n<p><strong>弱い所を2つ。<\/strong> 側面に<strong>縦の縞<\/strong>が出ている（<code>preview_macro.jpg<\/code> で はっきり見える）。高さマップの解像度 2048 を 260mm に割ると 1画素 0.127mm で、垂直の壁がその刻みで階段になる。実物では 0.127mm の段は指では分からないはずだが、<strong>絵としては汚い<\/strong>。 もう1つは<strong>枠の四辺が真っ直ぐすぎる<\/strong>こと——Guimard の実物は枠も うねっている。元絵を描かせるときに「四辺は直線」と縛ったせいで、 そこだけ工業製品の顔になった。次に Codex へ頼むときは外さない。<\/p>\n<h3>作り直し方<\/h3>\n<pre>python docs/samples/tools/make_art_78.py          # codex_raw.png → source.png + depth_map.png\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;このフォルダ&gt; --final<\/pre>\n<p><code>codex_raw.png<\/code> は Codex が出した元の白黒。<strong>捨てずに置いてある<\/strong>ので、 太さ→高さの割り当てを変えたいときはここからやり直せる。<\/p>","imgs":[{"c":"斜め","d":"img/78_preview.jpg"},{"c":"真上","d":"img/78_preview_top.jpg"},{"c":"低い角度から","d":"img/78_preview_low.jpg"},{"c":"拡大","d":"img/78_preview_macro.jpg"}]},{"num":"79","title":"零れ — 水だけが硝子になる","mode":"SURFACE","path":"docs/samples/79_零れ_水だけが硝子になる","text":"<p class=\"lead\">身頃の胸元から水を零して、<strong>その水だけを透明材で刷る<\/strong>。周りに広がった\n濡れ染みは色付き材で、平らなまま 0.52mm。水は高さマップで盛り上がって\n天面 3.60mm。<strong>同じ 1 枚の中で、透明材と色付き材が別々の役をしている<\/strong>\n——水は「透けて厚みがある」ことでしか出せず、染みは「色が濃く沈む」\nことでしかできない。<\/p><p>身頃の胸元から水を零して、<strong>その水だけを透明材で刷る<\/strong>。周りに広がった 濡れ染みは色付き材で、平らなまま 0.52mm。水は高さマップで盛り上がって 天面 3.60mm。<strong>同じ 1 枚の中で、透明材と色付き材が別々の役をしている<\/strong> ——水は「透けて厚みがある」ことでしか出せず、染みは「色が濃く沈む」 ことでしかできない。<\/p>\n<p>利用者の方針「透明色を扱えることもこのプリンタならではだと思うので、 もう少し活用していきたいです」（2026-09-06）への最初の答え。それまでの 作例で［透明］は「上だけを少し透かす」以上の役を持っていなかった。<\/p>\n<h3>仕組み<\/h3>\n<ul><li><strong>どこが透明になるかは、高さではなく絵で指す。<\/strong>［範囲］の 4 択 （上だけ／下だけ／帯／外皮）はどれも「高さのどこを透かすか」しか 言えないので、平面のどこを硝子にするかは指せない。［出どころ］＝<strong>画像<\/strong> にして <code>transparent_mask.png<\/code> の<strong>黒い所<\/strong>を渡すと、そこが<strong>高さぜんたい<\/strong> にわたって透明材になる。水は根元から天面まで硝子になり、隣の染みは 底から天面まで色付きのまま。<\/li><li>高さは <code>depth_map.png<\/code>。<strong>面モードの DEPTH_MAP は足し算<\/strong>で、 ［最大高さ］0.52mm の平らな板の上に［高さマップの強さ］3.08mm が乗って 天面 3.60mm。染みは高さマップが 0 なので 0.52mm の板のまま残り、 <strong>染み＝薄い・水＝厚い<\/strong>が高さでも読める。<\/li><li>水の断面はかまぼこ。縁からの距離を smoothstep で立ち上げ、水際でも 0.45（＝1.4mm）から始まる下駄を履かせてある。細い筋ほど薄い膜になる ので、本物の流れに近い。<\/li><li>染みの輪郭は多重オクターブのノイズで縁を毛羽立たせ、下向きに 1.40 倍・ 横向きに 0.68 倍と重力へ寄せた。輪郭から少し内側に潮の線（濃い輪）を 1 本入れてある。<\/li><li>生地は織り目の紺（0.055, 0.075, 0.115）。<strong>染みは生地より濃い<\/strong>ので、 真上から見ると水が青白く、そのまわりに一段暗い暈が広がる。<\/li><\/ul>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>240 / 320mm<\/td><\/tr><tr><td>高さの決め方<\/td><td>高さマップ（<code>depth_map.png<\/code>）<\/td><\/tr><tr><td>最大高さ / 高さマップの強さ<\/td><td>0.52 / 3.08mm（合計 3.60mm）<\/td><\/tr><tr><td>面を分割する<\/td><td>切<\/td><\/tr><tr><td>丸み<\/td><td>0.25mm / 2 分割（上の縁・垂直の辺のみ）<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>入<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><\/tr><tr><td><strong>透明 → 出どころ<\/strong><\/td><td><strong>画像<\/strong>（<code>transparent_mask.png<\/code>・反転なし）<\/td><\/tr><tr><td>透明 → 範囲<\/td><td>上だけ（出どころが画像なので不活性）<\/td><\/tr><tr><td>クリアの濁り / クリアの色<\/td><td>0.16 / (0.62, 0.78, 0.92)<\/td><\/tr><tr><td>側面<\/td><td>テクスチャ<\/td><\/tr><tr><td>生地<\/td><td>織り・カスタム色 (0.055, 0.075, 0.115)・厚み 1.0mm<\/td><\/tr><tr><td>解像度 プレビュー / 最終<\/td><td>768 / 2048<\/td><\/tr><\/table>\n<p>［クリアの濁り］と［クリアの色］は<strong>画面だけ<\/strong>の設定で、書き出しには 乗らない。実機のクリアの色は GrabCAD Print 側で指定する。<strong>この絵の 水色は「刷るとこうなる」ではない。<\/strong><\/p>\n<h3>元画像<\/h3>\n<p><code>codex_raw.png<\/code>（Codex が描いた水のシルエット）を種にして、 <code>tools/make_art_79.py<\/code> が numpy と scipy で 3 枚を組む。<\/p>\n<table><tr><th>ファイル<\/th><th>中身<\/th><\/tr><tr><td><code>source.png<\/code><\/td><td>RGBA 1200×1600（5px/mm）。色と輪郭<\/td><\/tr><tr><td><code>depth_map.png<\/code><\/td><td>水のかまぼこ。染みは 0<\/td><\/tr><tr><td><code>transparent_mask.png<\/code><\/td><td>黒＝水＝透明材<\/td><\/tr><tr><td><code>layout.json<\/code><\/td><td>画素数と mm の対応、水の割合<\/td><\/tr><\/table>\n<p><code>codex_raw.png<\/code> は 1bit の白黒で保存してある。道具が読むのは <code>raw &gt; 128<\/code> の二値だけなので、元の RGB（527KB）から 1bit（8KB）へ 落としても<strong>道具が見る物は 1 画素も変わらない<\/strong>（実測で一致を確認）。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>178.1 × 284.8 × 3.60mm<\/td><\/tr><tr><td>底の高さ<\/td><td>0（z = 0.0000）<\/td><\/tr><tr><td>オーバーハング<\/td><td><strong>0 面 / 0.00mm²<\/strong><\/td><\/tr><tr><td>面数 / 頂点数<\/td><td>1,386,124 / 1,588,078<\/td><\/tr><tr><td>うちクリア材<\/td><td>558,492 面（<strong>40.3%<\/strong>）<\/td><\/tr><tr><td>水の占める面積<\/td><td>版の 41.2%<\/td><\/tr><tr><td>水の筋の幅 中央 / 90% / 最大<\/td><td>2.53 / 8.88 / 25.30mm<\/td><\/tr><tr><td>染みの帯の幅 中央 / 90%<\/td><td>1.60 / 3.22mm<\/td><\/tr><tr><td>水の連結成分<\/td><td>38（最大の 1 つが水の 94.9%）<\/td><\/tr><tr><td>格子 プレビュー / 最終<\/td><td>576×768 / 1536×2048<\/td><\/tr><tr><td>生成時間（最終まで）<\/td><td>11.5〜14.5 秒<\/td><\/tr><\/table>\n<h3>水際が櫛の歯に割れた——直し方は mm ではなく元絵の画素で数える<\/h3>\n<p>寄って撮って初めて見つけた。水の壁が<strong>0.5mm ほどの歯<\/strong>に割れていて、 全体の絵でも真上の絵でも見えない。<\/p>\n<p>最初は「格子が粗い」と読んだが、<strong>外れていた<\/strong>。最終格子 0.117mm で 撮り直しても歯は 0.5mm のまま残る——格子より 4 倍細かい所に歯があるのに 歯の幅が変わらないのだから、原因は格子ではない。<strong>参照している絵<\/strong>の 目の粗さ（5px/mm ＝ 0.2mm）が犯人で、水際の立ち上がりが元絵では <strong>2 画素<\/strong>しかなかった。<\/p>\n<table><tr><th>試したこと<\/th><th>結果<\/th><\/tr><tr><td>円弧 <code>sqrt(1-(1-t)²)<\/code> の断面<\/td><td>水際の傾きが無限大。歯が出る<\/td><\/tr><tr><td>smoothstep へ変える<\/td><td>歯は消えたが、細い筋が 0.5mm の膜になり「濡れて光っている」だけの絵になった（＝色付き材でも出せる。透明材を使う言い分が消える）<\/td><\/tr><tr><td>下駄 <code>0.45 + 0.55·smoothstep<\/code><\/td><td>細い筋にも 1.4mm の身。ただし歯が戻る<\/td><\/tr><tr><td>立ち上がりを 0.4mm へ<\/td><td>5px/mm では 2 画素。効かない<\/td><\/tr><tr><td><strong>立ち上がりを 1.2mm（6 画素）＋ 1.5 画素ぼかし<\/strong><\/td><td><strong>歯が消えた<\/strong>（<code>preview_macro.jpg<\/code> で確認）<\/td><\/tr><\/table>\n<p><strong>急な段の幅は、mm ではなく元絵の画素で数える。<\/strong> 元絵が最終メッシュより 粗いときは、格子をいくら細かくしても段は段のまま残る。<\/p>\n<h3>道具が出した行<\/h3>\n<p>「1 つの要素が 166×285mm あり、布のようには曲がりません（造形条件の 上限 15.0mm）」——<strong>正しいが、この作例では読み替えが要る。<\/strong> 15mm の 検査は連結した部品の外接矩形を測るので、幅 2〜9mm の筋が透かし状に 繋がった網も、外接では 166×285mm の 1 枚と数えられる。実際には筋は 細く、染みの板も 0.52mm しかないので、<strong>この形はそのままでも曲がる。<\/strong> 外接ではなく「いちばん太い所」を見てほしい（→ 欲しい機能 #56）。<\/p>\n<p>「重くなる可能性があります（解像度×高さが高い）」も出るが、最終まで 14.5 秒なので実害はなかった。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>透明材でなければ成立しない絵になった。<\/strong>水の筋が厚み 3.6mm の硝子で、 下の紺の生地がそこだけ透けて濃く見える。同じ形を色付き材で刷ると 「青い模様」にしかならない。作例室として初めて、透明が主題の 1 点。<\/li><li><strong>真上（<code>preview_top.jpg<\/code>）が説明図として一番よく効く。<\/strong>水が青白く、 染みが一段暗い暈になって、2 つの材の役割分担がそのまま読める。<\/li><li><strong>低い角度（<code>preview_low.jpg<\/code>）で硝子の厚みが出る。<\/strong>逆光ぎみに落とした 光で、筋の縁がハイライトになって水面らしくなった。<\/li><li><strong>弱いのは、水の形が「上から見た水たまり」であること。<\/strong>身頃を伝う水は 本当は縦へ長く落ちるはずで、いまは横へ広がっている。元絵を縦長に 引き延ばして、裾へ向かって細る形にするほうが零れて見える。<\/li><li><strong><code>preview_macro.jpg<\/code> の染みが白く飛ぶ。<\/strong>これは形の欠陥ではなく撮り方の 欠陥で、<code>render_macro.py<\/code> の 3 灯は仰角 16° の掠め光になるとフレネルで 平らな天面が光る。真上（0°）とアドオン自身の見本では染みは正しく暗い。 マクロ用の光の調整は道具側の宿題。<\/li><li>水の筋の 99% 点が 20mm、最大 25mm——胸元の溜まりの所だけ太い。 ここは板に見えるので、次に作るなら溜まりにも細い筋を通して抜きたい。<\/li><\/ul>\n<h3>作例 78 で書いた宿題は、半分だけ果たした<\/h3>\n<p>作例 78 の README に「曲げたいなら、割るのではなく<strong>柄そのものを帯に 分けて描く<\/strong>のが筋（次の作例でやる）」と書いた。79 は<strong>透明材の側では それをやっている<\/strong>——水は幅 2〜9mm の筋の網で、38 個の成分に分かれて いる。<strong>色付き材の側はやっていない<\/strong>。染みは 58.8% を覆う 1 枚の板で、 だから道具の警告も 166×285mm と出る。0.52mm と薄いので実用上は曲がる が、「帯に分けて描く」を色付き材でもやったことにはならない。<strong>次の 作例で、色付き材の側を帯に割る。<\/strong><\/p>\n<h3>服として<\/h3>\n<p>ワンピースの前身頃。上端が肩の高さで、水は胸元から入って裾へ向かう。 脇の縫い代は水の外へ 15mm 取れる（版が 178mm、紙面が 240mm）。透明材は 色付き材より脆いので、筋がいちばん細い 2.5mm の所が折れ目に来ないよう、 前中心を筋の間に置く。洗濯は不可。<\/p>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_79.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_top.py -- &lt;この folder&gt;\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --final --azim 200 --elev 26 --name preview_low --sun-azim-offset 165 --sun-elev 24 --sun-energy 2.6 --world 0.16\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; --at 0.50,0.60 --span 13 --elev 16 --back-elev 42 --final<\/pre>\n<p>folder は約 917KB。作った版は <strong>7.191.0<\/strong>（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/79_preview.jpg"},{"c":"真上","d":"img/79_preview_top.jpg"},{"c":"低い角度から","d":"img/79_preview_low.jpg"},{"c":"拡大","d":"img/79_preview_macro.jpg"}]},{"num":"80","title":"標本 — 樹脂に封じた植物画","mode":"SURFACE","path":"docs/samples/80_標本_樹脂に封じた植物画","text":"<p class=\"lead\">18世紀風の手彩色植物図版（アイリス1株）を、六方格子に並んだ\n<strong>347個のカボション<\/strong>へ写した。1個は直径 5.0mm・間隔 6.0mm・\nすき間 1.0mm で、色は元の図版のその場所の平均、高さは\n<strong>彩度と暗さ<\/strong>で決まる（2.56〜4.10mm）。<\/p><p>18世紀風の手彩色植物図版（アイリス1株）を、六方格子に並んだ <strong>347個のカボション<\/strong>へ写した。1個は直径 5.0mm・間隔 6.0mm・ すき間 1.0mm で、色は元の図版のその場所の平均、高さは <strong>彩度と暗さ<\/strong>で決まる（2.56〜4.10mm）。<\/p>\n<p><strong>この作例室で初めて［範囲］＝外皮を使った。<\/strong>色付きの芯が <strong>0.312mm の透明の皮<\/strong>に包まれていて、標本を樹脂に封じたときの 「中に色がある」見え方をそのまま造形で作っている。芯は床に 着けてあるので（［底の外皮(mm)］0.0）、石の裾には透明のリングが 1本残る——これは避けられない仕様で、実際には石の座金に見える。<\/p>\n<h3>仕組み<\/h3>\n<ul><li>Codex が描いた植物図版（<code>plate.jpg<\/code>）を六方格子で覆い、マスの中の <strong>柄の占有率が 30% を超えたマス<\/strong>だけを石として残す。石の色は そのマスの平均色（彩度が平均で痩せるので 2.1 倍に戻す）。<\/li><li>高さは 1 枚の高さマップ（<code>depth_map.png<\/code>）で与える。台座（ガードル） 1.30mm は面モードの［最大高さ］、その上のふくらみ 1.26〜2.80mm は ［高さマップ］の強さ 2.8mm × 石ごとの係数 0.45〜1.00。 <strong>面モードの高さは足し算<\/strong>なので、合計が石の高さになる。<\/li><li>石ごとの係数は元の図版の<strong>彩度が高く暗い所ほど高く<\/strong>した。花の紫と 葉の濃い緑が盛り上がり、白い花芯が低く沈む——図版の陰影がそのまま 厚みになる。<\/li><li>透明は［範囲］＝外皮／［方式］＝比率／［色付き部分］76%。 外皮の厚みは台座から出るので 1.30 × 0.24 = <strong>0.312mm<\/strong>。<\/li><\/ul>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>210 / 280mm<\/td><\/tr><tr><td>高さの決め方<\/td><td>高さマップ（<code>depth_map.png<\/code>）<\/td><\/tr><tr><td>最大高さ / 高さマップの強さ<\/td><td>1.30mm / 2.80mm<\/td><\/tr><tr><td>透明<\/td><td>入・<strong>範囲＝外皮<\/strong>・方式＝比率・色付き部分 76%<\/td><\/tr><tr><td>底の外皮<\/td><td>0.0mm（芯を床に着ける）<\/td><\/tr><tr><td>クリアの濁り / クリアの色<\/td><td>0.15 / (0.90, 0.93, 0.97)<\/td><\/tr><tr><td>透明しきい値 / 輪郭の吸着<\/td><td>0.5 / 入<\/td><\/tr><tr><td>丸み<\/td><td>0.22mm<\/td><\/tr><tr><td>最終解像度 / プレビュー解像度<\/td><td>2048（最大）/ 768<\/td><\/tr><tr><td>生地<\/td><td>織り・カスタム色 (0.030, 0.026, 0.022)<\/td><\/tr><\/table>\n<h3>元画像<\/h3>\n<p><code>plate.jpg<\/code> は Codex CLI（gpt-5.6-sol）が描いた植物図版。そこから <code>tools/make_art_80.py<\/code> が <code>source.png<\/code>（RGBA 2100×2800・10px/mm）と <code>depth_map.png<\/code>（L 1260×1680・6px/mm）を作る。<\/p>\n<p><strong>色のほうは 10px/mm 必要で、高さのほうは 6px/mm でよい。<\/strong>面の格子は 210mm ÷ 1536 = <strong>7.31px/mm<\/strong> で、アルファは「しきい値で切る」ので 元絵が格子より粗いと輪郭が階段になる（最初 4px/mm ＝ 0.25mm 刻みで 描いていて、石が丸ではなく多角形になった）。高さのほうは連続値で 線形に補間されるだけなので、格子より粗くても構わない。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>101.1 × 223.3 × <strong>4.10mm<\/strong>（指定は 210 × 280mm）<\/td><\/tr><tr><td>石の数<\/td><td>347<\/td><\/tr><tr><td>直径 / 中心間隔 / すき間<\/td><td>5.0 / 6.0 / <strong>1.0mm<\/strong><\/td><\/tr><tr><td>石の高さ<\/td><td>2.56〜4.10mm（台座 1.30 + ふくらみ 1.26〜2.80）<\/td><\/tr><tr><td>外皮の厚み<\/td><td>0.312mm<\/td><\/tr><tr><td>縦横比（高さ ÷ 直径）<\/td><td><strong>0.82<\/strong>（棘にならない）<\/td><\/tr><tr><td>いちばん大きい要素<\/td><td>5 × 5mm（上限 15.0mm）<\/td><\/tr><tr><td>印字率<\/td><td>11.6%<\/td><\/tr><tr><td>垂直面の z（色付き / クリア）<\/td><td>0.494〜0.823 / 0.650〜0.735（1.5mm より上は 0面）<\/td><\/tr><tr><td>底の高さ<\/td><td>0<\/td><\/tr><tr><td>オーバーハング<\/td><td><strong>0面 / 0.0mm²<\/strong><\/td><\/tr><tr><td>設定<\/td><td>適用 354件 / 非適用 0件<\/td><\/tr><tr><td>頂点数 / 生成時間<\/td><td>1,282,020 / 11.1秒<\/td><\/tr><\/table>\n<p><strong>実際の造形範囲が指定よりずっと小さい<\/strong>のは、面モードの外接が 「柄のある所」だからで、アイリスが紙面いっぱいまで届いていない。 指定の 210 × 280mm は紙の大きさで、刷られるのはその中の 101 × 223mm。<\/p>\n<h3>石の腰に出た櫛の歯は、外皮ではなくふくらみの式だった<\/h3>\n<p>作り始めの絵では、<strong>石の腰（ガードル）に細い縦の櫛の歯<\/strong>が並んで いた。透明の外皮を初めて使った回なので外皮の不具合を疑ったが、 <strong>［透明］を切った陰性対照でも同じ櫛が出た<\/strong>——外皮は透明の襟を 足しているだけで、櫛は下地の高さマップ側の形だった。<\/p>\n<p>原因はふくらみの式。放物面 <code>1-r²<\/code> は<strong>縁がいちばんの急斜面<\/strong> （傾き -2）なので、面の格子 1マス 0.137mm ぶんで高さが 298µm 跳ねる。 台座 1.30mm の <strong>23%<\/strong> で、これが櫛の歯になる。縁で接線が水平に なる式へ替えると消える。<\/p>\n<table><tr><th>式<\/th><th>r=0.5 の高さ<\/th><th>縁の 1マスぶんの段差<\/th><\/tr><tr><td><code>1-r²<\/code>（放物面）<\/td><td>0.750<\/td><td><strong>298µm<\/strong><\/td><\/tr><tr><td><code>(1-r²)²<\/code><\/td><td>0.562<\/td><td>32µm<\/td><\/tr><tr><td><strong><code>(1-r⁴)³<\/code>（採用）<\/strong><\/td><td><strong>0.824<\/strong><\/td><td><strong>23µm<\/strong><\/td><\/tr><\/table>\n<p><code>(1-r²)²<\/code> は縁は直るが<strong>肩が痩せて石が三角帽子になった<\/strong>ので採らな かった。<code>(1-r⁴)³<\/code> は放物面より肩が太く（0.824 対 0.750）、冠が 平たく、ガードルへ接線で降りる——カボションの形そのもの。 球面 <code>√(1-r²)<\/code> は縁が垂直になる（＝オーバーハング）ので使えない。<\/p>\n<h4>ただし、ガードルの壁の縦縞は残っている<\/h4>\n<p>寄った絵を見ると、<strong>石の腰の壁にまだ細い縦縞がある。<\/strong>上で直したのと 別物なので、直ったと書いてはいけない。上のは<strong>高さ方向の段<\/strong>（ふくらみの 式が縁で急なこと）で、これは<strong>平面方向の段<\/strong>——面の格子でできた輪郭の 階段が、1.30mm の垂直な壁として立っているだけ。<\/p>\n<table><tr><th><\/th><th>直径 5mm の石ひとつ<\/th><\/tr><tr><td>面の格子 1マス<\/td><td>136.7µm（7.31px/mm）<\/td><\/tr><tr><td>直径にあたるマス数<\/td><td>36.6<\/td><\/tr><tr><td>外周の段数<\/td><td>115<\/td><\/tr><tr><td>1段の大きさ ÷ 直径<\/td><td><strong>2.7%<\/strong><\/td><\/tr><\/table>\n<p><strong>元絵をいくら細かく描いても直らない。<\/strong>面モードの［最終解像度］は 2048 が上限で、210mm を 1536 マスに割るとこれが最小の刻み。1個 5mm の 物を 347 個置くという構図そのものが、1個あたり 36 マスしか使えない ということで、石を大きくするか数を減らすかしかない。造形では 137µm の段は爪に引っかからない大きさなので実害は無いと判断したが、 <strong>絵では見える。<\/strong>（→ 欲しい機能 #57）<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>透明が主題として成立した最初の作例。<\/strong>寄って見ると、色付きの芯が 透明の膜の内側にあることが読める。石の裾の透明のリングが座金に 見えて、「1粒ずつ台に留めてある」という読みまで付いてきた。<\/li><li><strong>光で表情が変わる。<\/strong>真上では乳白の玉、斜めではガラスの粒、逆光では 深い紫と濃緑の石。1枚では説明できない材なので、3方向を撮った。<\/li><li><strong>［クリアの濁り］は 0.24 では白すぎた。<\/strong>0.15 まで下げて芯の色が 戻った。<strong>これは画面だけの値<\/strong>で、書き出しには乗らない——実機では GrabCAD Print 側でクリアの見え方を決める。<\/li><li><strong>腰の壁の縦縞は見える。<\/strong>造形では 137µm なので触っても分からないが、 寄った絵では 1 個ずつに縦の筋が出る。上の節のとおり面モードの解像度の 上限そのもので、この構図では消せない。<\/li><li><strong>弱いのは石の大きさが 1 種類なこと。<\/strong>本物のビーズ刺繍は粒の大きさを 混ぜて密度を作る。ここは全部 5mm なので、離れて見ると等間隔の点描に なり、図版の線の細い所（花芯の筋、葉脈）が丸ごと落ちている。 格子を 2 段（5mm と 3mm）にすれば拾えるはずで、次の課題。<\/li><li>縦横比 0.82 で、この作例室が繰り返し寄ってきた「細く高い棘」からは 遠い。高さは石の<strong>厚み<\/strong>として出ていて、突起としては出ていない。<\/li><li>石の間の 1.0mm は条文の 0.6mm を満たすが、指で触ると溝が浅い。 刺繍らしさを出すなら 1.5mm まで空けたほうが粒が立つ。<\/li><\/ul>\n<h3>作例79 からの宿題について<\/h3>\n<p>作例79 には「次の作例で、色付き材の側を帯に割る」と書いた。 <strong>それはまだ果たしていない。<\/strong>ここで使ったのは［範囲］＝外皮で、 色付きと透明は<strong>内と外<\/strong>に分かれていて、高さ方向の帯にはなって いない。［範囲］＝帯 は 4 択のうち唯一まだ一度も使っていないので、 宿題は次へ持ち越す。<\/p>\n<h3>服として<\/h3>\n<p>前身頃の胸元に置く 101 × 223mm のパネル。紙面（210 × 280mm）の まわりの白は縫い代で、石はそこへ 1 粒も入らない。黒い平織の上に 刷る想定で、石が乗っていない所は生地がそのまま出る。石は 4.1mm 厚なので、裏に接着芯を貼らないと表から粒の重さで引かれる。 洗濯は不可。<\/p>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_80.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_top.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --azim 270 --elev 34 --name preview_low --final\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --azim 270 --elev 26 --name preview_back --sun-azim-offset 170 --sun-elev 11 --sun-energy 6 --world 0.12 --final\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; --at 0.47,0.70 --span 26 --elev 32 --back-elev 60 --final<\/pre>\n<p><strong>斜めの絵はどれも方位を 270° で撮ってある。<\/strong>六方格子は 60° ごとに 列が揃うので、方位 300° で撮ると<strong>列が前後に重なって数珠になる<\/strong> （実際にそう撮って気づいた）。0/60/120/180/240/300 を外すこと。 <code>--final<\/code> も要る——石の輪郭はプレビュー解像度では読めない。<\/p>\n<p>作った版は <strong>7.191.0<\/strong>（<code>_samples_wt<\/code>）。folder は 981KB。<\/p>","imgs":[{"c":"真上","d":"img/80_preview_top.jpg"},{"c":"低い角度から","d":"img/80_preview_low.jpg"},{"c":"逆光ぎみ（方位 300°・仰角 22°）","d":"img/80_preview_back.jpg"},{"c":"拡大","d":"img/80_preview_macro.jpg"}]},{"num":"81","title":"雲海 — 高さが一本の帯になる","mode":"SURFACE","path":"docs/samples/81_雲海_高さが一本の帯になる","text":"<p class=\"lead\">130 × 177mm の山岳地形を、<strong>高さ 4.4〜6.6mm の水平な層だけが透明材<\/strong>に\nなるように作った。谷は穴、低い尾根は色付きのまま板の中に沈み、\n<strong>その帯より高く育った峰だけがガラスを突き抜けて顔を出す。<\/strong>\n真上から見ると峰のまわりに透明の輪ができ、低い角度から見ると\n山列の腰のあたりに水平な光の帯が一本走る。<\/p><p>130 × 177mm の山岳地形を、<strong>高さ 4.4〜6.6mm の水平な層だけが透明材<\/strong>に なるように作った。谷は穴、低い尾根は色付きのまま板の中に沈み、 <strong>その帯より高く育った峰だけがガラスを突き抜けて顔を出す。<\/strong> 真上から見ると峰のまわりに透明の輪ができ、低い角度から見ると 山列の腰のあたりに水平な光の帯が一本走る。<\/p>\n<p>［範囲］＝<strong>帯<\/strong>（BAND）を主題にした、この部屋で最初の作例。 上だけ・下だけ・外皮は「物の形に沿って」透明にするが、<strong>帯だけは 物の形と無関係に、決まった標高で水平に切る<\/strong>——だから「雲」になる。<\/p>\n<h3>仕組み<\/h3>\n<ul><li>元絵は Codex に描かせた侵食地形（<code>terrain_a.png<\/code>）1 枚。そこから <code>tools/make_art_81.py<\/code> が<strong>輪郭（<code>source.png<\/code>）と高さ（<code>depth_map.png<\/code>） の 2 枚を同じ場から起こす<\/strong>。海面 0.38 より低い所は輪郭ごと落とすので、 谷はレリーフの凹みではなく<strong>貫通した穴<\/strong>になる。<\/li><li>標高は <code>((b - 海面) / (1 - 海面)) <strong> 1.8<\/code>。ガンマ 1.8 が谷を平らに 寝かせ、峰だけを尖らせる。<\/strong>これが無いと、この作例は成立しない** ——線形のままだと全体がなだらかで、帯より上に出る峰がほとんど無い。<\/li><li>透明は［範囲］＝帯／［出どころ］＝高さ／［方式］＝比率／ ［色付き部分］80%。帯は<strong>全高の 40〜60%<\/strong>（＝ 4.4〜6.6mm）に水平に 入る。実測 4.400〜6.600mm。<\/li><li><strong>高さ図は 16bit で書く。<\/strong>8bit だと 10mm を 256 段で刻むので、なだらかな 斜面に 0.039mm の等高線が出る（最初にそれで撮って、寄った絵が無数の輪に なった）。ただし Blender は 16bit の PNG を float 扱いで読み、そのとき <strong>sRGB → リニアに直してしまう<\/strong>ので、書く側で先に sRGB へ符号化しておく （実測: バイト 128 が 8bit なら 0.502、16bit なら 0.215 で読まれる）。 段数は 4096 に落としてある——素の 16bit は PNG が 1.8MB になり、 作例 1 件 1MB の枠に入らない。0.0024mm 刻みなら等高線は出ない。<\/li><li>色は元絵と同じ場から起こしたランプ（濃紺 → 藍 → 青灰 → 白）で、 標高がそのまま色になる。だから峰は雪、谷は深い水面に見える。<\/li><\/ul>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>130 / 177mm<\/td><\/tr><tr><td>高さの決め方<\/td><td>高さマップ（<code>depth_map.png<\/code>）<\/td><\/tr><tr><td>最大高さ（下地の板）<\/td><td>1.0mm<\/td><\/tr><tr><td>高さマップの強さ<\/td><td><strong>10.0mm（上限）<\/strong><\/td><\/tr><tr><td>最終 / プレビュー解像度<\/td><td>2048 / 768<\/td><\/tr><tr><td>透明<\/td><td>入／［範囲］帯／［出どころ］高さ／［方式］比率<\/td><\/tr><tr><td>色付き部分<\/td><td>80%（帯の厚み＝全高の 20%）<\/td><\/tr><tr><td>クリアの濁り / 色<\/td><td>0.22 / (0.82, 0.90, 0.97) ※画面だけ<\/td><\/tr><tr><td>角の丸み<\/td><td><strong>切<\/strong>（0.30mm・2 分割と記録。効いていない／2026-09-06 に訂正）<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>入<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><\/tr><tr><td>側面<\/td><td>テクスチャ<\/td><\/tr><tr><td>生地<\/td><td>カスタム色 (0.008, 0.012, 0.022)<\/td><\/tr><tr><td>面を分割する<\/td><td>切<\/td><\/tr><\/table>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>130.0 × 172.9 × 11.00mm<\/td><\/tr><tr><td>底の高さ<\/td><td>0.0000mm<\/td><\/tr><tr><td><strong>オーバーハング<\/strong><\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><\/tr><tr><td>透明の帯<\/td><td>z 4.400 〜 6.600mm（狙い 4.4〜6.6）<\/td><\/tr><tr><td>クリアの面<\/td><td>189,381 面 / 全体の 5.3%<\/td><\/tr><tr><td>材のある面積<\/td><td>紙面の 53.5%<\/td><\/tr><tr><td>帯が平面を占める割合<\/td><td>11.5%<\/td><\/tr><tr><td>帯より高い所<\/td><td>材の 5.4%<\/td><\/tr><tr><td>高さ 中央値 / 最大<\/td><td>2.03 / 11.00mm<\/td><\/tr><tr><td>肉の幅 中央値 / 10% / 最大<\/td><td>13.3 / 2.5 / 46.7mm<\/td><\/tr><tr><td>頂点 / 生成時間<\/td><td>4,119,182 / 34.4 秒<\/td><\/tr><tr><td>元絵 / 高さ図<\/td><td>175KB / 390KB（16bit・12px/mm と 6px/mm）<\/td><\/tr><\/table>\n<p>道具が出した行は 3 本。「実際の造形範囲 130.0 × 172.9 × 11.00mm」は 奥行きが指定の 177 より 4.1mm 短い——海面で切った結果、上下の縁に材が 残らない帯があるため。「1 つの要素が 130×173mm」は #56 のとおり 繋がった 1 枚なので上限 15mm に対して必ず鳴る（この作例は板として 刷る前提）。「重くなる可能性があります」は解像度 2048 × 高さ 11mm で、 実際 34 秒。<\/p>\n<h3>途中で捨てた案<\/h3>\n<p><strong>最初は 220 × 300mm・全高 8mm で作って、低い角度の絵を見て捨てた。<\/strong> 真上からは雪山の連なりとして良く見えたのに、横から見ると<strong>ただの板<\/strong>で、 帯はどこにも見えない。起伏が幅の 2.7% しかないため。利用者から 「低いオブジェクトで全面を埋めるような形が多い」と言われている、 まさにその形だった。<\/p>\n<p>戻し方を 2 つ測って、どちらも捨てた。<strong>海面を上げる<\/strong>（0.38 → 0.70）と 樹枝状の地形は細いレースになり（肉の幅 中央値 5.9mm で 53mm の距離を 渡る）、峰の塊にならない。<strong>孤立した円錐を Codex に描き直させる<\/strong>と ガウスの山が 15 個並んだ図になり、2026-08-19 に退けられた 「手続き的に見える絵」そのものだった。<\/p>\n<p>採ったのは<strong>紙面を縮めてガンマを掛ける<\/strong>こと。130 × 177mm へ落とし、 標高を 1.8 乗して峰へ寄せた。起伏 / 幅は 2.7% → <strong>8.5%（3.1 倍）<\/strong>。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>この作例が成立しているのは、逆光の低い角度の 1 枚だけ<\/strong>（<code>preview.jpg<\/code>）。 そこでは帯が<strong>同じ標高に並ぶ水平な光の棚<\/strong>として読め、その上へ峰が 突き抜けている。「雲海」という言い分が絵で立つのはこの角度で、 だから代表の絵をこれにした。<\/li><li><strong>真上（<code>preview_top.jpg<\/code>）と 45°は弱い。<\/strong>真上は峰が白い塊になって 帯が読めず、輪郭も<strong>インクの染みのようで山に見えない<\/strong>。地形が紙面の 右と下で四角く切れているのも目に付く——元絵をそのまま矩形で切った ままなので、島として閉じていない。次に地形をやるなら、縁を海面へ 落として閉じる。<\/li><li><strong>8bit の等高線は消えた。<\/strong>16bit・4096 段で 0.0024mm 刻みになり、 寄った絵（<code>preview_macro.jpg<\/code>）にあった無数の輪は無い。<\/li><li><strong>代わりに、別の階段が残っている。<\/strong>高さ図が 6.0px/mm なのに対して メッシュの格子は 11.57px/mm で、<strong>高さ図の 1 画素がメッシュの 1.93 マス<\/strong> にあたる。当て込みは最近傍なので、隣り合うマスの段差は <strong>中央値 0.0238mm・90% 0.0817mm・99% 0.1491mm・最大 0.2281mm<\/strong>、 <strong>45.8% が積層ピッチ 0.027mm を超える<\/strong>。これは色の段数ではなく <strong>画素の粗さ<\/strong>から来る階段で、高さ図を作り直す以外に道具の側の逃げ道は 無い（→ 欲しい機能 #60）。<\/li><li>［クリアの濁り］0.22 は<strong>画面だけの設定<\/strong>で、書き出しには乗らない。 刷ったときの透明材の色は GrabCAD Print 側で指定する。<strong>この絵の 水色は「こう刷れる」ではなく「こう見立てた」<\/strong>。<\/li><li>濁りを上げることは考えて、やめた。上げると不透明側へ寄るので、 真上の白い塊がさらに重くなる。帯が読めることは逆光の 1 枚で既に 証明できている。<\/li><li>捨てた 220 × 300mm 版との差は数字で出ている（起伏 / 幅 2.7% → <strong>8.5%<\/strong>）。「もっと高さを出した作品も見たい」という依頼に対しては、 紙面を縮めるほうが有効だった——高さを上げるより先に、<strong>幅を疑う<\/strong>。<\/li><li>帯が平面を占めるのは 11.5%、帯より高い材は 5.4%。透明材を主題に 据えた割にはまだ控えめで、<strong>次は帯を厚くするか、［出どころ］＝画像で 柄そのものをガラスにする<\/strong>ほうへ振る。<\/li><\/ul>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_81.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_top.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --azim 205 --elev 14 --name preview --sun-azim-offset 180 --sun-elev 10 --sun-energy 5.0 --world 0.06 --final\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --azim 205 --elev 9 --name preview_low --sun-elev 14 --final\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; --at 0.46,0.40 --span 58 --elev 26 --final<\/pre>\n<p>代表の <code>preview.jpg<\/code> は<strong>逆光<\/strong>（<code>--sun-azim-offset 180<\/code>）で、世界の 明るさを 0.06 まで落として撮ってある。帯を透かして見せる絵なので、 順光で撮ると帯が地の色に沈む。<code>layout.json<\/code> に海面・ガンマ・段数を 置いてある。folder は約 953KB。作った版は 7.191.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/81_preview.jpg"},{"c":"真上","d":"img/81_preview_top.jpg"},{"c":"低い角度から","d":"img/81_preview_low.jpg"},{"c":"拡大","d":"img/81_preview_macro.jpg"}]},{"num":"82","title":"ビジュー — 樹脂に浮かぶ石","mode":"BRISTLE","path":"docs/samples/82_ビジュー_樹脂に浮かぶ石","text":"<p class=\"lead\">胸元を覆うビジューのプラストロン（300 × 310mm）を、六角断面の柱\n3,399 本で組んだ。<strong>柱 1 本が 1 つの石<\/strong>で、しかもその石は柱の中に\n埋まっている——外側は高さ 10mm の透明な棒、中に 直径 1.6mm・\n高さ 4.5mm の色付きの芯が、<strong>生地から 5.0mm 浮いた所に宙吊り<\/strong>で\n入っている。<\/p><p>胸元を覆うビジューのプラストロン（300 × 310mm）を、六角断面の柱 3,399 本で組んだ。<strong>柱 1 本が 1 つの石<\/strong>で、しかもその石は柱の中に 埋まっている——外側は高さ 10mm の透明な棒、中に 直径 1.6mm・ 高さ 4.5mm の色付きの芯が、<strong>生地から 5.0mm 浮いた所に宙吊り<\/strong>で 入っている。<\/p>\n<p>透明材を主題にした最初の作例。［範囲］＝<strong>外皮<\/strong>（v7.157.0）と ［底の外皮(mm)］（v7.163.0）の組み合わせで、色付きの芯を四方と 上下から透明材でくるみ、底side を 5mm 持ち上げた。<strong>1 つの物の中で 色付き材と透明材を混ぜられる J850 でしか成立しない形<\/strong>で、他の 造形法だと「浮いている石」は支持材なしには作れない。<\/p>\n<h3>仕組み<\/h3>\n<ul><li>柱 1 本 ＝ 六角柱（先細り 0.72・上端の丸み 0.55）。直径 2.6mm、 中心間隔 3.30mm、すき間 0.70mm。高さは［高さを揃える］入で全部 10mm。<\/li><li>［透明］の［範囲］を <strong>外皮<\/strong>、［方式］を <strong>厚み(mm)<\/strong>、 ［色付き部分］を <strong>0.5mm<\/strong> にした。芯の直径はアドオンの式 <code>max(D − 2t, 0.35D)<\/code> = <code>max(2.6 − 1.0, 0.91)<\/code> = <strong>1.6mm<\/strong> で、 実測とぴったり一致する。<\/li><li>［底の外皮］を <strong>5.0mm<\/strong>。芯の高さは <code>H − t − L<\/code> = <code>10 − 0.5 − 5.0<\/code> = <strong>4.5mm<\/strong>、底上げが 5.0mm。頭打ちの条件 <code>L ≤ 0.65H − t<\/code> = 6.0mm を 下回るので、頼んだ 5.0mm がそのまま立つ。<\/li><li>実測で <strong>芯は z 5.0000 〜 9.5000<\/strong>、外側の透明は z 0.0000 〜 10.0000。 式どおりで、丸めも取りこぼしも無い。<\/li><li>色は［画像から］。柱モードは色も高さも同じ 1 枚から読むので、 宝石の色を残すために高さは振らず［高さを揃える］を入にした （→ 欲しい機能 #61）。<\/li><\/ul>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><\/tr><tr><td>列数 / 行数<\/td><td>91 / 95<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>297.0 / 310.2mm（中心間）<\/td><\/tr><tr><td>断面 / 頂点数<\/td><td>六角 / 6<\/td><\/tr><tr><td>半径<\/td><td>1.3mm<\/td><\/tr><tr><td>間隔 / 間隔保持<\/td><td>0.70mm / 入<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td>10.0mm / <strong>入<\/strong><\/td><\/tr><tr><td>先細り / 上端の丸み<\/td><td>0.72 / 0.55<\/td><\/tr><tr><td>明暗による半径変化 / 間引き / 縁の整列<\/td><td>切 / 切 / 切<\/td><\/tr><tr><td>色<\/td><td>画像から<\/td><\/tr><tr><td><strong>透明<\/strong><\/td><td><strong>入<\/strong><\/td><\/tr><tr><td>［範囲］<\/td><td><strong>外皮<\/strong><\/td><\/tr><tr><td>［出どころ］ / ［方式］<\/td><td>高さ / 厚み(mm)<\/td><\/tr><tr><td>［色付き部分］<\/td><td><strong>0.5mm<\/strong>（＝外皮の厚み）<\/td><\/tr><tr><td>［底の外皮］<\/td><td><strong>5.0mm<\/strong><\/td><\/tr><tr><td>［クリアの濁り］ / ［クリアの色］<\/td><td>0.10 / (0.90, 0.94, 1.00)<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><\/tr><tr><td>生地<\/td><td>織り・カスタム色 (0.030, 0.031, 0.038)<\/td><\/tr><\/table>\n<h3>元画像<\/h3>\n<p><code>source.png<\/code> は <strong>パレット PNG（P + tRNS）1200 × 1240（4px/mm）、192KB<\/strong>。 元の絵は Codex に「背景を透過にして」と頼んで描かせたビジューの プラストロン（RGBA 1.7MB）で、<code>tools/make_art_82.py<\/code> がやるのは 3 つだけ。<\/p>\n<p>1. 材のある所へ切り詰めて 4px/mm へ揃える 2. 色を 48 に減らし、<strong>パレット PNG で保存する<\/strong> 3. アルファを 0/1 に倒す<\/p>\n<p><strong>RGBA のままだと 767KB<\/strong> で、作例 1 件 1MB の枠に入らない。塗りが 平らな絵なので、48 色のパレット＋透過 1 色にすると <strong>192KB<\/strong>—— 同じ画素数のまま 4 分の 1 になる。<strong>輝度はいじっていない<\/strong>（触ると 宝石の色が薄くなる）。<\/p>\n<p>元の絵は生成のたびに変わるので、同じ絵はもう一度は出ない。 <code>layout.json<\/code> に mm・画素・色数・材の占有率・輝度の分位を残してある。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>293.0 × 305.9 × 10.00mm<\/td><\/tr><tr><td>柱の本数<\/td><td>3,399（格子 91 × 95 = 8,645 のうち 39.3%）<\/td><\/tr><tr><td>直径 / 中心間隔 / すき間<\/td><td>2.600 / 3.300 / <strong>0.700mm<\/strong><\/td><\/tr><tr><td>芯の直径 / 高さ<\/td><td><strong>1.600 / 4.500mm<\/strong><\/td><\/tr><tr><td>芯の z 範囲<\/td><td><strong>5.0000 〜 9.5000<\/strong>（床から 5.0mm 浮く）<\/td><\/tr><tr><td>外側（透明）の z 範囲<\/td><td>0.0000 〜 10.0000<\/td><\/tr><tr><td>材の面の比<\/td><td>色付き 1,189,650 / クリア 1,189,650（<strong>50.0% / 50.0%<\/strong>）<\/td><\/tr><tr><td>縦横比<\/td><td><strong>3.85<\/strong>（10.0 ÷ 2.6）<\/td><\/tr><tr><td>底の高さ<\/td><td>0<\/td><\/tr><tr><td>オーバーハング<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><\/tr><tr><td>柱のメッシュ<\/td><td>2,406,492 頂点 / 2,379,300 面（1 本あたり 708 頂点）<\/td><\/tr><tr><td>生成時間<\/td><td>10.0 秒<\/td><\/tr><\/table>\n<p>道具が出した行は 4 本で、<strong>警告は 1 本も無い<\/strong>。「実際の造形範囲 293.0 × 305.9」は指定（中心間 297.0 × 310.2）から直径 1 本ぶんを 引いた値ではなく、<strong>柄が端まで無い分だけ内側に寄った<\/strong>もの。 柄の周期を測ると 33.3mm で、柱の間隔 3.30mm の <strong>10.1 倍<\/strong>あるので、 v7.187.0 の「1 周期を柱 N 本で運ぶ」警告が黙るのは正しい。<\/p>\n<h3>絵は 4 枚撮った<\/h3>\n<p>透明材の見え方は光の角度で変わるので、1 枚では足りない。<\/p>\n<table><tr><th>絵<\/th><th>何が読めるか<\/th><\/tr><tr><td><code>preview.jpg<\/code>（見上げ 55°）<\/td><td>プラストロンの形と、柱の面としての密度<\/td><\/tr><tr><td><code>preview_top.jpg<\/code>（真上）<\/td><td>輪郭。ビブ・ネックレスの形そのもの<\/td><\/tr><tr><td><code>preview_macro.jpg<\/code>（寄り 30°）<\/td><td>石の色。コバルト・藍・アメシスト・氷白<\/td><\/tr><tr><td><code>preview_float.jpg<\/code>（<strong>寄り 9°・逆光<\/strong>）<\/td><td><strong>石が浮いていること<\/strong><\/td><\/tr><\/table>\n<p><strong>低い角度の全景（<code>preview_low<\/code>）は捨てた。<\/strong>撮ってみると暗く平らな 塊にしかならず、<code>preview.jpg<\/code> に足すものが無かった。<\/p>\n<p><code>preview_float.jpg<\/code> がこの作例の証明。アメシストの石が柱の途中で 終わっていて、その下は空の透明——石が宙に浮いているのが 1 枚で読める。 <strong>低い角度と逆光でしか読めない<\/strong>ので、<code>render_macro.py<\/code> の既定 （見上げ 20°）では出てこない。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>形は良い。<\/strong> 真上からの輪郭はビブ・ネックレスそのもので、 「これは首から胸へ掛ける物だ」が説明なしで分かる。柱の粒が そのままビーズに見えるので、柱モードとビジューの相性は良い。<\/li><li><strong>浮いていることは、寄って低い角度でしか読めない。<\/strong> これは正直に 弱点。全景では柱の上半分しか見えず（隣の柱が下半分を隠す）、 この作例のいちばんの見せ場が主画像に出ていない。手当ては 「浮かせる量をもっと大きく取って柱を疎にする」か「縁に 1 列だけ 背の高い柱を立てて断面を見せる」かで、次に外皮をやるなら試す。<\/li><li><strong>真上からは灰色の粒に見える。<\/strong> 外皮は天面も 0.5mm 包むので、 真上から見えるのは透明の蓋で、石の色は側面からしか読めない。 仕様どおりだが、「宝石」として売るなら天面だけ色を出したくなる。 ［範囲］に「側面だけ」があれば解けるが、無い機能の話なので ここでは形のほうを合わせるべきだった。<\/li><li><strong>色は寄れば十分に出る。<\/strong> 48 色に落としても、コバルト・藍・ アメシスト・スレート・氷白がきちんと分かれている。<\/li><li><strong>［クリアの濁り］0.10 は見立てで、刷り上がりの色ではない。<\/strong> この設定と［クリアの色］は画面だけのもので、書き出しには乗らない （実機側は GrabCAD Print で指定する）。0.22 で撮ると白い靄になって 石の色が全部飛んだので下げた——<strong>絵を作るための値<\/strong>であって、 この作例が「こう刷れる」と言っているのではない。<\/li><li>縦横比 3.85 は棘ではない。上端が丸く、隣と同じ高さで揃っているので、 1 本ずつが立っているようには見えない。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>胸元のプラストロン。生地は黒に近い濃紺で、そこへ 300 × 310mm を 1 枚で刷る。裁断は柱の外側で取り、首まわりの V は元絵の形のまま。 <strong>重い<\/strong>——柱 1 本あたり約 40mm³、全体で約 136cm³ の概算なので、 実際に着るなら芯地と肩ヨークで吊る前提になる。洗濯は不可。<\/p>\n<p>浮いた芯は支持材なしで刷れる（オーバーハング 0 面）。透明材の中に 色付き材が閉じ込められるので、<strong>石は外に出てこない<\/strong>——ビーズの 落下や糸切れが原理的に起きない、という言い方もできる。<\/p>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_82.py          # 元データ（要: 透過 PNG）\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_top.py   -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_view.py  -- &lt;この folder&gt; --azim 180 --elev 55 --sun-elev 40 --sun-energy 4.5 --world 0.07 --name preview --final\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; --at 0.5,0.5  --span 40 --elev 30 --final\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; --at 0.50,0.06 --span 16 --elev 9 --name preview_float --final<\/pre>\n<p><strong><code>make_sample.py<\/code> は <code>preview.jpg<\/code> を自分の絵で上書きする<\/strong>（見上げ 20°・ 灰色の背景）ので、<code>render_view.py<\/code> は必ずそのあとに走らせること。 作り直しのたびに 1 度踏んだ。<\/p>\n<p><code>make_art_82.py<\/code> は元の RGBA を <code>BF_ART82_RAW<\/code> で指す（既定は scratchpad の <code>plastron_a.png<\/code>）。<code>settings.json<\/code> は作例 77 を土台に 上の表の値へ変えたもの。folder は約 958KB。<\/p>\n<p>作った版は <strong>7.191.0<\/strong>（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/82_preview.jpg"},{"c":"真上","d":"img/82_preview_top.jpg"},{"c":"拡大","d":"img/82_preview_macro.jpg"},{"c":"浮かせた状態","d":"img/82_preview_float.jpg"}]},{"num":"83","title":"浮花 — 花びらだけが宙に残る","mode":"BRISTLE","path":"docs/samples/83_浮花_花びらだけが宙に残る","text":"<p class=\"lead\">234 × 297mm の面に、桜の花びらの断面を持つ柱を 747 本立て、**柱の下 80% を\nガラス（透明材）、上 20% だけを色付き材**にした。脚が透けるので、遠目には\n色の付いた花びらだけが布から浮いて見える。<\/p><p>234 × 297mm の面に、桜の花びらの断面を持つ柱を 747 本立て、<strong>柱の下 80% を ガラス（透明材）、上 20% だけを色付き材<\/strong>にした。脚が透けるので、遠目には 色の付いた花びらだけが布から浮いて見える。<\/p>\n<p>［透明］→［範囲］の 4 択のうち、<strong>［下だけ］を使った最初の作例<\/strong>。 これまで 30 件で上だけ 25・外皮 4・帯 1、下だけは 0 件だった。<\/p>\n<p>「透明色を扱えることもこのプリンタならではだと思う」という指示への答えで、 <strong>形が決まってから上を透かしたのではなく、「脚を消す」ことを先に決めて そこから形を組んでいる。<\/strong><\/p>\n<h3>仕組み<\/h3>\n<ul><li>格子は 27 × 34 に固定（<code>pin_grid<\/code>）、間隔 9.0mm。断面は SVG の花びらで 外接 6.5mm なので、隣との余白が 2.5mm ある。［向き］は <strong>FLOW<\/strong>（明るさの 等値線に沿う）なので柱ごとに回るが、この余白があるかぎりどう回っても ぶつからない。<\/li><li>色は［高さでグラデーション］（5 点・暗い臙脂 → 桜色）。明るさは高さだけを 動かすので、<strong>明るさと色を別々に設計できる。<\/strong><\/li><li><strong>高さ場は 0 からではなく 0.42〜1.0 に敷いてある。<\/strong>これがこの作例の要。 高さ 0 から始めると、低い所は脚が短く「布に貼り付いた色の欠片」になって 浮かない（v1 で実際にそう出た）。0.42 を床にすると、いちばん低い柱でも 4.37mm のガラスの脚を持つ。<\/li><li>柱を立てない「風の道」が面積の 19.1%。アルファ 0 で彫ってあり、<strong>画面の端 から端まで通してある<\/strong>——高い側で閉じると向こうが見通せなくなる（v2）。<\/li><\/ul>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><\/tr><tr><td>列数 / 行数<\/td><td>27 / 34（格子に固定）<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>234 / 297mm<\/td><\/tr><tr><td>断面<\/td><td>SVG（桜の花びら・<code>element.svg<\/code>）<\/td><\/tr><tr><td>半径<\/td><td>3.25mm（外接 6.5mm の半分）<\/td><\/tr><tr><td>要素の向き<\/td><td>FLOW（流れに沿う）<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td>13.0mm / 切<\/td><\/tr><tr><td>明度反転<\/td><td>入<\/td><\/tr><tr><td>最小高さカットオフ<\/td><td>0<\/td><\/tr><tr><td>先細り / 上端の丸み<\/td><td>1.0（無し） / 0<\/td><\/tr><tr><td>明暗による半径変化 / 間引き / 縁の整列<\/td><td>切 / 切 / 切<\/td><\/tr><tr><td><strong>透明<\/strong><\/td><td>入・［範囲］下だけ・［出どころ］高さ・［方式］比率<\/td><\/tr><tr><td><strong>色付き部分<\/strong><\/td><td><strong>20%<\/strong>（＝下 80% がガラス）<\/td><\/tr><tr><td>クリアの濁り / クリアの色<\/td><td>0.12 / (0.72, 0.80, 0.90)<\/td><\/tr><tr><td>色<\/td><td>高さでグラデーション（5 点）<\/td><\/tr><tr><td>生地<\/td><td>織り・カスタム色 (0.020, 0.022, 0.038)<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><\/tr><\/table>\n<p><strong>［クリアの濁り］と［クリアの色］は画面だけの設定で、書き出しには乗らない。<\/strong> 見本の絵の青みはこの 2 つで作ったもので、<strong>刷るとこの色になるわけではない<\/strong> （実機側の色は GrabCAD Print で指定する）。<\/p>\n<h3>元画像<\/h3>\n<p><code>source.png<\/code> は RGBA 702 × 891（3px/mm）、70KB。<code>tools/make_art_83.py<\/code> が numpy と PIL で描く。柱モードは絵を<strong>リニアで<\/strong>読むので、狙いの高さ比を sRGB に符号化してから書き出している。断面の SVG も同じ道具が書く。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>240.5 × 303.5 × 13.00mm<\/td><\/tr><tr><td>柱の本数<\/td><td>747<\/td><\/tr><tr><td>頂点数 / 面数<\/td><td>896,400 / 1,072,692<\/td><\/tr><tr><td>花びらの外接<\/td><td>6.51 × 4.11mm<\/td><\/tr><tr><td>花びらの幅 5% / 中央 / 95%<\/td><td>1.26 / 3.91 / 1.83mm<\/td><\/tr><tr><td>高さ 最小 / 10% / 中央 / 90% / 最大<\/td><td>1.89 / 6.93 / 9.54 / 12.20 / 13.00mm<\/td><\/tr><tr><td><strong>ガラスの脚（下 80%）最小 / 中央<\/strong><\/td><td><strong>1.51 / 7.64mm<\/strong><\/td><\/tr><tr><td><strong>色の帽子（上 20%）最小 / 中央<\/strong><\/td><td><strong>0.38 / 1.91mm<\/strong><\/td><\/tr><tr><td>表面積 クリア材 / 色付き材<\/td><td>112,535.8mm²（70.4%） / 47,421.6mm²（29.6%）<\/td><\/tr><tr><td>縦横比（外接 6.5mm 基準）中央 / 最大<\/td><td>1.47 / 2.00<\/td><\/tr><tr><td>底の高さ<\/td><td>0<\/td><\/tr><tr><td>オーバーハング<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><\/tr><\/table>\n<p><strong>元絵の床は 0.42（＝5.46mm）なのに、実測の最小は 1.89mm。<\/strong>下回った柱は 風の道の縁にいる。Blender は読み込みでアルファを乗算するので、アルファ 0 の 道と柄の境目を線形補間で読むと RGB が暗い側へ引かれる——柱モードが読むのは その補間後の値なので、縁 1 列だけ床より低く出る。<strong>設計の抜けではなく、 道の縁が 1 列ぶんなだらかになっているということ。<\/strong><\/p>\n<p><strong>色の帽子の最小 0.38mm は、独立した部品ではない。<\/strong>帽子は柱の一部で、下は ガラスに繋がっている——条文の 0.6mm は繋がった全体に掛かるので、ここは 違反ではない。ただし<strong>花びらの先は幅 0.6mm を切る<\/strong>（長さの 1.8%）ので、 先端は欠ける前提で見ておく（作例 71 の先端と同じ話 / → 欲しい機能 #55）。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>寄りの絵がいちばん強い。<\/strong>ガラスの脚の向こうに布が透けて見え、帽子が 花びらの形（切れ込みまで）を保ったまま上に載っている。FLOW で 1 本ずつ 向きが違うので、同じ形の繰り返しに見えない。狙いは成立した。<\/li><li><strong>逆光の絵が「脚がガラスである」ことの証明になっている。<\/strong>光が脚を抜けて 白く光り、帽子だけが不透明な影として残る。透明材を主題にするなら、 この 1 枚は必ず要る。<\/li><li><strong>真上の絵は太陽を 0.6 倍に落として初めて読めた。<\/strong>既定の 2 灯（合計 5.6）では平らな帽子が真っ白に飛んで、高さのグラデーションが消える。 <code>render_top.py<\/code> に <code>--sun-scale<\/code> を足した（既定 1.0 ＝ 従来と同一）。 <strong>同じ飛び方は <code>render_macro.py<\/code> にもある<\/strong>ので、平らな上面を持つ作例を 次に作るときは疑うこと（→ 欲しい機能）。<\/li><li><strong>弱いのは縦横比 1.47。<\/strong>「もっとモチーフ形状に特徴があり、高さも出した ものを」という指示に対して、<strong>モチーフの特徴は出せたが高さは出ていない。<\/strong> 花びらを 6.5mm と大きく取ったので、13mm でも背が低い。次に［下だけ］を やるなら、断面を 3mm 級に絞って高さ 20mm 側へ振るほうが「浮いている」が 強く出るはず。<\/li><li><strong>低い角度の全景を 1 枚外した。<\/strong>234mm の面に 13mm の柱なので、引くと ただの低い畑に見え、その距離ではガラスが読めなかった。斜め 20° の <code>preview.jpg<\/code> のほうが同じことをよく伝えている。<\/li><li>色付き材が表面積の 3 割しかない。<strong>材料の 7 割がクリアになる<\/strong>ので、 実機のコストはクリアの単価で決まる。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>前身頃 1 枚（234 × 297mm）。脚がガラスなので、下に着る色や肌がそのまま 柄の背景になる——<strong>インナーを変えると同じパネルが別の柄に見える<\/strong>のが この作りの持ち味。風の道は動いたときに空気を抜く筋になる。 柱が 9mm 間隔で疎なので布は素直に曲がるが、花びらが 6.5mm あるので 曲げの内側では隣とぶつかる。曲率のきつい所（脇・肩）には向かない。<\/p>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_83.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py  -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_top.py   -- &lt;この folder&gt; --sun-scale 0.60\nblender --background --factory-startup --python docs/samples/tools/render_view.py  -- &lt;この folder&gt; --final --azim 210 --elev 11 --sun-azim-offset 180 --sun-elev 9 --sun-energy 6.5 --world 0.15 --name preview_back\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; --final --at 0.5,0.5 --span 45 --elev 18<\/pre>\n<p><code>settings.json<\/code> は作例 71 を土台にした。<code>height_ramp<\/code> の 5 点と 列数/行数の固定は <code>make_sample<\/code> が復元する。folder は約 791KB。<\/p>\n<p>作った版は 7.191.0（<code>_samples_wt<\/code>）。v7.180.0 の［一方向の光で撮る］は まだ使っていない。<\/p>","imgs":[{"c":"斜め","d":"img/83_preview.jpg"},{"c":"真上","d":"img/83_preview_top.jpg"},{"c":"逆光ぎみ（方位 300°・仰角 22°）","d":"img/83_preview_back.jpg"},{"c":"拡大","d":"img/83_preview_macro.jpg"}]},{"num":"84","title":"双つの池 — 同じ魚が二度あらわれる","mode":"BRISTLE","path":"docs/samples/84_双つの池_同じ魚が二度あらわれる","text":"<p class=\"lead\">340 × 340mm の水面に、鯉を 5 尾。柱は高さ 15mm で全部そろえてあり、\n<strong>その真ん中 3 分の 1（5.0〜10.0mm）だけが透明材<\/strong>になっている。\nだから低い角度から見ると、1 尾の鯉が<strong>色の帯 2 本<\/strong>になって現れる——\n下は池の底に沈んだ魚、上は水面に浮いた魚、あいだは何も無いガラス。<\/p><p>340 × 340mm の水面に、鯉を 5 尾。柱は高さ 15mm で全部そろえてあり、 <strong>その真ん中 3 分の 1（5.0〜10.0mm）だけが透明材<\/strong>になっている。 だから低い角度から見ると、1 尾の鯉が<strong>色の帯 2 本<\/strong>になって現れる—— 下は池の底に沈んだ魚、上は水面に浮いた魚、あいだは何も無いガラス。<\/p>\n<p>［範囲］＝<strong>帯<\/strong>を使った最初の作例。柱モードで帯を使ったものは、 これが 84 件中 1 件目。<\/p>\n<h3>仕組み<\/h3>\n<ul><li>柱の断面は <strong>SVG の笹の葉形<\/strong>（<code>element.svg<\/code>）。半径 2.1 で <strong>4.20 × 2.18mm<\/strong> の薄い刃になる。［要素の向き］＝<strong>流れに沿う<\/strong>なので、 刃は鯉の輪郭に沿って向きを変え、真上から見ると<strong>鱗<\/strong>として読める。<\/li><li>高さは［高さを揃える］入で全部 15mm。<strong>これは意図した選択<\/strong>で、 透明と色の境目は柱ごとの高さの一定の<strong>割合<\/strong>で決まる（欲しい機能 #62） ため、高さを揃えて初めて割合が一定の mm になり、浮いた層が <strong>本当の平面<\/strong>になる。高さがばらつくと、上の帯が波打って 「2 尾に見える」効果が崩れる。<\/li><li>色は［画像から1本ごと］。鯉の緋・白・黒がそのまま柱 1 本の色になる。<\/li><li>格子は 69 × 69 に固定（<code>pin_grid<\/code>）。ピッチ 340 ÷ 68 = <strong>5.000mm<\/strong> で、 刃の長辺 4.20mm との差が 0.80mm。刃どうしが鼻と尾で向かい合う最悪の 場合でも 0.6mm を割らない。<\/li><\/ul>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><\/tr><tr><td>列数 / 行数<\/td><td>69 / 69（格子に固定）<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>340 / 340mm<\/td><\/tr><tr><td>断面<\/td><td>SVG（<code>element.svg<\/code>・笹の葉形）<\/td><\/tr><tr><td>半径<\/td><td>2.1mm<\/td><\/tr><tr><td>要素の向き<\/td><td>流れに沿う<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td>15.0mm / <strong>入<\/strong><\/td><\/tr><tr><td>先細り / 上端の丸み<\/td><td>1.0（無し）/ 0<\/td><\/tr><tr><td>明暗による高さ・半径変化 / 間引き<\/td><td>全部切<\/td><\/tr><tr><td>色<\/td><td>画像から1本ごと<\/td><\/tr><tr><td><strong>透明<\/strong><\/td><td>入<\/td><\/tr><tr><td>［範囲］<\/td><td><strong>帯<\/strong><\/td><\/tr><tr><td>［出どころ］<\/td><td>高さ<\/td><\/tr><tr><td>［方式］<\/td><td>比率<\/td><\/tr><tr><td>［色付き部分］<\/td><td><strong>67%<\/strong><\/td><\/tr><tr><td>［クリアの濁り］/［クリアの色］<\/td><td>0.10 / 淡い青緑（<strong>画面だけ<\/strong>）<\/td><\/tr><tr><td>生地<\/td><td>織り・カスタム色 (0.022, 0.030, 0.048)<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><\/tr><\/table>\n<h3>［色付き部分］が 67 なのは、それ以外に選べる値が無いから<\/h3>\n<p><strong>測って分かったことで、これは報告に回した（欲しい機能）。<\/strong><\/p>\n<p>柱の側面は、断面の種類ごとに決まった本数の<strong>輪<\/strong>にしか分かれていない。 透明と色の境目はその輪へ吸着するので、指定した値はそこへ丸められる。<\/p>\n<table><tr><th>断面<\/th><th>輪の本数<\/th><th>刻み（最大高さ 15mm のとき）<\/th><\/tr><tr><td>円形<\/td><td>17<\/td><td>0.938mm<\/td><\/tr><tr><td><strong>SVG<\/strong><\/td><td><strong>4<\/strong><\/td><td><strong>5.000mm<\/strong><\/td><\/tr><\/table>\n<p>輪が 0 / 5 / 10 / 15mm の 4 本しか無いので、<strong>SVG 断面 ＋ 帯 で到達できる 状態は 2 つしかない<\/strong>。<\/p>\n<table><tr><th>［色付き部分］<\/th><th>出来るもの<\/th><\/tr><tr><td><strong>33 以下<\/strong><\/td><td>側面が丸ごとクリア。色が残るのは上下の蓋だけ<\/td><\/tr><tr><td><strong>34 以上<\/strong><\/td><td>クリアは<strong>真ん中の 1/3（5.0〜10.0mm）だけ<\/strong><\/td><\/tr><\/table>\n<p>95% と 34% は<strong>頂点まで同一の形<\/strong>になる。つまり利用者が打ち込む数字は ほとんど効かない。当初は 60 と書いていたが、<strong>設定ファイルが嘘をつく<\/strong>ので （実際に作られるのは 1/3）、ちょうど 1/3 を意味する <strong>67<\/strong> へ直した。<\/p>\n<p>丸められること自体は仕方がない。困るのは<strong>丸められたことが画面のどこにも 出ない<\/strong>ことで、そこを報告した。<\/p>\n<h3>元画像<\/h3>\n<p><code>source.png<\/code> は RGBA 900 × 900、375KB。Codex に 「pure black background 抜きの、透過つきの鯉」を描かせ、返ってきた画像の 市松模様の背景を彩度で抜いた（<code>tools/make_art_84.py<\/code> に手順ごと置いてある）。 <strong>同じ絵は二度と出ない<\/strong>ので、<code>source.png<\/code> そのものが残すべき成果物。<\/p>\n<p><code>element.svg<\/code> は同じスクリプトが計算で描く 272 点の多角形。長さ 100 に対し 頭 27.0 / 腹 52.0 / 尾 18.7 の太さで、半径 2.1 では <strong>頭 1.14 / 腹 2.18 / 尾 0.79mm<\/strong>。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>312.9 × 324.2 × 15.00mm（指定 340 × 340）<\/td><\/tr><tr><td>柱の本数<\/td><td>1,050<\/td><\/tr><tr><td>中心間 / すき間（最悪）<\/td><td>5.000 / 0.80mm<\/td><\/tr><tr><td>刃の寸法<\/td><td>4.20 × 2.18mm（尾は 0.79mm）<\/td><\/tr><tr><td>透明の帯<\/td><td><strong>5.00〜10.00mm<\/strong>（全高の真ん中 1/3）<\/td><\/tr><tr><td>クリア材の面<\/td><td>285,600 面 / 52,493.2mm²（表面積の 30.8%）<\/td><\/tr><tr><td>色付き材の面<\/td><td>1,138,200 面 / 117,909.3mm²<\/td><\/tr><tr><td>底面<\/td><td>283,500 面 / 6,461.4mm²（z = 0.0000）<\/td><\/tr><tr><td>オーバーハング<\/td><td><strong>0 面 / 0.00mm²<\/strong><\/td><\/tr><tr><td>縦横比<\/td><td>短辺 6.9 / 長辺 3.6<\/td><\/tr><tr><td>頂点数 / 生成時間<\/td><td>1,142,400（最終）/ 6.7〜8.4 秒<\/td><\/tr><tr><td>設定<\/td><td>適用 352 / 非適用 0<\/td><\/tr><\/table>\n<p>指定 340 に対し実測が 313 × 324 なのは、鯉が絵の四辺まで届いていないため。 道具が出した行は「実際の造形範囲」の 1 本だけで、警告は無かった。 ［高さを揃える］が入なので最小高さの床（0.4mm）の行も出ない（仕様どおり）。<\/p>\n<p><strong>縦横比 6.9 は棘ではなく鱗。<\/strong> 刃は薄い側で 2.18mm あり、隣と 0.80mm しか 離れていないので、1 本ずつ立っているようには見えず、面としてつながって 読める。ただし<strong>アドオンの最小 XY の検査は外接（4.20mm）を見ていて、 本当の細い所（尾の 0.79mm）を見ていない<\/strong>（欲しい機能 #55）。0.79mm は 条文の 0.6mm を上回っているので問題は無いが、検査が見ていないことは 書いておく。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>低い角度の絵で狙いが立っている。<\/strong>1 尾が上下 2 本の帯に分かれ、 あいだが暗く抜けている。「同じ魚が二度あらわれる」は成立した。<\/li><li><strong>真上の絵がいちばん強い。<\/strong>刃が鯉の輪郭に沿って回るので、鱗が 身体の流れに沿って並ぶ。5 尾が鯉としてはっきり読める。ヒレの先は 刃がばらけて散る——これは元絵の細い所が格子より細いからで、 結果として<strong>ヒレが透けて薄くなる<\/strong>のは狙いとして良い方に出た。<\/li><li><strong>寄った絵でガラスがガラスに見える。<\/strong>帯ごしに奥の柱が透けて見えている。 透明材を主題にした作例として、ここがいちばん説得力がある。<\/li><li><strong>弱いのは帯の位置を選べないこと。<\/strong>本当は水面を高さ 4.5mm 付近に 置きたかった（下の魚を厚く、上を薄く）。SVG 断面では真ん中しか 選べないので、意図ではなく制約でこの構図になっている。 次にやるなら円形断面（刻み 0.938mm）で試す——ただし鱗の向きは失われる。<\/li><li><strong>既定の斜め 20° の絵では帯が読めない。<\/strong>この作例は 1 枚では成立しない。<\/li><li>寄った絵で生地の下地が中間の灰色に飛んでいる（本当は限りなく黒に近い 紺）。<code>render_macro.py<\/code> に <code>render_top.py<\/code> の <code>--sun-scale<\/code> が無いため。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>背中から裾へ落ちる 340mm 角のパネル 1 枚。鯉は流れの向きに置いてあるので、 着たときに上下が決まる。透明の帯が全部同じ高さにあるので、<strong>歩くと 帯の位置で光が横一線に走る<\/strong>。生地は濃紺で、透明材ごしに生地が透けて 見えることを前提にしている。洗濯は不可。<\/p>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_84.py           # element.svg を作り直す\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_top.py -- &lt;この folder&gt; --final --sun-scale 0.45\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --final --azim 285 --elev 11 --name preview_low --sun-azim-offset 165 --sun-elev 5 --sun-energy 3.5 --world 0.10\nblender --background --factory-startup --python docs/samples/tools/render_macro.py -- &lt;この folder&gt; --final --at 0.40,0.58 --span 48 --elev 15<\/pre>\n<p><code>source.png<\/code> は生成物なので作り直せない（<code>make_art_84.py<\/code> は Codex が返した画像を渡したときだけ背景を抜き直す）。folder は約 904KB。<\/p>\n<p>作った版は <strong>7.191.0<\/strong>（<code>_samples_wt<\/code>）。v7.180.0 の［一方向の光で撮る］は この作例でもまだ使っていない。<\/p>","imgs":[{"c":"斜め","d":"img/84_preview.jpg"},{"c":"真上","d":"img/84_preview_top.jpg"},{"c":"低い角度から","d":"img/84_preview_low.jpg"},{"c":"拡大","d":"img/84_preview_macro.jpg"}]},{"num":"85","title":"孔雀の眼 — 硝子に沈む羽根","mode":"SURFACE","path":"docs/samples/85_孔雀の眼_硝子に沈む羽根","text":"<p class=\"lead\">190 × 190mm の板に孔雀の眼状紋を彫り、**高さ 2.893mm に一本の水面を引いて、\nそこより低い所を丸ごと透明材にした。**残るのは青緑の輪（3.53mm）と\n金の輪（3.30mm）の 2 本だけで、瞳も藍の輪も、外へ広がる羽枝の扇も、\n全部ガラスの中に沈んでいる。<strong>色が付いているのは面の 6.6% しかない。<\/strong><\/p><p>190 × 190mm の板に孔雀の眼状紋を彫り、<strong>高さ 2.893mm に一本の水面を引いて、 そこより低い所を丸ごと透明材にした。<\/strong>残るのは青緑の輪（3.53mm）と 金の輪（3.30mm）の 2 本だけで、瞳も藍の輪も、外へ広がる羽枝の扇も、 全部ガラスの中に沈んでいる。<strong>色が付いているのは面の 6.6% しかない。<\/strong><\/p>\n<p>［透明］を作例の主題にした最初の 1 件。それまでの作例で［透明］は 「上を少し透かす」以上の役を持っていなかった。ここでは<strong>どこが色で どこがガラスかを、絵の明るさだけで決めている<\/strong>——形と色を別々に指定 してはいない。<\/p>\n<h3>仕組み<\/h3>\n<p>［範囲］＝<strong>下だけ<\/strong>、［出どころ］＝<strong>高さ<\/strong>、［方式］＝比率。 ［色付き部分］18% なので、透明材は <strong>0mm 〜 最高点の 82%<\/strong> を占める。 高さは面モードのレリーフで、元絵の<strong>明るさがそのまま高さ<\/strong>になる。 つまり水面の上下は、元絵に塗った色の<strong>輝度で決まる<\/strong>。<\/p>\n<table><tr><th>帯<\/th><th>面積<\/th><th>輝度 L<\/th><th>高さ<\/th><th>水面 2.893mm から<\/th><\/tr><tr><td>青緑の輪<\/td><td>7.3%<\/td><td>0.882<\/td><td>3.53mm<\/td><td>+0.63 <strong>浮かぶ<\/strong><\/td><\/tr><tr><td>金の輪<\/td><td>11.1%<\/td><td>0.824<\/td><td>3.30mm<\/td><td>+0.40 <strong>浮かぶ<\/strong><\/td><\/tr><tr><td>羽枝<\/td><td>62.7%<\/td><td>0.619<\/td><td>2.48mm<\/td><td>−0.42 沈む<\/td><\/tr><tr><td>藍の輪<\/td><td>10.5%<\/td><td>0.357<\/td><td>1.43mm<\/td><td>−1.47 沈む<\/td><\/tr><tr><td>瞳<\/td><td>8.5%<\/td><td>0.256<\/td><td>1.03mm<\/td><td>−1.87 沈む<\/td><\/tr><\/table>\n<p>いちばん際どい帯でも水面から <strong>0.40mm<\/strong> 離れている。J850 の積層 14µm で 28 層ぶんなので、水面が帯の途中を切って半分だけ色が残る事故は起きない。<\/p>\n<p><strong>元絵は 5 色ちょうど。<\/strong>輝度を先に決めて、そこから色を作った。だから 「金の輪を浮かせたい」は「金の輪の L を 0.824 にする」と同義で、 色の選び方がそのまま造形の指定になっている。<\/p>\n<h3>踏んだ穴を 2 つ書いておく<\/h3>\n<p><strong>1.［明度反転］の既定は「暗いほど高い」。<\/strong> 面モードのレリーフは <code>invert_brightness<\/code> が切のとき <code>lum = 1.0 - lum<\/code> を通る（柱モードに 合わせてある）。設計は「明るい輪が浮かぶ」なので、<strong>入<\/strong>にしないと 狙いがそっくり裏返り、<strong>瞳が塔になる<\/strong>。最初に作った物は最高点が 2.528mm で、これは（1 − 0.256）× 3.4 ＝ いちばん暗い帯の高さだった。<\/p>\n<p><strong>2. 水面は［最大高さ］の比ではなく、実際にできる最高点の比。<\/strong> 透明材の上端は <code>(1 − 18%) × 実際の最高 z<\/code> で決まる。この絵の最も明るい 帯は L = 0.882 なので、［最大高さ］4.0mm に対して<strong>実際の最高点は 3.528mm<\/strong>。4.0 を基準に水面を引くと 2.88 のつもりが実際は 2.53 になり、 羽枝の天井（2.48mm）との差が <strong>0.02mm<\/strong> しか残らなかった。 ［最大高さ］を 4.0 に上げ、［色付き部分］を 18% に下げて逃がしてある。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>190 / 190mm<\/td><\/tr><tr><td>高さの決め方 / 最大高さ<\/td><td>レリーフ / 4.0mm<\/td><\/tr><tr><td>明度反転<\/td><td><strong>入<\/strong>（明るいほど高い）<\/td><\/tr><tr><td>高さの段数 / ぼかし / ガンマ<\/td><td>0 / 0.0 / 1.0<\/td><\/tr><tr><td><strong>透明<\/strong><\/td><td>入<\/td><\/tr><tr><td>範囲 / 出どころ / 方式<\/td><td><strong>下だけ<\/strong> / 高さ / 比率<\/td><\/tr><tr><td>色付き部分<\/td><td><strong>18%<\/strong>（＝水面 2.893mm）<\/td><\/tr><tr><td>クリアの濁り / 色<\/td><td>0.18 / (0.86, 0.93, 0.98)<\/td><\/tr><tr><td>透明しきい値 / 輪郭の吸着<\/td><td>0.5 / 入<\/td><\/tr><tr><td>丸み / 分割数<\/td><td>0.2mm / 2（上端と垂直のみ）<\/td><\/tr><tr><td>面を分割する<\/td><td>切（下の「服として」）<\/td><\/tr><tr><td>色<\/td><td>画像から / 側面もテクスチャ<\/td><\/tr><tr><td>解像度 プレビュー / 確定<\/td><td>768 / 2048<\/td><\/tr><tr><td>生地<\/td><td>表示・単色 (0.010, 0.009, 0.014)・縁 10mm<\/td><\/tr><\/table>\n<p>［クリアの濁り］と［クリアの色］は<strong>画面だけの設定で、書き出しには 乗らない<\/strong>（実機では GrabCAD Print 側で指定する）。見本の絵の見え方を 作るのに使っただけで、刷るとこの色になるという意味ではない。<\/p>\n<h3>元画像<\/h3>\n<p><code>source.png<\/code> は RGBA 1000 × 1000、<strong>127KB<\/strong>。Codex に孔雀の眼状紋の シルエットを描かせ（<code>tools/make_art_85.py<\/code> が読む <code>85_wip/raw.png<\/code>）、 5 つの領域に分けて設計した色へ置き換えたもの。<\/p>\n<ul><li><strong>色は最近傍で、アルファだけ滑らかに縮めた。<\/strong>色まで LANCZOS で縮めると 帯の境目に中間色が生まれ、5 色のはずの絵が数万色になる（実測 425KB → 814KB）。生まれた中間色は<strong>設計していない高さ<\/strong>なので、水面のすぐ上や 下に細い縁ができてしまう。<\/li><li><strong>アルファは 8 段に丸めて保存した。<\/strong>元絵のアルファは実質 2 値 （0 が 43.8%、250〜254 が 27.7%）なのに、そこへ乗った 1 刻みのゆらぎ だけで PNG が 425KB あった。8 段で <strong>127KB<\/strong>。輪郭は 1 画素も動かない ——マスクは alpha &gt; 0.5 で採るので丸めの移動は高々半段（18/255）で、 実測で<strong>しきい値をまたぐ画素は 0 個<\/strong>。丸める前後で RGB も完全に同一 なので、出来る形は変わらない（造形範囲・頂点数とも一致を確認）。<\/li><\/ul>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>188.5 × 187.2 × 3.53mm（指定 190 × 190）<\/td><\/tr><tr><td>面の数<\/td><td>5,801,213<\/td><\/tr><tr><td>色付き材<\/td><td>381,464 面（<strong>6.6%<\/strong>）／ z 2.904 〜 3.527<\/td><\/tr><tr><td>透明材<\/td><td>5,419,749 面（<strong>93.4%<\/strong>）／ z 0.000 〜 2.888<\/td><\/tr><tr><td>水面<\/td><td>2.893mm（2 つの材が重なる高さは無い）<\/td><\/tr><tr><td>底の高さ<\/td><td>0<\/td><\/tr><tr><td>オーバーハング<\/td><td><strong>0 面<\/strong>（下向きで浮いている面 0）<\/td><\/tr><tr><td>頂点数 / 生成時間<\/td><td>7,078,130 / 45.8〜47.2 秒<\/td><\/tr><\/table>\n<p>道具が出した警告は 1 本。「1つの要素が 189×187mm あり、布のようには 曲がりません（上限 15.0mm）」——次の節のとおり<strong>承知のうえで受けている<\/strong>。<\/p>\n<h3>自分の評価<\/h3>\n<p><strong>既定の見本の絵（<code>preview.jpg<\/code>）では、この作例は失敗して見える。<\/strong> 羽枝の扇が不透明な薄灰色に写り、透けているようには一切読めない。全体が 浅い皿に見え、瞳には狙っていない灰色のにじみが出る。透明材こそが主題 なのに、それが画面に出ていない。<\/p>\n<p><strong>逆光ぎみの <code>preview_back.jpg<\/code> が、この作例の絵。<\/strong>ここでは羽枝を透かして 下の黒い生地が見え、縁だけが光を拾う。金と青緑の 2 本の輪だけが不透明な 色として浮かび、狙いがそのまま出ている。低い角度の <code>preview_low.jpg<\/code> も ガラスの繊維束のように読めて良い。真上（<code>preview_top.jpg<\/code>）はグラフィック としては綺麗だが、透けは読めない。<\/p>\n<p>つまり<strong>透明材の見え方は光の当て方でここまで変わる<\/strong>ということ自体が、 この作例のいちばんの収穫だった。既定の 4 灯は四方から当てるので、 透明な物のいちばん透明な部分に何も起きない。透明を主題にする作例は、 <strong>見本の絵を 1 枚で済ませてはいけない<\/strong>（→ 欲しい機能 #64）。<\/p>\n<p>弱いところ:<\/p>\n<ul><li><strong>羽枝の縁に段が出る。<\/strong>解像度 2048 でも、細い羽枝の側面は水平の縞に なって見える。羽枝の幅が約 1.75mm しかないので 1 本あたり 19 画素で、 斜めの縁が階段になる。［輪郭の吸着］は入れてあるが、これは輪郭の話で 高さの段には効かない。<\/li><li><strong>板として厚い。<\/strong>3.53mm の板が 190mm 角で 1 枚あるので、手に持つと ガラスのタイルで、布ではない。次にやるなら板の総厚を 2mm 台に落とし、 水面をもっと下げて透明の層を薄くしたい。<\/li><li>瞳（1.03mm）は沈みすぎていて、真上から見ると輪郭がぼやける。設計上は 「いちばん深く沈む」で正しいが、絵としては藍の輪と区別が付きにくい。<\/li><li>v7.180.0 の［一方向の光で撮る］はまだ使っていない。逆光を自分の道具で 作ったが、あちらを使えば同じことが 1 つの設定でできるはず。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>分割していない。<\/strong>羽枝は幅 1.75mm しかないので、［面を分割する］を 入れると割れ目が羽枝を刻んで柄そのものが失われる。だから 「1つの要素が 189×187mm」の警告は<strong>受けたうえで残している<\/strong>——この 作例は服の一部として曲がる布ではなく、<strong>胸元や背に 1 枚だけ載る硬い メダリオン<\/strong>として設計した。ドレスの前身頃の中央、あるいはケープの背に 1 枚。周囲の黒い生地に縫い付ける想定で、生地の縁 10mm を柔らかく 落としてある。<\/p>\n<p>ガラスに沈んだ羽根は、着る人が動くと<strong>光の入る角度が変わるたびに紋の 見え方が変わる<\/strong>——正面からは 2 本の輪しか見えず、斜めから光が入ると 扇が浮かび上がる。それがこの作りの狙い。<\/p>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_85.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_top.py -- &lt;この folder&gt;\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --azim 300 --elev 11 --name preview_low --final\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --azim 300 --elev 22 --name preview_back --final<\/pre>\n<p><strong>元になった Codex の絵（RGBA 1254 × 1254・1.4MB）は残していない。<\/strong> 作例 1 件 1MB の枠に入らないので、<code>make_art_85.py<\/code> は元の絵が無ければ <strong>この folder の <code>source.png<\/code> から作り直す<\/strong>。あちらは既に設計した 5 色 ちょうどなので、同じラベルに戻せる——実測で<strong>バイト単位まで同一の <code>source.png<\/code> が出る<\/strong>。つまり配っている物だけで再現でき、この道具は 死に道具にならない。<\/p>\n<p>元の絵から作り直したいときは<\/p>\n<pre>codex exec --skip-git-repo-check &quot;A peacock eye feather rosette, flat vector silhouette, five flat colour regions only, genuinely transparent background (alpha channel). Save the file, then reply with only the filename.&quot;<\/pre>\n<p>で描かせて <code>docs/samples/85_wip/raw.png<\/code> に置く。輪郭は Codex が決めるので 描き直すと羽枝の本数と曲がりは変わる——<strong>設計されているのは 5 つの帯の 輝度のほうで、羽根の形ではない。<\/strong>（<code>make_art_85.py<\/code> の <code>_SRC<\/code> は元の絵の 5 色なので、別の絵を描かせたらそこも採り直すこと。）<\/p>\n<p><code>settings.json<\/code> は作例 81（雲海）を土台に、上の表の値へ変えたもの。 folder は約 800KB。作った版は 7.191.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/85_preview.jpg"},{"c":"真上","d":"img/85_preview_top.jpg"},{"c":"低い角度から","d":"img/85_preview_low.jpg"},{"c":"逆光ぎみ（方位 300°・仰角 22°）","d":"img/85_preview_back.jpg"}]},{"num":"86","title":"六花 — 雪片が雪片を描く","mode":"BRISTLE","path":"docs/samples/86_六花_雪片が雪片を描く","text":"<p class=\"lead\">240 × 300mm のパネルに、六角柱を 27 × 34 の疎な格子で 918 本立てた。\n高さは 6.1〜10.8mm、色は高さでグラデーションした深い紺。そこへ\n<strong>［透明］の［出どころ］＝画像<\/strong>を掛け、**大きな雪片の形に入る柱だけを\nまるごと透明材にした。<strong>形も高さも柄も変えていない。<\/strong>変えたのは材だけ**で、\nそれでも 300mm の雪片がはっきり読める。<\/p><p>240 × 300mm のパネルに、六角柱を 27 × 34 の疎な格子で 918 本立てた。 高さは 6.1〜10.8mm、色は高さでグラデーションした深い紺。そこへ <strong>［透明］の［出どころ］＝画像<\/strong>を掛け、<strong>大きな雪片の形に入る柱だけを まるごと透明材にした。<\/strong>形も高さも柄も変えていない。<strong>変えたのは材だけ<\/strong>で、 それでも 300mm の雪片がはっきり読める。<\/p>\n<p>雪の結晶が六角なのは、氷の分子が六方晶で育つから。だからこの作例は <strong>同じ六角形を2つの尺度で重ねている<\/strong>——1本の柱（対角 4.0mm）と、 その柱の並びが描く雪片（対角 約 250mm）。構成する粒と、粒が描く形が、 同じ形をしている。<\/p>\n<h3>透明材が主役になれる唯一のやり方<\/h3>\n<p>［範囲］の4択（上だけ／下だけ／帯／外皮）はどれも「高さのどこを透明に するか」なので、<strong>平面のどこかを指すことができない<\/strong>。柱モードで ［出どころ］＝画像 にすると、マスクの黒い所に来た柱が<strong>高さの全体に わたって<\/strong>透明材になる。柱ごとに 0/1 で決まる（<code>StoreNamedAttribute<\/code> を <code>domain='INSTANCE'<\/code> で焼き、<code>RealizeInstances<\/code> の<strong>あと<\/strong>で材を割り当てる 仕組み）ので、1本の柱が途中から透明になることはない。<\/p>\n<p>だから絵の側では、<strong>雪片の輪郭は柱の格子に量子化される<\/strong>。それが嫌な 効果ではなく、むしろこの作例の見どころで、ドット絵の雪片が立体になった ように読める。マスクの雪片はパネル幅の 82% に収めてあり、面積で 22.3%。 実際に透明材になったのは <strong>918 本のうち 170 本（18.5%）<\/strong>——細い枝先が 格子の目を外すぶんだけ減る。<\/p>\n<p><strong>［クリアの濁り］0.45 と［クリアの色］（淡い氷青）は画面だけの設定で、 書き出しには乗らない。<\/strong>実機では GrabCAD Print 側でクリア材の色を指定する。 見本の絵の氷色は「刷るとこうなる」ではなく「こう見せたい」の絵。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><\/tr><tr><td>列数 / 行数<\/td><td>27 / 34（格子に固定 <code>pin_grid<\/code>）<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>240 / 300mm<\/td><\/tr><tr><td>断面<\/td><td>六角形（<code>element_shape<\/code> HEX）<\/td><\/tr><tr><td>半径<\/td><td>2.0mm（対角 4.0 / 対辺 3.46mm）<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td>11.0mm / 切<\/td><\/tr><tr><td>明度反転<\/td><td>入（明るいほど高い）<\/td><\/tr><tr><td>先細り / 上端の丸み<\/td><td>0.94 / 0<\/td><\/tr><tr><td>明暗による半径変化 / 間引き / 輪郭に合わせる<\/td><td>切 / 切 / 切<\/td><\/tr><tr><td>色<\/td><td>高さでグラデーション（物ぜんたい・深い紺 3 点）<\/td><\/tr><tr><td>側面<\/td><td>テクスチャ<\/td><\/tr><tr><td><strong>透明<\/strong><\/td><td>入・［出どころ］画像・<code>transparent_mask.png<\/code>・反転なし<\/td><\/tr><tr><td>クリアの濁り / 色<\/td><td>0.45 / (0.86, 0.93, 1.00) ※画面だけ<\/td><\/tr><tr><td>生地<\/td><td>織り・カスタム色 (0.012, 0.016, 0.030)<\/td><\/tr><\/table>\n<h3>元画像<\/h3>\n<ul><li><code>source.png<\/code> … RGBA 800 × 1000。<strong>高さだけ<\/strong>を持つグレーの濃淡で、 2 種類のガウシアンぼかしを重ねた「吹きだまり」。柱モードは絵をリニアで 読むので、リニア値 0.55〜1.00 を sRGB へ符号化して描いてある。<\/li><li><code>transparent_mask.png<\/code> … 800 × 1000 のグレースケール。<strong>黒が雪片<\/strong>。 白い紙に黒い雪片を落とした形で、この黒い所の柱が透明材になる。<\/li><\/ul>\n<p>どちらも <code>tools/make_art_86.py<\/code> が作る。雪片の原図は Codex の画像生成で 起こした六方対称のシルエットで、道具は<strong>配ってあるマスクから引き直せる<\/strong> ように書いてあるので、このフォルダだけで再現できる。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>244.00 × 303.46 × 10.80mm<\/td><\/tr><tr><td>柱の本数<\/td><td>918（27 × 34、格子どおり）<\/td><\/tr><tr><td><strong>うち透明材<\/strong><\/td><td><strong>170 本 / 面数で 18.5%<\/strong><\/td><\/tr><tr><td>間隔 X / Y<\/td><td>9.231 / 9.091mm<\/td><\/tr><tr><td>すき間<\/td><td>5.091mm（条文 0.6mm）<\/td><\/tr><tr><td>要素の XY<\/td><td>4.00mm（条文の上限 15mm）<\/td><\/tr><tr><td>高さ 最小 / 中央 / 最大<\/td><td>6.072 / 8.450 / 10.805mm<\/td><\/tr><tr><td>縦横比（対辺基準）<\/td><td>1.75 / 2.44 / 3.12<\/td><\/tr><tr><td>底の高さ<\/td><td>0<\/td><\/tr><tr><td>オーバーハング<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><\/tr><tr><td>体積 / 概算重量<\/td><td>76.2cm³ / 約 90g<\/td><\/tr><tr><td>頂点数 / 生成時間<\/td><td>93,636（1 個あたり）/ 3.5 秒<\/td><\/tr><\/table>\n<p>道具が出した行は 2 本。「実際の造形範囲 244.0 × 303.5 × 10.80mm」は 指定 240 × 300 に柱の対角 1 本ぶん（4.0mm）を足した値で正しい。 「最小高さの下限は 0.4mm …明るさが 4% に届かない所に柱は立ちません」は、 元絵の最小が 0.55（リニア）なので 1 本も消えていない。<\/p>\n<p><strong>最大高さ 11.0mm に対し実測 10.805mm<\/strong> なのは、元絵のいちばん明るい画素 （80 万画素）が 918 本の標本点に当たらないため。同じ理由で最小も 6.05 → 6.072 とわずかに内側。<\/p>\n<h3>見本の絵<\/h3>\n<p>透明は光の当て方で見え方が変わるので、4 枚撮った。<\/p>\n<table><tr><th>ファイル<\/th><th>何を見るか<\/th><\/tr><tr><td><code>preview.jpg<\/code><\/td><td>アドオン既定の斜め。全体の姿<\/td><\/tr><tr><td><code>preview_top.jpg<\/code><\/td><td>真上。<strong>雪片の形はここがいちばん読める<\/strong><\/td><\/tr><tr><td><code>preview_low.jpg<\/code><\/td><td>低い角度（方位 300°・仰角 14°）。柱の林として<\/td><\/tr><tr><td><code>preview_back.jpg<\/code><\/td><td>逆光ぎみ（太陽を反対側・仰角 7°）。<strong>透明の柱だけが光る<\/strong><\/td><\/tr><\/table>\n<h3>自分の評価<\/h3>\n<ul><li><strong>狙いは成立した。<\/strong>真上の絵で、六本の腕と枝が量子化されたまま はっきり読める。高さでは絶対に作れない見せ方で、透明材を主題に据えた 最初の作例になった。<\/li><li><strong>逆光がいちばん強い。<\/strong>色付きの柱が沈んで、透明の柱だけが白く光る。 この 1 枚だけで「材が違う」ことが説明抜きに伝わるので、次に透明を やるときも逆光は必ず撮る。<\/li><li><strong>斜めの絵は弱い。<\/strong>柱が低い所（谷）では隣の柱に隠れて、雪片の輪郭が 途切れて見える。<strong>高さの起伏と雪片の形が無関係<\/strong>なのが原因で、 意図してそうしてある（材だけで描くのが主題）が、絵としては 「雪片の所だけ少し高くする」ほうが強いはずで、それは次の課題。<\/li><li><strong>格子の量子化が効きすぎている所がある。<\/strong>腕の先の細い枝は 1 本の柱に なってしまい、六方対称が崩れて見える角度がある。列数を 27 → 35 くらい へ上げれば枝は残るが、柱が細くなって「結晶の柱」感が落ちる。この作例は 太い柱を優先した。<\/li><li><strong>低くて全面を埋める形からは離れられた。<\/strong>対辺 3.46mm・高さ最大 10.8mm の六角柱が、5mm 空けて疎に立つ。縦横比は最大 3.12 で棘ではない。<\/li><li>重い部類（約 90g / 30 × 24cm）。身頃 1 枚には使えず、<strong>胸当てや ヨーク、ケープの肩<\/strong>のような小面積の見せ場向き。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>ケープの背中心か、ドレスの胸当て 1 枚として使う想定。雪片が中央に 1 つだけ来る構図なので、パネルの外周 15mm は柱を立てず縫い代に取る （この作例では取っていない——外周まで柱が立っている）。透明材は 裏から光を通すので、<strong>裏地を付けない<\/strong>か、白い裏地で拡散させる。 洗濯は不可。<\/p>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_86.py\nblender --background --factory-startup --python docs/samples/tools/make_sample.py -- &lt;この folder&gt; --final\nblender --background --factory-startup --python docs/samples/tools/render_top.py -- &lt;この folder&gt;\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --azim 300 --elev 14 --name preview_low\nblender --background --factory-startup --python docs/samples/tools/render_view.py -- &lt;この folder&gt; --azim 300 --elev 11 --name preview_back --sun-azim-offset 180 --sun-elev 7 --sun-energy 5 --world 0.16<\/pre>\n<p><code>settings.json<\/code> は作例 71 を土台にして上の表の値へ変えたもの。 <code>height_ramp<\/code> の 3 点は <code>make_sample<\/code> が復元する。folder は約 723KB。<\/p>\n<p>作った版は 7.191.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/86_preview.jpg"},{"c":"真上","d":"img/86_preview_top.jpg"},{"c":"低い角度から","d":"img/86_preview_low.jpg"},{"c":"逆光ぎみ（方位 300°・仰角 22°）","d":"img/86_preview_back.jpg"}]},{"num":"87","title":"夜蛾 — 管ビーズで盛る","mode":"BRISTLE","path":"docs/samples/87_夜蛾_管ビーズで盛る","text":"<p class=\"lead\">蛾の輪郭から等距離の帯を引き、<strong>穴の開いた管（リング断面）を立てて<\/strong>\nその帯をなぞった。管の長さは 3.5 / 5.5 / 7.5 / 9.5mm の 4 種で、外へ行く\nほど短く、内へ行くほど長い。色は高さに連れて 黒 → 赤銅 → 古銅 → 金 へ\n上がるので、<strong>輪郭は沈んだ銅、翅の中心は盛り上がった金<\/strong>になる。\n933 本、240 × 240mm のパネル。<\/p><p>蛾の輪郭から等距離の帯を引き、<strong>穴の開いた管（リング断面）を立てて<\/strong> その帯をなぞった。管の長さは 3.5 / 5.5 / 7.5 / 9.5mm の 4 種で、外へ行く ほど短く、内へ行くほど長い。色は高さに連れて 黒 → 赤銅 → 古銅 → 金 へ 上がるので、<strong>輪郭は沈んだ銅、翅の中心は盛り上がった金<\/strong>になる。 933 本、240 × 240mm のパネル。<\/p>\n<p>本部の依頼「もっとモチーフ形状自体に特徴があり、高さも出したような作品」 への答え。<strong>柄で形を作るのをやめて、要素そのものの形に語らせた作例<\/strong>で、 断面はこのアドオンでいちばん使われていない ［リング］ を選んだ （44 番以降の柱モード 48 件を数えたら CYLINDER 16・DOME 13・CUBE 7・ HEX 5 …で、RING は 1 件だけだった）。<\/p>\n<h3>仕組み<\/h3>\n<ul><li>元絵は蛾のシルエットから <strong>距離変換<\/strong>（縁からの mm）を作り、 それを柱の間隔 3.636mm の 2.2 倍を周期、1.2 倍を幅とする帯へ切った。 <strong>帯の寸法を画素ではなく柱の間隔で決める<\/strong>のが要で、幅が間隔より 狭いと格子の行が帯をまたいで列が途切れる。1.2 本ぶんあれば必ず 1 行 乗る。<\/li><li>帯の番号がそのまま管の長さ（4 段）になる。柱モードは絵をリニアで 読むので、元絵の画素は <code>255 × (長さ ÷ 9.5)^(1/2.2)<\/code> で符号化してある。 8bit を往復するので実測は 3.432 / 5.426 / 7.444 / 9.500mm と少しずれる。<\/li><li>断面はリング。半径 1.4mm・穴 42%・頂点 16 なので、外径 2.80mm・ 穴径 1.176mm・<strong>肉厚 0.812mm<\/strong>。上端の丸み 0.2 は、リングでは 「立体の頭」ではなく<strong>断面の角<\/strong>を丸める（v7.67.0）ので、管の口が わずかに面取りされる。<\/li><li>色は［高さでグラデーション］を<strong>物ぜんたい<\/strong>に掛けた（柱ごとでは ない）。だから 3.5mm の管の頭はランプの 0.37 の位置＝赤銅、9.5mm の 管の頭は 1.00 ＝金になる。<strong>長さと色が同じ 1 本の軸に乗る<\/strong>ので、 真上から見ても等高線が読める。<\/li><li>透明材は使っていない。直前の 7 件のうち 5 件が透明を使っていたので、 ここは意図的に外した。<\/li><\/ul>\n<h3>何を使ったか<\/h3>\n<table><tr><th>設定<\/th><th>値<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><\/tr><tr><td>列数 / 行数<\/td><td>67 / 67（格子に固定）<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>240 / 240mm<\/td><\/tr><tr><td>断面 / 頂点数<\/td><td><strong>リング<\/strong> / 16<\/td><\/tr><tr><td>半径 / 穴の比率<\/td><td>1.4mm / 0.42<\/td><\/tr><tr><td>上端の丸み<\/td><td>0.2（断面の角）<\/td><\/tr><tr><td>先細り<\/td><td>1.0（真っすぐ）<\/td><\/tr><tr><td>要素の向き<\/td><td>固定<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td>9.5mm / 切<\/td><\/tr><tr><td>明度反転<\/td><td>入<\/td><\/tr><tr><td>最小高さカットオフ<\/td><td>0<\/td><\/tr><tr><td>明暗による半径変化 / 間引き<\/td><td>切 / 切<\/td><\/tr><tr><td>色<\/td><td>高さでグラデーション（物ぜんたい・4 点）<\/td><\/tr><tr><td>側面<\/td><td>テクスチャ<\/td><\/tr><tr><td>生地<\/td><td>織り・カスタム色 (0.016, 0.014, 0.013)<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><\/tr><\/table>\n<h3>元画像<\/h3>\n<p><code>source.png<\/code> は RGBA 1000 × 1000（25KB）。アルファが「管が立つ場所」、 明るさが「管の長さ」。<code>silhouette.png<\/code>（6KB・1bit）が蛾の原形で、 <strong>この 2 枚だけでこのフォルダは自足する<\/strong>——<code>tools/make_art_87.py<\/code> は 原図が無ければ <code>silhouette.png<\/code> から距離変換をやり直し、<code>source.png<\/code> を バイト単位で同じものに作り直す（実測で確認）。<\/p>\n<p>原形の蛾は Codex CLI に描かせた白黒のシルエット。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>実測<\/th><\/tr><tr><td>実際の造形範囲<\/td><td>213.71 × 159.16 × 9.5000mm<\/td><\/tr><tr><td>管の本数<\/td><td>933（89,568 頂点 ÷ 1 本 96 頂点）<\/td><\/tr><tr><td>中心間隔<\/td><td>3.636mm<\/td><\/tr><tr><td>外径 / すき間<\/td><td>2.800 / <strong>0.836mm<\/strong><\/td><\/tr><tr><td>肉厚 / 穴径<\/td><td><strong>0.812<\/strong> / 1.176mm<\/td><\/tr><tr><td>管の長さ 4 段<\/td><td>3.432 / 5.426 / 7.444 / 9.500mm<\/td><\/tr><tr><td>段ごとの割合<\/td><td>41.1 / 25.8 / 21.2 / 11.9%<\/td><\/tr><tr><td>縦横比（いちばん長い管）<\/td><td><strong>3.39 : 1<\/strong><\/td><\/tr><tr><td>底の高さ<\/td><td>0.0000<\/td><\/tr><tr><td>オーバーハング<\/td><td><strong>0 面 / 0.00mm²<\/strong><\/td><\/tr><tr><td>体積<\/td><td>24.7cm³（約 29g の概算）<\/td><\/tr><tr><td>頂点数 / 面数<\/td><td
