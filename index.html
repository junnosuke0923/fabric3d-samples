1 枚の反物で作る。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><td>穴の縁が「立った輪郭」に見えるのは柱だけ。面では縁が壁になる<\/td><\/tr><tr><td>断面<\/td><td>円柱（12 角）・半径 0.5mm<\/td><td>かがり糸の 1 本 1 本に見える太さ<\/td><\/tr><tr><td>配置<\/td><td>レンガ・間隔 0.7mm<\/td><td>中心間隔 1.7mm。最小 3mm の穴でも縁が 1 周つながる<\/td><\/tr><tr><td>最大高さ<\/td><td>2.8mm<\/td><td>縁の高さ。縦横比 2.8 で、棘には寄らない<\/td><\/tr><tr><td>明暗による高さ変化 ON・［明度反転］ON<\/td><td><\/td><td>白い縁 → 高い、灰の地 → 低い<\/td><\/tr><tr><td>輪郭に合わせる（最小比率 0.6）<\/td><td>ON<\/td><td>穴の輪郭の柱を内側へ寄せて縮め、円い穴の縁を格子の階段にしない<\/td><\/tr><tr><td>色<\/td><td><strong>高さでグラデーション<\/strong>（生成り → 白）<\/td><td>画像の色で塗ると、低い起毛が地の灰色をそのまま着る。高さで塗れば、色は明るさから離れる<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.42, 0.16, 0.11)<\/td><td>刷る先そのもの。テラコッタの綿に白いアイレット<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_48.py<\/code>）<\/h3>\n<p><code>source.png<\/code> 1 枚。<strong>アルファが穴<\/strong>、明るさが毛足の高さ。<\/p>\n<ul><li>花 27 輪を 52×46mm でずらして並べ、花 1 輪は中心の円（半径 4.2mm）と 6 枚の花びら（楕円 9.5×4.6mm）、次の花へ向かう蔓の小円 4 つ。 合わせて穴 224 個（最大 10.8mm・最小 3.0mm）。穴は面積の 12.6%。<\/li><li>穴からの距離場（EDT）で縁の帯を作る。2.2mm の帯を白（毛足 100%）、 そこから 0.8mm でなだらかに地の明るさ（リニア 0.25）へ落とす。 帯は面積の 37.9%。<\/li><li>色はわずかに生成り寄り（青を 1.5% 落とす）。<\/li><\/ul>\n<h3>数字<\/h3>\n<table><tr><th><\/th><th><\/th><\/tr><tr><td>柱<\/td><td>118 × 153<\/td><\/tr><tr><td>実際の造形範囲<\/td><td>199.5 × 258.8 × 2.79mm（指定 200 × 260）<\/td><\/tr><tr><td>縁の高さ ／ 地の起毛<\/td><td>2.8mm ／ 0.7mm（2.8 × 0.25）<\/td><\/tr><tr><td>造形の床 0.4mm<\/td><td>最大高さ 2.8 では明るさ 14% 未満が消える。地は 25% なので残る<\/td><\/tr><tr><td>縦横比（高さ ÷ 直径）<\/td><td>2.8<\/td><\/tr><tr><td>頂点（評価後）<\/td><td>365,544<\/td><\/tr><tr><td>オーバーハング<\/td><td>0 面 ／ 最低 Z 0.0000<\/td><\/tr><tr><td>フォルダ<\/td><td>0.93MB<\/td><\/tr><\/table>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上（<code>preview_top.jpg<\/code>）がいちばん強い。<\/strong> 白い縁の輪の中に テラコッタの花びらが 27 輪。本物のアイレットの生地を上から撮った写真と 同じ読み方ができる。<\/li><li><strong>斜め（<code>preview.jpg<\/code>）は花が「白い輪」として立ち、穴の赤が輪の中に 見える。<\/strong> 地の起毛が生成りに沈むので、輪だけが浮く。1 回目 （起毛 1.4mm・全部灰）では輪と地の差が高さだけで、穴がほとんど 読めなかった——起毛を半分に落として地の色を入れたのが効いた。<\/li><li><strong>拡大（<code>preview_macro.jpg<\/code>）<\/strong>では縁の柱が 1〜2 列で穴を囲み、穴の底に 織りの生地が見える。花びらの角は格子の階段が少し残る（1.7mm 格子で 4.6mm 幅の楕円なので、輪郭に合わせても 3 列ぶんしかない）。<\/li><li><strong>弱い所:<\/strong> 縁の帯 2.2mm は「かがり糸」としては太い。本物は 1mm 前後。 ただし 1.7mm 格子では 1 列＝穴の周りが途切れる。格子を 1.2mm （半径 0.4・間隔 0.4）に詰めれば帯 1.5mm で 1 列を保てるはず（未検証）。<\/li><\/ul>\n<h3>服として<\/h3>\n<ul><li><strong>色のスリップを重ねる必要が無い。<\/strong> 生地の色が柄になるので、反物 1 枚で 「白いアイレット＋色の裏地」の見え方が出る。生地の色を変えるだけで 別の服になる（同じ設定・同じ画像）。<\/li><li><strong>穴は本当には抜けていない。<\/strong> 透けも風通しも無い。代わりに、縁が 2.8mm 立つので<strong>穴の縁を指でなぞれる<\/strong>。アイレットの手触りだけを取り 出した反物。<\/li><li>使う所は襟・カフス・裾の見返しなど、縁が体の輪郭に沿う所。全面に 使うと縁の帯（面積 38%）が硬い。<\/li><\/ul>\n<h3>作り方<\/h3>\n<pre>python docs/samples/tools/make_art_48.py\nBF_ADDON_PATH=&lt;アドオン&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/48_穴の設計_アイレットは抜いた所が柄\nBF_ADDON_PATH=&lt;アドオン&gt; blender --background --factory-startup --python docs/samples/tools/render_top.py -- docs/samples/48_穴の設計_アイレットは抜いた所が柄\nBF_ADDON_PATH=&lt;アドオン&gt; blender --background --factory-startup --python docs/samples/tools/render_macro.py -- docs/samples/48_穴の設計_アイレットは抜いた所が柄 --at 0.5,0.5 --span 40 --elev 38<\/pre>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/48_preview.jpg"},{"c":"真上","d":"img/48_preview_top.jpg"},{"c":"拡大","d":"img/48_preview_macro.jpg"}]},{"num":"49","title":"影が柄になる — 昼は縞、夕方は文字","mode":"SURFACE","path":"docs/samples/49_影が柄になる_昼は縞_夕方は文字","text":"<p class=\"lead\">**同じ厚み・同じ間隔の薄い壁を横に並べただけの反物。真上からの光では\nただの縞だが、壁の高さに文字を仕込んであるので、低い光が壁の間の床に\n長い影を落とすと、影が「DUSK」を綴る。** 立体そのものではなく、床に\n落ちる影を設計する（リサーチの引き出し #6 の 1 件目）。<\/p><p><strong>同じ厚み・同じ間隔の薄い壁を横に並べただけの反物。真上からの光では ただの縞だが、壁の高さに文字を仕込んであるので、低い光が壁の間の床に 長い影を落とすと、影が「DUSK」を綴る。<\/strong> 立体そのものではなく、床に 落ちる影を設計する（リサーチの引き出し #6 の 1 件目）。<\/p>\n<p>服の上では、光の高さが時刻で変わる。昼の外光では縞のドレス、夕方の 横からの光、あるいはショーの袖からのライトで、文字が浮く。 <strong>着ている人ではなく、照明が模様を変える<\/strong>——ランウェイの照明設計を 生地の側から使う。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>壁は 14×1.25mm の細長い面。柱では作れない<\/td><\/tr><tr><td>高さの決め方<\/td><td><strong>高さマップ（別画像から）<\/strong><\/td><td>色は壁も床も砂色のまま。高さだけに文字を入れる<\/td><\/tr><tr><td>フラットの厚み<\/td><td>0.6mm<\/td><td>文字の外側の壁。造形の下限 0.4 に少し余裕<\/td><\/tr><tr><td>高さマップの強さ<\/td><td>3.2mm<\/td><td>文字の内側 0.6+3.2 = 3.8mm<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>1.25mm の壁を 0.55mm の格子で階段にしない<\/td><\/tr><tr><td>角の丸み<\/td><td>OFF<\/td><td>影の縁を鈍らせない<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>壁は元画像の側で 14mm ごとに切ってある<\/td><\/tr><tr><td>色<\/td><td>テクスチャ（上面・側面とも）<\/td><td>壁は砂色 (0.90, 0.87, 0.80) の一色<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.72, 0.64, 0.50)<\/td><td>床。壁より少し暗い砂色。影が落ちる相手<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_49.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（色＋アルファ）と <code>depth_map.png<\/code>（高さ＝文字）の 2 枚。<\/p>\n<ul><li>壁: 厚み 1.25mm、中心間隔 5.0mm、床のすき間 3.75mm。横向きで 27 本。<\/li><li>切れ目: 14mm ごとに 1.0mm 切る（15mm の上限。すき間 0.6 の上）。 行ごとに半周期ずらして、切れ目が縦に並ばないようにする。<\/li><li>文字: Times New Roman Bold「DUSK」256 × 63mm を紙面の中央。壁 12 本ぶんの高さ。文字の内側は高さマップ 1、外側 0。<\/li><\/ul>\n<p><strong>影の長さは計算で決めた。<\/strong> 太陽の仰角 25° のとき、3.8mm の壁は 8.1mm の影、0.6mm の壁は 1.3mm の影。床のすき間は 3.75mm なので、文字の 内側では床が全部影に沈み、外側では床の 2/3 が光る。この差が文字になる。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>280×140 → <strong>276.7 × 131.8 × 3.80mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>壁の区間<\/td><td>513 個（最長 14.0・最短 5.5mm、厚み 1.25mm）<\/td><td>—<\/td><\/tr><tr><td>いちばん大きい要素<\/td><td><strong>14 × 1mm<\/strong>（道具の報告 / v7.191.0）<\/td><td>≤15 ✓<\/td><\/tr><tr><td>壁のすき間<\/td><td>床 3.75mm、切れ目 1.0mm<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>高さ<\/td><td>0.6（文字の外）〜 3.80mm（文字の内）<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong>、最低 Z 0.0000<\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><tr><td>壁が占める面積<\/td><td>22.2%（うち文字の内側 17.3%）<\/td><td>—<\/td><\/tr><tr><td>頂点<\/td><td>88,372（プレビュー 512）<\/td><td>—<\/td><\/tr><\/table>\n<p><strong>（v7.191.0 で報告の数字が変わった。）<\/strong>「いちばん大きい要素」の並べ替えが 「長いほうの辺」だけを鍵にしていたので、<strong>辺の長さが同点の破片が並ぶと、 答えが「その破片が絵のどこにあるか」で決まっていた<\/strong>。第2の鍵に面積が 足された結果、同じ形の中でいちばん中身の詰まった破片が選ばれるようになった。 <strong>造形の可否は動かない<\/strong>——上限 15mm は長いほうの辺で見ており、そこは同点。 上の表の数字は v7.191.0 で測り直したもの。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>夕方（<code>preview_raking.jpg<\/code>、太陽 25°）は読める。<\/strong> 文字の内側の 床が全部影になり、DUSK が黒い字で出る。壁の天面は影の中でも明るい ままなので、字はスリット越しに見える。<\/li><li><strong>真昼（<code>preview_noon.jpg<\/code>、太陽 80°）でも、輪郭は消えない。<\/strong> 文字の縁で壁の天面が 0.6 → 3.8mm へ跳ねる段差があり、その斜面が 真上から細い線として見える。「昼は何も無い」ではなく「昼は縁取りだけ、 夕方は塗り潰し」——狙いより弱いが、これはこれで段階がある。 段差を無くすには高さを 2 段ではなく縁でなだらかに落とせばよいが、 すると影の縁もぼける。二者択一で、影の側を取った。<\/li><li><strong>道具の標準の真上（<code>preview_top.jpg<\/code>、太陽 62° と 45°）でも読める。<\/strong> 45° の太陽で 3.8mm の壁は 3.8mm の影を落とし、床のすき間 3.75mm を ちょうど埋める。「真上から見れば縞」が成り立つのは太陽が 60° より 高いときだけ。実物なら、屋内の天井照明でも読めてしまう可能性が高い。<\/li><li><strong>寄り（<code>preview_macro.jpg<\/code>）は、文字の縁で壁が台形に立ち上がる。<\/strong> 斜面は格子 1 マス（0.55mm）ぶん。最終解像度なら半分になる。<\/li><li><strong>弱いところ。<\/strong> 壁の高さが 2 値なので、影も 2 値で、文字の縁が壁 5mm ごとの階段になる。字が大きい（63mm）から読めているだけで、20mm の字は 4 本の壁で綴ることになり読めない。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>コートの背中や、スカートの一枚幅に。昼の外では光沢の無い縞で、 夕方や照明の下で言葉が浮く。文字でなくても、影で出る絵なら何でも 同じ仕掛けが使える（壁の向きを変えれば、影の向きも設計できる）。 壁は 14mm ごとに切れているので、布は切れ目の 1mm で曲がる （作例45 と同じ理屈）。壁と直交する向きには 3.75mm ごとに曲がる。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_49.py     # source.png と depth_map.png BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/49_影が柄になる_昼は縞_夕方は文字 ... --python docs/samples/tools/render_top.py -- docs/samples/49_影が柄になる_昼は縞_夕方は文字 ... --python docs/samples/tools/render_raking.py -- docs/samples/49_影が柄になる_昼は縞_夕方は文字 --elev 25 --name preview_raking ... --python docs/samples/tools/render_raking.py -- docs/samples/49_影が柄になる_昼は縞_夕方は文字 --elev 80 --name preview_noon ... --python docs/samples/tools/render_macro.py -- docs/samples/49_影が柄になる_昼は縞_夕方は文字 --at 0.5,0.5 --span 45 --elev 25<\/p>\n<p><code>render_raking.py<\/code> はこの作例のために作った（真上カメラ・太陽 1 灯・ 仰角と方位を指定）。作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/49_preview.jpg"},{"c":"真上","d":"img/49_preview_top.jpg"},{"c":"真上・夕方（太陽 25°）","d":"img/49_preview_raking.jpg"},{"c":"真上・真昼（太陽 80°）","d":"img/49_preview_noon.jpg"},{"c":"拡大","d":"img/49_preview_macro.jpg"}]},{"num":"50","title":"勾配の反物 — 襟で甲、裾で布","mode":"BRISTLE","path":"docs/samples/50_勾配の反物_襟で甲_裾で布","text":"<p class=\"lead\">**六角の板が隙間 1mm で敷き詰まった「甲」が、反物の一方の端にある。\nもう一方の端へ向かって板は低く・小さく・まばらになり、最後は生地だけに\nなる。** どこで裁っても、その一着は「硬い側と柔らかい側」を持つ\n（リサーチの引き出し #1 の 1 件目）。<\/p><p><strong>六角の板が隙間 1mm で敷き詰まった「甲」が、反物の一方の端にある。 もう一方の端へ向かって板は低く・小さく・まばらになり、最後は生地だけに なる。<\/strong> どこで裁っても、その一着は「硬い側と柔らかい側」を持つ （リサーチの引き出し #1 の 1 件目）。<\/p>\n<p>柄ではなく<strong>反物の性質の勾配<\/strong>。板の密度がそのまま布の曲がりやすさを 決めるので、襟や肩では立ち、裾では落ちる——服の形を、縫製ではなく生地の 側で決める試み。作例42「乾いた大地」も肩から裾へ変わる構図だが、 あちらは材と粒の大きさが変わる（別の生きものの皮膚になる）。ここでは <strong>板は端から端まで同じ黒鉛色<\/strong>で、変わるのは形と密度だけ。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><td>板 1 枚ずつの高さ・太さ・有無を別々に動かせる<\/td><\/tr><tr><td>断面<\/td><td>六角<\/td><td>隙間を一定にしたまま敷き詰まる。丸だと隙間が場所で変わる<\/td><\/tr><tr><td>半径 / すき間<\/td><td>4.0mm / 0.8mm（実際の中心間隔 8.95mm）<\/td><td>板の直径 8mm。15mm の上限の内<\/td><\/tr><tr><td>配置<\/td><td>レンガ<\/td><td>行ごとに半ピッチずらす。六角の敷き詰めはこれでしか組めない<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td>2.4mm / ON<\/td><td>甲は平たい。縦横比 0.30<\/td><\/tr><tr><td><strong>領域マスク<\/strong><\/td><td>画像（<code>region_mask.png<\/code>）、高さ比 0.17・太さ比 0.20・間引き 1.0<\/td><td>勾配を<strong>明暗ではなく 2 枚目の画像<\/strong>で渡す。明暗で動かすと板の色まで変わる<\/td><\/tr><tr><td>明暗による半径変化 / 間引き<\/td><td>どちらも OFF<\/td><td>元絵は一色。勾配は領域マスクだけが持つ<\/td><\/tr><tr><td>色<\/td><td>画像（上面・側面とも）<\/td><td>黒鉛 (0.13, 0.13, 0.15)。板ごとに ±3% だけ揺らす<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.80, 0.74, 0.62)<\/td><td>生成り。<strong>明るい布に暗い板<\/strong>——いつもの逆<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_50.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（黒鉛の一色＋アルファ 1）と <code>region_mask.png<\/code>（白＝甲、 黒＝生地だけ）の 2 枚。<\/p>\n<ul><li>端から 30% までは白。そこから 85% まで smoothstep で黒へ落ち、残りは黒。<\/li><li>境目は直線にしない。周期 90mm・振幅 ±22mm のうねり（正弦 2 つ）で 前後させ、甲の裾が波打つようにする。<\/li><li>板 1 枚ぶんの細かい雑音 ±0.06 を境目にだけ掛ける。同じ行の板が一斉に 消えると段になる。<\/li><\/ul>\n<p>マスクの平均（端から 10% 刻み）: 1.00 1.00 1.00 0.96 0.80 0.55 0.29 0.09 0.01 0.00。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>220×340 → <strong>228.0 × 281.6 × 2.40mm<\/strong><\/td><td>460×360 の内 ✓。奥行きが 58mm 短いのは、裾の 15% に板が 1 枚も無いから<\/td><\/tr><tr><td>板<\/td><td>直径 8.0mm（六角の外接円）、甲での実際のすき間 0.95mm<\/td><td>≤15 ✓ / ≥0.6 ✓<\/td><\/tr><tr><td>いちばん小さい板<\/td><td>直径 1.6mm・高さ 0.41mm（太さ比 0.20・高さ比 0.17）<\/td><td>≥0.6 ✓ / ≥0.4 ✓（床すれすれ）<\/td><\/tr><tr><td>縦横比<\/td><td>甲 2.4 ÷ 8.0 = <strong>0.30<\/strong>、いちばん小さい板 0.26<\/td><td>棘ではない<\/td><\/tr><tr><td>板の密度（甲を 100 として、生地の側から 34mm 刻み）<\/td><td>2 → 5 → 31 → 55 → 76 → 100%<\/td><td>—<\/td><\/tr><tr><td>高さの平均（同じ帯）<\/td><td>0.42 → 0.55 → 0.98 → 1.62 → 2.19 → 2.39mm<\/td><td>—<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong>、最低 Z 0.0000<\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><tr><td>頂点<\/td><td>5,676（板は 1 枚 12 頂点）<\/td><td>軽い<\/td><\/tr><\/table>\n<p>密度と高さは <code>bf_pillar_height<\/code> と頂点の Y を帯ごとに数えた（probe）。 <strong>高さ・太さ・有無の 3 つが同じ場所で同時に落ちている<\/strong>ことが、この表で 読める。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上（<code>preview_top.jpg<\/code>）は狙いどおり。<\/strong> 上 1/3 は隙間の揃った 六角の甲、真ん中の帯でうねりながら崩れ、下 1/3 は生地に点が散る。 境目の雑音が効いて、行ごとの段にはなっていない。<\/li><li><strong>寄り（<code>preview_macro.jpg<\/code>、境目の帯）がこの作例の見せ場。<\/strong> 同じ 黒鉛色の板が、隣どうしで少しずつ低く・小さくなる。色が変わらないから 「別の物になった」ではなく「同じ物が薄れていく」と読める。生地の 織り目がすき間から見える。<\/li><li><strong>弱いところ。<\/strong> 崩れの帯が網点（ハーフトーン）に見える瞬間がある—— 同じ格子の上で大きさだけが変わる構図は、印刷の網点と同じ構造だから。 板の中心を格子から少しずらす手段がこのアドオンに無いので、ここは 避けられない。うねりと雑音で「模様」に寄せてある。<\/li><li><strong>いちばん小さい板は 0.41mm で、造形の床 0.4mm すれすれ。<\/strong> 実機では この帯の板がいくつか消える可能性がある。消えても生地の側なので 設計は壊れないが、［高さ比］を 0.25 にすれば余裕が出る（そのぶん 裾の板が高くなる）。<\/li><li><strong>奥行きが指定より 58mm 短い<\/strong>（281.6mm）。裾の 15% は生地だけなので 生成物としては正しいが、布の上でどこまでが「反物」かは元絵の 340mm のほう。裁つときはこちらで考える。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>反物の向きを決めれば、襟ぐりで甲・裾で布のワンピース、肩で甲・袖口で布の ジャケット。曲がりやすさが板の密度で決まるので、甲の側は自立し、布の 側は落ちる——<strong>ドレープの量を生地に仕込む。<\/strong> 板の直径 8mm・すき間 1mm の甲は、板の間で 1mm ごとに曲がるので、曲面の襟にも沿う（作例45 と 同じ理屈）。うねりの境目を裁ち線に合わせれば、甲の裾が波打つ縁になる。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_50.py     # source.png と region_mask.png BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/50_勾配の反物_襟で甲_裾で布 ... --python docs/samples/tools/render_top.py -- docs/samples/50_勾配の反物_襟で甲_裾で布 ... --python docs/samples/tools/render_macro.py -- docs/samples/50_勾配の反物_襟で甲_裾で布 --at 0.5,0.55 --span 60 --elev 30<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/50_preview.jpg"},{"c":"真上","d":"img/50_preview_top.jpg"},{"c":"拡大","d":"img/50_preview_macro.jpg"}]},{"num":"51","title":"剥落 — モザイクの断片","mode":"SURFACE","path":"docs/samples/51_剥落_モザイクの断片","text":"<p class=\"lead\">**ポンペイの赤い床モザイクが、目地で割れた石片になり、ところどころ剥がれ\n落ちて下の布が覗いている。残った石片には絵の続きが載っていて、無い所は\n見る人が補う。** 「完成していない柄」を着る（リサーチの引き出し #12 の\n1 件目）。<\/p><p><strong>ポンペイの赤い床モザイクが、目地で割れた石片になり、ところどころ剥がれ 落ちて下の布が覗いている。残った石片には絵の続きが載っていて、無い所は 見る人が補う。<\/strong> 「完成していない柄」を着る（リサーチの引き出し #12 の 1 件目）。<\/p>\n<p>割れ目は道具の［面を分割する］ではなく、<strong>元絵の側でボロノイのひびとして 引き<\/strong>、同じ区画の単位で「丸ごと無い」「途中で欠けた」「残った」を決めて ある。実物の剥落はひびに沿って欠けるので、割れと剥落を別々の仕組みで 作ると機械が切った跡に見える。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>石片 1 つずつが「ブロック」。断片の縁が輪郭吸着で滑らかになる<\/td><\/tr><tr><td>高さの決め方 / 最大高さ<\/td><td>高さマップ / 1.0mm<\/td><td>板の厚み。ここに高さマップを足す<\/td><\/tr><tr><td>高さマップ（<code>depth_map.png<\/code>） / 強さ<\/td><td>1.0mm<\/td><td>コテ跡の低い雑音（0〜0.35）と装飾（帯・輪・花弁）の盛り上がり（0.65）。<strong>絵が浮き出るのではなく、漆喰の装飾だけが盛る<\/strong><\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>ひびの縁の階段を消す。断片の縁は元絵の 3px/mm より細かくなる<\/td><\/tr><tr><td>角の丸み<\/td><td><strong>切<\/strong>（0.3mm・2 段・上の縁と記録）<\/td><td><strong>石片の角は落ちていない。<\/strong>値は残っているがスイッチが切で、面取りは走っていない（2026-09-06 に訂正）<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>割れは元絵で済んでいる。道具に切らせると剥落の形と無関係な線が入る<\/td><\/tr><tr><td>色<\/td><td>画像（上面・側面とも）<\/td><td>赤（0.55,0.14,0.10）・黄土・黒・生成り。側面も絵から取るので、断片の縁に色の層が出る<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.20, 0.19, 0.18)<\/td><td>暗いスレート。剥落した所が「下地」に見えるよう、赤より暗く<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>ひびの縁のアンチエイリアスを真ん中で切る<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_51.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA、240×180mm・3px/mm）と <code>depth_map.png<\/code>（白黒）の 2 枚。<\/p>\n<ul><li><strong>区画<\/strong>: 9mm の六角格子に 30% の揺らぎを入れた 754 個の種のボロノイ。 2 つの種から等距離の帯（幅 0.8mm）をひびとしてアルファ 0 にする。 境界は 0.5mm の fbm で歪めて、直線の目地にしない。<\/li><li><strong>剥落の場<\/strong>: 60mm の大きな雑音 0.75 ＋ 9mm の雑音 0.25。中央の花の 周りは 0.18 だけ場を弱めて、メダリオンが残りやすくする（絵の続きが 読める部分を 1 つ確保する）。上位 32% を剥落とし、区画ごとに剥落の場に 入っている割合 f で 3 段に分ける（f &gt; 0.7 で区画ごと無い、0.3〜0.7 で 場の側だけ欠ける、それ未満は残る）。<\/li><li>0.7mm の開処理で細い破片を落とし、4mm² 未満の島も落とす（最小 XY 0.6 の下になる破片を残さない）。<\/li><li><strong>絵<\/strong>: 黄土の帯（幅 10mm、内側 14mm）に黒の波線（周期 12mm）、中央の 輪（半径 41〜46mm）と生成りの地に赤い 8 弁の花、四隅の小さな輪。 残った断片には 2.5mm の雑音で 45% だけ生成りを混ぜて摩耗させ、 20mm の雑音で色を 80〜100% に褪せさせる。<\/li><li>色は 32 階調にポスタリゼーション（PNG 318KB → 178KB。1MB の枠の ため。元絵は元から 4 色なので絵は変わらない）。<\/li><\/ul>\n<p>出力: 残った断片 <strong>481 個<\/strong>、差し渡し最大 13.0mm・中央値 9.3mm、漆喰が 残る面積 <strong>54.3%<\/strong>（剥落の場 32.0%、区画ごと無い 26.4%、途中で欠けた 5.7%）。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>240×180 → <strong>240.0 × 180.0 × 1.96mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>断片（最終解像度 1024）<\/td><td><strong>481 個、15mm 超 0 個<\/strong>、最大 8.7×13.1mm、中央値 9.4mm<\/td><td>≤15 ✓（probe で連結成分を数えた）<\/td><\/tr><tr><td>同じ断片（プレビュー解像度 512）<\/td><td>352 個、15mm 超 62 個、最大 23.9×41.2mm<\/td><td>道具の警告「1つの要素が 24×41mm」はこちらを見ている（下の評価）<\/td><\/tr><tr><td>ひび / 最小の破片<\/td><td>0.8mm / 0.7mm の開処理で落とした後<\/td><td>すき間 ≥0.6 ✓ / 最小 XY ≥0.6 ✓<\/td><\/tr><tr><td>高さ<\/td><td>板 1.0 ＋ 装飾 0.65〜1.0mm、最高 1.96mm<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>縦横比<\/td><td>1.96 ÷ 9.4（中央値の差し渡し）= <strong>0.21<\/strong><\/td><td>板。棘ではない<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong>、最低 Z 0.0000<\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>、最終メッシュ）<\/td><\/tr><tr><td>頂点<\/td><td>プレビュー 249,096 / 最終 1,173,954（2 個）<\/td><td>最終生成 10 秒<\/td><\/tr><\/table>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上（<code>preview_top.jpg<\/code>）は狙いどおり。<\/strong> 赤い地に黄土の帯と中央の 花が、右上と左下から剥がれている。剥落の縁が 2 種類——ひびに沿った 多角形の縁と、区画の途中で欠けた不規則な縁——になっていて、機械が 切った並びに見えない。中央のメダリオンは 8 弁のうち 7 弁が残り、 「絵の続き」が読める。<\/li><li><strong>寄り（<code>preview_macro.jpg<\/code>）が見せ場。<\/strong> 花弁の赤・輪の生成り・帯の 黄土が、それぞれ別の石片に分かれて 1 段ずつ盛り上がる。断片の角が 0.3mm 落ちていて、砕けた石に見える。<\/li><li><strong>弱いところ 1: 名前を変えた。<\/strong> 最初は「壁画（フレスコ）の剥落」と 呼んでいたが、撮った絵は目地で割れた石の並び——モザイクそのもの だった。ひびで区画に切る作り方が、必然的にモザイクを作る。フレスコに したいなら、区画を大きく（30mm 以上）取って<strong>道具の分割<\/strong>で刻む ほうが向く。次の作例の糸。<\/li><li><strong>弱いところ 2: 側面に縞が出る。<\/strong> 寄りで断片の側面に縦の筋が見える。 側面の色を「画像」にすると、上面の色をそのまま側面へ引き延ばすので、 上面の色の境目（赤と生成りの境など）が縦線になる。側面を単色にすれば 消えるが、そうすると断片の縁に「石の厚み」の色が出なくなる。今回は 縞のほうを取った。<\/li><li><strong>弱いところ 3: 道具の警告が出る。<\/strong> 生成のたびに「1つの要素が 24×41mm」と言われるが、これは<strong>プレビュー解像度（512、1 マス 0.47mm）で 0.8mm のひびが埋まって隣の断片と繋がるから<\/strong>で、最終 解像度（1024、0.23mm）では 481 個すべてが分かれて最大 13.1mm。 刷る物は条件の内。ただし警告は消えないので、ひびを 1.2mm にすれば プレビューでも分かれるはず（そのぶん目地が太く見える）。今回は 実物の目地の細さを取った。<\/li><li><strong>全景（<code>preview.jpg<\/code>）は暗い。<\/strong> 見本の 4 灯の光では、スレート色の 生地と赤の断片がどちらも沈む。真上と寄りを主に見る。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>反物のどこにモザイクの残る部分を置くかで、服の「壊れ方」が決まる。 胸に中央の花を置けばエンブレム、裾に帯の断片だけを置けば「かつて 縁飾りがあった」ドレス。断片は 1 つ 13mm 以下・厚み 2mm 以下なので、 ひびごとに曲がり（作例45 と同じ理屈）、剥落した所は生地そのもの だから、<strong>残った石片が多い場所ほど硬く、剥がれた場所ほど柔らかい<\/strong>—— 作例50 の勾配を、絵の側から作った形。裁ち線をひびに合わせる必要は ない（どこで切っても断片の途中で切れ、それも剥落に見える）。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_51.py     # source.png と depth_map.png BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/51_剥落_モザイクの断片 --final ... --python docs/samples/tools/render_macro.py -- docs/samples/51_剥落_モザイクの断片 --final --at 0.5,0.5 --span 70 --elev 30<\/p>\n<p><code>preview_top.jpg<\/code> も最終メッシュから撮る（<code>render_top.py<\/code> の <code>main<\/code> には <code>--final<\/code> が無いので、<code>make_sample.build(folder, True, False)<\/code> の後に <code>render_top.render_top(folder, objs, extra=base, name=\"preview_top\")<\/code> を 呼ぶ数行のスクリプト）。<strong>3 枚とも <code>--final<\/code> が要る<\/strong>——プレビュー 解像度ではひびが埋まって断片が繋がる（上の評価 3）。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/51_preview.jpg"},{"c":"真上","d":"img/51_preview_top.jpg"},{"c":"拡大","d":"img/51_preview_macro.jpg"}]},{"num":"52","title":"月の点描 — 粗密だけで階調","mode":"BRISTLE","path":"docs/samples/52_月の点描_粗密だけで階調","text":"<p class=\"lead\">**背中いっぱいの月。柱は 1 種類（直径 2.0mm・高さ 1.0mm・同じ生成り色）\nしかなく、あるかないかだけで満ち欠けと海が出る。暗い側は柱が無くなって\n生地に溶け、月は途中で終わる。<strong> 色も高さも太さも動かさず、<\/strong>密度だけで\n絵を描く**（リサーチの引き出し #8 の 1 件目）。<\/p><p><strong>背中いっぱいの月。柱は 1 種類（直径 2.0mm・高さ 1.0mm・同じ生成り色） しかなく、あるかないかだけで満ち欠けと海が出る。暗い側は柱が無くなって 生地に溶け、月は途中で終わる。<\/strong> 色も高さも太さも動かさず、<strong>密度だけで 絵を描く<\/strong>（リサーチの引き出し #8 の 1 件目）。<\/p>\n<p>作例50 は同じ仕組みで「反物の硬さの勾配」を作った。ここでは同じ経路を <strong>絵<\/strong>に使う——銅版のメゾチント（乱れた点で階調を出す）のつもりで。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><td>有無を 1 本ずつ決められる<\/td><\/tr><tr><td>断面 / 半径 / すき間<\/td><td>円形 / 1.0mm / 0.7mm（中心間隔 2.7mm）<\/td><td>点描の「点」。最小 XY 0.6・すき間 0.6 の上<\/td><\/tr><tr><td>配置<\/td><td>レンガ<\/td><td>格子の縦横の筋を弱める（点描は格子が見えると印刷の網点になる）<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td>1.0mm / ON<\/td><td>全部同じ高さ。縦横比 0.50<\/td><\/tr><tr><td><strong>領域マスク<\/strong><\/td><td>画像（<code>region_mask.png<\/code>）、間引き 1.0・高さ比 1.0・太さ比 1.0<\/td><td>階調を<strong>有無だけ<\/strong>に渡す。高さ比・太さ比を 1.0 に留めるのがこの作例の要<\/td><\/tr><tr><td>明暗による間引き / 半径変化<\/td><td>どちらも OFF<\/td><td>元絵は一色。階調は領域マスクだけが持つ（元絵に陰影を描くと柱の色まで暗くなる）<\/td><\/tr><tr><td>色<\/td><td>画像（上面・側面とも）、生成り (0.93, 0.90, 0.82)<\/td><td>1 色<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.06, 0.07, 0.10)<\/td><td>夜。柱の無い所がそのまま夜空<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>月の円の縁<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_52.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（生成りの一色、アルファは半径 145mm の円）と <code>region_mask.png<\/code>（白＝残る、黒＝消える）の 2 枚。紙面 300×300mm・3px/mm。<\/p>\n<ul><li><strong>陰影<\/strong>: 球の法線と光（左上・手前寄り）の内積の 0.9 乗、縁減光を 少し。満ちた側が左上、右下が夜。<\/li><li><strong>海<\/strong>: 110mm の fbm を smoothstep で切った暗い斑（明度 ×0.55〜1.0）。<\/li><li><strong>クレーター<\/strong>: 22 個、半径 14〜48mm。光の反対側の縁を明るく、光の側の 底を暗く。縁は球面の見かけで潰す。<strong>縁の幅は半径の 22%<\/strong>（下の評価）。<\/li><li>ガンマ 0.7 で中間を持ち上げる（確率＝明度なので、中間が沈むと月の 大部分が疎になる）。<\/li><li><strong>書くときに sRGB へ符号化する。<\/strong> 柱モードはマスクを画像テクスチャ ノード経由で読むので、8bit の灰は sRGB → リニアに直されてから「残る 確率」になる（灰 0.5 → 0.21）。素で書いた 1 回目は柱が意図の半分しか 残らなかった。<\/li><\/ul>\n<p>残る確率の平均（円の中）0.36、帯ごと（下から 30mm 刻み）: 0.01 0.09 0.17 0.24 0.31 0.45 0.47 0.45 0.35 0.14。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>300×300 → <strong>265.5 × 275.0 × 1.00mm<\/strong><\/td><td>460×360 の内 ✓。夜の側は柱が無いので指定より狭い<\/td><\/tr><tr><td>柱<\/td><td>直径 2.0mm、すき間 0.7mm、高さ 1.0mm<\/td><td>≥0.6 ✓ / ≥0.6 ✓ / ≥0.4 ✓<\/td><\/tr><tr><td>本数<\/td><td>約 3,300 本（円の中に立てられる約 9,700 本の 34%）<\/td><td>頂点 210,944 ÷ 64<\/td><\/tr><tr><td>縦横比<\/td><td>1.0 ÷ 2.0 = <strong>0.50<\/strong><\/td><td>棘ではない<\/td><\/tr><tr><td>密度（いちばん密な帯を 100 として、下から 30mm 刻み）<\/td><td>16 → 36 → 53 → 67 → 94 → 100 → 88 → 45 → 1 → 0%<\/td><td>—<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong>、最低 Z 0.0000<\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><\/table>\n<p>密度は <code>bf_pillar_height<\/code> を持つ頂点の Y を帯ごとに数えた（probe）。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上（<code>preview_top.jpg<\/code>）は、寄って見ると雑音、離れると月。<\/strong> 画面 そのままでは噛みつぶした点の集まりだが、4mm/画素まで縮める（1m 離れて 見る近似）と、左上の満ちた側・右下へ溶ける明暗境界・海の暗い斑が 月として読める。<strong>点描は近くで読む物ではない<\/strong>——背中いっぱいの大きさが 要る理由がこれで、150mm の月なら成り立たない。<\/li><li><strong>弱いところ 1: クレーターは 2〜3 個しか読めない。<\/strong> 1 回目は縁を 半径の 9%（1〜2mm）で描いていて、間隔 3.2mm の格子がそれを拾えず <strong>1 つも読めなかった<\/strong>。縁を 22%（3〜10mm）に広げ、格子を 2.7mm に 詰めてこの数。柱ごとの乱数（白色雑音）が縁の太さと同じ大きさの ざらつきを作るので、これ以上はクレーターを大きくするしかなく、 そうすると月の「肌」ではなく「模様」になる。今回は月の側を取った。<\/li><li><strong>弱いところ 2: 明暗境界が段になる所がある。<\/strong> レンガ配置でも行の 筋は残り、疎な帯で行ごとに点が並ぶ瞬間がある（真上の右側）。作例50 で 書いた「格子の上の大小は網点と同じ構造」と同じ限界。<\/li><li><strong>寄り（<code>preview_macro.jpg<\/code>）は説明の絵。<\/strong> 同じ柱が、あるかないかだけ で密度を変えているのが見える。見せ場は真上のほう。<\/li><li><strong>全景（<code>preview.jpg<\/code>）は暗い。<\/strong> 夜の生地に生成りの点なので、4 灯の 光でも紙面が沈む。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>背中いっぱいの月——ケープかロングジャケットの後ろ身頃の、肩から腰までを 1 枚で使う。柱は直径 2mm・高さ 1mm・すき間 0.7mm で、密な側でも 1 本ずつ独立しているので、<strong>どの帯も布のまま曲がる<\/strong>（作例50 の甲とは 違って硬さの勾配は作らない。密な側は少し重くなるだけ）。夜の側は 生地そのものなので、月がどこで終わるかは決めなくてよく、裁ち線が 月の中を通っても「欠けた月」になる。生地を黒に近い紺にしたのは、 柱の無い所が「無い」ではなく「夜」と読めるように。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_52.py     # source.png と region_mask.png BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/52_月の点描_粗密だけで階調 ... --python docs/samples/tools/render_top.py -- docs/samples/52_月の点描_粗密だけで階調 ... --python docs/samples/tools/render_macro.py -- docs/samples/52_月の点描_粗密だけで階調 --at 0.62,0.55 --span 80 --elev 30<\/p>\n<p><code>region_mask.png<\/code> は sRGB に符号化してあるので、<strong>Photoshop などで 描き直すときも「見えている明度＝残る確率」ではない<\/strong>（見えている灰 50% なら残るのは 21%）。元絵を直すなら <code>make_art_52.py<\/code> の <code>val<\/code> の側で。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/52_preview.jpg"},{"c":"真上","d":"img/52_preview_top.jpg"},{"c":"拡大","d":"img/52_preview_macro.jpg"}]},{"num":"53","title":"鱗 — 重ならずに重なる","mode":"SURFACE","path":"docs/samples/53_鱗_重ならずに重なる","text":"<p class=\"lead\">**襟元で小さく、裾で大きくなる魚の鱗。上の列が下の列に被さって見えるが、\n実際には 1 枚も重なっていない。** オーバーハング禁止の中で「重なり」を\n作る（リサーチの引き出し #9 の 1 件目）。作例51 と同じく、割り方は\n道具の［面を分割する］ではなく元絵の側で決め、面モードの区画 1 つを\n鱗 1 枚にする。<\/p><p><strong>襟元で小さく、裾で大きくなる魚の鱗。上の列が下の列に被さって見えるが、 実際には 1 枚も重なっていない。<\/strong> オーバーハング禁止の中で「重なり」を 作る（リサーチの引き出し #9 の 1 件目）。作例51 と同じく、割り方は 道具の［面を分割する］ではなく元絵の側で決め、面モードの区画 1 つを 鱗 1 枚にする。<\/p>\n<h3>重なって見える仕組み<\/h3>\n<p>鱗の並びは「円を上の列から順に重ね描きした」形。1 枚の鱗で見えるのは、 自分の円の下半分から上の列 2 枚の円の弧までの尖ったアーチだけ。その区画を 高さマップで<strong>下の縁（自由端）ほど厚く、上ほど薄い楔<\/strong>にすると、上の列の 厚い縁が下の列の薄い上端のすぐ隣に立つので、上が下に被さっているように 読める。実際は隣り合った 2 つの区画で、どちらも下へ向かって狭まる楔—— 空中へ張り出す面は 1 つも無い（下の数字）。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>鱗 1 枚が「ブロック」。区画の縁が輪郭吸着で滑らかになる<\/td><\/tr><tr><td>高さの決め方 / 最大高さ<\/td><td>高さマップ / 0.5mm<\/td><td>板の厚み（鱗の上端の薄さ）<\/td><\/tr><tr><td>高さマップ（<code>depth_map.png<\/code>） / 強さ<\/td><td>2.5mm<\/td><td>楔。自由端で 2.5、上端で 0。最高 3.0mm<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>円弧の階段を消す。元絵は 3px/mm<\/td><\/tr><tr><td>角の丸み<\/td><td><strong>切<\/strong>（0.3mm・2 段・上の縁と記録）<\/td><td><strong>自由端の角は落ちていない。<\/strong>スイッチが切なので面取りは走っていない（2026-09-06 に訂正）<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>区画は元絵で済んでいる<\/td><\/tr><tr><td>色<\/td><td>画像（上面・側面とも）<\/td><td>玉虫。襟で青緑 → 青 → 紫 → 裾で紅。鱗ごとに ±6° 揺らし、自由端の帯だけ 1 段明るい<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.10, 0.09, 0.12)<\/td><td>すき間が暗い線になる（鱗の縁取り）<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>4 段のアルファの真ん中で切る<\/td><\/tr><tr><td>解像度<\/td><td>プレビュー 512 / 最終 1024<\/td><td><strong>3 枚とも最終で撮る<\/strong>（下の評価 3）<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_53.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA、240×300mm・3px/mm）と <code>depth_map.png<\/code>（白黒）の 2 枚。<\/p>\n<ul><li><strong>列<\/strong>: 上から下へ 79 列。半径は襟 4.0mm → 裾 7.2mm を高さで補間し、 列の間隔は半径の 0.72 倍。1 列おきに半径ぶんずらす。<\/li><li><strong>持ち主<\/strong>: 下の列から順に円を塗り、上の列が上書きする。区画の内側距離は min(自分の円の内側, 上の列の円の外側) で、すき間 0.7mm を引いた所で アルファを切る。<strong>1,827 枚<\/strong>、幅 8.0〜14.4mm。<\/li><li><strong>楔<\/strong>: 自分の円の上端で 0、下端で 1 の 1.8 乗。幅方向に 14% だけ丸い。 48 階調（1 段 0.05mm）。<\/li><li><strong>色<\/strong>: 鱗ごとに 1 色の平塗り（色相は列の中心の高さで決め、鱗ごとに揺らす）。 自由端の帯（下 22%）だけ明度 +0.12。<\/li><li><strong>アルファは 4 段<\/strong>（0, 1/3, 2/3, 1）。連続の縁は 1,800 枚ぶんで 200KB に なり、フォルダが 1MB を超えた。道具は 0.5 で切るので境目は 1/6 画素 （0.06mm）しか動かない。<\/li><\/ul>\n<p>刷る面積 77.8%（残りがすき間）。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>240×300 → <strong>240.0 × 300.0 × 3.00mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>鱗（最終解像度 1024）<\/td><td><strong>1,827 枚、15mm 超 0 枚<\/strong>、最大 13.2×8.5mm、中央値 8.6mm<\/td><td>≤15 ✓（probe で連結成分を数えた）<\/td><\/tr><tr><td>同じ鱗（プレビュー解像度 512）<\/td><td>17 個、うち 1 個が 240×300mm<\/td><td>道具の警告「1つの要素が 240×300mm」はこちら（下の評価 3）<\/td><\/tr><tr><td>すき間 / 最小の幅<\/td><td>0.7mm / 8.0mm（襟）<\/td><td>≥0.6 ✓ / ≥0.6 ✓<\/td><\/tr><tr><td>高さ<\/td><td>上端 0.5mm 〜 自由端 3.0mm<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>縦横比<\/td><td>3.0 ÷ 14.4（裾の幅）= <strong>0.21<\/strong><\/td><td>板。棘ではない<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong>、最低 Z 0.0000<\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>、最終メッシュ）<\/td><\/tr><tr><td>頂点<\/td><td>最終 1,499,576（生成 17 秒）<\/td><td>—<\/td><\/tr><\/table>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上（<code>preview_top.jpg<\/code>）は鱗として読める。<\/strong> 尖ったアーチが互い違いに 並び、襟の青緑から裾の紅へ色が流れる。すき間の暗い線が縁取りになって、 上の列が下の列に「載っている」ように見える。大きさの勾配（8 → 14mm）は 真上でも読めるが控えめで、裾で少し大きい、くらい。<\/li><li><strong>寄り（<code>preview_macro.jpg<\/code>）は魚の鱗というより瓦。<\/strong> 楔は狙いどおり 自由端で 2.4mm の段になり、上の列の厚い縁が下の列の薄い上端に接して 「被さっている」ように読める——<strong>仕組みは効いている<\/strong>。ただし斜め 25° で 見ると、区画の形がアーチではなく尖った帯（山形）に読め、瓦屋根か 鎧の小札に近い。鱗に見えるのは真上と全景で、寄りは仕組みの説明の絵。<\/li><li><strong>弱いところ 1: 段の色が白く飛ぶ。<\/strong> 自由端の帯を 1 段明るくした上に、 見本の 4 灯が楔の傾いた面を正面から照らすので、寄りで上面が薄紫〜白に 見える。上面の色（青緑〜紅）が出るのは真上だけ。帯の明度差は要らなかった かもしれない——形の段が既に縁を言っている。<\/li><li><strong>弱いところ 2: 側面に縦の縞。<\/strong> 作例51 と同じ。側面の色を「画像」に すると、上面の帯の境目が側面に縦線として引き延ばされる。<\/li><li><strong>弱いところ 3: 道具の警告。<\/strong> プレビュー解像度（1 マス 0.47mm）では 0.7mm のすき間が埋まって 17 個に繋がり、「1つの要素が 240×300mm」と 言われる。最終解像度では 1,827 枚すべてが分かれる。作例51 と同じ現象で、 <code>欲しい機能<\/code> の #26 に書いてある。すき間を 1.2mm にすればプレビューでも 分かれるが、鱗の縁取りが太くなる。今回は縁の細さを取った。<\/li><li><strong>全景（<code>preview.jpg<\/code>）は色の流れがいちばん出る。<\/strong> 3 枚の中で服の イメージに近いのはこれ。<\/li><\/ul>\n<h3>服として<\/h3>\n<p>襟から裾へ鱗が育つ——マーメイドラインのドレスの前身頃、あるいはボレロの 背中。鱗は 1 枚 8〜14mm・厚み 3mm 以下で、すき間ごとに曲がるので、 <strong>上の列が下の列に「載る」向きに曲げると鱗が閉じ、逆に曲げると開いて生地が 覗く<\/strong>（自由端が厚いので、開いたときに段が影を作る）。裁ち線はどこを 通っても鱗の途中で切れ、それも魚の断面に見える。色は襟の青緑から裾の紅へ 変わるので、パネルの向きがそのまま服の上下を決める——裾を紅にするか 青緑にするかで印象が逆になる（紅を上にすると火、青緑を上にすると水）。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_53.py     # source.png と depth_map.png BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/53_鱗_重ならずに重なる --final ... --python docs/samples/tools/render_macro.py -- docs/samples/53_鱗_重ならずに重なる --final --at 0.5,0.35 --span 60 --elev 25<\/p>\n<p><code>preview_top.jpg<\/code> も最終メッシュから撮る（作例51 と同じ数行のスクリプト： <code>make_sample.build(folder, True, False)<\/code> の後に <code>render_top.render_top(folder, objs, extra=base, name=\"preview_top\")<\/code>）。 <strong>3 枚とも <code>--final<\/code> が要る<\/strong>——プレビュー解像度ではすき間が埋まって 鱗が繋がる（上の評価 3）。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/53_preview.jpg"},{"c":"真上","d":"img/53_preview_top.jpg"},{"c":"拡大","d":"img/53_preview_macro.jpg"}]},{"num":"54","title":"付け衿 — 刷った反物が型紙","mode":"BRISTLE","path":"docs/samples/54_付け衿_刷った反物が型紙","text":"<p class=\"lead\"><strong>反物の上に、付け衿の左右 2 枚が型紙ごと刷ってある。<\/strong> 柄（衿ぐりから\n外へ放射する短い畝）はそれぞれの片の形に沿い、縫い代 12mm は素の生地、\n裁ち線は点、合印は短い棒。刷り上がりを点の内側で切って縫えば衿になる\n（リサーチの引き出し #3「裁ち線を含んだ設計」）。作例32 は紙面の四辺に\n余白を残したところまでだったが、ここでは<strong>型紙そのものが生成物<\/strong>で、\n布に型紙を写す工程が無い。<\/p><p><strong>反物の上に、付け衿の左右 2 枚が型紙ごと刷ってある。<\/strong> 柄（衿ぐりから 外へ放射する短い畝）はそれぞれの片の形に沿い、縫い代 12mm は素の生地、 裁ち線は点、合印は短い棒。刷り上がりを点の内側で切って縫えば衿になる （リサーチの引き出し #3「裁ち線を含んだ設計」）。作例32 は紙面の四辺に 余白を残したところまでだったが、ここでは<strong>型紙そのものが生成物<\/strong>で、 布に型紙を写す工程が無い。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><td>柱 1 本ずつに向きを持たせられる（面モードに向きは無い）<\/td><\/tr><tr><td>断面 / 半径 / X 倍率<\/td><td>角柱（4 頂点）/ 0.45mm / 3.5<\/td><td>0.9 × 3.15mm の棒。細いほう 0.9 ≥ 0.6<\/td><\/tr><tr><td>すき間<\/td><td>0.7mm（中心間隔 3.85mm）<\/td><td>棒の長辺で間隔が決まる（v7.17.0）<\/td><\/tr><tr><td><strong>向き<\/strong><\/td><td><strong>流れに沿う<\/strong><\/td><td>元絵の明るさの等値線に寝る。片ごとの中心まわりの角度を三角波にしてあるので、等値線＝半径方向<\/td><\/tr><tr><td>最大高さ / 高さを揃える<\/td><td>2.8mm / ON<\/td><td>明るさは向きに使い切る。高さは領域マスクへ<\/td><\/tr><tr><td><strong>領域マスク<\/strong><\/td><td>画像（<code>region_mask.png<\/code>）、<strong>黒い部分の高さ比 0.15<\/strong>、太さ比 1.0、間引き 0<\/td><td>衿ぐり 2.8mm → 外縁 1.2mm の勾配。裁ち線の点 0.5mm、合印 1.2mm<\/td><\/tr><tr><td>先細り<\/td><td>0.9<\/td><td>棒の側面を少しだけ立てる<\/td><\/tr><tr><td>色<\/td><td>根元から先端へ（根元 淡い緑 → 先端 深緑）<\/td><td>真上から見ると先端の深緑で形が読める。元絵の明るさを色に読ませない<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.90, 0.87, 0.79)<\/td><td>生成りのキャラコ。縫い代がそのまま見える<\/td><\/tr><tr><td>組み立て用の余白<\/td><td>OFF<\/td><td>余白は元絵のアルファで描く（四辺ではなく型紙の形に沿う）<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>4 段のアルファの真ん中<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_54.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA、430×205mm・3px/mm）と <code>region_mask.png<\/code>（白黒）の 2 枚。<\/p>\n<ul><li><strong>型紙<\/strong>: 衿ぐりの半径 90mm・幅 65mm・100° ぶんの扇形。前端の外角は 半径 28mm で丸める（ピーターパン衿）。右の片を作って、左は鏡像。 中心は紙面の (40, 25) と (390, 25)。<\/li><li><strong>アルファ<\/strong>: 縫い線（型紙の輪郭）の 0.6mm 内側から 1。縫い代 12mm は 0。 輪郭までの符号つき距離は輪郭を 0.5mm ごとに標本化して総当たりで取る （scipy 無し）。<\/li><li><strong>裁ち線の点<\/strong>: 縫い線の 15mm 外（＝裁ち線の 1mm 外）に半径 2mm の点を 弧長 7mm ごとに 180 個。角では法線を回して弧にする。<strong>点の内側を なぞって切る<\/strong>——点の上を切らない。<\/li><li><strong>合印<\/strong>: 肩（衿ぐりの 50°）と外縁の中ほど（45°）に、裁ち線の外へ 6mm の棒。<\/li><li><strong>明るさ<\/strong>: 片ごとの中心まわりの角度の三角波（周期 20°、0.15〜0.85）。 勾配の大きさが至る所で一定なので、流れに沿う向きの門（0.002）を割らない。 作例43 と同じ通し方。<\/li><li><strong>領域マスク<\/strong>: 高さの係数 f を 衿ぐり 1.0 → 外縁 0.43、点 0.18、 合印 0.43 にし、<code>(f − 0.15) / 0.85<\/code> を <strong>sRGB に符号化<\/strong>して書く （柱モードはマスクを画像テクスチャ経由で読むので、リニアに直されて から係数になる。作例52 と同じ）。<\/li><\/ul>\n<p>刷る面積 30.3%（型紙の中身だけ）。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>430×205 → <strong>410.0 × 196.6 × 2.78mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>棒<\/td><td>0.9 × 3.15mm、すき間 0.7mm<\/td><td>細いほう ≥0.6 ✓ / ≥0.6 ✓<\/td><\/tr><tr><td>本数<\/td><td>1,928 本（型紙の中 1,796 本、裁ち線の点と合印で約 130 本）<\/td><td>頂点 15,424<\/td><\/tr><tr><td>高さ（型紙の中、中心からの距離ごとの中央値）<\/td><td>r 91–100: 2.67 / 100–115: 2.36 / 115–130: 1.99 / 130–145: 1.63 / 145–154: 1.34mm<\/td><td>0.4〜15 ✓。狙いは 2.8 → 1.2<\/td><\/tr><tr><td>点・合印の高さ<\/td><td>0.50 / 1.23mm<\/td><td>≥0.4 ✓<\/td><\/tr><tr><td><strong>向き<\/strong><\/td><td>型紙の中 1,796 本の長軸と、片の中心からの半径方向との角度差：<strong>中央値 2.5°、15° 以内が 97%<\/strong><\/td><td>流れに沿う向きが放射として効いている（probe で各柱の頂点を主成分分析）<\/td><\/tr><tr><td>縦横比<\/td><td>2.78 ÷ 0.9 = <strong>3.1<\/strong><\/td><td>棘ではない。棒は寝ている<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong>、最低 Z 0.0000<\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><\/table>\n<p>高さと向きは probe で柱ごとに測った（辺で繋がった頂点の塊 1 つ＝柱 1 本）。 <strong>1 回目は probe が紙面の原点を取り違えていて<\/strong>「放射になっていない・高さが 外ほど高い」と出た——柱の生成物は紙面の中心が原点なので、(215, 102.5) ずらして測り直したら上の数字になった。絵を見て「向きが効いていない」と 思った 1 回目の判断も同じ誤りで、寄りの絵は棒を端から見ていただけだった。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>真上（<code>preview_top.jpg<\/code>）が本命。<\/strong> 扇形 2 枚から短い棒が放射状に 流れ、外側を点線が回り、肩と外縁に合印の棒が立つ——<strong>型紙の図面そのもの が生地の上にある<\/strong>。1 回目（半径 0.4・倍率 3.0）は棒が短くて向きが 読めず、0.45・3.5 にして初めて扇が見えた。<\/li><li><strong>格子と放射の相性で、縦横の筋が出る。<\/strong> 半径方向が格子の軸と揃う所 （左の片の上部と下部）では棒が 0.7mm のすき間で鎖になって畝に見え、 45° の所では互い違いの刷毛目になる。1 枚の中で織り方が変わって見える ——欠点でもあり、扇の「回転」を強調してもいる。放射配置（円形）なら 出ないが、中心が 2 つあるので使えない。<\/li><li><strong>裁ち線の点は 3 割ほど落ちる。<\/strong> 半径 2mm の点 180 個に対し、格子 （間隔 3.85mm）の交点が入らない点がある。点線としては読めるが、間隔が 一定でない。点を半径 2.5mm にすれば拾えるが、点そのものが目立つ。<\/li><li><strong>寄り（<code>preview_macro.jpg<\/code>）は外縁の合印と点。<\/strong> 棒が 1.3mm しかない 所なので浅く見える。衿ぐり側で撮れば 2.7mm の棒が並ぶが、そこには 裁ち線が無い。この作例の見せ場は「切る所」なので外縁を選んだ。<\/li><li><strong>全景（<code>preview.jpg<\/code>）は遠い。<\/strong> 紙面 430mm に対して柱が 3mm なので、 型紙の形と、奥の片で衿ぐりが高いことが分かる程度。<\/li><li><strong>色は真上で効いている。<\/strong> 先端を深緑にしたので、生成りの上で棒が 線として読める。1 回目は先端が淡緑で、真上の絵が霞んでいた。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>刷って、点の内側で切って、衿ぐりを縫うだけの付け衿。<\/strong> 縫い代は素の 生地なので普通に縫え、合印は手で写さなくてよい。棒は衿ぐりで 2.7mm・ 外縁で 1.3mm なので、首に沿う内側が硬く、外へ行くほど布の柔らかさが 戻る——衿が首から浮かずに、端は服に沿って落ちる。放射の畝は衿ぐりから 外へ光が走るので、正面から見ると衿が首を囲む「襞」に見える。 同じ仕組みで、袖口・ポケット口・ベルトなど「型紙が小さく、縫い代が はっきりしている」部品に使える。<strong>大きな身頃には向かない<\/strong>——紙面 460×360 に型紙が収まらないし、型紙が変わるたびに元絵を作り直す。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_54.py     # source.png と region_mask.png BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/54_付け衿_刷った反物が型紙 ... --python docs/samples/tools/render_top.py -- docs/samples/54_付け衿_刷った反物が型紙 ... --python docs/samples/tools/render_macro.py -- docs/samples/54_付け衿_刷った反物が型紙 --at 0.35,0.66 --span 70 --elev 35<\/p>\n<p>型紙を変えるなら <code>make_art_54.py<\/code> の <code>outline_points()<\/code>（右の片 1 枚の輪郭、 反時計回り）を差し替える。縫い代・点・合印・向き・高さは輪郭から自動で 作られる。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/54_preview.jpg"},{"c":"真上","d":"img/54_preview_top.jpg"},{"c":"拡大","d":"img/54_preview_macro.jpg"}]},{"num":"55","title":"二つの柄 — 左から水玉、右から縞","mode":"SURFACE","path":"docs/samples/55_二つの柄_左から水玉_右から縞","text":"<p class=\"lead\">**通り過ぎると柄が変わる反物。左から見ると水玉、右から見ると 45° の縞。\n同じ 2 色・同じ生地で、見る向きだけで柄が入れ替わる**（リサーチの\n引き出し #4「向きで光が走る」の、光ではなく絵の版）。子どもの工作の\nアガモグラフや街の二面看板を、面モードの三角の畝でやる。柱でも面でも\n「絵は 1 枚」だったこれまでの作例と違い、<strong>1 枚の反物が 2 枚の絵を持つ。<\/strong><\/p><p><strong>通り過ぎると柄が変わる反物。左から見ると水玉、右から見ると 45° の縞。 同じ 2 色・同じ生地で、見る向きだけで柄が入れ替わる<\/strong>（リサーチの 引き出し #4「向きで光が走る」の、光ではなく絵の版）。子どもの工作の アガモグラフや街の二面看板を、面モードの三角の畝でやる。柱でも面でも 「絵は 1 枚」だったこれまでの作例と違い、<strong>1 枚の反物が 2 枚の絵を持つ。<\/strong><\/p>\n<h3>仕組み<\/h3>\n<p>幅 6mm の山形の畝（両斜面 51°、頂は 1.2mm の平ら）を x 方向に並べ、 左を向く斜面に柄 A（水玉）、右を向く斜面に柄 B（縞）を塗る。左から 45° の高さで見ると、右向きの斜面は山の陰に隠れて左向きの斜面だけが 見える——絵は A。右から見れば B。真上からは A と B が 3mm ずつ 互い違いに混ざった縞になる。斜面は上を向いているのでオーバーハングは 無い。畝が 300mm 続くと 1 つの要素が 15mm を超えるので、 12 × 13mm の区画に切る（作例51・53 と同じ「区画は元絵で決める」）。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>斜面に色を塗れるのは面だけ（柱の側面は 1 色）<\/td><\/tr><tr><td>高さの決め方 / 最大高さ<\/td><td>高さマップ / 0.5mm<\/td><td>板の厚み<\/td><\/tr><tr><td>高さマップ（<code>depth_map.png<\/code>） / 強さ<\/td><td>3.0mm<\/td><td>畝の山。頂で 3.0、谷で 0。板と合わせて 3.5mm<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>区画の縁<\/td><\/tr><tr><td>角の丸み / スムーズ<\/td><td>OFF / 0<\/td><td>斜面を平面のまま保つ（丸めると頂の稜線が動いて絵が滲む）<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>区画は元絵で済んでいる<\/td><\/tr><tr><td>色<\/td><td>画像（上面・側面とも）<\/td><td>斜面の色がそのまま絵<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.06, 0.07, 0.18)<\/td><td>地色の藍より一段暗い。区画のすき間が目立たない<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>4 段のアルファの真ん中<\/td><\/tr><tr><td>解像度<\/td><td>プレビュー 512 / 最終 1024<\/td><td><strong>4 枚とも最終で撮る<\/strong>（すき間 0.7mm はプレビューの格子で埋まる）<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_55.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA、300×300mm・3px/mm、23KB）と <code>depth_map.png<\/code>（白黒、 2KB）。<code>ref_A.png<\/code> / <code>ref_B.png<\/code> は左右から見えるはずの絵で、検算にだけ 使う。<\/p>\n<ul><li><strong>区画<\/strong>: x は 0.7mm のすき間 ＋ 畝 2 本（12.0mm）、y は 13.0mm ＋ 0.7mm。約 480 個。<\/li><li><strong>畝<\/strong>: 区画の中に 6mm の山形を 2 本。頂は 0.8 で切って平らにし、 それを 1.0 に正規化（高さマップの強さ 3.0mm がそのまま頂の高さ）。<\/li><li><strong>柄 A<\/strong>: 生成りの水玉、直径 36mm、六方 52mm。<strong>柄 B<\/strong>: 45° の縞、 周期 24mm、半々。どちらも藍 (26, 31, 77) と生成り (235, 224, 199) の 2 色だけ。左向きの斜面（畝の中で x が小さい側）に A、右向きに B、 頂は藍。<\/li><li>アルファは 4 段。刷る面積 89.6%。<\/li><\/ul>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>300×300 → <strong>299.6 × 299.6 × 3.50mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>要素<\/td><td>いちばん大きい要素 12×13mm（道具の報告）<\/td><td>≤15 ✓<\/td><\/tr><tr><td>すき間 / 頂の幅<\/td><td>0.7mm / 1.2mm<\/td><td>≥0.6 ✓ / ≥0.6 ✓<\/td><\/tr><tr><td>高さ<\/td><td>板 0.5 〜 頂 3.5mm、斜面 51°<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>縦横比<\/td><td>3.5 ÷ 12 = <strong>0.29<\/strong><\/td><td>板。棘ではない<\/td><\/tr><tr><td><strong>左から見た絵と柄 A の相関<\/strong><\/td><td><strong>0.77<\/strong>（柄 B とは 0.06）<\/td><td>左から 45° の正投影（<code>preview_left<\/code>）を柄 A・B の絵と突き合わせた<\/td><\/tr><tr><td><strong>右から見た絵と柄 B の相関<\/strong><\/td><td><strong>0.61<\/strong>（柄 A とは 0.05）<\/td><td>同じく右から<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong>、最低 Z 0.0000<\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>、最終メッシュ）<\/td><\/tr><tr><td>頂点<\/td><td>最終 1,970,108<\/td><td>—<\/td><\/tr><\/table>\n<p>相関は、背景を透明にして撮った PNG から紙面の外接を切り出し、明るさを 柄 A・B の絵（紙面と同じ向きに転置・反転して縮めたもの）と比べた ピアソン相関。<strong>右からの絵は左右も上下も鏡になる<\/strong>（カメラの局所軸が 反対を向く）ので、向きを 4 通り試して合う向きの値を採った。合わない 向きでは B が −0.56 と出る——45° の縞を鏡にすると −45° の縞になるから。 縞の 0.61 が水玉の 0.77 より低いのは、縞のほうが 3mm の畝の刻みに 対して細かい（周期 24mm）ため。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>主張どおりに写った。<\/strong> 左（<code>preview_left.jpg<\/code>）は水玉、右 （<code>preview_right.jpg<\/code>）は縞で、どちらの絵にも反対の柄はほとんど 混ざらない。真上（<code>preview_top.jpg<\/code>）は 2 つの柄が 3mm 刻みで 混ざった別の柄——水玉の輪郭が縞で刻まれた「第 3 の柄」で、これも それなりに面白い。全景（<code>preview.jpg<\/code>、道具の既定の斜め 45° 手前左） は水玉側で、区画の畝が瓦のように見える。<\/li><li><strong>絵の解像度は畝の幅で決まる。<\/strong> 3mm 刻みなので、直径 36mm の水玉は 12 段の階段になり、縁がぎざつく。<strong>大柄でしか成り立たない<\/strong>—— それが左右で入れ替わる絵の限界で、細かい柄は真上の混ざりと区別が 付かなくなる。<\/li><li><strong>区画の線が絵に入る。<\/strong> x のすき間は畝の谷に重なるので目立たないが、 y のすき間（13mm ごと）は畝を横切って横線になる。生地を地色より 暗くして線を弱めたが、左右からの絵で薄い横縞として残る。区画を y に長く（15mm）すれば線は減るが 15mm の上限に触れる。<\/li><li><strong>見る角度の幅は測っていない。<\/strong> 斜面 51° なので、仰角 39° より低いと 反対の斜面が見え始め、90°（真上）では混ざる。45° で撮った 2 枚が この作例の証拠で、その間の角度でどう移り変わるかは実物でしか 分からない。<\/li><li><strong>2 色に絞ったのは正しかった。<\/strong> 色まで変えると「柄が変わった」のか 「色が変わった」のか読めない。同じ藍と生成りで柄だけ入れ替わるので、 仕組みが絵で読める。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>歩くと柄が変わるスカート。<\/strong> 畝を縦（身長方向）に走らせると、正面から は真上の混ざった柄、左に歩き出すと水玉、右に歩くと縞——見る人の位置で 柄が決まるので、ショーの花道で観客の左右の席に別の服を見せられる。 畝は 6mm・区画 12×13mm・高さ 3.5mm で、区画ごとに曲がるので生地は ドレープする。ただし畝の方向に曲げると斜面の角度が変わって左右の 絵が混ざるので、<strong>畝と直角（横方向）に曲がる場所——スカートの周方向 ——に置く<\/strong>のが正しい。上着なら前身頃の縦畝、着ている人が振り向くと 柄が変わる。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_55.py     # source.png / depth_map.png / ref_A.png / ref_B.png BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/55_二つの柄_左から水玉_右から縞 --final ... --python docs/samples/tools/render_view.py -- docs/samples/55_二つの柄_左から水玉_右から縞 --azim 180 --elev 45 --name preview_left --final ... --python docs/samples/tools/render_view.py -- docs/samples/55_二つの柄_左から水玉_右から縞 --azim 0 --elev 45 --name preview_right --final<\/p>\n<p><code>preview_top.jpg<\/code> は最終メッシュから <code>render_top.render_top(...)<\/code> で撮る （作例51・53 と同じ）。<code>render_view.py<\/code> は今回作った道具で、紙面ぜんたい を決めた方位・仰角から正投影で撮る。撮ったあと 4 枚を 1000〜1600px・ JPEG 品質 80 に縮めてフォルダを 1MB の内に収めた。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/55_preview.jpg"},{"c":"真上","d":"img/55_preview_top.jpg"},{"c":"左から（方位 180°・仰角 45°）","d":"img/55_preview_left.jpg"},{"c":"右から（方位 0°・仰角 45°）","d":"img/55_preview_right.jpg"}]},{"num":"56","title":"氷の中の花 — 縁から氷になる","mode":"BRISTLE","path":"docs/samples/56_氷の中の花_縁から氷になる","text":"<p class=\"lead\">**色の芯を透明で包んだ柱で花を刷る。花芯は太く高く色が濃く、花弁の先へ\n行くほど柱が細く低くなって、芯が透明の中で細り、縁は氷だけになる**——\n花が氷の中に溶け込んでいく反物（リサーチの引き出し #5「透明の層の下に\n色」）。J850 は VeroClear と VeroColor を <strong>1 本の柱の中で重ねられる<\/strong>。\n作例41（琥珀）は 1 本の柱の中の芯を見せた。ここでは**芯の残り方を紙面の\nうえで連続して変える**——それが、この機械でしかできない柄の作り方。<\/p><p><strong>色の芯を透明で包んだ柱で花を刷る。花芯は太く高く色が濃く、花弁の先へ 行くほど柱が細く低くなって、芯が透明の中で細り、縁は氷だけになる<\/strong>—— 花が氷の中に溶け込んでいく反物（リサーチの引き出し #5「透明の層の下に 色」）。J850 は VeroClear と VeroColor を <strong>1 本の柱の中で重ねられる<\/strong>。 作例41（琥珀）は 1 本の柱の中の芯を見せた。ここでは<strong>芯の残り方を紙面の うえで連続して変える<\/strong>——それが、この機械でしかできない柄の作り方。<\/p>\n<h3>仕組み<\/h3>\n<p>柱モード。明暗による半径変化と高さ変化を両方入れる（既定＝暗いほど太く 高い）。花弁は根元が深紅（暗い）、先が淡桃（明るい）の勾配で塗ってある ので、根元の柱は太く高く、先の柱は細く低い。<\/p>\n<p>透明の［範囲］＝外皮、［方式］＝厚み 0.4mm。<strong>外皮の厚みは柱の太さに よらず一定<\/strong>なので、芯の残り方は太さで決まる——太い柱では直径の 6 割、 細い柱では 4 割（頭打ち 35% の少し上）。芯の高さも 0.4mm 引かれるだけ。 つまり同じ絵を、<strong>高さ・太さ・芯の割合の 3 つが同じ向きに<\/strong>読む。 花芯に近いほど色が濃く太く高く残り、縁に近いほど薄く細く低く、氷の 割合が増える。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><td>外皮の透明を 1 本ずつ持てるのは柱（面は板ぜんたい）<\/td><\/tr><tr><td>断面 / 頂点数 / 先細り<\/td><td>ドーム / 16 / 0.92<\/td><td>氷の粒。角が無いほうが透明が読める<\/td><\/tr><tr><td>半径 / 最小半径比率<\/td><td>1.1mm / 0.3<\/td><td>太さ 1.17〜2.18mm。芯 0.6mm 以上を保つ下限<\/td><\/tr><tr><td>最大高さ / 明暗で高さ変化<\/td><td>4.0mm / ON<\/td><td>花芯 3.9mm、縁 1.3mm<\/td><\/tr><tr><td>間隔保持 / すき間<\/td><td>ON / 0.6mm<\/td><td>79×79、間隔 2.79mm。最太 2.18 でもすき間 0.61<\/td><\/tr><tr><td>透明 ［範囲］／［方式］／厚み<\/td><td>外皮 / 厚み(mm) / 0.4<\/td><td>皮は片側 0.40mm 一定（実測で全ての太さで一致）<\/td><\/tr><tr><td>底の外皮<\/td><td>0（着地）<\/td><td>芯は床に着く。浮かせると外皮の底面ぶん色が沈む<\/td><\/tr><tr><td>色<\/td><td>画像（上面・側面とも）<\/td><td>芯の色＝元絵の色。外皮は無色<\/td><\/tr><tr><td>クリアの表示（※表示のみ）/ 色<\/td><td><strong>0.12<\/strong> / (0.90, 0.96, 1.00)<\/td><td>下の「自分の評価」を読むこと。<strong>低いほど透ける<\/strong><\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.05, 0.06, 0.12)<\/td><td>藍。透明の縁が暗い地で読める<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>花の外は柱なし<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_56.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA、220×220mm・3px/mm、97KB）。牡丹のような花 2 輪 （大 R=85mm、小 R=48mm）を、外の層から内の層へ花弁を重ね塗りする。 花弁 1 枚は軸に沿った雫形で、先に浅い切れ込み。色は根元 (106, 10, 30) → 先 (246, 211, 216) の勾配、花芯は (62, 4, 16) の円。背景は透明。 刷る面積 41.7%、花の明るさ（sRGB 値）最小 0.067 / 中央 0.596 / 最大 0.851。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>220×220 → <strong>193.4 × 179.5 × 3.94mm<\/strong><\/td><td>460×360 の内 ✓（花が紙面を埋めないぶん小さい）<\/td><\/tr><tr><td>柱<\/td><td>79×79 格子・<strong>2,533 本<\/strong><\/td><td>—<\/td><\/tr><tr><td>太さ（外皮の外径）<\/td><td>1.165 〜 2.176mm<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>芯の直径<\/td><td>太さ 1.0〜1.5 の 314 本: 芯/外 <strong>0.43<\/strong>、1.5〜2.0 の 2,164 本: <strong>0.52<\/strong>、2.0〜2.4 の 55 本: <strong>0.62<\/strong><\/td><td>最細の芯は 1.165 − 0.80 = <strong>0.37mm<\/strong>（0.6 を下回る。下の評価）<\/td><\/tr><tr><td>皮の厚み<\/td><td>片側 0.40mm（3 つの太さの区分すべて）<\/td><td>指定どおり<\/td><\/tr><tr><td>高さ / 芯の高さ<\/td><td>1.31 〜 3.94mm / 高さ − 0.40<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>縦横比<\/td><td>3.94 ÷ 2.18 = <strong>1.81<\/strong><\/td><td>棘ではない<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong>、最低 Z 0.0<\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><tr><td>頂点 / 面<\/td><td>653,514 / 648,448（色 324,224 ＋ クリア 324,224）<\/td><td>プレビュー解像度<\/td><\/tr><\/table>\n<p>芯の直径は、評価済みメッシュを辺の繋がりで塊に分け、クリア材の塊 （外皮）と色材の塊（芯）を xy の近さで対応させて測った。<strong>外皮と芯は 繋がっていない別の閉じた立体<\/strong>（柱 2,533 本 → 塊 5,066 個）。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>主張は寄りの絵（<code>preview_macro.jpg<\/code>）でだけ読める。<\/strong> 花芯の周りの 深紅の芯が氷の粒の中に見え、外へ行くほど桃色が薄く氷の縁が太くなる。 全景（<code>preview.jpg<\/code> / <code>preview_low.jpg<\/code>）では桃色の点の群に見えて、 「氷に包まれている」は読めない——皮 0.4mm は全景の画素より細い。 <strong>透明を主役にする作例は、寄りの絵が本体で、全景は位置の説明。<\/strong><\/li><li><strong>芯の下限を割っている柱がある。<\/strong> 花弁の先の淡桃（明るさ 0.85）の柱は 太さ 1.17mm で、芯は 1.17 − 0.8 = 0.37mm。外皮と芯がくっついているので 造形の 0.6mm はくっついた全体（1.17）に掛かる（本部の判断 v7.156.0）が、 <strong>0.37mm の色の芯が刷れるか、刷れても見えるかは分からない。<\/strong> 最小半径比率を 0.45 に上げれば芯は 0.6 を越えるが、太さの勾配が 弱まる。実物で決めることにして、この版は設計どおりの数で残す。<\/li><li><strong>透明の表示は、スライダーの向きが説明文と逆だった（測った）。<\/strong> ［クリア度合（※表示のみ）］を 0.6 → 0.88 と上げたら、外皮は<strong>より白く 不透明<\/strong>になった。中を調べると、材のミックスの重み 1.0 が不透明側を 選ぶ配線で、0 が完全な透明。3 度目に <strong>0.12<\/strong> で撮って初めて芯が 透けた。数字は <code>欲しい機能_20260904.md<\/code> の 31 に置いた。<strong>41・42・44 も同じ向きに振っていた<\/strong>（44 の「透明な粒」は 0.85 で撮っている—— 白い粒として写っているのはこのため）。<\/li><li><strong>氷には見えない。<\/strong> 透ける材は「うっすら白い膜」で、屈折も内部の 散乱も無い。氷らしさ（角で光が曲がる、内側が明るい）はプレビューでは 出ないので、この作例の「氷」は<strong>設計の言葉であって絵の言葉ではない<\/strong>。 刷った VeroClear は磨けば硝子に近く、磨かなければ曇り硝子。<\/li><li><strong>花が紙面を埋めていない。<\/strong> 実際の造形範囲 193×180mm に対し紙面 220×220。反物として裁つなら花を繰り返すか、地に細い氷の柱を疎に 撒くべきだった（リサーチ §3「どこで裁っても成立する」に反する）。 この作例は「氷の中で色が細る」という<strong>仕組みの証明<\/strong>として残す。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>冬のオートクチュールの胸元。<\/strong> 花芯を鎖骨の下に置き、花弁の先が肩へ 向かって氷になって消える。色付きの芯は肌に近い所ほど濃く、遠ざかるほど 氷だけになるので、<strong>服の縁が肌に溶けて見える<\/strong>——境界を作らない ネックライン。柱は最大 3.9mm・太さ 2.2mm・間隔 2.8mm なので、平らな 胸元なら生地はほとんど曲がらなくてよい。VeroClear と VeroColor を 1 本の柱で重ねるのは J850 系でしかできず、刺繍やビーズでは芯と皮を 別々に付けるしかないので、これは<strong>この機械の固有の柄<\/strong>。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_56.py     # source.png BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/56_氷の中の花_縁から氷になる ... --python docs/samples/tools/render_view.py -- docs/samples/56_氷の中の花_縁から氷になる --azim 300 --elev 22 --name preview_low ... --python docs/samples/tools/render_view.py -- docs/samples/56_氷の中の花_縁から氷になる --azim 240 --elev 40 --name preview_side ... --python docs/samples/tools/render_top.py -- docs/samples/56_氷の中の花_縁から氷になる ... --python docs/samples/tools/render_macro.py -- docs/samples/56_氷の中の花_縁から氷になる --at 0.43,0.54 --span 45 --elev 30<\/p>\n<p>最終生成はしていない（柱モードはプレビューと同じ Geometry Nodes）。 撮ったあと 5 枚を 1000〜1600px・JPEG 品質 80 に縮めてフォルダを 1MB の 内に収めた（700KB）。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/56_preview.jpg"},{"c":"真上","d":"img/56_preview_top.jpg"},{"c":"低い角度から","d":"img/56_preview_low.jpg"},{"c":"斜め横から（方位 240°・仰角 40°）","d":"img/56_preview_side.jpg"},{"c":"拡大","d":"img/56_preview_macro.jpg"}]},{"num":"57","title":"裏勝り — 曲げた所にだけ絵が出る","mode":"SURFACE","path":"docs/samples/57_裏勝り_曲げた所にだけ絵が出る","text":"<p class=\"lead\">**表は藍の無地の区画。区画の側面にだけ紅と金の絵を持ち、平らに置いた\n反物は真上からは藍の板にしか見えず、体に沿って曲がった所と低い角度から\n見た所にだけ、区画のすき間から絵が現れる**——江戸の裏勝り（表は地味、\n裏地に贅）を、面モードの区画の<strong>壁<\/strong>でやる（リサーチの引き出し #13\n「隠し色／表と裏」の 1 件目）。作例55 は左右で絵が入れ替わった。ここでは\n<strong>平らなときは絵が無く、曲げると絵が出る<\/strong>——動きが絵を出す反物。<\/p><p><strong>表は藍の無地の区画。区画の側面にだけ紅と金の絵を持ち、平らに置いた 反物は真上からは藍の板にしか見えず、体に沿って曲がった所と低い角度から 見た所にだけ、区画のすき間から絵が現れる<\/strong>——江戸の裏勝り（表は地味、 裏地に贅）を、面モードの区画の<strong>壁<\/strong>でやる（リサーチの引き出し #13 「隠し色／表と裏」の 1 件目）。作例55 は左右で絵が入れ替わった。ここでは <strong>平らなときは絵が無く、曲げると絵が出る<\/strong>——動きが絵を出す反物。<\/p>\n<h3>仕組み<\/h3>\n<p>面モード・フラット 3.0mm。8.0mm の区画をすき間 1.0mm の格子で並べ、 元絵のアルファで切る。色は［側面の色］＝上面と同じ（TEXTURE）のまま。 側面は<strong>輪郭の画素の色<\/strong>を引く（輪郭はアルファ 0.5 の等値線で、そこで 色を補間する）ので、<strong>各区画の縁 1 画素だけ<\/strong>に隠し色を塗っておけば、 上面は藍・壁は隠し色になる。すき間の外側（アルファ 0）にも同じ隠し色を 置いて、輪郭での補間が藍へ引かれないようにしてある。設定は 1 つも足して いない——絵の側の 1 画素の細工だけ。<\/p>\n<p>隠し絵の解像度は区画 1 個（9mm）。<strong>壁 1 枚は 1 色<\/strong>なので、33×26 の モザイクで読める大きさの絵しか載らない（金の月 R=68mm と霞 2 本）。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>壁に色を持てるのは面（柱の側面は 1 色）<\/td><\/tr><tr><td>高さの決め方 / 最大高さ<\/td><td>フラット / 3.0mm<\/td><td>壁の高さ＝隠し絵の帯の幅。低いと曲げても見えない、高いと真上からも見え始める<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>区画の縁を格子の階段でなく直線に<\/td><\/tr><tr><td>側面の色<\/td><td>上面と同じテクスチャ<\/td><td>これが仕組みそのもの。単色にすると絵は載らない<\/td><\/tr><tr><td>角の丸み / スムーズ<\/td><td>OFF / 0<\/td><td>上面と壁の境を鋭く。丸めると縁の色が上面へ回り込む<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>区画は元絵で済んでいる（作例51・53・55 と同じ）<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.035, 0.04, 0.10)<\/td><td>藍より一段暗い。すき間が影に沈んで、平らなときの「無地」が強まる<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>2 値のアルファ<\/td><\/tr><tr><td>解像度<\/td><td>プレビュー 512 / 最終 1024<\/td><td>最終で撮る（すき間 1.0mm はプレビューの格子 0.59mm で埋まりかける）<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_57.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA、300×240mm・<strong>12px/mm<\/strong>、52KB）と <code>ref_hidden.png<\/code> （壁に出るはずの絵、1px/mm、検算用）。<\/p>\n<ul><li><strong>区画<\/strong>: ピッチ 9.0mm（8.0 ＋ すき間 1.0）、33×26 ＝ 858 個。端の欠けた 区画は落とす。刷る面積 76.3%。<\/li><li><strong>上面の藍<\/strong> (30, 36, 84)。区画の内側、縁 1 画素を除いた所。<\/li><li><strong>隠し絵<\/strong>: 紅 (196, 38, 30) の地に、金 (218, 172, 74) の月（中心 (205, 150)・R=68mm）と、月の下を横切る金の霞 2 本。区画の縁 1 画素と、 すき間の外側の全部に塗ってある。<\/li><li><strong>12px/mm にした理由<\/strong>: 縁 1 画素は上面にも 1 画素ぶん見える。3px/mm では 0.33mm、6px/mm でも 0.17mm の紅の縁取りが真上から格子として 読めた。<strong>0.083mm<\/strong> は J850 の XY 分解能 0.042mm の 2 倍で、刷ると 髪の毛より細い。<\/li><\/ul>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>300×240 → <strong>296.1 × 233.1 × 3.00mm<\/strong><\/td><td>460×360 の内 ✓（端の欠けた区画を落としたぶん小さい）<\/td><\/tr><tr><td>要素<\/td><td>塊 <strong>858 個<\/strong>、区画 7.97〜8.20 × 7.97〜8.21mm（道具の報告「8×8mm」）<\/td><td>≤15 ✓<\/td><\/tr><tr><td>すき間<\/td><td>0.80〜1.03mm（ピッチ 9 − 区画）<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>高さ<\/td><td>3.00mm、底 z=0.000<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>縦横比<\/td><td>3.0 ÷ 8.0 = <strong>0.38<\/strong><\/td><td>板。棘ではない<\/td><\/tr><tr><td><strong>上面の色<\/strong><\/td><td>640,420 面のうち藍 <strong>98.1%<\/strong><\/td><td>残り 1.9% は縁の 1 画素に掛かる面<\/td><\/tr><tr><td><strong>壁の色<\/strong><\/td><td>93,764 面のうち隠し絵どおり <strong>96.1%<\/strong><\/td><td>藍の壁 1,034 面（1.1%）、絵と違う隠し色 2,657 面（2.8%、月と霞の境の区画）<\/td><\/tr><tr><td>壁の向き × 色<\/td><td>x 向き: 紅 33,668・金 12,703 / y 向き: 紅 33,080・金 13,279<\/td><td>4 方向とも絵が載っている<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>、最終メッシュ）<\/td><\/tr><tr><td>頂点 / 面<\/td><td>1,376,320 / 1,374,604（最終）<\/td><td>—<\/td><\/tr><\/table>\n<p>壁の色は、最終メッシュの各面の UV の平均で元絵を線形補間して引き、 面の中心の位置で <code>ref_hidden.png<\/code>（壁に出るはずの絵）と比べた。 上面（法線 z &gt; 0.85）と壁（|z| &lt; 0.5）は法線で分けた。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>主張どおりに写った。<\/strong> 真上（<code>preview_top.jpg<\/code>）は藍の格子、曲げた 状態（<code>preview_bent.jpg<\/code>、R=110mm の円筒に巻いた）では凸の側に金の月と 霞が紅の地の上に現れる。低い角度（<code>preview_low.jpg<\/code>、仰角 12°）では 絵が横の帯として読める。<strong>平ら＝無地、曲げる＝絵<\/strong> が 2 枚で読める。<\/li><li><strong>真上にも縁取りは残る。0.083mm の線として。<\/strong> 側面の色が上面と 連続した 1 枚のテクスチャから来る以上、縁の 1 画素は上面にも掛かる。 <code>preview_top.jpg<\/code>（0.28mm/px）ではこれが 1 画素に膨れて紅と金の格子に 見えるが、実寸の比で撮った <code>preview_top_macro.jpg<\/code>（0.03mm/px）では 8mm の区画に髪の毛ほどの金の線で、<strong>縁取りとして見れば美しい<\/strong>。 月の形は縁取りの色の違い（紅か金か）でかすかに読める——完全な 隠し絵ではなく、「よく見れば表にも兆しがある」裏勝り。<\/li><li><strong>曲げて見えるのは、曲げの向きを向いた壁だけ。<\/strong> Y 軸まわりに巻くと x 向きの壁が開き、y 向きの壁は閉じたまま。だから絵は横の帯（区画の 幅 8mm ごと）として出て、縦の分解能は 1 区画。月が横縞の月に見える のはそのため。両方の向きに曲がる所（肘・膝）では両方の壁が開く。<\/li><li><strong>寄り（<code>preview_macro.jpg<\/code>、仰角 18°）では上面が白く飛ぶ。<\/strong> 太陽が 低いので藍の上面がハイライトになり、紅と金の壁のほうが暗く写る。 仕組みは読めるが色は嘘なので、色は <code>preview_bent.jpg<\/code> を信じること。<\/li><li><strong>区画のすき間は隠し色で塗ってあるが、生地に隠れる。<\/strong> 底の生地 (0.035, 0.04, 0.10) が藍より暗いので、平らなときのすき間は影。 生地を紅にすれば平らでも紅の格子線が出る——それはそれで別の反物。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>曲がる所だけに絵が出るジャケット。<\/strong> 肘・肩・腰の曲面で紅と金の月が 現れ、平らな背中や前身頃は藍の無地。着る人が腕を曲げると絵が出て、 伸ばすと消える。区画 8mm・高さ 3mm なので、腕の周方向（R≈40mm）でも すき間は 1.0 → 1.6mm ほど開くだけで区画どうしは当たらない。裏勝りの 本歌は「脱いだときに贅が見える」だが、これは<strong>動いたときに贅が見える<\/strong>。 ショーの花道では、歩くたびに袖と裾で月が点いたり消えたりする。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_57.py     # source.png / ref_hidden.png BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/57_裏勝り_曲げた所にだけ絵が出る --final ... --python docs/samples/tools/render_view.py -- docs/samples/57_裏勝り_曲げた所にだけ絵が出る --azim 270 --elev 12 --name preview_low --final ... --python docs/samples/tools/render_top.py -- docs/samples/57_裏勝り_曲げた所にだけ絵が出る ... --python docs/samples/tools/render_macro.py -- docs/samples/57_裏勝り_曲げた所にだけ絵が出る --at 0.62,0.55 --span 60 --elev 18 ... --python docs/samples/tools/render_macro.py -- docs/samples/57_裏勝り_曲げた所にだけ絵が出る --at 0.62,0.55 --span 40 --elev 89 --name preview_top_macro<\/p>\n<p><code>preview_bent.jpg<\/code> は道具ではなく自分の検算スクリプトで撮った——最終 メッシュと生地を評価済みの状態で複製し、頂点を Y 軸に平行な軸の円筒 （R=110mm）に巻いてから <code>render_view.render_view(..., 300, 32, ...)<\/code> で 撮り、複製を消す（アドオンは触らない）。巻く式は <code>θ=(x−cx)/R, r=R+z, x'=cx+r·sinθ, z'=r·cosθ−R<\/code>。撮ったあと 6 枚を 900〜1100px・JPEG 品質 78 に縮めてフォルダを 1MB の内に収めた。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/57_preview.jpg"},{"c":"真上","d":"img/57_preview_top.jpg"},{"c":"低い角度から","d":"img/57_preview_low.jpg"},{"c":"拡大","d":"img/57_preview_macro.jpg"},{"c":"真上・拡大（実寸の比）","d":"img/57_preview_top_macro.jpg"},{"c":"曲げた状態（自分の道具で円筒 R=110mm に巻いた）","d":"img/57_preview_bent.jpg"}]},{"num":"58","title":"触って読む反物 — 点字の詩","mode":"BRISTLE","path":"docs/samples/58_触って読む反物_点字の詩","text":"<p class=\"lead\">**反物ぜんたいが 1 編の詩。目には生地と同じ色の細かい点の織りにしか\n見えず、指には点字として読める**——見る人には無地、触る人には文\n（リサーチの引き出し #13「隠し色／表と裏」の 2 件目。作例57 は絵を\n区画の壁に隠した。ここでは文を触覚に隠す）。点字を<strong>服のラベル<\/strong>として\n付けるのではなく、<strong>布そのものを 1 ページの紙面<\/strong>にする。点は色を\n変えない——色で読ませるなら点字は要らない。<\/p><p><strong>反物ぜんたいが 1 編の詩。目には生地と同じ色の細かい点の織りにしか 見えず、指には点字として読める<\/strong>——見る人には無地、触る人には文 （リサーチの引き出し #13「隠し色／表と裏」の 2 件目。作例57 は絵を 区画の壁に隠した。ここでは文を触覚に隠す）。点字を<strong>服のラベル<\/strong>として 付けるのではなく、<strong>布そのものを 1 ページの紙面<\/strong>にする。点は色を 変えない——色で読ませるなら点字は要らない。<\/p>\n<p>先例は 3 つ見つけた（WebSearch）。Kat Paylor-Bent の *Feel Seen 25* （2025 年ロンドン・ファッションウィーク、点字をスワロフスキーの クリスタルで縫った）、Aille Design（点字のビーズ刺繍の既製服）、 LCF 2024 の *Beyond Braille*。どれも点字は<strong>装飾として見せる<\/strong>もので、 石やビーズなので寸法は手縫いの精度。ここでの違いは 2 つ——<strong>生地と 同じ色で、目には見せない<\/strong>こと、<strong>点の直径・高さ・間隔が規格の数値 どおりに出る<\/strong>こと（刷るから）。<\/p>\n<h3>仕組み<\/h3>\n<p>柱モード・ドーム・<strong>格子のピッチを点字の点間 2.3mm にする<\/strong>。点字の マス（2 列 × 3 段）を横 3 格子・縦 5 格子に置くと、点間 2.3・マス間 6.9・行間 11.5mm。点は直径 1.5mm・高さ 0.6mm のドーム。<\/p>\n<table><tr><th><\/th><th>この反物<\/th><th>ADA の目安<\/th><\/tr><tr><td>点の土台の直径<\/td><td>1.5mm<\/td><td>1.5〜1.6<\/td><\/tr><tr><td>点の高さ<\/td><td>0.6mm<\/td><td>0.6〜0.9<\/td><\/tr><tr><td>点間（マスの中）<\/td><td>2.3mm<\/td><td>2.3〜2.5<\/td><\/tr><tr><td>マス間<\/td><td>6.9mm<\/td><td>6.1〜7.6<\/td><\/tr><tr><td>行間<\/td><td><strong>11.5mm<\/strong><\/td><td>10.0〜10.2<\/td><\/tr><\/table>\n<p>柱は格子の交点にしか立たないので、点字の寸法を格子の倍数に丸めた。 行間だけ目安より 1.3mm 広い——マスの高さ 5 格子（= 4.6mm の点 3 段 ＋ 2 格子の空き）の丸めで、4 格子にすると行が接して読めない。<\/p>\n<p><strong>元絵は点の位置にアルファ 1 の円を置いただけ<\/strong>（半径 0.9mm ＞ 柱の 半径 0.75）。文は英語のグレード 1 点字（a〜z・コンマ・ピリオド）で、 33 マス × 15 行に 15 行の詩（<code>poem.txt<\/code>、自作）。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード / 断面<\/td><td>柱 / ドーム（16 角）<\/td><td>点字の点は半球。指に引っ掛からない<\/td><\/tr><tr><td>半径 / 最大高さ<\/td><td>0.75mm / 0.6mm、高さを揃える<\/td><td>規格の下限。高いと指が引っ掛かり、服では刺さる<\/td><\/tr><tr><td>列数 / 行数<\/td><td><strong>101 × 76、settings.json の <code>meta.pin_grid<\/code> で固定<\/strong><\/td><td>ピッチ 2.3mm がそのまま点間。画像から決め直された列数では点が格子からずれて読めない<\/td><\/tr><tr><td>配置<\/td><td><strong>格子（SQUARE）<\/strong><\/td><td>52 から引き継いだレンガ配置（BRICK）では奇数行が半ピッチずれ、<strong>奇数行の点が全部消えた<\/strong>（893 → 435 本）。下の「自分の評価」<\/td><\/tr><tr><td>間隔保持<\/td><td>OFF<\/td><td>ON だと列数を画像から決め直す<\/td><\/tr><tr><td>明暗による半径 / 高さ<\/td><td>OFF / 揃える<\/td><td>点はすべて同じ大きさでなければ読めない<\/td><\/tr><tr><td>間引き / 輪郭に合わせる<\/td><td>OFF<\/td><td>点を 1 つも落とさない<\/td><\/tr><tr><td>色<\/td><td>画像の色 (236, 228, 212)<\/td><td>生地 (0.75, 0.68, 0.55) と同系。生地より一段だけ明るい<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色<\/td><td>生成りの麻の反物<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>2 値のアルファ<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_58.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA、2300×1725px ＝ 230×172.5mm・10px/mm、36KB）。 点 893 個、刷る面積 5.6%。<code>poem.txt<\/code> は同じ道具が書く。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>230×172.5 → <strong>210.8 × 167.1 × 0.60mm<\/strong><\/td><td>460×360 の内 ✓（点の外接。右端と下の余白ぶん小さい）<\/td><\/tr><tr><td>柱<\/td><td><strong>893 本<\/strong>（元絵の点と同数）、直径 1.500・高さ 0.600mm<\/td><td>≥0.6 / 0.4〜15 ✓<\/td><\/tr><tr><td>すき間（マスの中）<\/td><td>2.3 − 1.5 = <strong>0.80mm<\/strong><\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>縦横比<\/td><td>0.6 ÷ 1.5 = <strong>0.40<\/strong><\/td><td>半球。棘ではない<\/td><\/tr><tr><td>格子との残差<\/td><td>x 0.000 / y 0.000mm<\/td><td>点は格子の交点そのもの<\/td><\/tr><tr><td><strong>復号<\/strong><\/td><td>生成物の柱の位置から点字を読み戻して <strong>15/15 行が原文と一致<\/strong><\/td><td>触って読める<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面<\/strong><\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><tr><td>頂点 / 面<\/td><td>58,045 / 57,152<\/td><td>柱モードはプレビューが最終と同じ形<\/td><\/tr><\/table>\n<p>復号は、柱の塊の中心をピッチ 2.3mm の格子に丸めて (列, 行) にし、 3×5 格子のマスごとに 6 点の有無を集めて点字の表を逆引きした。 画像の上が +y に来るので行は反転して読む。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>主張どおり。<\/strong> 真上（<code>preview_top.jpg<\/code>）は無地に近く、目を凝らすと 点の並びが薄く見える程度。寄り（<code>preview_macro.jpg<\/code>、仰角 30°）では 半球の点字がはっきり読め、マスの 2 列 × 3 段が規格の姿で並ぶ。 低い角度（<code>preview_low.jpg<\/code>）では光で点が少し白く浮く——生地より 一段明るい色にしたぶん。<strong>完全に同色にすれば見えなくなる<\/strong>が、 ショーの照明では影で見えるので、ここは「目を凝らせば見える」に置いた。<\/li><li><strong>レンガ配置の罠を踏んだ。<\/strong> 52 の設定を元にしたので <code>grid_pattern<\/code> が BRICK のまま残り、最初の生成は 435 本しか立たず復号 0/15。奇数行が 半ピッチずれて点の外を読んでいた。<strong>柱の位置そのものが設計の作例では、 配置・列数・間隔保持・間引きの 4 つを全部見ること<\/strong>（52 の設定から 作るときの控え）。<\/li><li><strong>列数を設定ファイルから通す手段が道具に無かった。<\/strong> アドオンは画像を 読み込むたびに列数・行数を画像から決め直す（間隔保持が OFF でも）ので、 settings.json の 101×76 は 218×163 に化けた。作例の道具 （<code>make_sample.py<\/code>）に <code>meta.pin_grid<\/code> を足して書き戻すようにした。 アドオン側の話は「欲しい機能 35」へ。<\/li><li><strong>行間が広い。<\/strong> 11.5mm は点字の規格（10.0〜10.2）より広く、慣れた 読み手には「行が離れている」と感じられるはず。格子の倍数で作る以上 の制約で、ピッチを 2.0mm にすれば行間 10.0 になるが点間 2.0 が規格を 切る。<strong>点間を優先した。<\/strong><\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>触って読むシャツ。<\/strong> 袖口・前立て・裾の内側——着る人の指が自然に 触れる所に、その人へ宛てた一文を刷る。他人には無地の生成りの麻。 ギフトとして、詩でも名前でも日付でもいい。反物ぜんたいが紙面なので、 裁断のどこにどの行が来るかは型紙の置き方で決められる。点は 0.6mm の半球で、肌に当たっても痛くない（規格そのものが指のためにある）。 展示なら、壁に掛けた反物の前に「触ってください」の一行だけ。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_58.py     # source.png / poem.txt BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/58_触って読む反物_点字の詩 ... --python docs/samples/tools/render_top.py -- docs/samples/58_触って読む反物_点字の詩 ... --python docs/samples/tools/render_view.py -- docs/samples/58_触って読む反物_点字の詩 --azim 300 --elev 25 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/58_触って読む反物_点字の詩 --at 0.12,0.85 --span 45 --elev 30<\/p>\n<p><code>settings.json<\/code> の <code>meta.pin_grid: true<\/code> が要る——無いと列数が画像から 決め直され、点が格子から外れる。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/58_preview.jpg"},{"c":"真上","d":"img/58_preview_top.jpg"},{"c":"低い角度から","d":"img/58_preview_low.jpg"},{"c":"拡大","d":"img/58_preview_macro.jpg"}]},{"num":"59","title":"水紋のモアレ — 2 枚の間にある柄","mode":"SURFACE","path":"docs/samples/59_水紋のモアレ_2枚の間にある柄","text":"<p class=\"lead\">**同じ反物を 2 枚、透ける生地に刷って重ねる。1 枚は静かな水紋、2 枚\n重なると、ずれと回転で柄が「うなる」（モアレ）。着て動くたびに、どこにも\n刷っていない縞が生地の上を流れる<strong>——柄が反物の上ではなく <\/strong>2 枚の間**に\nある（リサーチの引き出し #14 の 1 件目）。作例55 は左右で絵が入れ替わり、\n57 は曲げると絵が出た。ここでは<strong>重なりの相対的な動き<\/strong>が柄を作る。<\/p><p><strong>同じ反物を 2 枚、透ける生地に刷って重ねる。1 枚は静かな水紋、2 枚 重なると、ずれと回転で柄が「うなる」（モアレ）。着て動くたびに、どこにも 刷っていない縞が生地の上を流れる<\/strong>——柄が反物の上ではなく <strong>2 枚の間<\/strong>に ある（リサーチの引き出し #14 の 1 件目）。作例55 は左右で絵が入れ替わり、 57 は曲げると絵が出た。ここでは<strong>重なりの相対的な動き<\/strong>が柄を作る。<\/p>\n<p>モアレは印刷では避けるもの（網点の干渉）だが、ファッションでは Issey Miyake の *Pleats Please* の重ねや、オーガンジーの二重使いで<strong>わざと<\/strong> 出す。3D プリントなら線の幅・間隔を 0.1mm 単位で決められるので、うなりの 周期を設計できる——<strong>ずれ 6mm・回転 1.5° で、幅 10mm ほどの帯が反物を 走る<\/strong>（下の数字）。<\/p>\n<h3>仕組み<\/h3>\n<p>面モード・フラット 1.2mm。同心円の破線を 9 つの中心から広げ、画素ごとに <strong>いちばん近い中心<\/strong>の円に属させる（ボロノイ）。区画の境で 2 つの同心円が ぶつかる所は、線どうしが 0.6mm 未満に近づかないよう<strong>境の両側 0.8mm を 刷らない<\/strong>。破線は 12.5mm＋切れ目 1.0mm——「一つの要素は最大 15mm」の ため（14mm では弦の対角が 15.18mm になった）。切れ目の位相はリングごとに ずらしてある（揃えると切れ目が放射状の筋に並ぶ）。<\/p>\n<p><strong>2 枚目は同じ反物<\/strong>。別のデータを作る必要は無い。刷るのは 1 種類で、 重ねるときに 6mm ずらして 1.5° 回す——実際には着る人の動きがそれをやる。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>線幅 1.2mm の曲線を線のまま出せるのは面<\/td><\/tr><tr><td>高さの決め方 / 最大高さ<\/td><td>フラット / <strong>1.2mm<\/strong><\/td><td>透ける生地に載せる線なので薄く。厚いと 2 枚目が乗ったとき影が柄より強くなる<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>線の縁を格子の階段でなく曲線に<\/td><\/tr><tr><td>角の丸み / 先細り<\/td><td>OFF / 1.0<\/td><td>線幅を 1.2 のまま保つ<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>破線が既に要素を 13mm 以下に切っている<\/td><\/tr><tr><td>側面の色<\/td><td>上面と同じ<\/td><td>藍一色<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.86, 0.80, 0.66)<\/td><td>生成りのオーガンジーのつもり。<strong>絵では透けない<\/strong>（下の「自分の評価」）<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>2 値のアルファ<\/td><\/tr><tr><td>解像度<\/td><td>プレビュー 512 / 最終 1024<\/td><td>最終で撮る（線の間 1.4mm はプレビューの格子 0.47mm で 3 マスしかない）<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_59.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA、240×180mm・8px/mm、152KB）。中心 9 個（70mm 格子を ±0.35 格子でゆらす）、リングのピッチ 2.6mm（線 1.2 ＋ 間 1.4）、中心に R=4mm の穴。刷る面積 39.0%。<\/p>\n<p>道具側で 2 つ後処理する。<strong>半径 0.375mm の円で開く<\/strong>（切れ目や境の帯が 線を斜めに切ると 0.3mm 幅の尖りが残り、アドオンの格子（最終 0.23mm）が それを 1 マスの島に拾った——4 個出た）。それから<strong>短辺 1.0mm 未満の 破片を落とす<\/strong>（7 個）。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>240×180 → <strong>240.0 × 180.0 × 1.20mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>要素<\/td><td>塊 <strong>1,380 個<\/strong>、対角 最大 13.37mm（95% 13.04）、最小 1.29<\/td><td>≤15 ✓（道具の報告「13×2mm」）<\/td><\/tr><tr><td>要素の短辺<\/td><td>最小 <strong>0.83mm<\/strong>（線幅 1.2 の設計、吸着で縁が丸まった所）<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>線の間<\/td><td>1.4mm（区画の境では ≥1.6）<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>高さ<\/td><td>1.20mm、底 z=0.000<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>縦横比<\/td><td>1.2 ÷ 1.2 = <strong>1.0<\/strong><\/td><td>低い線。棘ではない<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>、最終メッシュ）<\/td><\/tr><tr><td>頂点 / 面<\/td><td>785,368 / 782,608（最終）<\/td><td>—<\/td><\/tr><tr><td><strong>モアレの量<\/strong><\/td><td>真上の絵を約 10mm の升に切った明るさの散らばり（÷平均）: 1 枚 <strong>0.042<\/strong> → 2 枚 <strong>0.100<\/strong>（2.4 倍）<\/td><td>うなりが出ている<\/td><\/tr><\/table>\n<p>モアレの量は <code>preview_top.jpg<\/code> と <code>preview_pair_top.jpg<\/code>（同じカメラ）を 24×18 の升に切り、升の平均明るさの標準偏差を平均で割った。1 枚では どの升も同じ密度なので散らばりが小さく、2 枚ではうなりの明暗が升の 大きさで出る。<strong>2 枚目の影も同じ量に入っている<\/strong>（下）。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>うなりは出た。<\/strong> <code>preview_pair_top.jpg<\/code> に、扇形の明暗の帯が各中心 から広がり、区画の境で向きを変えて走る。1 枚（<code>preview_top.jpg<\/code>）は ただの同心円で、<strong>柄は 2 枚の間にしか無い<\/strong>——主張どおり。<\/li><li><strong>ただし絵の 2 枚目は影を落としている。<\/strong> 上の層を 4mm 上に置き、 透ける生地は描いていない（描くと 1 枚目が見えない）。太陽光なので 線が 1 枚目の上に影を落とし、暗い帯の一部は影。実物では上の生地が 光を散らすので影はもっと柔らかく、うなりは<strong>明暗ではなく密度の差<\/strong> として見えるはず。0.100 という数はその分だけ実物より大きい。<\/li><li><strong>ずれ 6mm・回転 1.5° は一例。<\/strong> 回転を 0 にすると帯は平行で幅が 無限大に近づき（ずれだけでは同心円のうなりは中心の周りにしか出ない）、 5° にすると帯が細かくなって縞ではなく粒に見える。動く服なら この範囲を勝手に通過する。<\/li><li><strong>区画の境の帯（刷らない 1.6mm）が、1 枚でも読める。<\/strong> <code>preview_top.jpg<\/code> で 9 つの区画がセルとして見える。これは水紋どうしがぶつかる「波の 境目」として意味が通るので残した。無くすには境で線を繋ぐ設計が要り、 それは別の反物。<\/li><li><strong>透ける生地は描けていない。<\/strong> 生地の色は生成りの不透明な板。 「透けて重なる」は言葉と <code>preview_pair_top.jpg<\/code> の 2 枚重ねの絵で 補っている。透ける生地の見え方は「欲しい機能 32」（透明の材）と同じ 種類の宿題。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>二重のオーガンジーのスカート、または袖。<\/strong> 外側と内側に同じ水紋を 刷り、歩くと内外がずれて水面のうなりが脚の周りを流れる。止まると 静かな同心円に戻る。線 1.2mm・高さ 1.2mm は指で触れば感じる程度で、 透ける生地の落ち感を殺さない。展示なら、2 枚を 3cm 離して吊るし、 風で片方だけ揺れる——見る人の位置でもうなりが変わる（視差）。<\/p>\n<p><strong>注意<\/strong>: 重ねた 2 枚の柱が擦れる。線は低いフラットなので引っ掛かりは 無いが、内側の面の線が外側の生地の裏に当たる。透ける生地の片面に 刷って、刷った面どうしを外に向ければ当たらない。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_59.py     # source.png（scipy が要る） BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/59_水紋のモアレ_2枚の間にある柄 --final ... --python docs/samples/tools/render_top.py -- docs/samples/59_水紋のモアレ_2枚の間にある柄 ... --python docs/samples/tools/render_macro.py -- docs/samples/59_水紋のモアレ_2枚の間にある柄 --at 0.5,0.5 --span 60 --elev 30<\/p>\n<p><code>preview_pair_top.jpg<\/code> と <code>preview_pair_low.jpg<\/code>（方位 300°・仰角 22°）は 自分の検算スクリプトで撮った——最終メッシュを評価済みの状態で複製し、 紙面の中心まわりに 1.5° 回してから (+6, +3, +4)mm 動かし、生地は付けずに 1 枚目と一緒に <code>render_top<\/code> / <code>render_view<\/code> へ渡し、撮ったあと複製を消す （アドオンは触らない）。撮ったあと 5 枚を 1000〜1100px・JPEG 品質 78 に 縮めてフォルダを 1MB の内（942KB）に収めた。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/59_preview.jpg"},{"c":"真上","d":"img/59_preview_top.jpg"},{"c":"拡大","d":"img/59_preview_macro.jpg"},{"c":"2 枚重ね・真上（自分の道具で同じ反物を 6mm ずらし 1.5° 回して重ねた。外側の生地は透けるものとして描かない）","d":"img/59_preview_pair_top.jpg"},{"c":"2 枚重ね・低い角度","d":"img/59_preview_pair_low.jpg"}]},{"num":"60","title":"声の反物 — ことばのスペクトログラム","mode":"BRISTLE","path":"docs/samples/60_声の反物_ことばのスペクトログラム","text":"<p class=\"lead\">**ひとこと（「風が吹いて、布が歌う。」）を声にして、その声のスペクトログラム\n——横＝時間、縦＝音の高さ、明るさ＝強さ——を柱の高さで刷る。声を、着られる\n形にする**（リサーチの引き出し #15「声／音を形にする」の 1 件目）。柄は\nどこにも無く、声の中にだけある。誓いの言葉、名前、詩の一行、子どもの\n初めての言葉——同じ道具に wav を差し替えるだけで、その人の声の反物になる。<\/p><p><strong>ひとこと（「風が吹いて、布が歌う。」）を声にして、その声のスペクトログラム ——横＝時間、縦＝音の高さ、明るさ＝強さ——を柱の高さで刷る。声を、着られる 形にする<\/strong>（リサーチの引き出し #15「声／音を形にする」の 1 件目）。柄は どこにも無く、声の中にだけある。誓いの言葉、名前、詩の一行、子どもの 初めての言葉——同じ道具に wav を差し替えるだけで、その人の声の反物になる。<\/p>\n<p>言葉は読めない。読めるのは「声だ」ということ——母音の倍音が横縞の畝に なり、子音が縦のざらつきになり、「、」の間が反物の真ん中の空白になる。 点字（58）は触ると文が読めたが、ここでは<strong>音そのものの形<\/strong>を着る。<\/p>\n<h3>仕組み<\/h3>\n<p>柱モード・円柱（16 角）・格子のピッチ 2.0mm、列 150 × 行 100（298×198mm）。 画像の 1 升＝柱 1 本（<code>meta.pin_grid<\/code>、58 と同じ）。横は 2.31 秒を 150 列に、 縦は 80〜4000Hz を対数で 100 段（下が低い音）。強さ（dB、−50〜−4）を柱の 高さ 0.6〜4.0mm に、弱い所はアルファ 0 で柱を立てない。半径は 0.6mm 固定。<\/p>\n<p><strong>明るさの符号化は測って決めた<\/strong>（下の「自分の評価」）。柱モードは画像を リニアで読み、既定は「暗いほど高い」。だから［明度反転］を ON にして 高さ = 4 × リニア輝度 とし、道具は<strong>狙う高さから逆算した値を sRGB に 符号化<\/strong>して無彩色で書く。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード / 断面<\/td><td>柱 / 円柱（16 角）<\/td><td>高さの違いを 1 本ずつ見せる。断面は主役でない<\/td><\/tr><tr><td>半径 / 最大高さ<\/td><td>0.6mm / 4.0mm<\/td><td>ピッチ 2.0 で すき間 0.8。高さ 4 で縦横比 3.3 に収める<\/td><\/tr><tr><td>高さを揃える<\/td><td><strong>OFF<\/strong><\/td><td>高さが声の強さ<\/td><\/tr><tr><td><strong>明度反転<\/strong><\/td><td><strong>ON<\/strong><\/td><td>既定は暗いほど高い。強い音＝明るい＝高い にする<\/td><\/tr><tr><td>最小高さカットオフ<\/td><td>0.0（元絵の側で 0.6mm を下限に）<\/td><td>造形の下限 0.4 に 0.2 の余裕<\/td><\/tr><tr><td>列数 / 行数<\/td><td><strong>150 × 100、<code>meta.pin_grid<\/code><\/strong><\/td><td>1 升＝柱 1 本<\/td><\/tr><tr><td>配置 / 間隔保持<\/td><td>格子 / OFF<\/td><td>58 と同じ理由（レンガは奇数行がずれる）<\/td><\/tr><tr><td>明暗による半径 / 間引き / 輪郭に合わせる<\/td><td>OFF<\/td><td>柱を 1 本も落とさない<\/td><\/tr><tr><td>色<\/td><td>画像の色（無彩色、高さと同じ値）<\/td><td>高い柱ほど白い。輝度の重みに依らず高さと一致<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.30, 0.10, 0.16)<\/td><td>ワインの絹。白い声が浮く<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>2 値のアルファ<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_60.py<\/code>）<\/h3>\n<p><code>voice.wav<\/code>（141KB）は Windows の音声合成（Microsoft Haruka、SAPI）で作った。 <code>source.png<\/code>（RGBA、1500×1000px、31KB）は wav を STFT（窓 2048・ハン窓）で 150 フレームに切り、100 の対数バンドに畳んで dB にしたもの。升は<strong>柱の 位置を中心に<\/strong>置く（下）。柱が立つ升 6,243（41.6%）。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>298×198 → <strong>293.2 × 193.2 × 3.96mm<\/strong><\/td><td>460×360 の内 ✓（両端の無音ぶん小さい）<\/td><\/tr><tr><td>柱<\/td><td><strong>6,243 本<\/strong>（元絵の升と同数）、直径 1.20mm<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>すき間<\/td><td>2.0 − 1.2 = <strong>0.80mm<\/strong><\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>高さ<\/td><td><strong>最小 0.60 / 中央 1.74 / 最大 3.96mm<\/strong>、底 z=0.000<\/td><td>0.4〜15 ✓（0.4 未満 0 本）<\/td><\/tr><tr><td>縦横比<\/td><td>3.96 ÷ 1.2 = <strong>3.3<\/strong><\/td><td>&lt;4。棘ではない<\/td><\/tr><tr><td><strong>高さ ＝ 4 × リニア輝度<\/strong><\/td><td>6,243 本すべてで差 <strong>0.000mm<\/strong>（相関 1.000）<\/td><td>狙いどおり<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>）<\/td><\/tr><\/table>\n<p>高さの検算は、生成物の <code>bf_pillar_height<\/code>（柱ごとに焼かれた高さ）を オブジェクト原点から格子に丸めて升に戻し、元絵の同じ升の画素を sRGB→ リニアにして 4 倍した値と突き合わせた。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>声の形になった。<\/strong> 寄り（<code>preview_macro.jpg<\/code>）では母音の倍音が横縞の 畝として並び、高い所は白く、弱い所は低く暗い——「波の畝がいくつも走る」 という、この道具の柱の並びと相性のいい絵。低い角度（<code>preview_low.jpg<\/code>） では 2 つの言葉の塊が丘になり、「、」の間が谷。真上（<code>preview_top.jpg<\/code>） では 2 つの塊が灰色の点描になり、倍音の白い横縞と、上へ伸びる細かい 縦のざらつき（子音）が読める——真上では高さの差は明るさの差でしか 出ないので、寄りと低い角度のほうがこの作例の顔。<\/li><li><strong>最初の生成は逆さまだった。<\/strong> 強い音ほど低い柱になっていた（元絵の 明るさと高さの相関 −0.74）。柱モードの既定が「暗いほど高い」で、しかも 明るさが sRGB ではなくリニアで読まれる（0.41 は 0.14）ことの 2 段。 ［明度反転］を ON にして、狙う高さから逆算した値を sRGB に符号化したら 6,243 本すべてで高さが式どおりになった。<strong>「明るさ→高さ」を設計する 作例は、この 2 段を通して符号化しないと狙いどおりにならない。<\/strong><\/li><li><strong>1 升＝柱 1 本の絵は、升を柱の位置を中心に置く。<\/strong> 150 列の柱は幅の c/149 に立つが、10px ずつ膨らませた絵の升の境目は c/150。右へ行くほど 柱が境目に寄り、線形補間が隣の升と混ぜる——最初は 44 本が消え、高さが 最大 2.6mm ずれた。升を切り直すと 6,243 本ぴったり。アドオン側の話は 「欲しい機能 36」へ。<\/li><li><strong>言葉は読めない。<\/strong> スペクトログラムから文字を読むのは専門家でも難しい。 これは「読ませる」作例ではなく、「その人の声の形」を着る作例——名前や 誓いは、刷った本人が知っていればいい（58 の点字と同じ「見えない ラベル」だが、こちらは触っても読めず、ただ形がある）。<\/li><li><strong>合成音声なので、倍音がきれいすぎる。<\/strong> 本物の声は息や揺らぎでもっと ざらつく。それは絵としては良い方向。<\/li><li><strong>色が無彩色で、生地だけが色を持つ。<\/strong> 白い声がワインの上に浮く配色は 意図どおりだが、色でも何かを言えたはず（例: 音の高さで色相を変える）。 今回は高さの検算を優先して無彩色にした。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>声のストール、または背中一面。<\/strong> 298×198mm は肩から背へ掛かる大きさで、 横軸（時間）を肩線に沿って流す。着る本人の「ひとこと」を録って刷る ——名前でも、誓いでも、亡くなった人の残した声でもいい。展示なら、反物の 横に再生ボタン。声が流れ、聞く人は布の上のどこがいま鳴っているかを目で 追える（2.31 秒を 293mm に伸ばしてあるので、1 秒 ≒ 127mm）。柱は 0.6〜 4.0mm で棘ではないが、高い所（4mm・白）は肌には当てない側に。<\/p>\n<h3>作り方<\/h3>\n<p>powershell -NoProfile -Command \"Add-Type -AssemblyName System.Speech; $s = New-Object System.Speech.Synthesis.SpeechSynthesizer; $s.SelectVoice('Microsoft Haruka Desktop'); $s.Rate = -1; $s.SetOutputToWaveFile('docs/samples/60_声の反物_ことばのスペクトログラム/voice.wav'); $s.Speak('風が吹いて、布が歌う。'); $s.Dispose()\" python docs/samples/tools/make_art_60.py     # voice.wav → source.png BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/60_声の反物_ことばのスペクトログラム ... --python docs/samples/tools/render_top.py -- docs/samples/60_声の反物_ことばのスペクトログラム ... --python docs/samples/tools/render_view.py -- docs/samples/60_声の反物_ことばのスペクトログラム --azim 300 --elev 22 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/60_声の反物_ことばのスペクトログラム --at 0.18,0.35 --span 70 --elev 28<\/p>\n<p><code>settings.json<\/code> の <code>meta.pin_grid: true<\/code> と <code>invert_brightness: true<\/code> が要る。 自分の声で作るなら 1 行目を録音した wav に差し替えるだけ（16bit・モノ かステレオ）。撮ったあと 4 枚を 1000〜1100px・JPEG 品質 78 に縮めて フォルダは 530KB。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/60_preview.jpg"},{"c":"真上","d":"img/60_preview_top.jpg"},{"c":"低い角度から","d":"img/60_preview_low.jpg"},{"c":"拡大","d":"img/60_preview_macro.jpg"}]},{"num":"61","title":"伸びる反物 — 回る正方形","mode":"SURFACE","path":"docs/samples/61_伸びる反物_回る正方形","text":"<p class=\"lead\">**硬い正方形の板を、角どうしが触れそうな所まで詰めて、伸びる生地に刷る。\n引っ張ると板が交互に回って角の間に菱形の穴が開き、下の生地の色が覗く。\nしかも引いた向きと直角の向きにも広がる**（オーセチック＝負のポアソン比。\nリサーチの引き出し #16 の 1 件目）。柄は板ではなく、**板と板の間に開く\n穴<strong>にある。作例59 は柄が 2 枚の間にあった。ここでは柄が<\/strong>伸びの中**にある。<\/p><p><strong>硬い正方形の板を、角どうしが触れそうな所まで詰めて、伸びる生地に刷る。 引っ張ると板が交互に回って角の間に菱形の穴が開き、下の生地の色が覗く。 しかも引いた向きと直角の向きにも広がる<\/strong>（オーセチック＝負のポアソン比。 リサーチの引き出し #16 の 1 件目）。柄は板ではなく、<strong>板と板の間に開く 穴<\/strong>にある。作例59 は柄が 2 枚の間にあった。ここでは柄が<strong>伸びの中<\/strong>にある。<\/p>\n<p>先例は機構の研究として 2 つ——Chang ら（2022）の回る正方形の積層布と、 ジャージーに ABS の正方形を 7×7 で刷ってポアソン比 −0.9 を出した *3D printed auxetic forms on knitted fabrics*。どちらも「伸びるか」を 測っていて、板の並びを絵として設計してはいない。この反物は<strong>板の回転角 そのものを勾配にして、閉じた端から開いた端への変化を 1 枚に凍らせる<\/strong> ——腰で閉じ、裾で開く。<\/p>\n<h3>仕組み<\/h3>\n<p>面モード・フラット 1.5mm。1 辺 a=10mm の格子の 正方形を角で蝶番にして交互に ±θ 回すと、格子の間隔は L(θ) = a(cos θ + sin θ)——θ=0 で 10mm（隙間なし）、45° で 14.1mm。 x（腰→裾）に沿って θ を 0° → 35° に増やす。<strong>間隔 L は縦にも同じだけ 効くので、行は裾へ向かって扇形に開く<\/strong>——片方の端だけ引き伸ばした布に 実際に起きることで、フレアのスカートの姿そのもの。<\/p>\n<p>板は角で触れさせない（蝶番は生地が担う）。格子 10mm に 9.2mm の板を置き （片側 0.4mm 内側）、閉じた端でも辺の間 0.8mm・角の間 1.13mm。角は 0.6mm 丸める。+θ の板を濃いスレート、−θ の板を一段明るいスレートにして、回る 向きが市松で読めるようにした。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>面<\/td><td>板の形をそのまま出す。直線の縁は面<\/td><\/tr><tr><td>高さの決め方 / 最大高さ<\/td><td>フラット / <strong>1.5mm<\/strong><\/td><td>硬い板として指に分かる厚み。厚いと蝶番の生地に段差が出る<\/td><\/tr><tr><td>角の丸み<\/td><td><strong>切<\/strong>（0.4mm・2 段・上面の縁と記録）<\/td><td><strong>効いていない。<\/strong>スイッチが切なので面取りは走っておらず、上面の縁は角のまま（2026-09-06 に訂正）<\/td><\/tr><tr><td>輪郭の吸着<\/td><td>ON<\/td><td>回転した直線の縁を格子の階段にしない<\/td><\/tr><tr><td>先細り<\/td><td>1.0<\/td><td>板の側面は垂直（オーバーハング 0）<\/td><\/tr><tr><td>面を分割する<\/td><td>OFF<\/td><td>板そのものが 12.8mm 以下の要素<\/td><\/tr><tr><td>側面の色<\/td><td>上面と同じ<\/td><td>板は一色ずつ<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.62, 0.10, 0.14)<\/td><td>緋のニット。穴に覗く色が柄<\/td><\/tr><tr><td>透明しきい値<\/td><td>0.5<\/td><td>2 値のアルファ<\/td><\/tr><tr><td>解像度<\/td><td>プレビュー 512 / 最終 1024<\/td><td>最終で撮る（輪郭の刻みがプレビューの格子 0.47mm で 1 マス）<\/td><\/tr><\/table>\n<h3>元画像（<code>tools/make_art_61.py<\/code>）<\/h3>\n<p><code>source.png<\/code>（RGBA、240×180mm・8px/mm、62KB）。板 312 枚、刷る面積 57.0%。穴の割合は x を 6 帯に切って 23 → 37 → 40 → 48 → 54 → 55%。 紙面の縁で切れた破片のうち短辺 1.0mm 未満は落とす（1 列目は a/2 から 始める——x=0 に置くと半分が外に出る）。<\/p>\n<h3>数字<\/h3>\n<table><tr><th>項目<\/th><th>値<\/th><th>制約<\/th><\/tr><tr><td>指定 / 実際の造形範囲<\/td><td>240×180 → <strong>239.8 × 180.0 × 1.50mm<\/strong><\/td><td>460×360 の内 ✓<\/td><\/tr><tr><td>要素<\/td><td>塊 <strong>312 個<\/strong>、最大幅（36 方向の投影の最大）<strong>12.80mm<\/strong>（95% 12.75）、短辺 最小 1.07<\/td><td>≤15 ✓（道具の報告「13×12mm」は外接）／≥0.6 ✓<\/td><\/tr><tr><td>板の間<\/td><td>最短 <strong>0.75mm<\/strong>、中央値 2.70（元絵で実測）<\/td><td>≥0.6 ✓<\/td><\/tr><tr><td>高さ<\/td><td>1.50mm、底 z=0.000<\/td><td>0.4〜15 ✓<\/td><\/tr><tr><td>縦横比<\/td><td>1.5 ÷ 9.2 = <strong>0.16<\/strong><\/td><td>板。棘ではない<\/td><\/tr><tr><td>オーバーハング面<\/td><td><strong>0 面 / 0.0mm²<\/strong><\/td><td>✓（<code>_bf_eval_overhang_faces_world<\/code>、最終メッシュ）<\/td><\/tr><tr><td>頂点 / 面<\/td><td>953,836 / 953,212（最終）<\/td><td>—<\/td><\/tr><\/table>\n<p><strong>要素の大きさは外接では測れない。<\/strong> 道具の「13×12mm」は外接で、板の 実寸は 9.2mm 角・対角 13.0mm。逆に自分の最初の probe は外接の対角で 17.4mm と出して 168 個を 15mm 超に数えた——回転した要素は Feret 径 （36 方向の投影の最大）で測る。<\/p>\n<h3>自分の評価<\/h3>\n<ul><li><strong>1 枚で「伸びる前」と「伸びたあと」が読める。<\/strong> 真上（<code>preview_top.jpg<\/code>） は左端が隙間 0.8mm の市松、右へ行くほど板が回って緋の菱形が開き、 行が扇形に広がる。閉じた端（<code>preview_macro2.jpg<\/code>）は硬い鎧、開いた端 （<code>preview_macro.jpg<\/code>）は緋の上に浮く板。<strong>同じ板が並び方だけで別の 素材に見える<\/strong>のがこの作例の顔。<\/li><li><strong>伸びるかどうかは、この絵では確かめられない。<\/strong> 刷っていない。板が 回るには生地が蝶番として捩れる必要があり、先例は伸びるジャージーに 刷ったときにポアソン比 −0.9 を出している。織物に刷れば回らず、ただの 市松の板。<strong>伸びるニットに刷ること<\/strong>がこの作例の条件で、それは絵の 外にある。<\/li><li><strong>穴の開き方は幾何が決めるので、絵のとおりになる。<\/strong> 蝶番が生地でも、 板が回れば角の間隔は L(θ) に従う。だから開いた端の見え方は「予想」では なく「θ=35° のときの実寸」。<\/li><li><strong>板の側面に階段が残る。<\/strong> 最終解像度 1024（0.23mm）でも、回転した 直線の縁の側面には細かい縦の筋が見える（<code>preview_macro.jpg<\/code>）。<strong>上面の 縁は角のまま<\/strong>——ここには当初「丸みで消えている」と書いていたが、 ［角の丸み］は切だった。この角度・この高さ（1.5mm）では上面の縁の ハイライトが細いので角が目立たないだけで、面取りは 1 か所も掛かって いない（2026-09-06 に訂正）。<\/li><li><strong>色は 2 つの灰で足りた。<\/strong> 回る向き（+θ / −θ）が市松で読めるだけで、 ねじれの機構が絵に出る。3 色目は要らない。緋は穴の色で、板の色では ない——<strong>穴が柄<\/strong>という主張のとおり。<\/li><li><strong>θ の勾配が直線的なので、中間がやや単調。<\/strong> 開き始め（10〜20°）は 隙間が細い十字に見えるだけで、菱形になるのは 25° から。勾配を 「閉じたまま 4 割、そこから急に開く」の曲線にすれば、閉じた鎧が裾で ほどける絵になる。次に作るならそこ。<\/li><\/ul>\n<h3>服として<\/h3>\n<p><strong>フレアの巻きスカート、または袖。<\/strong> 腰では板が詰まって硬く、裾へ向かって 開いて緋が覗く。伸びるニットに刷れば、座る・歩くで腰の板も回り、動きの 量が穴の開き方として見える——<strong>伸びを可視化する反物<\/strong>。展示なら、同じ 反物を 2 枚吊るし、片方だけ下端に重りを付けて引く。板 9.2mm・厚み 1.5mm は肌側に当てても角が丸いので痛くない。角の間の生地 1.1mm が蝶番になる ので、そこに縫い目を通さない。<\/p>\n<h3>作り方<\/h3>\n<p>python docs/samples/tools/make_art_61.py     # source.png（scipy が要る） BF_ADDON_PATH=&lt;複製&gt; blender --background --factory-startup --python docs/samples/tools/make_sample.py -- docs/samples/61_伸びる反物_回る正方形 --final ... --python docs/samples/tools/render_top.py -- docs/samples/61_伸びる反物_回る正方形 ... --python docs/samples/tools/render_view.py -- docs/samples/61_伸びる反物_回る正方形 --azim 300 --elev 22 --name preview_low ... --python docs/samples/tools/render_macro.py -- docs/samples/61_伸びる反物_回る正方形 --at 0.86,0.5 --span 60 --elev 30 ... --python docs/samples/tools/render_macro.py -- docs/samples/61_伸びる反物_回る正方形 --at 0.10,0.5 --span 60 --elev 30 --name preview_macro2<\/p>\n<p>撮ったあと 5 枚を 1000〜1100px・JPEG 品質 78 に縮めてフォルダは 455KB。<\/p>\n<p>作った版: アドオン 7.174.0（<code>_samples_wt<\/code>）。<\/p>","imgs":[{"c":"斜め","d":"img/61_preview.jpg"},{"c":"真上","d":"img/61_preview_top.jpg"},{"c":"低い角度から","d":"img/61_preview_low.jpg"},{"c":"拡大","d":"img/61_preview_macro.jpg"},{"c":"拡大（もう一方の端）","d":"img/61_preview_macro2.jpg"}]},{"num":"62","title":"その夜の空 — 星図の反物","mode":"BRISTLE","path":"docs/samples/62_その夜の空_星図の反物","text":"<p class=\"lead\"><strong>2026年9月5日 21時、東京・新宿の真上の空を、そのまま柱で刷る。<\/strong> 星は\n実カタログの座標を天頂の周りに投影した位置に立ち、明るい星ほど高く太い。\n星座線は柱の点線。柄は絵ではなく<strong>データ<\/strong>で、日付と場所を変えれば別の\n反物になる（リサーチの引き出し #17）。<\/p><p><strong>2026年9月5日 21時、東京・新宿の真上の空を、そのまま柱で刷る。<\/strong> 星は 実カタログの座標を天頂の周りに投影した位置に立ち、明るい星ほど高く太い。 星座線は柱の点線。柄は絵ではなく<strong>データ<\/strong>で、日付と場所を変えれば別の 反物になる（リサーチの引き出し #17）。<\/p>\n<p>先例は「星座をプリントした服」なら無数にある——しかし刷られているのは 決まって<strong>絵としての星座<\/strong>（同じ北天図の使い回し）で、「いつ・どこの空」 かは持たない。ここでは HIPPARCOS の恒星カタログ（6 等まで 5,044 星、 d3-celestial 版）と Stellarium の現代星座線（88 星座）を読み、地方恒星時 から高度・方位を計算して<strong>その夜その場所で実際に見えた星だけ<\/strong>を置く。 誕生日の夜空・ショーの初日の夜空・二人が出会った夜空——反物の上に 言い当てられる意味を持たせるのは、位置が本物であること。<\/p>\n<h3>仕組み<\/h3>\n<p>天頂を中心にしたステレオ投影（高度 15° を円の縁に）。北が上、<strong>東が左<\/strong> ——見上げた空を紙に写すと東西が入れ替わる、星図の約束どおり。円の外の 四方に N/E/S/W の刻みを 1 セルずつ置いた。<\/p>\n<p>柱モード・171×171・間隔 2.0mm（340mm 角）。星の明るさ B を 0.12 + 0.88·((6.2−等級)/7.7)^1.6 で決め、<strong>高さ<\/strong>（最大 5mm × B）と <strong>太さ<\/strong>（半径 0.68 × (0.5 + 0.5·B)）の両方に効かせる。ベガ（0.03 等）で 3.7mm、6 等星で 0.6mm。星座線と地平の環は B=0.10（0.5mm）——星より低く 細く、指には「星と星をつなぐ薄い点線」として触れる。色は B−V 色指数から ——赤い星（アンタレス、アルデバランの類）は琥珀、青白い星（ベガ、デネブ） は白青。輝度は揃えてあるので、色が高さを乱さない。<\/p>\n<p>同じセルに星が 2 つ落ちたら明るいほうを採る（120 星がこれで消えた。 6 等級の暗い星で、絵には出ない）。星のセルには線を描かない。<\/p>\n<h3>何を使ったか<\/h3>\n<table><tr><th>機能<\/th><th>値<\/th><th>なぜ<\/th><\/tr><tr><td>モード<\/td><td>柱<\/td><td>星は点。1 星＝1 柱で、数と位置がそのままデータ<\/td><\/tr><tr><td>列数 / 行数（固定）<\/td><td>171 / 171<\/td><td>元絵の 1 セル＝1 柱（<code>pin_grid<\/code>）。間隔 2.0mm<\/td><\/tr><tr><td>幅 / 奥行き<\/td><td>340 / 340mm<\/td><td>天頂の円 直径 328mm＋刻み<\/td><\/tr><tr><td>明暗による高さ変化 / 最大高さ<\/td><td>ON（明るいほど高い）/ 5.0mm<\/td><td>等級を高さに<\/td><\/tr><tr><td>明暗による半径変化 / 最小半径比率<\/td><td>ON / 0.5<\/td><td>等級を太さにも。6 等星は 0.68mm、1 等星は 1.3mm<\/td><\/tr><tr><td>要素の半径<\/td><td>0.68mm<\/td><td>最大 1.36mm。間隔 2.0 でも すき間 0.64<\/td><\/tr><tr><td>上面の丸み / 頂点数<\/td><td>0.8 / 16<\/td><td>星は丸い粒。横から見て捕まえられる形<\/td><\/tr><tr><td>高さを揃える<\/td><td>OFF<\/td><td>高さは等級<\/td><\/tr><tr><td>生地<\/td><td>織り、カスタム色 (0.03, 0.04,
